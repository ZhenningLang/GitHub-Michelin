name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structural-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural lint (the gate — schema conformance, routing, dead links)
        run: python3 tools/lint.py
      - name: Reverse index + unindexed backlog freshness (reports are committed SSOT)
        run: python3 tools/reverse_index.py --check

  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deterministic quality gate (gated triage categories, whole repo)
        run: python3 tools/quality_scan.py --fail-on-gated

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint (formatting only, non-blocking)
        continue-on-error: true
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"
