<svg xmlns="http://www.w3.org/2000/svg" width="880" height="503" viewBox="0 0 880 503" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="503" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="367" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="367" rx="10"/>
<rect class="pillT" x="474" y="40" width="151.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">llama.cpp 做的</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="hand" d="M408,206.5 C439.0,206.5 439.0,230 470,230" marker-end="url(#a)"/>
<path class="hand" d="M472,242.0 C441.0,242.0 441.0,293 410,293" marker-end="url(#a)"/>
<path class="hand" d="M408,305.5 C439.0,305.5 439.0,329 470,329" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">拿到二进制：安装器、release、Docker，或从</text>
<text class="t" x="82" y="123">源码编译</text>
<rect class="card" x="40" y="170" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">直接跑 Hugging Face 上的 GGUF 模型</text>
<text class="c" x="82" y="223">llama cli -hf ggml-org/Qwen3.5-0.8B-GGUF</text>
<rect class="cardT" x="472" y="206" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="206" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="230" r="10"/>
<text class="num" x="494" y="234" text-anchor="middle">3</text>
<text class="t" x="514" y="235">下载 GGUF，按你指定的量化和对话模板，在你</text>
<text class="t" x="514" y="257">选的后端上跑起来</text>
<rect class="card" x="40" y="269" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="269" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="293" r="10"/>
<text class="num" x="62" y="297" text-anchor="middle">4</text>
<text class="t" x="82" y="298">要给自己的程序用，就起服务而不是命令行</text>
<text class="c" x="82" y="322">llama serve -hf &lt;hf-repo&gt;</text>
<rect class="cardT" x="472" y="305" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="305" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="329" r="10"/>
<text class="num" x="494" y="333" text-anchor="middle">5</text>
<text class="t" x="514" y="334">暴露 OpenAI 兼容接口；也可链接 libllama </text>
<text class="t" x="514" y="356">进你的进程</text>
<rect class="val" x="28" y="409" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="433">价值</text>
<text class="valT" x="48" y="457">推理始终是你自己掌控的实现细节：同一条代码路径，从 RTX 机器到 Mac 再到纯 CPU 笔记本</text>
</svg>
