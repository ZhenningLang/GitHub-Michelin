<svg xmlns="http://www.w3.org/2000/svg" width="880" height="670" viewBox="0 0 880 670" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="670" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="512" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="512" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">i-have-adhd does</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,207.5 C439.0,207.5 439.0,231 470,231" marker-end="url(#a)"/>
<path class="hand" d="M472,255.5 C441.0,255.5 441.0,294 410,294" marker-end="url(#a)"/>
<path class="hand" d="M408,295.0 C439.0,295.0 439.0,354 470,354" marker-end="url(#a)"/>
<path class="hand" d="M472,377.0 C441.0,377.0 441.0,401 410,401" marker-end="url(#a)"/>
<path class="hand" d="M408,424.5 C439.0,424.5 439.0,474 470,474" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it into your agent</text>
<text class="c" x="82" y="125">npx skills add ayghri/i-have-adhd</text>
<rect class="card" x="40" y="171" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">Turn it on for this session</text>
<text class="c" x="82" y="224">/i-have-adhd</text>
<rect class="cardT" x="472" y="207" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="207" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="231" r="10"/>
<text class="num" x="494" y="235" text-anchor="middle">3</text>
<text class="t" x="514" y="236">Loads the ten rules and keeps applying</text>
<text class="t" x="514" y="258">them for the rest of the session</text>
<text class="comp" x="514" y="286">component: SKILL.md</text>
<rect class="card" x="40" y="270" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="270" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="294" r="10"/>
<text class="num" x="62" y="298" text-anchor="middle">4</text>
<text class="t" x="82" y="299">Ask for what you want, as usual</text>
<rect class="cardT" x="472" y="330" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="330" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="354" r="10"/>
<text class="num" x="494" y="358" text-anchor="middle">5</text>
<text class="t" x="514" y="359">Answers action-first: numbered steps,</text>
<text class="t" x="514" y="381">progress restated, no preamble or</text>
<text class="t" x="514" y="403">closer</text>
<rect class="card" x="40" y="377" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="377" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="401" r="10"/>
<text class="num" x="62" y="405" text-anchor="middle">6</text>
<text class="t" x="82" y="406">Say stop when you want your normal</text>
<text class="t" x="82" y="428">style back</text>
<text class="c" x="82" y="452">stop adhd mode</text>
<rect class="cardT" x="472" y="450" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="450" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="474" r="10"/>
<text class="num" x="494" y="478" text-anchor="middle">7</text>
<text class="t" x="514" y="479">Confirms in one line and reverts for</text>
<text class="t" x="514" y="501">the session</text>
<rect class="val" x="28" y="554" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="578">VALUE</text>
<text class="valT" x="48" y="602">The answer is in the first line, and you stop re-reading replies to find the one thing you</text>
<text class="valT" x="48" y="624">can act on</text>
</svg>
