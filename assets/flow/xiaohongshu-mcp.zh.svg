<svg xmlns="http://www.w3.org/2000/svg" width="880" height="719" viewBox="0 0 880 719" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="719" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="583" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="583" rx="10"/>
<rect class="pillT" x="474" y="40" width="206.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">xiaohongshu-mcp 做的</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="hand" d="M472,180.5 C441.0,180.5 441.0,242 410,242" marker-end="url(#a)"/>
<path class="hand" d="M408,267.0 C439.0,267.0 439.0,291 470,291" marker-end="url(#a)"/>
<path class="hand" d="M472,315.5 C441.0,315.5 441.0,366 410,366" marker-end="url(#a)"/>
<path class="edge" d="M62,434 L62,458" marker-end="url(#a)"/>
<path class="hand" d="M408,496.0 C439.0,496.0 439.0,520 470,520" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">下载发布版二进制，跑登录工具，用小红书 </text>
<text class="t" x="82" y="123">App扫码</text>
<text class="c" x="82" y="147">./xiaohongshu-login-darwin-arm64</text>
<text class="comp" x="82" y="170">组件：登录工具</text>
<rect class="cardT" x="472" y="132" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">首次下载内置指纹浏览器并校验，把登录态存进</text>
<text class="t" x="514" y="183">cookies.json</text>
<text class="comp" x="514" y="211">组件：内置浏览器</text>
<rect class="card" x="40" y="218" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">3</text>
<text class="t" x="82" y="247">启动服务二进制（默认无头模式）</text>
<text class="c" x="82" y="271">./xiaohongshu-mcp-darwin-arm64</text>
<text class="comp" x="82" y="294">组件：MCP 服务</text>
<rect class="cardT" x="472" y="267" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="267" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="291" r="10"/>
<text class="num" x="494" y="295" text-anchor="middle">4</text>
<text class="t" x="514" y="296">在 18060 端口提供 MCP 工具和 REST 接口，</text>
<text class="t" x="514" y="318">复用已存登录态</text>
<text class="comp" x="514" y="346">组件：MCP 服务</text>
<rect class="card" x="40" y="342" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="342" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="366" r="10"/>
<text class="num" x="62" y="370" text-anchor="middle">5</text>
<text class="t" x="82" y="371">把服务地址登记到你的 MCP 客户端</text>
<text class="c" x="82" y="395">claude mcp add --transport http</text>
<text class="c" x="82" y="414">xiaohongshu-mcp http://localhost:18060/mcp</text>
<rect class="card" x="40" y="460" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="460" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="484" r="10"/>
<text class="num" x="62" y="488" text-anchor="middle">6</text>
<text class="t" x="82" y="489">用大白话下指令：配这几张本地图写一篇春天的</text>
<text class="t" x="82" y="511">帖子并发布</text>
<rect class="cardT" x="472" y="496" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="496" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="520" r="10"/>
<text class="num" x="494" y="524" text-anchor="middle">7</text>
<text class="t" x="514" y="525">在无头浏览器里拟人化点击、输入，填好创作页</text>
<text class="t" x="514" y="547">并发布</text>
<text class="comp" x="514" y="575">组件：无头浏览器</text>
<rect class="val" x="28" y="625" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="649">价值</text>
<text class="valT" x="48" y="673">不用再把 Agent 写好的文案和图片手动搬进创作页；搜索、笔记详情和评论也直接以数据形式回到 Agent 手里</text>
</svg>
