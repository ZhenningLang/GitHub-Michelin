<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="700" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="564" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="564" rx="10"/>
<rect class="pillT" x="474" y="40" width="151.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenHuman 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,196.0 C439.0,196.0 439.0,231 470,231" marker-end="url(#a)"/>
<path class="edge" d="M494,279 L494,303" marker-end="url(#a)"/>
<path class="hand" d="M472,352.5 C441.0,352.5 441.0,376 410,376" marker-end="url(#a)"/>
<path class="hand" d="M408,377.0 C439.0,377.0 439.0,450 470,450" marker-end="url(#a)"/>
<path class="edge" d="M494,498 L494,522" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用系统的包管理器装上桌面应用</text>
<text class="c" x="82" y="125">brew install --cask openhuman</text>
<rect class="card" x="40" y="171" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">把你希望它了解上下文的数据源接进去</text>
<rect class="cardT" x="472" y="207" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="207" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="231" r="10"/>
<text class="num" x="494" y="235" text-anchor="middle">3</text>
<text class="t" x="514" y="236">一个调度器每二十分钟走一遍，逐个同步</text>
<text class="t" x="514" y="258">你接的连接</text>
<rect class="cardT" x="472" y="305" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="305" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="329" r="10"/>
<text class="num" x="494" y="333" text-anchor="middle">4</text>
<text class="t" x="514" y="334">把新增内容压成 Markdown 记忆树并镜像成</text>
<text class="t" x="514" y="356">Obsidian 库</text>
<text class="c" x="514" y="380">SQLite</text>
<rect class="card" x="40" y="352" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">5</text>
<text class="t" x="82" y="381">问你自己的工作上的事</text>
<rect class="cardT" x="472" y="426" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="426" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="450" r="10"/>
<text class="num" x="494" y="454" text-anchor="middle">6</text>
<text class="t" x="514" y="455">用已经建好的记忆作答，并把自动化提议成你能</text>
<text class="t" x="514" y="477">在画布上审的工作流</text>
<rect class="cardT" x="472" y="524" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="524" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="548" r="10"/>
<text class="num" x="494" y="552" text-anchor="middle">7</text>
<text class="t" x="514" y="553">在审批闸门后按计划触发运行，重启后接着跑</text>
<rect class="val" x="28" y="606" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="630">价值</text>
<text class="valT" x="48" y="654">助手第一天就带着你的邮件、仓库、文档与聊天上下文开工，不用花几周从冷启动教它</text>
</svg>
