<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1182" viewBox="0 0 880 1182" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1182" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="1046" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="1046" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">the skill does</text>
<path class="edge" d="M62,205 L62,229" marker-end="url(#a)"/>
<path class="edge" d="M62,342 L62,366" marker-end="url(#a)"/>
<path class="hand" d="M408,404.5 C439.0,404.5 439.0,428 470,428" marker-end="url(#a)"/>
<path class="edge" d="M494,523 L494,547" marker-end="url(#a)"/>
<path class="edge" d="M494,668 L494,692" marker-end="url(#a)"/>
<path class="edge" d="M494,813 L494,837" marker-end="url(#a)"/>
<path class="hand" d="M472,898.5 C441.0,898.5 441.0,922 410,922" marker-end="url(#a)"/>
<path class="hand" d="M408,934.0 C439.0,934.0 439.0,1008 470,1008" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add the plugin marketplace in Claude</text>
<text class="t" x="82" y="123">Code</text>
<text class="c" x="82" y="147">/plugin marketplace add</text>
<text class="c" x="82" y="166">SimoneAvogadro/android-reverse-engineering</text>
<text class="c" x="82" y="185">-skill</text>
<rect class="card" x="40" y="231" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="255" r="10"/>
<text class="num" x="62" y="259" text-anchor="middle">2</text>
<text class="t" x="82" y="260">Install the plugin</text>
<text class="c" x="82" y="284">/plugin install</text>
<text class="c" x="82" y="303">android-reverse-engineering@android-revers</text>
<text class="c" x="82" y="322">e-engineering-skill</text>
<rect class="card" x="40" y="368" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="368" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="392" r="10"/>
<text class="num" x="62" y="396" text-anchor="middle">3</text>
<text class="t" x="82" y="397">Point it at the target file</text>
<text class="c" x="82" y="421">/decompile path/to/app.apk</text>
<rect class="cardT" x="472" y="404" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="404" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="428" r="10"/>
<text class="num" x="494" y="432" text-anchor="middle">4</text>
<text class="t" x="514" y="433">Fingerprints the app first —</text>
<text class="t" x="514" y="455">framework, HTTP stack, obfuscation —</text>
<text class="t" x="514" y="477">and stops if it isn&#x27;t Java/Kotlin</text>
<text class="comp" x="514" y="505">component: fingerprint.sh</text>
<rect class="cardT" x="472" y="549" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="549" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="573" r="10"/>
<text class="num" x="494" y="577" text-anchor="middle">5</text>
<text class="t" x="514" y="578">Decompiles with jadx, optionally</text>
<text class="t" x="514" y="600">Fernflower, or both side by side to</text>
<text class="t" x="514" y="622">compare</text>
<text class="comp" x="514" y="650">component: decompile.sh</text>
<rect class="cardT" x="472" y="694" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="694" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="718" r="10"/>
<text class="num" x="494" y="722" text-anchor="middle">6</text>
<text class="t" x="514" y="723">Rebuilds real Kotlin class names from</text>
<text class="t" x="514" y="745">metadata R8 cannot strip (a.b.c →</text>
<text class="t" x="514" y="767">LoginRepository)</text>
<text class="comp" x="514" y="795">component: recover-kotlin-names.sh</text>
<rect class="cardT" x="472" y="839" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="839" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="863" r="10"/>
<text class="num" x="494" y="867" text-anchor="middle">7</text>
<text class="t" x="514" y="868">Sweeps the sources for endpoints, URLs</text>
<text class="t" x="514" y="890">and auth headers across</text>
<text class="t" x="514" y="912">Retrofit/Ktor/Apollo</text>
<text class="comp" x="514" y="940">component: find-api-calls.sh</text>
<rect class="card" x="40" y="898" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="898" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="922" r="10"/>
<text class="num" x="62" y="926" text-anchor="middle">8</text>
<text class="t" x="82" y="927">Ask for the flow behind one screen —</text>
<text class="t" x="82" y="949">from LoginActivity to its API calls</text>
<rect class="cardT" x="472" y="984" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="984" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="1008" r="10"/>
<text class="num" x="494" y="1012" text-anchor="middle">9</text>
<text class="t" x="514" y="1013">Delivers the architecture summary and</text>
<text class="t" x="514" y="1035">a two-tier endpoint document</text>
<rect class="val" x="28" y="1088" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="1112">VALUE</text>
<text class="valT" x="48" y="1136">The app&#x27;s full API surface documented — hosts, paths, auth — without its source code</text>
</svg>
