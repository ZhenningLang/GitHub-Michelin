<svg xmlns="http://www.w3.org/2000/svg" width="880" height="702" viewBox="0 0 880 702" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="702" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="566" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="566" rx="10"/>
<rect class="pillT" x="474" y="40" width="178.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">markdownlint 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,263 L62,287" marker-end="url(#a)"/>
<path class="hand" d="M408,325.5 C439.0,325.5 439.0,349 470,349" marker-end="url(#a)"/>
<path class="edge" d="M494,422 L494,446" marker-end="url(#a)"/>
<path class="hand" d="M472,484.0 C441.0,484.0 441.0,508 410,508" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把库装成开发依赖</text>
<text class="c" x="82" y="125">npm install markdownlint --save-dev</text>
<rect class="card" x="40" y="171" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">关掉或调整和团队风格不合的规则</text>
<text class="c" x="82" y="224">{ &quot;hr-style&quot;: { &quot;style&quot;: &quot;---&quot; },</text>
<text class="c" x="82" y="243">&quot;no-trailing-spaces&quot;: false }</text>
<rect class="card" x="40" y="289" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="289" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="313" r="10"/>
<text class="num" x="62" y="317" text-anchor="middle">3</text>
<text class="t" x="82" y="318">对文件或字符串跑检查</text>
<text class="c" x="82" y="342">const results = lintSync(options)</text>
<rect class="cardT" x="472" y="325" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="325" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="349" r="10"/>
<text class="num" x="494" y="353" text-anchor="middle">4</text>
<text class="t" x="514" y="354">用 micromark 解析每个文件，逐条跑启</text>
<text class="t" x="514" y="376">用的规则</text>
<text class="comp" x="514" y="404">组件：规则引擎</text>
<rect class="cardT" x="472" y="448" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="448" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="472" r="10"/>
<text class="num" x="494" y="476" text-anchor="middle">5</text>
<text class="t" x="514" y="477">按文件返回违规：行号、规则名、细节，可修的</text>
<text class="t" x="514" y="499">附 fixInfo</text>
<rect class="card" x="40" y="484" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="484" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="508" r="10"/>
<text class="num" x="62" y="512" text-anchor="middle">6</text>
<text class="t" x="82" y="513">把修复应用到原文上</text>
<text class="c" x="82" y="537">const fixed = applyFixes(original,</text>
<text class="c" x="82" y="556">results.content)</text>
<rect class="val" x="28" y="608" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="632">价值</text>
<text class="valT" x="48" y="656">格式挑刺不再进入代码评审：同一套约 50 条规则在 CI、提交钩子和编辑器里一致地跑，机械性问题自动修好</text>
</svg>
