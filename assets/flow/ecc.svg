<svg xmlns="http://www.w3.org/2000/svg" width="880" height="995" viewBox="0 0 880 995" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="995" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="837" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="837" rx="10"/>
<rect class="pillT" x="474" y="40" width="101.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">ECC does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,258.0 C439.0,258.0 439.0,282 470,282" marker-end="url(#a)"/>
<path class="hand" d="M472,306.5 C441.0,306.5 441.0,354 410,354" marker-end="url(#a)"/>
<path class="hand" d="M408,377.5 C439.0,377.5 439.0,405 470,405" marker-end="url(#a)"/>
<path class="hand" d="M472,429.5 C441.0,429.5 441.0,475 410,475" marker-end="url(#a)"/>
<path class="hand" d="M408,498.5 C439.0,498.5 439.0,528 470,528" marker-end="url(#a)"/>
<path class="edge" d="M494,601 L494,625" marker-end="url(#a)"/>
<path class="edge" d="M494,724 L494,748" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install once through a single path —</text>
<text class="t" x="82" y="123">do not stack methods</text>
<text class="c" x="82" y="147">/plugin install ecc@ecc · npx</text>
<text class="c" x="82" y="166">ecc-universal@2.2.2 setup</text>
<rect class="card" x="40" y="212" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Plan the task first</text>
<text class="c" x="82" y="265">/ecc:plan &quot;Add user authentication with</text>
<text class="c" x="82" y="284">OAuth&quot;</text>
<rect class="cardT" x="472" y="258" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="258" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="282" r="10"/>
<text class="num" x="494" y="286" text-anchor="middle">3</text>
<text class="t" x="514" y="287">Planner agent produces the</text>
<text class="t" x="514" y="309">implementation blueprint</text>
<text class="comp" x="514" y="337">component: planner agent</text>
<rect class="card" x="40" y="330" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="330" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="354" r="10"/>
<text class="num" x="62" y="358" text-anchor="middle">4</text>
<text class="t" x="82" y="359">Implement tests-first with the TDD</text>
<text class="t" x="82" y="381">workflow skill</text>
<text class="c" x="82" y="405">tdd-workflow</text>
<rect class="cardT" x="472" y="381" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="381" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="405" r="10"/>
<text class="num" x="494" y="409" text-anchor="middle">5</text>
<text class="t" x="514" y="410">tdd-guide enforces write-tests-first;</text>
<text class="t" x="514" y="432">bugs start as a failing repro test</text>
<text class="comp" x="514" y="460">component: tdd-guide agent</text>
<rect class="card" x="40" y="451" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="451" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="475" r="10"/>
<text class="num" x="62" y="479" text-anchor="middle">6</text>
<text class="t" x="82" y="480">Ask for a review when the change is</text>
<text class="t" x="82" y="502">done</text>
<text class="c" x="82" y="526">/code-review</text>
<rect class="cardT" x="472" y="504" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="504" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="528" r="10"/>
<text class="num" x="494" y="532" text-anchor="middle">7</text>
<text class="t" x="514" y="533">code-reviewer checks the work from</text>
<text class="t" x="514" y="555">fresh context</text>
<text class="comp" x="514" y="583">component: code-reviewer agent</text>
<rect class="cardT" x="472" y="627" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="627" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="651" r="10"/>
<text class="num" x="494" y="655" text-anchor="middle">8</text>
<text class="t" x="514" y="656">Session hooks distill summaries and</text>
<text class="t" x="514" y="678">extract confidence-scored instincts</text>
<text class="comp" x="514" y="706">component: hooks &amp; memory runtime</text>
<rect class="cardT" x="472" y="750" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="750" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="774" r="10"/>
<text class="num" x="494" y="778" text-anchor="middle">9</text>
<text class="t" x="514" y="779">Next session start re-injects those</text>
<text class="t" x="514" y="801">instincts into context</text>
<text class="comp" x="514" y="829">component: SessionStart hook</text>
<rect class="val" x="28" y="879" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="903">VALUE</text>
<text class="valT" x="48" y="927">The engineering process ships installed, not re-prompted — the agent plans, tests, reviews</text>
<text class="valT" x="48" y="949">and remembers on its own</text>
</svg>
