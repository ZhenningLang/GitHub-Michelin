<svg xmlns="http://www.w3.org/2000/svg" width="880" height="816" viewBox="0 0 880 816" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="816" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="680" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="680" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">remark 做的</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="edge" d="M62,332 L62,356" marker-end="url(#a)"/>
<path class="hand" d="M408,394.5 C439.0,394.5 439.0,418 470,418" marker-end="url(#a)"/>
<path class="edge" d="M494,469 L494,493" marker-end="url(#a)"/>
<path class="edge" d="M494,567 L494,591" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把命令行和想要的 lint、格式化插件装</text>
<text class="t" x="82" y="123">成开发依赖</text>
<text class="c" x="82" y="147">npm install --save-dev remark-cli</text>
<text class="c" x="82" y="166">remark-preset-lint-recommended remark-toc</text>
<text class="comp" x="82" y="189">组件：remark-cli</text>
<rect class="card" x="40" y="237" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">在 package.json 里列出插件、顺序和</text>
<text class="t" x="82" y="288">输出设置</text>
<text class="c" x="82" y="312">&quot;remarkConfig&quot;: {&quot;plugins&quot;: [...]}</text>
<rect class="card" x="40" y="358" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="358" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="382" r="10"/>
<text class="num" x="62" y="386" text-anchor="middle">3</text>
<text class="t" x="82" y="387">对整个项目跑 remark，允许它改写文件</text>
<text class="c" x="82" y="411">remark . --output</text>
<rect class="cardT" x="472" y="394" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="394" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="418" r="10"/>
<text class="num" x="494" y="422" text-anchor="middle">4</text>
<text class="t" x="514" y="423">把每个 Markdown 文件解析成 mdast 语法树</text>
<text class="comp" x="514" y="451">组件：remark-parse（micromark）</text>
<rect class="cardT" x="472" y="495" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="495" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="519" r="10"/>
<text class="num" x="494" y="523" text-anchor="middle">5</text>
<text class="t" x="514" y="524">按顺序跑插件：lint 规则报警告，remark-toc</text>
<text class="t" x="514" y="546">之类的变换改树</text>
<rect class="cardT" x="472" y="593" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="593" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="617" r="10"/>
<text class="num" x="494" y="621" text-anchor="middle">6</text>
<text class="t" x="514" y="622">把树序列化回 Markdown 写进文件，并按行列号</text>
<text class="t" x="514" y="644">打印警告</text>
<text class="comp" x="514" y="672">组件：remark-stringify</text>
<rect class="val" x="28" y="722" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="746">价值</text>
<text class="valT" x="48" y="770">所有 Markdown 文件统一风格、生成的部分自动更新，不用手改</text>
</svg>
