<svg xmlns="http://www.w3.org/2000/svg" width="880" height="623" viewBox="0 0 880 623" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="623" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="487" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="487" rx="10"/>
<rect class="pillT" x="474" y="40" width="230.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">codex-chatgpt-web does</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="hand" d="M472,180.5 C441.0,180.5 441.0,242 410,242" marker-end="url(#a)"/>
<path class="hand" d="M408,254.0 C439.0,254.0 439.0,279 470,279" marker-end="url(#a)"/>
<path class="hand" d="M472,303.5 C441.0,303.5 441.0,340 410,340" marker-end="url(#a)"/>
<path class="hand" d="M408,352.0 C439.0,352.0 439.0,402 470,402" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the desktop launcher with the</text>
<text class="t" x="82" y="123">platform script</text>
<text class="c" x="82" y="147">install-launcher.sh · install-launcher.ps1</text>
<text class="comp" x="82" y="170">component: installer script</text>
<rect class="cardT" x="472" y="132" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">Verifies checksums and sets up the</text>
<text class="t" x="514" y="183">bundled browser and Bun runtime</text>
<text class="comp" x="514" y="211">component: launcher</text>
<rect class="card" x="40" y="218" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">3</text>
<text class="t" x="82" y="247">Sign in to ChatGPT in the launcher&#x27;s</text>
<text class="t" x="82" y="269">embedded browser</text>
<rect class="cardT" x="472" y="255" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="255" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="279" r="10"/>
<text class="num" x="494" y="283" text-anchor="middle">4</text>
<text class="t" x="514" y="284">Keeps the session in a private profile</text>
<text class="t" x="514" y="306">and runs the browser smoke test</text>
<text class="comp" x="514" y="334">component: Electron partition</text>
<rect class="card" x="40" y="316" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="316" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="340" r="10"/>
<text class="num" x="62" y="344" text-anchor="middle">5</text>
<text class="t" x="82" y="345">Install the models, restart Codex,</text>
<text class="t" x="82" y="367">pick a ChatGPT Web row</text>
<rect class="cardT" x="472" y="378" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="378" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="402" r="10"/>
<text class="num" x="494" y="406" text-anchor="middle">6</text>
<text class="t" x="514" y="407">Serves the catalog on loopback; each</text>
<text class="t" x="514" y="429">turn streams through a ChatGPT</text>
<text class="t" x="514" y="451">Temporary Chat back into Codex</text>
<text class="comp" x="514" y="479">component: Responses daemon</text>
<rect class="val" x="28" y="529" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="553">VALUE</text>
<text class="valT" x="48" y="577">Codex tasks run on your ChatGPT web allowance — Codex quota untouched</text>
