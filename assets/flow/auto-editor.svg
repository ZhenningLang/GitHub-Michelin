<svg xmlns="http://www.w3.org/2000/svg" width="880" height="732" viewBox="0 0 880 732" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="732" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="596" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="596" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Auto-Editor does</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,218.5 C439.0,218.5 439.0,242 470,242" marker-end="url(#a)"/>
<path class="edge" d="M494,290 L494,314" marker-end="url(#a)"/>
<path class="edge" d="M494,410 L494,434" marker-end="url(#a)"/>
<path class="hand" d="M472,472.0 C441.0,472.0 441.0,496 410,496" marker-end="url(#a)"/>
<path class="hand" d="M408,519.5 C439.0,519.5 439.0,558 470,558" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Get the official binary onto your PATH</text>
<text class="c" x="82" y="125">brew install auto-editor</text>
<rect class="card" x="40" y="171" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">Point it at the recording you do not</text>
<text class="t" x="82" y="222">want to scrub through</text>
<text class="c" x="82" y="246">auto-editor path/to/your/video.mp4</text>
<rect class="cardT" x="472" y="218" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="218" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="242" r="10"/>
<text class="num" x="494" y="246" text-anchor="middle">3</text>
<text class="t" x="514" y="247">Scores every moment by loudness and</text>
<text class="t" x="514" y="269">labels it silent or active</text>
<rect class="cardT" x="472" y="316" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="316" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="340" r="10"/>
<text class="num" x="494" y="344" text-anchor="middle">4</text>
<text class="t" x="514" y="345">Cuts the silent spans, leaving a</text>
<text class="t" x="514" y="367">margin around speech so cuts feel</text>
<text class="t" x="514" y="389">natural</text>
<rect class="cardT" x="472" y="436" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="436" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="460" r="10"/>
<text class="num" x="494" y="464" text-anchor="middle">5</text>
<text class="t" x="514" y="465">Writes the edited file itself — no</text>
<text class="t" x="514" y="487">editor window, no timeline session</text>
<rect class="card" x="40" y="472" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="472" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="496" r="10"/>
<text class="num" x="62" y="500" text-anchor="middle">6</text>
<text class="t" x="82" y="501">When you still want to finish by hand,</text>
<text class="t" x="82" y="523">export the timeline instead</text>
<text class="c" x="82" y="547">auto-editor example.mp4 --export premiere</text>
<rect class="cardT" x="472" y="534" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="534" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="558" r="10"/>
<text class="num" x="494" y="562" text-anchor="middle">7</text>
<text class="t" x="514" y="563">Emits a timeline file the NLE imports</text>
<text class="t" x="514" y="585">as an editable sequence</text>
<rect class="val" x="28" y="638" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="662">VALUE</text>
<text class="valT" x="48" y="686">The boring first pass over a long recording — done before you open an editor</text>
</svg>
