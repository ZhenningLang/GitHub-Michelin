<svg xmlns="http://www.w3.org/2000/svg" width="880" height="678" viewBox="0 0 880 678" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="678" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="520" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="520" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Auto-Editor does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,240.5 C439.0,240.5 439.0,264 470,264" marker-end="url(#a)"/>
<path class="edge" d="M494,312 L494,336" marker-end="url(#a)"/>
<path class="hand" d="M472,374.0 C441.0,374.0 441.0,398 410,398" marker-end="url(#a)"/>
<path class="hand" d="M408,421.5 C439.0,421.5 439.0,460 470,460" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the CLI — Homebrew, the AUR,</text>
<text class="t" x="82" y="123">or an official binary</text>
<text class="c" x="82" y="147">brew install auto-editor</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Point it at the footage; there is no</text>
<text class="t" x="82" y="244">project file to create</text>
<text class="c" x="82" y="268">auto-editor video.mp4</text>
<rect class="cardT" x="472" y="240" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="240" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="264" r="10"/>
<text class="num" x="494" y="268" text-anchor="middle">3</text>
<text class="t" x="514" y="269">Measures loudness over time and labels</text>
<text class="t" x="514" y="291">each moment silent (0) or active (1)</text>
<rect class="cardT" x="472" y="338" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="338" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="362" r="10"/>
<text class="num" x="494" y="366" text-anchor="middle">4</text>
<text class="t" x="514" y="367">Cuts the silent stretches, keeps 0.2 s</text>
<text class="t" x="514" y="389">of margin, writes video_ALTERED.mp4</text>
<rect class="card" x="40" y="374" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="374" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="398" r="10"/>
<text class="num" x="62" y="402" text-anchor="middle">5</text>
<text class="t" x="82" y="403">When a human should finish the cut,</text>
<text class="t" x="82" y="425">export a timeline instead of a file</text>
<text class="c" x="82" y="449">auto-editor video.mp4 --export resolve</text>
<rect class="cardT" x="472" y="436" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="436" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="460" r="10"/>
<text class="num" x="494" y="464" text-anchor="middle">6</text>
<text class="t" x="514" y="465">Writes an editor project referencing</text>
<text class="t" x="514" y="487">the original media, so nothing is</text>
<text class="t" x="514" y="509">re-encoded</text>
<rect class="val" x="28" y="562" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="586">VALUE</text>
<text class="valT" x="48" y="610">A dead-air-free cut without listening through the footage — or a timeline a professional</text>
<text class="valT" x="48" y="632">editor picks up</text>
</svg>
