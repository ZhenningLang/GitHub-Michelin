<svg xmlns="http://www.w3.org/2000/svg" width="880" height="773" viewBox="0 0 880 773" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="773" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="615" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="615" rx="10"/>
<rect class="pillT" x="474" y="40" width="230.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TanStack Workflow does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,288 L62,312" marker-end="url(#a)"/>
<path class="hand" d="M408,361.5 C439.0,361.5 439.0,385 470,385" marker-end="url(#a)"/>
<path class="hand" d="M472,420.5 C441.0,420.5 441.0,459 410,459" marker-end="url(#a)"/>
<path class="hand" d="M408,503.0 C439.0,503.0 439.0,530 470,530" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the engine — add zod if you</text>
<text class="t" x="82" y="123">want runtime schema validation</text>
<text class="c" x="82" y="147">pnpm add @tanstack/workflow-core zod</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Declare a workflow: id, zod</text>
<text class="t" x="82" y="244">input/output, a plain async handler</text>
<text class="c" x="82" y="268">createWorkflow</text>
<rect class="card" x="40" y="314" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">3</text>
<text class="t" x="82" y="343">Put side effects in ctx.step, long</text>
<text class="t" x="82" y="365">waits in ctx.approve</text>
<text class="c" x="82" y="389">ctx.step(id, fn)</text>
<rect class="cardT" x="472" y="361" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="361" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="385" r="10"/>
<text class="num" x="494" y="389" text-anchor="middle">4</text>
<text class="t" x="514" y="390">Runs the handler, appends every</text>
<text class="t" x="514" y="412">finished step to the append-only log;</text>
<text class="t" x="514" y="434">a pause just returns</text>
<text class="comp" x="514" y="462">component: workflow-core engine</text>
<rect class="card" x="40" y="435" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="435" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="459" r="10"/>
<text class="num" x="62" y="463" text-anchor="middle">5</text>
<text class="t" x="82" y="464">Later, resume the same run from any</text>
<text class="t" x="82" y="486">process — deliver the approval or</text>
<text class="t" x="82" y="508">webhook payload</text>
<text class="c" x="82" y="532">runWorkflow · approval: { approvalId,</text>
<text class="c" x="82" y="551">approved: true }</text>
<rect class="cardT" x="472" y="506" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="506" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="530" r="10"/>
<text class="num" x="494" y="534" text-anchor="middle">6</text>
<text class="t" x="514" y="535">Replays the log so recorded steps</text>
<text class="t" x="514" y="557">never re-execute, and the run</text>
<text class="t" x="514" y="579">continues past the pause</text>
<text class="comp" x="514" y="607">component: replay engine</text>
<rect class="val" x="28" y="657" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="681">VALUE</text>
<text class="valT" x="48" y="705">Day-long flows survive restarts — the charge runs once, waiting is a stored row, nothing</text>
<text class="valT" x="48" y="727">re-executes</text>
</svg>
