<rect class="accY" x="40" y="195" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="219" r="10"/>
<text class="num" x="62" y="223" text-anchor="middle">2</text>
<text class="t" x="82" y="224">启动打过补丁的代理和应用</text>
<text class="c" x="82" y="248">comfy-api-proxy run --max-upload-mb 500 ·</text>
<text class="c" x="82" y="267">npm start</text>
