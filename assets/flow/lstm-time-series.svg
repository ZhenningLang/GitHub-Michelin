<svg xmlns="http://www.w3.org/2000/svg" width="880" height="854" viewBox="0 0 880 854" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="854" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="696" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="696" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The script does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="edge" d="M62,310 L62,334" marker-end="url(#a)"/>
<path class="hand" d="M408,372.5 C439.0,372.5 439.0,396 470,396" marker-end="url(#a)"/>
<path class="edge" d="M494,466 L494,490" marker-end="url(#a)"/>
<path class="edge" d="M494,586 L494,610" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Set up an old Python 3.5 + TensorFlow</text>
<text class="t" x="82" y="123">1 environment with the pinned</text>
<text class="t" x="82" y="145">requirements</text>
<text class="c" x="82" y="169">tensorflow-gpu==1.10.0 · keras==2.2.2</text>
<rect class="card" x="40" y="215" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Pick the CSV, columns, window length,</text>
<text class="t" x="82" y="266">layers and epochs</text>
<text class="c" x="82" y="290">config.json</text>
<rect class="card" x="40" y="336" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="336" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="360" r="10"/>
<text class="num" x="62" y="364" text-anchor="middle">3</text>
<text class="t" x="82" y="365">Run the entry script</text>
<text class="c" x="82" y="389">run.py</text>
<rect class="cardT" x="472" y="372" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="372" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="396" r="10"/>
<text class="num" x="494" y="400" text-anchor="middle">4</text>
<text class="t" x="514" y="401">Cuts the series into fixed-length</text>
<text class="t" x="514" y="423">windows and rescales each one relative</text>
<text class="t" x="514" y="445">to its first value</text>
<rect class="cardT" x="472" y="492" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="492" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="516" r="10"/>
<text class="num" x="494" y="520" text-anchor="middle">5</text>
<text class="t" x="514" y="521">Builds the stacked LSTM described in</text>
<text class="t" x="514" y="543">the config, trains it and saves the</text>
<text class="t" x="514" y="565">model</text>
<rect class="cardT" x="472" y="612" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="612" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="636" r="10"/>
<text class="num" x="494" y="640" text-anchor="middle">6</text>
<text class="t" x="514" y="641">Predicts multi-step sequences on the</text>
<text class="t" x="514" y="663">held-out data and plots them against</text>
<text class="t" x="514" y="685">the real series</text>
<rect class="val" x="28" y="738" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="762">VALUE</text>
<text class="valT" x="48" y="786">You watch windowing, normalisation and LSTM sequence prediction work end to end, in code</text>
<text class="valT" x="48" y="808">short enough to read alongside the article</text>
</svg>
