<svg xmlns="http://www.w3.org/2000/svg" width="880" height="484" viewBox="0 0 880 484" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="484" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="348" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="348" rx="10"/>
<rect class="pillT" x="474" y="40" width="231.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">12-Factor Agents 给你的</text>
<path class="hand" d="M408,97.0 C439.0,97.0 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,144.0 C441.0,144.0 441.0,172 410,172" marker-end="url(#a)"/>
<path class="hand" d="M408,173.0 C439.0,173.0 439.0,230 470,230" marker-end="url(#a)"/>
<path class="hand" d="M472,263.0 C441.0,263.0 441.0,287 410,287" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">读完 12 条 factor（README 里一页清单）</text>
<rect class="cardT" x="472" y="108" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">给你踩的坑命名：看不见的 prompt、黑箱上下</text>
<text class="t" x="514" y="159">文、停不下来的循环</text>
<rect class="card" x="40" y="148" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="148" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="172" r="10"/>
<text class="num" x="62" y="176" text-anchor="middle">3</text>
<text class="t" x="82" y="177">逐条对照你的 agent，挑出它违反的几条</text>
<rect class="cardT" x="472" y="206" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="206" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="230" r="10"/>
<text class="num" x="494" y="234" text-anchor="middle">4</text>
<text class="t" x="514" y="235">每条附一段代码范式，比如自己写循环、按模型</text>
<text class="t" x="514" y="257">选的下一步分支</text>
<text class="c" x="514" y="281">next_step.intent ==</text>
<text class="c" x="514" y="300">&#x27;request_clarification&#x27;</text>
<rect class="card" x="40" y="263" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="263" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="287" r="10"/>
<text class="num" x="62" y="291" text-anchor="middle">5</text>
<text class="t" x="82" y="292">把范式搬进你现有的代码：自己的 prompt、循</text>
<text class="t" x="82" y="314">环和存档的对话线程</text>
<text class="c" x="82" y="338">await db.save_thread(thread)</text>
<rect class="val" x="28" y="390" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="414">价值</text>
<text class="valT" x="48" y="438">agent 的行为变成你自己的代码：看得到真实 prompt，高风险工具调用前能停下，之后再接着跑</text>
</svg>
