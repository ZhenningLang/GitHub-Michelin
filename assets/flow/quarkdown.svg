<svg xmlns="http://www.w3.org/2000/svg" width="880" height="721" viewBox="0 0 880 721" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="721" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="585" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="585" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Quarkdown does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,259.5 C439.0,259.5 439.0,283 470,283" marker-end="url(#a)"/>
<path class="hand" d="M472,306.0 C441.0,306.0 441.0,357 410,357" marker-end="url(#a)"/>
<path class="hand" d="M408,380.5 C439.0,380.5 439.0,404 470,404" marker-end="url(#a)"/>
<path class="edge" d="M494,474 L494,498" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it (script, Homebrew, Scoop or</text>
<text class="t" x="82" y="123">the platform zip)</text>
<text class="c" x="82" y="147">brew install</text>
<text class="c" x="82" y="166">quarkdown-labs/quarkdown/quarkdown</text>
<rect class="card" x="40" y="212" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Scaffold a project and declare the</text>
<text class="t" x="82" y="263">output type in the source</text>
<text class="c" x="82" y="287">quarkdown create mydoc · .doctype {paged}</text>
<rect class="cardT" x="472" y="259" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="259" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="283" r="10"/>
<text class="num" x="494" y="287" text-anchor="middle">3</text>
<text class="t" x="514" y="288">Parses the Markdown plus function</text>
<text class="t" x="514" y="310">calls and expands the standard library</text>
<text class="t" x="514" y="332">into its document model</text>
<rect class="card" x="40" y="333" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">4</text>
<text class="t" x="82" y="362">Compile the root file, adding live</text>
<text class="t" x="82" y="384">preview if you want it</text>
<text class="c" x="82" y="408">quarkdown c main.qd -p -w</text>
<rect class="cardT" x="472" y="380" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="380" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="404" r="10"/>
<text class="num" x="494" y="408" text-anchor="middle">5</text>
<text class="t" x="514" y="409">Renders that type to HTML, copying</text>
<text class="t" x="514" y="431">only the libraries it needs into the</text>
<text class="t" x="514" y="453">output&#x27;s lib directory</text>
<rect class="cardT" x="472" y="500" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="500" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="524" r="10"/>
<text class="num" x="494" y="528" text-anchor="middle">6</text>
<text class="t" x="514" y="529">With PDF output asked for, prints that</text>
<text class="t" x="514" y="551">same HTML through headless Chromium</text>
<text class="c" x="514" y="575">--pdf</text>
<rect class="val" x="28" y="627" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="651">VALUE</text>
<text class="valT" x="48" y="675">One .qd source yields a web page, a print PDF and slides — the content never forks</text>
</svg>
