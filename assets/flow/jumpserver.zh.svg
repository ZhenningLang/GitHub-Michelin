<svg xmlns="http://www.w3.org/2000/svg" width="880" height="630" viewBox="0 0 880 630" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="630" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="494" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="494" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">JumpServer 做的</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,167.5 C441.0,167.5 441.0,217 410,217" marker-end="url(#a)"/>
<path class="edge" d="M62,266 L62,290" marker-end="url(#a)"/>
<path class="hand" d="M408,317.0 C439.0,317.0 439.0,352 470,352" marker-end="url(#a)"/>
<path class="edge" d="M494,403 L494,427" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在一台干净的 4 核 8 GB Linux 上跑快</text>
<text class="t" x="82" y="123">速开始脚本</text>
<text class="c" x="82" y="147">quick_start.sh | bash</text>
<rect class="cardT" x="472" y="119" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">装好 Docker，拉起核心、连接器、PostgreSQL</text>
<text class="t" x="514" y="170">和 Redis</text>
<text class="comp" x="514" y="198">组件：安装器 jmsctl.sh</text>
<rect class="card" x="40" y="193" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">以 admin 登录，录入资产和账号，给用户授权</text>
<text class="c" x="82" y="246">http://your-jumpserver-ip/</text>
<rect class="card" x="40" y="292" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">4</text>
<text class="t" x="82" y="321">工程师从网页终端发起会话，手里不再有密码</text>
<rect class="cardT" x="472" y="328" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="328" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="352" r="10"/>
<text class="num" x="494" y="356" text-anchor="middle">5</text>
<text class="t" x="514" y="357">校验授权，代填保管的凭据，转发会话</text>
<text class="comp" x="514" y="385">组件：KoKo 连接器</text>
<rect class="cardT" x="472" y="429" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="429" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="453" r="10"/>
<text class="num" x="494" y="457" text-anchor="middle">6</text>
<text class="t" x="514" y="458">录下会话和每条命令，供回放和审计</text>
<text class="comp" x="514" y="486">组件：核心审计日志</text>
<rect class="val" x="28" y="536" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="560">价值</text>
<text class="valT" x="48" y="584">再没人手握生产密码，每个特权会话都有具名责任人和可回放记录</text>
</svg>
