<svg xmlns="http://www.w3.org/2000/svg" width="880" height="754" viewBox="0 0 880 754" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="754" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="596" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="596" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Zellij does</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,218.5 C439.0,218.5 439.0,242 470,242" marker-end="url(#a)"/>
<path class="hand" d="M472,254.0 C441.0,254.0 441.0,316 410,316" marker-end="url(#a)"/>
<path class="edge" d="M62,409 L62,433" marker-end="url(#a)"/>
<path class="hand" d="M408,460.0 C439.0,460.0 439.0,495 470,495" marker-end="url(#a)"/>
<path class="hand" d="M472,507.0 C441.0,507.0 441.0,535 410,535" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the single Rust binary</text>
<text class="c" x="82" y="125">cargo install --locked zellij</text>
<rect class="card" x="40" y="171" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">Start a session — new workspace, tabs</text>
<text class="t" x="82" y="222">and panes appear</text>
<text class="c" x="82" y="246">zellij</text>
<rect class="cardT" x="472" y="218" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="218" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="242" r="10"/>
<text class="num" x="494" y="246" text-anchor="middle">3</text>
<text class="t" x="514" y="247">Runs a server behind your terminal and</text>
<text class="t" x="514" y="269">shows a live hint bar for every key</text>
<rect class="card" x="40" y="292" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">4</text>
<text class="t" x="82" y="321">Split, tab, float and stack panes</text>
<text class="t" x="82" y="343">following the hints — no grammar to</text>
<text class="t" x="82" y="365">memorize</text>
<text class="c" x="82" y="389">Alt n</text>
<rect class="card" x="40" y="435" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="435" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="459" r="10"/>
<text class="num" x="62" y="463" text-anchor="middle">5</text>
<text class="t" x="82" y="464">Detach, or just let the SSH tab die</text>
<rect class="cardT" x="472" y="471" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="471" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="495" r="10"/>
<text class="num" x="494" y="499" text-anchor="middle">6</text>
<text class="t" x="514" y="500">Keeps the session and its processes</text>
<text class="t" x="514" y="522">running in the background</text>
<rect class="card" x="40" y="511" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="511" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="535" r="10"/>
<text class="num" x="62" y="539" text-anchor="middle">7</text>
<text class="t" x="82" y="540">Reattach from a terminal — or later</text>
<text class="t" x="82" y="562">from a browser via the web client</text>
<text class="c" x="82" y="586">zellij attach</text>
<rect class="val" x="28" y="638" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="662">VALUE</text>
<text class="valT" x="48" y="686">Multiplexing without the archaeology: the UI teaches itself, and a token-authenticated</text>
<text class="valT" x="48" y="708">browser is a second door into live sessions</text>
</svg>
