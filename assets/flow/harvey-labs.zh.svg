<svg xmlns="http://www.w3.org/2000/svg" width="880" height="692" viewBox="0 0 880 692" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="692" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="556" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="556" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Harvey LAB 做的</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="hand" d="M408,267.0 C439.0,267.0 439.0,291 470,291" marker-end="url(#a)"/>
<path class="edge" d="M494,342 L494,366" marker-end="url(#a)"/>
<path class="hand" d="M472,405.5 C441.0,405.5 441.0,429 410,429" marker-end="url(#a)"/>
<path class="hand" d="M408,463.5 C439.0,463.5 439.0,493 470,493" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">克隆仓库，跑一次安装脚本，把 API 密钥写进</text>
<text class="t" x="82" y="123">.env</text>
<text class="c" x="82" y="147">./scripts/setup.sh</text>
<text class="comp" x="82" y="170">组件：安装脚本</text>
<rect class="card" x="40" y="218" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">选一道题和一个模型，启动 agent 运行</text>
<text class="c" x="82" y="271">uv run python -m lab_core.harness.run</text>
<text class="comp" x="82" y="294">组件：执行框架命令行</text>
<rect class="cardT" x="472" y="267" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="267" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="291" r="10"/>
<text class="num" x="494" y="295" text-anchor="middle">3</text>
<text class="t" x="514" y="296">在断网的 Podman 沙箱里对案卷跑工具调用循环</text>
<text class="comp" x="514" y="324">组件：agent 循环 + 沙箱</text>
<rect class="cardT" x="472" y="368" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="368" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="392" r="10"/>
<text class="num" x="494" y="396" text-anchor="middle">4</text>
<text class="t" x="514" y="397">把交付物、对话记录和指标存进 results/</text>
<text class="comp" x="514" y="425">组件：执行框架</text>
<rect class="card" x="40" y="405" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="405" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="429" r="10"/>
<text class="num" x="62" y="433" text-anchor="middle">5</text>
<text class="t" x="82" y="434">对这个运行 ID 发起评分</text>
<text class="c" x="82" y="458">uv run python -m</text>
<text class="c" x="82" y="477">lab_core.evaluation.run_eval</text>
<text class="comp" x="82" y="500">组件：评分器命令行</text>
<rect class="cardT" x="472" y="469" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="469" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="493" r="10"/>
<text class="num" x="494" y="497" text-anchor="middle">6</text>
<text class="t" x="514" y="498">两个大模型评委逐条判通过与否，生成</text>
<text class="t" x="514" y="520">report.html</text>
<text class="comp" x="514" y="548">组件：评分评委</text>
<rect class="val" x="28" y="598" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="622">价值</text>
<text class="valT" x="48" y="646">每道法律题得到全对才算过的分数和逐条理由，不必再人工逐份核对备忘录</text>
</svg>
