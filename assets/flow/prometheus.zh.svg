<svg xmlns="http://www.w3.org/2000/svg" width="880" height="703" viewBox="0 0 880 703" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="703" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="567" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="567" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Prometheus 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,284 L62,308" marker-end="url(#a)"/>
<path class="hand" d="M408,357.5 C439.0,357.5 439.0,381 470,381" marker-end="url(#a)"/>
<path class="hand" d="M472,405.5 C441.0,405.5 441.0,455 410,455" marker-end="url(#a)"/>
<path class="hand" d="M408,477.0 C439.0,477.0 439.0,504 470,504" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">启动 Prometheus 服务，界面和 API 在 9</text>
<text class="t" x="82" y="123">090端口</text>
<text class="c" x="82" y="147">docker run --name prometheus -d -p</text>
<text class="c" x="82" y="166">127.0.0.1:9090:9090 prom/prometheus</text>
<rect class="card" x="40" y="212" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">用客户端库让服务暴露 /metrics 页面，或者跑</text>
<text class="t" x="82" y="263">一个 exporter</text>
<rect class="card" x="40" y="310" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="310" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="334" r="10"/>
<text class="num" x="62" y="338" text-anchor="middle">3</text>
<text class="t" x="82" y="339">在 prometheus.yml 里列出要抓取的目</text>
<text class="t" x="82" y="361">标和间隔</text>
<text class="c" x="82" y="385">scrape_configs</text>
<rect class="cardT" x="472" y="357" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="357" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="381" r="10"/>
<text class="num" x="494" y="385" text-anchor="middle">4</text>
<text class="t" x="514" y="386">每个间隔通过 HTTP 拉取各目标的 /metrics，</text>
<text class="t" x="514" y="408">样本存进本地时序库</text>
<text class="comp" x="514" y="436">组件：抓取器 + 本地时序库</text>
<rect class="card" x="40" y="431" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="431" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="455" r="10"/>
<text class="num" x="62" y="459" text-anchor="middle">5</text>
<text class="t" x="82" y="460">用 PromQL 写图表查询和告警规则</text>
<text class="c" x="82" y="484">rate(prometheus_tsdb_head_chunks_created_t</text>
<text class="c" x="82" y="503">otal[1m])</text>
<rect class="cardT" x="472" y="480" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="480" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="504" r="10"/>
<text class="num" x="494" y="508" text-anchor="middle">6</text>
<text class="t" x="514" y="509">持续计算规则，把触发的告警发给</text>
<text class="t" x="514" y="531">Alertmanager</text>
<text class="comp" x="514" y="559">组件：规则管理器</text>
<rect class="val" x="28" y="609" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="633">价值</text>
<text class="valT" x="48" y="657">所有服务的健康状况都变成可查询的数字，规则越线就告警——不需要外部数据库</text>
</svg>
