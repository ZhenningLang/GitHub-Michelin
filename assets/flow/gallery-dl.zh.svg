<svg xmlns="http://www.w3.org/2000/svg" width="880" height="645" viewBox="0 0 880 645" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="645" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="509" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="509" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">gallery-dl 做的</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,270.5 C439.0,270.5 439.0,294 470,294" marker-end="url(#a)"/>
<path class="edge" d="M494,345 L494,369" marker-end="url(#a)"/>
<path class="edge" d="M494,421 L494,445" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上命令行工具</text>
<text class="c" x="82" y="125">python -m pip install -U gallery-dl · brew</text>
<text class="c" x="82" y="144">install gallery-dl</text>
<text class="comp" x="82" y="167">组件：gallery-dl 命令行</text>
<rect class="card" x="40" y="215" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">把图集、主页或标签搜索的网址交给它</text>
<text class="c" x="82" y="268">gallery-dl</text>
<text class="c" x="82" y="287">&quot;https://danbooru.donmai.us/posts?tags=bon</text>
<text class="c" x="82" y="306">ocho&quot;</text>
<rect class="cardT" x="472" y="270" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="270" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="294" r="10"/>
<text class="num" x="494" y="298" text-anchor="middle">3</text>
<text class="t" x="514" y="299">按网址匹配到该站点的提取器</text>
<text class="comp" x="514" y="327">组件：站点提取器</text>
<rect class="cardT" x="472" y="371" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="371" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="395" r="10"/>
<text class="num" x="494" y="399" text-anchor="middle">4</text>
<text class="t" x="514" y="400">翻完整个图集，收集每个文件的直链和元数据</text>
<rect class="cardT" x="472" y="447" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="447" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="471" r="10"/>
<text class="num" x="494" y="475" text-anchor="middle">5</text>
<text class="t" x="514" y="476">把原图下到 ./gallery-dl/ 下，按元数据命</text>
<text class="t" x="514" y="498">名，已有的跳过</text>
<rect class="val" x="28" y="551" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="575">价值</text>
<text class="valT" x="48" y="599">一条命令把整个图集落盘，再跑只抓新增的</text>
</svg>
