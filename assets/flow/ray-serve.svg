<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1028" viewBox="0 0 880 1028" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1028" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="870" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="870" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Ray Serve does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="edge" d="M62,335 L62,359" marker-end="url(#a)"/>
<path class="edge" d="M62,456 L62,480" marker-end="url(#a)"/>
<path class="hand" d="M408,518.5 C439.0,518.5 439.0,542 470,542" marker-end="url(#a)"/>
<path class="edge" d="M494,637 L494,661" marker-end="url(#a)"/>
<path class="edge" d="M494,782 L494,806" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install Serve into the Python</text>
<text class="t" x="82" y="123">environment that reaches your Ray</text>
<text class="t" x="82" y="145">cluster</text>
<text class="c" x="82" y="169">pip install &quot;ray[serve]&quot;</text>
<rect class="card" x="40" y="215" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Wrap each model in a class and declare</text>
<text class="t" x="82" y="266">its replicas and CPU/GPU needs</text>
<text class="c" x="82" y="290">@serve.deployment</text>
<text class="comp" x="82" y="313">component: deployment</text>
<rect class="card" x="40" y="361" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="361" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="385" r="10"/>
<text class="num" x="62" y="389" text-anchor="middle">3</text>
<text class="t" x="82" y="390">Bind the models into one app, passing</text>
<text class="t" x="82" y="412">downstream models into the ingress</text>
<text class="c" x="82" y="436">.bind()</text>
<rect class="card" x="40" y="482" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="482" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="506" r="10"/>
<text class="num" x="62" y="510" text-anchor="middle">4</text>
<text class="t" x="82" y="511">Run the application on the cluster</text>
<text class="c" x="82" y="535">serve run serve_quickstart_composed:app</text>
<rect class="cardT" x="472" y="518" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="518" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="542" r="10"/>
<text class="num" x="494" y="546" text-anchor="middle">5</text>
<text class="t" x="514" y="547">Starts each deployment&#x27;s replicas as</text>
<text class="t" x="514" y="569">Ray actors on nodes with the right</text>
<text class="t" x="514" y="591">resources</text>
<text class="comp" x="514" y="619">component: Serve controller</text>
<rect class="cardT" x="472" y="663" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="663" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="687" r="10"/>
<text class="num" x="494" y="691" text-anchor="middle">6</text>
<text class="t" x="514" y="692">Takes HTTP on :8000, load-balances to</text>
<text class="t" x="514" y="714">the ingress, which calls the other</text>
<text class="t" x="514" y="736">models</text>
<text class="comp" x="514" y="764">component: HTTP proxy</text>
<rect class="cardT" x="472" y="808" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="808" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="832" r="10"/>
<text class="num" x="494" y="836" text-anchor="middle">7</text>
<text class="t" x="514" y="837">Adds or removes replicas per</text>
<text class="t" x="514" y="859">deployment as its own traffic changes</text>
<rect class="val" x="28" y="912" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="936">VALUE</text>
<text class="valT" x="48" y="960">Several models sit behind one endpoint and each scales on its own — no per-model service and</text>
<text class="valT" x="48" y="982">scaling script</text>
</svg>
