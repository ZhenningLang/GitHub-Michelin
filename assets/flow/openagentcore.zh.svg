<svg xmlns="http://www.w3.org/2000/svg" width="880" height="768" viewBox="0 0 880 768" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="768" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="632" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="632" rx="10"/>
<rect class="pillT" x="474" y="40" width="187.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenAgentCore 做的</text>
<path class="hand" d="M408,108.0 C439.0,108.0 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,156.5 C441.0,156.5 441.0,194 410,194" marker-end="url(#a)"/>
<path class="edge" d="M62,242 L62,266" marker-end="url(#a)"/>
<path class="edge" d="M62,360 L62,384" marker-end="url(#a)"/>
<path class="hand" d="M408,422.5 C439.0,422.5 439.0,446 470,446" marker-end="url(#a)"/>
<path class="edge" d="M494,519 L494,543" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在装了 Docker 的 Linux 主机上跑最新版的一</text>
<text class="t" x="82" y="123">行安装脚本</text>
<rect class="cardT" x="472" y="108" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">拉起 Core、Web、数据库和 HTTPS 网关，打印</text>
<text class="t" x="514" y="159">控制台和 API 地址</text>
<text class="comp" x="514" y="187">组件：安装器</text>
<rect class="card" x="40" y="170" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">3</text>
<text class="t" x="82" y="199">在 Web 里设域名、默认模型、项目密钥，再加</text>
<text class="t" x="82" y="221">节点或 E2B</text>
<rect class="card" x="40" y="268" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="268" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="292" r="10"/>
<text class="num" x="62" y="296" text-anchor="middle">4</text>
<text class="t" x="82" y="297">把官方 OpenAI SDK 指向你的安装</text>
<text class="c" x="82" y="321">export</text>
<text class="c" x="82" y="340">OPENAI_BASE_URL=https://core.example/v1</text>
<rect class="card" x="40" y="386" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="386" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="410" r="10"/>
<text class="num" x="62" y="414" text-anchor="middle">5</text>
<text class="t" x="82" y="415">建一个会话，写明任务和要用的 harness</text>
<text class="c" x="82" y="439">client.beta.agents.sessions.create</text>
<rect class="cardT" x="472" y="422" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="422" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="446" r="10"/>
<text class="num" x="494" y="450" text-anchor="middle">6</text>
<text class="t" x="514" y="451">要一台沙箱，启动守护进程，在工作目录里跑原</text>
<text class="t" x="514" y="473">生 harness</text>
<text class="comp" x="514" y="501">组件：守护进程与 harness 适配器</text>
<rect class="cardT" x="472" y="545" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="545" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="569" r="10"/>
<text class="num" x="494" y="573" text-anchor="middle">7</text>
<text class="t" x="514" y="574">持久化轮次、条目和事件，应用用同一套 API </text>
<text class="t" x="514" y="596">读取或流式接收</text>
<text class="comp" x="514" y="624">组件：Core 与 PostgreSQL</text>
<rect class="val" x="28" y="674" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="698">价值</text>
<text class="valT" x="48" y="722">一套 OpenAI 形状的 API 驱动三种编码 agent，不再自己搭沙箱和会话存储</text>
</svg>
