<svg xmlns="http://www.w3.org/2000/svg" width="880" height="878" viewBox="0 0 880 878" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="878" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="742" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="742" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Call.md does</text>
<path class="edge" d="M62,183 L62,207" marker-end="url(#a)"/>
<path class="hand" d="M408,245.0 C439.0,245.0 439.0,269 470,269" marker-end="url(#a)"/>
<path class="edge" d="M494,342 L494,366" marker-end="url(#a)"/>
<path class="edge" d="M494,462 L494,486" marker-end="url(#a)"/>
<path class="hand" d="M472,547.5 C441.0,547.5 441.0,571 410,571" marker-end="url(#a)"/>
<path class="hand" d="M408,583.0 C439.0,583.0 439.0,657 470,657" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the macOS app with one command</text>
<text class="c" x="82" y="125">curl -fsSL</text>
<text class="c" x="82" y="144">https://artifacts.videodb.io/call.md/insta</text>
<text class="c" x="82" y="163">ll | bash</text>
<rect class="card" x="40" y="209" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="209" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="233" r="10"/>
<text class="num" x="62" y="237" text-anchor="middle">2</text>
<text class="t" x="82" y="238">Register with your VideoDB API key,</text>
<text class="t" x="82" y="260">grant mic + screen permissions</text>
<rect class="cardT" x="472" y="245" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="245" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="269" r="10"/>
<text class="num" x="494" y="273" text-anchor="middle">3</text>
<text class="t" x="514" y="274">Bundled capture binary records your</text>
<text class="t" x="514" y="296">mic, the call audio, and the screen</text>
<text class="comp" x="514" y="324">component: VideoDBCapture binary</text>
<rect class="cardT" x="472" y="368" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="368" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="392" r="10"/>
<text class="num" x="494" y="396" text-anchor="middle">4</text>
<text class="t" x="514" y="397">Streams the dual-channel live</text>
<text class="t" x="514" y="419">transcript (you vs them) back via</text>
<text class="t" x="514" y="441">WebSocket</text>
<rect class="cardT" x="472" y="488" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="488" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="512" r="10"/>
<text class="num" x="494" y="516" text-anchor="middle">5</text>
<text class="t" x="514" y="517">When the conversation needs</text>
<text class="t" x="514" y="539">information, it calls your MCP tools</text>
<text class="t" x="514" y="561">automatically</text>
<text class="comp" x="514" y="589">component: MCP agent</text>
<rect class="card" x="40" y="547" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="547" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="571" r="10"/>
<text class="num" x="62" y="575" text-anchor="middle">6</text>
<text class="t" x="82" y="576">End the meeting — or let the 2-hour</text>
<text class="t" x="82" y="598">cap stop it for you</text>
<rect class="cardT" x="472" y="633" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="633" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="657" r="10"/>
<text class="num" x="494" y="661" text-anchor="middle">7</text>
<text class="t" x="514" y="662">Writes overview, key points and action</text>
<text class="t" x="514" y="684">items into local SQLite; exports</text>
<text class="t" x="514" y="706">Markdown</text>
<text class="comp" x="514" y="734">component: summary generator</text>
<rect class="val" x="28" y="784" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="808">VALUE</text>
<text class="valT" x="48" y="832">Transcript, live nudges, tool results and action items are waiting when the call ends</text>
</svg>
