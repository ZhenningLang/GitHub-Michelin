<svg xmlns="http://www.w3.org/2000/svg" width="880" height="675" viewBox="0 0 880 675" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="675" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="539" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="539" rx="10"/>
<rect class="pillT" x="474" y="40" width="105.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Nuxt 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,218.5 C439.0,218.5 439.0,242 470,242" marker-end="url(#a)"/>
<path class="hand" d="M472,254.0 C441.0,254.0 441.0,316 410,316" marker-end="url(#a)"/>
<path class="hand" d="M408,341.0 C439.0,341.0 439.0,365 470,365" marker-end="url(#a)"/>
<path class="hand" d="M472,377.0 C441.0,377.0 441.0,440 410,440" marker-end="url(#a)"/>
<path class="hand" d="M408,452.5 C439.0,452.5 439.0,476 470,476" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">生成一个起步项目</text>
<text class="c" x="82" y="125">npm create nuxt@latest &lt;project-name&gt;</text>
<rect class="card" x="40" y="171" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">在 app/pages 下放 Vue 文件，一个文件就是</text>
<text class="t" x="82" y="222">一个网址</text>
<text class="c" x="82" y="246">app/pages/posts/[id].vue</text>
<rect class="cardT" x="472" y="218" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="218" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="242" r="10"/>
<text class="num" x="494" y="246" text-anchor="middle">3</text>
<text class="t" x="514" y="247">生成 vue-router 路由，按页面拆分代码，自动</text>
<text class="t" x="514" y="269">导入组件</text>
<rect class="card" x="40" y="292" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">4</text>
<text class="t" x="82" y="321">在 server/api 写接口，并在页面里取数</text>
<text class="c" x="82" y="345">useFetch(&#x27;/api/data&#x27;)</text>
<text class="comp" x="82" y="368">组件：Nitro 服务端</text>
<rect class="cardT" x="472" y="341" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="341" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="365" r="10"/>
<text class="num" x="494" y="369" text-anchor="middle">5</text>
<text class="t" x="514" y="370">服务器先渲染，HTML 附带 payload，浏览器不</text>
<text class="t" x="514" y="392">再重复取数</text>
<rect class="card" x="40" y="416" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="416" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="440" r="10"/>
<text class="num" x="62" y="444" text-anchor="middle">6</text>
<text class="t" x="82" y="445">按部署目标构建</text>
<text class="c" x="82" y="469">nuxt build</text>
<rect class="cardT" x="472" y="452" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="452" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="476" r="10"/>
<text class="num" x="494" y="480" text-anchor="middle">7</text>
<text class="t" x="514" y="481">把服务端和客户端打包成 Node</text>
<text class="t" x="514" y="503">服务、Serverless/边缘包或静态站点</text>
<text class="comp" x="514" y="531">组件：Nitro 预设</text>
<rect class="val" x="28" y="581" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="605">价值</text>
<text class="valT" x="48" y="629">一套 Vue 代码同时提供可被搜索引擎收录的服务器渲染页面和自己的接口，几乎能部署到任何地方</text>
</svg>
