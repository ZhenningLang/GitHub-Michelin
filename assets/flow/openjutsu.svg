<svg xmlns="http://www.w3.org/2000/svg" width="880" height="906" viewBox="0 0 880 906" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="906" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="770" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="770" rx="10"/>
<rect class="pillT" x="474" y="40" width="230.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Openjutsu + ComfyUI do</text>
<path class="edge" d="M62,191 L62,215" marker-end="url(#a)"/>
<path class="edge" d="M62,334 L62,358" marker-end="url(#a)"/>
<path class="hand" d="M408,396.0 C439.0,396.0 439.0,420 470,420" marker-end="url(#a)"/>
<path class="edge" d="M494,493 L494,517" marker-end="url(#a)"/>
<path class="edge" d="M494,657 L494,681" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="119" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="119" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install ComfyUI 0.41.2+, the listed</text>
<text class="t" x="82" y="123">node packs and the H3, SAM 3.1 and</text>
<text class="t" x="82" y="145">Qwen models</text>
<text class="comp" x="82" y="173">component: ComfyUI</text>
<rect class="card" x="40" y="217" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="217" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="241" r="10"/>
<text class="num" x="62" y="245" text-anchor="middle">2</text>
<text class="t" x="82" y="246">Start the patched proxy and the app</text>
<text class="c" x="82" y="270">comfy-api-proxy run --max-upload-mb 500 ·</text>
<text class="c" x="82" y="289">npm start</text>
<text class="comp" x="82" y="312">component: comfy-api-proxy and Next.js app</text>
<rect class="card" x="40" y="360" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="360" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="384" r="10"/>
<text class="num" x="62" y="388" text-anchor="middle">3</text>
<text class="t" x="82" y="389">Drop a video and a character photo,</text>
<text class="t" x="82" y="411">then press Generate</text>
<rect class="cardT" x="472" y="396" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="396" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="420" r="10"/>
<text class="num" x="494" y="424" text-anchor="middle">4</text>
<text class="t" x="514" y="425">Prune the exported graph and check its</text>
<text class="t" x="514" y="447">nodes and model files against ComfyUI</text>
<text class="comp" x="514" y="475">component: setup check</text>
<rect class="cardT" x="472" y="519" width="368" height="138" rx="8"/>
<rect class="accT" x="472" y="519" width="4" height="138" rx="2"/>
<circle class="accT" cx="494" cy="543" r="10"/>
<text class="num" x="494" y="547" text-anchor="middle">5</text>
<text class="t" x="514" y="548">Track the person with SAM, turn them</text>
<text class="t" x="514" y="570">into a grey mannequin and render each</text>
<text class="t" x="514" y="592">clip with H3</text>
<text class="comp" x="514" y="620">component: oneclick-swap, Context Loop</text>
<text class="comp" x="514" y="639">packs</text>
<rect class="cardT" x="472" y="683" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="683" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="707" r="10"/>
<text class="num" x="494" y="711" text-anchor="middle">6</text>
<text class="t" x="514" y="712">Assemble the final MP4 with the source</text>
<text class="t" x="514" y="734">soundtrack</text>
<text class="comp" x="514" y="762">component: Final Video node</text>
<rect class="val" x="28" y="812" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="836">VALUE</text>
<text class="valT" x="48" y="860">A character-swapped video without hand-wiring a ComfyUI graph for every run</text>
</svg>
