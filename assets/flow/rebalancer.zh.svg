<svg xmlns="http://www.w3.org/2000/svg" width="880" height="685" viewBox="0 0 880 685" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="685" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="549" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="549" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Rebalancer 做的</text>
<path class="edge" d="M62,183 L62,207" marker-end="url(#a)"/>
<path class="hand" d="M408,255.0 C439.0,255.0 439.0,279 470,279" marker-end="url(#a)"/>
<path class="hand" d="M472,303.5 C441.0,303.5 441.0,351 410,351" marker-end="url(#a)"/>
<path class="edge" d="M62,400 L62,424" marker-end="url(#a)"/>
<path class="hand" d="M408,462.5 C439.0,462.5 439.0,486 470,486" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">描述对象、容器，以及初始分配</text>
<text class="c" x="82" y="125">set_object_name(&quot;task&quot;) ·</text>
<text class="c" x="82" y="144">set_container_name(&quot;host&quot;) ·</text>
<text class="c" x="82" y="163">set_assignment({…})</text>
<rect class="card" x="40" y="209" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="209" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="233" r="10"/>
<text class="num" x="62" y="237" text-anchor="middle">2</text>
<text class="t" x="82" y="238">声明维度，再用现成的 spec 组合出目标与约束</text>
<text class="c" x="82" y="262">BalanceSpec · CapacitySpec ·</text>
<text class="c" x="82" y="281">GroupCountSpec</text>
<rect class="cardT" x="472" y="255" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="255" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="279" r="10"/>
<text class="num" x="494" y="283" text-anchor="middle">3</text>
<text class="t" x="514" y="284">把 spec 编译成表达式图——LP 公式一行</text>
<text class="t" x="514" y="306">都不用写</text>
<text class="comp" x="514" y="334">组件：表达式图</text>
<rect class="card" x="40" y="327" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="327" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="351" r="10"/>
<text class="num" x="62" y="355" text-anchor="middle">4</text>
<text class="t" x="82" y="356">选求解算法，以及它可用的 move types</text>
<text class="c" x="82" y="380">LocalSearchSolverSpec(moveTypeList=[…])</text>
<rect class="card" x="40" y="426" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="426" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="450" r="10"/>
<text class="num" x="62" y="454" text-anchor="middle">5</text>
<text class="t" x="82" y="455">调用 solve()</text>
<text class="c" x="82" y="479">solution = solver.solve()</text>
<rect class="cardT" x="472" y="462" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="462" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="486" r="10"/>
<text class="num" x="494" y="490" text-anchor="middle">6</text>
<text class="t" x="514" y="491">反复应用改进移动，直到再无改进或到达时间上</text>
<text class="t" x="514" y="513">限，返回最佳分配</text>
<text class="comp" x="514" y="541">组件：local search 求解器</text>
<rect class="val" x="28" y="591" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="615">价值</text>
<text class="valT" x="48" y="639">你拿到一个满足约束、且按目标优化过的分配表——不用手写线性规划</text>
</svg>
