<svg xmlns="http://www.w3.org/2000/svg" width="880" height="649" viewBox="0 0 880 649" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="649" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="513" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="513" rx="10"/>
<rect class="pillT" x="474" y="40" width="224.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">claude-code-local 做的</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="edge" d="M494,204 L494,228" marker-end="url(#a)"/>
<path class="hand" d="M472,266.0 C441.0,266.0 441.0,290 410,290" marker-end="url(#a)"/>
<path class="hand" d="M408,302.5 C439.0,302.5 439.0,352 470,352" marker-end="url(#a)"/>
<path class="hand" d="M472,376.5 C441.0,376.5 441.0,400 410,400" marker-end="url(#a)"/>
<path class="hand" d="M408,401.0 C439.0,401.0 439.0,475 470,475" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 Apple Silicon Mac 上克隆仓库，跑它的安</text>
<text class="t" x="82" y="123">装脚本</text>
<text class="c" x="82" y="147">bash setup.sh</text>
<text class="comp" x="82" y="170">组件：setup.sh</text>
<rect class="cardT" x="472" y="132" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">读内存大小，挑一个装得下的模型，在虚拟环境</text>
<text class="t" x="514" y="183">装 mlx-lm 并下载权重</text>
<rect class="cardT" x="472" y="230" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="230" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="254" r="10"/>
<text class="num" x="494" y="258" text-anchor="middle">3</text>
<text class="t" x="514" y="259">把服务器脚本链接到位，在桌面放一个 Claude</text>
<text class="t" x="514" y="281">Local 启动器</text>
<rect class="card" x="40" y="266" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="266" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="290" r="10"/>
<text class="num" x="62" y="294" text-anchor="middle">4</text>
<text class="t" x="82" y="295">双击启动器</text>
<text class="c" x="82" y="319">Claude Local.command</text>
<rect class="cardT" x="472" y="328" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="328" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="352" r="10"/>
<text class="num" x="494" y="356" text-anchor="middle">5</text>
<text class="t" x="514" y="357">在 4000 端口起 MLX 服务器，打开连向它的</text>
<text class="t" x="514" y="379">Claude Code</text>
<text class="comp" x="514" y="407">组件：proxy/server.py</text>
<rect class="card" x="40" y="376" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="376" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="400" r="10"/>
<text class="num" x="62" y="404" text-anchor="middle">6</text>
<text class="t" x="82" y="405">照常在 Claude Code 里干活</text>
<rect class="cardT" x="472" y="451" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="451" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="475" r="10"/>
<text class="num" x="494" y="479" text-anchor="middle">7</text>
<text class="t" x="514" y="480">在 GPU 上回答每一轮，把模型的工具调用文本</text>
<text class="t" x="514" y="502">转成 Claude Code 调用</text>
<rect class="val" x="28" y="555" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="579">价值</text>
<text class="valT" x="48" y="603">Claude Code 不靠云端模型、不要 API key、不受额度限制照样能用，提示词和代码都留在本机</text>
</svg>
