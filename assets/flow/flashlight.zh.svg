<svg xmlns="http://www.w3.org/2000/svg" width="880" height="735" viewBox="0 0 880 735" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="735" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="599" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="599" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Flashlight 做的</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="edge" d="M62,265 L62,289" marker-end="url(#a)"/>
<path class="hand" d="M408,338.5 C439.0,338.5 439.0,362 470,362" marker-end="url(#a)"/>
<path class="edge" d="M494,435 L494,459" marker-end="url(#a)"/>
<path class="edge" d="M494,533 L494,557" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">老版 macOS 上关掉 SIP，装 MacForge 和</text>
<text class="t" x="82" y="123">Flashlight</text>
<rect class="card" x="40" y="170" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">装插件，或写插件包并在 examples.txt 里标</text>
<text class="t" x="82" y="221">出槽位</text>
<text class="c" x="82" y="245">say ~message(Good Morning)</text>
<rect class="card" x="40" y="291" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="291" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="315" r="10"/>
<text class="num" x="62" y="319" text-anchor="middle">3</text>
<text class="t" x="82" y="320">在 plugin.py 里把填好的槽位变成一条</text>
<text class="t" x="82" y="342">结果标题</text>
<text class="c" x="82" y="366">def results(fields, original_query)</text>
<rect class="cardT" x="472" y="338" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="338" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="362" r="10"/>
<text class="num" x="494" y="366" text-anchor="middle">4</text>
<text class="t" x="514" y="367">注入 Spotlight，把你输入的查询和各插件的例</text>
<text class="t" x="514" y="389">句比对</text>
<text class="comp" x="514" y="417">组件：SpotlightSIMBL 注入代理</text>
<rect class="cardT" x="472" y="461" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="461" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="485" r="10"/>
<text class="num" x="494" y="489" text-anchor="middle">5</text>
<text class="t" x="514" y="490">调用插件的 results()，把标题显示成</text>
<text class="t" x="514" y="512">Spotlight 里的一行</text>
<rect class="cardT" x="472" y="559" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="559" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="583" r="10"/>
<text class="num" x="494" y="587" text-anchor="middle">6</text>
<text class="t" x="514" y="588">你按回车时，用 run_args 调用插件的 run()</text>
<rect class="val" x="28" y="641" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="665">价值</text>
<text class="valT" x="48" y="689">原生 Spotlight 能回答你自定义的查询——但只限 macOS 10.10–10.15</text>
</svg>
