<svg xmlns="http://www.w3.org/2000/svg" width="880" height="627" viewBox="0 0 880 627" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="627" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="491" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="491" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Pi Web 做的</text>
<path class="hand" d="M408,121.0 C439.0,121.0 439.0,145 470,145" marker-end="url(#a)"/>
<path class="edge" d="M494,194 L494,218" marker-end="url(#a)"/>
<path class="hand" d="M472,269.0 C441.0,269.0 441.0,293 410,293" marker-end="url(#a)"/>
<path class="edge" d="M62,342 L62,366" marker-end="url(#a)"/>
<path class="hand" d="M408,393.0 C439.0,393.0 439.0,428 470,428" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在已经跑着 pi 的机器上启动它</text>
<text class="c" x="82" y="125">npx @agegr/pi-web@latest</text>
<text class="comp" x="82" y="148">组件：npm CLI bin/pi-web.js</text>
<rect class="cardT" x="472" y="121" width="368" height="73" rx="8"/>
<rect class="accT" x="472" y="121" width="4" height="73" rx="2"/>
<circle class="accT" cx="494" cy="145" r="10"/>
<text class="num" x="494" y="149" text-anchor="middle">2</text>
<text class="t" x="514" y="150">在回环地址起本地服务并打开浏览器</text>
<text class="c" x="514" y="174">http://127.0.0.1:30141</text>
<rect class="cardT" x="472" y="220" width="368" height="98" rx="8"/>
<rect class="accT" x="472" y="220" width="4" height="98" rx="2"/>
<circle class="accT" cx="494" cy="244" r="10"/>
<text class="num" x="494" y="248" text-anchor="middle">3</text>
<text class="t" x="514" y="249">从 pi 的 agent 数据目录读出会话与配置</text>
<text class="c" x="514" y="273">~/.pi/agent</text>
<text class="comp" x="514" y="296">组件：pi 会话存储</text>
<rect class="card" x="40" y="269" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="269" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="293" r="10"/>
<text class="num" x="62" y="297" text-anchor="middle">4</text>
<text class="t" x="82" y="298">登录模型供应商或填入 API key（仅首次）</text>
<text class="c" x="82" y="322">Models</text>
<rect class="card" x="40" y="368" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="368" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="392" r="10"/>
<text class="num" x="62" y="396" text-anchor="middle">5</text>
<text class="t" x="82" y="397">按项目浏览会话，恢复一条或直接发消息</text>
<rect class="cardT" x="472" y="404" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="404" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="428" r="10"/>
<text class="num" x="494" y="432" text-anchor="middle">6</text>
<text class="t" x="514" y="433">用 pi 自己的引擎跑这一轮，写回同一份</text>
<text class="t" x="514" y="455">会话文件</text>
<text class="comp" x="514" y="483">组件：pi 编码 agent SDK</text>
<rect class="val" x="28" y="533" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="557">价值</text>
<text class="valT" x="48" y="581">pi 有了浏览器工作台：会话、模型、文件都落在终端正在用的同一份状态上，零迁移</text>
</svg>
