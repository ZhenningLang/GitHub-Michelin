<svg xmlns="http://www.w3.org/2000/svg" width="880" height="695" viewBox="0 0 880 695" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="695" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="559" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="559" rx="10"/>
<rect class="pillT" x="474" y="40" width="187.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">UI UX Pro Max 做的</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,251.5 C439.0,251.5 439.0,275 470,275" marker-end="url(#a)"/>
<path class="edge" d="M494,348 L494,372" marker-end="url(#a)"/>
<path class="edge" d="M494,471 L494,495" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装 CLI，为所用 agent 把 skill 落进项目</text>
<text class="c" x="82" y="125">npm install -g ui-ux-pro-max-cli · uipro</text>
<text class="c" x="82" y="144">init --ai claude</text>
<text class="comp" x="82" y="167">组件：uipro CLI</text>
<rect class="card" x="40" y="215" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">用自然语言提出 UI/UX 需求</text>
<text class="c" x="82" y="268">Build a landing page for my SaaS product</text>
<rect class="cardT" x="472" y="251" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="251" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="275" r="10"/>
<text class="num" x="494" y="279" text-anchor="middle">3</text>
<text class="t" x="514" y="280">skill 自动激活，对内置 CSV 库做多域 BM</text>
<text class="t" x="514" y="302">25 检索</text>
<text class="comp" x="514" y="330">组件：search.py（仅用 Python 3 标准库）</text>
<rect class="cardT" x="472" y="374" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="374" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="398" r="10"/>
<text class="num" x="494" y="402" text-anchor="middle">4</text>
<text class="t" x="514" y="403">推理引擎把产品类型映射到风格、配色、字体与</text>
<text class="t" x="514" y="425">反模式</text>
<text class="comp" x="514" y="453">组件：192 条推理规则</text>
<rect class="cardT" x="472" y="497" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="497" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="521" r="10"/>
<text class="num" x="494" y="525" text-anchor="middle">5</text>
<text class="t" x="514" y="526">交付前跑质量清单（对比度、断点、focus 状</text>
<text class="t" x="514" y="548">态、不用 emoji 图标）</text>
<rect class="val" x="28" y="601" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="625">价值</text>
<text class="valT" x="48" y="649">agent 做出有据可依的设计决策——风格、配色、排版、无障碍——你不必先自建一套设计系统</text>
</svg>
