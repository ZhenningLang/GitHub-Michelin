<svg xmlns="http://www.w3.org/2000/svg" width="880" height="759" viewBox="0 0 880 759" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="759" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="601" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="601" rx="10"/>
<rect class="pillT" x="474" y="40" width="248.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Planning with Files does</text>
<path class="edge" d="M62,183 L62,207" marker-end="url(#a)"/>
<path class="hand" d="M408,269.0 C439.0,269.0 439.0,293 470,293" marker-end="url(#a)"/>
<path class="edge" d="M494,342 L494,366" marker-end="url(#a)"/>
<path class="hand" d="M472,416.5 C441.0,416.5 441.0,440 410,440" marker-end="url(#a)"/>
<path class="hand" d="M408,463.5 C439.0,463.5 439.0,515 470,515" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the skill into your agent</text>
<text class="c" x="82" y="125">npx skills add</text>
<text class="c" x="82" y="144">OthmanAdi/planning-with-files --skill</text>
<text class="c" x="82" y="163">planning-with-files -g</text>
<rect class="card" x="40" y="209" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="209" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="233" r="10"/>
<text class="num" x="62" y="237" text-anchor="middle">2</text>
<text class="t" x="82" y="238">Start a long task and let the skill</text>
<text class="t" x="82" y="260">write the plan</text>
<text class="c" x="82" y="284">/plan</text>
<text class="comp" x="82" y="307">component: SKILL.md + templates</text>
<rect class="cardT" x="472" y="269" width="368" height="73" rx="8"/>
<rect class="accT" x="472" y="269" width="4" height="73" rx="2"/>
<circle class="accT" cx="494" cy="293" r="10"/>
<text class="num" x="494" y="297" text-anchor="middle">3</text>
<text class="t" x="514" y="298">Keeps state in three files on disk</text>
<text class="c" x="514" y="322">task_plan.md · findings.md · progress.md</text>
<rect class="cardT" x="472" y="368" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="368" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="392" r="10"/>
<text class="num" x="494" y="396" text-anchor="middle">4</text>
<text class="t" x="514" y="397">Re-injects the active plan into the</text>
<text class="t" x="514" y="419">window every turn</text>
<text class="comp" x="514" y="447">component: lifecycle hooks</text>
<rect class="card" x="40" y="416" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="416" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="440" r="10"/>
<text class="num" x="62" y="444" text-anchor="middle">5</text>
<text class="t" x="82" y="445">Let the context die — /clear,</text>
<text class="t" x="82" y="467">compaction, crash</text>
<text class="c" x="82" y="491">/clear</text>
<rect class="cardT" x="472" y="491" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="491" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="515" r="10"/>
<text class="num" x="494" y="519" text-anchor="middle">6</text>
<text class="t" x="514" y="520">Gated mode holds the stop while any</text>
<text class="t" x="514" y="542">phase is in_progress</text>
<text class="c" x="514" y="566">--gated</text>
<text class="comp" x="514" y="589">component: Stop gate</text>
<rect class="val" x="28" y="643" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="667">VALUE</text>
<text class="valT" x="48" y="691">The plan outlives every context reset; done means the on-disk checkboxes say so, not the</text>
<text class="valT" x="48" y="713">model&#x27;s confidence</text>
</svg>
