<svg xmlns="http://www.w3.org/2000/svg" width="880" height="736" viewBox="0 0 880 736" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="736" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="600" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="600" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">MiroThinker 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,307 L62,331" marker-end="url(#a)"/>
<path class="hand" d="M408,390.0 C439.0,390.0 439.0,414 470,414" marker-end="url(#a)"/>
<path class="edge" d="M494,487 L494,511" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">克隆仓库、同步环境，在 .env 里填好工具 API</text>
<text class="t" x="82" y="123">key</text>
<text class="c" x="82" y="147">uv sync · cp .env.example .env</text>
<rect class="card" x="40" y="193" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">用 SGLang 或 vLLM 把微调模型托管到自己的</text>
<text class="t" x="82" y="244">GPU 上</text>
<text class="c" x="82" y="268">sglang.launch_server --model-path</text>
<text class="c" x="82" y="287">$AGENT_PATH --tp $NUM_GPUS</text>
<rect class="card" x="40" y="333" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">3</text>
<text class="t" x="82" y="362">选预置 agent 配置，指向这个服务跑一</text>
<text class="t" x="82" y="384">个研究任务</text>
<text class="c" x="82" y="408">uv run python main.py</text>
<text class="c" x="82" y="427">agent=mirothinker_1.7_keep5_max200</text>
<rect class="cardT" x="472" y="390" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="390" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="414" r="10"/>
<text class="num" x="494" y="418" text-anchor="middle">4</text>
<text class="t" x="514" y="419">MiroFlow 编排循环：模型自主最多300次工具调</text>
<text class="t" x="514" y="441">用，上下文留最近5条</text>
<text class="comp" x="514" y="469">组件：MiroFlow agent</text>
<rect class="cardT" x="472" y="513" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="513" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="537" r="10"/>
<text class="num" x="494" y="541" text-anchor="middle">5</text>
<text class="t" x="514" y="542">搜索（Serper）、抓取（Jina）、沙箱（E2B）</text>
<text class="t" x="514" y="564">逐条应答，答案带来源</text>
<text class="comp" x="514" y="592">组件：MCP 工具服务</text>
<rect class="val" x="28" y="642" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="666">价值</text>
<text class="valT" x="48" y="690">开权重的自托管深度研究：agent 循环是你读得到、改得动的代码，不是黑盒 API</text>
</svg>
