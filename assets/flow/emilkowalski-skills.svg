<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1024" viewBox="0 0 880 1024" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1024" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="866" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="866" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Emil&#x27;s skills do</text>
<path class="edge" d="M62,209 L62,233" marker-end="url(#a)"/>
<path class="hand" d="M408,280.0 C439.0,280.0 439.0,304 470,304" marker-end="url(#a)"/>
<path class="edge" d="M494,416 L494,440" marker-end="url(#a)"/>
<path class="hand" d="M472,498.0 C441.0,498.0 441.0,522 410,522" marker-end="url(#a)"/>
<path class="hand" d="M408,554.0 C439.0,554.0 439.0,604 470,604" marker-end="url(#a)"/>
<path class="hand" d="M472,648.0 C441.0,648.0 441.0,672 410,672" marker-end="url(#a)"/>
<path class="hand" d="M408,704.0 C439.0,704.0 439.0,766 470,766" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Build</text>
<text class="t" x="82" y="118">Install the pack into your agent with</text>
<text class="t" x="82" y="140">the skills CLI</text>
<text class="c" x="82" y="164">npx skills@latest add emilkowalski/skills</text>
<text class="comp" x="82" y="187">component: 13 skill folders</text>
<rect class="card" x="40" y="235" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="235" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="259" r="10"/>
<text class="num" x="62" y="263" text-anchor="middle">2</text>
<text class="ph" x="82" y="264">Build</text>
<text class="t" x="82" y="281">Ask the agent to animate a component</text>
<text class="c" x="82" y="305">/animate</text>
<rect class="cardT" x="472" y="280" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="280" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="304" r="10"/>
<text class="num" x="494" y="308" text-anchor="middle">3</text>
<text class="ph" x="514" y="309">Build</text>
<text class="t" x="514" y="326">Gates on how often users see it —</text>
<text class="t" x="514" y="348">keyboard or 100+/day actions get no</text>
<text class="t" x="514" y="370">animation</text>
<text class="comp" x="514" y="398">component: frequency gate</text>
<rect class="cardT" x="472" y="442" width="368" height="112" rx="8"/>
<rect class="accT" x="472" y="442" width="4" height="112" rx="2"/>
<circle class="accT" cx="494" cy="466" r="10"/>
<text class="num" x="494" y="470" text-anchor="middle">4</text>
<text class="ph" x="514" y="471">Build</text>
<text class="t" x="514" y="488">Names the purpose, then takes curve</text>
<text class="t" x="514" y="510">and duration from fixed tables</text>
<text class="c" x="514" y="534">--ease-out: cubic-bezier(0.23, 1, 0.32, 1)</text>
<rect class="card" x="40" y="498" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="498" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="522" r="10"/>
<text class="num" x="62" y="526" text-anchor="middle">5</text>
<text class="ph" x="82" y="527">Review</text>
<text class="t" x="82" y="544">Before merging, call the strict</text>
<text class="t" x="82" y="566">reviewer on the motion diff</text>
<text class="c" x="82" y="590">/review-animations</text>
<rect class="cardT" x="472" y="580" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="580" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="604" r="10"/>
<text class="num" x="494" y="608" text-anchor="middle">6</text>
<text class="ph" x="514" y="609">Review</text>
<text class="t" x="514" y="626">Returns Before/After/Why rows and</text>
<text class="t" x="514" y="648">Block or Approve — deleting the</text>
<text class="t" x="514" y="670">animation is fix #1</text>
<text class="comp" x="514" y="698">component: ten non-negotiable standards</text>
<rect class="card" x="40" y="648" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="648" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="672" r="10"/>
<text class="num" x="62" y="676" text-anchor="middle">7</text>
<text class="ph" x="82" y="677">Whole codebase</text>
<text class="t" x="82" y="694">Ask for an audit of every animation in</text>
<text class="t" x="82" y="716">the app</text>
<text class="c" x="82" y="740">/improve-animations</text>
<rect class="cardT" x="472" y="742" width="368" height="134" rx="8"/>
<rect class="accT" x="472" y="742" width="4" height="134" rx="2"/>
<circle class="accT" cx="494" cy="766" r="10"/>
<text class="num" x="494" y="770" text-anchor="middle">8</text>
<text class="ph" x="514" y="771">Whole codebase</text>
<text class="t" x="514" y="788">Writes read-only plans with exact</text>
<text class="t" x="514" y="810">values and file:line excerpts any</text>
<text class="t" x="514" y="832">agent can run</text>
<text class="c" x="514" y="856">plans/</text>
<rect class="val" x="28" y="908" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="932">VALUE</text>
<text class="valT" x="48" y="956">Motion calls get made against one explicit bar — including the call not to animate — instead</text>
<text class="valT" x="48" y="978">of the agent&#x27;s default easing and durations</text>
</svg>
