<svg xmlns="http://www.w3.org/2000/svg" width="880" height="777" viewBox="0 0 880 777" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="777" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="641" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="641" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">PowerJob does</text>
<path class="edge" d="M62,169 L62,193" marker-end="url(#a)"/>
<path class="edge" d="M62,334 L62,358" marker-end="url(#a)"/>
<path class="hand" d="M408,420.0 C439.0,420.0 439.0,444 470,444" marker-end="url(#a)"/>
<path class="hand" d="M472,468.5 C441.0,468.5 441.0,530 410,530" marker-end="url(#a)"/>
<path class="hand" d="M408,554.5 C439.0,554.5 439.0,578 470,578" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Deploy the scheduling server with a</text>
<text class="t" x="82" y="123">relational database</text>
<text class="comp" x="82" y="151">component: powerjob-server</text>
<rect class="card" x="40" y="195" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="195" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="219" r="10"/>
<text class="num" x="62" y="223" text-anchor="middle">2</text>
<text class="t" x="82" y="224">Add the worker starter and configure</text>
<text class="t" x="82" y="246">its app name and server addresses</text>
<text class="c" x="82" y="270">tech.powerjob:powerjob-worker-spring-boot-</text>
<text class="c" x="82" y="289">starter</text>
<text class="comp" x="82" y="312">component: worker starter</text>
<rect class="card" x="40" y="360" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="360" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="384" r="10"/>
<text class="num" x="62" y="388" text-anchor="middle">3</text>
<text class="t" x="82" y="389">Implement the business task as a</text>
<text class="t" x="82" y="411">processor</text>
<text class="c" x="82" y="435">BasicProcessor</text>
<text class="comp" x="82" y="458">component: application processor</text>
<rect class="cardT" x="472" y="420" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="420" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="444" r="10"/>
<text class="num" x="494" y="448" text-anchor="middle">4</text>
<text class="t" x="514" y="449">Registers the worker and reports its</text>
<text class="t" x="514" y="471">availability</text>
<text class="comp" x="514" y="499">component: powerjob-worker</text>
<rect class="card" x="40" y="506" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="506" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="530" r="10"/>
<text class="num" x="62" y="534" text-anchor="middle">5</text>
<text class="t" x="82" y="535">Create a job in the console with</text>
<text class="t" x="82" y="557">timing, execution mode, and processor</text>
<text class="comp" x="82" y="585">component: web console</text>
<rect class="cardT" x="472" y="554" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="554" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="578" r="10"/>
<text class="num" x="494" y="582" text-anchor="middle">6</text>
<text class="t" x="514" y="583">Dispatches the instance, runs the</text>
<text class="t" x="514" y="605">processor, and records logs and status</text>
<text class="comp" x="514" y="633">component: server + worker</text>
<rect class="val" x="28" y="683" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="707">VALUE</text>
<text class="valT" x="48" y="731">Application jobs gain central scheduling, distributed execution, and one operational view</text>
</svg>
