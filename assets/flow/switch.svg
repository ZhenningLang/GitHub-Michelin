<svg xmlns="http://www.w3.org/2000/svg" width="880" height="766" viewBox="0 0 880 766" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="766" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="608" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="608" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Switch does</text>
<path class="edge" d="M62,169 L62,193" marker-end="url(#a)"/>
<path class="hand" d="M408,231.0 C439.0,231.0 439.0,255 470,255" marker-end="url(#a)"/>
<path class="hand" d="M472,279.5 C441.0,279.5 441.0,317 410,317" marker-end="url(#a)"/>
<path class="hand" d="M408,351.5 C439.0,351.5 439.0,378 470,378" marker-end="url(#a)"/>
<path class="hand" d="M472,413.5 C441.0,413.5 441.0,460 410,460" marker-end="url(#a)"/>
<path class="hand" d="M408,472.0 C439.0,472.0 439.0,523 470,523" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install Docker and the Switch Console</text>
<text class="t" x="82" y="123">desktop app</text>
<text class="comp" x="82" y="151">component: Switch Console (Electron)</text>
<rect class="card" x="40" y="195" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="195" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="219" r="10"/>
<text class="num" x="62" y="223" text-anchor="middle">2</text>
<text class="t" x="82" y="224">Choose to run Switch on this computer,</text>
<text class="t" x="82" y="246">then press Start</text>
<rect class="cardT" x="472" y="231" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="231" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="255" r="10"/>
<text class="num" x="494" y="259" text-anchor="middle">3</text>
<text class="t" x="514" y="260">Starts a local Switch server and its</text>
<text class="t" x="514" y="282">Postgres in Docker</text>
<text class="comp" x="514" y="310">component: switch-core + Postgres</text>
<rect class="card" x="40" y="293" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="293" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="317" r="10"/>
<text class="num" x="62" y="321" text-anchor="middle">4</text>
<text class="t" x="82" y="322">Ask switch-buddy to connect Slack,</text>
<text class="t" x="82" y="344">paste the app details, link your</text>
<text class="t" x="82" y="366">account</text>
<text class="c" x="82" y="390">Help me connect Slack to Switch.</text>
<rect class="cardT" x="472" y="354" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="354" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="378" r="10"/>
<text class="num" x="494" y="382" text-anchor="middle">5</text>
<text class="t" x="514" y="383">Creates an agent on your signed-in</text>
<text class="t" x="514" y="405">Claude Code or Codex and a room bound</text>
<text class="t" x="514" y="427">to a channel</text>
<text class="comp" x="514" y="455">component: switch-buddy agent</text>
<rect class="card" x="40" y="436" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="436" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="460" r="10"/>
<text class="num" x="62" y="464" text-anchor="middle">6</text>
<text class="t" x="82" y="465">@mention the agent in that Slack</text>
<text class="t" x="82" y="487">channel</text>
<rect class="cardT" x="472" y="499" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="499" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="523" r="10"/>
<text class="num" x="494" y="527" text-anchor="middle">7</text>
<text class="t" x="514" y="528">Routes the message to the agent&#x27;s</text>
<text class="t" x="514" y="550">session; its reply lands in the same</text>
<text class="t" x="514" y="572">thread</text>
<text class="comp" x="514" y="600">component: router + collaboration bridge</text>
<rect class="val" x="28" y="650" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="674">VALUE</text>
<text class="valT" x="48" y="698">Your existing coding agent works in the team&#x27;s channel with the whole thread as context —</text>
<text class="valT" x="48" y="720">nobody copies chat into a terminal or learns a new app</text>
</svg>
