<svg xmlns="http://www.w3.org/2000/svg" width="880" height="718" viewBox="0 0 880 718" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="718" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="582" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="582" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenFGA 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,326 L62,350" marker-end="url(#a)"/>
<path class="hand" d="M408,399.5 C439.0,399.5 439.0,423 470,423" marker-end="url(#a)"/>
<path class="hand" d="M472,436.5 C441.0,436.5 441.0,497 410,497" marker-end="url(#a)"/>
<path class="hand" d="M408,520.5 C439.0,520.5 439.0,544 470,544" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">启动 OpenFGA 服务（试用放内存，生产</text>
<text class="t" x="82" y="123">接数据库）</text>
<text class="c" x="82" y="147">docker run -p 8080:8080 -p 3000:3000</text>
<text class="c" x="82" y="166">openfga/openfga run</text>
<rect class="card" x="40" y="212" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">写授权模型：有哪些对象类型，每种关系怎么推</text>
<text class="t" x="82" y="263">导出来</text>
<text class="c" x="82" y="287">define can_read: viewer or owner or viewer</text>
<text class="c" x="82" y="306">from parent</text>
<rect class="card" x="40" y="352" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">3</text>
<text class="t" x="82" y="381">应用里所有权、成员或分享一变，就写一</text>
<text class="t" x="82" y="403">条关系元组</text>
<text class="c" x="82" y="427">user:anne can_view document:roadmap</text>
<rect class="cardT" x="472" y="399" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="399" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="423" r="10"/>
<text class="num" x="494" y="427" text-anchor="middle">4</text>
<text class="t" x="514" y="428">把元组和带版本的模型一起存进它的数据库</text>
<text class="comp" x="514" y="456">组件：数据存储</text>
<rect class="card" x="40" y="473" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="473" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="497" r="10"/>
<text class="num" x="62" y="501" text-anchor="middle">5</text>
<text class="t" x="82" y="502">受保护操作之前、或要列出可见对象时，应用调</text>
<text class="t" x="82" y="524">用它的 API</text>
<text class="c" x="82" y="548">Check · ListObjects</text>
<rect class="cardT" x="472" y="520" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="520" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="544" r="10"/>
<text class="num" x="494" y="548" text-anchor="middle">6</text>
<text class="t" x="514" y="549">沿着群组、上级目录等关系图查找，返回是否允</text>
<text class="t" x="514" y="571">许或对象列表</text>
<rect class="val" x="28" y="624" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="648">价值</text>
<text class="valT" x="48" y="672">分享、群组、多层文件夹都由同一个服务按同一个模型判断，不再在每个应用里写多表联查</text>
</svg>
