<svg xmlns="http://www.w3.org/2000/svg" width="880" height="842" viewBox="0 0 880 842" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="842" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="684" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="684" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The Action does</text>
<path class="edge" d="M62,227 L62,251" marker-end="url(#a)"/>
<path class="hand" d="M408,310.0 C439.0,310.0 439.0,334 470,334" marker-end="url(#a)"/>
<path class="edge" d="M494,429 L494,453" marker-end="url(#a)"/>
<path class="edge" d="M494,574 L494,598" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="155" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="155" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add the Quick Start workflow to</text>
<text class="t" x="82" y="123">.github/workflows/security.yml with</text>
<text class="t" x="82" y="145">your Claude API key secret</text>
<text class="c" x="82" y="169">uses:</text>
<text class="c" x="82" y="188">anthropics/claude-code-security-review@mai</text>
<text class="c" x="82" y="207">n</text>
<rect class="card" x="40" y="253" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="253" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="277" r="10"/>
<text class="num" x="62" y="281" text-anchor="middle">2</text>
<text class="t" x="82" y="282">Make fork PRs wait for a maintainer</text>
<text class="t" x="82" y="304">before workflows run</text>
<text class="c" x="82" y="328">Require approval for all external</text>
<text class="c" x="82" y="347">contributors</text>
<rect class="cardT" x="472" y="310" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="310" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="334" r="10"/>
<text class="num" x="494" y="338" text-anchor="middle">3</text>
<text class="t" x="514" y="339">On each PR, Claude Code reads the</text>
<text class="t" x="514" y="361">changed files and reasons about them</text>
<text class="t" x="514" y="383">in context</text>
<text class="comp" x="514" y="411">component: github_action_audit.py</text>
<rect class="cardT" x="472" y="455" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="455" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="479" r="10"/>
<text class="num" x="494" y="483" text-anchor="middle">4</text>
<text class="t" x="514" y="484">A filtering pass drops low-impact</text>
<text class="t" x="514" y="506">findings such as DoS, rate limiting</text>
<text class="t" x="514" y="528">and open redirects</text>
<text class="comp" x="514" y="556">component: findings_filter.py</text>
<rect class="cardT" x="472" y="600" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="600" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="624" r="10"/>
<text class="num" x="494" y="628" text-anchor="middle">5</text>
<text class="t" x="514" y="629">Posts what is left as review comments</text>
<text class="t" x="514" y="651">on the exact lines, with severity and</text>
<text class="t" x="514" y="673">a fix</text>
<rect class="val" x="28" y="726" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="750">VALUE</text>
<text class="valT" x="48" y="774">Logic-level vulnerabilities in a diff are flagged on the PR before merge, with no rules to</text>
<text class="valT" x="48" y="796">write</text>
</svg>
