<svg xmlns="http://www.w3.org/2000/svg" width="880" height="768" viewBox="0 0 880 768" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="768" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="632" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="632" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TanStack DB 做的</text>
<path class="edge" d="M62,181 L62,205" marker-end="url(#a)"/>
<path class="hand" d="M408,272.5 C439.0,272.5 439.0,296 470,296" marker-end="url(#a)"/>
<path class="hand" d="M472,329.0 C441.0,329.0 441.0,388 410,388" marker-end="url(#a)"/>
<path class="hand" d="M408,418.5 C439.0,418.5 439.0,442 470,442" marker-end="url(#a)"/>
<path class="hand" d="M472,462.5 C441.0,462.5 441.0,523 410,523" marker-end="url(#a)"/>
<path class="hand" d="M408,553.5 C439.0,553.5 439.0,577 470,577" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">接入</text>
<text class="t" x="82" y="118">安装框架包和集合适配包</text>
<text class="c" x="82" y="142">npm install @tanstack/react-db</text>
<text class="c" x="82" y="161">@tanstack/query-db-collection</text>
<rect class="card" x="40" y="207" width="368" height="131" rx="8"/>
<rect class="accY" x="40" y="207" width="4" height="131" rx="2"/>
<circle class="accY" cx="62" cy="231" r="10"/>
<text class="num" x="62" y="235" text-anchor="middle">2</text>
<text class="ph" x="82" y="236">接入</text>
<text class="t" x="82" y="253">声明一个集合：数据从哪拉、主键是什么、写操</text>
<text class="t" x="82" y="275">作怎么发回服务端</text>
<text class="c" x="82" y="299">queryCollectionOptions({ queryKey:</text>
<text class="c" x="82" y="318">[&#x27;todos&#x27;], getKey: (item) =&gt; item.id })</text>
<rect class="cardT" x="472" y="272" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="272" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="296" r="10"/>
<text class="num" x="494" y="300" text-anchor="middle">3</text>
<text class="ph" x="514" y="301">接入</text>
<text class="t" x="514" y="318">把集合实例化，经 TanStack Query 把数据拉</text>
<text class="t" x="514" y="340">进内存里的规范化存储</text>
<text class="comp" x="514" y="368">组件：DbClient（集合）</text>
<rect class="card" x="40" y="364" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="364" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="388" r="10"/>
<text class="num" x="62" y="392" text-anchor="middle">4</text>
<text class="ph" x="82" y="393">每次读写</text>
<text class="t" x="82" y="410">在组件里用活查询声明要什么数据</text>
<text class="c" x="82" y="434">useLiveQuery({ query: (q) =&gt; q.from({</text>
<text class="c" x="82" y="453">todo: todoCollection }) })</text>
<rect class="cardT" x="472" y="418" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="418" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="442" r="10"/>
<text class="num" x="494" y="446" text-anchor="middle">5</text>
<text class="ph" x="514" y="447">每次读写</text>
<text class="t" x="514" y="464">用差分数据流只重算变化的行，让订阅的组件重</text>
<text class="t" x="514" y="486">新渲染</text>
<rect class="card" x="40" y="499" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="499" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="523" r="10"/>
<text class="num" x="62" y="527" text-anchor="middle">6</text>
<text class="ph" x="82" y="528">每次读写</text>
<text class="t" x="82" y="545">通过改一行数据的草稿来写</text>
<text class="c" x="82" y="569">todosCollection.update(todo.id, (draft) =&gt;</text>
<text class="c" x="82" y="588">{ draft.completed = true })</text>
<rect class="cardT" x="472" y="553" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="553" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="577" r="10"/>
<text class="num" x="494" y="581" text-anchor="middle">7</text>
<text class="ph" x="514" y="582">每次读写</text>
<text class="t" x="514" y="599">先乐观地生效，再经 onUpdate 落库，失败则自</text>
<text class="t" x="514" y="621">动回滚</text>
<rect class="val" x="28" y="674" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="698">价值</text>
<text class="valT" x="48" y="722">写完不用手补缓存，也不用层层 filter／memo 重算；各处页面始终和数据保持一致</text>
</svg>
