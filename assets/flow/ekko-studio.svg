<svg xmlns="http://www.w3.org/2000/svg" width="880" height="709" viewBox="0 0 880 709" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="709" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="551" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="551" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Ekko Studio does</text>
<path class="hand" d="M408,129.0 C439.0,129.0 439.0,153 470,153" marker-end="url(#a)"/>
<path class="hand" d="M472,200.0 C441.0,200.0 441.0,236 410,236" marker-end="url(#a)"/>
<path class="hand" d="M408,248.0 C439.0,248.0 439.0,321 470,321" marker-end="url(#a)"/>
<path class="hand" d="M472,356.5 C441.0,356.5 441.0,380 410,380" marker-end="url(#a)"/>
<path class="hand" d="M408,392.0 C439.0,392.0 439.0,466 470,466" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the npm package and start the</text>
<text class="t" x="82" y="123">local server</text>
<text class="c" x="82" y="147">npm install -g ekko-studio ·</text>
<text class="c" x="82" y="166">ekko-studio-web start</text>
<rect class="cardT" x="472" y="129" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="129" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="153" r="10"/>
<text class="num" x="494" y="157" text-anchor="middle">2</text>
<text class="t" x="514" y="158">Creates its data dir and SQLite DB,</text>
<text class="t" x="514" y="180">starts the Hermes bridge, opens the</text>
<text class="t" x="514" y="202">browser</text>
<text class="c" x="514" y="226">http://localhost:8648</text>
<text class="comp" x="514" y="249">component: Koa server + Python bridge</text>
<rect class="card" x="40" y="212" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">3</text>
<text class="t" x="82" y="241">Sign in, then pick the agents you use</text>
<text class="t" x="82" y="263">in Agent Manager</text>
<rect class="cardT" x="472" y="297" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="297" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="321" r="10"/>
<text class="num" x="494" y="325" text-anchor="middle">4</text>
<text class="t" x="514" y="326">Installs and configures those</text>
<text class="t" x="514" y="348">coding-agent CLIs on the backend</text>
<text class="t" x="514" y="370">machine</text>
<text class="comp" x="514" y="398">component: Agent Manager</text>
<rect class="card" x="40" y="356" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="356" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="380" r="10"/>
<text class="num" x="62" y="384" text-anchor="middle">5</text>
<text class="t" x="82" y="385">Chat with one agent, or @mention</text>
<text class="t" x="82" y="407">several agents in a group room</text>
<rect class="cardT" x="472" y="442" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="442" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="466" r="10"/>
<text class="num" x="494" y="470" text-anchor="middle">6</text>
<text class="t" x="514" y="471">Routes each run to that agent&#x27;s</text>
<text class="t" x="514" y="493">adapter, streams replies and tool</text>
<text class="t" x="514" y="515">traces, saves the session</text>
<text class="comp" x="514" y="543">component: runtime adapters</text>
<rect class="val" x="28" y="593" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="617">VALUE</text>
<text class="valT" x="48" y="641">One local console for all your agents&#x27; sessions and files, instead of one terminal and one</text>
<text class="valT" x="48" y="663">history per agent</text>
</svg>
