<svg xmlns="http://www.w3.org/2000/svg" width="880" height="854" viewBox="0 0 880 854" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="854" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="718" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="718" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Immich does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="edge" d="M62,332 L62,356" marker-end="url(#a)"/>
<path class="hand" d="M408,394.0 C439.0,394.0 439.0,418 470,418" marker-end="url(#a)"/>
<path class="edge" d="M494,488 L494,512" marker-end="url(#a)"/>
<path class="edge" d="M494,608 L494,632" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Download the release compose file and</text>
<text class="t" x="82" y="123">.env, set the photo path and DB</text>
<text class="t" x="82" y="145">password, start it</text>
<text class="c" x="82" y="169">docker compose up -d</text>
<rect class="card" x="40" y="215" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Register the admin in the web UI, then</text>
<text class="t" x="82" y="266">log in from the phone app with your</text>
<text class="t" x="82" y="288">server URL</text>
<text class="c" x="82" y="312">http://&lt;machine-ip-address&gt;:2283</text>
<rect class="card" x="40" y="358" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="358" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="382" r="10"/>
<text class="num" x="62" y="386" text-anchor="middle">3</text>
<text class="t" x="82" y="387">Pick which phone albums to back up and</text>
<text class="t" x="82" y="409">turn backup on</text>
<rect class="cardT" x="472" y="394" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="394" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="418" r="10"/>
<text class="num" x="494" y="422" text-anchor="middle">4</text>
<text class="t" x="514" y="423">The app uploads new photos in the</text>
<text class="t" x="514" y="445">background; the server stores</text>
<text class="t" x="514" y="467">originals and skips duplicates</text>
<rect class="cardT" x="472" y="514" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="514" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="538" r="10"/>
<text class="num" x="494" y="542" text-anchor="middle">5</text>
<text class="t" x="514" y="543">Background jobs make thumbnails,</text>
<text class="t" x="514" y="565">transcode videos and read EXIF for the</text>
<text class="t" x="514" y="587">map</text>
<rect class="cardT" x="472" y="634" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="634" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="658" r="10"/>
<text class="num" x="494" y="662" text-anchor="middle">6</text>
<text class="t" x="514" y="663">The ML container finds faces and</text>
<text class="t" x="514" y="685">computes CLIP vectors, so text search</text>
<text class="t" x="514" y="707">finds photos by content</text>
<rect class="val" x="28" y="760" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="784">VALUE</text>
<text class="valT" x="48" y="808">The family&#x27;s whole photo library is searchable on your own disk, with no cloud subscription</text>
</svg>
