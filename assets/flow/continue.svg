<svg xmlns="http://www.w3.org/2000/svg" width="880" height="724" viewBox="0 0 880 724" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="724" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="588" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="588" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Continue does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,273.5 C439.0,273.5 439.0,297 470,297" marker-end="url(#a)"/>
<path class="hand" d="M472,320.0 C441.0,320.0 441.0,382 410,382" marker-end="url(#a)"/>
<path class="hand" d="M408,405.5 C439.0,405.5 439.0,429 470,429" marker-end="url(#a)"/>
<path class="edge" d="M494,477 L494,501" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install a surface — the editor</text>
<text class="t" x="82" y="123">extension, or the cn command-line</text>
<text class="t" x="82" y="145">agent</text>
<text class="c" x="82" y="169">npm i -g @continuedev/cli</text>
<rect class="card" x="40" y="215" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Declare models, rules and MCP servers</text>
<text class="t" x="82" y="266">once, and commit the file with the</text>
<text class="t" x="82" y="288">repo</text>
<text class="c" x="82" y="312">config.yaml</text>
<rect class="cardT" x="472" y="273" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="273" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="297" r="10"/>
<text class="num" x="494" y="301" text-anchor="middle">3</text>
<text class="t" x="514" y="302">Every surface reads the same config,</text>
<text class="t" x="514" y="324">so the editor and the CLI behave</text>
<text class="t" x="514" y="346">identically</text>
<rect class="card" x="40" y="358" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="358" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="382" r="10"/>
<text class="num" x="62" y="386" text-anchor="middle">4</text>
<text class="t" x="82" y="387">Hand it a task in the editor, or run</text>
<text class="t" x="82" y="409">it headless from a script or CI job</text>
<text class="c" x="82" y="433">cn -p &quot;Review changes&quot;</text>
<rect class="cardT" x="472" y="405" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="405" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="429" r="10"/>
<text class="num" x="494" y="433" text-anchor="middle">5</text>
<text class="t" x="514" y="434">Edits with the configured model and</text>
<text class="t" x="514" y="456">shows a diff you accept or reject</text>
<rect class="cardT" x="472" y="503" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="503" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="527" r="10"/>
<text class="num" x="494" y="531" text-anchor="middle">6</text>
<text class="t" x="514" y="532">In headless mode it answers as JSON,</text>
<text class="t" x="514" y="554">so the pipeline can read the result</text>
<text class="c" x="514" y="578">--format json</text>
<rect class="val" x="28" y="630" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="654">VALUE</text>
<text class="valT" x="48" y="678">One checked-in config defines the agent wherever it runs — the editor, the terminal, or CI</text>
</svg>
