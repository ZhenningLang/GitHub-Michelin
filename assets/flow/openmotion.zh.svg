<svg xmlns="http://www.w3.org/2000/svg" width="880" height="721" viewBox="0 0 880 721" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="721" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="585" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="585" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenMotion 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,313 L62,337" marker-end="url(#a)"/>
<path class="hand" d="M408,364.0 C439.0,364.0 439.0,399 470,399" marker-end="url(#a)"/>
<path class="hand" d="M472,423.5 C441.0,423.5 441.0,447 410,447" marker-end="url(#a)"/>
<path class="hand" d="M408,459.0 C439.0,459.0 439.0,522 470,522" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">克隆仓库、装锁定依赖、构建 Studio 并启动本</text>
<text class="t" x="82" y="123">机服务</text>
<text class="c" x="82" y="147">npm ci · npm run build:studio · npm start</text>
<rect class="card" x="40" y="193" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">在你的 agent 里登记它的 stdio MCP 服务，</text>
<text class="t" x="82" y="244">指向同一个数据目录</text>
<text class="c" x="82" y="268">MOTION_DATA_DIR</text>
<text class="comp" x="82" y="291">组件：mcp.ts</text>
<rect class="card" x="40" y="339" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="339" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="363" r="10"/>
<text class="num" x="62" y="367" text-anchor="middle">3</text>
<text class="t" x="82" y="368">把参考视频或模板、品牌资料和文案交给 agent</text>
<rect class="cardT" x="472" y="375" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="375" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="399" r="10"/>
<text class="num" x="494" y="403" text-anchor="middle">4</text>
<text class="t" x="514" y="404">它的 skill 引导 agent 拆解参考片，把 HTML</text>
<text class="t" x="514" y="426">场景写进工程</text>
<text class="comp" x="514" y="454">组件：openmotion-recreate skill</text>
<rect class="card" x="40" y="423" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="423" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="447" r="10"/>
<text class="num" x="62" y="451" text-anchor="middle">5</text>
<text class="t" x="82" y="452">在 Studio 里看片，自己挪片段或让 agent 再</text>
<text class="t" x="82" y="474">改一版</text>
<rect class="cardT" x="472" y="498" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="498" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="522" r="10"/>
<text class="num" x="494" y="526" text-anchor="middle">6</text>
<text class="t" x="514" y="527">把保存的版本渲染成 MP4，并检查编码、尺寸、</text>
<text class="t" x="514" y="549">帧率、时长和解码</text>
<text class="comp" x="514" y="577">组件：导出任务与校验器</text>
<rect class="val" x="28" y="627" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="651">价值</text>
<text class="valT" x="48" y="675">得到套上你品牌的 MP4 复刻片，HTML 源码仍可再改，不用手调关键帧，也不按渲染次数付费</text>
</svg>
