<svg xmlns="http://www.w3.org/2000/svg" width="880" height="692" viewBox="0 0 880 692" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="692" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="556" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="556" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Raven 做的</text>
<path class="hand" d="M408,138.5 C439.0,138.5 439.0,162 470,162" marker-end="url(#a)"/>
<path class="hand" d="M472,186.5 C441.0,186.5 441.0,255 410,255" marker-end="url(#a)"/>
<path class="hand" d="M408,267.5 C439.0,267.5 439.0,291 470,291" marker-end="url(#a)"/>
<path class="edge" d="M494,364 L494,388" marker-end="url(#a)"/>
<path class="hand" d="M472,427.5 C441.0,427.5 441.0,451 410,451" marker-end="url(#a)"/>
<path class="hand" d="M408,452.0 C439.0,452.0 439.0,515 470,515" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好 Raven，选模型供应商和要启用的内置</text>
<text class="t" x="82" y="123">agent</text>
<text class="c" x="82" y="147">curl -fsSL</text>
<text class="c" x="82" y="166">https://raven.evermind.ai/install.sh |</text>
<text class="c" x="82" y="185">bash · raven onboard</text>
<rect class="cardT" x="472" y="138" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="138" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="162" r="10"/>
<text class="num" x="494" y="166" text-anchor="middle">2</text>
<text class="t" x="514" y="167">把各个 agent 产品拷进你的 raven 目录，登</text>
<text class="t" x="514" y="189">记进可调度名单</text>
<text class="comp" x="514" y="217">组件：agents/ 产品目录</text>
<rect class="card" x="40" y="231" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="255" r="10"/>
<text class="num" x="62" y="259" text-anchor="middle">3</text>
<text class="t" x="82" y="260">打开网页界面，把整件事一次说清</text>
<text class="c" x="82" y="284">raven web</text>
<rect class="cardT" x="472" y="267" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="267" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="291" r="10"/>
<text class="num" x="494" y="295" text-anchor="middle">4</text>
<text class="t" x="514" y="296">拆成带依赖的任务图，每个节点派给名单里的一</text>
<text class="t" x="514" y="318">个 agent</text>
<text class="comp" x="514" y="346">组件：宿主 agent</text>
<rect class="cardT" x="472" y="390" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="390" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="414" r="10"/>
<text class="num" x="494" y="418" text-anchor="middle">5</text>
<text class="t" x="514" y="419">互不依赖的节点并行跑，有风险的动作先问</text>
<text class="comp" x="514" y="447">组件：权限闸门</text>
<rect class="card" x="40" y="427" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="427" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="451" r="10"/>
<text class="num" x="62" y="455" text-anchor="middle">6</text>
<text class="t" x="82" y="456">批准、回答提问，或插话纠正正在跑的子 agent</text>
<rect class="cardT" x="472" y="491" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="491" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="515" r="10"/>
<text class="num" x="494" y="519" text-anchor="middle">7</text>
<text class="t" x="514" y="520">汇总各节点产出交付，并把上下文记到下次会话</text>
<text class="comp" x="514" y="548">组件：EverOS 记忆</text>
<rect class="val" x="28" y="598" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="622">价值</text>
<text class="valT" x="48" y="646">一句需求交给一个入口，不用再在几个 agent 之间来回切换、手工搬运产出</text>
</svg>
