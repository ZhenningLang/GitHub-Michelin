<svg xmlns="http://www.w3.org/2000/svg" width="880" height="684" viewBox="0 0 880 684" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="684" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="548" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="548" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Whiteboard 做的</text>
<path class="hand" d="M408,118.0 C439.0,118.0 439.0,142 470,142" marker-end="url(#a)"/>
<path class="hand" d="M472,175.0 C441.0,175.0 441.0,214 410,214" marker-end="url(#a)"/>
<path class="hand" d="M408,246.0 C439.0,246.0 439.0,282 470,282" marker-end="url(#a)"/>
<path class="hand" d="M472,326.5 C441.0,326.5 441.0,352 410,352" marker-end="url(#a)"/>
<path class="hand" d="M408,384.0 C439.0,384.0 439.0,445 470,445" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">一次性接入</text>
<text class="t" x="82" y="118">安装桌面应用，它会顺带装好 whiteboard CLI</text>
<text class="comp" x="82" y="146">组件：桌面应用</text>
<rect class="cardT" x="472" y="118" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="118" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="142" r="10"/>
<text class="num" x="494" y="146" text-anchor="middle">2</text>
<text class="ph" x="514" y="147">一次性接入</text>
<text class="t" x="514" y="164">桌面应用在本机起服务，托管评审状态、画布与</text>
<text class="t" x="514" y="186">agent 接入</text>
<text class="comp" x="514" y="214">组件：内嵌服务器</text>
<rect class="card" x="40" y="190" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">3</text>
<text class="ph" x="82" y="219">一次性接入</text>
<text class="t" x="82" y="236">运行 connect 命令，把生成的提示词贴给你的</text>
<text class="t" x="82" y="258">agent</text>
<text class="c" x="82" y="282">whiteboard connect &lt;agent&gt;</text>
<rect class="cardT" x="472" y="258" width="368" height="137" rx="8"/>
<rect class="accT" x="472" y="258" width="4" height="137" rx="2"/>
<circle class="accT" cx="494" cy="282" r="10"/>
<text class="num" x="494" y="286" text-anchor="middle">4</text>
<text class="ph" x="514" y="287">一次性接入</text>
<text class="t" x="514" y="304">agent 注册 whiteboard MCP 服务，由它下发</text>
<text class="t" x="514" y="326">编写规范</text>
<text class="c" x="514" y="350">whiteboard mcp</text>
<text class="comp" x="514" y="373">组件：MCP 服务</text>
<rect class="card" x="40" y="328" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="328" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="352" r="10"/>
<text class="num" x="62" y="356" text-anchor="middle">5</text>
<text class="ph" x="82" y="357">每次评审</text>
<text class="t" x="82" y="374">让 agent 评审当前分支相对 main，并叮嘱</text>
<text class="t" x="82" y="396">use whiteboard</text>
<text class="c" x="82" y="420">use whiteboard</text>
<rect class="cardT" x="472" y="421" width="368" height="137" rx="8"/>
<rect class="accT" x="472" y="421" width="4" height="137" rx="2"/>
<circle class="accT" cx="494" cy="445" r="10"/>
<text class="num" x="494" y="449" text-anchor="middle">6</text>
<text class="ph" x="514" y="450">每次评审</text>
<text class="t" x="514" y="467">它钉住提交、读取 diff，在画布上实时绘制章</text>
<text class="t" x="514" y="489">节、图与代码链接</text>
<text class="c" x="514" y="513">session_diff</text>
<text class="comp" x="514" y="536">组件：MCP 工具</text>
<rect class="val" x="28" y="590" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="614">价值</text>
<text class="valT" x="48" y="638">你读到的是 agent 亲笔的可交互 RFC——点图或引文，直接落到本地代码的那一行</text>
</svg>
