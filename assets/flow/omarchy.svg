<svg xmlns="http://www.w3.org/2000/svg" width="880" height="756" viewBox="0 0 880 756" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="756" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="598" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="598" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Omarchy does</text>
<path class="hand" d="M408,140.0 C439.0,140.0 439.0,164 470,164" marker-end="url(#a)"/>
<path class="hand" d="M472,208.0 C441.0,208.0 441.0,258 410,258" marker-end="url(#a)"/>
<path class="hand" d="M408,312.0 C439.0,312.0 439.0,336 470,336" marker-end="url(#a)"/>
<path class="hand" d="M472,356.5 C441.0,356.5 441.0,440 410,440" marker-end="url(#a)"/>
<path class="hand" d="M408,472.0 C439.0,472.0 439.0,496 470,496" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Install</text>
<text class="t" x="82" y="118">Boot the Omarchy ISO from USB with</text>
<text class="t" x="82" y="140">Secure Boot off, answer the questions,</text>
<text class="t" x="82" y="162">pick a drive</text>
<text class="comp" x="82" y="190">component: ISO installer</text>
<rect class="cardT" x="472" y="140" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="140" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="164" r="10"/>
<text class="num" x="494" y="168" text-anchor="middle">2</text>
<text class="ph" x="514" y="169">Install</text>
<text class="t" x="514" y="186">Installs encrypted Arch, Hyprland, its</text>
<text class="t" x="514" y="208">desktop shell and default apps from</text>
<text class="t" x="514" y="230">its own repos</text>
<text class="comp" x="514" y="258">component: omarchy pacman packages</text>
<rect class="card" x="40" y="234" width="368" height="156" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="156" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">3</text>
<text class="ph" x="82" y="263">Customize</text>
<text class="t" x="82" y="280">Put your changes in the override files</text>
<text class="t" x="82" y="302">under ~/.config, e.g. rebind a hotkey</text>
<text class="c" x="82" y="326">o.rebind(&quot;SUPER + SHIFT + O&quot;, &quot;Joplin&quot;,</text>
<text class="c" x="82" y="345">&quot;joplin-desktop&quot;)</text>
<text class="comp" x="82" y="368">component: hypr/bindings.lua</text>
<rect class="cardT" x="472" y="312" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="312" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="336" r="10"/>
<text class="num" x="494" y="340" text-anchor="middle">4</text>
<text class="ph" x="514" y="341">Customize</text>
<text class="t" x="514" y="358">Loads its packaged defaults first,</text>
<text class="t" x="514" y="380">then your override files on top</text>
<rect class="card" x="40" y="416" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="416" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="440" r="10"/>
<text class="num" x="62" y="444" text-anchor="middle">5</text>
<text class="ph" x="82" y="445">Update</text>
<text class="t" x="82" y="462">Update through its own updater, not</text>
<text class="t" x="82" y="484">raw pacman</text>
<text class="c" x="82" y="508">omarchy update</text>
<rect class="cardT" x="472" y="472" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="472" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="496" r="10"/>
<text class="num" x="494" y="500" text-anchor="middle">6</text>
<text class="ph" x="514" y="501">Update</text>
<text class="t" x="514" y="518">Snapshots the root, upgrades packages,</text>
<text class="t" x="514" y="540">runs pending migrations, verifies boot</text>
<text class="t" x="514" y="562">files</text>
<text class="comp" x="514" y="590">component: omarchy-update</text>
<rect class="val" x="28" y="640" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="664">VALUE</text>
<text class="valT" x="48" y="688">A themed, working tiling desktop that keeps up with releases without you re-merging dotfiles</text>
<text class="valT" x="48" y="710">by hand</text>
</svg>
