<svg xmlns="http://www.w3.org/2000/svg" width="880" height="749" viewBox="0 0 880 749" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="749" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="613" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="613" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">pix2tex does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,275.0 C439.0,275.0 439.0,299 470,299" marker-end="url(#a)"/>
<path class="edge" d="M494,369 L494,393" marker-end="url(#a)"/>
<path class="edge" d="M494,489 L494,513" marker-end="url(#a)"/>
<path class="hand" d="M472,551.0 C441.0,551.0 441.0,575 410,575" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install PyTorch, then the package;</text>
<text class="t" x="82" y="123">model checkpoints download on first</text>
<text class="t" x="82" y="145">run</text>
<text class="c" x="82" y="169">pip install &quot;pix2tex[gui]&quot;</text>
<rect class="card" x="40" y="215" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Open the GUI and drag a box around an</text>
<text class="t" x="82" y="266">equation on screen</text>
<text class="c" x="82" y="290">latexocr</text>
<text class="comp" x="82" y="313">component: screenshot GUI</text>
<rect class="cardT" x="472" y="275" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="275" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="299" r="10"/>
<text class="num" x="494" y="303" text-anchor="middle">3</text>
<text class="t" x="514" y="304">A small network picks the best</text>
<text class="t" x="514" y="326">resolution and resizes the crop to</text>
<text class="t" x="514" y="348">look like training data</text>
<rect class="cardT" x="472" y="395" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="395" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="419" r="10"/>
<text class="num" x="494" y="423" text-anchor="middle">4</text>
<text class="t" x="514" y="424">The image encoder reads the crop; the</text>
<text class="t" x="514" y="446">decoder writes LaTeX one token at a</text>
<text class="t" x="514" y="468">time</text>
<rect class="cardT" x="472" y="515" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="515" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="539" r="10"/>
<text class="num" x="494" y="543" text-anchor="middle">5</text>
<text class="t" x="514" y="544">Renders the result with MathJax and</text>
<text class="t" x="514" y="566">copies the LaTeX to your clipboard</text>
<rect class="card" x="40" y="551" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="551" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="575" r="10"/>
<text class="num" x="62" y="579" text-anchor="middle">6</text>
<text class="t" x="82" y="580">Compare the preview with the original,</text>
<text class="t" x="82" y="602">then paste it into your document</text>
<rect class="val" x="28" y="655" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="679">VALUE</text>
<text class="valT" x="48" y="703">Equations become compilable LaTeX without retyping, and the image never leaves your machine</text>
</svg>
