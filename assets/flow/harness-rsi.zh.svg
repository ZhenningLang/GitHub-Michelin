<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="400" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="264" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="264" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Harness-RSI</text>
<path class="hand" d="M408,97.0 C439.0,97.0 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,133.0 C441.0,133.0 441.0,172 410,172" marker-end="url(#a)"/>
<path class="hand" d="M408,173.0 C439.0,173.0 439.0,208 470,208" marker-end="url(#a)"/>
<path class="hand" d="M472,209.0 C441.0,209.0 441.0,248 410,248" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">带着具体评价问题打开阅读指南</text>
<rect class="cardT" x="472" y="108" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">按修改对象分类，并提供可搜索证据</text>
<rect class="card" x="40" y="148" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="148" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="172" r="10"/>
<text class="num" x="62" y="176" text-anchor="middle">3</text>
<text class="t" x="82" y="177">选择方法并打开其主要比较</text>
<rect class="cardT" x="472" y="184" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="184" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="208" r="10"/>
<text class="num" x="494" y="212" text-anchor="middle">4</text>
<text class="t" x="514" y="213">分开展示四项判定、依据及覆盖范围</text>
<rect class="card" x="40" y="224" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="224" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="248" r="10"/>
<text class="num" x="62" y="252" text-anchor="middle">5</text>
<text class="t" x="82" y="253">核对原报告，再将结论用于自己的评价协议</text>
<rect class="val" x="28" y="306" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="330">价值</text>
<text class="valT" x="48" y="354">得到可追溯的评价地图，而非未经验证的自进化承诺</text>
</svg>
