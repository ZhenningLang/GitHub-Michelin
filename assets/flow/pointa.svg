<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="780" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="644" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="644" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Pointa does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,290.0 C439.0,290.0 439.0,314 470,314" marker-end="url(#a)"/>
<path class="hand" d="M472,334.5 C441.0,334.5 441.0,418 410,418" marker-end="url(#a)"/>
<path class="hand" d="M408,438.5 C439.0,438.5 439.0,462 470,462" marker-end="url(#a)"/>
<path class="hand" d="M472,482.5 C441.0,482.5 441.0,533 410,533" marker-end="url(#a)"/>
<path class="hand" d="M408,565.0 C439.0,565.0 439.0,589 470,589" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Set up once</text>
<text class="t" x="82" y="118">Install the extension from the Chrome</text>
<text class="t" x="82" y="140">Web Store</text>
<text class="comp" x="82" y="168">component: browser extension</text>
<rect class="card" x="40" y="212" width="368" height="156" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="156" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="ph" x="82" y="241">Set up once</text>
<text class="t" x="82" y="258">Register the MCP entry in your agent</text>
<text class="t" x="82" y="280">config</text>
<text class="c" x="82" y="304">claude mcp add --transport stdio pointa --</text>
<text class="c" x="82" y="323">npx -y pointa-server</text>
<text class="comp" x="82" y="346">component: pointa-server</text>
<rect class="cardT" x="472" y="290" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="290" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="314" r="10"/>
<text class="num" x="494" y="318" text-anchor="middle">3</text>
<text class="ph" x="514" y="319">Set up once</text>
<text class="t" x="514" y="336">Starts a local HTTP daemon and file</text>
<text class="t" x="514" y="358">store under ~/.pointa</text>
<rect class="card" x="40" y="394" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="394" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="418" r="10"/>
<text class="num" x="62" y="422" text-anchor="middle">4</text>
<text class="ph" x="82" y="423">Every bug</text>
<text class="t" x="82" y="440">Open the localhost app, click the</text>
<text class="t" x="82" y="462">icon, annotate elements</text>
<rect class="cardT" x="472" y="438" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="438" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="462" r="10"/>
<text class="num" x="494" y="466" text-anchor="middle">5</text>
<text class="ph" x="514" y="467">Every bug</text>
<text class="t" x="514" y="484">Anchors feedback per page and route,</text>
<text class="t" x="514" y="506">with screenshots for bug reports</text>
<rect class="card" x="40" y="509" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="509" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="533" r="10"/>
<text class="num" x="62" y="537" text-anchor="middle">6</text>
<text class="ph" x="82" y="538">Every bug</text>
<text class="t" x="82" y="555">Optionally wrap the dev command to</text>
<text class="t" x="82" y="577">capture backend logs</text>
<text class="c" x="82" y="601">pointa dev npm run dev</text>
<rect class="cardT" x="472" y="565" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="565" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="589" r="10"/>
<text class="num" x="494" y="593" text-anchor="middle">7</text>
<text class="ph" x="514" y="594">Every bug</text>
<text class="t" x="514" y="611">The agent reads the annotations over</text>
<text class="t" x="514" y="633">MCP when you say implement</text>
<rect class="val" x="28" y="686" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="710">VALUE</text>
<text class="valT" x="48" y="734">Designers and QA hand the coding agent Figma-style feedback without ever touching the repo.</text>
</svg>
