<svg xmlns="http://www.w3.org/2000/svg" width="880" height="787" viewBox="0 0 880 787" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="787" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="651" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="651" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">CrowdGPT client</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,273.5 C439.0,273.5 439.0,297 470,297" marker-end="url(#a)"/>
<path class="edge" d="M494,345 L494,369" marker-end="url(#a)"/>
<path class="edge" d="M494,443 L494,467" marker-end="url(#a)"/>
<path class="edge" d="M494,541 L494,565" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Review pinned source and install</text>
<text class="t" x="82" y="123">hardware-matched dependencies in</text>
<text class="t" x="82" y="145">isolation</text>
<text class="c" x="82" y="169">pip install -r requirements.txt</text>
<rect class="card" x="40" y="215" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Launch, choose coordinator, identity</text>
<text class="t" x="82" y="266">and backend budget, then start</text>
<text class="t" x="82" y="288">training</text>
<text class="c" x="82" y="312">python client.py</text>
<rect class="cardT" x="472" y="273" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="273" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="297" r="10"/>
<text class="num" x="494" y="301" text-anchor="middle">3</text>
<text class="t" x="514" y="302">Waits for a round and requests task</text>
<text class="t" x="514" y="324">metadata from the central coordinator</text>
<rect class="cardT" x="472" y="371" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="371" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="395" r="10"/>
<text class="num" x="494" y="399" text-anchor="middle">4</text>
<text class="t" x="514" y="400">Downloads assigned model weights and</text>
<text class="t" x="514" y="422">token slices</text>
<rect class="cardT" x="472" y="469" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="469" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="493" r="10"/>
<text class="num" x="494" y="497" text-anchor="middle">5</text>
<text class="t" x="514" y="498">Trains locally; displays or logs loss,</text>
<text class="t" x="514" y="520">steps and remaining time locally</text>
<rect class="cardT" x="472" y="567" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="567" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="591" r="10"/>
<text class="num" x="494" y="595" text-anchor="middle">6</text>
<text class="t" x="514" y="596">Attempts to upload the compressed</text>
<text class="t" x="514" y="618">delta and final metadata, then logs</text>
<text class="t" x="514" y="640">the result</text>
<rect class="val" x="28" y="693" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="717">VALUE</text>
<text class="valT" x="48" y="741">Contribute local compute to a shared experiment without operating a training cluster</text>
</svg>
