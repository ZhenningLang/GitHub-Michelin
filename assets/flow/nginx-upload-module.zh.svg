<svg xmlns="http://www.w3.org/2000/svg" width="880" height="650" viewBox="0 0 880 650" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="650" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="514" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="514" rx="10"/>
<rect class="pillT" x="474" y="40" width="243.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">nginx-upload-module 做的</text>
<path class="edge" d="M62,122 L62,146" marker-end="url(#a)"/>
<path class="edge" d="M62,268 L62,292" marker-end="url(#a)"/>
<path class="hand" d="M408,340.0 C439.0,340.0 439.0,364 470,364" marker-end="url(#a)"/>
<path class="edge" d="M494,412 L494,436" marker-end="url(#a)"/>
<path class="hand" d="M472,474.0 C441.0,474.0 441.0,498 410,498" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">编译 NGINX，把模块编进去</text>
<rect class="card" x="40" y="148" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="148" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="172" r="10"/>
<text class="num" x="62" y="176" text-anchor="middle">2</text>
<text class="t" x="82" y="177">在上传 location 里指定文件落盘目录和接请求</text>
<text class="t" x="82" y="199">的后端</text>
<text class="c" x="82" y="223">upload_store /tmp 1 · upload_pass @test</text>
<text class="comp" x="82" y="246">组件：nginx.conf 指令</text>
<rect class="card" x="40" y="294" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="294" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="318" r="10"/>
<text class="num" x="62" y="322" text-anchor="middle">3</text>
<text class="t" x="82" y="323">声明转发表单里用哪些字段替代每个文件</text>
<text class="c" x="82" y="347">upload_set_form_field</text>
<text class="c" x="82" y="366">$upload_field_name.path &quot;$upload_tmp_path&quot;</text>
<rect class="cardT" x="472" y="340" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="340" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="364" r="10"/>
<text class="num" x="494" y="368" text-anchor="middle">4</text>
<text class="t" x="514" y="369">边收边解析 multipart 请求体，把每个文件写</text>
<text class="t" x="514" y="391">进 upload_store</text>
<rect class="cardT" x="472" y="438" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="438" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="462" r="10"/>
<text class="num" x="494" y="466" text-anchor="middle">5</text>
<text class="t" x="514" y="467">去掉文件字节，填上文件名、类型、路径（及</text>
<text class="t" x="514" y="489">md5、大小），把表单转给后端</text>
<rect class="card" x="40" y="474" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="474" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="498" r="10"/>
<text class="num" x="62" y="502" text-anchor="middle">6</text>
<text class="t" x="82" y="503">后端读路径字段，直接搬走或处理磁盘上的文件</text>
<rect class="val" x="28" y="556" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="580">价值</text>
<text class="valT" x="48" y="604">慢速大文件上传由 NGINX 接住，应用只收到一个描述已落盘文件的小 POST</text>
</svg>
