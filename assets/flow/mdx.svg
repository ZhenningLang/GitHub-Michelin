<svg xmlns="http://www.w3.org/2000/svg" width="880" height="688" viewBox="0 0 880 688" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="688" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="530" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="530" rx="10"/>
<rect class="pillT" x="474" y="40" width="101.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">MDX does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,272.0 C439.0,272.0 439.0,296 470,296" marker-end="url(#a)"/>
<path class="edge" d="M494,344 L494,368" marker-end="url(#a)"/>
<path class="hand" d="M472,406.0 C441.0,406.0 441.0,430 410,430" marker-end="url(#a)"/>
<path class="hand" d="M408,453.5 C439.0,453.5 439.0,492 470,492" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the compiler, or the</text>
<text class="t" x="82" y="123">integration for the bundler you</text>
<text class="t" x="82" y="145">already use</text>
<text class="c" x="82" y="169">npm install @mdx-js/mdx</text>
<rect class="card" x="40" y="215" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Write .mdx: Markdown plus imports,</text>
<text class="t" x="82" y="266">exports and JSX in the prose</text>
<text class="c" x="82" y="290">import {Chart} from &#x27;./snowfall.js&#x27; ·</text>
<text class="c" x="82" y="309">&lt;Chart year={year} color=&quot;#fcb32c&quot; /&gt;</text>
<rect class="cardT" x="472" y="272" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="272" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="296" r="10"/>
<text class="num" x="494" y="300" text-anchor="middle">3</text>
<text class="t" x="514" y="301">remark-mdx parses the MDX syntax and</text>
<text class="t" x="514" y="323">the document becomes an AST</text>
<rect class="cardT" x="472" y="370" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="370" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="394" r="10"/>
<text class="num" x="494" y="398" text-anchor="middle">4</text>
<text class="t" x="514" y="399">Compiles that AST into a JavaScript</text>
<text class="t" x="514" y="421">module</text>
<rect class="card" x="40" y="406" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="406" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="430" r="10"/>
<text class="num" x="62" y="434" text-anchor="middle">5</text>
<text class="t" x="82" y="435">Build it through your bundler, or</text>
<text class="t" x="82" y="457">evaluate it directly</text>
<text class="c" x="82" y="481">compile() · evaluate() · @mdx-js/rollup</text>
<rect class="cardT" x="472" y="468" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="468" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="492" r="10"/>
<text class="num" x="494" y="496" text-anchor="middle">6</text>
<text class="t" x="514" y="497">Your framework renders it with the</text>
<text class="t" x="514" y="519">components you imported</text>
<rect class="val" x="28" y="572" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="596">VALUE</text>
<text class="valT" x="48" y="620">Prose and live application components compile into one tree, with no parallel copy of the</text>
<text class="valT" x="48" y="642">content to maintain</text>
</svg>
