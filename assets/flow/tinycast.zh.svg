<svg xmlns="http://www.w3.org/2000/svg" width="880" height="673" viewBox="0 0 880 673" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="673" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="537" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="537" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Tinycast 做的</text>
<path class="hand" d="M408,117.0 C439.0,117.0 439.0,141 470,141" marker-end="url(#a)"/>
<path class="hand" d="M472,150.5 C441.0,150.5 441.0,212 410,212" marker-end="url(#a)"/>
<path class="edge" d="M62,278 L62,302" marker-end="url(#a)"/>
<path class="hand" d="M408,337.5 C439.0,337.5 439.0,364 470,364" marker-end="url(#a)"/>
<path class="hand" d="M472,386.0 C441.0,386.0 441.0,421 410,421" marker-end="url(#a)"/>
<path class="hand" d="M408,442.0 C439.0,442.0 439.0,482 470,482" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">一次性设置</text>
<text class="t" x="82" y="118">用 Homebrew 装上并打开应用</text>
<text class="c" x="82" y="142">brew install --cask tinycast</text>
<rect class="cardT" x="472" y="117" width="368" height="67" rx="8"/>
<rect class="accT" x="472" y="117" width="4" height="67" rx="2"/>
<circle class="accT" cx="494" cy="141" r="10"/>
<text class="num" x="494" y="145" text-anchor="middle">2</text>
<text class="ph" x="514" y="146">一次性设置</text>
<text class="t" x="514" y="163">常驻菜单栏，内存占用不到 100 MB</text>
<rect class="card" x="40" y="188" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="188" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="212" r="10"/>
<text class="num" x="62" y="216" text-anchor="middle">3</text>
<text class="ph" x="82" y="217">一次性设置</text>
<text class="t" x="82" y="234">在设置里录一个全局快捷键</text>
<text class="c" x="82" y="258">Settings → General</text>
<rect class="card" x="40" y="304" width="368" height="67" rx="8"/>
<rect class="accY" x="40" y="304" width="4" height="67" rx="2"/>
<circle class="accY" cx="62" cy="328" r="10"/>
<text class="num" x="62" y="332" text-anchor="middle">4</text>
<text class="ph" x="82" y="333">每次唤出</text>
<text class="t" x="82" y="350">在任何应用里按下快捷键，敲几个字母</text>
<rect class="cardT" x="472" y="340" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="340" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="364" r="10"/>
<text class="num" x="494" y="368" text-anchor="middle">5</text>
<text class="ph" x="514" y="369">每次唤出</text>
<text class="t" x="514" y="386">面板对应用、命令和剪贴板历史做模糊过滤</text>
<text class="comp" x="514" y="414">组件：命令面板</text>
<rect class="card" x="40" y="397" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="397" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="421" r="10"/>
<text class="num" x="62" y="425" text-anchor="middle">6</text>
<text class="ph" x="82" y="426">每次唤出</text>
<text class="t" x="82" y="443">回车选中榜首项</text>
<text class="c" x="82" y="467">↵</text>
<rect class="cardT" x="472" y="458" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="458" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="482" r="10"/>
<text class="num" x="494" y="486" text-anchor="middle">7</text>
<text class="ph" x="514" y="487">每次唤出</text>
<text class="t" x="514" y="504">启动它——应用、快捷链接、片段或 Raycas</text>
<text class="t" x="514" y="526">t 扩展</text>
<rect class="val" x="28" y="579" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="603">价值</text>
<text class="valT" x="48" y="627">全天要用的东西都归一个快捷键管——不用翻 Dock、不用记各应用的菜单、也不用再装一个剪贴板工具</text>
</svg>
