<svg xmlns="http://www.w3.org/2000/svg" width="880" height="686" viewBox="0 0 880 686" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="686" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="550" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="550" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">garak 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,217.0 C439.0,217.0 439.0,241 470,241" marker-end="url(#a)"/>
<path class="edge" d="M494,314 L494,338" marker-end="url(#a)"/>
<path class="edge" d="M494,437 L494,461" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">安装，并导出目标服务商的 API key</text>
<text class="c" x="82" y="125">python -m pip install -U garak</text>
<rect class="card" x="40" y="171" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">指定要扫的模型和要跑的探针类别</text>
<text class="c" x="82" y="224">garak --target_type openai --target_name</text>
<text class="c" x="82" y="243">gpt-5-nano --spec probes.encoding</text>
<rect class="cardT" x="472" y="217" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="217" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="241" r="10"/>
<text class="num" x="494" y="245" text-anchor="middle">3</text>
<text class="t" x="514" y="246">把这些探针的攻击提示逐条发给模型，每</text>
<text class="t" x="514" y="268">条生成多次</text>
<text class="comp" x="514" y="296">组件：探针 + 生成器</text>
<rect class="cardT" x="472" y="340" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="340" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="364" r="10"/>
<text class="num" x="494" y="368" text-anchor="middle">4</text>
<text class="t" x="514" y="369">用每个探针配套的检测器判读回复，按探针输出</text>
<text class="t" x="514" y="391">失败率</text>
<text class="comp" x="514" y="419">组件：检测器</text>
<rect class="cardT" x="472" y="463" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="463" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="487" r="10"/>
<text class="num" x="494" y="491" text-anchor="middle">5</text>
<text class="t" x="514" y="492">写出 JSONL 报告和一份命中日志，列出让模型</text>
<text class="t" x="514" y="514">失守的提示</text>
<text class="comp" x="514" y="542">组件：报告 + 命中日志</text>
<rect class="val" x="28" y="592" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="616">价值</text>
<text class="valT" x="48" y="640">上线前拿到可重复的、按攻击类型统计的失败率，而不是手动试几个越狱提示</text>
</svg>
