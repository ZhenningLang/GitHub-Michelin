<svg xmlns="http://www.w3.org/2000/svg" width="880" height="688" viewBox="0 0 880 688" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="688" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="552" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="552" rx="10"/>
<rect class="pillT" x="474" y="40" width="151.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">LibreChat 做的</text>
<path class="edge" d="M62,183 L62,207" marker-end="url(#a)"/>
<path class="hand" d="M408,245.5 C439.0,245.5 439.0,269 470,269" marker-end="url(#a)"/>
<path class="hand" d="M472,293.5 C441.0,293.5 441.0,332 410,332" marker-end="url(#a)"/>
<path class="edge" d="M62,403 L62,427" marker-end="url(#a)"/>
<path class="hand" d="M408,465.5 C439.0,465.5 439.0,489 470,489" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">克隆仓库，复制 env 模板，填好服务商 key</text>
<text class="c" x="82" y="125">git clone</text>
<text class="c" x="82" y="144">https://github.com/LibreChat-AI/LibreChat.</text>
<text class="c" x="82" y="163">git · cp .env.example .env</text>
<rect class="card" x="40" y="209" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="209" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="233" r="10"/>
<text class="num" x="62" y="237" text-anchor="middle">2</text>
<text class="t" x="82" y="238">启动 compose 整套服务</text>
<text class="c" x="82" y="262">docker compose up -d</text>
<rect class="cardT" x="472" y="245" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="245" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="269" r="10"/>
<text class="num" x="494" y="273" text-anchor="middle">3</text>
<text class="t" x="514" y="274">拉起应用及 MongoDB、搜索、向量库和 RA</text>
<text class="t" x="514" y="296">G 服务</text>
<text class="comp" x="514" y="324">组件：docker-compose 服务组</text>
<rect class="card" x="40" y="308" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="308" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="332" r="10"/>
<text class="num" x="62" y="336" text-anchor="middle">4</text>
<text class="t" x="82" y="337">在 librechat.yaml 里声明 Ollama 等</text>
<text class="t" x="82" y="359">额外端点</text>
<text class="c" x="82" y="383">librechat.yaml</text>
<rect class="card" x="40" y="429" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="429" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="453" r="10"/>
<text class="num" x="62" y="457" text-anchor="middle">5</text>
<text class="t" x="82" y="458">用户注册或登录，在菜单里挑模型开聊</text>
<text class="c" x="82" y="482">http://localhost:3080</text>
<rect class="cardT" x="472" y="465" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="465" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="489" r="10"/>
<text class="num" x="494" y="493" text-anchor="middle">6</text>
<text class="t" x="514" y="494">把每条消息转给所选服务商，流式返回，并按用</text>
<text class="t" x="514" y="516">户存档</text>
<text class="comp" x="514" y="544">组件：API + MongoDB</text>
<rect class="val" x="28" y="594" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="618">价值</text>
<text class="valT" x="48" y="642">一个统一登录、可搜索的聊天工作台接入所有服务商，历史和文件都留在自己服务器上</text>
</svg>
