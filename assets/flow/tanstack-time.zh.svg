<svg xmlns="http://www.w3.org/2000/svg" width="880" height="573" viewBox="0 0 880 573" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="573" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="437" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="437" rx="10"/>
<rect class="pillT" x="474" y="40" width="187.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TanStack Time 做的</text>
<path class="hand" d="M408,130.5 C439.0,130.5 439.0,154 470,154" marker-end="url(#a)"/>
<path class="hand" d="M472,166.0 C441.0,166.0 441.0,239 410,239" marker-end="url(#a)"/>
<path class="hand" d="M408,261.0 C439.0,261.0 439.0,285 470,285" marker-end="url(#a)"/>
<path class="hand" d="M472,309.5 C441.0,309.5 441.0,357 410,357" marker-end="url(#a)"/>
<path class="hand" d="M408,390.0 C439.0,390.0 439.0,414 470,414" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用你的事件、资源和时区创建日历</text>
<text class="c" x="82" y="125">useCalendar({ viewMode, events, resources,</text>
<text class="c" x="82" y="144">timeZone })</text>
<text class="comp" x="82" y="167">组件：useCalendar 钩子</text>
<rect class="cardT" x="472" y="130" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="130" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="154" r="10"/>
<text class="num" x="494" y="158" text-anchor="middle">2</text>
<text class="t" x="514" y="159">为当前周期构建日期网格，把重复事件展开成单</text>
<text class="t" x="514" y="181">次出现</text>
<rect class="card" x="40" y="215" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">3</text>
<text class="t" x="82" y="244">从自己的接口或存储返回可见范围内的事件</text>
<text class="c" x="82" y="268">fetchEvents: async ({ start, end }) =&gt;</text>
<text class="c" x="82" y="287">events</text>
<rect class="cardT" x="472" y="261" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="261" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="285" r="10"/>
<text class="num" x="494" y="289" text-anchor="middle">4</text>
<text class="t" x="514" y="290">只拉取需要的范围，并否决违反可用性或容量规</text>
<text class="t" x="514" y="312">则的移动</text>
<text class="comp" x="514" y="340">组件：内核与校验核心</text>
<rect class="card" x="40" y="333" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">5</text>
<text class="t" x="82" y="362">用自己的标记渲染日期与事件，接上拖拽</text>
<text class="t" x="82" y="384">调整的手柄</text>
<text class="c" x="82" y="408">calendar.getDaysNames(&#x27;short&#x27;) ·</text>
<text class="c" x="82" y="427">calendar.getEventProps(event)</text>
<rect class="cardT" x="472" y="390" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="390" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="414" r="10"/>
<text class="num" x="494" y="418" text-anchor="middle">6</text>
<text class="t" x="514" y="419">每次编辑后重算投影并记录撤销日志</text>
<rect class="val" x="28" y="479" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="503">价值</text>
<text class="valT" x="48" y="527">重复展开、夏令时安全网格、冲突否决、撤销都不用自己写，DOM 全归你（今天需从 pre-alpha 分支引源码）</text>
</svg>
