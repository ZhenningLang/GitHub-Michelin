<svg xmlns="http://www.w3.org/2000/svg" width="880" height="622" viewBox="0 0 880 622" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="622" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="486" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="486" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Windows-MCP 做的</text>
<path class="hand" d="M408,130.5 C439.0,130.5 439.0,154 470,154" marker-end="url(#a)"/>
<path class="hand" d="M472,190.0 C441.0,190.0 441.0,239 410,239" marker-end="url(#a)"/>
<path class="hand" d="M408,251.0 C439.0,251.0 439.0,300 470,300" marker-end="url(#a)"/>
<path class="edge" d="M494,373 L494,397" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 MCP 客户端里登记一次这个服务</text>
<text class="c" x="82" y="125">claude mcp add --transport stdio</text>
<text class="c" x="82" y="144">windows-mcp -- uvx windows-mcp serve</text>
<text class="comp" x="82" y="167">组件：MCP 客户端配置</text>
<rect class="cardT" x="472" y="130" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="130" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="154" r="10"/>
<text class="num" x="494" y="158" text-anchor="middle">2</text>
<text class="t" x="514" y="159">在你的 Windows 会话里经 stdio 启动，暴露</text>
<text class="t" x="514" y="181">点击、输入、快照等工具</text>
<text class="c" x="514" y="205">uvx windows-mcp serve</text>
<text class="comp" x="514" y="228">组件：windows-mcp 服务进程</text>
<rect class="card" x="40" y="215" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">3</text>
<text class="t" x="82" y="244">用大白话让 agent 去某个原生 Windows 程序</text>
<text class="t" x="82" y="266">里办事</text>
<rect class="cardT" x="472" y="276" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="276" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="300" r="10"/>
<text class="num" x="494" y="304" text-anchor="middle">4</text>
<text class="t" x="514" y="305">读窗口的无障碍树，列出带编号和坐标的</text>
<text class="t" x="514" y="327">可点元素</text>
<text class="comp" x="514" y="355">组件：Snapshot 工具</text>
<rect class="cardT" x="472" y="399" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="399" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="423" r="10"/>
<text class="num" x="494" y="427" text-anchor="middle">5</text>
<text class="t" x="514" y="428">把选中的编号换成屏幕坐标，注入真实的鼠标键</text>
<text class="t" x="514" y="450">盘输入</text>
<text class="comp" x="514" y="478">组件：Click / Type 工具</text>
<rect class="val" x="28" y="528" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="552">价值</text>
<text class="valT" x="48" y="576">agent 按控件名而不是写死的像素去操作原生 Windows 程序，你不用写一行自动化脚本</text>
</svg>
