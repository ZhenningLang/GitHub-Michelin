<svg xmlns="http://www.w3.org/2000/svg" width="880" height="828" viewBox="0 0 880 828" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="828" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="670" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="670" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">boilerpipe does</text>
<path class="edge" d="M62,166 L62,190" marker-end="url(#a)"/>
<path class="edge" d="M62,306 L62,330" marker-end="url(#a)"/>
<path class="hand" d="M408,368.5 C439.0,368.5 439.0,392 470,392" marker-end="url(#a)"/>
<path class="edge" d="M494,462 L494,486" marker-end="url(#a)"/>
<path class="edge" d="M494,582 L494,606" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Build the Maven project from source</text>
<text class="t" x="82" y="123">and put its jar on your classpath (no</text>
<text class="t" x="82" y="145">recent release)</text>
<rect class="card" x="40" y="192" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="192" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="216" r="10"/>
<text class="num" x="62" y="220" text-anchor="middle">2</text>
<text class="t" x="82" y="221">Fetch the page yourself and pick a</text>
<text class="t" x="82" y="243">named extractor for it</text>
<text class="c" x="82" y="267">ArticleExtractor · DefaultExtractor ·</text>
<text class="c" x="82" y="286">CommonExtractors.CANOLA_EXTRACTOR</text>
<rect class="card" x="40" y="332" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="332" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="356" r="10"/>
<text class="num" x="62" y="360" text-anchor="middle">3</text>
<text class="t" x="82" y="361">Hand it the HTML</text>
<text class="c" x="82" y="385">ArticleExtractor.INSTANCE.getText(html)</text>
<rect class="cardT" x="472" y="368" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="368" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="392" r="10"/>
<text class="num" x="494" y="396" text-anchor="middle">4</text>
<text class="t" x="514" y="397">Parses the HTML with its bundled</text>
<text class="t" x="514" y="419">NekoHTML into a sequence of text</text>
<text class="t" x="514" y="441">blocks</text>
<rect class="cardT" x="472" y="488" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="488" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="512" r="10"/>
<text class="num" x="494" y="516" text-anchor="middle">5</text>
<text class="t" x="514" y="517">Scores each block on shallow features</text>
<text class="t" x="514" y="539">like word count and link density;</text>
<text class="t" x="514" y="561">drops boilerplate</text>
<rect class="cardT" x="472" y="608" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="608" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="632" r="10"/>
<text class="num" x="494" y="636" text-anchor="middle">6</text>
<text class="t" x="514" y="637">Returns the blocks it kept as plain</text>
<text class="t" x="514" y="659">text</text>
<rect class="val" x="28" y="712" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="736">VALUE</text>
<text class="valT" x="48" y="760">The article body without menus, footers and link lists, inside a JVM process with no external</text>
<text class="valT" x="48" y="782">service</text>
</svg>
