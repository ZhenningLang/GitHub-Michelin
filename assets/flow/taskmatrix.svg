<svg xmlns="http://www.w3.org/2000/svg" width="880" height="860" viewBox="0 0 880 860" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="860" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="724" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="724" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TaskMatrix does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="edge" d="M62,329 L62,353" marker-end="url(#a)"/>
<path class="hand" d="M408,412.0 C439.0,412.0 439.0,436 470,436" marker-end="url(#a)"/>
<path class="hand" d="M472,460.5 C441.0,460.5 441.0,519 410,519" marker-end="url(#a)"/>
<path class="hand" d="M408,542.5 C439.0,542.5 439.0,566 470,566" marker-end="url(#a)"/>
<path class="edge" d="M494,636 L494,660" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone, create a Python 3.8 env,</text>
<text class="t" x="82" y="123">install requirements plus</text>
<text class="t" x="82" y="145">GroundingDINO and segment-anything</text>
<text class="c" x="82" y="169">pip install -r requirements.txt</text>
<rect class="card" x="40" y="215" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Export your OpenAI key for the</text>
<text class="t" x="82" y="266">controller LLM</text>
<text class="c" x="82" y="290">export</text>
<text class="c" x="82" y="309">OPENAI_API_KEY={Your_Private_Openai_Key}</text>
<rect class="card" x="40" y="355" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="355" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="379" r="10"/>
<text class="num" x="62" y="383" text-anchor="middle">3</text>
<text class="t" x="82" y="384">Start it, naming which visual models</text>
<text class="t" x="82" y="406">load on which device</text>
<text class="c" x="82" y="430">python visual_chatgpt.py --load</text>
<text class="c" x="82" y="449">&quot;ImageCaptioning_cuda:0,Text2Image_cuda:0&quot;</text>
<rect class="cardT" x="472" y="412" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="412" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="436" r="10"/>
<text class="num" x="494" y="440" text-anchor="middle">4</text>
<text class="t" x="514" y="441">Loads those models as LangChain tools</text>
<text class="t" x="514" y="463">and opens a Gradio chat page</text>
<text class="comp" x="514" y="491">component: visual_chatgpt.py</text>
<rect class="card" x="40" y="495" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="495" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="519" r="10"/>
<text class="num" x="62" y="523" text-anchor="middle">5</text>
<text class="t" x="82" y="524">Upload an image and ask for something</text>
<text class="t" x="82" y="546">in plain words</text>
<text class="c" x="82" y="570">find xxx in the image</text>
<rect class="cardT" x="472" y="542" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="542" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="566" r="10"/>
<text class="num" x="494" y="570" text-anchor="middle">6</text>
<text class="t" x="514" y="571">The LLM reads the tool list, picks a</text>
<text class="t" x="514" y="593">model, runs it, and saves the result</text>
<text class="t" x="514" y="615">as image/xxx.png</text>
<rect class="cardT" x="472" y="662" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="662" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="686" r="10"/>
<text class="num" x="494" y="690" text-anchor="middle">7</text>
<text class="t" x="514" y="691">Replies in words with the new image</text>
<text class="t" x="514" y="713">threaded back into the chat</text>
<rect class="val" x="28" y="766" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="790">VALUE</text>
<text class="valT" x="48" y="814">A text-only chatbot that can see and edit images by delegating to specialist vision models</text>
</svg>
