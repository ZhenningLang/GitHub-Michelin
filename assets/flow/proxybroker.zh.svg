<svg xmlns="http://www.w3.org/2000/svg" width="880" height="612" viewBox="0 0 880 612" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="612" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="476" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="476" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">ProxyBroker 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,240.5 C439.0,240.5 439.0,264 470,264" marker-end="url(#a)"/>
<path class="edge" d="M494,290 L494,314" marker-end="url(#a)"/>
<path class="hand" d="M472,352.0 C441.0,352.0 441.0,376 410,376" marker-end="url(#a)"/>
<path class="hand" d="M408,377.0 C439.0,377.0 439.0,438 470,438" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从 PyPI 装上这个包</text>
<text class="c" x="82" y="125">pip install proxybroker</text>
<rect class="card" x="40" y="171" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">起一个本地轮换服务器，说明要哪类代理、什么</text>
<text class="t" x="82" y="222">匿名级别</text>
<text class="c" x="82" y="246">proxybroker serve --host 127.0.0.1 --port</text>
<text class="c" x="82" y="265">8888 --types HTTP HTTPS --lvl High</text>
<text class="comp" x="82" y="288">组件：proxybroker 命令行</text>
<rect class="cardT" x="472" y="240" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="240" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="264" r="10"/>
<text class="num" x="494" y="268" text-anchor="middle">3</text>
<text class="t" x="514" y="269">从约 50 个公开代理列表抓候选地址，去掉重复</text>
<rect class="cardT" x="472" y="316" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="316" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="340" r="10"/>
<text class="num" x="494" y="344" text-anchor="middle">4</text>
<text class="t" x="514" y="345">并发检查每个候选的协议、匿名级别和</text>
<text class="t" x="514" y="367">Cookie/Referer 支持，留下活的</text>
<rect class="card" x="40" y="352" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">5</text>
<text class="t" x="82" y="381">把爬虫的 HTTP 代理设置指向这个本地端口</text>
<rect class="cardT" x="472" y="414" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="414" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="438" r="10"/>
<text class="num" x="494" y="442" text-anchor="middle">6</text>
<text class="t" x="514" y="443">把每个进来的请求转给池里的某个代理，</text>
<text class="t" x="514" y="465">自动轮换</text>
<rect class="val" x="28" y="518" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="542">价值</text>
<text class="valT" x="48" y="566">一个本地端点在免费、已检查过的公开代理间轮换，不用买代理；但池子和免费代理一样不稳</text>
</svg>
