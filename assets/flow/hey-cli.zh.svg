<svg xmlns="http://www.w3.org/2000/svg" width="880" height="732" viewBox="0 0 880 732" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="732" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="596" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="596" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">HEY CLI 做的</text>
<path class="edge" d="M62,181 L62,205" marker-end="url(#a)"/>
<path class="hand" d="M408,252.0 C439.0,252.0 439.0,276 470,276" marker-end="url(#a)"/>
<path class="hand" d="M472,285.5 C441.0,285.5 441.0,347 410,347" marker-end="url(#a)"/>
<path class="hand" d="M408,377.5 C439.0,377.5 439.0,401 470,401" marker-end="url(#a)"/>
<path class="hand" d="M472,434.0 C441.0,434.0 441.0,482 410,482" marker-end="url(#a)"/>
<path class="hand" d="M408,512.5 C439.0,512.5 439.0,541 470,541" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">搭建</text>
<text class="t" x="82" y="118">为自己的平台装上 hey 二进制</text>
<text class="c" x="82" y="142">curl -fsSL https://hey.com/install-cli |</text>
<text class="c" x="82" y="161">bash</text>
<rect class="card" x="40" y="207" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="207" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="231" r="10"/>
<text class="num" x="62" y="235" text-anchor="middle">2</text>
<text class="ph" x="82" y="236">搭建</text>
<text class="t" x="82" y="253">跑一次 hey，用浏览器完成登录</text>
<text class="c" x="82" y="277">hey</text>
<rect class="cardT" x="472" y="252" width="368" height="67" rx="8"/>
<rect class="accT" x="472" y="252" width="4" height="67" rx="2"/>
<circle class="accT" cx="494" cy="276" r="10"/>
<text class="num" x="494" y="280" text-anchor="middle">3</text>
<text class="ph" x="514" y="281">搭建</text>
<text class="t" x="514" y="298">完成 OAuth，把令牌存进系统钥匙串</text>
<rect class="card" x="40" y="323" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="323" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="347" r="10"/>
<text class="num" x="62" y="351" text-anchor="middle">4</text>
<text class="ph" x="82" y="352">搭建</text>
<text class="t" x="82" y="369">接上检测到的编程 agent，或任意 MCP 客户端</text>
<text class="c" x="82" y="393">hey setup claude · claude mcp add hey --</text>
<text class="c" x="82" y="412">hey mcp</text>
<rect class="cardT" x="472" y="377" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="377" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="401" r="10"/>
<text class="num" x="494" y="405" text-anchor="middle">5</text>
<text class="ph" x="514" y="406">搭建</text>
<text class="t" x="514" y="423">装好内置 skill，以你的账号提供 hey_* M</text>
<text class="t" x="514" y="445">CP 工具</text>
<text class="comp" x="514" y="473">组件：skill 与 MCP 服务</text>
<rect class="card" x="40" y="458" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="458" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="482" r="10"/>
<text class="num" x="62" y="486" text-anchor="middle">6</text>
<text class="ph" x="82" y="487">日常使用</text>
<text class="t" x="82" y="504">让 agent 处理你的邮件，或自己敲命令</text>
<text class="c" x="82" y="528">hey box view imbox · hey reply 12345 -m</text>
<text class="c" x="82" y="547">&quot;Friday works for me.&quot;</text>
<rect class="cardT" x="472" y="517" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="517" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="541" r="10"/>
<text class="num" x="494" y="545" text-anchor="middle">7</text>
<text class="ph" x="514" y="546">日常使用</text>
<text class="t" x="514" y="563">读回 Markdown 或 JSON，写操作带着钥匙串令</text>
<text class="t" x="514" y="585">牌发往 HEY API</text>
<rect class="val" x="28" y="638" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="662">价值</text>
<text class="valT" x="48" y="686">邮件、日历、通讯录都变成 agent 可调用的能力——不开浏览器、不抓屏、不折腾 IMAP</text>
</svg>
