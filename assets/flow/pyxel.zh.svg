<svg xmlns="http://www.w3.org/2000/svg" width="880" height="865" viewBox="0 0 880 865" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="865" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="729" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="729" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Pyxel 做的</text>
<path class="edge" d="M62,209 L62,233" marker-end="url(#a)"/>
<path class="edge" d="M62,372 L62,396" marker-end="url(#a)"/>
<path class="hand" d="M408,465.0 C439.0,465.0 439.0,489 470,489" marker-end="url(#a)"/>
<path class="hand" d="M472,522.0 C441.0,522.0 441.0,582 410,582" marker-end="url(#a)"/>
<path class="hand" d="M408,625.0 C439.0,625.0 439.0,649 470,649" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">做游戏</text>
<text class="t" x="82" y="118">在 Python 3.11+ 上安装（wheel 自带 Rust </text>
<text class="t" x="82" y="140">内核）</text>
<text class="c" x="82" y="164">pip install -U pyxel</text>
<text class="comp" x="82" y="187">组件：pyxel wheel 包</text>
<rect class="card" x="40" y="235" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="235" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="259" r="10"/>
<text class="num" x="62" y="263" text-anchor="middle">2</text>
<text class="ph" x="82" y="264">做游戏</text>
<text class="t" x="82" y="281">定好画面尺寸，把 update 和 draw 两个函数</text>
<text class="t" x="82" y="303">交给它</text>
<text class="c" x="82" y="327">pyxel.run(update, draw)</text>
<text class="comp" x="82" y="350">组件：Python API</text>
<rect class="card" x="40" y="398" width="368" height="134" rx="8"/>
<rect class="accY" x="40" y="398" width="4" height="134" rx="2"/>
<circle class="accY" cx="62" cy="422" r="10"/>
<text class="num" x="62" y="426" text-anchor="middle">3</text>
<text class="ph" x="82" y="427">做游戏</text>
<text class="t" x="82" y="444">运行脚本（watch 模式保存即重跑）</text>
<text class="c" x="82" y="468">pyxel run PYTHON_SCRIPT_FILE · pyxel watch</text>
<text class="c" x="82" y="487">WATCH_DIR PYTHON_SCRIPT_FILE</text>
<text class="comp" x="82" y="510">组件：pyxel 命令行</text>
<rect class="cardT" x="472" y="465" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="465" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="489" r="10"/>
<text class="num" x="494" y="493" text-anchor="middle">4</text>
<text class="ph" x="514" y="494">做游戏</text>
<text class="t" x="514" y="511">开窗口，每帧调 update、来得及才调 draw，混</text>
<text class="t" x="514" y="533">4 路声音</text>
<text class="comp" x="514" y="561">组件：Rust 内核（SDL2 + OpenGL）</text>
<rect class="card" x="40" y="558" width="368" height="134" rx="8"/>
<rect class="accY" x="40" y="558" width="4" height="134" rx="2"/>
<circle class="accY" cx="62" cy="582" r="10"/>
<text class="num" x="62" y="586" text-anchor="middle">5</text>
<text class="ph" x="82" y="587">发出去</text>
<text class="t" x="82" y="604">把游戏目录打成一个 .pyxapp，再转成 HTML</text>
<text class="c" x="82" y="628">pyxel package APP_DIR STARTUP_SCRIPT_FILE </text>
<text class="c" x="82" y="647">· pyxel app2html PYXEL_APP_FILE</text>
<text class="comp" x="82" y="670">组件：pyxel 命令行</text>
<rect class="cardT" x="472" y="625" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="625" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="649" r="10"/>
<text class="num" x="494" y="653" text-anchor="middle">6</text>
<text class="ph" x="514" y="654">发出去</text>
<text class="t" x="514" y="671">把代码和资源嵌进一个 HTML，浏览器里跑它的</text>
<text class="t" x="514" y="693">WebAssembly 版</text>
<text class="comp" x="514" y="721">组件：pyxel.js + Pyodide</text>
<rect class="val" x="28" y="771" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="795">价值</text>
<text class="valT" x="48" y="819">不用自己写窗口、游戏循环、调色板渲染和混音——同一份 Python 在桌面和网页链接里都能玩</text>
</svg>
