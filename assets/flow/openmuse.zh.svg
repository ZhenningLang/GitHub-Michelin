<svg xmlns="http://www.w3.org/2000/svg" width="880" height="813" viewBox="0 0 880 813" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="813" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="677" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="677" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenMuse 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="edge" d="M62,282 L62,306" marker-end="url(#a)"/>
<path class="hand" d="M408,344.5 C439.0,344.5 439.0,368 470,368" marker-end="url(#a)"/>
<path class="hand" d="M472,392.5 C441.0,392.5 441.0,431 410,431" marker-end="url(#a)"/>
<path class="hand" d="M408,443.5 C439.0,443.5 439.0,491 470,491" marker-end="url(#a)"/>
<path class="edge" d="M494,564 L494,588" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从源码安装，复制配置模板</text>
<text class="c" x="82" y="125">pnpm install --frozen-lockfile · cp</text>
<text class="c" x="82" y="144">.env.example .env</text>
<rect class="card" x="40" y="190" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">建 Intelligence 项目，key 写进 .env</text>
<text class="c" x="82" y="243">npx copilotkit@latest login · npx</text>
<text class="c" x="82" y="262">copilotkit@latest project select</text>
<rect class="card" x="40" y="308" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="308" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="332" r="10"/>
<text class="num" x="62" y="336" text-anchor="middle">3</text>
<text class="t" x="82" y="337">拉起 API 和应用</text>
<text class="c" x="82" y="361">pnpm dev · pnpm dev:web</text>
<rect class="cardT" x="472" y="344" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="344" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="368" r="10"/>
<text class="num" x="494" y="372" text-anchor="middle">4</text>
<text class="t" x="514" y="373">在 localhost:8081 提供聊天和建在 PGlite </text>
<text class="t" x="514" y="395">上的持久任务引擎</text>
<text class="comp" x="514" y="423">组件：API 与任务引擎</text>
<rect class="card" x="40" y="407" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="407" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="431" r="10"/>
<text class="num" x="62" y="435" text-anchor="middle">5</text>
<text class="t" x="82" y="436">在手机上或网页聊天里派活</text>
<text class="c" x="82" y="460">Check out Hacker News for cool stuff</text>
<rect class="cardT" x="472" y="467" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="467" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="491" r="10"/>
<text class="num" x="494" y="495" text-anchor="middle">6</text>
<text class="t" x="514" y="496">驾驶保活的 Chromium，把浏览器/PDF/计划卡</text>
<text class="t" x="514" y="518">片流回聊天</text>
<text class="comp" x="514" y="546">组件：浏览器 worker</text>
<rect class="cardT" x="472" y="590" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="590" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="614" r="10"/>
<text class="num" x="494" y="618" text-anchor="middle">7</text>
<text class="t" x="514" y="619">写操作停下等你审批；Take control 可直接打</text>
<text class="t" x="514" y="641">开它的实时会话</text>
<text class="comp" x="514" y="669">组件：审阅门与回执</text>
<rect class="val" x="28" y="719" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="743">价值</text>
<text class="valT" x="48" y="767">人走开，差事还在跑——每个动作有审批、有回执、可续跑，任务中途还能直接接管它的浏览器</text>
</svg>
