<svg xmlns="http://www.w3.org/2000/svg" width="880" height="822" viewBox="0 0 880 822" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="822" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="686" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="686" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Sourcegraph 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,313 L62,337" marker-end="url(#a)"/>
<path class="hand" d="M408,375.0 C439.0,375.0 439.0,399 470,399" marker-end="url(#a)"/>
<path class="edge" d="M494,472 L494,496" marker-end="url(#a)"/>
<path class="hand" d="M472,535.5 C441.0,535.5 441.0,559 410,559" marker-end="url(#a)"/>
<path class="hand" d="M408,560.0 C439.0,560.0 439.0,623 470,623" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">检出最后一个 Apache-2.0 提交，之后的代码是</text>
<text class="t" x="82" y="123">企业许可</text>
<text class="c" x="82" y="147">1cd36d2dbbd2a9ab638cc437d208d2717eaefb0b</text>
<rect class="card" x="40" y="193" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">用仓库自带的开发工具装好工具链，拉起</text>
<text class="t" x="82" y="244">整套服务</text>
<text class="c" x="82" y="268">sg setup · sg start</text>
<text class="comp" x="82" y="291">组件：sg 开发工具</text>
<rect class="card" x="40" y="339" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="339" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="363" r="10"/>
<text class="num" x="62" y="367" text-anchor="middle">3</text>
<text class="t" x="82" y="368">接入代码托管平台，给一个能读所有仓库的</text>
<text class="t" x="82" y="390">token</text>
<rect class="cardT" x="472" y="375" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="375" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="399" r="10"/>
<text class="num" x="494" y="403" text-anchor="middle">4</text>
<text class="t" x="514" y="404">列出所有仓库，在限流范围内为每个仓库保持一</text>
<text class="t" x="514" y="426">份完整克隆</text>
<text class="comp" x="514" y="454">组件：repo-updater + gitserver</text>
<rect class="cardT" x="472" y="498" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="498" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="522" r="10"/>
<text class="num" x="494" y="526" text-anchor="middle">5</text>
<text class="t" x="514" y="527">给每个默认分支建三字母组索引</text>
<text class="comp" x="514" y="555">组件：Zoekt</text>
<rect class="card" x="40" y="535" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="535" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="559" r="10"/>
<text class="num" x="62" y="563" text-anchor="middle">6</text>
<text class="t" x="82" y="564">在网页界面里输入一条查询，覆盖所有仓库</text>
<rect class="cardT" x="472" y="599" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="599" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="623" r="10"/>
<text class="num" x="494" y="627" text-anchor="middle">7</text>
<text class="t" x="514" y="628">从索引里回答，未索引的分支直接扫，并把结果</text>
<text class="t" x="514" y="650">连到定义和引用</text>
<text class="comp" x="514" y="678">组件：frontend + searcher</text>
<rect class="val" x="28" y="728" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="752">价值</text>
<text class="valT" x="48" y="776">一个搜索框搜遍所有仓库和分支；对这份快照来说，它更是一份能读懂的产品架构蓝图</text>
</svg>
