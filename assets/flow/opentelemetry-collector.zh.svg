<svg xmlns="http://www.w3.org/2000/svg" width="880" height="797" viewBox="0 0 880 797" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="797" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="661" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="661" rx="10"/>
<rect class="pillT" x="474" y="40" width="151.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Collector 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,288 L62,312" marker-end="url(#a)"/>
<path class="hand" d="M408,350.0 C439.0,350.0 439.0,374 470,374" marker-end="url(#a)"/>
<path class="edge" d="M494,447 L494,471" marker-end="url(#a)"/>
<path class="edge" d="M494,548 L494,572" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">拉取并启动 Collector，开放 OTLP 端口</text>
<text class="t" x="82" y="123">4317 和 4318</text>
<text class="c" x="82" y="147">docker pull otel/opentelemetry-collector</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">在 YAML 里声明接收器、处理器、导出器，再按</text>
<text class="t" x="82" y="244">信号类型连成管线</text>
<text class="c" x="82" y="268">otelcol --config=customconfig.yaml</text>
<rect class="card" x="40" y="314" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">3</text>
<text class="t" x="82" y="343">让应用的 OTel SDK 改发给 Collector，不再</text>
<text class="t" x="82" y="365">直连厂商</text>
<rect class="cardT" x="472" y="350" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="350" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="374" r="10"/>
<text class="num" x="494" y="378" text-anchor="middle">4</text>
<text class="t" x="514" y="379">接收链路、指标和日志，统一转换成一种内部数</text>
<text class="t" x="514" y="401">据格式</text>
<text class="comp" x="514" y="429">组件：接收器</text>
<rect class="cardT" x="472" y="473" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="473" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="497" r="10"/>
<text class="num" x="494" y="501" text-anchor="middle">5</text>
<text class="t" x="514" y="502">在传输途中批量打包、过滤、采样、补充元数据</text>
<text class="comp" x="514" y="530">组件：处理器</text>
<rect class="cardT" x="472" y="574" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="574" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="598" r="10"/>
<text class="num" x="494" y="602" text-anchor="middle">6</text>
<text class="t" x="514" y="603">把每类信号发往一个或多个后端，失败时</text>
<text class="t" x="514" y="625">排队重试</text>
<text class="comp" x="514" y="653">组件：导出器</text>
<rect class="val" x="28" y="703" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="727">价值</text>
<text class="valT" x="48" y="751">换后端或加后端只改一处 YAML——应用照旧发 OTLP，不用重新埋点</text>
</svg>
