<svg xmlns="http://www.w3.org/2000/svg" width="880" height="669" viewBox="0 0 880 669" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="669" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="533" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="533" rx="10"/>
<rect class="pillT" x="474" y="40" width="206.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TanStack Router 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="edge" d="M62,263 L62,287" marker-end="url(#a)"/>
<path class="hand" d="M408,325.5 C439.0,325.5 439.0,349 470,349" marker-end="url(#a)"/>
<path class="hand" d="M472,385.0 C441.0,385.0 441.0,412 410,412" marker-end="url(#a)"/>
<path class="hand" d="M408,424.5 C439.0,424.5 439.0,495 470,495" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">安装路由与它的构建插件</text>
<text class="c" x="82" y="125">npm install @tanstack/react-router · npm</text>
<text class="c" x="82" y="144">install -D @tanstack/router-plugin</text>
<rect class="card" x="40" y="190" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">在 Vite 配置里注册这个插件</text>
<text class="c" x="82" y="243">@tanstack/router-plugin/vite</text>
<rect class="card" x="40" y="289" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="289" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="313" r="10"/>
<text class="num" x="62" y="317" text-anchor="middle">3</text>
<text class="t" x="82" y="318">每条路由写成 src/routes 下的一个文件</text>
<text class="c" x="82" y="342">createFileRoute(&#x27;/posts/$postId&#x27;)</text>
<rect class="cardT" x="472" y="325" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="325" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="349" r="10"/>
<text class="num" x="494" y="353" text-anchor="middle">4</text>
<text class="t" x="514" y="354">监听这个目录，每次改动后重新生成带类</text>
<text class="t" x="514" y="376">型的路由树</text>
<text class="c" x="514" y="400">routeTree.gen.ts</text>
<text class="comp" x="514" y="423">组件：路由生成器</text>
<rect class="card" x="40" y="388" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="388" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="412" r="10"/>
<text class="num" x="62" y="416" text-anchor="middle">5</text>
<text class="t" x="82" y="417">用这棵树创建 router，并在根节点挂载</text>
<text class="c" x="82" y="441">createRouter · RouterProvider</text>
<rect class="cardT" x="472" y="471" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="471" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="495" r="10"/>
<text class="num" x="494" y="499" text-anchor="middle">6</text>
<text class="t" x="514" y="500">编译期校验每个链接、路径参数与查询参数；loa</text>
<text class="t" x="514" y="522">der 按路由取数、缓存并预取</text>
<rect class="val" x="28" y="575" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="599">价值</text>
<text class="valT" x="48" y="623">写错的链接、没类型的 URL 参数，如今在编译期报错，而不是把坏页面发上线</text>
</svg>
