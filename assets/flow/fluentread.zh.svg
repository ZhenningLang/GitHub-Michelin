<svg xmlns="http://www.w3.org/2000/svg" width="880" height="556" viewBox="0 0 880 556" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="556" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="420" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="420" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">FluentRead 做的</text>
<path class="edge" d="M62,122 L62,146" marker-end="url(#a)"/>
<path class="edge" d="M62,220 L62,244" marker-end="url(#a)"/>
<path class="hand" d="M408,271.0 C439.0,271.0 439.0,306 470,306" marker-end="url(#a)"/>
<path class="edge" d="M494,354 L494,378" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从浏览器商店装上扩展，刷新网页</text>
<rect class="card" x="40" y="148" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="148" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="172" r="10"/>
<text class="num" x="62" y="176" text-anchor="middle">2</text>
<text class="t" x="82" y="177">选翻译服务：默认免费服务、自带 API</text>
<text class="t" x="82" y="199">key、Ollama 或本地模型</text>
<rect class="card" x="40" y="246" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="246" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="270" r="10"/>
<text class="num" x="62" y="274" text-anchor="middle">3</text>
<text class="t" x="82" y="275">选目标语言，点“翻译此页面”</text>
<rect class="cardT" x="472" y="282" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="282" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="306" r="10"/>
<text class="num" x="494" y="310" text-anchor="middle">4</text>
<text class="t" x="514" y="311">把页面段落发给所选服务，免费端点被限流就换</text>
<text class="t" x="514" y="333">下一个</text>
<rect class="cardT" x="472" y="380" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="380" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="404" r="10"/>
<text class="num" x="494" y="408" text-anchor="middle">5</text>
<text class="t" x="514" y="409">把译文插在每段原文下面，一键可恢复原页面</text>
<rect class="val" x="28" y="462" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="486">价值</text>
<text class="valT" x="48" y="510">外文网页原文译文对照着读，引擎由你定——免费、自带密钥，或完全在本机跑</text>
</svg>
