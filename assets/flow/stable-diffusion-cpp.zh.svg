<svg xmlns="http://www.w3.org/2000/svg" width="880" height="723" viewBox="0 0 880 723" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="723" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="587" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="587" rx="10"/>
<rect class="pillT" x="474" y="40" width="252.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">stable-diffusion.cpp 做的</text>
<path class="edge" d="M62,169 L62,193" marker-end="url(#a)"/>
<path class="edge" d="M62,267 L62,291" marker-end="url(#a)"/>
<path class="hand" d="M408,348.5 C439.0,348.5 439.0,372 470,372" marker-end="url(#a)"/>
<path class="edge" d="M494,398 L494,422" marker-end="url(#a)"/>
<path class="edge" d="M494,521 L494,545" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从 Releases 下载对应后端的 sd 二进制，或</text>
<text class="t" x="82" y="123">用 CMake 编译</text>
<text class="comp" x="82" y="151">组件：sd-cli / sd-server 二进制</text>
<rect class="card" x="40" y="195" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="195" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="219" r="10"/>
<text class="num" x="62" y="223" text-anchor="middle">2</text>
<text class="t" x="82" y="224">下载模型权重（.safetensors、.ckpt 或</text>
<text class="t" x="82" y="246">.gguf）</text>
<rect class="card" x="40" y="293" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="293" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="317" r="10"/>
<text class="num" x="62" y="321" text-anchor="middle">3</text>
<text class="t" x="82" y="322">一条命令生成图片</text>
<text class="c" x="82" y="346">./bin/sd-cli -m</text>
<text class="c" x="82" y="365">../models/v1-5-pruned-emaonly.safetensors</text>
<text class="c" x="82" y="384">-p &quot;a lovely cat&quot;</text>
<rect class="cardT" x="472" y="348" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="348" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="372" r="10"/>
<text class="num" x="494" y="376" text-anchor="middle">4</text>
<text class="t" x="514" y="377">识别模型家族，加载权重，按需在加载时量化</text>
<rect class="cardT" x="472" y="424" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="424" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="448" r="10"/>
<text class="num" x="494" y="452" text-anchor="middle">5</text>
<text class="t" x="514" y="453">在 ggml 后端上跑文本编码、采样和 VAE，显存</text>
<text class="t" x="514" y="475">不够时把权重挪到内存</text>
<text class="comp" x="514" y="503">组件：打过补丁的 ggml</text>
<rect class="cardT" x="472" y="547" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="547" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="571" r="10"/>
<text class="num" x="494" y="575" text-anchor="middle">6</text>
<text class="t" x="514" y="576">写出 PNG，并按 WebUI 格式嵌入生成参数</text>
<rect class="val" x="28" y="629" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="653">价值</text>
<text class="valT" x="48" y="677">一个原生二进制就能在自己的 CPU/GPU 上跑扩散模型，不用维护与驱动对齐的 Python/PyTorch 环境</text>
</svg>
