<svg xmlns="http://www.w3.org/2000/svg" width="880" height="768" viewBox="0 0 880 768" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="768" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="632" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="632" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">pyrasite 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,307 L62,331" marker-end="url(#a)"/>
<path class="hand" d="M408,393.0 C439.0,393.0 439.0,417 470,417" marker-end="url(#a)"/>
<path class="edge" d="M494,468 L494,492" marker-end="url(#a)"/>
<path class="edge" d="M494,566 L494,590" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好 gdb 7.3+ 和 pyrasite，并在主机上放开</text>
<text class="t" x="82" y="123">ptrace</text>
<text class="c" x="82" y="147">echo 0 &gt;</text>
<text class="c" x="82" y="166">/proc/sys/kernel/yama/ptrace_scope</text>
<rect class="card" x="40" y="212" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">挑一个自带载荷（线程栈、内存统计……）或自己</text>
<text class="t" x="82" y="263">写个 .py 文件</text>
<text class="c" x="82" y="287">pyrasite --list-payloads</text>
<rect class="card" x="40" y="333" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">3</text>
<text class="t" x="82" y="362">对活进程的 PID 执行，并要求把输出送</text>
<text class="t" x="82" y="384">回你的终端</text>
<text class="c" x="82" y="408">--output localterm</text>
<text class="comp" x="82" y="431">组件：pyrasite 命令行</text>
<rect class="cardT" x="472" y="393" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="393" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="417" r="10"/>
<text class="num" x="494" y="421" text-anchor="middle">4</text>
<text class="t" x="514" y="422">用 gdb 附着到该 PID，拿到解释器锁</text>
<text class="comp" x="514" y="450">组件：注入器（借 gdb）</text>
<rect class="cardT" x="472" y="494" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="494" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="518" r="10"/>
<text class="num" x="494" y="522" text-anchor="middle">5</text>
<text class="t" x="514" y="523">让目标解释器 exec 你的文件，可直接访问它的</text>
<text class="t" x="514" y="545">模块和对象</text>
<rect class="cardT" x="472" y="592" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="592" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="616" r="10"/>
<text class="num" x="494" y="620" text-anchor="middle">6</text>
<text class="t" x="514" y="621">还锁并脱离，进程继续运行</text>
<rect class="val" x="28" y="674" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="698">价值</text>
<text class="valT" x="48" y="722">不重启、也不用事先埋点，就能看到卡住或漏内存的 Python 进程内部的线程栈和对象</text>
</svg>
