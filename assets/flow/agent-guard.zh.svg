<svg xmlns="http://www.w3.org/2000/svg" width="880" height="826" viewBox="0 0 880 826" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="826" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="690" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="690" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">agent-guard 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,259.5 C439.0,259.5 439.0,283 470,283" marker-end="url(#a)"/>
<path class="edge" d="M494,356 L494,380" marker-end="url(#a)"/>
<path class="edge" d="M494,479 L494,503" marker-end="url(#a)"/>
<path class="hand" d="M472,541.0 C441.0,541.0 441.0,565 410,565" marker-end="url(#a)"/>
<path class="hand" d="M408,577.5 C439.0,577.5 439.0,627 470,627" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上这个 skill，再跑一次性安装脚本装好它调</text>
<text class="t" x="82" y="123">用的扫描器</text>
<text class="c" x="82" y="147">npx skills add elliottwaves-20/agent-guard</text>
<text class="c" x="82" y="166">· bash setup.sh</text>
<rect class="card" x="40" y="212" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">把准备安装的 skill、MCP 包或压缩包链</text>
<text class="t" x="82" y="263">接交给它</text>
<text class="c" x="82" y="287">python scripts/scan_url.py</text>
<rect class="cardT" x="472" y="259" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="259" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="283" r="10"/>
<text class="num" x="494" y="287" text-anchor="middle">3</text>
<text class="t" x="514" y="288">按确定的 commit 下载 ZIP 快照，不克隆也不</text>
<text class="t" x="514" y="310">执行任何东西</text>
<text class="comp" x="514" y="338">组件：URL 解析器</text>
<rect class="cardT" x="472" y="382" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="382" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="406" r="10"/>
<text class="num" x="494" y="410" text-anchor="middle">4</text>
<text class="t" x="514" y="411">按目标类型分派给对应扫描器，LLM 评审放在无</text>
<text class="t" x="514" y="433">工具的独立进程里</text>
<text class="comp" x="514" y="461">组件：扫描器包装脚本</text>
<rect class="cardT" x="472" y="505" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="505" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="529" r="10"/>
<text class="num" x="494" y="533" text-anchor="middle">5</text>
<text class="t" x="514" y="534">把各阶段合并成一个结论：退出码 0 安全、1 </text>
<text class="t" x="514" y="556">拦截、2 无结论</text>
<rect class="card" x="40" y="541" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="541" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="565" r="10"/>
<text class="num" x="62" y="569" text-anchor="middle">6</text>
<text class="t" x="82" y="570">拿到 SAFE 之后，安装刚才扫过的同一份内容</text>
<text class="c" x="82" y="594">python scripts/install_skill.py skill</text>
<rect class="cardT" x="472" y="603" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="603" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="627" r="10"/>
<text class="num" x="494" y="631" text-anchor="middle">7</text>
<text class="t" x="514" y="632">对暂存副本再扫一遍，然后链接进本机检测到的</text>
<text class="t" x="514" y="654">每个 agent</text>
<text class="comp" x="514" y="682">组件：通用安装器</text>
<rect class="val" x="28" y="732" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="756">价值</text>
<text class="valT" x="48" y="780">扫一次、判一次就覆盖你所有的 agent，装进去的正是扫过的那一份</text>
</svg>
