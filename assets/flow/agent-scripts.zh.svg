<svg xmlns="http://www.w3.org/2000/svg" width="880" height="736" viewBox="0 0 880 736" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="736" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="600" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="600" rx="10"/>
<rect class="pillT" x="474" y="40" width="187.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">agent-scripts 做的</text>
<path class="hand" d="M408,121.0 C439.0,121.0 439.0,145 470,145" marker-end="url(#a)"/>
<path class="edge" d="M494,218 L494,242" marker-end="url(#a)"/>
<path class="hand" d="M472,304.0 C441.0,304.0 441.0,328 410,328" marker-end="url(#a)"/>
<path class="hand" d="M408,373.5 C439.0,373.5 439.0,414 470,414" marker-end="url(#a)"/>
<path class="hand" d="M472,438.5 C441.0,438.5 441.0,493 410,493" marker-end="url(#a)"/>
<path class="hand" d="M408,506.5 C439.0,506.5 439.0,537 470,537" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把仓库克隆到脚本写死的路径，再跑同步脚本</text>
<text class="c" x="82" y="125">scripts/sync-skills</text>
<text class="comp" x="82" y="148">组件：sync-skills（bash）</text>
<rect class="cardT" x="472" y="121" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="121" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="145" r="10"/>
<text class="num" x="494" y="149" text-anchor="middle">2</text>
<text class="t" x="514" y="150">skills/ 整体链给 Codex，逐个链给 Claude</text>
<text class="t" x="514" y="172">Code</text>
<text class="comp" x="514" y="200">组件：软链镜像</text>
<rect class="cardT" x="472" y="244" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="244" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="268" r="10"/>
<text class="num" x="494" y="272" text-anchor="middle">3</text>
<text class="t" x="514" y="273">把各 agent 的全局指令文件指向同一份</text>
<text class="t" x="514" y="295">AGENTS.MD</text>
<text class="c" x="514" y="319">~/.claude/CLAUDE.md · ~/.codex/AGENTS.md</text>
<text class="comp" x="514" y="342">组件：AGENTS.MD</text>
<rect class="card" x="40" y="304" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="304" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="328" r="10"/>
<text class="num" x="62" y="332" text-anchor="middle">4</text>
<text class="t" x="82" y="333">每个下游仓库的 AGENTS.MD 开头放指针行，本</text>
<text class="t" x="82" y="355">仓库规则写在下面</text>
<text class="c" x="82" y="379">READ ~/Projects/agent-scripts/AGENTS.MD</text>
<text class="c" x="82" y="398">BEFORE ANYTHING (skip if missing).</text>
<text class="comp" x="82" y="421">组件：下游 AGENTS.MD</text>
<rect class="cardT" x="472" y="390" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="390" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="414" r="10"/>
<text class="num" x="494" y="418" text-anchor="middle">5</text>
<text class="t" x="514" y="419">agent 先读共享规则，任务命中某个 skill 的</text>
<text class="t" x="514" y="441">描述时再加载它</text>
<text class="comp" x="514" y="469">组件：SKILL.md 描述</text>
<rect class="card" x="40" y="469" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="469" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="493" r="10"/>
<text class="num" x="62" y="497" text-anchor="middle">6</text>
<text class="t" x="82" y="498">规则或 skill 只在本仓库改一次并推送</text>
<text class="comp" x="82" y="526">组件：validate-skills 钩子</text>
<rect class="cardT" x="472" y="513" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="513" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="537" r="10"/>
<text class="num" x="494" y="541" text-anchor="middle">7</text>
<text class="t" x="514" y="542">所有已链接的 agent 与仓库下次会话即生效，</text>
<text class="t" x="514" y="564">没有副本要改</text>
<text class="comp" x="514" y="592">组件：软链镜像</text>
<rect class="val" x="28" y="642" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="666">价值</text>
<text class="valT" x="48" y="690">改一处，所有仓库里的所有 agent 读到的规则和 skill 都跟着变，不再维护一堆逐渐走样的副本</text>
</svg>
