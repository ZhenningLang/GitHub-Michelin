<svg xmlns="http://www.w3.org/2000/svg" width="880" height="881" viewBox="0 0 880 881" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="881" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="745" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="745" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">FreeCAD does</text>
<path class="hand" d="M408,131.5 C439.0,131.5 439.0,155 470,155" marker-end="url(#a)"/>
<path class="hand" d="M472,179.5 C441.0,179.5 441.0,241 410,241" marker-end="url(#a)"/>
<path class="edge" d="M62,315 L62,339" marker-end="url(#a)"/>
<path class="hand" d="M408,389.5 C439.0,389.5 439.0,413 470,413" marker-end="url(#a)"/>
<path class="hand" d="M472,437.5 C441.0,437.5 441.0,488 410,488" marker-end="url(#a)"/>
<path class="edge" d="M62,584 L62,608" marker-end="url(#a)"/>
<path class="hand" d="M408,658.5 C439.0,658.5 439.0,682 470,682" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="119" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="119" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install FreeCAD from the official</text>
<text class="t" x="82" y="123">installer, your distro, or the</text>
<text class="t" x="82" y="145">AppImage</text>
<text class="comp" x="82" y="173">component: installer</text>
<rect class="cardT" x="472" y="131" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="131" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="155" r="10"/>
<text class="num" x="494" y="159" text-anchor="middle">2</text>
<text class="t" x="514" y="160">Ships the Qt UI, the Coin3D 3D view</text>
<text class="t" x="514" y="182">and the OpenCASCADE kernel in one app</text>
<text class="comp" x="514" y="210">component: FreeCAD application</text>
<rect class="card" x="40" y="217" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="217" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="241" r="10"/>
<text class="num" x="62" y="245" text-anchor="middle">3</text>
<text class="t" x="82" y="246">Switch to the PartDesign workbench</text>
<text class="c" x="82" y="270">View → Workbench → PartDesign</text>
<text class="comp" x="82" y="293">component: PartDesign workbench</text>
<rect class="card" x="40" y="341" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="341" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="365" r="10"/>
<text class="num" x="62" y="369" text-anchor="middle">4</text>
<text class="t" x="82" y="370">Create a Body and a new Sketch on a</text>
<text class="t" x="82" y="392">base plane</text>
<text class="comp" x="82" y="420">component: Sketcher workbench</text>
<rect class="cardT" x="472" y="389" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="389" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="413" r="10"/>
<text class="num" x="494" y="417" text-anchor="middle">5</text>
<text class="t" x="514" y="418">Solves your constraints and drives the</text>
<text class="t" x="514" y="440">degrees of freedom to 0</text>
<text class="comp" x="514" y="468">component: constraint solver</text>
<rect class="card" x="40" y="464" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="464" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="488" r="10"/>
<text class="num" x="62" y="492" text-anchor="middle">6</text>
<text class="t" x="82" y="493">Pad the sketch into a solid — Pocket</text>
<text class="t" x="82" y="515">subtracts another</text>
<text class="c" x="82" y="539">Pad · Pocket</text>
<text class="comp" x="82" y="562">component: PartDesign workbench</text>
<rect class="card" x="40" y="610" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="610" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="634" r="10"/>
<text class="num" x="62" y="638" text-anchor="middle">7</text>
<text class="t" x="82" y="639">Edit a dimension on any sketch still</text>
<text class="t" x="82" y="661">in the tree</text>
<text class="comp" x="82" y="689">component: document tree</text>
<rect class="cardT" x="472" y="658" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="658" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="682" r="10"/>
<text class="num" x="494" y="686" text-anchor="middle">8</text>
<text class="t" x="514" y="687">Recomputes the feature history and</text>
<text class="t" x="514" y="709">rebuilds the part</text>
<text class="comp" x="514" y="737">component: recompute engine</text>
<rect class="val" x="28" y="787" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="811">VALUE</text>
<text class="valT" x="48" y="835">You re-dimension one sketch and the whole part rebuilds from its own history — no redrawing</text>
</svg>
