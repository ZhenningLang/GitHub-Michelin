<svg xmlns="http://www.w3.org/2000/svg" width="880" height="726" viewBox="0 0 880 726" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="726" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="590" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="590" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Skill 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,258.0 C439.0,258.0 439.0,282 470,282" marker-end="url(#a)"/>
<path class="edge" d="M494,355 L494,379" marker-end="url(#a)"/>
<path class="hand" d="M472,441.0 C441.0,441.0 441.0,465 410,465" marker-end="url(#a)"/>
<path class="hand" d="M408,466.0 C439.0,466.0 439.0,551 470,551" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">克隆仓库，把 skill 子目录拷进 Codex 的</text>
<text class="t" x="82" y="123">skills 目录</text>
<text class="c" x="82" y="147">cp -R ./ian-xiaohei-illustrations</text>
<text class="c" x="82" y="166">&quot;${CODEX_HOME:-$HOME/.codex}/skills/&quot;</text>
<rect class="card" x="40" y="212" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">把文章贴进 Codex，调用这个 skill</text>
<text class="c" x="82" y="265">Use $ian-xiaohei-illustrations 把下面这篇文</text>
<text class="c" x="82" y="284">章生成 4 张小黑怪诞正文配图。</text>
<rect class="cardT" x="472" y="258" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="258" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="282" r="10"/>
<text class="num" x="494" y="286" text-anchor="middle">3</text>
<text class="t" x="514" y="287">先读正文给出 shot list：每张图只挑一</text>
<text class="t" x="514" y="309">个认知锚点</text>
<text class="comp" x="514" y="337">组件：SKILL.md 与参考文档</text>
<rect class="cardT" x="472" y="381" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="381" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="405" r="10"/>
<text class="num" x="494" y="409" text-anchor="middle">4</text>
<text class="t" x="514" y="410">逐张调用宿主 agent 内置图像模型渲染</text>
<text class="t" x="514" y="432">手绘线稿</text>
<text class="c" x="514" y="456">image_gen</text>
<text class="comp" x="514" y="479">组件：prompt-template.md</text>
<rect class="card" x="40" y="441" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="441" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="465" r="10"/>
<text class="num" x="62" y="469" text-anchor="middle">5</text>
<text class="t" x="82" y="470">批注出错字就减少标注词，重新生成</text>
<rect class="cardT" x="472" y="527" width="368" height="73" rx="8"/>
<rect class="accT" x="472" y="527" width="4" height="73" rx="2"/>
<circle class="accT" cx="494" cy="551" r="10"/>
<text class="num" x="494" y="555" text-anchor="middle">6</text>
<text class="t" x="514" y="556">按 QA 清单逐张检查 PNG，存入文章配图目录</text>
<text class="c" x="514" y="580">assets/&lt;article-slug&gt;-illustrations/</text>
<rect class="val" x="28" y="632" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="656">价值</text>
<text class="valT" x="48" y="680">整篇文章用同一套手绘语言配图，不必逐张手写提示词</text>
</svg>
