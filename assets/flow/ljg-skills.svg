<svg xmlns="http://www.w3.org/2000/svg" width="880" height="685" viewBox="0 0 880 685" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="685" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="527" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="527" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">ljg-skills does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,278.5 C439.0,278.5 439.0,302 470,302" marker-end="url(#a)"/>
<path class="hand" d="M472,314.0 C441.0,314.0 441.0,395 410,395" marker-end="url(#a)"/>
<path class="hand" d="M408,418.5 C439.0,418.5 439.0,442 470,442" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install all 23 skills globally for</text>
<text class="t" x="82" y="123">Codex with the skills CLI</text>
<text class="c" x="82" y="147">bunx skills add lijigang/ljg-skills -g -a</text>
<text class="c" x="82" y="166">codex --skill &#x27;*&#x27; -y</text>
<rect class="card" x="40" y="212" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Only for the card skill: install its</text>
<text class="t" x="82" y="263">Playwright Chromium renderer</text>
<text class="c" x="82" y="287">cd ~/.agents/skills/ljg-card &amp;&amp; bun</text>
<text class="c" x="82" y="306">install &amp;&amp; bunx playwright install</text>
<text class="c" x="82" y="325">chromium</text>
<rect class="cardT" x="472" y="278" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="278" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="302" r="10"/>
<text class="num" x="494" y="306" text-anchor="middle">3</text>
<text class="t" x="514" y="307">Skills land in ~/.agents/skills/ and</text>
<text class="t" x="514" y="329">load when the task matches</text>
<rect class="card" x="40" y="371" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="371" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="395" r="10"/>
<text class="num" x="62" y="399" text-anchor="middle">4</text>
<text class="t" x="82" y="400">Hand it a paper, a book, or a knotty</text>
<text class="t" x="82" y="422">concept</text>
<text class="c" x="82" y="446">ljg-paper · ljg-book · ljg-learn</text>
<rect class="cardT" x="472" y="418" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="418" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="442" r="10"/>
<text class="num" x="494" y="446" text-anchor="middle">5</text>
<text class="t" x="514" y="447">The skill runs its fixed method and</text>
<text class="t" x="514" y="469">delivers structured output, or a</text>
<text class="t" x="514" y="491">shareable long PNG card</text>
<text class="comp" x="514" y="519">component: SKILL.md method prompts</text>
<rect class="val" x="28" y="569" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="593">VALUE</text>
<text class="valT" x="48" y="617">Reading, concept dissection and shareable cards done with one person&#x27;s tested method, not</text>
<text class="valT" x="48" y="639">bland summaries</text>
</svg>
