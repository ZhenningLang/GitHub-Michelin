<svg xmlns="http://www.w3.org/2000/svg" width="880" height="797" viewBox="0 0 880 797" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="797" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="639" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="639" rx="10"/>
<rect class="pillT" x="474" y="40" width="184.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agent Skills does</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="hand" d="M408,265.5 C439.0,265.5 439.0,289 470,289" marker-end="url(#a)"/>
<path class="hand" d="M472,313.5 C441.0,313.5 441.0,363 410,363" marker-end="url(#a)"/>
<path class="hand" d="M408,386.5 C439.0,386.5 439.0,412 470,412" marker-end="url(#a)"/>
<path class="edge" d="M494,507 L494,531" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the pack once into your coding</text>
<text class="t" x="82" y="123">agent</text>
<text class="c" x="82" y="147">npx skills add addyosmani/agent-skills</text>
<text class="comp" x="82" y="170">component: skills/ + command adapters</text>
<rect class="card" x="40" y="218" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">Define the work with the lifecycle</text>
<text class="t" x="82" y="269">command</text>
<text class="c" x="82" y="293">/spec</text>
<rect class="cardT" x="472" y="265" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="265" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="289" r="10"/>
<text class="num" x="494" y="293" text-anchor="middle">3</text>
<text class="t" x="514" y="294">Routes to spec-driven-development and</text>
<text class="t" x="514" y="316">forces a PRD before any code</text>
<text class="comp" x="514" y="344">component: spec-driven-development skill</text>
<rect class="card" x="40" y="339" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="339" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="363" r="10"/>
<text class="num" x="62" y="367" text-anchor="middle">4</text>
<text class="t" x="82" y="368">Walk the rest of the lifecycle command</text>
<text class="t" x="82" y="390">by command</text>
<text class="c" x="82" y="414">/plan · /build · /ship</text>
<rect class="cardT" x="472" y="388" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="388" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="412" r="10"/>
<text class="num" x="494" y="416" text-anchor="middle">5</text>
<text class="t" x="514" y="417">Each command activates the right</text>
<text class="t" x="514" y="439">skills: TDD, five-axis review,</text>
<text class="t" x="514" y="461">security, launch gates</text>
<text class="comp" x="514" y="489">component: 25 skills + 4 personas</text>
<rect class="cardT" x="472" y="533" width="368" height="116" rx="8"/>
<rect class="accT" x="472" y="533" width="4" height="116" rx="2"/>
<circle class="accT" cx="494" cy="557" r="10"/>
<text class="num" x="494" y="561" text-anchor="middle">6</text>
<text class="t" x="514" y="562">Every skill ends in evidence</text>
<text class="t" x="514" y="584">requirements, with</text>
<text class="t" x="514" y="606">anti-rationalization tables closing</text>
<text class="t" x="514" y="628">escape hatches</text>
<rect class="val" x="28" y="681" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="705">VALUE</text>
<text class="valT" x="48" y="729">Senior-engineer discipline - spec, tests, review, launch gates - firing on every task instead</text>
<text class="valT" x="48" y="751">of only when you remember to ask</text>
</svg>
