<svg xmlns="http://www.w3.org/2000/svg" width="880" height="698" viewBox="0 0 880 698" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="698" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="562" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="562" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">tapflow 做的</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="hand" d="M408,254.5 C439.0,254.5 439.0,278 470,278" marker-end="url(#a)"/>
<path class="hand" d="M472,302.5 C441.0,302.5 441.0,341 410,341" marker-end="url(#a)"/>
<path class="hand" d="M408,353.0 C439.0,353.0 439.0,401 470,401" marker-end="url(#a)"/>
<path class="hand" d="M472,425.5 C441.0,425.5 441.0,449 410,449" marker-end="url(#a)"/>
<path class="hand" d="M408,461.0 C439.0,461.0 439.0,524 470,524" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 Apple Silicon Mac 上装 CLI，补齐</text>
<text class="t" x="82" y="123">Xcode 等前置</text>
<text class="c" x="82" y="147">npm install -g tapflow · tapflow setup</text>
<text class="comp" x="82" y="170">组件：tapflow CLI</text>
<rect class="card" x="40" y="218" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">在这台 Mac 上一起启动 relay 和 agent</text>
<text class="c" x="82" y="271">tapflow start</text>
<rect class="cardT" x="472" y="254" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="254" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="278" r="10"/>
<text class="num" x="494" y="282" text-anchor="middle">3</text>
<text class="t" x="514" y="283">在 4000 端口提供看板；agent 主动连出，登记</text>
<text class="t" x="514" y="305">所有模拟器</text>
<text class="comp" x="514" y="333">组件：relay＋macOS agent</text>
<rect class="card" x="40" y="317" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="317" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="341" r="10"/>
<text class="num" x="62" y="345" text-anchor="middle">4</text>
<text class="t" x="82" y="346">建管理员，上传 .app.zip／.apk，点 Start</text>
<text class="t" x="82" y="368">QA</text>
<rect class="cardT" x="472" y="377" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="377" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="401" r="10"/>
<text class="num" x="494" y="405" text-anchor="middle">5</text>
<text class="t" x="514" y="406">按需启动选中的设备，装好构建，把 H.264 画</text>
<text class="t" x="514" y="428">面推到浏览器</text>
<text class="comp" x="514" y="456">组件：触摸／截屏 helper</text>
<rect class="card" x="40" y="425" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="425" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="449" r="10"/>
<text class="num" x="62" y="453" text-anchor="middle">6</text>
<text class="t" x="82" y="454">发邀请链接；队友在任意浏览器里对着屏幕点</text>
<text class="t" x="82" y="476">击、拖动</text>
<rect class="cardT" x="472" y="500" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="500" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="524" r="10"/>
<text class="num" x="494" y="528" text-anchor="middle">7</text>
<text class="t" x="514" y="529">把每次点击、拖动转成模拟器上真实的点</text>
<text class="t" x="514" y="551">按和滑动</text>
<rect class="val" x="28" y="604" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="628">价值</text>
<text class="valT" x="48" y="652">产品、设计、后端在浏览器里就能测最新构建——自己电脑不装 Xcode，构建也不必上传到第三方设备云。</text>
</svg>
