<svg xmlns="http://www.w3.org/2000/svg" width="880" height="959" viewBox="0 0 880 959" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="959" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="801" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="801" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenDots does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,329 L62,353" marker-end="url(#a)"/>
<path class="hand" d="M408,402.5 C439.0,402.5 439.0,426 470,426" marker-end="url(#a)"/>
<path class="hand" d="M472,461.5 C441.0,461.5 441.0,500 410,500" marker-end="url(#a)"/>
<path class="hand" d="M408,523.0 C439.0,523.0 439.0,571 470,571" marker-end="url(#a)"/>
<path class="edge" d="M494,666 L494,690" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone the template, install, and copy</text>
<text class="t" x="82" y="123">the config</text>
<text class="c" x="82" y="147">npm ci · cp .env.example .env</text>
<rect class="card" x="40" y="193" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Connect a CopilotKit Intelligence</text>
<text class="t" x="82" y="244">project (hosted or local Docker</text>
<text class="t" x="82" y="266">evaluation)</text>
<text class="c" x="82" y="290">npx copilotkit@latest login · npx</text>
<text class="c" x="82" y="309">copilotkit@latest project select</text>
<rect class="card" x="40" y="355" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="355" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="379" r="10"/>
<text class="num" x="62" y="383" text-anchor="middle">3</text>
<text class="t" x="82" y="384">Add the model key and model name to</text>
<text class="t" x="82" y="406">.env, then start the app</text>
<text class="c" x="82" y="430">npm run dev</text>
<rect class="cardT" x="472" y="402" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="402" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="426" r="10"/>
<text class="num" x="494" y="430" text-anchor="middle">4</text>
<text class="t" x="514" y="431">Serves the workspace at</text>
<text class="t" x="514" y="453">127.0.0.1:5173: Spaces and pages in</text>
<text class="t" x="514" y="475">SQLite, chats as Intelligence Threads</text>
<text class="comp" x="514" y="503">component: Node server + React app</text>
<rect class="card" x="40" y="476" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="476" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="500" r="10"/>
<text class="num" x="62" y="504" text-anchor="middle">5</text>
<text class="t" x="82" y="505">Define a Dot: name, role,</text>
<text class="t" x="82" y="527">instructions, permitted tools and</text>
<text class="t" x="82" y="549">Spaces</text>
<rect class="cardT" x="472" y="547" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="547" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="571" r="10"/>
<text class="num" x="494" y="575" text-anchor="middle">6</text>
<text class="t" x="514" y="576">Runs its turns from chat, Slack, calls</text>
<text class="t" x="514" y="598">or schedules and streams browser and</text>
<text class="t" x="514" y="620">tool cards inline</text>
<text class="comp" x="514" y="648">component: Dot agent (TanStack AI)</text>
<rect class="cardT" x="472" y="692" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="692" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="716" r="10"/>
<text class="num" x="494" y="720" text-anchor="middle">7</text>
<text class="t" x="514" y="721">Stops at Approve &amp; save / Approve &amp;</text>
<text class="t" x="514" y="743">run before saving a page or running a</text>
<text class="t" x="514" y="765">write tool</text>
<text class="comp" x="514" y="793">component: Human-in-the-loop cards</text>
<rect class="val" x="28" y="843" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="867">VALUE</text>
<text class="valT" x="48" y="891">A named specialist keeps one conversation, its files and its browser across text, calls and</text>
<text class="valT" x="48" y="913">Slack — and nothing is saved or written outside without your click</text>
</svg>
