<svg xmlns="http://www.w3.org/2000/svg" width="880" height="820" viewBox="0 0 880 820" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="820" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="684" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="684" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">AutoGen 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="edge" d="M62,329 L62,353" marker-end="url(#a)"/>
<path class="hand" d="M408,401.0 C439.0,401.0 439.0,425 470,425" marker-end="url(#a)"/>
<path class="edge" d="M494,498 L494,522" marker-end="url(#a)"/>
<path class="edge" d="M494,596 L494,620" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装 AgentChat 和一个模型客户端扩展</text>
<text class="c" x="82" y="125">pip install -U &quot;autogen-agentchat&quot;</text>
<text class="c" x="82" y="144">&quot;autogen-ext[openai]&quot;</text>
<rect class="card" x="40" y="190" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">定义各带指令的专家 agent，包成主 agen</text>
<text class="t" x="82" y="241">t 的工具</text>
<text class="c" x="82" y="265">AgentTool(math_agent,</text>
<text class="c" x="82" y="284">return_value_as_last_message=True)</text>
<text class="comp" x="82" y="307">组件：AgentChat API</text>
<rect class="card" x="40" y="355" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="355" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="379" r="10"/>
<text class="num" x="62" y="383" text-anchor="middle">3</text>
<text class="t" x="82" y="384">让主 agent 跑一个任务</text>
<text class="c" x="82" y="408">agent.run_stream(task=&quot;What is the</text>
<text class="c" x="82" y="427">integral of x^2?&quot;)</text>
<rect class="cardT" x="472" y="401" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="401" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="425" r="10"/>
<text class="num" x="494" y="429" text-anchor="middle">4</text>
<text class="t" x="514" y="430">调用模型，由模型决定调哪个工具或哪个专家</text>
<text class="t" x="514" y="452">agent</text>
<text class="comp" x="514" y="480">组件：模型客户端（autogen-ext）</text>
<rect class="cardT" x="472" y="524" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="524" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="548" r="10"/>
<text class="num" x="494" y="552" text-anchor="middle">5</text>
<text class="t" x="514" y="553">跑那个专家自己的模型循环，把它最后一句话当</text>
<text class="t" x="514" y="575">工具结果交回</text>
<rect class="cardT" x="472" y="622" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="622" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="646" r="10"/>
<text class="num" x="494" y="650" text-anchor="middle">6</text>
<text class="t" x="514" y="651">循环到出答案或到 max_tool_iterations，消</text>
<text class="t" x="514" y="673">息流式输出</text>
<rect class="val" x="28" y="726" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="750">价值</text>
<text class="valT" x="48" y="774">几个大模型 agent 协作完成一个任务，消息路由和工具调用循环都不用你写</text>
</svg>
