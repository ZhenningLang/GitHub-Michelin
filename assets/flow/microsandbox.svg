<svg xmlns="http://www.w3.org/2000/svg" width="880" height="890" viewBox="0 0 880 890" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="890" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="732" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="732" rx="10"/>
<rect class="pillT" x="474" y="40" width="184.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Microsandbox does</text>
<path class="edge" d="M62,230 L62,254" marker-end="url(#a)"/>
<path class="hand" d="M408,313.0 C439.0,313.0 439.0,337 470,337" marker-end="url(#a)"/>
<path class="edge" d="M494,432 L494,456" marker-end="url(#a)"/>
<path class="hand" d="M472,506.5 C441.0,506.5 441.0,530 410,530" marker-end="url(#a)"/>
<path class="hand" d="M408,553.5 C439.0,553.5 439.0,605 470,605" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="158" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="158" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the CLI or the SDK for your</text>
<text class="t" x="82" y="123">language</text>
<text class="c" x="82" y="147">curl -fsSL</text>
<text class="c" x="82" y="166">https://install.microsandbox.dev | sh ·</text>
<text class="c" x="82" y="185">pip install microsandbox</text>
<text class="comp" x="82" y="208">component: msb CLI + host runtime</text>
<rect class="card" x="40" y="256" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="256" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="280" r="10"/>
<text class="num" x="62" y="284" text-anchor="middle">2</text>
<text class="t" x="82" y="285">Create a sandbox from an ordinary OCI</text>
<text class="t" x="82" y="307">image</text>
<text class="c" x="82" y="331">msb run python ·</text>
<text class="c" x="82" y="350">Sandbox.create(image=&quot;python&quot;)</text>
<rect class="cardT" x="472" y="313" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="313" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="337" r="10"/>
<text class="num" x="494" y="341" text-anchor="middle">3</text>
<text class="t" x="514" y="342">Pulls the image, lays a copy-on-write</text>
<text class="t" x="514" y="364">root and boots a microVM with its own</text>
<text class="t" x="514" y="386">kernel</text>
<text class="comp" x="514" y="414">component: libkrun microVM</text>
<rect class="cardT" x="472" y="458" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="458" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="482" r="10"/>
<text class="num" x="494" y="486" text-anchor="middle">4</text>
<text class="t" x="514" y="487">Starts the in-guest agent that serves</text>
<text class="t" x="514" y="509">your exec and file calls</text>
<text class="comp" x="514" y="537">component: agentd</text>
<rect class="card" x="40" y="506" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="506" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="530" r="10"/>
<text class="num" x="62" y="534" text-anchor="middle">5</text>
<text class="t" x="82" y="535">Run commands in it and stream the</text>
<text class="t" x="82" y="557">output back</text>
<text class="c" x="82" y="581">msb exec worker · sb.exec(&quot;python&quot;, [...])</text>
<rect class="cardT" x="472" y="581" width="368" height="161" rx="8"/>
<rect class="accT" x="472" y="581" width="4" height="161" rx="2"/>
<circle class="accT" cx="494" cy="605" r="10"/>
<text class="num" x="494" y="609" text-anchor="middle">6</text>
<text class="t" x="514" y="610">Checks each outbound packet against</text>
<text class="t" x="514" y="632">egress policy and substitutes real</text>
<text class="t" x="514" y="654">secrets on the host</text>
<text class="c" x="514" y="678">--net-rule &quot;allow@public:tcp:443&quot; ·</text>
<text class="c" x="514" y="697">--secret &#x27;GITHUB_TOKEN@api.github.com&#x27;</text>
<text class="comp" x="514" y="720">component: host network engine</text>
<rect class="val" x="28" y="774" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="798">VALUE</text>
<text class="valT" x="48" y="822">Untrusted code runs behind a hardware boundary on your own machine — the same OCI images, no</text>
<text class="valT" x="48" y="844">daemon and no cluster, with credentials kept on the host</text>
</svg>
