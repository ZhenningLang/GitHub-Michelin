<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1093" viewBox="0 0 880 1093" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1093" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="935" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="935" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">LoopX does</text>
<path class="edge" d="M62,203 L62,227" marker-end="url(#a)"/>
<path class="hand" d="M408,296.0 C439.0,296.0 439.0,320 470,320" marker-end="url(#a)"/>
<path class="hand" d="M472,353.0 C441.0,353.0 441.0,413 410,413" marker-end="url(#a)"/>
<path class="hand" d="M408,445.0 C439.0,445.0 439.0,469 470,469" marker-end="url(#a)"/>
<path class="edge" d="M494,579 L494,603" marker-end="url(#a)"/>
<path class="edge" d="M494,739 L494,763" marker-end="url(#a)"/>
<path class="hand" d="M472,833.0 C441.0,833.0 441.0,857 410,857" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="131" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="131" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Set up once</text>
<text class="t" x="82" y="118">Install the CLI from PyPI and register</text>
<text class="t" x="82" y="140">its skills into your agent host</text>
<text class="c" x="82" y="164">python3 -m pip install --upgrade loopx ·</text>
<text class="c" x="82" y="183">loopx workflow-skills --install</text>
<rect class="card" x="40" y="229" width="368" height="134" rx="8"/>
<rect class="accY" x="40" y="229" width="4" height="134" rx="2"/>
<circle class="accY" cx="62" cy="253" r="10"/>
<text class="num" x="62" y="257" text-anchor="middle">2</text>
<text class="ph" x="82" y="258">Set up once</text>
<text class="t" x="82" y="275">Connect the project from its root (or</text>
<text class="t" x="82" y="297">paste one message and let your agent</text>
<text class="t" x="82" y="319">do it)</text>
<text class="c" x="82" y="343">loopx connect</text>
<rect class="cardT" x="472" y="296" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="296" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="320" r="10"/>
<text class="num" x="494" y="324" text-anchor="middle">3</text>
<text class="ph" x="514" y="325">Set up once</text>
<text class="t" x="514" y="342">Create or reuse durable goal state and</text>
<text class="t" x="514" y="364">report the current gate and top todo</text>
<text class="comp" x="514" y="392">component: state kernel (.loopx/)</text>
<rect class="card" x="40" y="389" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="389" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="413" r="10"/>
<text class="num" x="62" y="417" text-anchor="middle">4</text>
<text class="ph" x="82" y="418">Set up once</text>
<text class="t" x="82" y="435">State the long-horizon objective in</text>
<text class="t" x="82" y="457">one line</text>
<text class="c" x="82" y="481">/loopx &lt;goal text&gt;</text>
<rect class="cardT" x="472" y="445" width="368" height="134" rx="8"/>
<rect class="accT" x="472" y="445" width="4" height="134" rx="2"/>
<circle class="accT" cx="494" cy="469" r="10"/>
<text class="num" x="494" y="473" text-anchor="middle">5</text>
<text class="ph" x="514" y="474">Every beat</text>
<text class="t" x="514" y="491">The heartbeat wakes your existing</text>
<text class="t" x="514" y="513">agent, which must ask the kernel</text>
<text class="t" x="514" y="535">before acting</text>
<text class="c" x="514" y="559">loopx quota should-run</text>
<rect class="cardT" x="472" y="605" width="368" height="134" rx="8"/>
<rect class="accT" x="472" y="605" width="4" height="134" rx="2"/>
<circle class="accT" cx="494" cy="629" r="10"/>
<text class="num" x="494" y="633" text-anchor="middle">6</text>
<text class="ph" x="514" y="634">Every beat</text>
<text class="t" x="514" y="651">It claims one bounded todo, executes a</text>
<text class="t" x="514" y="673">turn, writes back evidence and the</text>
<text class="t" x="514" y="695">next todo</text>
<text class="c" x="514" y="719">loopx todo claim · loopx todo update</text>
<rect class="cardT" x="472" y="765" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="765" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="789" r="10"/>
<text class="num" x="494" y="793" text-anchor="middle">7</text>
<text class="ph" x="514" y="794">Every beat</text>
<text class="t" x="514" y="811">When a decision is yours, it stops and</text>
<text class="t" x="514" y="833">asks a concrete question instead of</text>
<text class="t" x="514" y="855">guessing</text>
<text class="comp" x="514" y="883">component: user gate</text>
<rect class="card" x="40" y="833" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="833" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="857" r="10"/>
<text class="num" x="62" y="861" text-anchor="middle">8</text>
<text class="ph" x="82" y="862">Every beat</text>
<text class="t" x="82" y="879">Read the evidence packet and record</text>
<text class="t" x="82" y="901">your gate decisions</text>
<text class="c" x="82" y="925">loopx review-packet · loopx operator-gate</text>
<rect class="val" x="28" y="977" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="1001">VALUE</text>
<text class="valT" x="48" y="1025">The loop keeps moving across days, restarts and even a harness swap; you show up only at</text>
<text class="valT" x="48" y="1047">concrete decisions</text>
</svg>
