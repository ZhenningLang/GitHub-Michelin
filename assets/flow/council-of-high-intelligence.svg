<svg xmlns="http://www.w3.org/2000/svg" width="880" height="971" viewBox="0 0 880 971" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="971" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="813" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="813" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">the council does</text>
<path class="hand" d="M408,118.0 C439.0,118.0 439.0,142 470,142" marker-end="url(#a)"/>
<path class="hand" d="M472,154.0 C441.0,154.0 441.0,214 410,214" marker-end="url(#a)"/>
<path class="hand" d="M408,247.0 C439.0,247.0 439.0,271 470,271" marker-end="url(#a)"/>
<path class="edge" d="M494,342 L494,366" marker-end="url(#a)"/>
<path class="hand" d="M472,415.0 C441.0,415.0 441.0,439 410,439" marker-end="url(#a)"/>
<path class="hand" d="M408,440.0 C439.0,440.0 439.0,512 470,512" marker-end="url(#a)"/>
<path class="edge" d="M494,582 L494,606" marker-end="url(#a)"/>
<path class="edge" d="M494,680 L494,704" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it into your host</text>
<text class="c" x="82" y="125">/plugin install</text>
<text class="c" x="82" y="144">council@council-of-high-intelligence</text>
<rect class="cardT" x="472" y="118" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="118" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="142" r="10"/>
<text class="num" x="494" y="146" text-anchor="middle">2</text>
<text class="t" x="514" y="147">Drops in the /council coordinator plus</text>
<text class="t" x="514" y="169">18 persona agents</text>
<rect class="card" x="40" y="190" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">3</text>
<text class="t" x="82" y="219">Convene it on one genuinely hard</text>
<text class="t" x="82" y="241">decision</text>
<text class="c" x="82" y="265">/council --triad strategy Where is our</text>
<text class="c" x="82" y="284">defensible advantage?</text>
<rect class="cardT" x="472" y="247" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="247" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="271" r="10"/>
<text class="num" x="494" y="275" text-anchor="middle">4</text>
<text class="t" x="514" y="276">Selects the panel and locks the 1.5x</text>
<text class="t" x="514" y="298">domain-weight seat before any analysis</text>
<text class="c" x="514" y="322">--members · --triad · --profile</text>
<rect class="cardT" x="472" y="368" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="368" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="392" r="10"/>
<text class="num" x="494" y="396" text-anchor="middle">5</text>
<text class="t" x="514" y="397">Round 1: every member restates the</text>
<text class="t" x="514" y="419">problem first, surfacing a framing</text>
<text class="t" x="514" y="441">clash to you</text>
<rect class="card" x="40" y="415" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="415" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="439" r="10"/>
<text class="num" x="62" y="443" text-anchor="middle">6</text>
<text class="t" x="82" y="444">Confirm or correct the framing</text>
<rect class="cardT" x="472" y="488" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="488" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="512" r="10"/>
<text class="num" x="494" y="516" text-anchor="middle">7</text>
<text class="t" x="514" y="517">Round 2: relays peer positions</text>
<text class="t" x="514" y="539">anonymized, and each member must</text>
<text class="t" x="514" y="561">defend or name the flaw</text>
<rect class="cardT" x="472" y="608" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="608" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="632" r="10"/>
<text class="num" x="494" y="636" text-anchor="middle">8</text>
<text class="t" x="514" y="637">Tallies each final STANCE line at</text>
<text class="t" x="514" y="659">confidence weight against a 2/3 bar</text>
<rect class="cardT" x="472" y="706" width="368" height="117" rx="8"/>
<rect class="accT" x="472" y="706" width="4" height="117" rx="2"/>
<circle class="accT" cx="494" cy="730" r="10"/>
<text class="num" x="494" y="734" text-anchor="middle">9</text>
<text class="t" x="514" y="735">A separate chairman writes the</text>
<text class="t" x="514" y="757">verdict: unresolved questions, kill</text>
<text class="t" x="514" y="779">criteria, one next step</text>
<text class="c" x="514" y="803">--chairman gemini</text>
<rect class="val" x="28" y="855" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="879">VALUE</text>
<text class="valT" x="48" y="903">You get an auditable verdict that keeps dissent and unresolved questions, instead of one</text>
<text class="valT" x="48" y="925">model&#x27;s confident answer</text>
</svg>
