<svg xmlns="http://www.w3.org/2000/svg" width="880" height="776" viewBox="0 0 880 776" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="776" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="640" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="640" rx="10"/>
<rect class="pillT" x="474" y="40" width="184.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">wondershaper does</text>
<path class="edge" d="M62,205 L62,229" marker-end="url(#a)"/>
<path class="hand" d="M408,288.0 C439.0,288.0 439.0,312 470,312" marker-end="url(#a)"/>
<path class="edge" d="M494,407 L494,431" marker-end="url(#a)"/>
<path class="edge" d="M494,552 L494,576" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone the repo; optionally install the</text>
<text class="t" x="82" y="123">script system-wide</text>
<text class="c" x="82" y="147">git clone</text>
<text class="c" x="82" y="166">https://github.com/magnific0/wondershaper.</text>
<text class="c" x="82" y="185">git · sudo make install</text>
<rect class="card" x="40" y="231" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="255" r="10"/>
<text class="num" x="62" y="259" text-anchor="middle">2</text>
<text class="t" x="82" y="260">Pick the interface and set</text>
<text class="t" x="82" y="282">download/upload ceilings in Kbps</text>
<text class="c" x="82" y="306">sudo ./wondershaper -a wlp4s0 -u 4096 -d</text>
<text class="c" x="82" y="325">8192</text>
<rect class="cardT" x="472" y="288" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="288" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="312" r="10"/>
<text class="num" x="494" y="316" text-anchor="middle">3</text>
<text class="t" x="514" y="317">Builds an HTB tree on the interface&#x27;s</text>
<text class="t" x="514" y="339">outgoing side with three priority</text>
<text class="t" x="514" y="361">classes</text>
<text class="comp" x="514" y="389">component: tc qdisc: htb + sfq</text>
<rect class="cardT" x="472" y="433" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="433" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="457" r="10"/>
<text class="num" x="494" y="461" text-anchor="middle">4</text>
<text class="t" x="514" y="462">Redirects incoming traffic through the</text>
<text class="t" x="514" y="484">ifb0 virtual device to cap downloads</text>
<text class="t" x="514" y="506">too</text>
<text class="comp" x="514" y="534">component: ifb0</text>
<rect class="cardT" x="472" y="578" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="578" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="602" r="10"/>
<text class="num" x="494" y="606" text-anchor="middle">5</text>
<text class="t" x="514" y="607">Exits; the kernel enforces the caps</text>
<text class="t" x="514" y="629">until cleared or reboot</text>
<rect class="val" x="28" y="682" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="706">VALUE</text>
<text class="valT" x="48" y="730">One command caps a link&#x27;s bandwidth, without hand-writing tc qdisc/class/filter rules</text>
</svg>
