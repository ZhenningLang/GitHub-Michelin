<path class="hand" d="M472,177.5 C441.0,177.5 441.0,236 410,236" marker-end="url(#a)"/>
<path class="hand" d="M408,248.5 C439.0,248.5 439.0,276 470,276" marker-end="url(#a)"/>
<path class="hand" d="M472,300.5 C441.0,300.5 441.0,335 410,335" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">打开在线站点（或 GitHub 上的</text>
<text class="t" x="82" y="123">architecture/ 目录）</text>
<text class="c" x="82" y="147">https://openedclaude.github.io/claude-revi</text>
<text class="c" x="82" y="166">ews-claude/</text>
<rect class="cardT" x="472" y="129" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="129" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="153" r="10"/>
<text class="num" x="494" y="157" text-anchor="middle">2</text>
<text class="t" x="514" y="158">画出 17 个子系统全景，按目标给出六条</text>
<text class="t" x="514" y="180">阅读路径</text>
<text class="comp" x="514" y="208">组件：00 总览章</text>
