<rect class="accY" x="40" y="212" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">3</text>
<text class="t" x="82" y="241">挑出你正在设计的那个子系统对应的章节</text>
<text class="c" x="82" y="265">07-permission-pipeline</text>
<rect class="cardT" x="472" y="252" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="252" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="276" r="10"/>
