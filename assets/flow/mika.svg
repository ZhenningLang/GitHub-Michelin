<svg xmlns="http://www.w3.org/2000/svg" width="880" height="684" viewBox="0 0 880 684" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="684" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="548" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="548" rx="10"/>
<rect class="pillT" x="474" y="40" width="110.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Mika does</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="hand" d="M408,218.5 C439.0,218.5 439.0,242 470,242" marker-end="url(#a)"/>
<path class="hand" d="M472,266.5 C441.0,266.5 441.0,317 410,317" marker-end="url(#a)"/>
<path class="hand" d="M408,318.0 C439.0,318.0 439.0,365 470,365" marker-end="url(#a)"/>
<path class="edge" d="M494,438 L494,462" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the APK and add a model key or</text>
<text class="t" x="82" y="123">account sign-in</text>
<rect class="card" x="40" y="170" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">Turn on debugging switches and type</text>
<text class="t" x="82" y="221">the pairing code once</text>
<text class="comp" x="82" y="249">component: Set up phone control wizard</text>
<rect class="cardT" x="472" y="218" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="218" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="242" r="10"/>
<text class="num" x="494" y="246" text-anchor="middle">3</text>
<text class="t" x="514" y="247">Pair with wireless debugging and start</text>
<text class="t" x="514" y="269">its shell-level helper</text>
<text class="comp" x="514" y="297">component: built-in helper</text>
<rect class="card" x="40" y="293" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="293" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="317" r="10"/>
<text class="num" x="62" y="321" text-anchor="middle">4</text>
<text class="t" x="82" y="322">Say or type a task in the chat</text>
<rect class="cardT" x="472" y="341" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="341" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="365" r="10"/>
<text class="num" x="494" y="369" text-anchor="middle">5</text>
<text class="t" x="514" y="370">Open the apps on a hidden screen, read</text>
<text class="t" x="514" y="392">the UI and tap through</text>
<text class="comp" x="514" y="420">component: background screen</text>
<rect class="cardT" x="472" y="464" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="464" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="488" r="10"/>
<text class="num" x="494" y="492" text-anchor="middle">6</text>
<text class="t" x="514" y="493">Ask when the spending heuristic flags</text>
<text class="t" x="514" y="515">a step; hand logins back and report</text>
<text class="t" x="514" y="537">results</text>
<rect class="val" x="28" y="590" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="614">VALUE</text>
<text class="valT" x="48" y="638">Errands across API-less apps done from one sentence while you keep using the phone</text>
</svg>
