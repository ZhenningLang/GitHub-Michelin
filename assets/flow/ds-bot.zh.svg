<svg xmlns="http://www.w3.org/2000/svg" width="880" height="653" viewBox="0 0 880 653" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="653" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="517" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="517" rx="10"/>
<rect class="pillT" x="474" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">DS Bot</text>
<path class="edge" d="M62,169 L62,193" marker-end="url(#a)"/>
<path class="hand" d="M408,220.0 C439.0,220.0 439.0,255 470,255" marker-end="url(#a)"/>
<path class="hand" d="M472,279.5 C441.0,279.5 441.0,303 410,303" marker-end="url(#a)"/>
<path class="hand" d="M408,304.0 C439.0,304.0 439.0,378 470,378" marker-end="url(#a)"/>
<path class="hand" d="M472,390.0 C441.0,390.0 441.0,414 410,414" marker-end="url(#a)"/>
<path class="hand" d="M408,426.5 C439.0,426.5 439.0,476 470,476" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装桌面应用，或在 DeepSeek Harness 里添加</text>
<text class="t" x="82" y="123">ds-bot 插件</text>
<text class="comp" x="82" y="151">组件：自带固定版 DSH 的桌面应用</text>
<rect class="card" x="40" y="195" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="195" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="219" r="10"/>
<text class="num" x="62" y="223" text-anchor="middle">2</text>
<text class="t" x="82" y="224">在设置里配好一个模型服务商</text>
<rect class="cardT" x="472" y="231" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="231" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="255" r="10"/>
<text class="num" x="494" y="259" text-anchor="middle">3</text>
<text class="t" x="514" y="260">首次打开就有名为 Chief 的主 Bot，带</text>
<text class="t" x="514" y="282">你完成设置</text>
<text class="comp" x="514" y="310">组件：主 Bot</text>
<rect class="card" x="40" y="279" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="279" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="303" r="10"/>
<text class="num" x="62" y="307" text-anchor="middle">4</text>
<text class="t" x="82" y="308">告诉 Chief 你要哪些 Bot 和群聊</text>
<rect class="cardT" x="472" y="354" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="354" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="378" r="10"/>
<text class="num" x="494" y="382" text-anchor="middle">5</text>
<text class="t" x="514" y="383">逐个建 Bot，各自有模型、目录、权限预</text>
<text class="t" x="514" y="405">设和记忆</text>
<rect class="card" x="40" y="390" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="390" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="414" r="10"/>
<text class="num" x="62" y="418" text-anchor="middle">6</text>
<text class="t" x="82" y="419">在群里发消息，或用 @名字 直接点一个 Bot</text>
<text class="c" x="82" y="443">@Name</text>
<rect class="cardT" x="472" y="452" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="452" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="476" r="10"/>
<text class="num" x="494" y="480" text-anchor="middle">7</text>
<text class="t" x="514" y="481">群管理员先回答，再按需叫来相关成员干活</text>
<text class="comp" x="514" y="509">组件：群管理员</text>
<rect class="val" x="28" y="559" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="583">价值</text>
<text class="valT" x="48" y="607">一支记得你、会互相派活的常驻团队，不用每个任务都给新会话重讲一遍</text>
</svg>
