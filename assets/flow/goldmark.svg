<svg xmlns="http://www.w3.org/2000/svg" width="880" height="759" viewBox="0 0 880 759" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="759" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="601" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="601" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Goldmark does</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,285 L62,309" marker-end="url(#a)"/>
<path class="hand" d="M408,347.5 C439.0,347.5 439.0,371 470,371" marker-end="url(#a)"/>
<path class="hand" d="M472,406.5 C441.0,406.5 441.0,434 410,434" marker-end="url(#a)"/>
<path class="hand" d="M408,457.5 C439.0,457.5 439.0,516 470,516" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add the v2 module to your Go project</text>
<text class="c" x="82" y="125">go get github.com/yuin/goldmark/v2</text>
<rect class="card" x="40" y="171" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">Create a parser and register the</text>
<text class="t" x="82" y="222">extensions you want</text>
<text class="c" x="82" y="246">parser.New(parser.WithExtensions(extension</text>
<text class="c" x="82" y="265">.StrikethroughParser))</text>
<rect class="card" x="40" y="311" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">3</text>
<text class="t" x="82" y="340">Parse the source bytes</text>
<text class="c" x="82" y="364">doc := p.Parse(source)</text>
<rect class="cardT" x="472" y="347" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="347" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="371" r="10"/>
<text class="num" x="494" y="375" text-anchor="middle">4</text>
<text class="t" x="514" y="376">Builds a CommonMark-compliant AST in</text>
<text class="t" x="514" y="398">which every node keeps its source</text>
<text class="t" x="514" y="420">position</text>
<text class="comp" x="514" y="448">component: parser</text>
<rect class="card" x="40" y="410" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="410" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="434" r="10"/>
<text class="num" x="62" y="438" text-anchor="middle">5</text>
<text class="t" x="82" y="439">Render the tree with the HTML renderer</text>
<text class="t" x="82" y="461">and the matching extension halves</text>
<text class="c" x="82" y="485">r.Render(&amp;buf, source, doc)</text>
<rect class="cardT" x="472" y="492" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="492" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="516" r="10"/>
<text class="num" x="494" y="520" text-anchor="middle">6</text>
<text class="t" x="514" y="521">Writes HTML, dropping raw HTML and</text>
<text class="t" x="514" y="543">dangerous links unless you opted into</text>
<text class="t" x="514" y="565">unsafe mode</text>
<text class="comp" x="514" y="593">component: renderer/html</text>
<rect class="val" x="28" y="643" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="667">VALUE</text>
<text class="valT" x="48" y="691">Spec-conformant, safe-by-default HTML from a dependency-free Go library you can extend with</text>
<text class="valT" x="48" y="713">your own syntax</text>
</svg>
