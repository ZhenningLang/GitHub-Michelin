<svg xmlns="http://www.w3.org/2000/svg" width="880" height="611" viewBox="0 0 880 611" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="611" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="475" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="475" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Apache POI 做的</text>
<path class="hand" d="M408,121.0 C439.0,121.0 439.0,145 470,145" marker-end="url(#a)"/>
<path class="hand" d="M472,158.5 C441.0,158.5 441.0,220 410,220" marker-end="url(#a)"/>
<path class="hand" d="M408,254.5 C439.0,254.5 439.0,278 470,278" marker-end="url(#a)"/>
<path class="hand" d="M472,291.5 C441.0,291.5 441.0,363 410,363" marker-end="url(#a)"/>
<path class="hand" d="M408,388.0 C439.0,388.0 439.0,412 470,412" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把 OOXML 构件加入 JVM 构建</text>
<text class="c" x="82" y="125">org.apache.poi:poi-ooxml</text>
<text class="comp" x="82" y="148">组件：Maven／Gradle</text>
<rect class="cardT" x="472" y="121" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="121" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="145" r="10"/>
<text class="num" x="494" y="149" text-anchor="middle">2</text>
<text class="t" x="514" y="150">把表格 API 和 xmlbeans 放进 classpath</text>
<text class="comp" x="514" y="178">组件：poi-ooxml</text>
<rect class="card" x="40" y="196" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">3</text>
<text class="t" x="82" y="225">打开已有工作簿，或新建一份 XSSF</text>
<text class="c" x="82" y="249">WorkbookFactory.create · new</text>
<text class="c" x="82" y="268">XSSFWorkbook()</text>
<text class="comp" x="82" y="291">组件：应用代码</text>
<rect class="cardT" x="472" y="254" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="254" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="278" r="10"/>
<text class="num" x="494" y="282" text-anchor="middle">4</text>
<text class="t" x="514" y="283">识别 OLE2 或 OOXML，建成对应 Workbook</text>
<text class="comp" x="514" y="311">组件：SS／OpenXML4J</text>
<rect class="card" x="40" y="339" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="339" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="363" r="10"/>
<text class="num" x="62" y="367" text-anchor="middle">5</text>
<text class="t" x="82" y="368">创建或改工作表、行和单元格，再写出文件</text>
<text class="c" x="82" y="392">wb.write(fileOut)</text>
<text class="comp" x="82" y="415">组件：应用代码</text>
<rect class="cardT" x="472" y="388" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="388" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="412" r="10"/>
<text class="num" x="494" y="416" text-anchor="middle">6</text>
<text class="t" x="514" y="417">把包序列化成 .xls（OLE2）或</text>
<text class="t" x="514" y="439">.xlsx（ZIP+XML）</text>
<text class="comp" x="514" y="467">组件：POIFS／OpenXML4J</text>
<rect class="val" x="28" y="517" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="541">价值</text>
<text class="valT" x="48" y="565">JVM 在未安装 Microsoft Office 的情况下写出一份真的 Excel 文件</text>
</svg>
