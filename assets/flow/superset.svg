<svg xmlns="http://www.w3.org/2000/svg" width="880" height="733" viewBox="0 0 880 733" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="733" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="575" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="575" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Superset does</text>
<path class="hand" d="M408,129.0 C439.0,129.0 439.0,153 470,153" marker-end="url(#a)"/>
<path class="hand" d="M472,188.5 C441.0,188.5 441.0,236 410,236" marker-end="url(#a)"/>
<path class="edge" d="M62,285 L62,309" marker-end="url(#a)"/>
<path class="hand" d="M408,368.0 C439.0,368.0 439.0,392 470,392" marker-end="url(#a)"/>
<path class="hand" d="M472,416.5 C441.0,416.5 441.0,475 410,475" marker-end="url(#a)"/>
<path class="hand" d="M408,487.0 C439.0,487.0 439.0,515 470,515" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone the repo, check out a release</text>
<text class="t" x="82" y="123">tag, boot the official images</text>
<text class="c" x="82" y="147">docker compose -f</text>
<text class="c" x="82" y="166">docker-compose-image-tag.yml up</text>
<rect class="cardT" x="472" y="129" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="129" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="153" r="10"/>
<text class="num" x="494" y="157" text-anchor="middle">2</text>
<text class="t" x="514" y="158">Brings up the web app, metadata</text>
<text class="t" x="514" y="180">Postgres, Redis cache and Celery</text>
<text class="t" x="514" y="202">workers as one stack</text>
<text class="comp" x="514" y="230">component: Docker Compose stack</text>
<rect class="card" x="40" y="212" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">3</text>
<text class="t" x="82" y="241">Log in with the default admin account</text>
<text class="c" x="82" y="265">http://localhost:8088</text>
<rect class="card" x="40" y="311" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">4</text>
<text class="t" x="82" y="340">Register your warehouse with a</text>
<text class="t" x="82" y="362">SQLAlchemy connection string</text>
<text class="c" x="82" y="386">postgresql://{username}:{password}@{host}:</text>
<text class="c" x="82" y="405">{port}/{database}</text>
<rect class="cardT" x="472" y="368" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="368" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="392" r="10"/>
<text class="num" x="494" y="396" text-anchor="middle">5</text>
<text class="t" x="514" y="397">Introspects the schema so tables and</text>
<text class="t" x="514" y="419">columns become selectable datasets</text>
<text class="comp" x="514" y="447">component: SQLAlchemy connector</text>
<rect class="card" x="40" y="451" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="451" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="475" r="10"/>
<text class="num" x="62" y="479" text-anchor="middle">6</text>
<text class="t" x="82" y="480">Build charts in the no-code explorer,</text>
<text class="t" x="82" y="502">save metrics, assemble dashboards</text>
<rect class="cardT" x="472" y="491" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="491" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="515" r="10"/>
<text class="num" x="494" y="519" text-anchor="middle">7</text>
<text class="t" x="514" y="520">Runs each view as SQL against your</text>
<text class="t" x="514" y="542">warehouse and enforces row-level</text>
<text class="t" x="514" y="564">security</text>
<rect class="val" x="28" y="617" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="641">VALUE</text>
<text class="valT" x="48" y="665">Self-service dashboards over your warehouse while credentials and metric definitions stay in</text>
<text class="valT" x="48" y="687">your own infrastructure</text>
</svg>
