<svg xmlns="http://www.w3.org/2000/svg" width="880" height="815" viewBox="0 0 880 815" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="815" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="679" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="679" rx="10"/>
<rect class="pillT" x="474" y="40" width="184.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">React Charts does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,310 L62,334" marker-end="url(#a)"/>
<path class="hand" d="M408,396.0 C439.0,396.0 439.0,420 470,420" marker-end="url(#a)"/>
<path class="edge" d="M494,468 L494,492" marker-end="url(#a)"/>
<path class="edge" d="M494,566 L494,590" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the beta package into a React</text>
<text class="t" x="82" y="123">DOM app</text>
<text class="c" x="82" y="147">npm install react-charts@beta --save</text>
<rect class="card" x="40" y="193" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Shape rows into series, and memoize</text>
<text class="t" x="82" y="244">axes that each take a getValue</text>
<text class="t" x="82" y="266">accessor</text>
<text class="c" x="82" y="290">getValue: datum =&gt; datum.date</text>
<rect class="card" x="40" y="336" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="336" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="360" r="10"/>
<text class="num" x="62" y="364" text-anchor="middle">3</text>
<text class="t" x="82" y="365">Render the Chart component with those</text>
<text class="t" x="82" y="387">options inside a sized container</text>
<text class="c" x="82" y="411">&lt;Chart&gt;</text>
<text class="comp" x="82" y="434">component: Chart component</text>
<rect class="cardT" x="472" y="396" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="396" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="420" r="10"/>
<text class="num" x="494" y="424" text-anchor="middle">4</text>
<text class="t" x="514" y="425">Infers the scale type from your values</text>
<text class="t" x="514" y="447">and builds D3 scales and axes</text>
<rect class="cardT" x="472" y="494" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="494" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="518" r="10"/>
<text class="num" x="494" y="522" text-anchor="middle">5</text>
<text class="t" x="514" y="523">Measures the container and draws SVG</text>
<text class="t" x="514" y="545">lines, areas or bars</text>
<rect class="cardT" x="472" y="592" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="592" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="616" r="10"/>
<text class="num" x="494" y="620" text-anchor="middle">6</text>
<text class="t" x="514" y="621">Snaps tooltip and cursors to the</text>
<text class="t" x="514" y="643">nearest point via a Voronoi hit map</text>
<text class="comp" x="514" y="671">component: Voronoi + tooltip portal</text>
<rect class="val" x="28" y="721" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="745">VALUE</text>
<text class="valT" x="48" y="769">Responsive, hoverable React charts from your own row objects without writing D3 drawing code</text>
</svg>
