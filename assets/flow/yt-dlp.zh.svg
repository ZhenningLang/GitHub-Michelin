<svg xmlns="http://www.w3.org/2000/svg" width="880" height="695" viewBox="0 0 880 695" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="695" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="559" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="559" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">yt-dlp 做的</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="hand" d="M408,273.5 C439.0,273.5 439.0,297 470,297" marker-end="url(#a)"/>
<path class="edge" d="M494,370 L494,394" marker-end="url(#a)"/>
<path class="edge" d="M494,446 L494,470" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装 yt-dlp，再配上 ffmpeg 和 Deno 等 JS </text>
<text class="t" x="82" y="123">运行时</text>
<text class="c" x="82" y="147">python3 -m pip install -U</text>
<text class="c" x="82" y="166">&quot;yt-dlp[default]&quot;</text>
<text class="comp" x="82" y="189">组件：yt-dlp 命令行</text>
<rect class="card" x="40" y="237" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">对页面网址运行它，可选地带上格式选择器</text>
<text class="c" x="82" y="290">yt-dlp -f &quot;bv*+ba/b&quot;</text>
<rect class="cardT" x="472" y="273" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="273" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="297" r="10"/>
<text class="num" x="494" y="301" text-anchor="middle">3</text>
<text class="t" x="514" y="302">匹配站点提取器，列出所有可用的流；YouTube </text>
<text class="t" x="514" y="324">的 JS 挑战也替你解</text>
<text class="comp" x="514" y="352">组件：提取器 + yt-dlp-ejs</text>
<rect class="cardT" x="472" y="396" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="396" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="420" r="10"/>
<text class="num" x="494" y="424" text-anchor="middle">4</text>
<text class="t" x="514" y="425">按你的规则挑出最好的纯视频和纯音频格式</text>
<rect class="cardT" x="472" y="472" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="472" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="496" r="10"/>
<text class="num" x="494" y="500" text-anchor="middle">5</text>
<text class="t" x="514" y="501">两路都下载，交给 ffmpeg 合并成一个按模板命</text>
<text class="t" x="514" y="523">名的文件</text>
<text class="comp" x="514" y="551">组件：ffmpeg 后处理器</text>
<rect class="val" x="28" y="601" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="625">价值</text>
<text class="valT" x="48" y="649">一个页面网址变成最高画质的本地文件，不用自己找流地址、手工合并</text>
</svg>
