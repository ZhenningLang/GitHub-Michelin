<svg xmlns="http://www.w3.org/2000/svg" width="880" height="695" viewBox="0 0 880 695" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="695" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="559" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="559" rx="10"/>
<rect class="pillT" x="474" y="40" width="193.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">book-to-skill does</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,207.5 C439.0,207.5 439.0,231 470,231" marker-end="url(#a)"/>
<path class="edge" d="M494,326 L494,350" marker-end="url(#a)"/>
<path class="hand" d="M472,411.5 C441.0,411.5 441.0,435 410,435" marker-end="url(#a)"/>
<path class="hand" d="M408,447.5 C439.0,447.5 439.0,521 470,521" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it into your agent as a skill</text>
<text class="c" x="82" y="125">npx skills add virgiliojr94/book-to-skill</text>
<rect class="card" x="40" y="171" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">Point it at a book, a folder or a glob</text>
<text class="c" x="82" y="224">/book-to-skill ./my-book.pdf</text>
<rect class="cardT" x="472" y="207" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="207" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="231" r="10"/>
<text class="num" x="494" y="235" text-anchor="middle">3</text>
<text class="t" x="514" y="236">Asks technical or text-heavy, then</text>
<text class="t" x="514" y="258">extracts clean text with the matching</text>
<text class="t" x="514" y="280">tool</text>
<text class="comp" x="514" y="308">component: Python extractor</text>
<rect class="cardT" x="472" y="352" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="352" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="376" r="10"/>
<text class="num" x="494" y="380" text-anchor="middle">4</text>
<text class="t" x="514" y="381">Has your agent&#x27;s model write SKILL.md</text>
<text class="t" x="514" y="403">plus one file per chapter, glossary</text>
<text class="t" x="514" y="425">and cheatsheet</text>
<text class="comp" x="514" y="453">component: SKILL.md generator spec</text>
<rect class="card" x="40" y="411" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="411" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="435" r="10"/>
<text class="num" x="62" y="439" text-anchor="middle">5</text>
<text class="t" x="82" y="440">Later, ask the new skill about a topic</text>
<text class="c" x="82" y="464">/my-book replication</text>
<rect class="cardT" x="472" y="497" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="497" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="521" r="10"/>
<text class="num" x="494" y="525" text-anchor="middle">6</text>
<text class="t" x="514" y="526">Loads only the matching chapter and</text>
<text class="t" x="514" y="548">answers from its notes</text>
<rect class="val" x="28" y="601" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="625">VALUE</text>
<text class="valT" x="48" y="649">The book is on tap in every session for a few thousand tokens instead of the whole text</text>
</svg>
