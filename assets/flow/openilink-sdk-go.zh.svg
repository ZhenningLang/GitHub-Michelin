<svg xmlns="http://www.w3.org/2000/svg" width="880" height="555" viewBox="0 0 880 555" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="555" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="419" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="419" rx="10"/>
<rect class="pillT" x="474" y="40" width="215.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpeniLink Go SDK 做的</text>
<path class="hand" d="M408,130.5 C439.0,130.5 439.0,154 470,154" marker-end="url(#a)"/>
<path class="hand" d="M472,178.5 C441.0,178.5 441.0,239 410,239" marker-end="url(#a)"/>
<path class="hand" d="M408,252.5 C439.0,252.5 439.0,277 470,277" marker-end="url(#a)"/>
<path class="hand" d="M472,290.5 C441.0,290.5 441.0,340 410,340" marker-end="url(#a)"/>
<path class="hand" d="M408,353.5 C439.0,353.5 439.0,378 470,378" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 Go 服务中加入 module 并创建 client</text>
<text class="c" x="82" y="125">go get</text>
<text class="c" x="82" y="144">github.com/openilink/openilink-sdk-go</text>
<text class="comp" x="82" y="167">组件：宿主服务</text>
<rect class="cardT" x="472" y="130" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="130" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="154" r="10"/>
<text class="num" x="494" y="158" text-anchor="middle">2</text>
<text class="t" x="514" y="159">执行扫码登录并更新 client token 与</text>
<text class="t" x="514" y="181">endpoint</text>
<text class="comp" x="514" y="209">组件：登录 client</text>
<rect class="card" x="40" y="215" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">3</text>
<text class="t" x="82" y="244">传入处理器、已存游标与回调，启动 Monitor</text>
<text class="comp" x="82" y="272">组件：宿主服务</text>
<rect class="cardT" x="472" y="253" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="253" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="277" r="10"/>
<text class="num" x="494" y="281" text-anchor="middle">4</text>
<text class="t" x="514" y="282">长轮询并退避，更新游标后调用处理器</text>
<text class="comp" x="514" y="310">组件：monitor loop</text>
<rect class="card" x="40" y="316" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="316" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="340" r="10"/>
<text class="num" x="62" y="344" text-anchor="middle">5</text>
<text class="t" x="82" y="345">持久化 cursor，并决定应用回复</text>
<text class="comp" x="82" y="373">组件：宿主服务</text>
<rect class="cardT" x="472" y="354" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="354" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="378" r="10"/>
<text class="num" x="494" y="382" text-anchor="middle">6</text>
<text class="t" x="514" y="383">使用缓存的 context token 发出回复</text>
<text class="comp" x="514" y="411">组件：消息 client</text>
<rect class="val" x="28" y="461" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="485">价值</text>
<text class="valT" x="48" y="509">服务自己控制 Bot 行为，不必重写 iLink transport 与 media 细节。</text>
</svg>
