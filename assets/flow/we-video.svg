<svg xmlns="http://www.w3.org/2000/svg" width="880" height="667" viewBox="0 0 880 667" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="667" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="509" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="509" rx="10"/>
<rect class="pillT" x="474" y="40" width="101.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">We-Video</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,240.0 C439.0,240.0 439.0,275 470,275" marker-end="url(#a)"/>
<path class="hand" d="M472,287.0 C441.0,287.0 441.0,315 410,315" marker-end="url(#a)"/>
<path class="hand" d="M408,327.0 C439.0,327.0 439.0,373 470,373" marker-end="url(#a)"/>
<path class="hand" d="M472,385.0 C441.0,385.0 441.0,413 410,413" marker-end="url(#a)"/>
<path class="hand" d="M408,425.0 C439.0,425.0 439.0,471 470,471" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Supply account assets, prompts and</text>
<text class="t" x="82" y="123">keys; restore missing job routes, then</text>
<text class="t" x="82" y="145">start</text>
<text class="c" x="82" y="169">npm run dev</text>
<rect class="card" x="40" y="215" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Submit an article for narration</text>
<rect class="cardT" x="472" y="251" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="251" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="275" r="10"/>
<text class="num" x="494" y="279" text-anchor="middle">3</text>
<text class="t" x="514" y="280">Generate a draft and retain source</text>
<text class="t" x="514" y="302">text for review</text>
<rect class="card" x="40" y="291" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="291" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="315" r="10"/>
<text class="num" x="62" y="319" text-anchor="middle">4</text>
<text class="t" x="82" y="320">Correct and approve the draft, then</text>
<text class="t" x="82" y="342">select a voice</text>
<rect class="cardT" x="472" y="349" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="349" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="373" r="10"/>
<text class="num" x="494" y="377" text-anchor="middle">5</text>
<text class="t" x="514" y="378">Synthesize speech and collect word</text>
<text class="t" x="514" y="400">timing</text>
<rect class="card" x="40" y="389" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="389" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="413" r="10"/>
<text class="num" x="62" y="417" text-anchor="middle">6</text>
<text class="t" x="82" y="418">Review audio, prepare pictures and</text>
<text class="t" x="82" y="440">approve the visual plan</text>
<rect class="cardT" x="472" y="447" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="447" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="471" r="10"/>
<text class="num" x="494" y="475" text-anchor="middle">7</text>
<text class="t" x="514" y="476">Render and check the MP4 before</text>
<text class="t" x="514" y="498">marking it completed</text>
<rect class="val" x="28" y="551" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="575">VALUE</text>
<text class="valT" x="48" y="599">After integration repair, review each stage without assembling speech, captions and video by</text>
<text class="valT" x="48" y="621">hand</text>
</svg>
