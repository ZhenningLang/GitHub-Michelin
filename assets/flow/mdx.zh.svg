<svg xmlns="http://www.w3.org/2000/svg" width="880" height="578" viewBox="0 0 880 578" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="578" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="442" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="442" rx="10"/>
<rect class="pillT" x="474" y="40" width="96.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">MDX 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,228.0 C439.0,228.0 439.0,252 470,252" marker-end="url(#a)"/>
<path class="edge" d="M494,300 L494,324" marker-end="url(#a)"/>
<path class="hand" d="M472,351.0 C441.0,351.0 441.0,386 410,386" marker-end="url(#a)"/>
<path class="hand" d="M408,398.5 C439.0,398.5 439.0,426 470,426" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">安装编译器，或你已在用的打包器对应的集成</text>
<text class="c" x="82" y="125">npm install @mdx-js/mdx</text>
<rect class="card" x="40" y="171" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">写 .mdx：Markdown 加 import、export 与</text>
<text class="t" x="82" y="222">JSX</text>
<text class="c" x="82" y="246">import {Chart} from &#x27;./snowfall.js&#x27; ·</text>
<text class="c" x="82" y="265">&lt;Chart year={year} color=&quot;#fcb32c&quot; /&gt;</text>
<rect class="cardT" x="472" y="228" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="228" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="252" r="10"/>
<text class="num" x="494" y="256" text-anchor="middle">3</text>
<text class="t" x="514" y="257">remark-mdx 解析 MDX 语法，文档变成一棵</text>
<text class="t" x="514" y="279">AST</text>
<rect class="cardT" x="472" y="326" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="326" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="350" r="10"/>
<text class="num" x="494" y="354" text-anchor="middle">4</text>
<text class="t" x="514" y="355">把这棵 AST 编译成一个 JavaScript 模块</text>
<rect class="card" x="40" y="362" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="362" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="386" r="10"/>
<text class="num" x="62" y="390" text-anchor="middle">5</text>
<text class="t" x="82" y="391">经由你的打包器构建，或者直接求值</text>
<text class="c" x="82" y="415">compile() · evaluate() · @mdx-js/rollup</text>
<rect class="cardT" x="472" y="402" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="402" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="426" r="10"/>
<text class="num" x="494" y="430" text-anchor="middle">6</text>
<text class="t" x="514" y="431">由你的框架用你 import 进来的组件完成渲染</text>
<rect class="val" x="28" y="484" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="508">价值</text>
<text class="valT" x="48" y="532">正文与实时的应用组件编译进同一棵树，不必再维护一份平行内容</text>
</svg>
