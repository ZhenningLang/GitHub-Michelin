<svg xmlns="http://www.w3.org/2000/svg" width="880" height="736" viewBox="0 0 880 736" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="736" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="600" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="600" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">KAPLAY 做的</text>
<path class="edge" d="M62,187 L62,211" marker-end="url(#a)"/>
<path class="hand" d="M408,270.5 C439.0,270.5 439.0,294 470,294" marker-end="url(#a)"/>
<path class="hand" d="M472,316.0 C441.0,316.0 441.0,378 410,378" marker-end="url(#a)"/>
<path class="edge" d="M62,463 L62,487" marker-end="url(#a)"/>
<path class="hand" d="M408,543.5 C439.0,543.5 439.0,567 470,567" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="115" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="115" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">搭建</text>
<text class="t" x="82" y="118">用脚手架建一个游戏项目（Vite 模板）</text>
<text class="c" x="82" y="142">npx create-kaplay my-game</text>
<text class="comp" x="82" y="165">组件：create-kaplay 脚手架</text>
<rect class="card" x="40" y="213" width="368" height="115" rx="8"/>
<rect class="accY" x="40" y="213" width="4" height="115" rx="2"/>
<circle class="accY" cx="62" cy="237" r="10"/>
<text class="num" x="62" y="241" text-anchor="middle">2</text>
<text class="ph" x="82" y="242">搭建</text>
<text class="t" x="82" y="259">在 src/game.js 里启动游戏</text>
<text class="c" x="82" y="283">kaplay()</text>
<text class="comp" x="82" y="306">组件：KAPLAY 核心</text>
<rect class="cardT" x="472" y="270" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="270" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="294" r="10"/>
<text class="num" x="494" y="298" text-anchor="middle">3</text>
<text class="ph" x="514" y="299">搭建</text>
<text class="t" x="514" y="316">创建画布、WebGL 渲染器和游戏循环</text>
<text class="comp" x="514" y="344">组件：WebGL 渲染器</text>
<rect class="card" x="40" y="354" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="354" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="378" r="10"/>
<text class="num" x="62" y="382" text-anchor="middle">4</text>
<text class="ph" x="82" y="383">搭建</text>
<text class="t" x="82" y="400">用小组件拼出一个游戏对象</text>
<text class="c" x="82" y="424">add([rect(40, 40), pos(100, 200), area(),</text>
<text class="c" x="82" y="443">body()])</text>
<rect class="card" x="40" y="489" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="489" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="513" r="10"/>
<text class="num" x="62" y="517" text-anchor="middle">5</text>
<text class="ph" x="82" y="518">每一帧</text>
<text class="t" x="82" y="535">把行为写成按键、每帧、碰撞的回调</text>
<text class="c" x="82" y="559">onKeyDown(&quot;w&quot;, () =&gt; { player.move(0, 100)</text>
<text class="c" x="82" y="578">})</text>
<rect class="cardT" x="472" y="543" width="368" height="67" rx="8"/>
<rect class="accT" x="472" y="543" width="4" height="67" rx="2"/>
<circle class="accT" cx="494" cy="567" r="10"/>
<text class="num" x="494" y="571" text-anchor="middle">6</text>
<text class="ph" x="514" y="572">每一帧</text>
<text class="t" x="514" y="589">每帧渲染、推进物理并触发你写的回调</text>
<rect class="val" x="28" y="642" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="666">价值</text>
<text class="valT" x="48" y="690">不用手写游戏循环、渲染器和碰撞检测——你只写行为，KAPLAY 跑每一帧</text>
</svg>
