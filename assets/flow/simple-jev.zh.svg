<svg xmlns="http://www.w3.org/2000/svg" width="880" height="784" viewBox="0 0 880 784" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="784" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="648" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="648" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Simple Jev 做的</text>
<path class="hand" d="M408,139.0 C439.0,139.0 439.0,163 470,163" marker-end="url(#a)"/>
<path class="hand" d="M472,185.0 C441.0,185.0 441.0,256 410,256" marker-end="url(#a)"/>
<path class="hand" d="M408,288.0 C439.0,288.0 439.0,312 470,312" marker-end="url(#a)"/>
<path class="edge" d="M494,402 L494,426" marker-end="url(#a)"/>
<path class="hand" d="M472,472.5 C441.0,472.5 441.0,496 410,496" marker-end="url(#a)"/>
<path class="hand" d="M408,539.0 C439.0,539.0 439.0,567 470,567" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="134" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="134" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">起服务</text>
<text class="t" x="82" y="118">装好服务端，用任意开源聊天模型起一个进程</text>
<text class="c" x="82" y="142">pip install -e &#x27;./hf-server&#x27; · simple-jev</text>
<text class="c" x="82" y="161">--model Qwen/Qwen3.5-0.8B</text>
<text class="comp" x="82" y="184">组件：hf-server</text>
<rect class="cardT" x="472" y="139" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="139" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="163" r="10"/>
<text class="num" x="494" y="167" text-anchor="middle">2</text>
<text class="ph" x="514" y="168">起服务</text>
<text class="t" x="514" y="185">加载模型，对外暴露判定接口</text>
<text class="comp" x="514" y="213">组件：hf-server</text>
<rect class="card" x="40" y="232" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="232" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="256" r="10"/>
<text class="num" x="62" y="260" text-anchor="middle">3</text>
<text class="ph" x="82" y="261">起服务</text>
<text class="t" x="82" y="278">发一次请求：一段共享上下文，加一组带</text>
<text class="t" x="82" y="300">类型的问题</text>
<text class="c" x="82" y="324">POST /v1/classifier</text>
<rect class="cardT" x="472" y="288" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="288" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="312" r="10"/>
<text class="num" x="494" y="316" text-anchor="middle">4</text>
<text class="ph" x="514" y="317">起服务</text>
<text class="t" x="514" y="334">每题生成一条 v1 提示，共享前缀只算一次，然</text>
<text class="t" x="514" y="356">后只读答案标签那几位 logits</text>
<text class="comp" x="514" y="384">组件：common</text>
<rect class="cardT" x="472" y="428" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="428" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="452" r="10"/>
<text class="num" x="494" y="456" text-anchor="middle">5</text>
<text class="ph" x="514" y="457">起服务</text>
<text class="t" x="514" y="474">返回带置信度的逐问题 JSON；它一个 token 都</text>
<text class="t" x="514" y="496">不生成</text>
<rect class="card" x="40" y="472" width="368" height="134" rx="8"/>
<rect class="accY" x="40" y="472" width="4" height="134" rx="2"/>
<circle class="accY" cx="62" cy="496" r="10"/>
<text class="num" x="62" y="500" text-anchor="middle">6</text>
<text class="ph" x="82" y="501">变成你的</text>
<text class="t" x="82" y="518">底座不够准时，标几条样本，微调答案 token</text>
<text class="c" x="82" y="542">python RFDT/prepare.py · torchrun</text>
<text class="c" x="82" y="561">RFDT/train.py</text>
<text class="comp" x="82" y="584">组件：RFDT</text>
<rect class="cardT" x="472" y="543" width="368" height="115" rx="8"/>
<rect class="accT" x="472" y="543" width="4" height="115" rx="2"/>
<circle class="accT" cx="494" cy="567" r="10"/>
<text class="num" x="494" y="571" text-anchor="middle">7</text>
<text class="ph" x="514" y="572">变成你的</text>
<text class="t" x="514" y="589">合并 adapter，用同一个接口把它服务出去</text>
<text class="c" x="514" y="613">python RFDT/export.py</text>
<text class="comp" x="514" y="636">组件：RFDT</text>
<rect class="val" x="28" y="690" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="714">价值</text>
<text class="valT" x="48" y="738">从你已有的模型直接拿到带置信度的逐问题答案——不用解析生成的 JSON，也不用训分类器头</text>
</svg>
