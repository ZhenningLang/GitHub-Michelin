<svg xmlns="http://www.w3.org/2000/svg" width="880" height="650" viewBox="0 0 880 650" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="650" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="514" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="514" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">pix2tex 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,242.0 C439.0,242.0 439.0,266 470,266" marker-end="url(#a)"/>
<path class="edge" d="M494,314 L494,338" marker-end="url(#a)"/>
<path class="edge" d="M494,412 L494,436" marker-end="url(#a)"/>
<path class="hand" d="M472,474.0 C441.0,474.0 441.0,498 410,498" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好 PyTorch 再装包，模型权重首次运行时自</text>
<text class="t" x="82" y="123">动下载</text>
<text class="c" x="82" y="147">pip install &quot;pix2tex[gui]&quot;</text>
<rect class="card" x="40" y="193" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">打开 GUI，在屏幕上框选一个公式</text>
<text class="c" x="82" y="246">latexocr</text>
<text class="comp" x="82" y="269">组件：截图 GUI</text>
<rect class="cardT" x="472" y="242" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="242" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="266" r="10"/>
<text class="num" x="494" y="270" text-anchor="middle">3</text>
<text class="t" x="514" y="271">一个小网络估出最合适的分辨率，把截图缩放成</text>
<text class="t" x="514" y="293">接近训练数据的样子</text>
<rect class="cardT" x="472" y="340" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="340" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="364" r="10"/>
<text class="num" x="494" y="368" text-anchor="middle">4</text>
<text class="t" x="514" y="369">图像编码器读截图，解码器逐个 token 写出</text>
<text class="t" x="514" y="391">LaTeX</text>
<rect class="cardT" x="472" y="438" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="438" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="462" r="10"/>
<text class="num" x="494" y="466" text-anchor="middle">5</text>
<text class="t" x="514" y="467">用 MathJax 渲染结果，并把 LaTeX 复</text>
<text class="t" x="514" y="489">制到剪贴板</text>
<rect class="card" x="40" y="474" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="474" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="498" r="10"/>
<text class="num" x="62" y="502" text-anchor="middle">6</text>
<text class="t" x="82" y="503">对照预览和原图核一遍，粘进你的文档</text>
<rect class="val" x="28" y="556" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="580">价值</text>
<text class="valT" x="48" y="604">公式变成可编译的 LaTeX，不用手敲，图片也不出本机</text>
</svg>
