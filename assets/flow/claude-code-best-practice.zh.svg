<svg xmlns="http://www.w3.org/2000/svg" width="880" height="707" viewBox="0 0 880 707" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="707" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="571" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="571" rx="10"/>
<rect class="pillT" x="474" y="40" width="152.8" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">仓库自带示例做的</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="hand" d="M408,217.5 C439.0,217.5 439.0,241 470,241" marker-end="url(#a)"/>
<path class="edge" d="M494,292 L494,316" marker-end="url(#a)"/>
<path class="edge" d="M494,393 L494,417" marker-end="url(#a)"/>
<path class="hand" d="M472,467.5 C441.0,467.5 441.0,491 410,491" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把概念表和带出处的技巧当课程读，而不</text>
<text class="t" x="82" y="123">是当插件装</text>
<rect class="card" x="40" y="170" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">在克隆下来的仓库里启动 Claude Code，运行示</text>
<text class="t" x="82" y="221">例命令</text>
<text class="c" x="82" y="245">/weather-orchestrator</text>
<rect class="cardT" x="472" y="217" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="217" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="241" r="10"/>
<text class="num" x="494" y="245" text-anchor="middle">3</text>
<text class="t" x="514" y="246">命令先问你要摄氏度还是华氏度</text>
<text class="comp" x="514" y="274">组件：斜杠命令</text>
<rect class="cardT" x="472" y="318" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="318" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="342" r="10"/>
<text class="num" x="494" y="346" text-anchor="middle">4</text>
<text class="t" x="514" y="347">子 agent 用预装给它的 skill 去取气温</text>
<text class="comp" x="514" y="375">组件：weather-agent 子 agent</text>
<rect class="cardT" x="472" y="419" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="419" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="443" r="10"/>
<text class="num" x="494" y="447" text-anchor="middle">5</text>
<text class="t" x="514" y="448">命令再直接调另一个 skill，写出 SVG 卡片和</text>
<text class="t" x="514" y="470">output.md</text>
<text class="comp" x="514" y="498">组件：weather-svg-creator skill</text>
<rect class="card" x="40" y="467" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="467" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="491" r="10"/>
<text class="num" x="62" y="495" text-anchor="middle">6</text>
<text class="t" x="82" y="496">把“命令 → 子 agent → skill”的分工照搬进自</text>
<text class="t" x="82" y="518">己项目的文件</text>
<text class="c" x="82" y="542">.claude/commands/ · .claude/agents/ ·</text>
<text class="c" x="82" y="561">.claude/skills/</text>
<rect class="val" x="28" y="613" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="637">价值</text>
<text class="valT" x="48" y="661">在一个能跑的例子上看清命令、子 agent 和 skill 怎么交接，不用再从零散文档和推文里拼</text>
</svg>
