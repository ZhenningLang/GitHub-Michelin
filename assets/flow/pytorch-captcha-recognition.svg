<svg xmlns="http://www.w3.org/2000/svg" width="880" height="759" viewBox="0 0 880 759" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="759" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="601" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="601" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The scripts do</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,262.5 C439.0,262.5 439.0,286 470,286" marker-end="url(#a)"/>
<path class="hand" d="M472,298.0 C441.0,298.0 441.0,360 410,360" marker-end="url(#a)"/>
<path class="hand" d="M408,372.5 C439.0,372.5 439.0,396 470,396" marker-end="url(#a)"/>
<path class="hand" d="M472,431.5 C441.0,431.5 441.0,459 410,459" marker-end="url(#a)"/>
<path class="hand" d="M408,482.5 C439.0,482.5 439.0,541 470,541" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install PyTorch and the ImageCaptcha</text>
<text class="t" x="82" y="123">generator; set the charset and length</text>
<text class="t" x="82" y="145">in its settings file</text>
<text class="c" x="82" y="169">pip install captcha · captcha_setting.py</text>
<rect class="card" x="40" y="215" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Run the generator to make auto-labeled</text>
<text class="t" x="82" y="266">synthetic captchas</text>
<text class="c" x="82" y="290">python captcha_gen.py</text>
<rect class="cardT" x="472" y="262" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="262" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="286" r="10"/>
<text class="num" x="494" y="290" text-anchor="middle">3</text>
<text class="t" x="514" y="291">Writes images into dataset/train/, the</text>
<text class="t" x="514" y="313">answer encoded in each file name</text>
<rect class="card" x="40" y="336" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="336" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="360" r="10"/>
<text class="num" x="62" y="364" text-anchor="middle">4</text>
<text class="t" x="82" y="365">Start training</text>
<text class="c" x="82" y="389">python captcha_train.py</text>
<rect class="cardT" x="472" y="372" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="372" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="396" r="10"/>
<text class="num" x="494" y="400" text-anchor="middle">5</text>
<text class="t" x="514" y="401">Trains a small CNN whose output has</text>
<text class="t" x="514" y="423">one score slice per character</text>
<text class="t" x="514" y="445">position; saves model.pkl</text>
<text class="comp" x="514" y="473">component: captcha_cnn_model.py</text>
<rect class="card" x="40" y="435" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="435" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="459" r="10"/>
<text class="num" x="62" y="463" text-anchor="middle">6</text>
<text class="t" x="82" y="464">Run prediction on the images in the</text>
<text class="t" x="82" y="486">predict folder</text>
<text class="c" x="82" y="510">python captcha_predict.py</text>
<rect class="cardT" x="472" y="517" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="517" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="541" r="10"/>
<text class="num" x="494" y="545" text-anchor="middle">7</text>
<text class="t" x="514" y="546">Picks the top-scoring character in</text>
<text class="t" x="514" y="568">each slice and prints the 4-character</text>
<text class="t" x="514" y="590">code</text>
<rect class="val" x="28" y="643" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="667">VALUE</text>
<text class="valT" x="48" y="691">A readable end-to-end baseline: no character segmentation, no hand labeling — the generator</text>
<text class="valT" x="48" y="713">labels the data for you</text>
</svg>
