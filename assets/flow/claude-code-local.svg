<svg xmlns="http://www.w3.org/2000/svg" width="880" height="737" viewBox="0 0 880 737" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="737" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="579" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="579" rx="10"/>
<rect class="pillT" x="474" y="40" width="230.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">claude-code-local does</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="edge" d="M494,226 L494,250" marker-end="url(#a)"/>
<path class="hand" d="M472,288.0 C441.0,288.0 441.0,312 410,312" marker-end="url(#a)"/>
<path class="hand" d="M408,324.5 C439.0,324.5 439.0,374 470,374" marker-end="url(#a)"/>
<path class="hand" d="M472,409.5 C441.0,409.5 441.0,433 410,433" marker-end="url(#a)"/>
<path class="hand" d="M408,434.0 C439.0,434.0 439.0,519 470,519" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone the repo on an Apple Silicon Mac</text>
<text class="t" x="82" y="123">and run its setup script</text>
<text class="c" x="82" y="147">bash setup.sh</text>
<text class="comp" x="82" y="170">component: setup.sh</text>
<rect class="cardT" x="472" y="132" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">Reads your RAM, picks a model that</text>
<text class="t" x="514" y="183">fits, installs mlx-lm in a venv and</text>
<text class="t" x="514" y="205">downloads the weights</text>
<rect class="cardT" x="472" y="252" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="252" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="276" r="10"/>
<text class="num" x="494" y="280" text-anchor="middle">3</text>
<text class="t" x="514" y="281">Links its server into place and puts a</text>
<text class="t" x="514" y="303">Claude Local launcher on your Desktop</text>
<rect class="card" x="40" y="288" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="288" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="312" r="10"/>
<text class="num" x="62" y="316" text-anchor="middle">4</text>
<text class="t" x="82" y="317">Double-click the launcher</text>
<text class="c" x="82" y="341">Claude Local.command</text>
<rect class="cardT" x="472" y="350" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="350" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="374" r="10"/>
<text class="num" x="494" y="378" text-anchor="middle">5</text>
<text class="t" x="514" y="379">Starts the MLX server on</text>
<text class="t" x="514" y="401">localhost:4000 and opens Claude Code</text>
<text class="t" x="514" y="423">pointed at it</text>
<text class="comp" x="514" y="451">component: proxy/server.py</text>
<rect class="card" x="40" y="409" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="409" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="433" r="10"/>
<text class="num" x="62" y="437" text-anchor="middle">6</text>
<text class="t" x="82" y="438">Work in Claude Code as usual</text>
<rect class="cardT" x="472" y="495" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="495" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="519" r="10"/>
<text class="num" x="494" y="523" text-anchor="middle">7</text>
<text class="t" x="514" y="524">Answers each turn on the Mac&#x27;s GPU and</text>
<text class="t" x="514" y="546">turns the model&#x27;s tool-call text into</text>
<text class="t" x="514" y="568">Claude Code tool calls</text>
<rect class="val" x="28" y="621" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="645">VALUE</text>
<text class="valT" x="48" y="669">Claude Code keeps working with no cloud model, no API key and no usage limit — prompts and</text>
<text class="valT" x="48" y="691">code stay on the Mac</text>
</svg>
