<svg xmlns="http://www.w3.org/2000/svg" width="880" height="663" viewBox="0 0 880 663" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="663" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="527" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="527" rx="10"/>
<rect class="pillT" x="474" y="40" width="96.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">ART 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,244 L62,268" marker-end="url(#a)"/>
<path class="hand" d="M408,317.5 C439.0,317.5 439.0,341 470,341" marker-end="url(#a)"/>
<path class="hand" d="M472,365.5 C441.0,365.5 441.0,415 410,415" marker-end="url(#a)"/>
<path class="hand" d="M408,437.0 C439.0,437.0 439.0,464 470,464" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在你的 agent 项目里装上 ART 客户端</text>
<text class="c" x="82" y="125">pip install openpipe-art</text>
<rect class="card" x="40" y="171" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">创建 TrainableModel 并注册一个后端</text>
<text class="c" x="82" y="224">await model.register(backend)</text>
<rect class="card" x="40" y="270" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="270" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="294" r="10"/>
<text class="num" x="62" y="298" text-anchor="middle">3</text>
<text class="t" x="82" y="299">用这个模型的 OpenAI 风格客户端跑你的</text>
<text class="t" x="82" y="321">agent</text>
<text class="c" x="82" y="345">model.openai_client()</text>
<rect class="cardT" x="472" y="317" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="317" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="341" r="10"/>
<text class="num" x="494" y="345" text-anchor="middle">4</text>
<text class="t" x="514" y="346">用 vLLM 服务当前 LoRA，把每次 rollout 记</text>
<text class="t" x="514" y="368">成一条轨迹</text>
<text class="comp" x="514" y="396">组件：vLLM 服务器</text>
<rect class="card" x="40" y="391" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="391" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="415" r="10"/>
<text class="num" x="62" y="419" text-anchor="middle">5</text>
<text class="t" x="82" y="420">用 RULER 给每组轨迹打分</text>
<text class="c" x="82" y="444">await ruler_score_group(group,</text>
<text class="c" x="82" y="463">&quot;openai/o3&quot;)</text>
<rect class="cardT" x="472" y="440" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="440" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="464" r="10"/>
<text class="num" x="494" y="468" text-anchor="middle">6</text>
<text class="t" x="514" y="469">跑 GRPO、存下新 LoRA、热加载回 vLLM</text>
<text class="t" x="514" y="491">、恢复推理</text>
<text class="comp" x="514" y="519">组件：GRPO 训练循环</text>
<rect class="val" x="28" y="569" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="593">价值</text>
<text class="valT" x="48" y="617">你的 agent 在真实任务上肉眼可见变强：免标注轨迹、免手写奖励、免自建训练集群</text>
</svg>
