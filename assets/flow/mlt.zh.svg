<svg xmlns="http://www.w3.org/2000/svg" width="880" height="785" viewBox="0 0 880 785" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="785" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="649" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="649" rx="10"/>
<rect class="pillT" x="474" y="40" width="96.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">MLT 做的</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="edge" d="M62,288 L62,312" marker-end="url(#a)"/>
<path class="hand" d="M408,360.0 C439.0,360.0 439.0,384 470,384" marker-end="url(#a)"/>
<path class="edge" d="M494,457 L494,481" marker-end="url(#a)"/>
<path class="edge" d="M494,558 L494,582" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">备好 FFmpeg 开发库，编译安装 MLT</text>
<text class="c" x="82" y="125">cmake .. &amp;&amp; cmake --build . &amp;&amp; sudo cmake</text>
<text class="c" x="82" y="144">--install .</text>
<text class="comp" x="82" y="167">组件：libmlt + 模块 + melt</text>
<rect class="card" x="40" y="215" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">排好片段，中间加一段 25 帧的亮度转场</text>
<text class="c" x="82" y="268">melt clip1.dv clip2.dv -mix 25 -mixer luma</text>
<rect class="card" x="40" y="314" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">3</text>
<text class="t" x="82" y="343">把输出指向编码器，而不是预览窗口</text>
<text class="c" x="82" y="367">-consumer avformat:output.avi</text>
<text class="c" x="82" y="386">acodec=libmp3lame vcodec=libx264</text>
<rect class="cardT" x="472" y="360" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="360" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="384" r="10"/>
<text class="num" x="494" y="388" text-anchor="middle">4</text>
<text class="t" x="514" y="389">生产者经 FFmpeg 解码每个片段，统一到</text>
<text class="t" x="514" y="411">同一套参数</text>
<text class="comp" x="514" y="439">组件：avformat 生产者</text>
<rect class="cardT" x="472" y="483" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="483" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="507" r="10"/>
<text class="num" x="494" y="511" text-anchor="middle">5</text>
<text class="t" x="514" y="512">按时间线顺序取帧，套滤镜、混合转场</text>
<text class="comp" x="514" y="540">组件：playlist / tractor</text>
<rect class="cardT" x="472" y="584" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="584" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="608" r="10"/>
<text class="num" x="494" y="612" text-anchor="middle">6</text>
<text class="t" x="514" y="613">消费者把成品帧编码写进输出文件</text>
<text class="comp" x="514" y="641">组件：avformat 消费者</text>
<rect class="val" x="28" y="691" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="715">价值</text>
<text class="valT" x="48" y="739">多轨剪辑变成一条可重复的命令或一份 MLT XML，按帧精确渲染，不用自己写时间线引擎</text>
</svg>
