<svg xmlns="http://www.w3.org/2000/svg" width="880" height="799" viewBox="0 0 880 799" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="799" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="641" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="641" rx="10"/>
<rect class="pillT" x="474" y="40" width="257.8" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">SCIP indexer + tooling do</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="hand" d="M408,294.0 C439.0,294.0 439.0,318 470,318" marker-end="url(#a)"/>
<path class="edge" d="M494,388 L494,412" marker-end="url(#a)"/>
<path class="hand" d="M472,472.5 C441.0,472.5 441.0,496 410,496" marker-end="url(#a)"/>
<path class="hand" d="M408,531.5 C439.0,531.5 439.0,581 470,581" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the SCIP indexer for your</text>
<text class="t" x="82" y="123">language</text>
<text class="c" x="82" y="147">npm install -g</text>
<text class="c" x="82" y="166">@sourcegraph/scip-typescript</text>
<text class="comp" x="82" y="189">component: per-language indexer</text>
<rect class="card" x="40" y="237" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">Run it at the project root, usually as</text>
<text class="t" x="82" y="288">a CI step on each commit</text>
<text class="c" x="82" y="312">scip-typescript index · rust-analyzer scip</text>
<text class="c" x="82" y="331">.</text>
<rect class="cardT" x="472" y="294" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="294" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="318" r="10"/>
<text class="num" x="494" y="322" text-anchor="middle">3</text>
<text class="t" x="514" y="323">Type-checks the project with the real</text>
<text class="t" x="514" y="345">compiler and resolves every identifier</text>
<text class="t" x="514" y="367">to its definition</text>
<rect class="cardT" x="472" y="414" width="368" height="117" rx="8"/>
<rect class="accT" x="472" y="414" width="4" height="117" rx="2"/>
<circle class="accT" cx="494" cy="438" r="10"/>
<text class="num" x="494" y="442" text-anchor="middle">4</text>
<text class="t" x="514" y="443">Writes one Protobuf index with a</text>
<text class="t" x="514" y="465">globally unique string name for every</text>
<text class="t" x="514" y="487">symbol</text>
<text class="c" x="514" y="511">index.scip</text>
<rect class="card" x="40" y="472" width="368" height="119" rx="8"/>
<rect class="accY" x="40" y="472" width="4" height="119" rx="2"/>
<circle class="accY" cx="62" cy="496" r="10"/>
<text class="num" x="62" y="500" text-anchor="middle">5</text>
<text class="t" x="82" y="501">Load the index into your consumer:</text>
<text class="t" x="82" y="523">Sourcegraph, or your own tool via the</text>
<text class="t" x="82" y="545">Go/Rust bindings</text>
<text class="comp" x="82" y="573">component: scip bindings</text>
<rect class="cardT" x="472" y="557" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="557" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="581" r="10"/>
<text class="num" x="494" y="585" text-anchor="middle">6</text>
<text class="t" x="514" y="586">Bindings expose documents, symbols and</text>
<text class="t" x="514" y="608">exact occurrence ranges for</text>
<text class="t" x="514" y="630">definition/reference lookups</text>
<rect class="val" x="28" y="683" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="707">VALUE</text>
<text class="valT" x="48" y="731">Compiler-accurate go-to-definition and find-references, computed once per commit and</text>
<text class="valT" x="48" y="753">queryable offline</text>
</svg>
