<svg xmlns="http://www.w3.org/2000/svg" width="880" height="756" viewBox="0 0 880 756" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="756" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="620" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="620" rx="10"/>
<rect class="pillT" x="474" y="40" width="106.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">同步器做的</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="edge" d="M62,265 L62,289" marker-end="url(#a)"/>
<path class="hand" d="M408,337.0 C439.0,337.0 439.0,361 470,361" marker-end="url(#a)"/>
<path class="edge" d="M494,409 L494,433" marker-end="url(#a)"/>
<path class="edge" d="M494,532 L494,556" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">binlog 设为 row 格式、full 镜像，建好 ES</text>
<text class="t" x="82" y="123">索引和映射</text>
<rect class="card" x="40" y="170" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">编出二进制，在 TOML 配置里写清哪些表</text>
<text class="t" x="82" y="221">进哪个索引</text>
<text class="c" x="82" y="245">[[source]] · [[rule]]</text>
<rect class="card" x="40" y="291" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="291" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="315" r="10"/>
<text class="num" x="62" y="319" text-anchor="middle">3</text>
<text class="t" x="82" y="320">在装有 mysqldump 的机器上启动它</text>
<text class="c" x="82" y="344">./bin/go-mysql-elasticsearch</text>
<text class="c" x="82" y="363">-config=./etc/river.toml</text>
<rect class="cardT" x="472" y="337" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="337" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="361" r="10"/>
<text class="num" x="494" y="365" text-anchor="middle">4</text>
<text class="t" x="514" y="366">先跑一次 mysqldump，把现有行按主键写成</text>
<text class="t" x="514" y="388"> ES文档</text>
<rect class="cardT" x="472" y="435" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="435" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="459" r="10"/>
<text class="num" x="494" y="463" text-anchor="middle">5</text>
<text class="t" x="514" y="464">伪装成从库读 binlog，把每个行事件攒成批量</text>
<text class="t" x="514" y="486">请求写进 ES</text>
<text class="comp" x="514" y="514">组件：river（基于 go-mysql canal）</text>
<rect class="cardT" x="472" y="558" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="558" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="582" r="10"/>
<text class="num" x="494" y="586" text-anchor="middle">6</text>
<text class="t" x="514" y="587">把 binlog 位点存进 master.info，重启后从</text>
<text class="t" x="514" y="609">断点续传</text>
<rect class="val" x="28" y="662" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="686">价值</text>
<text class="valT" x="48" y="710">ES 自动跟着 MySQL 变，应用只写一个库，不用双写</text>
</svg>
