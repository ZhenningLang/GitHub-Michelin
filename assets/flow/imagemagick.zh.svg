<svg xmlns="http://www.w3.org/2000/svg" width="880" height="750" viewBox="0 0 880 750" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="750" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="614" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="614" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">ImageMagick 做的</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="edge" d="M62,288 L62,312" marker-end="url(#a)"/>
<path class="hand" d="M408,350.5 C439.0,350.5 439.0,374 470,374" marker-end="url(#a)"/>
<path class="edge" d="M494,447 L494,471" marker-end="url(#a)"/>
<path class="edge" d="M494,548 L494,572" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装一个带齐所需委托库的版本</text>
<text class="c" x="82" y="125">brew install imagemagick · winget install</text>
<text class="c" x="82" y="144">ImageMagick.Q16-HDRI</text>
<text class="comp" x="82" y="167">组件：magick 程序</text>
<rect class="card" x="40" y="215" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">按输入可信程度选一份安全策略</text>
<text class="c" x="82" y="268">policy.xml</text>
<rect class="card" x="40" y="314" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">3</text>
<text class="t" x="82" y="343">写一条命令：输入、按顺序的操作、输出</text>
<text class="c" x="82" y="367">magick mogrify -resize 256x256 *.jpg</text>
<rect class="cardT" x="472" y="350" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="350" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="374" r="10"/>
<text class="num" x="494" y="378" text-anchor="middle">4</text>
<text class="t" x="514" y="379">识别每个文件的格式并解码，自己解或交</text>
<text class="t" x="514" y="401">给委托库</text>
<text class="comp" x="514" y="429">组件：编解码模块 + 委托库</text>
<rect class="cardT" x="472" y="473" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="473" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="497" r="10"/>
<text class="num" x="494" y="501" text-anchor="middle">5</text>
<text class="t" x="514" y="502">先查策略，再在像素缓存上按顺序执行操作</text>
<text class="comp" x="514" y="530">组件：MagickCore</text>
<rect class="cardT" x="472" y="574" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="574" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="598" r="10"/>
<text class="num" x="494" y="602" text-anchor="middle">6</text>
<text class="t" x="514" y="603">按输出文件扩展名编码成目标格式</text>
<rect class="val" x="28" y="656" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="680">价值</text>
<text class="valT" x="48" y="704">一行命令就能把整个文件夹在 200 多种格式间转换、缩放或合成，不用写代码</text>
</svg>
