<svg xmlns="http://www.w3.org/2000/svg" width="880" height="859" viewBox="0 0 880 859" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="859" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="701" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="701" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">GStreamer does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,326 L62,350" marker-end="url(#a)"/>
<path class="hand" d="M408,399.5 C439.0,399.5 439.0,423 470,423" marker-end="url(#a)"/>
<path class="edge" d="M494,493 L494,517" marker-end="url(#a)"/>
<path class="edge" d="M494,613 L494,637" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the core, the plugin sets you</text>
<text class="t" x="82" y="123">need and the tools</text>
<text class="c" x="82" y="147">gstreamer1.0-plugins-good ·</text>
<text class="c" x="82" y="166">gstreamer1.0-libav · gstreamer1.0-tools</text>
<rect class="card" x="40" y="212" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Prototype the pipeline on the command</text>
<text class="t" x="82" y="263">line</text>
<text class="c" x="82" y="287">gst-launch-1.0 videotestsrc ! videoconvert</text>
<text class="c" x="82" y="306">! autovideosink</text>
<rect class="card" x="40" y="352" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">3</text>
<text class="t" x="82" y="381">Build the same pipeline in your app</text>
<text class="t" x="82" y="403">and set it to PLAYING</text>
<text class="c" x="82" y="427">gst_parse_launch · gst_element_set_state</text>
<rect class="cardT" x="472" y="399" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="399" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="423" r="10"/>
<text class="num" x="494" y="427" text-anchor="middle">4</text>
<text class="t" x="514" y="428">Negotiates the media format on every</text>
<text class="t" x="514" y="450">link and loads the plugins each</text>
<text class="t" x="514" y="472">element needs</text>
<rect class="cardT" x="472" y="519" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="519" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="543" r="10"/>
<text class="num" x="494" y="547" text-anchor="middle">5</text>
<text class="t" x="514" y="548">Streams buffers through the elements</text>
<text class="t" x="514" y="570">on its own threads, in sync with the</text>
<text class="t" x="514" y="592">pipeline clock</text>
<rect class="cardT" x="472" y="639" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="639" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="663" r="10"/>
<text class="num" x="494" y="667" text-anchor="middle">6</text>
<text class="t" x="514" y="668">Reports errors and end-of-stream as</text>
<text class="t" x="514" y="690">messages on the bus</text>
<rect class="val" x="28" y="743" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="767">VALUE</text>
<text class="valT" x="48" y="791">A media path that runs continuously inside your app, and whose sources, encoders and sinks</text>
<text class="valT" x="48" y="813">you swap per device without rewriting it</text>
</svg>
