<svg xmlns="http://www.w3.org/2000/svg" width="880" height="960" viewBox="0 0 880 960" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="960" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="802" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="802" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Coral does</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="hand" d="M408,265.0 C439.0,265.0 439.0,289 470,289" marker-end="url(#a)"/>
<path class="hand" d="M472,324.5 C441.0,324.5 441.0,362 410,362" marker-end="url(#a)"/>
<path class="edge" d="M62,452 L62,476" marker-end="url(#a)"/>
<path class="hand" d="M408,525.0 C439.0,525.0 439.0,549 470,549" marker-end="url(#a)"/>
<path class="hand" d="M472,584.5 C441.0,584.5 441.0,622 410,622" marker-end="url(#a)"/>
<path class="hand" d="M408,634.0 C439.0,634.0 439.0,694 470,694" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the desktop app, or run the</text>
<text class="t" x="82" y="123">shared server with Docker Compose</text>
<text class="c" x="82" y="147">docker compose up -d</text>
<text class="comp" x="82" y="170">component: desktop app or coral server</text>
<rect class="card" x="40" y="218" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">In the Coral UI, add a provider from</text>
<text class="t" x="82" y="269">the catalog, an OpenAPI document or an</text>
<text class="t" x="82" y="291">MCP server</text>
<rect class="cardT" x="472" y="265" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="265" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="289" r="10"/>
<text class="num" x="494" y="293" text-anchor="middle">3</text>
<text class="t" x="514" y="294">Give the provider&#x27;s tools a default</text>
<text class="t" x="514" y="316">policy: reads run, everything else</text>
<text class="t" x="514" y="338">waits for approval</text>
<text class="comp" x="514" y="366">component: tool policy</text>
<rect class="card" x="40" y="338" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="338" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="362" r="10"/>
<text class="num" x="62" y="366" text-anchor="middle">4</text>
<text class="t" x="82" y="367">Add the workspace MCP URL to your</text>
<text class="t" x="82" y="389">agent</text>
<text class="c" x="82" y="413">claude mcp add --scope user --transport</text>
<text class="c" x="82" y="432">http coral &lt;your-mcp-url&gt;</text>
<rect class="card" x="40" y="478" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="478" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="502" r="10"/>
<text class="num" x="62" y="506" text-anchor="middle">5</text>
<text class="t" x="82" y="507">Ask a question; your agent sends a</text>
<text class="t" x="82" y="529">short TypeScript program through the</text>
<text class="t" x="82" y="551">exec tool</text>
<rect class="cardT" x="472" y="525" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="525" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="549" r="10"/>
<text class="num" x="494" y="553" text-anchor="middle">6</text>
<text class="t" x="514" y="554">Run it in a fresh V8 isolate, check</text>
<text class="t" x="514" y="576">each provider call, add credentials</text>
<text class="t" x="514" y="598">and forward it</text>
<text class="comp" x="514" y="626">component: V8 isolate + policy gate</text>
<rect class="card" x="40" y="598" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="598" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="622" r="10"/>
<text class="num" x="62" y="626" text-anchor="middle">7</text>
<text class="t" x="82" y="627">Approve the exact call in the Coral UI</text>
<text class="t" x="82" y="649">when its policy is Ask</text>
<rect class="cardT" x="472" y="670" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="670" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="694" r="10"/>
<text class="num" x="494" y="698" text-anchor="middle">8</text>
<text class="t" x="514" y="699">Return only the program&#x27;s result; a</text>
<text class="t" x="514" y="721">working program can be saved and</text>
<text class="t" x="514" y="743">called again as a custom tool</text>
<text class="c" x="514" y="767">coral.private.&lt;name&gt;({ ... })</text>
<text class="comp" x="514" y="790">component: custom tools</text>
<rect class="val" x="28" y="844" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="868">VALUE</text>
<text class="valT" x="48" y="892">Your agent acts on real systems with per-call Allow/Ask/Block, never holds the credentials,</text>
<text class="valT" x="48" y="914">and reuses what worked</text>
</svg>
