<svg xmlns="http://www.w3.org/2000/svg" width="880" height="836" viewBox="0 0 880 836" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="836" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="678" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="678" rx="10"/>
<rect class="pillT" x="474" y="40" width="303.8" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Monid&#x27;s compiler and engine do</text>
<path class="edge" d="M62,214 L62,238" marker-end="url(#a)"/>
<path class="hand" d="M408,300.0 C439.0,300.0 439.0,324 470,324" marker-end="url(#a)"/>
<path class="hand" d="M472,359.5 C441.0,359.5 441.0,410 410,410" marker-end="url(#a)"/>
<path class="hand" d="M408,446.0 C439.0,446.0 439.0,470 470,470" marker-end="url(#a)"/>
<path class="edge" d="M494,565 L494,589" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="142" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="142" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Describe the vendor API declaratively:</text>
<text class="t" x="82" y="123">auth, request, input schema, usage</text>
<text class="t" x="82" y="145">model</text>
<text class="c" x="82" y="169">defineProvider · defineEndpoint</text>
<text class="comp" x="82" y="192">component: connectors/&lt;name&gt;/</text>
<rect class="card" x="40" y="240" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="240" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="264" r="10"/>
<text class="num" x="62" y="268" text-anchor="middle">2</text>
<text class="t" x="82" y="269">Record one real response as a fixture,</text>
<text class="t" x="82" y="291">then pass the replay tests offline</text>
<text class="c" x="82" y="315">deno task record · deno task test</text>
<text class="comp" x="82" y="338">component: shared/testing</text>
<rect class="cardT" x="472" y="300" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="300" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="324" r="10"/>
<text class="num" x="494" y="328" text-anchor="middle">3</text>
<text class="t" x="514" y="329">Compiles every definition into flat</text>
<text class="t" x="514" y="351">JSON docs with hash-referenced</text>
<text class="t" x="514" y="373">functions</text>
<text class="comp" x="514" y="401">component: compiler</text>
<rect class="card" x="40" y="386" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="386" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="410" r="10"/>
<text class="num" x="62" y="414" text-anchor="middle">4</text>
<text class="t" x="82" y="415">Run one endpoint with your own vendor</text>
<text class="t" x="82" y="437">key exported in the environment</text>
<text class="c" x="82" y="461">deno task engine:run &#x27;tinyfish#search&#x27;</text>
<text class="comp" x="82" y="484">component: engine:run CLI</text>
<rect class="cardT" x="472" y="446" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="446" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="470" r="10"/>
<text class="num" x="494" y="474" text-anchor="middle">5</text>
<text class="t" x="514" y="475">Validates the input, builds the</text>
<text class="t" x="514" y="497">request and injects the key inside the</text>
<text class="t" x="514" y="519">transport</text>
<text class="comp" x="514" y="547">component: connector engine</text>
<rect class="cardT" x="472" y="591" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="591" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="615" r="10"/>
<text class="num" x="494" y="619" text-anchor="middle">6</text>
<text class="t" x="514" y="620">Settles usage on the raw response,</text>
<text class="t" x="514" y="642">then maps and validates the output</text>
<text class="comp" x="514" y="670">component: connector engine</text>
<rect class="val" x="28" y="720" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="744">VALUE</text>
<text class="valT" x="48" y="768">Every vendor API is called through one declared contract — same validation, metering and</text>
<text class="valT" x="48" y="790">error shape — instead of one hand-written client per vendor</text>
</svg>
