<svg xmlns="http://www.w3.org/2000/svg" width="880" height="791" viewBox="0 0 880 791" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="791" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="655" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="655" rx="10"/>
<rect class="pillT" x="474" y="40" width="178.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Microsandbox 做的</text>
<path class="edge" d="M62,208 L62,232" marker-end="url(#a)"/>
<path class="hand" d="M408,280.0 C439.0,280.0 439.0,304 470,304" marker-end="url(#a)"/>
<path class="edge" d="M494,377 L494,401" marker-end="url(#a)"/>
<path class="hand" d="M472,451.5 C441.0,451.5 441.0,475 410,475" marker-end="url(#a)"/>
<path class="hand" d="M408,487.5 C439.0,487.5 439.0,550 470,550" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装 CLI，或按你的语言装 SDK</text>
<text class="c" x="82" y="125">curl -fsSL</text>
<text class="c" x="82" y="144">https://install.microsandbox.dev | sh ·</text>
<text class="c" x="82" y="163">pip install microsandbox</text>
<text class="comp" x="82" y="186">组件：msb CLI + 宿主运行时</text>
<rect class="card" x="40" y="234" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">2</text>
<text class="t" x="82" y="263">用普通 OCI 镜像建一个沙箱</text>
<text class="c" x="82" y="287">msb run python ·</text>
<text class="c" x="82" y="306">Sandbox.create(image=&quot;python&quot;)</text>
<rect class="cardT" x="472" y="280" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="280" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="304" r="10"/>
<text class="num" x="494" y="308" text-anchor="middle">3</text>
<text class="t" x="514" y="309">拉镜像、铺一份写时复制根文件系统，启动带独</text>
<text class="t" x="514" y="331">立内核的 microVM</text>
<text class="comp" x="514" y="359">组件：libkrun microVM</text>
<rect class="cardT" x="472" y="403" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="403" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="427" r="10"/>
<text class="num" x="494" y="431" text-anchor="middle">4</text>
<text class="t" x="514" y="432">启动 guest 内的 agent，承接你的 exec 与文</text>
<text class="t" x="514" y="454">件调用</text>
<text class="comp" x="514" y="482">组件：agentd</text>
<rect class="card" x="40" y="451" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="451" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="475" r="10"/>
<text class="num" x="62" y="479" text-anchor="middle">5</text>
<text class="t" x="82" y="480">在里面跑命令，把输出流回来</text>
<text class="c" x="82" y="504">msb exec worker · sb.exec(&quot;python&quot;, [...])</text>
<rect class="cardT" x="472" y="526" width="368" height="139" rx="8"/>
<rect class="accT" x="472" y="526" width="4" height="139" rx="2"/>
<circle class="accT" cx="494" cy="550" r="10"/>
<text class="num" x="494" y="554" text-anchor="middle">6</text>
<text class="t" x="514" y="555">逐个核对出站包是否符合出口策略，并在宿主侧</text>
<text class="t" x="514" y="577">把占位符换成真 secret</text>
<text class="c" x="514" y="601">--net-rule &quot;allow@public:tcp:443&quot; ·</text>
<text class="c" x="514" y="620">--secret &#x27;GITHUB_TOKEN@api.github.com&#x27;</text>
<text class="comp" x="514" y="643">组件：宿主网络引擎</text>
<rect class="val" x="28" y="697" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="721">价值</text>
<text class="valT" x="48" y="745">不可信代码在你自己的机器上跑在硬件边界之后——镜像仍是 OCI，无守护进程、无集群，凭证留在宿主</text>
</svg>
