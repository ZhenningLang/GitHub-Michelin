<svg xmlns="http://www.w3.org/2000/svg" width="880" height="749" viewBox="0 0 880 749" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="749" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="613" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="613" rx="10"/>
<rect class="pillT" x="474" y="40" width="178.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">React Charts 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,266 L62,290" marker-end="url(#a)"/>
<path class="hand" d="M408,352.0 C439.0,352.0 439.0,376 470,376" marker-end="url(#a)"/>
<path class="edge" d="M494,424 L494,448" marker-end="url(#a)"/>
<path class="edge" d="M494,500 L494,524" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 React DOM 应用里安装 beta 版包</text>
<text class="c" x="82" y="125">npm install react-charts@beta --save</text>
<rect class="card" x="40" y="171" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">整理成序列数组，用 useMemo 记住带</text>
<text class="t" x="82" y="222">getValue 取值函数的轴配置</text>
<text class="c" x="82" y="246">getValue: datum =&gt; datum.date</text>
<rect class="card" x="40" y="292" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">3</text>
<text class="t" x="82" y="321">在有宽高的容器里渲染 Chart 组件，传</text>
<text class="t" x="82" y="343">入这些配置</text>
<text class="c" x="82" y="367">&lt;Chart&gt;</text>
<text class="comp" x="82" y="390">组件：Chart 组件</text>
<rect class="cardT" x="472" y="352" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="352" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="376" r="10"/>
<text class="num" x="494" y="380" text-anchor="middle">4</text>
<text class="t" x="514" y="381">按数值推断比例尺类型，用 D3 建好比例</text>
<text class="t" x="514" y="403">尺和坐标轴</text>
<rect class="cardT" x="472" y="450" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="450" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="474" r="10"/>
<text class="num" x="494" y="478" text-anchor="middle">5</text>
<text class="t" x="514" y="479">量出容器尺寸，画出 SVG 折线、面积或柱子</text>
<rect class="cardT" x="472" y="526" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="526" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="550" r="10"/>
<text class="num" x="494" y="554" text-anchor="middle">6</text>
<text class="t" x="514" y="555">借 Voronoi 命中图让提示框和十字线吸附到最</text>
<text class="t" x="514" y="577">近的点</text>
<text class="comp" x="514" y="605">组件：Voronoi 与提示框浮层</text>
<rect class="val" x="28" y="655" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="679">价值</text>
<text class="valT" x="48" y="703">直接用你自己的行对象得到可伸缩、可悬停的 React 图表，不用手写 D3 绘图代码</text>
</svg>
