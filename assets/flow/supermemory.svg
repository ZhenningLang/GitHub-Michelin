<svg xmlns="http://www.w3.org/2000/svg" width="880" height="785" viewBox="0 0 880 785" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="785" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="627" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="627" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Supermemory does</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="hand" d="M408,294.0 C439.0,294.0 439.0,318 470,318" marker-end="url(#a)"/>
<path class="edge" d="M494,391 L494,415" marker-end="url(#a)"/>
<path class="hand" d="M472,465.5 C441.0,465.5 441.0,489 410,489" marker-end="url(#a)"/>
<path class="hand" d="M408,522.0 C439.0,522.0 439.0,564 470,564" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the SDK and point it at the</text>
<text class="t" x="82" y="123">API</text>
<text class="c" x="82" y="147">npm install supermemory · pip install</text>
<text class="c" x="82" y="166">supermemory</text>
<text class="comp" x="82" y="189">component: first-party SDK</text>
<rect class="card" x="40" y="237" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">Push the raw conversation turn, tagged</text>
<text class="t" x="82" y="288">per user</text>
<text class="c" x="82" y="312">client.add({ content: &quot;...&quot;, containerTag:</text>
<text class="c" x="82" y="331">&quot;user_123&quot; })</text>
<rect class="cardT" x="472" y="294" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="294" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="318" r="10"/>
<text class="num" x="494" y="322" text-anchor="middle">3</text>
<text class="t" x="514" y="323">Extracts facts, resolves</text>
<text class="t" x="514" y="345">contradictions, expires temporary ones</text>
<text class="comp" x="514" y="373">component: memory engine</text>
<rect class="cardT" x="472" y="417" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="417" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="441" r="10"/>
<text class="num" x="494" y="445" text-anchor="middle">4</text>
<text class="t" x="514" y="446">Keeps a static + dynamic profile per</text>
<text class="t" x="514" y="468">user, always fresh</text>
<text class="comp" x="514" y="496">component: user profiles</text>
<rect class="card" x="40" y="465" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="465" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="489" r="10"/>
<text class="num" x="62" y="493" text-anchor="middle">5</text>
<text class="t" x="82" y="494">Before the next reply, fetch profile +</text>
<text class="t" x="82" y="516">relevant context</text>
<text class="c" x="82" y="540">client.profile({ containerTag: &quot;user_123&quot;,</text>
<text class="c" x="82" y="559">q: &quot;...&quot; })</text>
<rect class="cardT" x="472" y="540" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="540" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="564" r="10"/>
<text class="num" x="494" y="568" text-anchor="middle">6</text>
<text class="t" x="514" y="569">Returns profile facts and</text>
<text class="t" x="514" y="591">hybrid-search memories in one call</text>
<text class="comp" x="514" y="619">component: hybrid search</text>
<rect class="val" x="28" y="669" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="693">VALUE</text>
<text class="valT" x="48" y="717">Your agent knows who it is talking to from the first sentence — no vector DB, embedding</text>
<text class="valT" x="48" y="739">pipeline, or chunking strategy to operate</text>
</svg>
