<svg xmlns="http://www.w3.org/2000/svg" width="880" height="778" viewBox="0 0 880 778" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="778" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="642" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="642" rx="10"/>
<rect class="pillT" x="474" y="40" width="206.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">lua-resty-redis 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,236.0 C439.0,236.0 439.0,260 470,260" marker-end="url(#a)"/>
<path class="hand" d="M472,284.5 C441.0,284.5 441.0,332 410,332" marker-end="url(#a)"/>
<path class="edge" d="M62,400 L62,424" marker-end="url(#a)"/>
<path class="hand" d="M408,472.0 C439.0,472.0 439.0,496 470,496" marker-end="url(#a)"/>
<path class="hand" d="M472,497.0 C441.0,497.0 441.0,568 410,568" marker-end="url(#a)"/>
<path class="hand" d="M408,580.5 C439.0,580.5 439.0,604 470,604" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 ngx_lua 处理器里引入驱动</text>
<text class="c" x="82" y="125">local redis = require &quot;resty.redis&quot; ·</text>
<text class="c" x="82" y="144">local red = redis:new()</text>
<rect class="card" x="40" y="190" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">先设超时，再连 Redis 服务</text>
<text class="c" x="82" y="243">red:set_timeouts(1000, 1000, 1000) ·</text>
<text class="c" x="82" y="262">red:connect(&quot;127.0.0.1&quot;, 6379)</text>
<rect class="cardT" x="472" y="236" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="236" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="260" r="10"/>
<text class="num" x="494" y="264" text-anchor="middle">3</text>
<text class="t" x="514" y="265">连接挂在 cosocket 上：等 Redis 时 worker</text>
<text class="t" x="514" y="287">不阻塞</text>
<text class="comp" x="514" y="315">组件：cosocket</text>
<rect class="card" x="40" y="308" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="308" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="332" r="10"/>
<text class="num" x="62" y="336" text-anchor="middle">4</text>
<text class="t" x="82" y="337">把 Redis 命令当小写 Lua 方法调</text>
<text class="c" x="82" y="361">red:set(&quot;dog&quot;, &quot;an animal&quot;) ·</text>
<text class="c" x="82" y="380">red:get(&quot;dog&quot;)</text>
<rect class="card" x="40" y="426" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="426" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="450" r="10"/>
<text class="num" x="62" y="454" text-anchor="middle">5</text>
<text class="t" x="82" y="455">把多条命令压成一次往返</text>
<text class="c" x="82" y="479">red:init_pipeline() ·</text>
<text class="c" x="82" y="498">red:commit_pipeline()</text>
<rect class="cardT" x="472" y="472" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="472" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="496" r="10"/>
<text class="num" x="494" y="500" text-anchor="middle">6</text>
<text class="t" x="514" y="501">pipeline 一次发出，按序返回 Lua 表结果</text>
<rect class="card" x="40" y="544" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="544" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="568" r="10"/>
<text class="num" x="62" y="572" text-anchor="middle">7</text>
<text class="t" x="82" y="573">请求结束前把 socket 归还连接池</text>
<text class="c" x="82" y="597">red:set_keepalive(10000, 100)</text>
<rect class="cardT" x="472" y="580" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="580" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="604" r="10"/>
<text class="num" x="494" y="608" text-anchor="middle">8</text>
<text class="t" x="514" y="609">下一个请求直接复用池中连接——不再重连、不再</text>
<text class="t" x="514" y="631">每请求鉴权</text>
<rect class="val" x="28" y="684" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="708">价值</text>
<text class="valT" x="48" y="732">Redis 支撑的边缘逻辑永不卡住 NGINX worker——连接池与 pipeline 都已内置</text>
</svg>
