<svg xmlns="http://www.w3.org/2000/svg" width="880" height="703" viewBox="0 0 880 703" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="703" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="567" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="567" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Pointa 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,257.0 C439.0,257.0 439.0,281 470,281" marker-end="url(#a)"/>
<path class="hand" d="M472,290.5 C441.0,290.5 441.0,374 410,374" marker-end="url(#a)"/>
<path class="hand" d="M408,394.5 C439.0,394.5 439.0,418 470,418" marker-end="url(#a)"/>
<path class="hand" d="M472,427.5 C441.0,427.5 441.0,489 410,489" marker-end="url(#a)"/>
<path class="hand" d="M408,510.0 C439.0,510.0 439.0,534 470,534" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">一次搭建</text>
<text class="t" x="82" y="118">从 Chrome 商店安装扩展</text>
<text class="comp" x="82" y="146">组件：浏览器扩展</text>
<rect class="card" x="40" y="190" width="368" height="134" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="134" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="ph" x="82" y="219">一次搭建</text>
<text class="t" x="82" y="236">在 agent 配置里注册 MCP 条目</text>
<text class="c" x="82" y="260">claude mcp add --transport stdio pointa --</text>
<text class="c" x="82" y="279">npx -y pointa-server</text>
<text class="comp" x="82" y="302">组件：pointa-server</text>
<rect class="cardT" x="472" y="257" width="368" height="67" rx="8"/>
<rect class="accT" x="472" y="257" width="4" height="67" rx="2"/>
<circle class="accT" cx="494" cy="281" r="10"/>
<text class="num" x="494" y="285" text-anchor="middle">3</text>
<text class="ph" x="514" y="286">一次搭建</text>
<text class="t" x="514" y="303">拉起本地 HTTP daemon，状态存进 ~/.pointa</text>
<rect class="card" x="40" y="350" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="350" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="374" r="10"/>
<text class="num" x="62" y="378" text-anchor="middle">4</text>
<text class="ph" x="82" y="379">每个 bug</text>
<text class="t" x="82" y="396">打开 localhost 应用，点扩展图标，给</text>
<text class="t" x="82" y="418">元素钉批注</text>
<rect class="cardT" x="472" y="394" width="368" height="67" rx="8"/>
<rect class="accT" x="472" y="394" width="4" height="67" rx="2"/>
<circle class="accT" cx="494" cy="418" r="10"/>
<text class="num" x="494" y="422" text-anchor="middle">5</text>
<text class="ph" x="514" y="423">每个 bug</text>
<text class="t" x="514" y="440">批注按页面和路由锚定，bug 报告可带截图</text>
<rect class="card" x="40" y="465" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="465" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="489" r="10"/>
<text class="num" x="62" y="493" text-anchor="middle">6</text>
<text class="ph" x="82" y="494">每个 bug</text>
<text class="t" x="82" y="511">可选：包一层 dev 命令截后端日志</text>
<text class="c" x="82" y="535">pointa dev npm run dev</text>
<rect class="cardT" x="472" y="510" width="368" height="67" rx="8"/>
<rect class="accT" x="472" y="510" width="4" height="67" rx="2"/>
<circle class="accT" cx="494" cy="534" r="10"/>
<text class="num" x="494" y="538" text-anchor="middle">7</text>
<text class="ph" x="514" y="539">每个 bug</text>
<text class="t" x="514" y="556">你说一句实现，agent 就经 MCP 把批注读走</text>
<rect class="val" x="28" y="609" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="633">价值</text>
<text class="valT" x="48" y="657">设计和 QA 把 Figma 式反馈递给编码 agent，全程不碰仓库。</text>
</svg>
