<svg xmlns="http://www.w3.org/2000/svg" width="880" height="791" viewBox="0 0 880 791" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="791" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="633" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="633" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Ant Design does</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="hand" d="M408,256.0 C439.0,256.0 439.0,280 470,280" marker-end="url(#a)"/>
<path class="hand" d="M472,315.5 C441.0,315.5 441.0,366 410,366" marker-end="url(#a)"/>
<path class="hand" d="M408,389.5 C439.0,389.5 439.0,425 470,425" marker-end="url(#a)"/>
<path class="edge" d="M494,498 L494,522" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add the package to your React 18+ app</text>
<text class="c" x="82" y="125">npm install antd</text>
<text class="comp" x="82" y="148">component: npm package antd</text>
<rect class="card" x="40" y="196" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">Set a few seed tokens once on the root</text>
<text class="t" x="82" y="247">ConfigProvider</text>
<text class="c" x="82" y="271">token: { colorPrimary: &#x27;#1890ff&#x27; }</text>
<text class="comp" x="82" y="294">component: ConfigProvider</text>
<rect class="cardT" x="472" y="256" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="256" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="280" r="10"/>
<text class="num" x="494" y="284" text-anchor="middle">3</text>
<text class="t" x="514" y="285">Derives the full palette, states and</text>
<text class="t" x="514" y="307">dark or compact variants from those</text>
<text class="t" x="514" y="329">seeds</text>
<text class="comp" x="514" y="357">component: theme algorithm</text>
<rect class="card" x="40" y="342" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="342" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="366" r="10"/>
<text class="num" x="62" y="370" text-anchor="middle">4</text>
<text class="t" x="82" y="371">Import the components each screen</text>
<text class="t" x="82" y="393">needs and pass them data and callbacks</text>
<text class="c" x="82" y="417">import { Button, DatePicker } from &#x27;antd&#x27;;</text>
<rect class="cardT" x="472" y="401" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="401" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="425" r="10"/>
<text class="num" x="494" y="429" text-anchor="middle">5</text>
<text class="t" x="514" y="430">Generates each component&#x27;s CSS from</text>
<text class="t" x="514" y="452">the tokens at runtime and injects it</text>
<text class="comp" x="514" y="480">component: @ant-design/cssinjs</text>
<rect class="cardT" x="472" y="524" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="524" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="548" r="10"/>
<text class="num" x="494" y="552" text-anchor="middle">6</text>
<text class="t" x="514" y="553">Handles sorting, filtering,</text>
<text class="t" x="514" y="575">validation, popups and keyboard states</text>
<text class="t" x="514" y="597">inside each component</text>
<text class="comp" x="514" y="625">component: @rc-component/* packages</text>
<rect class="val" x="28" y="675" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="699">VALUE</text>
<text class="valT" x="48" y="723">A consistent, themed back-office UI built from finished components, with no component CSS or</text>
<text class="valT" x="48" y="745">widget logic written by you</text>
</svg>
