<svg xmlns="http://www.w3.org/2000/svg" width="880" height="621" viewBox="0 0 880 621" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="621" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="485" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="485" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">gVisor 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,221 L62,245" marker-end="url(#a)"/>
<path class="hand" d="M408,293.0 C439.0,293.0 439.0,317 470,317" marker-end="url(#a)"/>
<path class="edge" d="M494,343 L494,367" marker-end="url(#a)"/>
<path class="edge" d="M494,419 L494,443" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在节点上装 runsc 并注册成容器运行时</text>
<text class="c" x="82" y="125">sudo runsc install</text>
<rect class="card" x="40" y="171" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">重启容器管理器，让它识别新运行时</text>
<rect class="card" x="40" y="247" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="247" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="271" r="10"/>
<text class="num" x="62" y="275" text-anchor="middle">3</text>
<text class="t" x="82" y="276">选用 runsc 运行时来跑工作负载</text>
<text class="c" x="82" y="300">docker run --runtime=runsc --rm</text>
<text class="c" x="82" y="319">hello-world</text>
<rect class="cardT" x="472" y="293" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="293" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="317" r="10"/>
<text class="num" x="494" y="321" text-anchor="middle">4</text>
<text class="t" x="514" y="322">启动 sandbox，拦截工作负载的系统调用</text>
<rect class="cardT" x="472" y="369" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="369" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="393" r="10"/>
<text class="num" x="494" y="397" text-anchor="middle">5</text>
<text class="t" x="514" y="398">由用户态 Sentry 内核应答，而不是宿主内核</text>
<rect class="cardT" x="472" y="445" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="445" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="469" r="10"/>
<text class="num" x="494" y="473" text-anchor="middle">6</text>
<text class="t" x="514" y="474">把宿主内核暴露面挡在自己的过滤之后</text>
<rect class="val" x="28" y="527" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="551">价值</text>
<text class="valT" x="48" y="575">共享宿主机上的不可信容器失去直通宿主内核的路径——而且不用跑虚拟机</text>
</svg>
