<svg xmlns="http://www.w3.org/2000/svg" width="880" height="884" viewBox="0 0 880 884" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="884" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="748" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="748" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">gstack 做的</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="hand" d="M472,180.5 C441.0,180.5 441.0,242 410,242" marker-end="url(#a)"/>
<path class="hand" d="M408,267.0 C439.0,267.0 439.0,291 470,291" marker-end="url(#a)"/>
<path class="hand" d="M472,304.5 C441.0,304.5 441.0,366 410,366" marker-end="url(#a)"/>
<path class="hand" d="M408,391.0 C439.0,391.0 439.0,415 470,415" marker-end="url(#a)"/>
<path class="hand" d="M472,439.5 C441.0,439.5 441.0,490 410,490" marker-end="url(#a)"/>
<path class="hand" d="M408,503.5 C439.0,503.5 439.0,538 470,538" marker-end="url(#a)"/>
<path class="edge" d="M494,634 L494,658" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把仓库克隆进 agent 的 skills 目录，跑它的</text>
<text class="t" x="82" y="123">setup</text>
<text class="c" x="82" y="147">./setup</text>
<text class="comp" x="82" y="170">组件：setup 脚本</text>
<rect class="cardT" x="472" y="132" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">注册整套角色命令，并配一个 agent 能驱动的</text>
<text class="t" x="514" y="183">无头浏览器</text>
<text class="comp" x="514" y="211">组件：skills 目录 + browse 守护进程</text>
<rect class="card" x="40" y="218" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">3</text>
<text class="t" x="82" y="247">拿产品拷问对准你的想法</text>
<text class="c" x="82" y="271">/office-hours</text>
<text class="comp" x="82" y="294">组件：技能</text>
<rect class="cardT" x="472" y="267" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="267" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="291" r="10"/>
<text class="num" x="494" y="295" text-anchor="middle">4</text>
<text class="t" x="514" y="296">质疑你的框架，写出后续技能会读的设计文档</text>
<text class="comp" x="514" y="324">组件：主 agent</text>
<rect class="card" x="40" y="342" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="342" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="366" r="10"/>
<text class="num" x="62" y="370" text-anchor="middle">5</text>
<text class="t" x="82" y="371">要一份已经过评审的计划</text>
<text class="c" x="82" y="395">/autoplan</text>
<text class="comp" x="82" y="418">组件：技能</text>
<rect class="cardT" x="472" y="391" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="391" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="415" r="10"/>
<text class="num" x="494" y="419" text-anchor="middle">6</text>
<text class="t" x="514" y="420">先 CEO 评审，命中范围才跑设计与 DX，最后工</text>
<text class="t" x="514" y="442">程；只把品味抉择交回</text>
<text class="comp" x="514" y="470">组件：subagent + 外部 CLI</text>
<rect class="card" x="40" y="466" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="466" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="490" r="10"/>
<text class="num" x="62" y="494" text-anchor="middle">7</text>
<text class="t" x="82" y="495">确认后让它动手实现</text>
<text class="comp" x="82" y="523">组件：主 agent</text>
<rect class="cardT" x="472" y="514" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="514" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="538" r="10"/>
<text class="num" x="494" y="542" text-anchor="middle">8</text>
<text class="t" x="514" y="543">找 CI 漏掉的 bug：/review 修能修的，/qa </text>
<text class="t" x="514" y="565">开真浏览器跑一遍</text>
<text class="c" x="514" y="589">/review · /qa</text>
<text class="comp" x="514" y="612">组件：专家 subagent + 浏览器</text>
<rect class="cardT" x="472" y="660" width="368" height="98" rx="8"/>
<rect class="accT" x="472" y="660" width="4" height="98" rx="2"/>
<circle class="accT" cx="494" cy="684" r="10"/>
<text class="num" x="494" y="688" text-anchor="middle">9</text>
<text class="t" x="514" y="689">/ship 同步 main、跑测试、推送并开 PR</text>
<text class="c" x="514" y="713">/ship</text>
<text class="comp" x="514" y="736">组件：技能 + bin/gstack-* 工具</text>
<rect class="val" x="28" y="790" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="814">价值</text>
<text class="valT" x="48" y="838">你走的是一支团队的冲刺顺序，每步读上一步的产物，而不是重打 prompt</text>
</svg>
