<svg xmlns="http://www.w3.org/2000/svg" width="880" height="663" viewBox="0 0 880 663" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="663" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="527" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="527" rx="10"/>
<rect class="pillT" x="474" y="40" width="215.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">avoid-ai-writing 做的</text>
<path class="hand" d="M408,108.5 C439.0,108.5 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,144.5 C441.0,144.5 441.0,195 410,195" marker-end="url(#a)"/>
<path class="hand" d="M408,207.5 C439.0,207.5 439.0,231 470,231" marker-end="url(#a)"/>
<path class="edge" d="M494,279 L494,303" marker-end="url(#a)"/>
<path class="hand" d="M472,330.0 C441.0,330.0 441.0,365 410,365" marker-end="url(#a)"/>
<path class="hand" d="M408,388.5 C439.0,388.5 439.0,412 470,412" marker-end="url(#a)"/>
<path class="edge" d="M494,461 L494,485" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把 skill 克隆进 agent 的 skills 目录</text>
<text class="c" x="82" y="125">~/.claude/skills/avoid-ai-writing</text>
<rect class="cardT" x="472" y="108" width="368" height="73" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="73" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">自带 SKILL.md 和审计前必须先读完的模式目录</text>
<text class="c" x="514" y="161">references/patterns.md</text>
<rect class="card" x="40" y="171" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">3</text>
<text class="t" x="82" y="200">把草稿交给它，或指定一个 prose 文件</text>
<text class="c" x="82" y="224">remove AI-isms · audit for AI tells</text>
<rect class="cardT" x="472" y="207" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="207" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="231" r="10"/>
<text class="num" x="494" y="235" text-anchor="middle">4</text>
<text class="t" x="514" y="236">按模式与严重度列出命中项，区分真问题</text>
<text class="t" x="514" y="258">和判断题</text>
<rect class="cardT" x="472" y="305" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="305" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="329" r="10"/>
<text class="num" x="494" y="333" text-anchor="middle">5</text>
<text class="t" x="514" y="334">最多做两轮修改，没有正当的范围内改动就停</text>
<rect class="card" x="40" y="341" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="341" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="365" r="10"/>
<text class="num" x="62" y="369" text-anchor="middle">6</text>
<text class="t" x="82" y="370">可选：在 CI 或 pre-commit 里给 pros</text>
<text class="t" x="82" y="392">e 设门禁</text>
<text class="c" x="82" y="416">conorbronsdon/avoid-ai-writing@v3.35.0</text>
<rect class="cardT" x="472" y="388" width="368" height="73" rx="8"/>
<rect class="accT" x="472" y="388" width="4" height="73" rx="2"/>
<circle class="accT" cx="494" cy="412" r="10"/>
<text class="num" x="494" y="416" text-anchor="middle">7</text>
<text class="t" x="514" y="417">某个文件的命中数超过阈值就让构建失败</text>
<text class="c" x="514" y="441">threshold · glob · context</text>
<rect class="cardT" x="472" y="487" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="487" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="511" r="10"/>
<text class="num" x="494" y="515" text-anchor="middle">8</text>
<text class="t" x="514" y="516">返回唯一一版终稿、改动摘要和验证报告</text>
<rect class="val" x="28" y="569" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="593">价值</text>
<text class="valT" x="48" y="617">拿回唯一一版过了审计的终稿，外加一个能在 CI 里设门禁的命中数，而不是凭感觉</text>
</svg>
