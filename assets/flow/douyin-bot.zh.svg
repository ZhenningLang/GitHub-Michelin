<svg xmlns="http://www.w3.org/2000/svg" width="880" height="677" viewBox="0 0 880 677" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="677" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="541" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="541" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Douyin-Bot 做的</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="edge" d="M62,265 L62,289" marker-end="url(#a)"/>
<path class="hand" d="M408,327.5 C439.0,327.5 439.0,351 470,351" marker-end="url(#a)"/>
<path class="edge" d="M494,377 L494,401" marker-end="url(#a)"/>
<path class="edge" d="M494,453 L494,477" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用 USB 连上开了 ADB 调试的安卓手机，</text>
<text class="t" x="82" y="123">打开抖音</text>
<rect class="card" x="40" y="170" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">申请腾讯 AI 的 AppID/AppKey，填好你屏幕的</text>
<text class="t" x="82" y="221">按钮坐标</text>
<text class="c" x="82" y="245">center_point · follow_bottom · star_bottom</text>
<rect class="card" x="40" y="291" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="291" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="315" r="10"/>
<text class="num" x="62" y="319" text-anchor="middle">3</text>
<text class="t" x="82" y="320">装上 2018 年钉死的依赖，启动循环</text>
<text class="c" x="82" y="344">python douyin-bot.py</text>
<rect class="cardT" x="472" y="327" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="327" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="351" r="10"/>
<text class="num" x="494" y="355" text-anchor="middle">4</text>
<text class="t" x="514" y="356">通过 ADB 截手机屏，压到 1 MB 以下</text>
<rect class="cardT" x="472" y="403" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="403" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="427" r="10"/>
<text class="num" x="494" y="431" text-anchor="middle">5</text>
<text class="t" x="514" y="432">发给 ai.qq.com 人脸接口，拿回年龄和颜值分</text>
<rect class="cardT" x="472" y="479" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="479" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="503" r="10"/>
<text class="num" x="494" y="507" text-anchor="middle">6</text>
<text class="t" x="514" y="508">超过 BEAUTY_THRESHOLD 就点赞关注，然后划</text>
<text class="t" x="514" y="530">到下一条</text>
<rect class="val" x="28" y="583" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="607">价值</text>
<text class="valT" x="48" y="631">当年是免手动的刷视频点赞循环；今天已失效——坐标停在 2018 年，人脸接口大概率已下线</text>
</svg>
