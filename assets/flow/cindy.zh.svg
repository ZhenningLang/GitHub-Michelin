<svg xmlns="http://www.w3.org/2000/svg" width="880" height="566" viewBox="0 0 880 566" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="566" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="430" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="430" rx="10"/>
<rect class="pillT" x="474" y="40" width="74.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Cindy</text>
<path class="edge" d="M62,169 L62,193" marker-end="url(#a)"/>
<path class="hand" d="M408,242.5 C439.0,242.5 439.0,266 470,266" marker-end="url(#a)"/>
<path class="hand" d="M472,290.5 C441.0,290.5 441.0,340 410,340" marker-end="url(#a)"/>
<path class="hand" d="M408,353.5 C439.0,353.5 439.0,389 470,389" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好桌面端，登录或选“跳过登录”只用本地</text>
<text class="t" x="82" y="123">agent</text>
<text class="comp" x="82" y="151">组件：Electron 桌面端</text>
<rect class="card" x="40" y="195" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="195" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="219" r="10"/>
<text class="num" x="62" y="223" text-anchor="middle">2</text>
<text class="t" x="82" y="224">接入订阅、API key 或本地模型，选一个</text>
<text class="t" x="82" y="246">harness</text>
<text class="c" x="82" y="270">Claude Code · Codex · Pi</text>
<rect class="cardT" x="472" y="242" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="242" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="266" r="10"/>
<text class="num" x="494" y="270" text-anchor="middle">3</text>
<text class="t" x="514" y="271">在项目目录里跑该 agent，展示工具调用</text>
<text class="t" x="514" y="293">和审批卡片</text>
<text class="comp" x="514" y="321">组件：maker-core 适配层</text>
<rect class="card" x="40" y="316" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="316" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="340" r="10"/>
<text class="num" x="62" y="344" text-anchor="middle">4</text>
<text class="t" x="82" y="345">从手机或另一台已登录电脑打开同一会话</text>
<text class="comp" x="82" y="373">组件：手机控制端</text>
<rect class="cardT" x="472" y="365" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="365" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="389" r="10"/>
<text class="num" x="494" y="393" text-anchor="middle">5</text>
<text class="t" x="514" y="394">把白名单内的会话操作转给桌面端，并回传结果</text>
<text class="comp" x="514" y="422">组件：device-link 中继</text>
<rect class="val" x="28" y="472" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="496">价值</text>
<text class="valT" x="48" y="520">一个 agent 会话跟着你在电脑和手机间接续，不用租服务器</text>
</svg>
