<svg xmlns="http://www.w3.org/2000/svg" width="880" height="830" viewBox="0 0 880 830" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="830" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="694" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="694" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Driver.js does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,307 L62,331" marker-end="url(#a)"/>
<path class="edge" d="M62,428 L62,452" marker-end="url(#a)"/>
<path class="hand" d="M408,490.5 C439.0,490.5 439.0,514 470,514" marker-end="url(#a)"/>
<path class="edge" d="M494,584 L494,608" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the package (or load it from a</text>
<text class="t" x="82" y="123">CDN script tag)</text>
<text class="c" x="82" y="147">npm install driver.js · yarn add driver.js</text>
<rect class="card" x="40" y="193" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Import the factory and its stylesheet</text>
<text class="t" x="82" y="244">in your app</text>
<text class="c" x="82" y="268">import { driver } from &quot;driver.js&quot; ·</text>
<text class="c" x="82" y="287">import &quot;driver.js/dist/driver.css&quot;</text>
<rect class="card" x="40" y="333" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">3</text>
<text class="t" x="82" y="362">Declare the tour as a steps array:</text>
<text class="t" x="82" y="384">selector + popover copy</text>
<text class="c" x="82" y="408">element: &#x27;.page-header&#x27;</text>
<rect class="card" x="40" y="454" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="454" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="478" r="10"/>
<text class="num" x="62" y="482" text-anchor="middle">4</text>
<text class="t" x="82" y="483">Create the instance and start driving</text>
<text class="c" x="82" y="507">driverObj.drive()</text>
<rect class="cardT" x="472" y="490" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="490" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="514" r="10"/>
<text class="num" x="494" y="518" text-anchor="middle">5</text>
<text class="t" x="514" y="519">Dims the page, cuts a spotlight around</text>
<text class="t" x="514" y="541">each element, positions the popover</text>
<text class="t" x="514" y="563">with prev/next/close</text>
<rect class="cardT" x="472" y="610" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="610" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="634" r="10"/>
<text class="num" x="494" y="638" text-anchor="middle">6</text>
<text class="t" x="514" y="639">Advances as the user clicks Next or</text>
<text class="t" x="514" y="661">uses the keyboard, firing your</text>
<text class="t" x="514" y="683">lifecycle hooks</text>
<rect class="val" x="28" y="736" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="760">VALUE</text>
<text class="valT" x="48" y="784">A framework-free product tour or one-off spotlight with zero runtime dependencies</text>
</svg>
