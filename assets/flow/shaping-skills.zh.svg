<rect class="accT" x="472" y="366" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="390" r="10"/>
<text class="num" x="494" y="394" text-anchor="middle">5</text>
<text class="t" x="514" y="395">把对话整理成 builder 能照做的框定文档</text>
<text class="comp" x="514" y="423">组件：framing-doc 技能</text>
