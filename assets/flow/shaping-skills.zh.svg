<text class="t" x="82" y="123">~/.claude/skills/</text>
<text class="c" x="82" y="147">ln -s</text>
<text class="c" x="82" y="166">~/.local/share/shaping-skills/framing-doc</text>
<text class="c" x="82" y="185">~/.claude/skills/framing-doc</text>
<rect class="card" x="40" y="231" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="73" rx="2"/>
