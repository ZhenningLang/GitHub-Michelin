<text class="num" x="62" y="259" text-anchor="middle">2</text>
<text class="t" x="82" y="260">动手前先用 Claude 塑形想法</text>
<text class="c" x="82" y="284">/shaping</text>
<rect class="cardT" x="472" y="267" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="267" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="291" r="10"/>
<text class="num" x="494" y="295" text-anchor="middle">3</text>
<text class="t" x="514" y="296">问题与方案一起迭代，并与实现分开</text>
<rect class="card" x="40" y="330" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="330" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="354" r="10"/>
