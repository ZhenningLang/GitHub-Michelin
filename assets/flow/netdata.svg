<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="700" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="542" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="542" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Netdata does</text>
<path class="hand" d="M408,143.0 C439.0,143.0 439.0,167 470,167" marker-end="url(#a)"/>
<path class="edge" d="M494,262 L494,286" marker-end="url(#a)"/>
<path class="hand" d="M472,347.5 C441.0,347.5 441.0,371 410,371" marker-end="url(#a)"/>
<path class="hand" d="M408,394.5 C439.0,394.5 439.0,457 470,457" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="142" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="142" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Download kickstart.sh from</text>
<text class="t" x="82" y="123">get.netdata.cloud and run it on each</text>
<text class="t" x="82" y="145">machine</text>
<text class="c" x="82" y="169">sh /tmp/netdata-kickstart.sh</text>
<text class="comp" x="82" y="192">component: kickstart.sh</text>
<rect class="cardT" x="472" y="143" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="143" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="167" r="10"/>
<text class="num" x="494" y="171" text-anchor="middle">2</text>
<text class="t" x="514" y="172">Detects the OS, containers and running</text>
<text class="t" x="514" y="194">services and starts per-second</text>
<text class="t" x="514" y="216">collectors</text>
<text class="comp" x="514" y="244">component: internal + external plugins</text>
<rect class="cardT" x="472" y="288" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="288" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="312" r="10"/>
<text class="num" x="494" y="316" text-anchor="middle">3</text>
<text class="t" x="514" y="317">Stores samples in tiered dbengine,</text>
<text class="t" x="514" y="339">evaluates stock alerts, scores each</text>
<text class="t" x="514" y="361">metric for anomalies</text>
<text class="comp" x="514" y="389">component: netdata daemon</text>
<rect class="card" x="40" y="347" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="347" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="371" r="10"/>
<text class="num" x="62" y="375" text-anchor="middle">4</text>
<text class="t" x="82" y="376">Open the node&#x27;s dashboard on port</text>
<text class="t" x="82" y="398">19999</text>
<text class="c" x="82" y="422">http://localhost:19999</text>
<rect class="cardT" x="472" y="433" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="433" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="457" r="10"/>
<text class="num" x="494" y="461" text-anchor="middle">5</text>
<text class="t" x="514" y="462">Serves auto-generated charts with</text>
<text class="t" x="514" y="484">anomaly rates, no queries or dashboard</text>
<text class="t" x="514" y="506">building</text>
<text class="comp" x="514" y="534">component: NCUL1 dashboard</text>
<rect class="val" x="28" y="584" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="608">VALUE</text>
<text class="valT" x="48" y="632">Per-second charts, stock alerts and anomaly flags for a machine without writing exporters,</text>
<text class="valT" x="48" y="654">queries or dashboards</text>
</svg>
