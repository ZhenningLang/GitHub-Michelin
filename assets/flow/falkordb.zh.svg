<svg xmlns="http://www.w3.org/2000/svg" width="880" height="577" viewBox="0 0 880 577" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="577" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="441" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="441" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">FalkorDB 做的</text>
<path class="hand" d="M408,118.0 C439.0,118.0 439.0,142 470,142" marker-end="url(#a)"/>
<path class="hand" d="M472,166.5 C441.0,166.5 441.0,214 410,214" marker-end="url(#a)"/>
<path class="edge" d="M62,282 L62,306" marker-end="url(#a)"/>
<path class="hand" d="M408,354.0 C439.0,354.0 439.0,378 470,378" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">一条容器起引擎</text>
<text class="c" x="82" y="125">docker run -p 6379:6379 -p 3000:3000</text>
<text class="c" x="82" y="144">falkordb/falkordb</text>
<rect class="cardT" x="472" y="118" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="118" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="142" r="10"/>
<text class="num" x="494" y="146" text-anchor="middle">2</text>
<text class="t" x="514" y="147">以 Redis 模块加载，并在 3000 端口开</text>
<text class="t" x="514" y="169">图浏览器</text>
<text class="comp" x="514" y="197">组件：falkordb 模块</text>
<rect class="card" x="40" y="190" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">3</text>
<text class="t" x="82" y="219">用 Python 客户端连上并选一个命名图</text>
<text class="c" x="82" y="243">db = FalkorDB(host=&#x27;localhost&#x27;, port=6379)</text>
<text class="c" x="82" y="262">· g = db.select_graph(&#x27;MotoGP&#x27;)</text>
<rect class="card" x="40" y="308" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="308" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="332" r="10"/>
<text class="num" x="62" y="336" text-anchor="middle">4</text>
<text class="t" x="82" y="337">用 OpenCypher 写入并查询图</text>
<text class="c" x="82" y="361">g.query(&quot;CREATE (:Rider {name:&#x27;Valentino</text>
<text class="c" x="82" y="380">Rossi&#x27;})&quot;)</text>
<rect class="cardT" x="472" y="354" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="354" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="378" r="10"/>
<text class="num" x="494" y="382" text-anchor="middle">5</text>
<text class="t" x="514" y="383">把 MATCH 遍历跑成 GraphBLAS 稀疏矩阵代</text>
<text class="t" x="514" y="405">数，Redis 级延迟</text>
<text class="comp" x="514" y="433">组件：GraphBLAS 内核</text>
<rect class="val" x="28" y="483" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="507">价值</text>
<text class="valT" x="48" y="531">一台 Redis 级低延迟服务器，装下多个按租户隔离、用 Cypher 查询的图</text>
</svg>
