<svg xmlns="http://www.w3.org/2000/svg" width="880" height="768" viewBox="0 0 880 768" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="768" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="632" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="632" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Palmier Pro does</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,179.0 C441.0,179.0 441.0,217 410,217" marker-end="url(#a)"/>
<path class="edge" d="M62,307 L62,331" marker-end="url(#a)"/>
<path class="hand" d="M408,369.0 C439.0,369.0 439.0,393 470,393" marker-end="url(#a)"/>
<path class="edge" d="M494,508 L494,532" marker-end="url(#a)"/>
<path class="hand" d="M472,570.0 C441.0,570.0 441.0,594 410,594" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Open the app on an Apple Silicon Mac</text>
<text class="t" x="82" y="123">(DMG, or build the frozen GPL source)</text>
<text class="c" x="82" y="147">swift run</text>
<rect class="cardT" x="472" y="119" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">While open, serves a local MCP</text>
<text class="t" x="514" y="170">endpoint bound to localhost</text>
<text class="c" x="514" y="194">http://127.0.0.1:19789/mcp</text>
<text class="comp" x="514" y="217">component: in-app MCP HTTP server</text>
<rect class="card" x="40" y="193" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">Register that endpoint with your</text>
<text class="t" x="82" y="244">coding agent</text>
<text class="c" x="82" y="268">claude mcp add --transport http</text>
<text class="c" x="82" y="287">palmier-pro http://127.0.0.1:19789/mcp</text>
<rect class="card" x="40" y="333" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">4</text>
<text class="t" x="82" y="362">Ask the agent for an edit in plain</text>
<text class="t" x="82" y="384">words</text>
<rect class="cardT" x="472" y="369" width="368" height="139" rx="8"/>
<rect class="accT" x="472" y="369" width="4" height="139" rx="2"/>
<circle class="accT" cx="494" cy="393" r="10"/>
<text class="num" x="494" y="397" text-anchor="middle">5</text>
<text class="t" x="514" y="398">The agent calls editing tools that</text>
<text class="t" x="514" y="420">change the open timeline</text>
<text class="c" x="514" y="444">add_clips · split_clips ·</text>
<text class="c" x="514" y="463">ripple_delete_ranges</text>
<text class="comp" x="514" y="486">component: 52 MCP editing tools</text>
<rect class="cardT" x="472" y="534" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="534" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="558" r="10"/>
<text class="num" x="494" y="562" text-anchor="middle">6</text>
<text class="t" x="514" y="563">Each agent edit lands in the same undo</text>
<text class="t" x="514" y="585">history as your own edits</text>
<rect class="card" x="40" y="570" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="570" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="594" r="10"/>
<text class="num" x="62" y="598" text-anchor="middle">7</text>
<text class="t" x="82" y="599">Review on the timeline, undo or</text>
<text class="t" x="82" y="621">adjust, then export</text>
<rect class="val" x="28" y="674" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="698">VALUE</text>
<text class="valT" x="48" y="722">An agent edits the project you have open, instead of you re-expressing the cut as a script</text>
</svg>
