<svg xmlns="http://www.w3.org/2000/svg" width="880" height="687" viewBox="0 0 880 687" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="687" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="551" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="551" rx="10"/>
<rect class="pillT" x="474" y="40" width="151.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">SimpleMem 做的</text>
<path class="edge" d="M62,162 L62,186" marker-end="url(#a)"/>
<path class="hand" d="M408,233.0 C439.0,233.0 439.0,257 470,257" marker-end="url(#a)"/>
<path class="edge" d="M494,325 L494,349" marker-end="url(#a)"/>
<path class="hand" d="M472,397.0 C441.0,397.0 441.0,421 410,421" marker-end="url(#a)"/>
<path class="hand" d="M408,442.0 C439.0,442.0 439.0,493 470,493" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">写入</text>
<text class="t" x="82" y="118">安装，把配置指向任一 OpenAI 兼容接口</text>
<text class="c" x="82" y="142">pip install -e .</text>
<rect class="card" x="40" y="188" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="188" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="212" r="10"/>
<text class="num" x="62" y="216" text-anchor="middle">2</text>
<text class="ph" x="82" y="217">写入</text>
<text class="t" x="82" y="234">建记忆实例，带时间戳喂入对话</text>
<text class="c" x="82" y="258">mem.add_dialogue(...)</text>
<rect class="cardT" x="472" y="233" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="233" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="257" r="10"/>
<text class="num" x="494" y="261" text-anchor="middle">3</text>
<text class="ph" x="514" y="262">写入</text>
<text class="t" x="514" y="279">把每轮对话蒸馏成紧凑自包含的记忆单元</text>
<text class="comp" x="514" y="307">组件：压缩管线</text>
<rect class="cardT" x="472" y="351" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="351" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="375" r="10"/>
<text class="num" x="494" y="379" text-anchor="middle">4</text>
<text class="ph" x="514" y="380">写入</text>
<text class="t" x="514" y="397">在线合并相关记忆，索引进内嵌的 LanceDB</text>
<text class="comp" x="514" y="425">组件：LanceDB＋tantivy 索引</text>
<rect class="card" x="40" y="397" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="397" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="421" r="10"/>
<text class="num" x="62" y="425" text-anchor="middle">5</text>
<text class="ph" x="82" y="426">召回</text>
<text class="t" x="82" y="443">结束写入，用自然语言提问</text>
<text class="c" x="82" y="467">mem.finalize() · mem.ask(...)</text>
<rect class="cardT" x="472" y="469" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="469" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="493" r="10"/>
<text class="num" x="494" y="497" text-anchor="middle">6</text>
<text class="ph" x="514" y="498">召回</text>
<text class="t" x="514" y="515">按问题意图规划检索，拼出紧凑答案</text>
<text class="comp" x="514" y="543">组件：检索规划器</text>
<rect class="val" x="28" y="593" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="617">价值</text>
<text class="valT" x="48" y="641">过去的交互随时可召回，不用把原始历史重放进上下文</text>
</svg>
