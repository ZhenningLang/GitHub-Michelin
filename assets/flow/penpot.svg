<svg xmlns="http://www.w3.org/2000/svg" width="880" height="732" viewBox="0 0 880 732" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="732" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="596" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="596" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Penpot does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,263.5 C439.0,263.5 439.0,287 470,287" marker-end="url(#a)"/>
<path class="hand" d="M472,311.5 C441.0,311.5 441.0,362 410,362" marker-end="url(#a)"/>
<path class="hand" d="M408,374.0 C439.0,374.0 439.0,410 470,410" marker-end="url(#a)"/>
<path class="hand" d="M472,434.5 C441.0,434.5 441.0,460 410,460" marker-end="url(#a)"/>
<path class="hand" d="M408,496.0 C439.0,496.0 439.0,533 470,533" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Bring up the stack with Docker Compose</text>
<text class="c" x="82" y="125">docker compose -p penpot -f</text>
<text class="c" x="82" y="144">docker-compose.yaml up -d</text>
<text class="comp" x="82" y="167">component: Docker Compose stack</text>
<rect class="card" x="40" y="215" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Open localhost:9001 and create the</text>
<text class="t" x="82" y="266">first account</text>
<text class="comp" x="82" y="294">component: Penpot frontend</text>
<rect class="cardT" x="472" y="263" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="263" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="287" r="10"/>
<text class="num" x="494" y="291" text-anchor="middle">3</text>
<text class="t" x="514" y="292">Keeps files in Postgres and assets in</text>
<text class="t" x="514" y="314">the storage you pointed it at</text>
<text class="comp" x="514" y="342">component: JVM backend</text>
<rect class="card" x="40" y="338" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="338" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="362" r="10"/>
<text class="num" x="62" y="366" text-anchor="middle">4</text>
<text class="t" x="82" y="367">Design in the browser and invite the</text>
<text class="t" x="82" y="389">team onto the file</text>
<rect class="cardT" x="472" y="386" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="386" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="410" r="10"/>
<text class="num" x="494" y="414" text-anchor="middle">5</text>
<text class="t" x="514" y="415">Syncs every peer live over WebSocket</text>
<text class="t" x="514" y="437">and holds the comments</text>
<text class="comp" x="514" y="465">component: real-time sync</text>
<rect class="card" x="40" y="436" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="436" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="460" r="10"/>
<text class="num" x="62" y="464" text-anchor="middle">6</text>
<text class="t" x="82" y="465">Hand CSS/SVG off from Inspect, or wire</text>
<text class="t" x="82" y="487">an agent to the MCP server</text>
<text class="c" x="82" y="511">npx -y add-mcp -g -n penpot &lt;URL&gt;</text>
<text class="comp" x="82" y="534">component: Inspect · MCP server</text>
<rect class="cardT" x="472" y="509" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="509" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="533" r="10"/>
<text class="num" x="494" y="537" text-anchor="middle">7</text>
<text class="t" x="514" y="538">Lets the agent read and rewrite the</text>
<text class="t" x="514" y="560">focused page through the plugin bridge</text>
<text class="comp" x="514" y="588">component: MCP plugin bridge</text>
<rect class="val" x="28" y="638" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="662">VALUE</text>
<text class="valT" x="48" y="686">The team edits one file on servers you control, in a format that does not lock you in</text>
</svg>
