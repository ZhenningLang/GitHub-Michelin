<svg xmlns="http://www.w3.org/2000/svg" width="880" height="941" viewBox="0 0 880 941" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="941" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="783" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="783" rx="10"/>
<rect class="pillT" x="474" y="40" width="193.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenAgentCore does</text>
<path class="hand" d="M408,119.0 C439.0,119.0 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,178.5 C441.0,178.5 441.0,216 410,216" marker-end="url(#a)"/>
<path class="edge" d="M62,286 L62,310" marker-end="url(#a)"/>
<path class="edge" d="M62,426 L62,450" marker-end="url(#a)"/>
<path class="hand" d="M408,510.5 C439.0,510.5 439.0,534 470,534" marker-end="url(#a)"/>
<path class="edge" d="M494,648 L494,672" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Run the one-line installer from the</text>
<text class="t" x="82" y="123">latest release on a Linux host with</text>
<text class="t" x="82" y="145">Docker</text>
<rect class="cardT" x="472" y="119" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">Starts Core, Web, PostgreSQL and an</text>
<text class="t" x="514" y="170">HTTPS gateway; prints the console</text>
<text class="t" x="514" y="192">address and API base URL</text>
<text class="comp" x="514" y="220">component: installer</text>
<rect class="card" x="40" y="192" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="192" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="216" r="10"/>
<text class="num" x="62" y="220" text-anchor="middle">3</text>
<text class="t" x="82" y="221">In Web: set the domain, a default</text>
<text class="t" x="82" y="243">model and a Project API key, then add</text>
<text class="t" x="82" y="265">a node or E2B</text>
<rect class="card" x="40" y="312" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="312" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="336" r="10"/>
<text class="num" x="62" y="340" text-anchor="middle">4</text>
<text class="t" x="82" y="341">Point the official OpenAI SDK at your</text>
<text class="t" x="82" y="363">installation</text>
<text class="c" x="82" y="387">export</text>
<text class="c" x="82" y="406">OPENAI_BASE_URL=https://core.example/v1</text>
<rect class="card" x="40" y="452" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="452" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="476" r="10"/>
<text class="num" x="62" y="480" text-anchor="middle">5</text>
<text class="t" x="82" y="481">Create a Session with a task and the</text>
<text class="t" x="82" y="503">harness you want (Codex, Claude Code,</text>
<text class="t" x="82" y="525">MiniMax Code)</text>
<text class="c" x="82" y="549">client.beta.agents.sessions.create</text>
<rect class="cardT" x="472" y="510" width="368" height="138" rx="8"/>
<rect class="accT" x="472" y="510" width="4" height="138" rx="2"/>
<circle class="accT" cx="494" cy="534" r="10"/>
<text class="num" x="494" y="538" text-anchor="middle">6</text>
<text class="t" x="514" y="539">Gets a sandbox, starts the Runtime</text>
<text class="t" x="514" y="561">daemon and runs the native harness in</text>
<text class="t" x="514" y="583">the workspace</text>
<text class="comp" x="514" y="611">component: Runtime daemon + harness</text>
<text class="comp" x="514" y="630">adapter</text>
<rect class="cardT" x="472" y="674" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="674" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="698" r="10"/>
<text class="num" x="494" y="702" text-anchor="middle">7</text>
<text class="t" x="514" y="703">Persists Turns, Items and events; your</text>
<text class="t" x="514" y="725">app reads or streams them through the</text>
<text class="t" x="514" y="747">same API</text>
<text class="comp" x="514" y="775">component: Core + PostgreSQL</text>
<rect class="val" x="28" y="825" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="849">VALUE</text>
<text class="valT" x="48" y="873">Your app drives Codex, Claude Code or MiniMax Code via one OpenAI-shaped API on your machines</text>
<text class="valT" x="48" y="895">— no per-agent glue, sandboxing or session store to build</text>
</svg>
