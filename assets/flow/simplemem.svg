<svg xmlns="http://www.w3.org/2000/svg" width="880" height="786" viewBox="0 0 880 786" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="786" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="650" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="650" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">SimpleMem does</text>
<path class="edge" d="M62,184 L62,208" marker-end="url(#a)"/>
<path class="hand" d="M408,266.0 C439.0,266.0 439.0,290 470,290" marker-end="url(#a)"/>
<path class="edge" d="M494,380 L494,404" marker-end="url(#a)"/>
<path class="hand" d="M472,463.0 C441.0,463.0 441.0,487 410,487" marker-end="url(#a)"/>
<path class="hand" d="M408,508.0 C439.0,508.0 439.0,570 470,570" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Build memory</text>
<text class="t" x="82" y="118">Install, point config at any</text>
<text class="t" x="82" y="140">OpenAI-compatible endpoint</text>
<text class="c" x="82" y="164">pip install -e .</text>
<rect class="card" x="40" y="210" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="210" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="234" r="10"/>
<text class="num" x="62" y="238" text-anchor="middle">2</text>
<text class="ph" x="82" y="239">Build memory</text>
<text class="t" x="82" y="256">Create the memory, feed dialogue turns</text>
<text class="t" x="82" y="278">with timestamps</text>
<text class="c" x="82" y="302">mem.add_dialogue(...)</text>
<rect class="cardT" x="472" y="266" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="266" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="290" r="10"/>
<text class="num" x="494" y="294" text-anchor="middle">3</text>
<text class="ph" x="514" y="295">Build memory</text>
<text class="t" x="514" y="312">Distills each turn into compact</text>
<text class="t" x="514" y="334">self-contained memory units</text>
<text class="comp" x="514" y="362">component: compression pipeline</text>
<rect class="cardT" x="472" y="406" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="406" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="430" r="10"/>
<text class="num" x="494" y="434" text-anchor="middle">4</text>
<text class="ph" x="514" y="435">Build memory</text>
<text class="t" x="514" y="452">Merges related units online, indexes</text>
<text class="t" x="514" y="474">them in embedded LanceDB</text>
<text class="comp" x="514" y="502">component: LanceDB + tantivy index</text>
<rect class="card" x="40" y="463" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="463" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="487" r="10"/>
<text class="num" x="62" y="491" text-anchor="middle">5</text>
<text class="ph" x="82" y="492">Recall</text>
<text class="t" x="82" y="509">Finalize, then ask in plain language</text>
<text class="c" x="82" y="533">mem.finalize() · mem.ask(...)</text>
<rect class="cardT" x="472" y="546" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="546" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="570" r="10"/>
<text class="num" x="494" y="574" text-anchor="middle">6</text>
<text class="ph" x="514" y="575">Recall</text>
<text class="t" x="514" y="592">Plans retrieval around the question&#x27;s</text>
<text class="t" x="514" y="614">intent, assembles a compact answer</text>
<text class="comp" x="514" y="642">component: retrieval planner</text>
<rect class="val" x="28" y="692" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="716">VALUE</text>
<text class="valT" x="48" y="740">Past interactions stay recallable without replaying raw history into the context</text>
</svg>
