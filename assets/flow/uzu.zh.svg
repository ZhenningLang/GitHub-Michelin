<svg xmlns="http://www.w3.org/2000/svg" width="880" height="746" viewBox="0 0 880 746" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="746" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="610" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="610" rx="10"/>
<rect class="pillT" x="474" y="40" width="96.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">uzu 做的</text>
<path class="edge" d="M62,230 L62,254" marker-end="url(#a)"/>
<path class="hand" d="M408,302.0 C439.0,302.0 439.0,326 470,326" marker-end="url(#a)"/>
<path class="hand" d="M472,350.5 C441.0,350.5 441.0,398 410,398" marker-end="url(#a)"/>
<path class="hand" d="M408,410.5 C439.0,410.5 439.0,449 470,449" marker-end="url(#a)"/>
<path class="hand" d="M472,461.0 C441.0,461.0 441.0,497 410,497" marker-end="url(#a)"/>
<path class="hand" d="M408,519.0 C439.0,519.0 439.0,547 470,547" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="158" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="158" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把 Swift 包加进你的 iOS/macOS 应用（系统</text>
<text class="t" x="82" y="123">需 26.4+）</text>
<text class="c" x="82" y="147">.package(url:</text>
<text class="c" x="82" y="166">&quot;https://github.com/trymirai/uzu.git&quot;,</text>
<text class="c" x="82" y="185">from: &quot;0.6.2&quot;)</text>
<text class="comp" x="82" y="208">组件：预编译 uzu 二进制</text>
<rect class="card" x="40" y="256" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="256" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="280" r="10"/>
<text class="num" x="62" y="284" text-anchor="middle">2</text>
<text class="t" x="82" y="285">创建引擎，按目录 id 要一个模型</text>
<text class="c" x="82" y="309">engine.model(identifier:</text>
<text class="c" x="82" y="328">&quot;alibaba:qwen3.5:0.8b:mirai:mirai-m:4&quot;)</text>
<rect class="cardT" x="472" y="302" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="302" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="326" r="10"/>
<text class="num" x="494" y="330" text-anchor="middle">3</text>
<text class="t" x="514" y="331">到 Mirai 托管的模型目录查这个 id，只给本机</text>
<text class="t" x="514" y="353">能跑的版本</text>
<text class="comp" x="514" y="381">组件：Mirai 目录客户端</text>
<rect class="card" x="40" y="374" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="374" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="398" r="10"/>
<text class="num" x="62" y="402" text-anchor="middle">4</text>
<text class="t" x="82" y="403">发起下载，显示进度</text>
<text class="c" x="82" y="427">engine.download(model: model)</text>
<rect class="cardT" x="472" y="425" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="425" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="449" r="10"/>
<text class="num" x="494" y="453" text-anchor="middle">5</text>
<text class="t" x="514" y="454">从 Hugging Face 拉取已转换好的权重，缓存</text>
<text class="t" x="514" y="476">在设备上</text>
<rect class="card" x="40" y="473" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="473" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="497" r="10"/>
<text class="num" x="62" y="501" text-anchor="middle">6</text>
<text class="t" x="82" y="502">开一个对话会话，发出消息</text>
<text class="c" x="82" y="526">session.reply(input: messages, config:</text>
<text class="c" x="82" y="545">.create())</text>
<rect class="cardT" x="472" y="523" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="523" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="547" r="10"/>
<text class="num" x="494" y="551" text-anchor="middle">7</text>
<text class="t" x="514" y="552">用自带的 Metal 内核在苹果 GPU 上跑模型，返</text>
<text class="t" x="514" y="574">回推理过程和正文</text>
<text class="comp" x="514" y="602">组件：Metal 后端</text>
<rect class="val" x="28" y="652" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="676">价值</text>
<text class="valT" x="48" y="700">语言模型在用户设备上、在你的应用里直接作答：不用自建服务，也没有按 token 计费</text>
</svg>
