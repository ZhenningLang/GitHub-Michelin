<svg xmlns="http://www.w3.org/2000/svg" width="880" height="839" viewBox="0 0 880 839" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="839" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="681" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="681" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Magpie does</text>
<path class="edge" d="M62,191 L62,215" marker-end="url(#a)"/>
<path class="edge" d="M62,289 L62,313" marker-end="url(#a)"/>
<path class="hand" d="M408,351.0 C439.0,351.0 439.0,375 470,375" marker-end="url(#a)"/>
<path class="edge" d="M494,448 L494,472" marker-end="url(#a)"/>
<path class="edge" d="M494,571 L494,595" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="119" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="119" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Unzip the release, run Magpie, and</text>
<text class="t" x="82" y="123">pick a scaling mode such as FSR or</text>
<text class="t" x="82" y="145">Anime4K</text>
<text class="comp" x="82" y="173">component: profile</text>
<rect class="card" x="40" y="217" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="217" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="241" r="10"/>
<text class="num" x="62" y="245" text-anchor="middle">2</text>
<text class="t" x="82" y="246">Run the game or app windowed at its</text>
<text class="t" x="82" y="268">native (best) resolution</text>
<rect class="card" x="40" y="315" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="315" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="339" r="10"/>
<text class="num" x="62" y="343" text-anchor="middle">3</text>
<text class="t" x="82" y="344">Focus that window and press the scale</text>
<text class="t" x="82" y="366">hotkey</text>
<rect class="cardT" x="472" y="351" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="351" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="375" r="10"/>
<text class="num" x="494" y="379" text-anchor="middle">4</text>
<text class="t" x="514" y="380">Captures the window&#x27;s frames through</text>
<text class="t" x="514" y="402">Windows Graphics Capture, no injection</text>
<text class="comp" x="514" y="430">component: frame source</text>
<rect class="cardT" x="472" y="474" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="474" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="498" r="10"/>
<text class="num" x="494" y="502" text-anchor="middle">5</text>
<text class="t" x="514" y="503">Runs your HLSL effect chain on the GPU</text>
<text class="t" x="514" y="525">to enlarge each frame</text>
<text class="comp" x="514" y="553">component: MagpieFX effects</text>
<rect class="cardT" x="472" y="597" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="597" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="621" r="10"/>
<text class="num" x="494" y="625" text-anchor="middle">6</text>
<text class="t" x="514" y="626">Shows the result in a topmost window</text>
<text class="t" x="514" y="648">and maps your cursor back to the</text>
<text class="t" x="514" y="670">source</text>
<rect class="val" x="28" y="723" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="747">VALUE</text>
<text class="valT" x="48" y="771">A small, blurry-when-stretched window plays full-screen and sharper, and nothing is injected</text>
<text class="valT" x="48" y="793">into the game</text>
</svg>
