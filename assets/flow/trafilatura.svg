<svg xmlns="http://www.w3.org/2000/svg" width="880" height="965" viewBox="0 0 880 965" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="965" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="829" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="829" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">trafilatura does</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="edge" d="M62,338 L62,362" marker-end="url(#a)"/>
<path class="hand" d="M408,430.5 C439.0,430.5 439.0,454 470,454" marker-end="url(#a)"/>
<path class="edge" d="M494,549 L494,573" marker-end="url(#a)"/>
<path class="edge" d="M494,694 L494,718" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the package (Python API and</text>
<text class="t" x="82" y="123">CLI come together)</text>
<text class="c" x="82" y="147">pip install trafilatura</text>
<text class="comp" x="82" y="170">component: PyPI package</text>
<rect class="card" x="40" y="218" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">Download the page, or pass in HTML you</text>
<text class="t" x="82" y="269">already fetched</text>
<text class="c" x="82" y="293">downloaded = fetch_url(url)</text>
<text class="comp" x="82" y="316">component: downloader (urllib3)</text>
<rect class="card" x="40" y="364" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="364" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="388" r="10"/>
<text class="num" x="62" y="392" text-anchor="middle">3</text>
<text class="t" x="82" y="393">Ask for the main text in the format</text>
<text class="t" x="82" y="415">you want, with metadata</text>
<text class="c" x="82" y="439">extract(downloaded,</text>
<text class="c" x="82" y="458">output_format=&quot;markdown&quot;,</text>
<text class="c" x="82" y="477">with_metadata=True)</text>
<rect class="cardT" x="472" y="430" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="430" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="454" r="10"/>
<text class="num" x="494" y="458" text-anchor="middle">4</text>
<text class="t" x="514" y="459">Parses the HTML and keeps the block</text>
<text class="t" x="514" y="481">that looks like the article, dropping</text>
<text class="t" x="514" y="503">nav, footers and widgets</text>
<text class="comp" x="514" y="531">component: lxml + extraction rules</text>
<rect class="cardT" x="472" y="575" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="575" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="599" r="10"/>
<text class="num" x="494" y="603" text-anchor="middle">5</text>
<text class="t" x="514" y="604">If the result is too short, retries</text>
<text class="t" x="514" y="626">with readability and jusText and keeps</text>
<text class="t" x="514" y="648">the better one</text>
<text class="comp" x="514" y="676">component: fallback extractors</text>
<rect class="cardT" x="472" y="720" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="720" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="744" r="10"/>
<text class="num" x="494" y="748" text-anchor="middle">6</text>
<text class="t" x="514" y="749">Reads title, author and date from the</text>
<text class="t" x="514" y="771">page&#x27;s markup and returns everything</text>
<text class="t" x="514" y="793">in your format</text>
<text class="comp" x="514" y="821">component: htmldate + metadata parser</text>
<rect class="val" x="28" y="871" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="895">VALUE</text>
<text class="valT" x="48" y="919">Clean article text plus metadata from any site, without writing a selector per domain</text>
</svg>
