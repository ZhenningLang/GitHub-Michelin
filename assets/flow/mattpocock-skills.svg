<svg xmlns="http://www.w3.org/2000/svg" width="880" height="953" viewBox="0 0 880 953" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="953" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="795" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="795" rx="10"/>
<rect class="pillT" x="474" y="40" width="230.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">mattpocock/skills does</text>
<path class="edge" d="M62,209 L62,233" marker-end="url(#a)"/>
<path class="hand" d="M408,291.0 C439.0,291.0 439.0,315 470,315" marker-end="url(#a)"/>
<path class="hand" d="M472,346.5 C441.0,346.5 441.0,397 410,397" marker-end="url(#a)"/>
<path class="hand" d="M408,429.0 C439.0,429.0 439.0,453 470,453" marker-end="url(#a)"/>
<path class="hand" d="M472,484.5 C441.0,484.5 441.0,535 410,535" marker-end="url(#a)"/>
<path class="hand" d="M408,567.0 C439.0,567.0 439.0,591 470,591" marker-end="url(#a)"/>
<path class="hand" d="M472,611.5 C441.0,611.5 441.0,673 410,673" marker-end="url(#a)"/>
<path class="hand" d="M408,694.0 C439.0,694.0 439.0,718 470,718" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Install</text>
<text class="t" x="82" y="118">Install the whole set via skills.sh,</text>
<text class="t" x="82" y="140">or subscribe as a Claude Code plugin</text>
<text class="c" x="82" y="164">npx skills@latest add mattpocock/skills</text>
<text class="comp" x="82" y="187">component: skills.sh / plugin</text>
<rect class="card" x="40" y="235" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="235" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="259" r="10"/>
<text class="num" x="62" y="263" text-anchor="middle">2</text>
<text class="ph" x="82" y="264">Setup</text>
<text class="t" x="82" y="281">Run the one-time setup in each repo</text>
<text class="t" x="82" y="303">you want to cover</text>
<text class="c" x="82" y="327">/setup-matt-pocock-skills</text>
<rect class="cardT" x="472" y="291" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="291" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="315" r="10"/>
<text class="num" x="494" y="319" text-anchor="middle">3</text>
<text class="ph" x="514" y="320">Setup</text>
<text class="t" x="514" y="337">Interviews you on issue tracker,</text>
<text class="t" x="514" y="359">triage labels and docs location, then</text>
<text class="t" x="514" y="381">configures the repo</text>
<rect class="card" x="40" y="373" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="373" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="397" r="10"/>
<text class="num" x="62" y="401" text-anchor="middle">4</text>
<text class="ph" x="82" y="402">Daily loop</text>
<text class="t" x="82" y="419">Start every change with a grilling</text>
<text class="t" x="82" y="441">interview instead of a prompt dump</text>
<text class="c" x="82" y="465">/grill-with-docs</text>
<rect class="cardT" x="472" y="429" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="429" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="453" r="10"/>
<text class="num" x="494" y="457" text-anchor="middle">5</text>
<text class="ph" x="514" y="458">Daily loop</text>
<text class="t" x="514" y="475">Interviews until every design branch</text>
<text class="t" x="514" y="497">resolves, distilling shared vocabulary</text>
<text class="t" x="514" y="519">into CONTEXT.md and ADRs</text>
<rect class="card" x="40" y="511" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="511" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="535" r="10"/>
<text class="num" x="62" y="539" text-anchor="middle">6</text>
<text class="ph" x="82" y="540">Daily loop</text>
<text class="t" x="82" y="557">Freeze the conversation into a spec,</text>
<text class="t" x="82" y="579">then break it into tickets</text>
<text class="c" x="82" y="603">/to-spec</text>
<rect class="cardT" x="472" y="567" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="567" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="591" r="10"/>
<text class="num" x="494" y="595" text-anchor="middle">7</text>
<text class="ph" x="514" y="596">Daily loop</text>
<text class="t" x="514" y="613">Publishes the spec and blocking-linked</text>
<text class="t" x="514" y="635">tickets to the tracker you chose</text>
<rect class="card" x="40" y="649" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="649" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="673" r="10"/>
<text class="num" x="62" y="677" text-anchor="middle">8</text>
<text class="ph" x="82" y="678">Daily loop</text>
<text class="t" x="82" y="695">Tell the agent to build the tickets</text>
<text class="c" x="82" y="719">/implement</text>
<rect class="cardT" x="472" y="694" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="694" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="718" r="10"/>
<text class="num" x="494" y="722" text-anchor="middle">9</text>
<text class="ph" x="514" y="723">Daily loop</text>
<text class="t" x="514" y="740">Drives /tdd red-green-refactor per</text>
<text class="t" x="514" y="762">vertical slice and closes with a</text>
<text class="t" x="514" y="784">two-axis /code-review</text>
<rect class="val" x="28" y="837" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="861">VALUE</text>
<text class="valT" x="48" y="885">Every change goes through the same loop — align first, test-driven build, reviewed diff —</text>
<text class="valT" x="48" y="907">without a heavyweight framework owning the process</text>
</svg>
