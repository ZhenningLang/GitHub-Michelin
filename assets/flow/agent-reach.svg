<svg xmlns="http://www.w3.org/2000/svg" width="880" height="743" viewBox="0 0 880 743" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="743" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="585" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="585" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agent-Reach does</text>
<path class="hand" d="M408,140.0 C439.0,140.0 439.0,164 470,164" marker-end="url(#a)"/>
<path class="hand" d="M472,211.0 C441.0,211.0 441.0,258 410,258" marker-end="url(#a)"/>
<path class="hand" d="M408,292.5 C439.0,292.5 439.0,332 470,332" marker-end="url(#a)"/>
<path class="hand" d="M472,367.5 C441.0,367.5 441.0,401 410,401" marker-end="url(#a)"/>
<path class="hand" d="M408,424.0 C439.0,424.0 439.0,477 470,477" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Hand your agent one URL — the</text>
<text class="t" x="82" y="123">project&#x27;s install doc — and nothing</text>
<text class="t" x="82" y="145">else</text>
<text class="c" x="82" y="169">https://raw.githubusercontent.com/Panniant</text>
<text class="c" x="82" y="188">ong/agent-reach/main/docs/install.md</text>
<rect class="cardT" x="472" y="140" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="140" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="164" r="10"/>
<text class="num" x="494" y="168" text-anchor="middle">2</text>
<text class="t" x="514" y="169">Install the CLI, then check the</text>
<text class="t" x="514" y="191">machine read-only and list what&#x27;s</text>
<text class="t" x="514" y="213">missing</text>
<text class="c" x="514" y="237">agent-reach install --env=auto</text>
<text class="comp" x="514" y="260">component: agent-reach CLI</text>
<rect class="card" x="40" y="234" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">3</text>
<text class="t" x="82" y="263">Approve system-level installs</text>
<text class="t" x="82" y="285">explicitly when you want the tools</text>
<text class="t" x="82" y="307">actually installed</text>
<text class="c" x="82" y="331">agent-reach install --env=auto --system</text>
<rect class="cardT" x="472" y="308" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="308" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="332" r="10"/>
<text class="num" x="494" y="336" text-anchor="middle">4</text>
<text class="t" x="514" y="337">Install the vetted upstream CLI/MCP</text>
<text class="t" x="514" y="359">per platform, each as an ordered</text>
<text class="t" x="514" y="381">primary+fallback list</text>
<text class="comp" x="514" y="409">component: channels/ router</text>
<rect class="card" x="40" y="377" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="377" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="401" r="10"/>
<text class="num" x="62" y="405" text-anchor="middle">5</text>
<text class="t" x="82" y="406">For logged-in platforms, just ask your</text>
<text class="t" x="82" y="428">agent to configure that platform and</text>
<text class="t" x="82" y="450">export cookies when guided</text>
<rect class="cardT" x="472" y="453" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="453" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="477" r="10"/>
<text class="num" x="494" y="481" text-anchor="middle">6</text>
<text class="t" x="514" y="482">agent-reach doctor probes each channel</text>
<text class="t" x="514" y="504">for real and reports which backend is</text>
<text class="t" x="514" y="526">currently active</text>
<text class="c" x="514" y="550">agent-reach doctor</text>
<text class="comp" x="514" y="573">component: doctor</text>
<rect class="val" x="28" y="627" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="651">VALUE</text>
<text class="valT" x="48" y="675">Your agent reads and searches Twitter, Reddit, YouTube, Bilibili, XiaoHongShu via upstream</text>
<text class="valT" x="48" y="697">tools — when a path dies, the stack swaps it, zero action</text>
</svg>
