<svg xmlns="http://www.w3.org/2000/svg" width="880" height="614" viewBox="0 0 880 614" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="614" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="478" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="478" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Flower 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,261.0 C439.0,261.0 439.0,285 470,285" marker-end="url(#a)"/>
<path class="hand" d="M472,298.5 C441.0,298.5 441.0,379 410,379" marker-end="url(#a)"/>
<path class="hand" d="M408,391.0 C439.0,391.0 439.0,415 470,415" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在能触达 Celery 应用与 broker 的环境里装</text>
<text class="t" x="82" y="123">Flower</text>
<text class="c" x="82" y="147">pip install flower</text>
<rect class="card" x="40" y="193" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">把它指向集群的 broker 并启动</text>
<text class="c" x="82" y="246">celery</text>
<text class="c" x="82" y="265">--broker=amqp://guest:guest@localhost:5672</text>
<text class="c" x="82" y="284">// flower</text>
<text class="comp" x="82" y="307">组件：Web UI，端口 5555</text>
<rect class="cardT" x="472" y="261" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="261" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="285" r="10"/>
<text class="num" x="494" y="289" text-anchor="middle">3</text>
<text class="t" x="514" y="290">接入集群事件流，实时呈现 worker 与任务状态</text>
<text class="comp" x="514" y="318">组件：Celery 事件流</text>
<rect class="card" x="40" y="355" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="355" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="379" r="10"/>
<text class="num" x="62" y="383" text-anchor="middle">4</text>
<text class="t" x="82" y="384">在 UI 里下钻，或经 REST API 操作（撤销任</text>
<text class="t" x="82" y="406">务、扩池）</text>
<rect class="cardT" x="472" y="391" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="391" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="415" r="10"/>
<text class="num" x="494" y="419" text-anchor="middle">5</text>
<text class="t" x="514" y="420">控制指令走 broker，/metrics 供</text>
<text class="t" x="514" y="442">Prometheus 抓取</text>
<text class="comp" x="514" y="470">组件：worker 控制</text>
<rect class="val" x="28" y="520" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="544">价值</text>
<text class="valT" x="48" y="568">一个 Celery 集群变得可看可控，只靠一张网页，worker 上零 agent</text>
</svg>
