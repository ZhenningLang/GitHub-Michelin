<svg xmlns="http://www.w3.org/2000/svg" width="880" height="568" viewBox="0 0 880 568" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="568" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="432" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="432" rx="10"/>
<rect class="pillT" x="474" y="40" width="239.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">the PPT MCP server does</text>
<path class="hand" d="M408,129.0 C439.0,129.0 439.0,153 470,153" marker-end="url(#a)"/>
<path class="hand" d="M472,177.5 C441.0,177.5 441.0,236 410,236" marker-end="url(#a)"/>
<path class="hand" d="M408,269.0 C439.0,269.0 439.0,293 470,293" marker-end="url(#a)"/>
<path class="hand" d="M472,317.5 C441.0,317.5 441.0,376 410,376" marker-end="url(#a)"/>
<path class="hand" d="M408,388.5 C439.0,388.5 439.0,416 470,416" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Point an MCP client at the PyPI entry</text>
<text class="t" x="82" y="123">point</text>
<text class="c" x="82" y="147">uvx --from office-powerpoint-mcp-server</text>
<text class="c" x="82" y="166">ppt_mcp_server</text>
<rect class="cardT" x="472" y="129" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="129" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="153" r="10"/>
<text class="num" x="494" y="157" text-anchor="middle">2</text>
<text class="t" x="514" y="158">Starts FastMCP over stdio and</text>
<text class="t" x="514" y="180">registers the PowerPoint tools</text>
<text class="comp" x="514" y="208">component: ppt_mcp_server</text>
<rect class="card" x="40" y="212" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">3</text>
<text class="t" x="82" y="241">Ask the client to create a deck and</text>
<text class="t" x="82" y="263">add slides</text>
<text class="c" x="82" y="287">create_presentation · add_slide ·</text>
<text class="c" x="82" y="306">manage_text</text>
<rect class="cardT" x="472" y="269" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="269" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="293" r="10"/>
<text class="num" x="494" y="297" text-anchor="middle">4</text>
<text class="t" x="514" y="298">Holds a python-pptx Presentation in</text>
<text class="t" x="514" y="320">process memory and mutates it</text>
<text class="comp" x="514" y="348">component: in-memory presentations dict</text>
<rect class="card" x="40" y="352" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">5</text>
<text class="t" x="82" y="381">Tell it where to write the file</text>
<text class="c" x="82" y="405">save_presentation</text>
<rect class="cardT" x="472" y="392" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="392" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="416" r="10"/>
<text class="num" x="494" y="420" text-anchor="middle">6</text>
<text class="t" x="514" y="421">Writes a .pptx to disk</text>
<rect class="val" x="28" y="474" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="498">VALUE</text>
<text class="valT" x="48" y="522">An LLM client can build a .pptx through tool calls — you never write the python-pptx glue</text>
</svg>
