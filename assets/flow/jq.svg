<svg xmlns="http://www.w3.org/2000/svg" width="880" height="753" viewBox="0 0 880 753" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="753" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="617" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="617" rx="10"/>
<rect class="pillT" x="474" y="40" width="92.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">jq does</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="hand" d="M408,284.5 C439.0,284.5 439.0,308 470,308" marker-end="url(#a)"/>
<path class="hand" d="M472,331.0 C441.0,331.0 441.0,401 410,401" marker-end="url(#a)"/>
<path class="hand" d="M408,434.0 C439.0,434.0 439.0,458 470,458" marker-end="url(#a)"/>
<path class="edge" d="M494,506 L494,530" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Get the standalone binary (release</text>
<text class="t" x="82" y="123">page, package manager or Docker image)</text>
<text class="c" x="82" y="147">ghcr.io/jqlang/jq:latest</text>
<text class="comp" x="82" y="170">component: jq binary</text>
<rect class="card" x="40" y="218" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">Pipe JSON into it from a file, curl or</text>
<text class="t" x="82" y="269">another CLI</text>
<text class="c" x="82" y="293">curl</text>
<text class="c" x="82" y="312">&#x27;https://api.github.com/repos/jqlang/jq/co</text>
<text class="c" x="82" y="331">mmits?per_page=5&#x27; | jq &#x27;.&#x27;</text>
<rect class="cardT" x="472" y="284" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="284" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="308" r="10"/>
<text class="num" x="494" y="312" text-anchor="middle">3</text>
<text class="t" x="514" y="313">Parses each JSON value and</text>
<text class="t" x="514" y="335">pretty-prints it, so you can see the</text>
<text class="t" x="514" y="357">shape</text>
<rect class="card" x="40" y="377" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="377" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="401" r="10"/>
<text class="num" x="62" y="405" text-anchor="middle">4</text>
<text class="t" x="82" y="406">Write a filter: walk the path,</text>
<text class="t" x="82" y="428">iterate, select, reshape</text>
<text class="c" x="82" y="452">.[] | {message: .commit.message, name:</text>
<text class="c" x="82" y="471">.commit.committer.name}</text>
<rect class="cardT" x="472" y="434" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="434" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="458" r="10"/>
<text class="num" x="494" y="462" text-anchor="middle">5</text>
<text class="t" x="514" y="463">Runs the filter on every input value</text>
<text class="t" x="514" y="485">and emits a stream of results</text>
<rect class="cardT" x="472" y="532" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="532" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="556" r="10"/>
<text class="num" x="494" y="560" text-anchor="middle">6</text>
<text class="t" x="514" y="561">Prints JSON — or bare strings with -r</text>
<text class="t" x="514" y="583">for the next shell command</text>
<text class="c" x="514" y="607">-r</text>
<rect class="val" x="28" y="659" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="683">VALUE</text>
<text class="valT" x="48" y="707">Any question about any JSON is one shell line, not a throwaway script per question</text>
</svg>
