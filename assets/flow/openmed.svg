<svg xmlns="http://www.w3.org/2000/svg" width="880" height="792" viewBox="0 0 880 792" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="792" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="634" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="634" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenMed does</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="hand" d="M408,278.0 C439.0,278.0 439.0,302 470,302" marker-end="url(#a)"/>
<path class="edge" d="M494,375 L494,399" marker-end="url(#a)"/>
<path class="hand" d="M472,461.0 C441.0,461.0 441.0,485 410,485" marker-end="url(#a)"/>
<path class="hand" d="M408,521.0 C439.0,521.0 439.0,571 470,571" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the SDK with the Hugging Face</text>
<text class="t" x="82" y="123">runtime extra</text>
<text class="c" x="82" y="147">pip install --upgrade &quot;openmed[hf]&quot;</text>
<text class="comp" x="82" y="170">component: openmed SDK</text>
<rect class="card" x="40" y="218" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">Send a note to the analyzer, naming a</text>
<text class="t" x="82" y="269">task model</text>
<text class="c" x="82" y="293">from openmed import analyze_text</text>
<text class="comp" x="82" y="316">component: analyze_text API</text>
<rect class="cardT" x="472" y="278" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="278" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="302" r="10"/>
<text class="num" x="494" y="306" text-anchor="middle">3</text>
<text class="t" x="514" y="307">Fetches the matching checkpoint from</text>
<text class="t" x="514" y="329">the catalog into local cache</text>
<text class="comp" x="514" y="357">component: Hugging Face Hub</text>
<rect class="cardT" x="472" y="401" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="401" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="425" r="10"/>
<text class="num" x="494" y="429" text-anchor="middle">4</text>
<text class="t" x="514" y="430">Labels spans on your hardware and</text>
<text class="t" x="514" y="452">returns entities with confidence</text>
<text class="c" x="514" y="476">result.entities</text>
<text class="comp" x="514" y="499">component: local runtime</text>
<rect class="card" x="40" y="461" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="461" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="485" r="10"/>
<text class="num" x="62" y="489" text-anchor="middle">5</text>
<text class="t" x="82" y="490">Ask for the shareable copy with a</text>
<text class="t" x="82" y="512">redaction method</text>
<text class="c" x="82" y="536">deidentify(text, method=&quot;mask&quot;)</text>
<text class="comp" x="82" y="559">component: privacy pipeline</text>
<rect class="cardT" x="472" y="547" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="547" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="571" r="10"/>
<text class="num" x="494" y="575" text-anchor="middle">6</text>
<text class="t" x="514" y="576">Masks PII spans locally and returns</text>
<text class="t" x="514" y="598">the de-identified text</text>
<text class="comp" x="514" y="626">component: redactor</text>
<rect class="val" x="28" y="676" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="700">VALUE</text>
<text class="valT" x="48" y="724">One clinical note becomes typed entities plus a shareable redacted copy on hardware you</text>
<text class="valT" x="48" y="746">control, with nothing sent to a cloud API</text>
</svg>
