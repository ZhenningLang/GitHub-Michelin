<svg xmlns="http://www.w3.org/2000/svg" width="880" height="784" viewBox="0 0 880 784" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="784" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="648" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="648" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">DeepEval does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="edge" d="M62,332 L62,356" marker-end="url(#a)"/>
<path class="hand" d="M408,394.5 C439.0,394.5 439.0,418 470,418" marker-end="url(#a)"/>
<path class="edge" d="M494,513 L494,537" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it and give it a judge model</text>
<text class="t" x="82" y="123">(OpenAI key by default, or your own</text>
<text class="t" x="82" y="145">model)</text>
<text class="c" x="82" y="169">pip install -U deepeval</text>
<rect class="card" x="40" y="215" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Write a test: input, your app&#x27;s actual</text>
<text class="t" x="82" y="266">output, expected output, plus a metric</text>
<text class="t" x="82" y="288">and threshold</text>
<text class="c" x="82" y="312">LLMTestCase · GEval · assert_test</text>
<rect class="card" x="40" y="358" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="358" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="382" r="10"/>
<text class="num" x="62" y="386" text-anchor="middle">3</text>
<text class="t" x="82" y="387">Run the test file, locally or in CI</text>
<text class="c" x="82" y="411">deepeval test run test_chatbot.py</text>
<rect class="cardT" x="472" y="394" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="394" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="418" r="10"/>
<text class="num" x="494" y="422" text-anchor="middle">4</text>
<text class="t" x="514" y="423">Asks the judge model to score each</text>
<text class="t" x="514" y="445">output against the criteria, from 0 to</text>
<text class="t" x="514" y="467">1, with a reason</text>
<text class="comp" x="514" y="495">component: metric (LLM judge)</text>
<rect class="cardT" x="472" y="539" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="539" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="563" r="10"/>
<text class="num" x="494" y="567" text-anchor="middle">5</text>
<text class="t" x="514" y="568">Fails any test whose score is under</text>
<text class="t" x="514" y="590">the threshold, like a failing pytest</text>
<text class="t" x="514" y="612">assertion</text>
<text class="comp" x="514" y="640">component: pytest runner</text>
<rect class="val" x="28" y="690" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="714">VALUE</text>
<text class="valT" x="48" y="738">A prompt or model change that makes answers worse fails the build instead of reaching users</text>
</svg>
