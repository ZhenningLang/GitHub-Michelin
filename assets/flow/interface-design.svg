<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1065" viewBox="0 0 880 1065" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1065" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="907" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="907" rx="10"/>
<rect class="pillT" x="474" y="40" width="221.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Interface Design does</text>
<path class="edge" d="M62,269 L62,293" marker-end="url(#a)"/>
<path class="hand" d="M408,340.0 C439.0,340.0 439.0,364 470,364" marker-end="url(#a)"/>
<path class="edge" d="M494,454 L494,478" marker-end="url(#a)"/>
<path class="edge" d="M494,639 L494,663" marker-end="url(#a)"/>
<path class="hand" d="M472,721.0 C441.0,721.0 441.0,745 410,745" marker-end="url(#a)"/>
<path class="hand" d="M408,777.0 C439.0,777.0 439.0,827 470,827" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="197" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="197" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">First session</text>
<text class="t" x="82" y="118">Install the skill folder into your</text>
<text class="t" x="82" y="140">agent — via the skills CLI or a manual</text>
<text class="t" x="82" y="162">copy</text>
<text class="c" x="82" y="186">git clone</text>
<text class="c" x="82" y="205">https://github.com/Dammyjay93/interface-de</text>
<text class="c" x="82" y="224">sign.git</text>
<text class="comp" x="82" y="247">component: interface-design skill folder</text>
<rect class="card" x="40" y="295" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="295" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="319" r="10"/>
<text class="num" x="62" y="323" text-anchor="middle">2</text>
<text class="ph" x="82" y="324">First session</text>
<text class="t" x="82" y="341">Ask the agent to build product UI</text>
<text class="c" x="82" y="365">Build a user dashboard with metrics cards</text>
<rect class="cardT" x="472" y="340" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="340" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="364" r="10"/>
<text class="num" x="494" y="368" text-anchor="middle">3</text>
<text class="ph" x="514" y="369">First session</text>
<text class="t" x="514" y="386">Explores the product domain, proposes</text>
<text class="t" x="514" y="408">a direction, asks if it fits</text>
<text class="comp" x="514" y="436">component: Suggest + Ask protocol</text>
<rect class="cardT" x="472" y="480" width="368" height="159" rx="8"/>
<rect class="accT" x="472" y="480" width="4" height="159" rx="2"/>
<circle class="accT" cx="494" cy="504" r="10"/>
<text class="num" x="494" y="508" text-anchor="middle">4</text>
<text class="ph" x="514" y="509">First session</text>
<text class="t" x="514" y="526">Restates intent, hierarchy, palette,</text>
<text class="t" x="514" y="548">depth, surfaces, type and spacing</text>
<text class="t" x="514" y="570">before each component — and why</text>
<text class="c" x="514" y="594">Depth: borders-only</text>
<text class="comp" x="514" y="617">component: mandatory pre-build checkpoint</text>
<rect class="cardT" x="472" y="665" width="368" height="112" rx="8"/>
<rect class="accT" x="472" y="665" width="4" height="112" rx="2"/>
<circle class="accT" cx="494" cy="689" r="10"/>
<text class="num" x="494" y="693" text-anchor="middle">5</text>
<text class="ph" x="514" y="694">First session</text>
<text class="t" x="514" y="711">Offers to save the session&#x27;s decisions</text>
<text class="t" x="514" y="733">to the project system file</text>
<text class="c" x="514" y="757">.interface-design/system.md</text>
<rect class="card" x="40" y="721" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="721" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="745" r="10"/>
<text class="num" x="62" y="749" text-anchor="middle">6</text>
<text class="ph" x="82" y="750">Every later session</text>
<text class="t" x="82" y="767">Start a new session and ask for the</text>
<text class="t" x="82" y="789">next page</text>
<text class="c" x="82" y="813">Add a settings page</text>
<rect class="cardT" x="472" y="803" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="803" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="827" r="10"/>
<text class="num" x="494" y="831" text-anchor="middle">7</text>
<text class="ph" x="514" y="832">Every later session</text>
<text class="t" x="514" y="849">Loads system.md and builds the page on</text>
<text class="t" x="514" y="871">the same tokens and patterns</text>
<text class="comp" x="514" y="899">component: cross-session design memory</text>
<rect class="val" x="28" y="949" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="973">VALUE</text>
<text class="valT" x="48" y="997">You decide the design once — every later session reuses the same tokens, density and</text>
<text class="valT" x="48" y="1019">component patterns</text>
</svg>
