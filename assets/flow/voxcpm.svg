<svg xmlns="http://www.w3.org/2000/svg" width="880" height="831" viewBox="0 0 880 831" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="831" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="673" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="673" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">VoxCPM does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,242.0 C439.0,242.0 439.0,266 470,266" marker-end="url(#a)"/>
<path class="hand" d="M472,301.5 C441.0,301.5 441.0,341 410,341" marker-end="url(#a)"/>
<path class="hand" d="M408,364.5 C439.0,364.5 439.0,411 470,411" marker-end="url(#a)"/>
<path class="edge" d="M494,506 L494,530" marker-end="url(#a)"/>
<path class="hand" d="M472,591.5 C441.0,591.5 441.0,615 410,615" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the Python package on a CUDA</text>
<text class="t" x="82" y="123">machine (Python 3.10+, PyTorch 2.5+)</text>
<text class="c" x="82" y="147">pip install voxcpm</text>
<rect class="card" x="40" y="193" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Load the model by its Hugging Face id</text>
<text class="c" x="82" y="246">&quot;openbmb/VoxCPM2&quot;</text>
<text class="comp" x="82" y="269">component: VoxCPM Python API</text>
<rect class="cardT" x="472" y="242" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="242" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="266" r="10"/>
<text class="num" x="494" y="270" text-anchor="middle">3</text>
<text class="t" x="514" y="271">Downloads the 2B weights, rebuilds the</text>
<text class="t" x="514" y="293">network from config.json and warms it</text>
<text class="t" x="514" y="315">up with torch.compile</text>
<text class="comp" x="514" y="343">component: core.py loader</text>
<rect class="card" x="40" y="317" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="317" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="341" r="10"/>
<text class="num" x="62" y="345" text-anchor="middle">4</text>
<text class="t" x="82" y="346">Call generate with the text and a</text>
<text class="t" x="82" y="368">short clip of the voice to copy</text>
<text class="c" x="82" y="392">reference_wav_path=&quot;path/to/voice.wav&quot;</text>
<rect class="cardT" x="472" y="387" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="387" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="411" r="10"/>
<text class="num" x="494" y="415" text-anchor="middle">5</text>
<text class="t" x="514" y="416">A language model plans the speech as</text>
<text class="t" x="514" y="438">continuous latents; a small diffusion</text>
<text class="t" x="514" y="460">head paints in the acoustic detail</text>
<text class="comp" x="514" y="488">component: TSLM/RALM + LocDiT</text>
<rect class="cardT" x="472" y="532" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="532" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="556" r="10"/>
<text class="num" x="494" y="560" text-anchor="middle">6</text>
<text class="t" x="514" y="561">Decodes the latents into a 48kHz</text>
<text class="t" x="514" y="583">waveform and returns it as a NumPy</text>
<text class="t" x="514" y="605">array</text>
<text class="comp" x="514" y="633">component: AudioVAE V2</text>
<rect class="card" x="40" y="591" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="591" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="615" r="10"/>
<text class="num" x="62" y="619" text-anchor="middle">7</text>
<text class="t" x="82" y="620">Write the array to a WAV file</text>
<text class="c" x="82" y="644">sf.write(&quot;clone.wav&quot;, wav,</text>
<text class="c" x="82" y="663">model.tts_model.sample_rate)</text>
<rect class="val" x="28" y="715" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="739">VALUE</text>
<text class="valT" x="48" y="763">A cloned or designed voice in 30 languages at 48kHz from Apache-2.0 weights on your own GPU —</text>
<text class="valT" x="48" y="785">no per-character API bill and no non-commercial weight license</text>
</svg>
