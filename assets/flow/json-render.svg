<svg xmlns="http://www.w3.org/2000/svg" width="880" height="691" viewBox="0 0 880 691" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="691" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="555" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="555" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">json-render does</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,237.5 C439.0,237.5 439.0,261 470,261" marker-end="url(#a)"/>
<path class="hand" d="M472,306.5 C441.0,306.5 441.0,335 410,335" marker-end="url(#a)"/>
<path class="hand" d="M408,347.0 C439.0,347.0 439.0,426 470,426" marker-end="url(#a)"/>
<path class="hand" d="M472,451.0 C441.0,451.0 441.0,475 410,475" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install core plus a renderer</text>
<text class="c" x="82" y="125">npm install @json-render/core</text>
<text class="c" x="82" y="144">@json-render/react</text>
<rect class="card" x="40" y="190" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">Declare allowed components and their</text>
<text class="t" x="82" y="241">props</text>
<text class="c" x="82" y="265">defineCatalog</text>
<rect class="cardT" x="472" y="237" width="368" height="139" rx="8"/>
<rect class="accT" x="472" y="237" width="4" height="139" rx="2"/>
<circle class="accT" cx="494" cy="261" r="10"/>
<text class="num" x="494" y="265" text-anchor="middle">3</text>
<text class="t" x="514" y="266">Turns the catalog into a system prompt</text>
<text class="t" x="514" y="288">and a JSON Schema</text>
<text class="c" x="514" y="312">catalog.prompt() · catalog.jsonSchema({</text>
<text class="c" x="514" y="331">strict: true })</text>
<text class="comp" x="514" y="354">component: catalog</text>
<rect class="card" x="40" y="311" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">4</text>
<text class="t" x="82" y="340">Send that to your model and stream the</text>
<text class="t" x="82" y="362">JSON</text>
<rect class="cardT" x="472" y="402" width="368" height="98" rx="8"/>
<rect class="accT" x="472" y="402" width="4" height="98" rx="2"/>
<circle class="accT" cx="494" cy="426" r="10"/>
<text class="num" x="494" y="430" text-anchor="middle">5</text>
<text class="t" x="514" y="431">Compiles the stream into a spec tree</text>
<text class="c" x="514" y="455">createSpecStreamCompiler</text>
<text class="comp" x="514" y="478">component: SpecStream</text>
<rect class="card" x="40" y="451" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="451" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="475" r="10"/>
<text class="num" x="62" y="479" text-anchor="middle">6</text>
<text class="t" x="82" y="480">Render it with your registered</text>
<text class="t" x="82" y="502">components</text>
<text class="c" x="82" y="526">&lt;Renderer spec={spec} registry={registry}</text>
<text class="c" x="82" y="545">/&gt;</text>
<rect class="val" x="28" y="597" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="621">VALUE</text>
<text class="valT" x="48" y="645">The model can only assemble UIs from your catalog; unknown types never become DOM</text>
</svg>
