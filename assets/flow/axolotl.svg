<svg xmlns="http://www.w3.org/2000/svg" width="880" height="972" viewBox="0 0 880 972" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="972" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="814" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="814" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Axolotl does</text>
<path class="edge" d="M62,227 L62,251" marker-end="url(#a)"/>
<path class="edge" d="M62,373 L62,397" marker-end="url(#a)"/>
<path class="hand" d="M408,435.5 C439.0,435.5 439.0,459 470,459" marker-end="url(#a)"/>
<path class="edge" d="M494,507 L494,531" marker-end="url(#a)"/>
<path class="edge" d="M494,605 L494,629" marker-end="url(#a)"/>
<path class="edge" d="M494,703 L494,727" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="155" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="155" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install Axolotl into a fresh uv</text>
<text class="t" x="82" y="123">environment and fetch the example</text>
<text class="t" x="82" y="145">configs</text>
<text class="c" x="82" y="169">uv pip install --no-build-isolation</text>
<text class="c" x="82" y="188">axolotl[deepspeed] · axolotl fetch</text>
<text class="c" x="82" y="207">examples</text>
<rect class="card" x="40" y="253" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="253" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="277" r="10"/>
<text class="num" x="62" y="281" text-anchor="middle">2</text>
<text class="t" x="82" y="282">Edit one YAML: base model, dataset and</text>
<text class="t" x="82" y="304">its format, LoRA or full tuning</text>
<text class="c" x="82" y="328">base_model · datasets · adapter: lora</text>
<text class="comp" x="82" y="351">component: config file</text>
<rect class="card" x="40" y="399" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="399" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="423" r="10"/>
<text class="num" x="62" y="427" text-anchor="middle">3</text>
<text class="t" x="82" y="428">Start the run</text>
<text class="c" x="82" y="452">axolotl train examples/llama-3/lora-1b.yml</text>
<rect class="cardT" x="472" y="435" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="435" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="459" r="10"/>
<text class="num" x="494" y="463" text-anchor="middle">4</text>
<text class="t" x="514" y="464">Downloads the base model and attaches</text>
<text class="t" x="514" y="486">LoRA/QLoRA adapter layers</text>
<rect class="cardT" x="472" y="533" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="533" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="557" r="10"/>
<text class="num" x="494" y="561" text-anchor="middle">5</text>
<text class="t" x="514" y="562">Formats and tokenizes the dataset,</text>
<text class="t" x="514" y="584">packing short samples together</text>
<rect class="cardT" x="472" y="631" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="631" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="655" r="10"/>
<text class="num" x="494" y="659" text-anchor="middle">6</text>
<text class="t" x="514" y="660">Runs the training loop with the</text>
<text class="t" x="514" y="682">configured FSDP2/DeepSpeed parallelism</text>
<rect class="cardT" x="472" y="729" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="729" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="753" r="10"/>
<text class="num" x="494" y="757" text-anchor="middle">7</text>
<text class="t" x="514" y="758">Saves the adapter or full weights to</text>
<text class="t" x="514" y="780">the output directory</text>
<text class="c" x="514" y="804">output_dir: ./outputs/lora-out</text>
<rect class="val" x="28" y="856" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="880">VALUE</text>
<text class="valT" x="48" y="904">A fine-tune is one reviewable YAML file instead of a fragile training script per model and</text>
<text class="valT" x="48" y="926">cluster</text>
</svg>
