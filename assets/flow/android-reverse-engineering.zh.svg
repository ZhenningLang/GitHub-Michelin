<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1072" viewBox="0 0 880 1072" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1072" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="936" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="936" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">skill 做的</text>
<path class="edge" d="M62,183 L62,207" marker-end="url(#a)"/>
<path class="edge" d="M62,320 L62,344" marker-end="url(#a)"/>
<path class="hand" d="M408,382.5 C439.0,382.5 439.0,406 470,406" marker-end="url(#a)"/>
<path class="edge" d="M494,479 L494,503" marker-end="url(#a)"/>
<path class="edge" d="M494,602 L494,626" marker-end="url(#a)"/>
<path class="edge" d="M494,725 L494,749" marker-end="url(#a)"/>
<path class="hand" d="M472,799.5 C441.0,799.5 441.0,823 410,823" marker-end="url(#a)"/>
<path class="hand" d="M408,835.0 C439.0,835.0 439.0,898 470,898" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 Claude Code 里添加插件市场</text>
<text class="c" x="82" y="125">/plugin marketplace add</text>
<text class="c" x="82" y="144">SimoneAvogadro/android-reverse-engineering</text>
<text class="c" x="82" y="163">-skill</text>
<rect class="card" x="40" y="209" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="209" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="233" r="10"/>
<text class="num" x="62" y="237" text-anchor="middle">2</text>
<text class="t" x="82" y="238">安装插件</text>
<text class="c" x="82" y="262">/plugin install</text>
<text class="c" x="82" y="281">android-reverse-engineering@android-revers</text>
<text class="c" x="82" y="300">e-engineering-skill</text>
<rect class="card" x="40" y="346" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="346" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="370" r="10"/>
<text class="num" x="62" y="374" text-anchor="middle">3</text>
<text class="t" x="82" y="375">把目标文件交给它</text>
<text class="c" x="82" y="399">/decompile path/to/app.apk</text>
<rect class="cardT" x="472" y="382" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="382" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="406" r="10"/>
<text class="num" x="494" y="410" text-anchor="middle">4</text>
<text class="t" x="514" y="411">先做指纹分诊：框架、HTTP 栈、混淆度；不是</text>
<text class="t" x="514" y="433">Java/Kotlin 就叫停</text>
<text class="comp" x="514" y="461">组件：fingerprint.sh</text>
<rect class="cardT" x="472" y="505" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="505" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="529" r="10"/>
<text class="num" x="494" y="533" text-anchor="middle">5</text>
<text class="t" x="514" y="534">用 jadx 反编译，可选 Fernflower，或两者并</text>
<text class="t" x="514" y="556">排对照</text>
<text class="comp" x="514" y="584">组件：decompile.sh</text>
<rect class="cardT" x="472" y="628" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="628" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="652" r="10"/>
<text class="num" x="494" y="656" text-anchor="middle">6</text>
<text class="t" x="514" y="657">从元数据重建真实类名（a.b.c →</text>
<text class="t" x="514" y="679">LoginRepository）</text>
<text class="comp" x="514" y="707">组件：recover-kotlin-names.sh</text>
<rect class="cardT" x="472" y="751" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="751" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="775" r="10"/>
<text class="num" x="494" y="779" text-anchor="middle">7</text>
<text class="t" x="514" y="780">扫源码里的端点、URL</text>
<text class="t" x="514" y="802">与鉴权头（Retrofit/Ktor/Apollo 等）</text>
<text class="comp" x="514" y="830">组件：find-api-calls.sh</text>
<rect class="card" x="40" y="799" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="799" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="823" r="10"/>
<text class="num" x="62" y="827" text-anchor="middle">8</text>
<text class="t" x="82" y="828">挑一个界面追问调用链：从 LoginActivity 到</text>
<text class="t" x="82" y="850">它的 API 调用</text>
<rect class="cardT" x="472" y="874" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="874" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="898" r="10"/>
<text class="num" x="494" y="902" text-anchor="middle">9</text>
<text class="t" x="514" y="903">交付架构摘要与两层端点文档：全量平表</text>
<text class="t" x="514" y="925">加重点深挖</text>
<rect class="val" x="28" y="978" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="1002">价值</text>
<text class="valT" x="48" y="1026">没有源码也拿到整份 API 契约：主机、路径、鉴权</text>
</svg>
