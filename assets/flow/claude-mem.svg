<svg xmlns="http://www.w3.org/2000/svg" width="880" height="669" viewBox="0 0 880 669" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="669" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="533" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="533" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">claude-mem does</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,155.0 C441.0,155.0 441.0,217 410,217" marker-end="url(#a)"/>
<path class="hand" d="M408,218.0 C439.0,218.0 439.0,253 470,253" marker-end="url(#a)"/>
<path class="edge" d="M494,301 L494,325" marker-end="url(#a)"/>
<path class="hand" d="M472,374.5 C441.0,374.5 441.0,398 410,398" marker-end="url(#a)"/>
<path class="hand" d="M408,410.0 C439.0,410.0 439.0,472 470,472" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install with one command and pick the</text>
<text class="t" x="82" y="123">model that compresses memories</text>
<text class="c" x="82" y="147">npx claude-mem install</text>
<rect class="cardT" x="472" y="119" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">Registers lifecycle hooks and starts a</text>
<text class="t" x="514" y="170">local worker service</text>
<rect class="card" x="40" y="193" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">Work in Claude Code as usual</text>
<rect class="cardT" x="472" y="229" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="229" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="253" r="10"/>
<text class="num" x="494" y="257" text-anchor="middle">4</text>
<text class="t" x="514" y="258">Hooks capture your prompts and every</text>
<text class="t" x="514" y="280">tool call in the session</text>
<rect class="cardT" x="472" y="327" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="327" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="351" r="10"/>
<text class="num" x="494" y="355" text-anchor="middle">5</text>
<text class="t" x="514" y="356">An LLM compresses them into short</text>
<text class="t" x="514" y="378">observations stored locally</text>
<text class="c" x="514" y="402">SQLite + Chroma vector index</text>
<rect class="card" x="40" y="374" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="374" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="398" r="10"/>
<text class="num" x="62" y="402" text-anchor="middle">6</text>
<text class="t" x="82" y="403">Open a new session, or ask about</text>
<text class="t" x="82" y="425">earlier work</text>
<rect class="cardT" x="472" y="448" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="448" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="472" r="10"/>
<text class="num" x="494" y="476" text-anchor="middle">7</text>
<text class="t" x="514" y="477">Injects relevant summaries; for</text>
<text class="t" x="514" y="499">details, a 3-step search</text>
<text class="c" x="514" y="523">search → timeline → get_observations</text>
<rect class="val" x="28" y="575" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="599">VALUE</text>
<text class="valT" x="48" y="623">Project context survives across sessions — no re-explaining every time</text>
</svg>
