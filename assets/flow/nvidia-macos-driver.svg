<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1014" viewBox="0 0 880 1014" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1014" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="856" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="856" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The driver does</text>
<path class="edge" d="M62,166 L62,190" marker-end="url(#a)"/>
<path class="edge" d="M62,372 L62,396" marker-end="url(#a)"/>
<path class="hand" d="M408,458.0 C439.0,458.0 439.0,482 470,482" marker-end="url(#a)"/>
<path class="hand" d="M472,505.0 C441.0,505.0 441.0,568 410,568" marker-end="url(#a)"/>
<path class="hand" d="M408,602.5 C439.0,602.5 439.0,626 470,626" marker-end="url(#a)"/>
<path class="edge" d="M494,721 L494,745" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Get macOS 15 booting through OpenCore</text>
<text class="t" x="82" y="123">on the PC first, with the NVIDIA card</text>
<text class="t" x="82" y="145">installed</text>
<rect class="card" x="40" y="192" width="368" height="180" rx="8"/>
<rect class="accY" x="40" y="192" width="4" height="180" rx="2"/>
<circle class="accY" cx="62" cy="216" r="10"/>
<text class="num" x="62" y="220" text-anchor="middle">2</text>
<text class="t" x="82" y="221">Add the driver&#x27;s boot-args, SIP value</text>
<text class="t" x="82" y="243">and BAR quirks to OpenCore</text>
<text class="t" x="82" y="265">config.plist</text>
<text class="c" x="82" y="289">nvfb=1 nvaccel=1 nvfbheads=4</text>
<text class="c" x="82" y="308">-nvkmsnosmooth amfi_get_out_of_my_way=0x1</text>
<text class="c" x="82" y="327">amfi=0x80</text>
<text class="comp" x="82" y="350">component: OpenCore config.plist</text>
<rect class="card" x="40" y="398" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="398" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="422" r="10"/>
<text class="num" x="62" y="426" text-anchor="middle">3</text>
<text class="t" x="82" y="427">Unpack the release package, check its</text>
<text class="t" x="82" y="449">hashes, run the installer as root</text>
<text class="c" x="82" y="473">sudo ./install.sh</text>
<text class="comp" x="82" y="496">component: package/install.sh</text>
<rect class="cardT" x="472" y="458" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="458" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="482" r="10"/>
<text class="num" x="494" y="486" text-anchor="middle">4</text>
<text class="t" x="514" y="487">Copies four kexts and the Metal</text>
<text class="t" x="514" y="509">bundles into place, rebuilds the</text>
<text class="t" x="514" y="531">Auxiliary Kernel Collection</text>
<rect class="card" x="40" y="544" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="544" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="568" r="10"/>
<text class="num" x="62" y="572" text-anchor="middle">5</text>
<text class="t" x="82" y="573">Reboot; approve the extensions in</text>
<text class="t" x="82" y="595">Privacy &amp; Security when asked, then</text>
<text class="t" x="82" y="617">reboot again</text>
<text class="c" x="82" y="641">sudo shutdown -r now</text>
<rect class="cardT" x="472" y="602" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="602" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="626" r="10"/>
<text class="num" x="494" y="630" text-anchor="middle">6</text>
<text class="t" x="514" y="631">At boot, NVRM loads NVIDIA&#x27;s GSP</text>
<text class="t" x="514" y="653">firmware and brings the GPU up; NVRMFB</text>
<text class="t" x="514" y="675">lights the displays</text>
<text class="comp" x="514" y="703">component: NVRM.kext · NVRMFB.kext</text>
<rect class="cardT" x="472" y="747" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="747" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="771" r="10"/>
<text class="num" x="494" y="775" text-anchor="middle">7</text>
<text class="t" x="514" y="776">Metal calls go through the plugin:</text>
<text class="t" x="514" y="798">shaders are translated to SPIR-V and</text>
<text class="t" x="514" y="820">run by NVK on the card</text>
<text class="comp" x="514" y="848">component: NVMTLDriver.bundle</text>
<rect class="val" x="28" y="898" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="922">VALUE</text>
<text class="valT" x="48" y="946">The desktop and Metal apps run on a GeForce RTX card that macOS has had no driver for since</text>
<text class="valT" x="48" y="968">High Sierra</text>
</svg>
