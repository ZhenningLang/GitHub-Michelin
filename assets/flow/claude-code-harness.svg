<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1063" viewBox="0 0 880 1063" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1063" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="905" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="905" rx="10"/>
<rect class="pillT" x="474" y="40" width="248.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">claude-code-harness does</text>
<path class="edge" d="M62,230 L62,254" marker-end="url(#a)"/>
<path class="hand" d="M408,316.0 C439.0,316.0 439.0,340 470,340" marker-end="url(#a)"/>
<path class="hand" d="M472,375.5 C441.0,375.5 441.0,426 410,426" marker-end="url(#a)"/>
<path class="hand" d="M408,471.5 C439.0,471.5 439.0,495 470,495" marker-end="url(#a)"/>
<path class="hand" d="M472,530.5 C441.0,530.5 441.0,591 410,591" marker-end="url(#a)"/>
<path class="hand" d="M408,627.0 C439.0,627.0 439.0,651 470,651" marker-end="url(#a)"/>
<path class="edge" d="M494,769 L494,793" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="158" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="158" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it from the Claude Code plugin</text>
<text class="t" x="82" y="123">marketplace</text>
<text class="c" x="82" y="147">/plugin install</text>
<text class="c" x="82" y="166">claude-code-harness@claude-code-harness-ma</text>
<text class="c" x="82" y="185">rketplace</text>
<text class="comp" x="82" y="208">component: plugin marketplace</text>
<rect class="card" x="40" y="256" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="256" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="280" r="10"/>
<text class="num" x="62" y="284" text-anchor="middle">2</text>
<text class="t" x="82" y="285">Run setup once to activate the verbs,</text>
<text class="t" x="82" y="307">hooks, and guardrails</text>
<text class="c" x="82" y="331">/harness-setup</text>
<text class="comp" x="82" y="354">component: setup skill</text>
<rect class="cardT" x="472" y="316" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="316" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="340" r="10"/>
<text class="num" x="494" y="344" text-anchor="middle">3</text>
<text class="t" x="514" y="345">Wires a Go engine into the PreToolUse</text>
<text class="t" x="514" y="367">hook — each file write and command is</text>
<text class="t" x="514" y="389">inspected before it runs</text>
<text class="comp" x="514" y="417">component: PreToolUse hook → bin/harness</text>
<rect class="card" x="40" y="402" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="402" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="426" r="10"/>
<text class="num" x="62" y="430" text-anchor="middle">4</text>
<text class="t" x="82" y="431">Hand it your intent plus the</text>
<text class="t" x="82" y="453">completion criterion</text>
<text class="c" x="82" y="477">/harness-plan Improve the README</text>
<text class="c" x="82" y="496">onboarding flow</text>
<text class="comp" x="82" y="519">component: harness-plan skill</text>
<rect class="cardT" x="472" y="471" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="471" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="495" r="10"/>
<text class="num" x="494" y="499" text-anchor="middle">5</text>
<text class="t" x="514" y="500">Inspects the code and writes spec.md +</text>
<text class="t" x="514" y="522">Plans.md: scope, acceptance criteria,</text>
<text class="t" x="514" y="544">unknowns, stop conditions</text>
<text class="comp" x="514" y="572">component: main agent</text>
<rect class="card" x="40" y="567" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="567" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="591" r="10"/>
<text class="num" x="62" y="595" text-anchor="middle">6</text>
<text class="t" x="82" y="596">Approve or correct the contract, then</text>
<text class="t" x="82" y="618">start the plan</text>
<text class="c" x="82" y="642">/harness-work all</text>
<text class="comp" x="82" y="665">component: approval + harness-work</text>
<rect class="cardT" x="472" y="627" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="627" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="651" r="10"/>
<text class="num" x="494" y="655" text-anchor="middle">7</text>
<text class="t" x="514" y="656">Implements under the plan, runs</text>
<text class="t" x="514" y="678">required checks, and sends review</text>
<text class="t" x="514" y="700">findings back to the worker</text>
<text class="c" x="514" y="724">/harness-review</text>
<text class="comp" x="514" y="747">component: worker + guardrail engine</text>
<rect class="cardT" x="472" y="795" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="795" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="819" r="10"/>
<text class="num" x="494" y="823" text-anchor="middle">8</text>
<text class="t" x="514" y="824">Packages only verified evidence into</text>
<text class="t" x="514" y="846">CHANGELOG, tag, and release</text>
<text class="c" x="514" y="870">/harness-release</text>
<text class="comp" x="514" y="893">component: release skill</text>
<rect class="val" x="28" y="947" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="971">VALUE</text>
<text class="valT" x="48" y="995">You approve two contracts; the agent can no longer grade its own homework, and risky commands</text>
<text class="valT" x="48" y="1017">are inspected before they run</text>
</svg>
