<svg xmlns="http://www.w3.org/2000/svg" width="880" height="715" viewBox="0 0 880 715" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="715" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="557" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="557" rx="10"/>
<rect class="pillT" x="474" y="40" width="211.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agent Framework does</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,285 L62,309" marker-end="url(#a)"/>
<path class="hand" d="M408,347.5 C439.0,347.5 439.0,371 470,371" marker-end="url(#a)"/>
<path class="edge" d="M494,444 L494,468" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install and set provider credentials</text>
<text class="c" x="82" y="125">pip install agent-framework</text>
<rect class="card" x="40" y="171" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">Create an agent with a chat client,</text>
<text class="t" x="82" y="222">instructions, and plain-function tools</text>
<text class="c" x="82" y="246">Agent(client=OpenAIChatClient(),</text>
<text class="c" x="82" y="265">instructions=…, tools=[…])</text>
<rect class="card" x="40" y="311" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">3</text>
<text class="t" x="82" y="340">Hand it a task</text>
<text class="c" x="82" y="364">await agent.run(&quot;…&quot;)</text>
<rect class="cardT" x="472" y="347" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="347" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="371" r="10"/>
<text class="num" x="494" y="375" text-anchor="middle">4</text>
<text class="t" x="514" y="376">Calls the model, runs your tools, and</text>
<text class="t" x="514" y="398">loops until it can answer</text>
<text class="comp" x="514" y="426">component: agent loop</text>
<rect class="cardT" x="472" y="470" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="470" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="494" r="10"/>
<text class="num" x="494" y="498" text-anchor="middle">5</text>
<text class="t" x="514" y="499">Returns one response object with final</text>
<text class="t" x="514" y="521">text, messages, and tool-call records</text>
<text class="comp" x="514" y="549">component: AgentResponse</text>
<rect class="val" x="28" y="599" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="623">VALUE</text>
<text class="valT" x="48" y="647">The tool-calling loop is not yours to write; sessions, middleware, and graph workflows bolt</text>
<text class="valT" x="48" y="669">onto the same Agent later</text>
</svg>
