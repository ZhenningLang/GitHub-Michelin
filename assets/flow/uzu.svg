<svg xmlns="http://www.w3.org/2000/svg" width="880" height="845" viewBox="0 0 880 845" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="845" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="687" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="687" rx="10"/>
<rect class="pillT" x="474" y="40" width="101.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">uzu does</text>
<path class="edge" d="M62,230 L62,254" marker-end="url(#a)"/>
<path class="hand" d="M408,313.0 C439.0,313.0 439.0,337 470,337" marker-end="url(#a)"/>
<path class="hand" d="M472,372.5 C441.0,372.5 441.0,420 410,420" marker-end="url(#a)"/>
<path class="hand" d="M408,443.5 C439.0,443.5 439.0,482 470,482" marker-end="url(#a)"/>
<path class="hand" d="M472,505.0 C441.0,505.0 441.0,541 410,541" marker-end="url(#a)"/>
<path class="hand" d="M408,574.0 C439.0,574.0 439.0,602 470,602" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="158" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="158" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add the Swift package to your</text>
<text class="t" x="82" y="123">iOS/macOS app (iOS/macOS 26.4+)</text>
<text class="c" x="82" y="147">.package(url:</text>
<text class="c" x="82" y="166">&quot;https://github.com/trymirai/uzu.git&quot;,</text>
<text class="c" x="82" y="185">from: &quot;0.6.2&quot;)</text>
<text class="comp" x="82" y="208">component: prebuilt uzu binary</text>
<rect class="card" x="40" y="256" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="256" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="280" r="10"/>
<text class="num" x="62" y="284" text-anchor="middle">2</text>
<text class="t" x="82" y="285">Create an engine and ask for a model</text>
<text class="t" x="82" y="307">by its catalog id</text>
<text class="c" x="82" y="331">engine.model(identifier:</text>
<text class="c" x="82" y="350">&quot;alibaba:qwen3.5:0.8b:mirai:mirai-m:4&quot;)</text>
<rect class="cardT" x="472" y="313" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="313" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="337" r="10"/>
<text class="num" x="494" y="341" text-anchor="middle">3</text>
<text class="t" x="514" y="342">Looks the id up in Mirai&#x27;s hosted</text>
<text class="t" x="514" y="364">registry, filtered to builds that fit</text>
<text class="t" x="514" y="386">this device</text>
<text class="comp" x="514" y="414">component: Mirai registry client</text>
<rect class="card" x="40" y="396" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="396" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="420" r="10"/>
<text class="num" x="62" y="424" text-anchor="middle">4</text>
<text class="t" x="82" y="425">Start the download and show its</text>
<text class="t" x="82" y="447">progress</text>
<text class="c" x="82" y="471">engine.download(model: model)</text>
<rect class="cardT" x="472" y="458" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="458" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="482" r="10"/>
<text class="num" x="494" y="486" text-anchor="middle">5</text>
<text class="t" x="514" y="487">Fetches the pre-converted weights from</text>
<text class="t" x="514" y="509">Hugging Face and caches them on the</text>
<text class="t" x="514" y="531">device</text>
<rect class="card" x="40" y="517" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="517" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="541" r="10"/>
<text class="num" x="62" y="545" text-anchor="middle">6</text>
<text class="t" x="82" y="546">Open a chat session and send the</text>
<text class="t" x="82" y="568">messages</text>
<text class="c" x="82" y="592">session.reply(input: messages, config:</text>
<text class="c" x="82" y="611">.create())</text>
<rect class="cardT" x="472" y="578" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="578" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="602" r="10"/>
<text class="num" x="494" y="606" text-anchor="middle">7</text>
<text class="t" x="514" y="607">Runs the model on the Apple GPU with</text>
<text class="t" x="514" y="629">its Metal kernels and returns</text>
<text class="t" x="514" y="651">reasoning and text</text>
<text class="comp" x="514" y="679">component: Metal backend</text>
<rect class="val" x="28" y="729" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="753">VALUE</text>
<text class="valT" x="48" y="777">A language model answers inside your app on the user&#x27;s device — no server to run, no</text>
<text class="valT" x="48" y="799">per-token bill</text>
</svg>
