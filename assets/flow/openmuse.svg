<svg xmlns="http://www.w3.org/2000/svg" width="880" height="901" viewBox="0 0 880 901" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="901" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="743" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="743" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenMuse does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,348 L62,372" marker-end="url(#a)"/>
<path class="hand" d="M408,410.5 C439.0,410.5 439.0,434 470,434" marker-end="url(#a)"/>
<path class="hand" d="M472,458.5 C441.0,458.5 441.0,497 410,497" marker-end="url(#a)"/>
<path class="hand" d="M408,509.5 C439.0,509.5 439.0,557 470,557" marker-end="url(#a)"/>
<path class="edge" d="M494,630 L494,654" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install from source and copy the</text>
<text class="t" x="82" y="123">config template</text>
<text class="c" x="82" y="147">pnpm install --frozen-lockfile · cp</text>
<text class="c" x="82" y="166">.env.example .env</text>
<rect class="card" x="40" y="212" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Create a CopilotKit Intelligence</text>
<text class="t" x="82" y="263">project and keep its server-only key</text>
<text class="t" x="82" y="285">in .env</text>
<text class="c" x="82" y="309">npx copilotkit@latest login · npx</text>
<text class="c" x="82" y="328">copilotkit@latest project select</text>
<rect class="card" x="40" y="374" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="374" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="398" r="10"/>
<text class="num" x="62" y="402" text-anchor="middle">3</text>
<text class="t" x="82" y="403">Start the API and the app</text>
<text class="c" x="82" y="427">pnpm dev · pnpm dev:web</text>
<rect class="cardT" x="472" y="410" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="410" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="434" r="10"/>
<text class="num" x="494" y="438" text-anchor="middle">4</text>
<text class="t" x="514" y="439">Serves chat plus a durable task engine</text>
<text class="t" x="514" y="461">over PGlite at localhost:8081</text>
<text class="comp" x="514" y="489">component: Hono API + task engine</text>
<rect class="card" x="40" y="473" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="473" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="497" r="10"/>
<text class="num" x="62" y="501" text-anchor="middle">5</text>
<text class="t" x="82" y="502">Delegate from the phone or web chat</text>
<text class="c" x="82" y="526">Check out Hacker News for cool stuff</text>
<rect class="cardT" x="472" y="533" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="533" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="557" r="10"/>
<text class="num" x="494" y="561" text-anchor="middle">6</text>
<text class="t" x="514" y="562">Drives a persistent Chromium and</text>
<text class="t" x="514" y="584">streams browser/PDF/plan cards inline</text>
<text class="comp" x="514" y="612">component: Playwright browser worker</text>
<rect class="cardT" x="472" y="656" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="656" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="680" r="10"/>
<text class="num" x="494" y="684" text-anchor="middle">7</text>
<text class="t" x="514" y="685">Pauses side effects for your review;</text>
<text class="t" x="514" y="707">Take control opens its live session</text>
<text class="comp" x="514" y="735">component: Review gate + receipts</text>
<rect class="val" x="28" y="785" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="809">VALUE</text>
<text class="valT" x="48" y="833">You walk away and the errand keeps running — every action reviewed, receipted, and resumable,</text>
<text class="valT" x="48" y="855">and you can take over its browser mid-task</text>
</svg>
