<svg xmlns="http://www.w3.org/2000/svg" width="880" height="897" viewBox="0 0 880 897" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="897" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="761" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="761" rx="10"/>
<rect class="pillT" x="474" y="40" width="206.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Follow Builders 做的</text>
<path class="edge" d="M62,230 L62,254" marker-end="url(#a)"/>
<path class="hand" d="M408,316.0 C439.0,316.0 439.0,340 470,340" marker-end="url(#a)"/>
<path class="hand" d="M472,364.5 C441.0,364.5 441.0,426 410,426" marker-end="url(#a)"/>
<path class="hand" d="M408,450.5 C439.0,450.5 439.0,474 470,474" marker-end="url(#a)"/>
<path class="edge" d="M494,547 L494,571" marker-end="url(#a)"/>
<path class="edge" d="M494,670 L494,694" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="158" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="158" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">克隆到 agent 的 skills 目录，装好脚本的</text>
<text class="t" x="82" y="123">npm 依赖</text>
<text class="c" x="82" y="147">cd</text>
<text class="c" x="82" y="166">~/.claude/skills/follow-builders/scripts</text>
<text class="c" x="82" y="185">&amp;&amp; npm install</text>
<text class="comp" x="82" y="208">组件：skill 目录</text>
<rect class="card" x="40" y="256" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="256" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="280" r="10"/>
<text class="num" x="62" y="284" text-anchor="middle">2</text>
<text class="t" x="82" y="285">调用 skill，回答引导问题：日报或周报、时</text>
<text class="t" x="82" y="307">区、语言、推送渠道</text>
<text class="c" x="82" y="331">/follow-builders</text>
<text class="comp" x="82" y="354">组件：SKILL.md 引导流程</text>
<rect class="cardT" x="472" y="316" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="316" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="340" r="10"/>
<text class="num" x="494" y="344" text-anchor="middle">3</text>
<text class="t" x="514" y="345">作者的 Action 每天抓 X 帖子、播客转录和博</text>
<text class="t" x="514" y="367">客，写成 feed</text>
<text class="comp" x="514" y="395">组件：generate-feed 工作流</text>
<rect class="card" x="40" y="402" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="402" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="426" r="10"/>
<text class="num" x="62" y="430" text-anchor="middle">4</text>
<text class="t" x="82" y="431">让 agent 出一期简报——或交给 OpenClaw 定时</text>
<text class="t" x="82" y="453">任务触发</text>
<text class="comp" x="82" y="481">组件：你的 agent</text>
<rect class="cardT" x="472" y="450" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="450" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="474" r="10"/>
<text class="num" x="494" y="478" text-anchor="middle">5</text>
<text class="t" x="514" y="479">拉取中央 feed 和最新 prompt，合成一份</text>
<text class="t" x="514" y="501">JSON，无需 key</text>
<text class="comp" x="514" y="529">组件：prepare-digest.js</text>
<rect class="cardT" x="472" y="573" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="573" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="597" r="10"/>
<text class="num" x="494" y="601" text-anchor="middle">6</text>
<text class="t" x="514" y="602">agent 按 prompt 改写成摘要，每条附原链</text>
<text class="t" x="514" y="624">接，中文、英文或双语</text>
<text class="comp" x="514" y="652">组件：prompts/</text>
<rect class="cardT" x="472" y="696" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="696" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="720" r="10"/>
<text class="num" x="494" y="724" text-anchor="middle">7</text>
<text class="t" x="514" y="725">推送到 Telegram 或邮箱，或直接在对话里输出</text>
<text class="comp" x="514" y="753">组件：deliver.js</text>
<rect class="val" x="28" y="803" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="827">价值</text>
<text class="valT" x="48" y="851">一份附原链接的 AI 建造者动态简报——不用再自己刷 X 和听播客</text>
</svg>
