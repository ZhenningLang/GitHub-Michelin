<svg xmlns="http://www.w3.org/2000/svg" width="880" height="698" viewBox="0 0 880 698" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="698" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="562" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="562" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Heretic does</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,207.5 C439.0,207.5 439.0,231 470,231" marker-end="url(#a)"/>
<path class="edge" d="M494,326 L494,350" marker-end="url(#a)"/>
<path class="hand" d="M472,400.5 C441.0,400.5 441.0,424 410,424" marker-end="url(#a)"/>
<path class="hand" d="M408,425.0 C439.0,425.0 439.0,499 470,499" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the package</text>
<text class="c" x="82" y="125">pip install -U heretic-llm</text>
<rect class="card" x="40" y="171" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">Point it at the model to decensor</text>
<text class="c" x="82" y="224">heretic Qwen/Qwen3-4B-Instruct-2507</text>
<rect class="cardT" x="472" y="207" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="207" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="231" r="10"/>
<text class="num" x="494" y="235" text-anchor="middle">3</text>
<text class="t" x="514" y="236">Loads the weights and derives a</text>
<text class="t" x="514" y="258">per-layer refusal direction from</text>
<text class="t" x="514" y="280">good/bad prompts</text>
<text class="comp" x="514" y="308">component: Analyzer</text>
<rect class="cardT" x="472" y="352" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="352" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="376" r="10"/>
<text class="num" x="494" y="380" text-anchor="middle">4</text>
<text class="t" x="514" y="381">Runs ~200 abliteration trials, scoring</text>
<text class="t" x="514" y="403">refusals and KL divergence</text>
<text class="comp" x="514" y="431">component: Optuna TPE study</text>
<rect class="card" x="40" y="400" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="400" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="424" r="10"/>
<text class="num" x="62" y="428" text-anchor="middle">5</text>
<text class="t" x="82" y="429">Pick a point on the Pareto front</text>
<rect class="cardT" x="472" y="475" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="475" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="499" r="10"/>
<text class="num" x="494" y="503" text-anchor="middle">6</text>
<text class="t" x="514" y="504">Exports the merged model or a LoRA</text>
<text class="t" x="514" y="526">adapter</text>
<text class="comp" x="514" y="554">component: Model</text>
<rect class="val" x="28" y="604" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="628">VALUE</text>
<text class="valT" x="48" y="652">A locally runnable decensored checkpoint — no training data, no abliteration script</text>
</svg>
