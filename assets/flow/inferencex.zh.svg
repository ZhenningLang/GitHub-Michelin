<svg xmlns="http://www.w3.org/2000/svg" width="880" height="844" viewBox="0 0 880 844" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="844" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="708" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="708" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">InferenceX 做的</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="edge" d="M62,335 L62,359" marker-end="url(#a)"/>
<path class="hand" d="M408,397.5 C439.0,397.5 439.0,421 470,421" marker-end="url(#a)"/>
<path class="edge" d="M494,494 L494,518" marker-end="url(#a)"/>
<path class="edge" d="M494,617 L494,641" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">加一条配方：模型、固定版本的引擎镜像、框</text>
<text class="t" x="82" y="123">架、GPU 集群、扫描范围</text>
<text class="c" x="82" y="147">configs/nvidia-master.yaml ·</text>
<text class="c" x="82" y="166">configs/amd-master.yaml</text>
<text class="comp" x="82" y="189">组件：主配置</text>
<rect class="card" x="40" y="237" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">在变更日志最末尾追加一条，写明这个配置键</text>
<text class="c" x="82" y="290">perf-changelog.yaml</text>
<text class="comp" x="82" y="313">组件：性能变更日志（只追加）</text>
<rect class="card" x="40" y="361" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="361" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="385" r="10"/>
<text class="num" x="62" y="389" text-anchor="middle">3</text>
<text class="t" x="82" y="390">开 PR，打上标签触发完整扫描</text>
<text class="c" x="82" y="414">full-sweep-fail-fast</text>
<rect class="cardT" x="472" y="397" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="397" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="421" r="10"/>
<text class="num" x="494" y="425" text-anchor="middle">4</text>
<text class="t" x="514" y="426">把新增的配置键展开成并行度 × 并发数的</text>
<text class="t" x="514" y="448">任务矩阵</text>
<text class="comp" x="514" y="476">组件：infx.matrix 规划器</text>
<rect class="cardT" x="472" y="520" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="520" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="544" r="10"/>
<text class="num" x="494" y="548" text-anchor="middle">5</text>
<text class="t" x="514" y="549">在自家 Slurm GPU 集群上逐点跑：起服务、压</text>
<text class="t" x="514" y="571">测、跑评测</text>
<text class="comp" x="514" y="599">组件：infx.launch + 自托管 runner</text>
<rect class="cardT" x="472" y="643" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="643" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="667" r="10"/>
<text class="num" x="494" y="671" text-anchor="middle">6</text>
<text class="t" x="514" y="672">合并后把这次扫描的产物导入公开仪表板</text>
<text class="comp" x="514" y="700">组件：合并导入 → InferenceX-app</text>
<rect class="val" x="28" y="750" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="774">价值</text>
<text class="valT" x="48" y="798">你的引擎 + GPU 配方在你没有的硬件上得到一条吞吐—延迟曲线，镜像更新后还会重测，不再是一次性的博客数字</text>
</svg>
