<svg xmlns="http://www.w3.org/2000/svg" width="880" height="688" viewBox="0 0 880 688" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="688" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="530" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="530" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">beads does</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="hand" d="M472,203.0 C441.0,203.0 441.0,242 410,242" marker-end="url(#a)"/>
<path class="hand" d="M408,275.0 C439.0,275.0 439.0,324 470,324" marker-end="url(#a)"/>
<path class="hand" d="M472,360.0 C441.0,360.0 441.0,384 410,384" marker-end="url(#a)"/>
<path class="hand" d="M408,417.0 C439.0,417.0 439.0,470 470,470" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the bd CLI once, then</text>
<text class="t" x="82" y="123">initialize it inside your project</text>
<text class="c" x="82" y="147">bd init</text>
<text class="comp" x="82" y="170">component: bd CLI binary</text>
<rect class="cardT" x="472" y="132" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">Creates a local versioned database and</text>
<text class="t" x="514" y="183">wires its workflow into AGENTS.md and</text>
<text class="t" x="514" y="205">agent hooks</text>
<text class="c" x="514" y="229">.beads/embeddeddolt/</text>
<text class="comp" x="514" y="252">component: embedded Dolt</text>
<rect class="card" x="40" y="218" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">3</text>
<text class="t" x="82" y="247">Your agent files tasks and records</text>
<text class="t" x="82" y="269">which task blocks which</text>
<text class="c" x="82" y="293">bd create &quot;Title&quot; -p 0 · bd dep add</text>
<text class="c" x="82" y="312">&lt;child&gt; &lt;parent&gt;</text>
<rect class="cardT" x="472" y="300" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="300" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="324" r="10"/>
<text class="num" x="494" y="328" text-anchor="middle">4</text>
<text class="t" x="514" y="329">At every session start, hooks inject</text>
<text class="t" x="514" y="351">the workflow plus saved memories</text>
<text class="c" x="514" y="375">bd prime</text>
<text class="comp" x="514" y="398">component: agent hooks</text>
<rect class="card" x="40" y="360" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="360" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="384" r="10"/>
<text class="num" x="62" y="388" text-anchor="middle">5</text>
<text class="t" x="82" y="389">The agent asks for unblocked work,</text>
<text class="t" x="82" y="411">claims one task, closes it when done</text>
<text class="c" x="82" y="435">bd ready · bd update &lt;id&gt; --claim · bd</text>
<text class="c" x="82" y="454">close &lt;id&gt;</text>
<rect class="cardT" x="472" y="446" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="446" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="470" r="10"/>
<text class="num" x="494" y="474" text-anchor="middle">6</text>
<text class="t" x="514" y="475">Closing releases what it blocked, so</text>
<text class="t" x="514" y="497">the next ready list follows real</text>
<text class="t" x="514" y="519">dependencies</text>
<rect class="val" x="28" y="572" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="596">VALUE</text>
<text class="valT" x="48" y="620">After every compaction or fresh session the agent resumes from a dependency-aware task list,</text>
<text class="valT" x="48" y="642">not a stale scratch file</text>
</svg>
