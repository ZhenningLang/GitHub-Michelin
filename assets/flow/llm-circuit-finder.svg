<svg xmlns="http://www.w3.org/2000/svg" width="880" height="765" viewBox="0 0 880 765" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="765" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="607" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="607" rx="10"/>
<rect class="pillT" x="474" y="40" width="239.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">llm-circuit-finder does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,283.0 C439.0,283.0 439.0,307 470,307" marker-end="url(#a)"/>
<path class="edge" d="M494,377 L494,401" marker-end="url(#a)"/>
<path class="hand" d="M472,450.0 C441.0,450.0 441.0,474 410,474" marker-end="url(#a)"/>
<path class="hand" d="M408,518.0 C439.0,518.0 439.0,547 470,547" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Build llama.cpp for your GPU, put a</text>
<text class="t" x="82" y="123">GGUF model on disk, install the Python</text>
<text class="t" x="82" y="145">deps</text>
<text class="c" x="82" y="169">pip install gguf requests tqdm</text>
<rect class="card" x="40" y="215" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Start a sweep: your model, your</text>
<text class="t" x="82" y="266">llama-server, block sizes and the</text>
<text class="t" x="82" y="288">layer range to scan</text>
<text class="c" x="82" y="312">python sweep.py --model</text>
<text class="c" x="82" y="331">/path/to/model.gguf</text>
<rect class="cardT" x="472" y="283" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="283" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="307" r="10"/>
<text class="num" x="494" y="311" text-anchor="middle">3</text>
<text class="t" x="514" y="312">For each candidate block, writes a</text>
<text class="t" x="514" y="334">temp GGUF with those layers physically</text>
<text class="t" x="514" y="356">duplicated</text>
<rect class="cardT" x="472" y="403" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="403" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="427" r="10"/>
<text class="num" x="494" y="431" text-anchor="middle">4</text>
<text class="t" x="514" y="432">Serves it with llama-server, runs</text>
<text class="t" x="514" y="454">math/EQ/reasoning probes, scores vs</text>
<text class="t" x="514" y="476">baseline, deletes it</text>
<rect class="card" x="40" y="450" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="450" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="474" r="10"/>
<text class="num" x="62" y="478" text-anchor="middle">5</text>
<text class="t" x="82" y="479">Take the best-scoring block and spell</text>
<text class="t" x="82" y="501">it out as an explicit layer execution</text>
<text class="t" x="82" y="523">path</text>
<text class="c" x="82" y="547">python layer_path.py model.gguf</text>
<text class="c" x="82" y="566">improved.gguf -p &quot;0..14,12,13,14,15..39&quot;</text>
<rect class="cardT" x="472" y="523" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="523" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="547" r="10"/>
<text class="num" x="494" y="551" text-anchor="middle">6</text>
<text class="t" x="514" y="552">Writes a new GGUF whose forward pass</text>
<text class="t" x="514" y="574">runs that block twice, ready for</text>
<text class="t" x="514" y="596">llama-server</text>
<rect class="val" x="28" y="649" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="673">VALUE</text>
<text class="valT" x="48" y="697">You find which layer block, run twice, shifts your local model&#x27;s reasoning — and get a GGUF</text>
<text class="valT" x="48" y="719">to test it, with no training</text>
</svg>
