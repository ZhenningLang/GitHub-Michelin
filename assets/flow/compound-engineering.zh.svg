<svg xmlns="http://www.w3.org/2000/svg" width="880" height="803" viewBox="0 0 880 803" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="803" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="667" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="667" rx="10"/>
<rect class="pillT" x="474" y="40" width="252.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Compound Engineering 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,236.0 C439.0,236.0 439.0,260 470,260" marker-end="url(#a)"/>
<path class="hand" d="M472,284.5 C441.0,284.5 441.0,332 410,332" marker-end="url(#a)"/>
<path class="hand" d="M408,344.5 C439.0,344.5 439.0,383 470,383" marker-end="url(#a)"/>
<path class="hand" d="M472,407.5 C441.0,407.5 441.0,431 410,431" marker-end="url(#a)"/>
<path class="hand" d="M408,443.5 C439.0,443.5 439.0,506 470,506" marker-end="url(#a)"/>
<path class="hand" d="M472,518.0 C441.0,518.0 441.0,542 410,542" marker-end="url(#a)"/>
<path class="hand" d="M408,554.5 C439.0,554.5 439.0,604 470,604" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在宿主的插件市场装好插件</text>
<text class="c" x="82" y="125">/plugin marketplace add</text>
<text class="c" x="82" y="144">EveryInc/compound-engineering-plugin</text>
<rect class="card" x="40" y="190" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">写码前先头脑风暴一个粗糙想法</text>
<text class="c" x="82" y="243">/ce-brainstorm make background job retries</text>
<text class="c" x="82" y="262">safer</text>
<rect class="cardT" x="472" y="236" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="236" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="260" r="10"/>
<text class="num" x="494" y="264" text-anchor="middle">3</text>
<text class="t" x="514" y="265">连环追问澄清需求，写出 requirements-on</text>
<text class="t" x="514" y="287">ly 计划</text>
<text class="comp" x="514" y="315">组件：ce-brainstorm skill</text>
<rect class="card" x="40" y="308" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="308" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="332" r="10"/>
<text class="num" x="62" y="336" text-anchor="middle">4</text>
<text class="t" x="82" y="337">把计划长大，然后执行</text>
<text class="c" x="82" y="361">/ce-plan · /ce-work</text>
<rect class="cardT" x="472" y="359" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="359" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="383" r="10"/>
<text class="num" x="494" y="387" text-anchor="middle">5</text>
<text class="t" x="514" y="388">带着过往经验细化计划并实现，保留宿主验证与</text>
<text class="t" x="514" y="410">commit</text>
<text class="comp" x="514" y="438">组件：ce-plan / ce-work skill</text>
<rect class="card" x="40" y="407" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="407" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="431" r="10"/>
<text class="num" x="62" y="435" text-anchor="middle">6</text>
<text class="t" x="82" y="436">收紧并审查这次改动</text>
<text class="c" x="82" y="460">/ce-simplify-code · /ce-code-review</text>
<rect class="cardT" x="472" y="482" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="482" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="506" r="10"/>
<text class="num" x="494" y="510" text-anchor="middle">7</text>
<text class="t" x="514" y="511">对照计划做多 agent 审查——只出报告，是否应</text>
<text class="t" x="514" y="533">用由你定</text>
<rect class="card" x="40" y="518" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="518" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="542" r="10"/>
<text class="num" x="62" y="546" text-anchor="middle">8</text>
<text class="t" x="82" y="547">收尾循环，把经验沉淀下来</text>
<text class="c" x="82" y="571">/ce-compound</text>
<rect class="cardT" x="472" y="580" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="580" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="604" r="10"/>
<text class="num" x="494" y="608" text-anchor="middle">9</text>
<text class="t" x="514" y="609">把经验写进 docs/solutions/，供下一轮</text>
<text class="t" x="514" y="631">plan 先读</text>
<text class="comp" x="514" y="659">组件：docs/solutions/ 工件</text>
<rect class="val" x="28" y="709" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="733">价值</text>
<text class="valT" x="48" y="757">每一轮循环从累积的决策出发，而不是一张白纸——第一次跑教会它，第二次跑它记住了</text>
</svg>
