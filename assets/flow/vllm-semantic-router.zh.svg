<svg xmlns="http://www.w3.org/2000/svg" width="880" height="965" viewBox="0 0 880 965" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="965" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="829" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="829" rx="10"/>
<rect class="pillT" x="474" y="40" width="206.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Semantic Router 做的</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="edge" d="M62,338 L62,362" marker-end="url(#a)"/>
<path class="hand" d="M408,400.5 C439.0,400.5 439.0,424 470,424" marker-end="url(#a)"/>
<path class="edge" d="M494,497 L494,521" marker-end="url(#a)"/>
<path class="edge" d="M494,620 L494,644" marker-end="url(#a)"/>
<path class="edge" d="M494,718 L494,742" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好 CLI，拉起本地整套（Router、Envoy、控</text>
<text class="t" x="82" y="123">制台）</text>
<text class="c" x="82" y="147">vllm-sr serve</text>
<text class="comp" x="82" y="170">组件：vllm-sr 命令行</text>
<rect class="card" x="40" y="218" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">登记模型端点，写决策：哪种信号的请求交给哪</text>
<text class="t" x="82" y="269">个模型</text>
<text class="c" x="82" y="293">routing.decisions</text>
<text class="comp" x="82" y="316">组件：规范 YAML 配置</text>
<rect class="card" x="40" y="364" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="364" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="388" r="10"/>
<text class="num" x="62" y="392" text-anchor="middle">3</text>
<text class="t" x="82" y="393">客户端改连路由入口，模型名填虚拟模型</text>
<text class="c" x="82" y="417">&quot;model&quot;: &quot;vllm-sr/auto&quot;</text>
<rect class="cardT" x="472" y="400" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="400" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="424" r="10"/>
<text class="num" x="494" y="428" text-anchor="middle">4</text>
<text class="t" x="514" y="429">Envoy 转发前先把每个请求经 ExtProc 交给</text>
<text class="t" x="514" y="451">Router</text>
<text class="comp" x="514" y="479">组件：Envoy ExtProc 过滤器</text>
<rect class="cardT" x="472" y="523" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="523" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="547" r="10"/>
<text class="num" x="494" y="551" text-anchor="middle">5</text>
<text class="t" x="514" y="552">用本地小分类器算信号：领域、越狱、PII、关键</text>
<text class="t" x="514" y="574">词、上下文长度</text>
<text class="comp" x="514" y="602">组件：Vela 编码器分类器</text>
<rect class="cardT" x="472" y="646" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="646" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="670" r="10"/>
<text class="num" x="494" y="674" text-anchor="middle">6</text>
<text class="t" x="514" y="675">命中优先级最高的决策，选出模型，跑这条路由</text>
<text class="t" x="514" y="697">的插件</text>
<rect class="cardT" x="472" y="744" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="744" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="768" r="10"/>
<text class="num" x="494" y="772" text-anchor="middle">7</text>
<text class="t" x="514" y="773">Envoy 把请求发给选中的后端，选择结果</text>
<text class="t" x="514" y="795">写进响应头</text>
<text class="c" x="514" y="819">x-vsr-selected-model</text>
<rect class="val" x="28" y="871" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="895">价值</text>
<text class="valT" x="48" y="919">应用只认一个模型名；谁来答、什么该拦，都收在一份可审的 YAML 里，不再写进业务代码</text>
</svg>
