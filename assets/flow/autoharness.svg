<svg xmlns="http://www.w3.org/2000/svg" width="880" height="929" viewBox="0 0 880 929" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="929" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="771" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="771" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">autoharness does</text>
<path class="edge" d="M62,228 L62,252" marker-end="url(#a)"/>
<path class="hand" d="M408,298.5 C439.0,298.5 439.0,322 470,322" marker-end="url(#a)"/>
<path class="edge" d="M494,434 L494,458" marker-end="url(#a)"/>
<path class="hand" d="M472,539.5 C441.0,539.5 441.0,563 410,563" marker-end="url(#a)"/>
<path class="hand" d="M408,572.5 C439.0,572.5 439.0,669 470,669" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="156" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="156" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Once</text>
<text class="t" x="82" y="118">In Claude Code, add its marketplace,</text>
<text class="t" x="82" y="140">install the plugin and reload plugins</text>
<text class="c" x="82" y="164">/plugin install autoharness@autoharness</text>
<text class="comp" x="82" y="187">component: Claude Code plugin (hooks +</text>
<text class="comp" x="82" y="206">MCP)</text>
<rect class="card" x="40" y="254" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="254" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="278" r="10"/>
<text class="num" x="62" y="282" text-anchor="middle">2</text>
<text class="ph" x="82" y="283">While you work</text>
<text class="t" x="82" y="300">Work as usual: debug, fix, correct the</text>
<text class="t" x="82" y="322">agent when it gets something wrong</text>
<rect class="cardT" x="472" y="298" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="298" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="322" r="10"/>
<text class="num" x="494" y="326" text-anchor="middle">3</text>
<text class="ph" x="514" y="327">While you work</text>
<text class="t" x="514" y="344">Counts tool calls; the turn past 50</text>
<text class="t" x="514" y="366">ends by launching a background</text>
<text class="t" x="514" y="388">reflector on the redacted transcript</text>
<text class="comp" x="514" y="416">component: Stop hook + reflector (Haiku)</text>
<rect class="cardT" x="472" y="460" width="368" height="159" rx="8"/>
<rect class="accT" x="472" y="460" width="4" height="159" rx="2"/>
<circle class="accT" cx="494" cy="484" r="10"/>
<text class="num" x="494" y="488" text-anchor="middle">4</text>
<text class="ph" x="514" y="489">While you work</text>
<text class="t" x="514" y="506">Reflector stages create/patch/merge</text>
<text class="t" x="514" y="528">intents; the promoter validates each</text>
<text class="t" x="514" y="550">and atomically writes the skill</text>
<text class="c" x="514" y="574">.claude/skills/</text>
<text class="comp" x="514" y="597">component: stage_skill MCP + promoter</text>
<rect class="card" x="40" y="539" width="368" height="67" rx="8"/>
<rect class="accY" x="40" y="539" width="4" height="67" rx="2"/>
<circle class="accY" cx="62" cy="563" r="10"/>
<text class="num" x="62" y="567" text-anchor="middle">5</text>
<text class="ph" x="82" y="568">Next session</text>
<text class="t" x="82" y="585">Open a new session</text>
<rect class="cardT" x="472" y="645" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="645" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="669" r="10"/>
<text class="num" x="494" y="673" text-anchor="middle">6</text>
<text class="ph" x="514" y="674">Next session</text>
<text class="t" x="514" y="691">Archives skills unused through</text>
<text class="t" x="514" y="713">probation, then injects an index of</text>
<text class="t" x="514" y="735">its skills and the last run&#x27;s result</text>
<text class="comp" x="514" y="763">component: SessionStart hook</text>
<rect class="val" x="28" y="813" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="837">VALUE</text>
<text class="valT" x="48" y="861">Lessons from your fixes and corrections become skills that get patched, merged and pruned on</text>
<text class="valT" x="48" y="883">their own — you stop hand-writing and gardening the skills folder</text>
</svg>
