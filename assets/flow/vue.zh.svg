<svg xmlns="http://www.w3.org/2000/svg" width="880" height="671" viewBox="0 0 880 671" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="671" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="535" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="535" rx="10"/>
<rect class="pillT" x="474" y="40" width="96.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Vue 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,288 L62,312" marker-end="url(#a)"/>
<path class="hand" d="M408,350.5 C439.0,350.5 439.0,374 470,374" marker-end="url(#a)"/>
<path class="edge" d="M494,447 L494,471" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">生成一个 Vite 项目，或者把 CDN 版本直接放</text>
<text class="t" x="82" y="123">进现有页面</text>
<text class="c" x="82" y="147">npm create vue@latest</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">写组件：一段类 HTML 模板，加上它要显示的响</text>
<text class="t" x="82" y="244">应式值</text>
<text class="c" x="82" y="268">&lt;script setup&gt; · ref()</text>
<rect class="card" x="40" y="314" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">3</text>
<text class="t" x="82" y="343">创建应用，挂到一个元素上</text>
<text class="c" x="82" y="367">createApp(App).mount(&#x27;#app&#x27;)</text>
<rect class="cardT" x="472" y="350" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="350" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="374" r="10"/>
<text class="num" x="494" y="378" text-anchor="middle">4</text>
<text class="t" x="514" y="379">编译模板，渲染时记下每个组件读了哪些</text>
<text class="t" x="514" y="401">响应式值</text>
<text class="comp" x="514" y="429">组件：模板编译器 + 响应式系统</text>
<rect class="cardT" x="472" y="473" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="473" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="497" r="10"/>
<text class="num" x="494" y="501" text-anchor="middle">5</text>
<text class="t" x="514" y="502">某个值一变，只重渲染读了它的组件，并把差异</text>
<text class="t" x="514" y="524">补到 DOM 上</text>
<rect class="val" x="28" y="577" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="601">价值</text>
<text class="valT" x="48" y="625">你只改数据；哪些界面依赖它 Vue 早就记下了，不用写更新代码，也不用调重渲染</text>
</svg>
