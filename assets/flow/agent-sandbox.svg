<svg xmlns="http://www.w3.org/2000/svg" width="880" height="712" viewBox="0 0 880 712" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="712" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="554" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="554" rx="10"/>
<rect class="pillT" x="474" y="40" width="193.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agent Sandbox does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,283.0 C439.0,283.0 439.0,307 470,307" marker-end="url(#a)"/>
<path class="hand" d="M472,342.5 C441.0,342.5 441.0,401 410,401" marker-end="url(#a)"/>
<path class="hand" d="M408,445.0 C439.0,445.0 439.0,469 470,469" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the controller, its CRDs and</text>
<text class="t" x="82" y="123">the extensions into your cluster with</text>
<text class="t" x="82" y="145">one manifest</text>
<text class="c" x="82" y="169">sandbox-with-extensions.yaml</text>
<rect class="card" x="40" y="215" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Describe the sandbox once as a</text>
<text class="t" x="82" y="266">template and ask for a pool of</text>
<text class="t" x="82" y="288">pre-started ones</text>
<text class="c" x="82" y="312">kubectl apply -f</text>
<text class="c" x="82" y="331">python-sandbox-warmpool.yaml</text>
<rect class="cardT" x="472" y="283" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="283" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="307" r="10"/>
<text class="num" x="494" y="311" text-anchor="middle">3</text>
<text class="t" x="514" y="312">Keeps the warm pool topped up with</text>
<text class="t" x="514" y="334">started pods, each with a stable name</text>
<text class="t" x="514" y="356">and the template&#x27;s network policy</text>
<text class="comp" x="514" y="384">component: agent-sandbox-controller</text>
<rect class="card" x="40" y="377" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="377" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="401" r="10"/>
<text class="num" x="62" y="405" text-anchor="middle">4</text>
<text class="t" x="82" y="406">From your agent, claim a sandbox from</text>
<text class="t" x="82" y="428">the pool and run the code the model</text>
<text class="t" x="82" y="450">wrote</text>
<text class="c" x="82" y="474">client.create_sandbox ·</text>
<text class="c" x="82" y="493">sandbox.commands.run</text>
<rect class="cardT" x="472" y="445" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="445" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="469" r="10"/>
<text class="num" x="494" y="473" text-anchor="middle">5</text>
<text class="t" x="514" y="474">Hands the claim an already-running pod</text>
<text class="t" x="514" y="496">and routes your commands and files to</text>
<text class="t" x="514" y="518">it</text>
<text class="comp" x="514" y="546">component: sandbox-router</text>
<rect class="val" x="28" y="596" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="620">VALUE</text>
<text class="valT" x="48" y="644">Each agent task gets its own pre-warmed, disposable pod as an ordinary Kubernetes object,</text>
<text class="valT" x="48" y="666">with no per-session StatefulSet, Service and volume wiring</text>
</svg>
