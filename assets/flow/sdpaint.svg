<svg xmlns="http://www.w3.org/2000/svg" width="880" height="740" viewBox="0 0 880 740" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="740" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="604" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="604" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">SdPaint does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,251.5 C439.0,251.5 439.0,275 470,275" marker-end="url(#a)"/>
<path class="hand" d="M472,310.5 C441.0,310.5 441.0,338 410,338" marker-end="url(#a)"/>
<path class="hand" d="M408,361.5 C439.0,361.5 439.0,420 470,420" marker-end="url(#a)"/>
<path class="edge" d="M494,516 L494,540" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Run AUTOMATIC1111&#x27;s WebUI with the</text>
<text class="t" x="82" y="123">ControlNet extension, its models, and</text>
<text class="t" x="82" y="145">API mode on</text>
<text class="c" x="82" y="169">--api</text>
<rect class="card" x="40" y="215" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Launch SdPaint</text>
<text class="c" x="82" y="268">./start.sh · Start.bat</text>
<rect class="cardT" x="472" y="251" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="251" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="275" r="10"/>
<text class="num" x="494" y="279" text-anchor="middle">3</text>
<text class="t" x="514" y="280">Writes its config files and fetches</text>
<text class="t" x="514" y="302">the scribble/lineart ControlNet models</text>
<text class="t" x="514" y="324">your WebUI has</text>
<text class="comp" x="514" y="352">component: configs/*.json</text>
<rect class="card" x="40" y="314" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">4</text>
<text class="t" x="82" y="343">Type a prompt and start sketching on</text>
<text class="t" x="82" y="365">the canvas</text>
<text class="c" x="82" y="389">p</text>
<rect class="cardT" x="472" y="396" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="396" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="420" r="10"/>
<text class="num" x="494" y="424" text-anchor="middle">5</text>
<text class="t" x="514" y="425">After each stroke, sends the sketch to</text>
<text class="t" x="514" y="447">the WebUI API as a ControlNet input</text>
<text class="c" x="514" y="471">sdapi/v1/txt2img</text>
<text class="comp" x="514" y="494">component: cn_requests.py</text>
<rect class="cardT" x="472" y="542" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="542" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="566" r="10"/>
<text class="num" x="494" y="570" text-anchor="middle">6</text>
<text class="t" x="514" y="571">Replaces the preview with the</text>
<text class="t" x="514" y="593">generated image when it returns</text>
<rect class="val" x="28" y="646" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="670">VALUE</text>
<text class="valT" x="48" y="694">You compose by drawing rather than re-prompting, and the picture follows your strokes</text>
</svg>
