<svg xmlns="http://www.w3.org/2000/svg" width="880" height="748" viewBox="0 0 880 748" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="748" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="590" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="590" rx="10"/>
<rect class="pillT" x="474" y="40" width="92.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">uv does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,262.5 C439.0,262.5 439.0,286 470,286" marker-end="url(#a)"/>
<path class="edge" d="M494,382 L494,406" marker-end="url(#a)"/>
<path class="hand" d="M472,455.0 C441.0,455.0 441.0,479 410,479" marker-end="url(#a)"/>
<path class="hand" d="M408,502.5 C439.0,502.5 439.0,552 470,552" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the standalone uv binary</text>
<text class="c" x="82" y="125">curl -LsSf https://astral.sh/uv/install.sh</text>
<text class="c" x="82" y="144">| sh</text>
<text class="comp" x="82" y="167">component: uv CLI</text>
<rect class="card" x="40" y="215" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Create a project and declare its</text>
<text class="t" x="82" y="266">dependencies</text>
<text class="c" x="82" y="290">uv init example · uv add ruff</text>
<rect class="cardT" x="472" y="262" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="262" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="286" r="10"/>
<text class="num" x="494" y="290" text-anchor="middle">3</text>
<text class="t" x="514" y="291">Resolves all dependencies and writes</text>
<text class="t" x="514" y="313">one cross-platform lockfile</text>
<text class="c" x="514" y="337">uv.lock</text>
<text class="comp" x="514" y="360">component: PubGrub resolver</text>
<rect class="cardT" x="472" y="408" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="408" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="432" r="10"/>
<text class="num" x="494" y="436" text-anchor="middle">4</text>
<text class="t" x="514" y="437">Creates .venv, fetching a Python build</text>
<text class="t" x="514" y="459">if needed, and links packages from its</text>
<text class="t" x="514" y="481">global cache</text>
<rect class="card" x="40" y="455" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="455" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="479" r="10"/>
<text class="num" x="62" y="483" text-anchor="middle">5</text>
<text class="t" x="82" y="484">Run commands through uv instead of</text>
<text class="t" x="82" y="506">activating the environment</text>
<text class="c" x="82" y="530">uv run ruff check</text>
<rect class="cardT" x="472" y="528" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="528" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="552" r="10"/>
<text class="num" x="494" y="556" text-anchor="middle">6</text>
<text class="t" x="514" y="557">Before each run, re-syncs the lockfile</text>
<text class="t" x="514" y="579">and environment with pyproject.toml</text>
<rect class="val" x="28" y="632" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="656">VALUE</text>
<text class="valT" x="48" y="680">One tool and one lockfile reproduce the same environment on every laptop and CI runner, in</text>
<text class="valT" x="48" y="702">seconds</text>
</svg>
