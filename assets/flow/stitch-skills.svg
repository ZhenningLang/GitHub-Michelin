<svg xmlns="http://www.w3.org/2000/svg" width="880" height="757" viewBox="0 0 880 757" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="757" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="599" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="599" rx="10"/>
<rect class="pillT" x="474" y="40" width="193.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Stitch Skills does</text>
<path class="edge" d="M62,169 L62,193" marker-end="url(#a)"/>
<path class="hand" d="M408,252.0 C439.0,252.0 439.0,276 470,276" marker-end="url(#a)"/>
<path class="hand" d="M472,321.5 C441.0,321.5 441.0,359 410,359" marker-end="url(#a)"/>
<path class="hand" d="M408,360.0 C439.0,360.0 439.0,441 470,441" marker-end="url(#a)"/>
<path class="hand" d="M472,453.0 C441.0,453.0 441.0,477 410,477" marker-end="url(#a)"/>
<path class="hand" d="M408,489.0 C439.0,489.0 439.0,539 470,539" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Register the Stitch MCP server with</text>
<text class="t" x="82" y="123">its env vars and credentials</text>
<text class="comp" x="82" y="151">component: Stitch MCP server</text>
<rect class="card" x="40" y="195" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="195" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="219" r="10"/>
<text class="num" x="62" y="223" text-anchor="middle">2</text>
<text class="t" x="82" y="224">Install the plugin suite into your</text>
<text class="t" x="82" y="246">agent</text>
<text class="c" x="82" y="270">npx plugins add</text>
<text class="c" x="82" y="289">google-labs-code/stitch-skills</text>
<rect class="cardT" x="472" y="252" width="368" height="139" rx="8"/>
<rect class="accT" x="472" y="252" width="4" height="139" rx="2"/>
<circle class="accT" cx="494" cy="276" r="10"/>
<text class="num" x="494" y="280" text-anchor="middle">3</text>
<text class="t" x="514" y="281">The agent gains Stitch verbs as</text>
<text class="t" x="514" y="303">loadable skills</text>
<text class="c" x="514" y="327">stitch::generate-design ·</text>
<text class="c" x="514" y="346">stitch::react-components</text>
<text class="comp" x="514" y="369">component: three plugins</text>
<rect class="card" x="40" y="335" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="335" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="359" r="10"/>
<text class="num" x="62" y="363" text-anchor="middle">4</text>
<text class="t" x="82" y="364">Describe the screen you want, as usual</text>
<rect class="cardT" x="472" y="417" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="417" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="441" r="10"/>
<text class="num" x="494" y="445" text-anchor="middle">5</text>
<text class="t" x="514" y="446">The skill turns it into Stitch calls</text>
<text class="t" x="514" y="468">and generates screens in your project</text>
<rect class="card" x="40" y="453" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="453" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="477" r="10"/>
<text class="num" x="62" y="481" text-anchor="middle">6</text>
<text class="t" x="82" y="482">Once happy, ask to convert the screens</text>
<text class="t" x="82" y="504">to components</text>
<rect class="cardT" x="472" y="515" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="515" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="539" r="10"/>
<text class="num" x="494" y="543" text-anchor="middle">7</text>
<text class="t" x="514" y="544">Exports a React component system,</text>
<text class="t" x="514" y="566">running its validation scripts before</text>
<text class="t" x="514" y="588">handing you code</text>
<rect class="val" x="28" y="641" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="665">VALUE</text>
<text class="valT" x="48" y="689">The brainstorm-to-components loop runs inside your agent — no hand-carrying HTML between the</text>
<text class="valT" x="48" y="711">Stitch web UI and your codebase</text>
</svg>
