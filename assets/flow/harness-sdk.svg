<svg xmlns="http://www.w3.org/2000/svg" width="880" height="798" viewBox="0 0 880 798" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="798" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="640" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="640" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Harness SDK does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,262.5 C439.0,262.5 439.0,286 470,286" marker-end="url(#a)"/>
<path class="edge" d="M494,381 L494,405" marker-end="url(#a)"/>
<path class="hand" d="M472,467.0 C441.0,467.0 441.0,491 410,491" marker-end="url(#a)"/>
<path class="hand" d="M408,513.0 C439.0,513.0 439.0,577 470,577" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the harness package, plus a</text>
<text class="t" x="82" y="123">provider extra if you are not on</text>
<text class="t" x="82" y="145">Bedrock</text>
<text class="c" x="82" y="169">pip install strands-harness</text>
<rect class="card" x="40" y="215" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Build the agent in one call — every</text>
<text class="t" x="82" y="266">argument is optional</text>
<text class="c" x="82" y="290">create_harness()</text>
<rect class="cardT" x="472" y="262" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="262" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="286" r="10"/>
<text class="num" x="494" y="290" text-anchor="middle">3</text>
<text class="t" x="514" y="291">Wires a tuned system prompt, shell and</text>
<text class="t" x="514" y="313">file tools, a code sandbox and a</text>
<text class="t" x="514" y="335">subagent</text>
<text class="comp" x="514" y="363">component: strands_harness</text>
<rect class="cardT" x="472" y="407" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="407" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="431" r="10"/>
<text class="num" x="494" y="435" text-anchor="middle">4</text>
<text class="t" x="514" y="436">Keeps sessions, long-term memory and</text>
<text class="t" x="514" y="458">skills in one dot-directory it owns</text>
<text class="c" x="514" y="482">./.agent/</text>
<text class="comp" x="514" y="505">component: harness defaults</text>
<rect class="card" x="40" y="467" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="467" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="491" r="10"/>
<text class="num" x="62" y="495" text-anchor="middle">5</text>
<text class="t" x="82" y="496">Hand it the task</text>
<text class="c" x="82" y="520">agent(&quot;Find the slowest test in this repo</text>
<text class="c" x="82" y="539">and explain why it&#x27;s slow&quot;)</text>
<rect class="cardT" x="472" y="553" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="553" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="577" r="10"/>
<text class="num" x="494" y="581" text-anchor="middle">6</text>
<text class="t" x="514" y="582">Runs the loop, calls tools, summarizes</text>
<text class="t" x="514" y="604">old turns and reuses cached context</text>
<text class="comp" x="514" y="632">component: agent loop</text>
<rect class="val" x="28" y="682" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="706">VALUE</text>
<text class="valT" x="48" y="730">You no longer hand-assemble the loop, its tools, memory and sessions: one call gives you a</text>
<text class="valT" x="48" y="752">working agent, and every default stays overridable</text>
</svg>
