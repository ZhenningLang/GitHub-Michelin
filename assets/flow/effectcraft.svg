<svg xmlns="http://www.w3.org/2000/svg" width="880" height="632" viewBox="0 0 880 632" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="632" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="496" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="496" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">EffectCraft does</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,178.5 C441.0,178.5 441.0,217 410,217" marker-end="url(#a)"/>
<path class="hand" d="M408,240.0 C439.0,240.0 439.0,288 470,288" marker-end="url(#a)"/>
<path class="hand" d="M472,312.5 C441.0,312.5 441.0,337 410,337" marker-end="url(#a)"/>
<path class="hand" d="M408,360.5 C439.0,360.5 439.0,411 470,411" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install a signed release, or build and</text>
<text class="t" x="82" y="123">open the app (with the demo project)</text>
<text class="c" x="82" y="147">cargo run --release -p effectcraft</text>
<rect class="cardT" x="472" y="119" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">Opens After Effects-style panels:</text>
<text class="t" x="514" y="170">Project, Composition, Timeline, Effect</text>
<text class="t" x="514" y="192">Controls</text>
<text class="comp" x="514" y="220">component: egui desktop / web app</text>
<rect class="card" x="40" y="193" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">Build a comp: add layers, set</text>
<text class="t" x="82" y="244">keyframes, stack effects, type</text>
<text class="t" x="82" y="266">expressions</text>
<rect class="cardT" x="472" y="264" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="264" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="288" r="10"/>
<text class="num" x="494" y="292" text-anchor="middle">4</text>
<text class="t" x="514" y="293">Interpolates keyframes and composites</text>
<text class="t" x="514" y="315">each frame, most effects on the GPU</text>
<text class="comp" x="514" y="343">component: render + gpu crates</text>
<rect class="card" x="40" y="313" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="313" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="337" r="10"/>
<text class="num" x="62" y="341" text-anchor="middle">5</text>
<text class="t" x="82" y="342">Queue the comp in the Render Queue, or</text>
<text class="t" x="82" y="364">export it as Lottie</text>
<text class="c" x="82" y="388">File ▸ Export ▸ Lottie JSON…</text>
<rect class="cardT" x="472" y="387" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="387" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="411" r="10"/>
<text class="num" x="494" y="415" text-anchor="middle">6</text>
<text class="t" x="514" y="416">Encodes MP4/ProRes/WebM with its own</text>
<text class="t" x="514" y="438">Rust encoders, or writes Lottie and</text>
<text class="t" x="514" y="460">flags what got lost</text>
<text class="comp" x="514" y="488">component: export + FilmCraft codecs</text>
<rect class="val" x="28" y="538" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="562">VALUE</text>
<text class="valT" x="48" y="586">After Effects-style motion graphics without a subscription or FFmpeg, saved as diffable JSON</text>
</svg>
