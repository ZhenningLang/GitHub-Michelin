<svg xmlns="http://www.w3.org/2000/svg" width="880" height="889" viewBox="0 0 880 889" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="889" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="753" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="753" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">LifeOS 做的</text>
<path class="hand" d="M408,130.5 C439.0,130.5 439.0,154 470,154" marker-end="url(#a)"/>
<path class="edge" d="M494,250 L494,274" marker-end="url(#a)"/>
<path class="edge" d="M494,396 L494,420" marker-end="url(#a)"/>
<path class="hand" d="M472,482.0 C441.0,482.0 441.0,506 410,506" marker-end="url(#a)"/>
<path class="hand" d="M408,531.0 C439.0,531.0 439.0,592 470,592" marker-end="url(#a)"/>
<path class="edge" d="M494,640 L494,664" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把安装页交给你在用的 AI harness，让它来装</text>
<text class="c" x="82" y="125">Read https://ourlifeos.ai/install and</text>
<text class="c" x="82" y="144">install LifeOS for me.</text>
<text class="comp" x="82" y="167">组件：Agent 安装技能</text>
<rect class="cardT" x="472" y="130" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="130" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="154" r="10"/>
<text class="num" x="494" y="158" text-anchor="middle">2</text>
<text class="t" x="514" y="159">探测你的系统、harness 与配置根目录，</text>
<text class="t" x="514" y="181">不预设路径</text>
<text class="c" x="514" y="205">bun Tools/DetectEnv.ts</text>
<text class="comp" x="514" y="228">组件：DetectEnv.ts</text>
<rect class="cardT" x="472" y="276" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="276" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="300" r="10"/>
<text class="num" x="494" y="304" text-anchor="middle">3</text>
<text class="t" x="514" y="305">把技能、运行时和空的 USER 树增补式复制进配</text>
<text class="t" x="514" y="327">置根目录，先 dry-run</text>
<text class="c" x="514" y="351">bun Tools/DeployCore.ts --apply</text>
<text class="comp" x="514" y="374">组件：DeployCore.ts</text>
<rect class="cardT" x="472" y="422" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="422" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="446" r="10"/>
<text class="num" x="494" y="450" text-anchor="middle">4</text>
<text class="t" x="514" y="451">每步经你同意，合并 hooks 并接好 lifeos 启</text>
<text class="t" x="514" y="473">动命令</text>
<text class="c" x="514" y="497">bun Tools/InstallHooks.ts --apply</text>
<text class="comp" x="514" y="520">组件：InstallHooks.ts + 启动器</text>
<rect class="card" x="40" y="482" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="482" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="506" r="10"/>
<text class="num" x="62" y="510" text-anchor="middle">5</text>
<text class="t" x="82" y="511">用新命令启动，做一次入职访谈</text>
<text class="c" x="82" y="535">lifeos</text>
<text class="comp" x="82" y="558">组件：Interview 工作流</text>
<rect class="cardT" x="472" y="568" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="568" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="592" r="10"/>
<text class="num" x="494" y="596" text-anchor="middle">6</text>
<text class="t" x="514" y="597">把你的 TELOS——目标、人际、偏好——收进 U</text>
<text class="t" x="514" y="619">SER树</text>
<rect class="cardT" x="472" y="666" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="666" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="690" r="10"/>
<text class="num" x="494" y="694" text-anchor="middle">7</text>
<text class="t" x="514" y="695">此后每轮加载你的宪法与上下文，Pulse 展示现</text>
<text class="t" x="514" y="717">状→理想状态</text>
<text class="comp" x="514" y="745">组件：Pulse 仪表盘（:31337）</text>
<rect class="val" x="28" y="795" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="819">价值</text>
<text class="valT" x="48" y="843">你不再每次重新自我介绍：每个 AI 会话从沉淀好的上下文出发，而不是从零开始。</text>
</svg>
