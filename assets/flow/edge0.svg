<svg xmlns="http://www.w3.org/2000/svg" width="880" height="849" viewBox="0 0 880 849" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="849" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="691" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="691" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Edge0 does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,269.0 C439.0,269.0 439.0,293 470,293" marker-end="url(#a)"/>
<path class="hand" d="M472,328.5 C441.0,328.5 441.0,376 410,376" marker-end="url(#a)"/>
<path class="hand" d="M408,418.5 C439.0,418.5 439.0,442 470,442" marker-end="url(#a)"/>
<path class="hand" d="M472,477.5 C441.0,477.5 441.0,535 410,535" marker-end="url(#a)"/>
<path class="hand" d="M408,558.5 C439.0,558.5 439.0,587 470,587" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">On an Apple-silicon Mac, install the</text>
<text class="t" x="82" y="123">Python package from a clone</text>
<text class="c" x="82" y="147">python3.12 -m venv .venv &amp;&amp; .venv/bin/pip</text>
<text class="c" x="82" y="166">install -e &#x27;.[dev,fetch]&#x27;</text>
<rect class="card" x="40" y="212" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Download one of the two published</text>
<text class="t" x="82" y="263">tiers into a local directory</text>
<text class="c" x="82" y="287">.venv/bin/python scripts/fetch_models.py</text>
<text class="c" x="82" y="306">--tier edge0-35b --target-dir models</text>
<rect class="cardT" x="472" y="269" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="269" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="293" r="10"/>
<text class="num" x="494" y="297" text-anchor="middle">3</text>
<text class="t" x="514" y="298">Lands one ready-to-run directory: int4</text>
<text class="t" x="514" y="320">base checkpoint plus its trained LoRA</text>
<text class="t" x="514" y="342">and prerouter files</text>
<text class="comp" x="514" y="370">component: Hugging Face model repo</text>
<rect class="card" x="40" y="352" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">4</text>
<text class="t" x="82" y="381">Point the tier name at that directory</text>
<text class="t" x="82" y="403">and start the server</text>
<text class="c" x="82" y="427">export</text>
<text class="c" x="82" y="446">EDGE0_35B_MODEL=$PWD/models/edge0-35b ·</text>
<text class="c" x="82" y="465">edge0 serve edge0-35b</text>
<rect class="cardT" x="472" y="418" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="418" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="442" r="10"/>
<text class="num" x="494" y="446" text-anchor="middle">5</text>
<text class="t" x="514" y="447">Maps expert weights on the SSD instead</text>
<text class="t" x="514" y="469">of loading them, attaches both</text>
<text class="t" x="514" y="491">adapters, serves on 127.0.0.1:8000</text>
<text class="comp" x="514" y="519">component: edge0 serve (AutoEngine)</text>
<rect class="card" x="40" y="511" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="511" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="535" r="10"/>
<text class="num" x="62" y="539" text-anchor="middle">6</text>
<text class="t" x="82" y="540">Send chat requests from any</text>
<text class="t" x="82" y="562">OpenAI-style client</text>
<text class="c" x="82" y="586">http://127.0.0.1:8000/v1/chat/completions</text>
<rect class="cardT" x="472" y="563" width="368" height="138" rx="8"/>
<rect class="accT" x="472" y="563" width="4" height="138" rx="2"/>
<circle class="accT" cx="494" cy="587" r="10"/>
<text class="num" x="494" y="591" text-anchor="middle">7</text>
<text class="t" x="514" y="592">Per token, predicts the next layer&#x27;s</text>
<text class="t" x="514" y="614">experts one step early so SSD reads</text>
<text class="t" x="514" y="636">overlap compute</text>
<text class="comp" x="514" y="664">component: prerouter + streaming expert</text>
<text class="comp" x="514" y="683">pool</text>
<rect class="val" x="28" y="733" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="757">VALUE</text>
<text class="valT" x="48" y="781">A 35B MoE model answers on a 24 GB Mac inside about 3 GiB of peak active memory, without</text>
<text class="valT" x="48" y="803">holding the 23 GB checkpoint in RAM</text>
</svg>
