<svg xmlns="http://www.w3.org/2000/svg" width="880" height="848" viewBox="0 0 880 848" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="848" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="690" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="690" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">HEY CLI does</text>
<path class="edge" d="M62,203 L62,227" marker-end="url(#a)"/>
<path class="hand" d="M408,285.0 C439.0,285.0 439.0,309 470,309" marker-end="url(#a)"/>
<path class="hand" d="M472,329.5 C441.0,329.5 441.0,391 410,391" marker-end="url(#a)"/>
<path class="hand" d="M408,432.5 C439.0,432.5 439.0,456 470,456" marker-end="url(#a)"/>
<path class="hand" d="M472,489.0 C441.0,489.0 441.0,548 410,548" marker-end="url(#a)"/>
<path class="hand" d="M408,589.5 C439.0,589.5 439.0,613 470,613" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="131" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="131" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Set up</text>
<text class="t" x="82" y="118">Install the hey binary for your</text>
<text class="t" x="82" y="140">platform</text>
<text class="c" x="82" y="164">curl -fsSL https://hey.com/install-cli |</text>
<text class="c" x="82" y="183">bash</text>
<rect class="card" x="40" y="229" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="229" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="253" r="10"/>
<text class="num" x="62" y="257" text-anchor="middle">2</text>
<text class="ph" x="82" y="258">Set up</text>
<text class="t" x="82" y="275">Run hey once and sign in with your</text>
<text class="t" x="82" y="297">browser</text>
<text class="c" x="82" y="321">hey</text>
<rect class="cardT" x="472" y="285" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="285" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="309" r="10"/>
<text class="num" x="494" y="313" text-anchor="middle">3</text>
<text class="ph" x="514" y="314">Set up</text>
<text class="t" x="514" y="331">Completes OAuth and stores the token</text>
<text class="t" x="514" y="353">in your system keyring</text>
<rect class="card" x="40" y="367" width="368" height="131" rx="8"/>
<rect class="accY" x="40" y="367" width="4" height="131" rx="2"/>
<circle class="accY" cx="62" cy="391" r="10"/>
<text class="num" x="62" y="395" text-anchor="middle">4</text>
<text class="ph" x="82" y="396">Set up</text>
<text class="t" x="82" y="413">Connect the coding agent it detected —</text>
<text class="t" x="82" y="435">or any MCP client</text>
<text class="c" x="82" y="459">hey setup claude · claude mcp add hey --</text>
<text class="c" x="82" y="478">hey mcp</text>
<rect class="cardT" x="472" y="432" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="432" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="456" r="10"/>
<text class="num" x="494" y="460" text-anchor="middle">5</text>
<text class="ph" x="514" y="461">Set up</text>
<text class="t" x="514" y="478">Installs the embedded skill and serves</text>
<text class="t" x="514" y="500">hey_* MCP tools on your account</text>
<text class="comp" x="514" y="528">component: skill + MCP server</text>
<rect class="card" x="40" y="524" width="368" height="131" rx="8"/>
<rect class="accY" x="40" y="524" width="4" height="131" rx="2"/>
<circle class="accY" cx="62" cy="548" r="10"/>
<text class="num" x="62" y="552" text-anchor="middle">6</text>
<text class="ph" x="82" y="553">Every use</text>
<text class="t" x="82" y="570">Ask the agent to work your mail — or</text>
<text class="t" x="82" y="592">type the commands yourself</text>
<text class="c" x="82" y="616">hey box view imbox · hey reply 12345 -m</text>
<text class="c" x="82" y="635">&quot;Friday works for me.&quot;</text>
<rect class="cardT" x="472" y="589" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="589" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="613" r="10"/>
<text class="num" x="494" y="617" text-anchor="middle">7</text>
<text class="ph" x="514" y="618">Every use</text>
<text class="t" x="514" y="635">Reads come back as Markdown or JSON</text>
<text class="t" x="514" y="657">with --jq; writes carry the keyring</text>
<text class="t" x="514" y="679">token to HEY&#x27;s API</text>
<rect class="val" x="28" y="732" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="756">VALUE</text>
<text class="valT" x="48" y="780">Mail, calendar and contacts become agent-callable — no browser tab, no screen-scraping, no</text>
<text class="valT" x="48" y="802">IMAP wrangling</text>
</svg>
