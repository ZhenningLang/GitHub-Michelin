<svg xmlns="http://www.w3.org/2000/svg" width="880" height="906" viewBox="0 0 880 906" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="906" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="770" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="770" rx="10"/>
<rect class="pillT" x="474" y="40" width="105.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Soup 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,259.5 C439.0,259.5 439.0,283 470,283" marker-end="url(#a)"/>
<path class="edge" d="M494,354 L494,378" marker-end="url(#a)"/>
<path class="edge" d="M494,475 L494,499" marker-end="url(#a)"/>
<path class="hand" d="M472,548.5 C441.0,548.5 441.0,572 410,572" marker-end="url(#a)"/>
<path class="edge" d="M62,662 L62,686" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好带训练 extra 的 CLI，并从模板生</text>
<text class="t" x="82" y="123">成一份配置</text>
<text class="c" x="82" y="147">pipx install &quot;soup-cli[train]&quot; · soup init</text>
<text class="c" x="82" y="166">--template chat</text>
<rect class="card" x="40" y="212" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">填好那一份配置——底座模型、任务、数据文件、L</text>
<text class="t" x="82" y="263">oRA 形状</text>
<text class="c" x="82" y="287">base · task · data.train</text>
<rect class="cardT" x="472" y="259" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="259" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="283" r="10"/>
<text class="num" x="494" y="287" text-anchor="middle">3</text>
<text class="t" x="514" y="288">读这份配置替你定下运行方式——GPU 探测、批大</text>
<text class="t" x="514" y="310">小、量化</text>
<text class="c" x="514" y="334">training.batch_size: auto</text>
<rect class="cardT" x="472" y="380" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="380" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="404" r="10"/>
<text class="num" x="494" y="408" text-anchor="middle">4</text>
<text class="t" x="514" y="409">把冻结底座从主机内存一层层流进显存，而不是</text>
<text class="t" x="514" y="431">整块留在显存里</text>
<text class="c" x="514" y="455">stream_layers: true</text>
<rect class="cardT" x="472" y="501" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="501" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="525" r="10"/>
<text class="num" x="494" y="529" text-anchor="middle">5</text>
<text class="t" x="514" y="530">训练，并写出标准 PEFT adapter 与对</text>
<text class="t" x="514" y="552">应的指标</text>
<text class="c" x="514" y="576">soup train --config soup.yaml</text>
<rect class="card" x="40" y="548" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="548" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="572" r="10"/>
<text class="num" x="62" y="576" text-anchor="middle">6</text>
<text class="t" x="82" y="577">和结果对话，或用 OpenAI 兼容接口把它</text>
<text class="t" x="82" y="599">服务起来</text>
<text class="c" x="82" y="623">soup chat --model ./output · soup serve</text>
<text class="c" x="82" y="642">--model ./output</text>
<rect class="card" x="40" y="688" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="688" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="712" r="10"/>
<text class="num" x="62" y="716" text-anchor="middle">7</text>
<text class="t" x="82" y="717">把 adapter 合并回底座，或按你的运行时导出</text>
<text class="c" x="82" y="741">soup merge --adapter ./output · soup</text>
<text class="c" x="82" y="760">export --model ./output --format gguf</text>
<rect class="val" x="28" y="812" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="836">价值</text>
<text class="valT" x="48" y="860">一份 YAML 把你从 JSONL 文件带到可对话、可服务、可导出的模型——批大小、量化与显存绕行都由它替你决定</text>
</svg>
