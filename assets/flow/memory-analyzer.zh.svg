<svg xmlns="http://www.w3.org/2000/svg" width="880" height="639" viewBox="0 0 880 639" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="639" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="503" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="503" rx="10"/>
<rect class="pillT" x="474" y="40" width="206.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">memory-analyzer 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,242.0 C439.0,242.0 439.0,266 470,266" marker-end="url(#a)"/>
<path class="edge" d="M494,317 L494,341" marker-end="url(#a)"/>
<path class="hand" d="M472,379.0 C441.0,379.0 441.0,403 410,403" marker-end="url(#a)"/>
<path class="hand" d="M408,425.0 C439.0,425.0 439.0,465 470,465" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把两个辅助库装到目标能 import 的位置，放开</text>
<text class="t" x="82" y="123">ptrace</text>
<text class="c" x="82" y="147">objgraph · pympler</text>
<rect class="card" x="40" y="193" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">按 PID 指向那个活进程</text>
<text class="c" x="82" y="246">memory_analyzer run $PID</text>
<text class="comp" x="82" y="269">组件：memory_analyzer 命令行</text>
<rect class="cardT" x="472" y="242" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="242" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="266" r="10"/>
<text class="num" x="494" y="270" text-anchor="middle">3</text>
<text class="t" x="514" y="271">用 GDB 附着，暂停进程及其全部线程</text>
<text class="comp" x="514" y="299">组件：GDB</text>
<rect class="cardT" x="472" y="343" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="343" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="367" r="10"/>
<text class="num" x="494" y="371" text-anchor="middle">4</text>
<text class="t" x="514" y="372">在目标内部按类型清点活对象和大小，存快照文</text>
<text class="t" x="514" y="394">件，放开进程</text>
<rect class="card" x="40" y="379" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="379" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="403" r="10"/>
<text class="num" x="62" y="407" text-anchor="middle">5</text>
<text class="t" x="82" y="408">过一段时间，带上前一次快照对同一 PID 再跑</text>
<text class="c" x="82" y="432">memory_analyzer run $PID --snapshot</text>
<text class="c" x="82" y="451">&lt;previous snapshot file&gt;</text>
<rect class="cardT" x="472" y="441" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="441" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="465" r="10"/>
<text class="num" x="494" y="469" text-anchor="middle">6</text>
<text class="t" x="514" y="470">在终端界面里给出对比页：哪些类型的数量和大</text>
<text class="t" x="514" y="492">小在涨</text>
<rect class="val" x="28" y="545" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="569">价值</text>
<text class="valT" x="48" y="593">不加代码、不重新部署、不重启，就能看到一个运行中的进程里哪类对象在泄漏</text>
</svg>
