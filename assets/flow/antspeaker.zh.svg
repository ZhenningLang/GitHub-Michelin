<svg xmlns="http://www.w3.org/2000/svg" width="880" height="962" viewBox="0 0 880 962" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="962" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="826" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="826" rx="10"/>
<rect class="pillT" x="474" y="40" width="105.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">MECT 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,285 L62,309" marker-end="url(#a)"/>
<path class="edge" d="M62,409 L62,433" marker-end="url(#a)"/>
<path class="edge" d="M62,508 L62,532" marker-end="url(#a)"/>
<path class="hand" d="M408,570.5 C439.0,570.5 439.0,594 470,594" marker-end="url(#a)"/>
<path class="edge" d="M494,667 L494,691" marker-end="url(#a)"/>
<path class="hand" d="M472,741.5 C441.0,741.5 441.0,765 410,765" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装 PyTorch 音频依赖并 clone 仓库（无 </text>
<text class="t" x="82" y="123">pip包）</text>
<text class="c" x="82" y="147">pip install torch torchaudio soundfile</text>
<rect class="card" x="40" y="193" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">从 Hugging Face 下载检查点</text>
<text class="c" x="82" y="246">hf download AntResearch/AntSpeaker</text>
<text class="c" x="82" y="265">mect_b2_vc2.pt --local-dir ./</text>
<rect class="card" x="40" y="311" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">3</text>
<text class="t" x="82" y="340">用检查点里自带的配置把模型原样建出来</text>
<text class="c" x="82" y="364">create_model(ckpt[&quot;config&quot;][&quot;model&quot;])</text>
<text class="comp" x="82" y="387">组件：antspeaker 注册器</text>
<rect class="card" x="40" y="435" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="435" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="459" r="10"/>
<text class="num" x="62" y="463" text-anchor="middle">4</text>
<text class="t" x="82" y="464">把每段音频转成 80 维梅尔滤波器组特征</text>
<text class="c" x="82" y="488">kaldi.fbank(waveform * (1 &lt;&lt; 15), ...)</text>
<rect class="card" x="40" y="534" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="534" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="558" r="10"/>
<text class="num" x="62" y="562" text-anchor="middle">5</text>
<text class="t" x="82" y="563">把特征喂给模型</text>
<text class="c" x="82" y="587">model(fbank.to(device))</text>
<rect class="cardT" x="472" y="570" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="570" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="594" r="10"/>
<text class="num" x="494" y="598" text-anchor="middle">6</text>
<text class="t" x="514" y="599">过 CNN-Transformer 各层，混合专家路由器只</text>
<text class="t" x="514" y="621">激活一部分专家子网络</text>
<text class="comp" x="514" y="649">组件：MECT 主干网络</text>
<rect class="cardT" x="472" y="693" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="693" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="717" r="10"/>
<text class="num" x="494" y="721" text-anchor="middle">7</text>
<text class="t" x="514" y="722">池化后投影成一个定长说话人向量（默认 1</text>
<text class="t" x="514" y="744">92 维）</text>
<text class="comp" x="514" y="772">组件：池化 + 线性头</text>
<rect class="card" x="40" y="741" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="741" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="765" r="10"/>
<text class="num" x="62" y="769" text-anchor="middle">8</text>
<text class="t" x="82" y="770">两段音频各取向量，余弦相似度一比，阈</text>
<text class="t" x="82" y="792">值自己定</text>
<text class="c" x="82" y="816">F.cosine_similarity(emb1, emb2)</text>
<rect class="val" x="28" y="868" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="892">价值</text>
<text class="valT" x="48" y="916">不用训练、不用标注、不用服务栈——声纹比对就是两个向量一次余弦，剩下的唯一旋钮是你自己的阈值</text>
</svg>
