<svg xmlns="http://www.w3.org/2000/svg" width="880" height="907" viewBox="0 0 880 907" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="907" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="749" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="749" rx="10"/>
<rect class="pillT" x="474" y="40" width="322.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Your agent, via program.md, does</text>
<path class="edge" d="M62,214 L62,238" marker-end="url(#a)"/>
<path class="edge" d="M62,335 L62,359" marker-end="url(#a)"/>
<path class="hand" d="M408,397.0 C439.0,397.0 439.0,421 470,421" marker-end="url(#a)"/>
<path class="edge" d="M494,517 L494,541" marker-end="url(#a)"/>
<path class="edge" d="M494,638 L494,662" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="142" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="142" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">On one NVIDIA GPU, install deps,</text>
<text class="t" x="82" y="123">download data and train the tokenizer</text>
<text class="t" x="82" y="145">once</text>
<text class="c" x="82" y="169">uv sync · uv run prepare.py</text>
<text class="comp" x="82" y="192">component: prepare.py (frozen)</text>
<rect class="card" x="40" y="240" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="240" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="264" r="10"/>
<text class="num" x="62" y="268" text-anchor="middle">2</text>
<text class="t" x="82" y="269">Write the research strategy the agent</text>
<text class="t" x="82" y="291">should follow</text>
<text class="c" x="82" y="315">program.md</text>
<rect class="card" x="40" y="361" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="361" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="385" r="10"/>
<text class="num" x="62" y="389" text-anchor="middle">3</text>
<text class="t" x="82" y="390">Start your own coding agent in the</text>
<text class="t" x="82" y="412">repo and point it at program.md</text>
<rect class="cardT" x="472" y="397" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="397" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="421" r="10"/>
<text class="num" x="494" y="425" text-anchor="middle">4</text>
<text class="t" x="514" y="426">Opens a fresh run branch, edits</text>
<text class="t" x="514" y="448">train.py with one idea, commits</text>
<text class="c" x="514" y="472">git checkout -b autoresearch/&lt;tag&gt;</text>
<text class="comp" x="514" y="495">component: train.py</text>
<rect class="cardT" x="472" y="543" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="543" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="567" r="10"/>
<text class="num" x="494" y="571" text-anchor="middle">5</text>
<text class="t" x="514" y="572">Trains for a fixed 5 minutes and reads</text>
<text class="t" x="514" y="594">val_bpb from the log</text>
<text class="c" x="514" y="618">uv run train.py &gt; run.log 2&gt;&amp;1</text>
<rect class="cardT" x="472" y="664" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="664" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="688" r="10"/>
<text class="num" x="494" y="692" text-anchor="middle">6</text>
<text class="t" x="514" y="693">Keeps the commit if val_bpb dropped,</text>
<text class="t" x="514" y="715">else resets; logs the row and loops</text>
<text class="c" x="514" y="739">results.tsv</text>
<rect class="val" x="28" y="791" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="815">VALUE</text>
<text class="valT" x="48" y="839">You wake up to ~100 logged experiments and a branch holding only the changes that lowered</text>
<text class="valT" x="48" y="861">val_bpb</text>
</svg>
