<svg xmlns="http://www.w3.org/2000/svg" width="880" height="732" viewBox="0 0 880 732" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="732" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="596" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="596" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TaskMatrix 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,263 L62,287" marker-end="url(#a)"/>
<path class="hand" d="M408,335.0 C439.0,335.0 439.0,359 470,359" marker-end="url(#a)"/>
<path class="hand" d="M472,383.5 C441.0,383.5 441.0,431 410,431" marker-end="url(#a)"/>
<path class="hand" d="M408,443.5 C439.0,443.5 439.0,482 470,482" marker-end="url(#a)"/>
<path class="edge" d="M494,530 L494,554" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">克隆仓库，建 Python 3.8 环境，装好全部依赖</text>
<text class="c" x="82" y="125">pip install -r requirements.txt</text>
<rect class="card" x="40" y="171" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">导出 OpenAI key，给充当调度者的 LLM 用</text>
<text class="c" x="82" y="224">export</text>
<text class="c" x="82" y="243">OPENAI_API_KEY={Your_Private_Openai_Key}</text>
<rect class="card" x="40" y="289" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="289" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="313" r="10"/>
<text class="num" x="62" y="317" text-anchor="middle">3</text>
<text class="t" x="82" y="318">启动它，指定哪些视觉模型加载到哪块设备</text>
<text class="c" x="82" y="342">python visual_chatgpt.py --load</text>
<text class="c" x="82" y="361">&quot;ImageCaptioning_cuda:0,Text2Image_cuda:0&quot;</text>
<rect class="cardT" x="472" y="335" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="335" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="359" r="10"/>
<text class="num" x="494" y="363" text-anchor="middle">4</text>
<text class="t" x="514" y="364">把这些模型注册成 LangChain 工具，打开</text>
<text class="t" x="514" y="386">Gradio 聊天页</text>
<text class="comp" x="514" y="414">组件：visual_chatgpt.py</text>
<rect class="card" x="40" y="407" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="407" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="431" r="10"/>
<text class="num" x="62" y="435" text-anchor="middle">5</text>
<text class="t" x="82" y="436">上传一张图，用大白话提要求</text>
<text class="c" x="82" y="460">find xxx in the image</text>
<rect class="cardT" x="472" y="458" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="458" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="482" r="10"/>
<text class="num" x="494" y="486" text-anchor="middle">6</text>
<text class="t" x="514" y="487">LLM 读工具清单、选模型、运行，把结果存成</text>
<text class="t" x="514" y="509">image/xxx.png</text>
<rect class="cardT" x="472" y="556" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="556" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="580" r="10"/>
<text class="num" x="494" y="584" text-anchor="middle">7</text>
<text class="t" x="514" y="585">用文字回复，把新图接回对话里</text>
<rect class="val" x="28" y="638" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="662">价值</text>
<text class="valT" x="48" y="686">只懂文字的聊天模型，借专业视觉模型之手也能看图、改图</text>
</svg>
