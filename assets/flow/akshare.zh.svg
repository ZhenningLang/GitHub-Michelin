<svg xmlns="http://www.w3.org/2000/svg" width="880" height="681" viewBox="0 0 880 681" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="681" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="545" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="545" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">AKShare 做的</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="hand" d="M408,245.0 C439.0,245.0 439.0,269 470,269" marker-end="url(#a)"/>
<path class="hand" d="M472,282.5 C441.0,282.5 441.0,344 410,344" marker-end="url(#a)"/>
<path class="hand" d="M408,357.5 C439.0,357.5 439.0,381 470,381" marker-end="url(#a)"/>
<path class="edge" d="M494,454 L494,478" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">安装这个库</text>
<text class="c" x="82" y="125">pip install akshare --upgrade</text>
<text class="comp" x="82" y="148">组件：PyPI 包</text>
<rect class="card" x="40" y="196" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">按关键词离线查接口名，不发网络请求</text>
<text class="c" x="82" y="249">ak.search(&quot;可转债 实时行情&quot;, limit=5)</text>
<text class="comp" x="82" y="272">组件：接口注册表</text>
<rect class="cardT" x="472" y="245" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="245" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="269" r="10"/>
<text class="num" x="494" y="273" text-anchor="middle">3</text>
<text class="t" x="514" y="274">注册表返回接口名、参数与输出列</text>
<text class="comp" x="514" y="302">组件：接口注册表</text>
<rect class="card" x="40" y="320" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="320" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="344" r="10"/>
<text class="num" x="62" y="348" text-anchor="middle">4</text>
<text class="t" x="82" y="349">带上参数调用刚找到的接口</text>
<text class="comp" x="82" y="377">组件：接口函数</text>
<rect class="cardT" x="472" y="357" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="357" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="381" r="10"/>
<text class="num" x="494" y="385" text-anchor="middle">5</text>
<text class="t" x="514" y="386">抓取上游公开页面/API，裸客户端被拒时伪装成</text>
<text class="t" x="514" y="408">浏览器</text>
<text class="comp" x="514" y="436">组件：curl_cffi + JS 运行时</text>
<rect class="cardT" x="472" y="480" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="480" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="504" r="10"/>
<text class="num" x="494" y="508" text-anchor="middle">6</text>
<text class="t" x="514" y="509">解析成列名为中文的 pandas DataFrame</text>
<text class="comp" x="514" y="537">组件：接口函数</text>
<rect class="val" x="28" y="587" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="611">价值</text>
<text class="valT" x="48" y="635">免 Key、免账号：一次调用拿到一份 DataFrame——代价是上游改版带来的失效风险</text>
</svg>
