<svg xmlns="http://www.w3.org/2000/svg" width="880" height="819" viewBox="0 0 880 819" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="819" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="661" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="661" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Kombu does</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="hand" d="M408,273.5 C439.0,273.5 439.0,297 470,297" marker-end="url(#a)"/>
<path class="hand" d="M472,332.5 C441.0,332.5 441.0,401 410,401" marker-end="url(#a)"/>
<path class="hand" d="M408,434.0 C439.0,434.0 439.0,458 470,458" marker-end="url(#a)"/>
<path class="hand" d="M472,470.0 C441.0,470.0 441.0,541 410,541" marker-end="url(#a)"/>
<path class="hand" d="M408,577.0 C439.0,577.0 439.0,601 470,601" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install Kombu into your Python service</text>
<text class="c" x="82" y="125">pip install kombu</text>
<text class="comp" x="82" y="148">component: application environment</text>
<rect class="card" x="40" y="196" width="368" height="155" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="155" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">Declare exchanges and queues as Python</text>
<text class="t" x="82" y="247">objects, then open one Connection by</text>
<text class="t" x="82" y="269">URL</text>
<text class="c" x="82" y="293">with</text>
<text class="c" x="82" y="312">Connection(&#x27;amqp://guest:guest@localhost//</text>
<text class="c" x="82" y="331">&#x27;) as conn:</text>
<rect class="cardT" x="472" y="273" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="273" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="297" r="10"/>
<text class="num" x="494" y="301" text-anchor="middle">3</text>
<text class="t" x="514" y="302">The same transport interface serves</text>
<text class="t" x="514" y="324">amqp://, redis:// or sqs:// behind the</text>
<text class="t" x="514" y="346">URL</text>
<text class="comp" x="514" y="374">component: transport layer</text>
<rect class="card" x="40" y="377" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="377" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="401" r="10"/>
<text class="num" x="62" y="405" text-anchor="middle">4</text>
<text class="t" x="82" y="406">Publish through a Producer, declaring</text>
<text class="t" x="82" y="428">the queue with the message</text>
<text class="c" x="82" y="452">producer =</text>
<text class="c" x="82" y="471">conn.Producer(serializer=&#x27;json&#x27;)</text>
<rect class="cardT" x="472" y="434" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="434" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="458" r="10"/>
<text class="num" x="494" y="462" text-anchor="middle">5</text>
<text class="t" x="514" y="463">Serializes the payload and routes it</text>
<text class="t" x="514" y="485">to the bound queue</text>
<rect class="card" x="40" y="517" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="517" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="541" r="10"/>
<text class="num" x="62" y="545" text-anchor="middle">6</text>
<text class="t" x="82" y="546">Consume with a callback list plus an</text>
<text class="t" x="82" y="568">event loop</text>
<text class="c" x="82" y="592">conn.drain_events()</text>
<text class="comp" x="82" y="615">component: Consumer</text>
<rect class="cardT" x="472" y="577" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="577" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="601" r="10"/>
<text class="num" x="494" y="605" text-anchor="middle">7</text>
<text class="t" x="514" y="606">Delivers each message to your</text>
<text class="t" x="514" y="628">callback; your message.ack() confirms</text>
<text class="t" x="514" y="650">it</text>
<rect class="val" x="28" y="703" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="727">VALUE</text>
<text class="valT" x="48" y="751">One producer/consumer API across AMQP, Redis, SQS and more — moving brokers is a URL change,</text>
<text class="valT" x="48" y="773">not a rewrite</text>
</svg>
