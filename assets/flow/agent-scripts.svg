<svg xmlns="http://www.w3.org/2000/svg" width="880" height="817" viewBox="0 0 880 817" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="817" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="659" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="659" rx="10"/>
<rect class="pillT" x="474" y="40" width="193.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">agent-scripts does</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="edge" d="M494,229 L494,253" marker-end="url(#a)"/>
<path class="hand" d="M472,315.0 C441.0,315.0 441.0,339 410,339" marker-end="url(#a)"/>
<path class="hand" d="M408,395.5 C439.0,395.5 439.0,425 470,425" marker-end="url(#a)"/>
<path class="hand" d="M472,460.5 C441.0,460.5 441.0,526 410,526" marker-end="url(#a)"/>
<path class="hand" d="M408,550.5 C439.0,550.5 439.0,574 470,574" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone the repo to the path its scripts</text>
<text class="t" x="82" y="123">expect, then run the sync script</text>
<text class="c" x="82" y="147">scripts/sync-skills</text>
<text class="comp" x="82" y="170">component: sync-skills (bash)</text>
<rect class="cardT" x="472" y="132" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">Links skills/ into Codex whole, and</text>
<text class="t" x="514" y="183">into Claude Code one skill at a time</text>
<text class="comp" x="514" y="211">component: symlink mirror</text>
<rect class="cardT" x="472" y="255" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="255" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="279" r="10"/>
<text class="num" x="494" y="283" text-anchor="middle">3</text>
<text class="t" x="514" y="284">Points each agent&#x27;s global instruction</text>
<text class="t" x="514" y="306">file at the one shared AGENTS.MD</text>
<text class="c" x="514" y="330">~/.claude/CLAUDE.md · ~/.codex/AGENTS.md</text>
<text class="comp" x="514" y="353">component: AGENTS.MD</text>
<rect class="card" x="40" y="315" width="368" height="161" rx="8"/>
<rect class="accY" x="40" y="315" width="4" height="161" rx="2"/>
<circle class="accY" cx="62" cy="339" r="10"/>
<text class="num" x="62" y="343" text-anchor="middle">4</text>
<text class="t" x="82" y="344">Start each downstream repo&#x27;s AGENTS.MD</text>
<text class="t" x="82" y="366">with the pointer line; repo rules go</text>
<text class="t" x="82" y="388">below it</text>
<text class="c" x="82" y="412">READ ~/Projects/agent-scripts/AGENTS.MD</text>
<text class="c" x="82" y="431">BEFORE ANYTHING (skip if missing).</text>
<text class="comp" x="82" y="454">component: downstream AGENTS.MD</text>
<rect class="cardT" x="472" y="401" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="401" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="425" r="10"/>
<text class="num" x="494" y="429" text-anchor="middle">5</text>
<text class="t" x="514" y="430">The agent reads the shared rules, then</text>
<text class="t" x="514" y="452">loads a skill when its description</text>
<text class="t" x="514" y="474">matches the task</text>
<text class="comp" x="514" y="502">component: SKILL.md descriptions</text>
<rect class="card" x="40" y="502" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="502" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="526" r="10"/>
<text class="num" x="62" y="530" text-anchor="middle">6</text>
<text class="t" x="82" y="531">Edit a rule or skill once in the repo</text>
<text class="t" x="82" y="553">and push</text>
<text class="comp" x="82" y="581">component: validate-skills hook</text>
<rect class="cardT" x="472" y="550" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="550" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="574" r="10"/>
<text class="num" x="494" y="578" text-anchor="middle">7</text>
<text class="t" x="514" y="579">Every linked agent and repo sees the</text>
<text class="t" x="514" y="601">change on its next session, no copies</text>
<text class="t" x="514" y="623">to update</text>
<text class="comp" x="514" y="651">component: symlink mirror</text>
<rect class="val" x="28" y="701" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="725">VALUE</text>
<text class="valT" x="48" y="749">One edit updates the rules and skills every agent in every repo reads, instead of a dozen</text>
<text class="valT" x="48" y="771">drifting copies</text>
</svg>
