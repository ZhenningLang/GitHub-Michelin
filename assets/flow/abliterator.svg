<svg xmlns="http://www.w3.org/2000/svg" width="880" height="708" viewBox="0 0 880 708" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="708" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="550" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="550" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">abliterator does</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="hand" d="M408,217.5 C439.0,217.5 439.0,241 470,241" marker-end="url(#a)"/>
<path class="edge" d="M494,314 L494,338" marker-end="url(#a)"/>
<path class="hand" d="M472,388.5 C441.0,388.5 441.0,412 410,412" marker-end="url(#a)"/>
<path class="hand" d="M408,435.5 C439.0,435.5 439.0,487 470,487" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the library and its</text>
<text class="t" x="82" y="123">TransformerLens dependency</text>
<rect class="card" x="40" y="170" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">Load a model plus harmful/harmless</text>
<text class="t" x="82" y="221">datasets</text>
<text class="c" x="82" y="245">ModelAbliterator(...)</text>
<rect class="cardT" x="472" y="217" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="217" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="241" r="10"/>
<text class="num" x="494" y="245" text-anchor="middle">3</text>
<text class="t" x="514" y="246">Caches residual-stream activations for</text>
<text class="t" x="514" y="268">N harmful and N harmless samples</text>
<text class="comp" x="514" y="296">component: ModelAbliterator</text>
<rect class="cardT" x="472" y="340" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="340" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="364" r="10"/>
<text class="num" x="494" y="368" text-anchor="middle">4</text>
<text class="t" x="514" y="369">Derives a difference-of-means refusal</text>
<text class="t" x="514" y="391">direction per hook point</text>
<text class="comp" x="514" y="419">component: refusal_dirs()</text>
<rect class="card" x="40" y="388" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="388" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="412" r="10"/>
<text class="num" x="62" y="416" text-anchor="middle">5</text>
<text class="t" x="82" y="417">Score candidate directions against the</text>
<text class="t" x="82" y="439">test set</text>
<text class="c" x="82" y="463">test_dir(testing_dir, N=32)</text>
<rect class="cardT" x="472" y="463" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="463" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="487" r="10"/>
<text class="num" x="494" y="491" text-anchor="middle">6</text>
<text class="t" x="514" y="492">Patches the chosen direction into the</text>
<text class="t" x="514" y="514">weights</text>
<text class="comp" x="514" y="542">component: apply_refusal_dirs()</text>
<rect class="val" x="28" y="592" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="616">VALUE</text>
<text class="valT" x="48" y="640">You get to search and compare refusal directions yourself, without rebuilding the</text>
<text class="valT" x="48" y="662">activation-caching scaffolding</text>
</svg>
