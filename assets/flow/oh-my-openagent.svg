<svg xmlns="http://www.w3.org/2000/svg" width="880" height="862" viewBox="0 0 880 862" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="862" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="704" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="704" rx="10"/>
<rect class="pillT" x="474" y="40" width="101.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OmO does</text>
<path class="hand" d="M408,117.0 C439.0,117.0 439.0,141 470,141" marker-end="url(#a)"/>
<path class="hand" d="M472,172.5 C441.0,172.5 441.0,212 410,212" marker-end="url(#a)"/>
<path class="hand" d="M408,244.0 C439.0,244.0 439.0,278 470,278" marker-end="url(#a)"/>
<path class="hand" d="M472,322.0 C441.0,322.0 441.0,350 410,350" marker-end="url(#a)"/>
<path class="hand" d="M408,382.0 C439.0,382.0 439.0,440 470,440" marker-end="url(#a)"/>
<path class="edge" d="M494,552 L494,576" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Set up</text>
<text class="t" x="82" y="118">Install the standalone CLI</text>
<text class="c" x="82" y="142">bun add -g omo-ai · npm i -g omo-ai</text>
<rect class="cardT" x="472" y="117" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="117" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="141" r="10"/>
<text class="num" x="494" y="145" text-anchor="middle">2</text>
<text class="ph" x="514" y="146">Set up</text>
<text class="t" x="514" y="163">Ships the omo TUI with delegation</text>
<text class="t" x="514" y="185">categories, skills, and memory wired</text>
<text class="t" x="514" y="207">in</text>
<rect class="card" x="40" y="188" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="188" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="212" r="10"/>
<text class="num" x="62" y="216" text-anchor="middle">3</text>
<text class="ph" x="82" y="217">Set up</text>
<text class="t" x="82" y="234">Start it in your project and sign in</text>
<text class="t" x="82" y="256">to your subscriptions</text>
<text class="c" x="82" y="280">omo · /login</text>
<rect class="cardT" x="472" y="254" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="254" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="278" r="10"/>
<text class="num" x="494" y="282" text-anchor="middle">4</text>
<text class="ph" x="514" y="283">Set up</text>
<text class="t" x="514" y="300">Stores provider logins and maps each</text>
<text class="t" x="514" y="322">task category to a model fallback</text>
<text class="t" x="514" y="344">chain</text>
<text class="comp" x="514" y="372">component: model chains</text>
<rect class="card" x="40" y="326" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="326" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="350" r="10"/>
<text class="num" x="62" y="354" text-anchor="middle">5</text>
<text class="ph" x="82" y="355">Every task</text>
<text class="t" x="82" y="372">Describe the job and escalate it with</text>
<text class="t" x="82" y="394">a keyword</text>
<text class="c" x="82" y="418">ulw · mass ulw</text>
<rect class="cardT" x="472" y="416" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="416" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="440" r="10"/>
<text class="num" x="494" y="444" text-anchor="middle">6</text>
<text class="ph" x="514" y="445">Every task</text>
<text class="t" x="514" y="462">Explores, plans in a notepad, and</text>
<text class="t" x="514" y="484">spawns one worker per sub-task by</text>
<text class="t" x="514" y="506">category</text>
<text class="comp" x="514" y="534">component: task tool</text>
<rect class="cardT" x="472" y="578" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="578" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="602" r="10"/>
<text class="num" x="494" y="606" text-anchor="middle">7</text>
<text class="ph" x="514" y="607">Every task</text>
<text class="t" x="514" y="624">Verifies each result before it counts</text>
<text class="t" x="514" y="646">as done; durable notes persist for the</text>
<text class="t" x="514" y="668">next session</text>
<text class="comp" x="514" y="696">component: ulw-execute + Kibitzer</text>
<rect class="val" x="28" y="746" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="770">VALUE</text>
<text class="valT" x="48" y="794">You hand over whole jobs instead of prompts: work fans out across models, gets verified</text>
<text class="valT" x="48" y="816">before it counts as done, and memory carries into the next session</text>
</svg>
