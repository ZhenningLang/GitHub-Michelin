<svg xmlns="http://www.w3.org/2000/svg" width="880" height="692" viewBox="0 0 880 692" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="692" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="556" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="556" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">AirLLM 做的</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="hand" d="M408,253.0 C439.0,253.0 439.0,277 470,277" marker-end="url(#a)"/>
<path class="hand" d="M472,290.5 C441.0,290.5 441.0,360 410,360" marker-end="url(#a)"/>
<path class="hand" d="M408,393.0 C439.0,393.0 439.0,417 470,417" marker-end="url(#a)"/>
<path class="edge" d="M494,490 L494,514" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把包装进你的 Python 环境</text>
<text class="c" x="82" y="125">pip install airllm</text>
<text class="comp" x="82" y="148">组件：PyPI 包</text>
<rect class="card" x="40" y="196" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">用 AutoModel 指向 HF 仓库 id 或本地</text>
<text class="t" x="82" y="247">模型路径</text>
<text class="c" x="82" y="271">AutoModel.from_pretrained(&quot;Qwen/Qwen3-32B&quot;</text>
<text class="c" x="82" y="290">)</text>
<rect class="cardT" x="472" y="253" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="253" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="277" r="10"/>
<text class="num" x="494" y="281" text-anchor="middle">3</text>
<text class="t" x="514" y="282">把检查点按层切成一个个分片落盘，仅首次运行</text>
<text class="comp" x="514" y="310">组件：分层切分器</text>
<rect class="card" x="40" y="336" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="336" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="360" r="10"/>
<text class="num" x="62" y="364" text-anchor="middle">4</text>
<text class="t" x="82" y="365">照常分词并调 generate，与普通</text>
<text class="t" x="82" y="387">transformers 写法一致</text>
<text class="c" x="82" y="411">model.generate(input_tokens[&#x27;input_ids&#x27;].c</text>
<text class="c" x="82" y="430">uda(), max_new_tokens=20)</text>
<rect class="cardT" x="472" y="393" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="393" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="417" r="10"/>
<text class="num" x="494" y="421" text-anchor="middle">5</text>
<text class="t" x="514" y="422">每层轮到它之前才从磁盘载入设备，算完</text>
<text class="t" x="514" y="444">立刻释放</text>
<text class="comp" x="514" y="472">组件：流式 hook</text>
<rect class="cardT" x="472" y="516" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="516" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="540" r="10"/>
<text class="num" x="494" y="544" text-anchor="middle">6</text>
<text class="t" x="514" y="545">由 transformers 跑真正的前向并返回序列</text>
<rect class="val" x="28" y="598" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="622">价值</text>
<text class="valT" x="48" y="646">不用量化、不用转换格式就能跑远超显存的大模型，代价是磁盘空间与每秒级的等待</text>
</svg>
