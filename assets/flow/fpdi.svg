<svg xmlns="http://www.w3.org/2000/svg" width="880" height="647" viewBox="0 0 880 647" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="647" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="511" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="511" rx="10"/>
<rect class="pillT" x="474" y="40" width="110.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">FPDI does</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="hand" d="M408,278.0 C439.0,278.0 439.0,302 470,302" marker-end="url(#a)"/>
<path class="hand" d="M472,326.5 C441.0,326.5 441.0,388 410,388" marker-end="url(#a)"/>
<path class="hand" d="M408,424.0 C439.0,424.0 439.0,448 470,448" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add FPDI and one supported PDF writer</text>
<text class="t" x="82" y="123">to the PHP application</text>
<text class="c" x="82" y="147">setasign/fpdi · setasign/fpdf</text>
<text class="comp" x="82" y="170">component: Composer dependencies</text>
<rect class="card" x="40" y="218" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">Create the FPDI class and select a</text>
<text class="t" x="82" y="269">source page</text>
<text class="c" x="82" y="293">new Fpdi() · importPage(1)</text>
<text class="comp" x="82" y="316">component: application code</text>
<rect class="cardT" x="472" y="278" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="278" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="302" r="10"/>
<text class="num" x="494" y="306" text-anchor="middle">3</text>
<text class="t" x="514" y="307">Parses the page and imports its</text>
<text class="t" x="514" y="329">content as a reusable template</text>
<text class="comp" x="514" y="357">component: FPDI parser</text>
<rect class="card" x="40" y="364" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="364" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="388" r="10"/>
<text class="num" x="62" y="392" text-anchor="middle">4</text>
<text class="t" x="82" y="393">Place the template and draw any new</text>
<text class="t" x="82" y="415">document content</text>
<text class="c" x="82" y="439">useTemplate($tplId, 10, 10, 100)</text>
<text class="comp" x="82" y="462">component: FPDF-family writer</text>
<rect class="cardT" x="472" y="424" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="424" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="448" r="10"/>
<text class="num" x="494" y="452" text-anchor="middle">5</text>
<text class="t" x="514" y="453">Writes the composed pages as a newly</text>
<text class="t" x="514" y="475">generated PDF</text>
<text class="comp" x="514" y="503">component: FPDF-family writer</text>
<rect class="val" x="28" y="553" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="577">VALUE</text>
<text class="valT" x="48" y="601">Existing PDF pages become reusable building blocks in a PHP-generated document</text>
</svg>
