<svg xmlns="http://www.w3.org/2000/svg" width="880" height="677" viewBox="0 0 880 677" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="677" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="541" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="541" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">PinchTab 做的</text>
<path class="hand" d="M408,108.5 C439.0,108.5 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,145.5 C441.0,145.5 441.0,195 410,195" marker-end="url(#a)"/>
<path class="edge" d="M62,269 L62,293" marker-end="url(#a)"/>
<path class="hand" d="M408,331.5 C439.0,331.5 439.0,355 470,355" marker-end="url(#a)"/>
<path class="hand" d="M472,379.5 C441.0,379.5 441.0,418 410,418" marker-end="url(#a)"/>
<path class="hand" d="M408,430.5 C439.0,430.5 439.0,478 470,478" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上 Go 单二进制，把它注册成后台守护进程</text>
<text class="c" x="82" y="125">pinchtab daemon install</text>
<rect class="cardT" x="472" y="108" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">起一个带令牌的控制面服务和默认无头 Chrome</text>
<text class="comp" x="514" y="165">组件：控制面服务</text>
<rect class="card" x="40" y="171" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">3</text>
<text class="t" x="82" y="200">把随包附带的技能装进 agent 的技能目录</text>
<text class="c" x="82" y="224">pinchtab skill update</text>
<text class="comp" x="82" y="247">组件：agent 技能</text>
<rect class="card" x="40" y="295" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="295" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="319" r="10"/>
<text class="num" x="62" y="323" text-anchor="middle">4</text>
<text class="t" x="82" y="324">一次调用完成导航加快照</text>
<text class="c" x="82" y="348">pinchtab nav https://pinchtab.com --snap</text>
<rect class="cardT" x="472" y="331" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="331" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="355" r="10"/>
<text class="num" x="494" y="359" text-anchor="middle">5</text>
<text class="t" x="514" y="360">通过 CDP 驱动 Chrome，返回文本快照——每个</text>
<text class="t" x="514" y="382">可交互元素带一个引用</text>
<text class="comp" x="514" y="410">组件：快照引用</text>
<rect class="card" x="40" y="394" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="394" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="418" r="10"/>
<text class="num" x="62" y="422" text-anchor="middle">6</text>
<text class="t" x="82" y="423">对着引用动手，而不是对着选择器</text>
<text class="c" x="82" y="447">pinchtab click e5</text>
<rect class="cardT" x="472" y="454" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="454" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="478" r="10"/>
<text class="num" x="494" y="482" text-anchor="middle">7</text>
<text class="t" x="514" y="483">配置档把 cookie 和存储留在磁盘上，登录态跨</text>
<text class="t" x="514" y="505">重启存活</text>
<text class="comp" x="514" y="533">组件：配置档</text>
<rect class="val" x="28" y="583" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="607">价值</text>
<text class="valT" x="48" y="631">每一步浏览器操作只是一次文本往返——不用读截图，不用维护选择器，浏览器还一直热着</text>
</svg>
