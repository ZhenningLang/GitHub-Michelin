<svg xmlns="http://www.w3.org/2000/svg" width="880" height="746" viewBox="0 0 880 746" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="746" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="610" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="610" rx="10"/>
<rect class="pillT" x="474" y="40" width="215.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">AutoGPT Platform 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="edge" d="M62,287 L62,311" marker-end="url(#a)"/>
<path class="hand" d="M408,338.0 C439.0,338.0 439.0,373 470,373" marker-end="url(#a)"/>
<path class="edge" d="M494,424 L494,448" marker-end="url(#a)"/>
<path class="edge" d="M494,522 L494,546" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">启动自托管平台（或注册托管版）</text>
<text class="c" x="82" y="125">make init-env · docker compose up -d</text>
<text class="c" x="82" y="144">--build</text>
<rect class="card" x="40" y="190" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">把活描述给 AutoPilot，或在 Build 画布上拖</text>
<text class="t" x="82" y="241">积木块、连接口</text>
<text class="comp" x="82" y="269">组件：AutoPilot / 构建器</text>
<rect class="card" x="40" y="313" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="313" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="337" r="10"/>
<text class="num" x="62" y="341" text-anchor="middle">3</text>
<text class="t" x="82" y="342">一次配好应用凭据，给 agent 设定时</text>
<rect class="cardT" x="472" y="349" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="349" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="373" r="10"/>
<text class="num" x="494" y="377" text-anchor="middle">4</text>
<text class="t" x="514" y="378">到点或收到 webhook，把一次运行排给执行器</text>
<text class="comp" x="514" y="406">组件：调度器 + 执行器</text>
<rect class="cardT" x="472" y="450" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="450" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="474" r="10"/>
<text class="num" x="494" y="478" text-anchor="middle">5</text>
<text class="t" x="514" y="479">每个块的必填输入一到齐就执行，互不依赖的分</text>
<text class="t" x="514" y="501">支并行</text>
<rect class="cardT" x="472" y="548" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="548" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="572" r="10"/>
<text class="num" x="494" y="576" text-anchor="middle">6</text>
<text class="t" x="514" y="577">在 Agents 面板记下每次运行的产出、成</text>
<text class="t" x="514" y="599">本和状态</text>
<rect class="val" x="28" y="652" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="676">价值</text>
<text class="valT" x="48" y="700">反复出现的跨应用杂活自己跑完，你只看结果</text>
</svg>
