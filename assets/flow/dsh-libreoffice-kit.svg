<svg xmlns="http://www.w3.org/2000/svg" width="880" height="653" viewBox="0 0 880 653" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="653" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="495" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="495" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">the kit does</text>
<path class="hand" d="M408,118.0 C439.0,118.0 439.0,142 470,142" marker-end="url(#a)"/>
<path class="hand" d="M472,177.5 C441.0,177.5 441.0,214 410,214" marker-end="url(#a)"/>
<path class="hand" d="M408,237.5 C439.0,237.5 439.0,287 470,287" marker-end="url(#a)"/>
<path class="hand" d="M472,311.5 C441.0,311.5 441.0,335 410,335" marker-end="url(#a)"/>
<path class="hand" d="M408,358.0 C439.0,358.0 439.0,410 470,410" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add the package to your Node app</text>
<text class="c" x="82" y="125">npm install</text>
<text class="c" x="82" y="144">@deepseek-ai/libreoffice-kit@0.1.3</text>
<rect class="cardT" x="472" y="118" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="118" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="142" r="10"/>
<text class="num" x="494" y="146" text-anchor="middle">2</text>
<text class="t" x="514" y="147">npm pulls only your platform&#x27;s</text>
<text class="t" x="514" y="169">prebuilt engine: native on</text>
<text class="t" x="514" y="191">macOS/Windows, WASM on Linux</text>
<text class="comp" x="514" y="219">component: platform engine package</text>
<rect class="card" x="40" y="190" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">3</text>
<text class="t" x="82" y="219">Create a converter, optionally naming</text>
<text class="t" x="82" y="241">your font directories</text>
<text class="c" x="82" y="265">createConverter({ timeoutMs: 120_000 })</text>
<rect class="cardT" x="472" y="263" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="263" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="287" r="10"/>
<text class="num" x="494" y="291" text-anchor="middle">4</text>
<text class="t" x="514" y="292">Indexes the fonts it may use and</text>
<text class="t" x="514" y="314">caches their metadata on disk</text>
<text class="comp" x="514" y="342">component: Node API (fontkit)</text>
<rect class="card" x="40" y="311" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">5</text>
<text class="t" x="82" y="340">Call render with an absolute input</text>
<text class="t" x="82" y="362">path and a not-yet-existing output</text>
<text class="t" x="82" y="384">path</text>
<rect class="cardT" x="472" y="386" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="386" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="410" r="10"/>
<text class="num" x="494" y="414" text-anchor="middle">6</text>
<text class="t" x="514" y="415">Starts a fresh private engine, writes</text>
<text class="t" x="514" y="437">the PDF, returns the backend used and</text>
<text class="t" x="514" y="459">missing fonts</text>
<text class="comp" x="514" y="487">component: native helper or WASM worker</text>
<rect class="val" x="28" y="537" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="561">VALUE</text>
<text class="valT" x="48" y="585">Office files become PDFs inside your Node process with no LibreOffice install or soffice</text>
<text class="valT" x="48" y="607">babysitting, and you learn which requested fonts were missing</text>
</svg>
