<svg xmlns="http://www.w3.org/2000/svg" width="880" height="609" viewBox="0 0 880 609" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="609" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="473" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="473" rx="10"/>
<rect class="pillT" x="474" y="40" width="216.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">遵循 mono-color 的助手</text>
<path class="edge" d="M62,147 L62,171" marker-end="url(#a)"/>
<path class="hand" d="M408,198.0 C439.0,198.0 439.0,233 470,233" marker-end="url(#a)"/>
<path class="edge" d="M494,284 L494,308" marker-end="url(#a)"/>
<path class="edge" d="M494,385 L494,409" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">审阅技能，放入宿主技能目录并重启</text>
<text class="comp" x="82" y="129">组件：技能指令与设计目录</text>
<rect class="card" x="40" y="173" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="173" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="197" r="10"/>
<text class="num" x="62" y="201" text-anchor="middle">2</text>
<text class="t" x="82" y="202">提供主题或授权照片、准确文案和单色要求</text>
<rect class="cardT" x="472" y="209" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="209" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="233" r="10"/>
<text class="num" x="494" y="237" text-anchor="middle">3</text>
<text class="t" x="514" y="238">确定配方并编成五段生图提示词</text>
<text class="comp" x="514" y="266">组件：技能指令</text>
<rect class="cardT" x="472" y="310" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="310" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="334" r="10"/>
<text class="num" x="494" y="338" text-anchor="middle">4</text>
<text class="t" x="514" y="339">使用已有生图工具，否则说明只交提示词</text>
<text class="comp" x="514" y="367">组件：宿主生图工具</text>
<rect class="cardT" x="472" y="411" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="411" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="435" r="10"/>
<text class="num" x="494" y="439" text-anchor="middle">5</text>
<text class="t" x="514" y="440">检查图片，失败重试一次，交付图片、提</text>
<text class="t" x="514" y="462">示与配方</text>
<rect class="val" x="28" y="515" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="539">价值</text>
<text class="valT" x="48" y="563">不必每次重新拼装油墨、裁切与字体要求</text>
</svg>
