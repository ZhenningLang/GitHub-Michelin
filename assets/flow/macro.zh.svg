<svg xmlns="http://www.w3.org/2000/svg" width="880" height="691" viewBox="0 0 880 691" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="691" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="555" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="555" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Macro 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,228.0 C439.0,228.0 439.0,252 470,252" marker-end="url(#a)"/>
<path class="hand" d="M472,276.5 C441.0,276.5 441.0,335 410,335" marker-end="url(#a)"/>
<path class="edge" d="M62,406 L62,430" marker-end="url(#a)"/>
<path class="hand" d="M408,468.0 C439.0,468.0 439.0,492 470,492" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">克隆单体仓库，进入钉好版本的 Nix 开发环境</text>
<text class="c" x="82" y="125">nix develop</text>
<rect class="card" x="40" y="171" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">启动本地整套服务，并传入 Google OAuth 密</text>
<text class="t" x="82" y="222">钥以便接入 Gmail</text>
<text class="c" x="82" y="246">just run_local --no-doppler --env-file</text>
<text class="c" x="82" y="265">./local.env</text>
<rect class="cardT" x="472" y="228" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="228" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="252" r="10"/>
<text class="num" x="494" y="256" text-anchor="middle">3</text>
<text class="t" x="514" y="257">编译 Rust 服务，拉起数据库、搜索、队列和登</text>
<text class="t" x="514" y="279">录服务，打印地址</text>
<text class="comp" x="514" y="307">组件：run_local 启动器</text>
<rect class="card" x="40" y="311" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">4</text>
<text class="t" x="82" y="340">用任意邮箱登录，一次性验证码投到本地</text>
<text class="t" x="82" y="362">Mailpit 收件箱</text>
<text class="c" x="82" y="386">http://localhost:8025</text>
<rect class="card" x="40" y="432" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="432" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="456" r="10"/>
<text class="num" x="62" y="460" text-anchor="middle">5</text>
<text class="t" x="82" y="461">在频道消息里 @ 一封邮件、一篇文档、一个任务</text>
<text class="t" x="82" y="483">或一个客户记录</text>
<rect class="cardT" x="472" y="468" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="468" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="492" r="10"/>
<text class="num" x="494" y="496" text-anchor="middle">6</text>
<text class="t" x="514" y="497">记下双向链接，并把被 @ 的东西共享给频</text>
<text class="t" x="514" y="519">道全体成员</text>
<text class="comp" x="514" y="547">组件：共享后端关系图</text>
<rect class="val" x="28" y="597" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="621">价值</text>
<text class="valT" x="48" y="645">邮件、聊天、文档、任务、客户记录在同一个库里互相指向，不再在五个工具之间贴链接、等别人开权限</text>
</svg>
