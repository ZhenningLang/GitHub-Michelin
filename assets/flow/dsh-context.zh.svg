<svg xmlns="http://www.w3.org/2000/svg" width="880" height="573" viewBox="0 0 880 573" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="573" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="437" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="437" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">dsh-context 做的</text>
<path class="hand" d="M408,129.0 C439.0,129.0 439.0,153 470,153" marker-end="url(#a)"/>
<path class="hand" d="M472,177.5 C441.0,177.5 441.0,236 410,236" marker-end="url(#a)"/>
<path class="hand" d="M408,237.0 C439.0,237.0 439.0,276 470,276" marker-end="url(#a)"/>
<path class="hand" d="M472,300.5 C441.0,300.5 441.0,324 410,324" marker-end="url(#a)"/>
<path class="hand" d="M408,336.5 C439.0,336.5 439.0,399 470,399" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把插件装进 dsh 的 web profile，再启动</text>
<text class="t" x="82" y="123">Web UI</text>
<text class="c" x="82" y="147">dsh plugin --profile web add dsh-context ·</text>
<text class="c" x="82" y="166">dsh web</text>
<rect class="cardT" x="472" y="129" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="129" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="153" r="10"/>
<text class="num" x="494" y="157" text-anchor="middle">2</text>
<text class="t" x="514" y="158">注册投影单元，把会话每个事件折叠成逐请求的</text>
<text class="t" x="514" y="180">上下文时间线</text>
<text class="comp" x="514" y="208">组件：宿主端 Cordis 插件</text>
<rect class="card" x="40" y="212" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">3</text>
<text class="t" x="82" y="241">照常在会话里干活</text>
<rect class="cardT" x="472" y="252" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="252" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="276" r="10"/>
<text class="num" x="494" y="280" text-anchor="middle">4</text>
<text class="t" x="514" y="281">在“对话”旁显示 Context 标签页，另加右侧栏</text>
<text class="t" x="514" y="303">面板和仪表盘入口</text>
<text class="comp" x="514" y="331">组件：Web 客户端包</text>
<rect class="card" x="40" y="300" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="300" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="324" r="10"/>
<text class="num" x="62" y="328" text-anchor="middle">5</text>
<text class="t" x="82" y="329">输入斜杠命令，或打开 Context 标签页</text>
<text class="c" x="82" y="353">/context</text>
<rect class="cardT" x="472" y="375" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="375" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="399" r="10"/>
<text class="num" x="494" y="403" text-anchor="middle">6</text>
<text class="t" x="514" y="404">把每次请求拆成组成部分并标出 token 价，压</text>
<text class="t" x="514" y="426">缩和剪枝事件都钉在图上</text>
<rect class="val" x="28" y="479" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="503">价值</text>
<text class="valT" x="48" y="527">不翻会话日志，就能看清是哪部分在吃上下文、压缩又删掉了什么</text>
</svg>
