<svg xmlns="http://www.w3.org/2000/svg" width="880" height="696" viewBox="0 0 880 696" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="696" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="538" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="538" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">MiniCPM does</text>
<path class="edge" d="M62,205 L62,229" marker-end="url(#a)"/>
<path class="hand" d="M408,288.0 C439.0,288.0 439.0,312 470,312" marker-end="url(#a)"/>
<path class="hand" d="M472,336.5 C441.0,336.5 441.0,395 410,395" marker-end="url(#a)"/>
<path class="hand" d="M408,429.5 C439.0,429.5 439.0,453 470,453" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Download the quantized 2B build (1.56</text>
<text class="t" x="82" y="123">GB) from the official GGUF repo</text>
<text class="c" x="82" y="147">huggingface-cli download</text>
<text class="c" x="82" y="166">openbmb/MiniCPM5-2B-GGUF</text>
<text class="c" x="82" y="185">MiniCPM5-2B-Q4_K_M.gguf</text>
<rect class="card" x="40" y="231" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="255" r="10"/>
<text class="num" x="62" y="259" text-anchor="middle">2</text>
<text class="t" x="82" y="260">Serve it with stock llama.cpp — no</text>
<text class="t" x="82" y="282">custom kernels or model-code fork</text>
<text class="c" x="82" y="306">llama-server -m MiniCPM5-2B-Q4_K_M.gguf</text>
<text class="c" x="82" y="325">--port 8080 -ngl 99 -c 8192 --jinja</text>
<rect class="cardT" x="472" y="288" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="288" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="312" r="10"/>
<text class="num" x="494" y="316" text-anchor="middle">3</text>
<text class="t" x="514" y="317">Loads as a standard Llama-architecture</text>
<text class="t" x="514" y="339">model on your CPU or laptop GPU</text>
<text class="comp" x="514" y="367">component: MiniCPM5-2B weights</text>
<rect class="card" x="40" y="371" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="371" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="395" r="10"/>
<text class="num" x="62" y="399" text-anchor="middle">4</text>
<text class="t" x="82" y="400">Send chat requests with the</text>
<text class="t" x="82" y="422">recommended sampling (temperature 1.0,</text>
<text class="t" x="82" y="444">top_p 0.95, min_p 0)</text>
<text class="c" x="82" y="468">http://localhost:8080/v1/chat/completions</text>
<rect class="cardT" x="472" y="429" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="429" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="453" r="10"/>
<text class="num" x="494" y="457" text-anchor="middle">5</text>
<text class="t" x="514" y="458">Answers with step-by-step thinking and</text>
<text class="t" x="514" y="480">XML-style tool calls, all on the</text>
<text class="t" x="514" y="502">device</text>
<text class="comp" x="514" y="530">component: built-in chat template</text>
<rect class="val" x="28" y="580" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="604">VALUE</text>
<text class="valT" x="48" y="628">A 2B text model that reasons, codes and calls tools offline on a laptop — no per-call API</text>
<text class="valT" x="48" y="650">bill, no prompt leaving the machine</text>
</svg>
