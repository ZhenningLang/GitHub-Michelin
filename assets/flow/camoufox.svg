<svg xmlns="http://www.w3.org/2000/svg" width="880" height="708" viewBox="0 0 880 708" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="708" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="550" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="550" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Camoufox does</text>
<path class="hand" d="M408,129.0 C439.0,129.0 439.0,153 470,153" marker-end="url(#a)"/>
<path class="hand" d="M472,188.5 C441.0,188.5 441.0,236 410,236" marker-end="url(#a)"/>
<path class="hand" d="M408,259.5 C439.0,259.5 439.0,298 470,298" marker-end="url(#a)"/>
<path class="edge" d="M494,393 L494,417" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the launcher package, then</text>
<text class="t" x="82" y="123">fetch the browser</text>
<text class="c" x="82" y="147">pip install -U camoufox[geoip] · camoufox</text>
<text class="c" x="82" y="166">fetch</text>
<rect class="cardT" x="472" y="129" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="129" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="153" r="10"/>
<text class="num" x="494" y="157" text-anchor="middle">2</text>
<text class="t" x="514" y="158">Downloads the patched Firefox build</text>
<text class="t" x="514" y="180">paired with this launcher version,</text>
<text class="t" x="514" y="202">plus the fingerprint model</text>
<text class="comp" x="514" y="230">component: camoufox fetch</text>
<rect class="card" x="40" y="212" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">3</text>
<text class="t" x="82" y="241">Swap the browser launch line in your</text>
<text class="t" x="82" y="263">Playwright script; keep the rest</text>
<text class="c" x="82" y="287">with Camoufox() as browser:</text>
<rect class="cardT" x="472" y="274" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="274" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="298" r="10"/>
<text class="num" x="494" y="302" text-anchor="middle">4</text>
<text class="t" x="514" y="303">Draws a device identity from</text>
<text class="t" x="514" y="325">real-traffic statistics and rejects</text>
<text class="t" x="514" y="347">impossible combinations</text>
<text class="comp" x="514" y="375">component: fpgen + coherence check</text>
<rect class="cardT" x="472" y="419" width="368" height="141" rx="8"/>
<rect class="accT" x="472" y="419" width="4" height="141" rx="2"/>
<circle class="accT" cx="494" cy="443" r="10"/>
<text class="num" x="494" y="447" text-anchor="middle">5</text>
<text class="t" x="514" y="448">Answers the page&#x27;s fingerprint probes</text>
<text class="t" x="514" y="470">from native code and runs your</text>
<text class="t" x="514" y="492">Playwright calls out of the page&#x27;s</text>
<text class="t" x="514" y="514">sight</text>
<text class="comp" x="514" y="542">component: patched Firefox + Juggler</text>
<rect class="val" x="28" y="592" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="616">VALUE</text>
<text class="valT" x="48" y="640">Your existing Playwright script keeps its API while the browser underneath stops announcing</text>
<text class="valT" x="48" y="662">itself as automated — no injected stealth scripts to maintain</text>
</svg>
