<svg xmlns="http://www.w3.org/2000/svg" width="880" height="693" viewBox="0 0 880 693" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="693" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="557" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="557" rx="10"/>
<rect class="pillT" x="474" y="40" width="224.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TanStack Workflow 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,266 L62,290" marker-end="url(#a)"/>
<path class="hand" d="M408,339.5 C439.0,339.5 439.0,363 470,363" marker-end="url(#a)"/>
<path class="hand" d="M472,387.5 C441.0,387.5 441.0,437 410,437" marker-end="url(#a)"/>
<path class="hand" d="M408,470.0 C439.0,470.0 439.0,494 470,494" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上引擎，要运行时校验就再加 zod</text>
<text class="c" x="82" y="125">pnpm add @tanstack/workflow-core zod</text>
<rect class="card" x="40" y="171" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">声明 workflow：输入输出用 zod，主体</text>
<text class="t" x="82" y="222">是普通函数</text>
<text class="c" x="82" y="246">createWorkflow</text>
<rect class="card" x="40" y="292" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">3</text>
<text class="t" x="82" y="321">副作用放进 ctx.step，长等待交给</text>
<text class="t" x="82" y="343">ctx.approve</text>
<text class="c" x="82" y="367">ctx.step(id, fn)</text>
<rect class="cardT" x="472" y="339" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="339" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="363" r="10"/>
<text class="num" x="494" y="367" text-anchor="middle">4</text>
<text class="t" x="514" y="368">执行 handler，完成事实逐条追加进日志；到等</text>
<text class="t" x="514" y="390">待点就返回</text>
<text class="comp" x="514" y="418">组件：workflow-core 引擎</text>
<rect class="card" x="40" y="413" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="413" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="437" r="10"/>
<text class="num" x="62" y="441" text-anchor="middle">5</text>
<text class="t" x="82" y="442">之后从任意进程接着跑这个 run：把审批结果或</text>
<text class="t" x="82" y="464">回调载荷交回去</text>
<text class="c" x="82" y="488">runWorkflow · approval: { approvalId,</text>
<text class="c" x="82" y="507">approved: true }</text>
<rect class="cardT" x="472" y="470" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="470" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="494" r="10"/>
<text class="num" x="494" y="498" text-anchor="middle">6</text>
<text class="t" x="514" y="499">重放日志：录过的步骤不再执行，流程从等待点</text>
<text class="t" x="514" y="521">之后继续</text>
<text class="comp" x="514" y="549">组件：重放引擎</text>
<rect class="val" x="28" y="599" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="623">价值</text>
<text class="valT" x="48" y="647">跨天的流程扛得住重启：扣款只执行一次，等待变成库里的行，没有重放也没有丢状态</text>
</svg>
