<svg xmlns="http://www.w3.org/2000/svg" width="880" height="731" viewBox="0 0 880 731" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="731" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="595" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="595" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Edge0 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,258.0 C439.0,258.0 439.0,282 470,282" marker-end="url(#a)"/>
<path class="hand" d="M472,306.5 C441.0,306.5 441.0,354 410,354" marker-end="url(#a)"/>
<path class="hand" d="M408,385.5 C439.0,385.5 439.0,409 470,409" marker-end="url(#a)"/>
<path class="hand" d="M472,433.5 C441.0,433.5 441.0,491 410,491" marker-end="url(#a)"/>
<path class="hand" d="M408,503.5 C439.0,503.5 439.0,532 470,532" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 Apple 芯片的 Mac 上，从克隆的仓库安装</text>
<text class="t" x="82" y="123">Python 包</text>
<text class="c" x="82" y="147">python3.12 -m venv .venv &amp;&amp; .venv/bin/pip</text>
<text class="c" x="82" y="166">install -e &#x27;.[dev,fetch]&#x27;</text>
<rect class="card" x="40" y="212" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">把两个已发布档位之一下载到本地目录</text>
<text class="c" x="82" y="265">.venv/bin/python scripts/fetch_models.py</text>
<text class="c" x="82" y="284">--tier edge0-35b --target-dir models</text>
<rect class="cardT" x="472" y="258" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="258" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="282" r="10"/>
<text class="num" x="494" y="286" text-anchor="middle">3</text>
<text class="t" x="514" y="287">落地一个即可运行的目录：int4 底座加配套训</text>
<text class="t" x="514" y="309">练好的 LoRA 和预路由文件</text>
<text class="comp" x="514" y="337">组件：Hugging Face 模型仓库</text>
<rect class="card" x="40" y="330" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="330" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="354" r="10"/>
<text class="num" x="62" y="358" text-anchor="middle">4</text>
<text class="t" x="82" y="359">把档位名指向这个目录，启动服务</text>
<text class="c" x="82" y="383">export</text>
<text class="c" x="82" y="402">EDGE0_35B_MODEL=$PWD/models/edge0-35b ·</text>
<text class="c" x="82" y="421">edge0 serve edge0-35b</text>
<rect class="cardT" x="472" y="385" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="385" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="409" r="10"/>
<text class="num" x="494" y="413" text-anchor="middle">5</text>
<text class="t" x="514" y="414">专家权重留在固态硬盘上按需映射，挂上两个适</text>
<text class="t" x="514" y="436">配器，在本机 8000 端口提供服务</text>
<text class="comp" x="514" y="464">组件：edge0 serve（AutoEngine）</text>
<rect class="card" x="40" y="467" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="467" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="491" r="10"/>
<text class="num" x="62" y="495" text-anchor="middle">6</text>
<text class="t" x="82" y="496">用任意 OpenAI 风格的客户端发聊天请求</text>
<text class="c" x="82" y="520">http://127.0.0.1:8000/v1/chat/completions</text>
<rect class="cardT" x="472" y="508" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="508" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="532" r="10"/>
<text class="num" x="494" y="536" text-anchor="middle">7</text>
<text class="t" x="514" y="537">每生成一个词，提前一步预测下一层要用的专</text>
<text class="t" x="514" y="559">家，读盘与计算重叠</text>
<text class="comp" x="514" y="587">组件：预路由头加流式专家池</text>
<rect class="val" x="28" y="637" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="661">价值</text>
<text class="valT" x="48" y="685">35B 的 MoE 模型在 24 GB 的 Mac 上作答，峰值活跃内存约 3 GiB，23 GB 的检查点不必装进内存</text>
</svg>
