<svg xmlns="http://www.w3.org/2000/svg" width="880" height="775" viewBox="0 0 880 775" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="775" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="617" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="617" rx="10"/>
<rect class="pillT" x="474" y="40" width="184.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">unstructured does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,267.5 C439.0,267.5 439.0,291 470,291" marker-end="url(#a)"/>
<path class="edge" d="M494,339 L494,363" marker-end="url(#a)"/>
<path class="edge" d="M494,459 L494,483" marker-end="url(#a)"/>
<path class="hand" d="M472,532.0 C441.0,532.0 441.0,556 410,556" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the library with the extras</text>
<text class="t" x="82" y="123">and system tools your file types need</text>
<text class="c" x="82" y="147">pip install &quot;unstructured[all-docs]&quot; · pip</text>
<text class="c" x="82" y="166">install &quot;unstructured[docx,pptx]&quot;</text>
<rect class="card" x="40" y="212" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Call partition on any file</text>
<text class="c" x="82" y="265">elements =</text>
<text class="c" x="82" y="284">partition(&quot;example-docs/layout-parser-pape</text>
<text class="c" x="82" y="303">r.pdf&quot;)</text>
<rect class="cardT" x="472" y="267" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="267" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="291" r="10"/>
<text class="num" x="494" y="295" text-anchor="middle">3</text>
<text class="t" x="514" y="296">Detects the file type and routes it to</text>
<text class="t" x="514" y="318">the matching partitioner</text>
<rect class="cardT" x="472" y="365" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="365" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="389" r="10"/>
<text class="num" x="494" y="393" text-anchor="middle">4</text>
<text class="t" x="514" y="394">For PDFs and images, reads the text</text>
<text class="t" x="514" y="416">layer or runs a layout model plus OCR,</text>
<text class="t" x="514" y="438">per strategy</text>
<rect class="cardT" x="472" y="485" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="485" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="509" r="10"/>
<text class="num" x="494" y="513" text-anchor="middle">5</text>
<text class="t" x="514" y="514">Returns typed elements (Title,</text>
<text class="t" x="514" y="536">NarrativeText, Table…) with page and</text>
<text class="t" x="514" y="558">source metadata</text>
<rect class="card" x="40" y="532" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="532" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="556" r="10"/>
<text class="num" x="62" y="560" text-anchor="middle">6</text>
<text class="t" x="82" y="561">Chunk the elements along section</text>
<text class="t" x="82" y="583">boundaries for your index</text>
<text class="c" x="82" y="607">chunk_by_title(elements)</text>
<rect class="val" x="28" y="659" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="683">VALUE</text>
<text class="valT" x="48" y="707">Every file type becomes the same structured element list, so chunks follow sections instead</text>
<text class="valT" x="48" y="729">of cutting tables in half</text>
</svg>
