<svg xmlns="http://www.w3.org/2000/svg" width="880" height="666" viewBox="0 0 880 666" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="666" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="530" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="530" rx="10"/>
<rect class="pillT" x="474" y="40" width="157.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">CrowdGPT 客户端</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,218.5 C439.0,218.5 439.0,242 470,242" marker-end="url(#a)"/>
<path class="edge" d="M494,268 L494,292" marker-end="url(#a)"/>
<path class="edge" d="M494,344 L494,368" marker-end="url(#a)"/>
<path class="edge" d="M494,442 L494,466" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">审查固定源码，在隔离环境安装匹配硬件的依赖</text>
<text class="c" x="82" y="125">pip install -r requirements.txt</text>
<rect class="card" x="40" y="171" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">启动并选择协调器、身份、后端及内存预算，再</text>
<text class="t" x="82" y="222">开始训练</text>
<text class="c" x="82" y="246">python client.py</text>
<rect class="cardT" x="472" y="218" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="218" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="242" r="10"/>
<text class="num" x="494" y="246" text-anchor="middle">3</text>
<text class="t" x="514" y="247">等待轮次，向中央协调器申请任务元数据</text>
<rect class="cardT" x="472" y="294" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="294" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="318" r="10"/>
<text class="num" x="494" y="322" text-anchor="middle">4</text>
<text class="t" x="514" y="323">下载任务指定的模型权重和词元片段</text>
<rect class="cardT" x="472" y="370" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="370" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="394" r="10"/>
<text class="num" x="494" y="398" text-anchor="middle">5</text>
<text class="t" x="514" y="399">执行本地训练，在本地显示或记录损失、步数和</text>
<text class="t" x="514" y="421">剩余时间</text>
<rect class="cardT" x="472" y="468" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="468" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="492" r="10"/>
<text class="num" x="494" y="496" text-anchor="middle">6</text>
<text class="t" x="514" y="497">尝试上传压缩差分和最终元数据，再记录</text>
<text class="t" x="514" y="519">提交结果</text>
<rect class="val" x="28" y="572" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="596">价值</text>
<text class="valT" x="48" y="620">无需自营训练集群，也能给共享实验贡献本机计算</text>
</svg>
