<svg xmlns="http://www.w3.org/2000/svg" width="880" height="570" viewBox="0 0 880 570" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="570" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="434" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="434" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Mouser does</text>
<path class="hand" d="M408,130.5 C439.0,130.5 439.0,154 470,154" marker-end="url(#a)"/>
<path class="hand" d="M472,166.0 C441.0,166.0 441.0,239 410,239" marker-end="url(#a)"/>
<path class="hand" d="M408,251.0 C439.0,251.0 439.0,275 470,275" marker-end="url(#a)"/>
<path class="edge" d="M494,346 L494,370" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Download the portable build for your</text>
<text class="t" x="82" y="123">platform, run it, and grant the</text>
<text class="t" x="82" y="145">input-hook permission</text>
<text class="c" x="82" y="169">Mouser-macOS.zip · Accessibility</text>
<rect class="cardT" x="472" y="130" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="130" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="154" r="10"/>
<text class="num" x="494" y="158" text-anchor="middle">2</text>
<text class="t" x="514" y="159">Finds your paired HID++ mouse and</text>
<text class="t" x="514" y="181">opens the mapping page for it</text>
<rect class="card" x="40" y="215" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">3</text>
<text class="t" x="82" y="244">Click a button hotspot and assign or</text>
<text class="t" x="82" y="266">record an action</text>
<rect class="cardT" x="472" y="251" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="251" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="275" r="10"/>
<text class="num" x="494" y="279" text-anchor="middle">4</text>
<text class="t" x="514" y="280">Saves the mapping and reloads it live,</text>
<text class="t" x="514" y="302">without dropping the HID connection</text>
<text class="c" x="514" y="326">config.json</text>
<rect class="cardT" x="472" y="372" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="372" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="396" r="10"/>
<text class="num" x="494" y="400" text-anchor="middle">5</text>
<text class="t" x="514" y="401">Stays in the tray and emits that</text>
<text class="t" x="514" y="423">action when the button is pressed</text>
<rect class="val" x="28" y="476" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="500">VALUE</text>
<text class="valT" x="48" y="524">Your remapped mouse buttons keep working from a local config file with Options+ closed</text>
</svg>
