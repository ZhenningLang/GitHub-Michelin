<svg xmlns="http://www.w3.org/2000/svg" width="880" height="572" viewBox="0 0 880 572" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="572" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="436" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="436" rx="10"/>
<rect class="pillT" x="474" y="40" width="105.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">AERS 做的</text>
<path class="hand" d="M408,140.0 C439.0,140.0 439.0,164 470,164" marker-end="url(#a)"/>
<path class="hand" d="M472,177.5 C441.0,177.5 441.0,258 410,258" marker-end="url(#a)"/>
<path class="hand" d="M408,259.0 C439.0,259.0 439.0,294 470,294" marker-end="url(#a)"/>
<path class="hand" d="M472,307.5 C441.0,307.5 441.0,334 410,334" marker-end="url(#a)"/>
<path class="hand" d="M408,335.0 C439.0,335.0 439.0,395 470,395" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从 marketplace 装一个一等插件</text>
<text class="c" x="82" y="125">/plugin install</text>
<text class="c" x="82" y="144">empirical-analysis-python@auto-empirical-r</text>
<text class="c" x="82" y="163">esearch-skills</text>
<text class="comp" x="82" y="186">组件：Claude Code 插件市场</text>
<rect class="cardT" x="472" y="140" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="140" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="164" r="10"/>
<text class="num" x="494" y="168" text-anchor="middle">2</text>
<text class="t" x="514" y="169">把该插件的 SKILL.md 描述注册进本会话</text>
<text class="comp" x="514" y="197">组件：插件</text>
<rect class="card" x="40" y="234" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">3</text>
<text class="t" x="82" y="263">用自然语言说要做的实证任务</text>
<rect class="cardT" x="472" y="270" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="270" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="294" r="10"/>
<text class="num" x="494" y="298" text-anchor="middle">4</text>
<text class="t" x="514" y="299">按描述匹配，只加载那一个子 skill</text>
<text class="comp" x="514" y="327">组件：SKILL.md</text>
<rect class="card" x="40" y="310" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="310" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="334" r="10"/>
<text class="num" x="62" y="338" text-anchor="middle">5</text>
<text class="t" x="82" y="339">给出数据，确认识别策略</text>
<rect class="cardT" x="472" y="371" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="371" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="395" r="10"/>
<text class="num" x="494" y="399" text-anchor="middle">6</text>
<text class="t" x="514" y="400">跑估计、稳健性和期刊表格，然后停下来等你</text>
<text class="comp" x="514" y="428">组件：分析流水线</text>
<rect class="val" x="28" y="478" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="502">价值</text>
<text class="valT" x="48" y="526">不用装 1096 个 skill，也不用自己写流水线提示，就能跑完一次方法对口的实证</text>
</svg>
