<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1086" viewBox="0 0 880 1086" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1086" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="928" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="928" rx="10"/>
<rect class="pillT" x="474" y="40" width="211.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Semantic Router does</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="edge" d="M62,360 L62,384" marker-end="url(#a)"/>
<path class="hand" d="M408,433.5 C439.0,433.5 439.0,457 470,457" marker-end="url(#a)"/>
<path class="edge" d="M494,530 L494,554" marker-end="url(#a)"/>
<path class="edge" d="M494,675 L494,699" marker-end="url(#a)"/>
<path class="edge" d="M494,795 L494,819" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the CLI and start the local</text>
<text class="t" x="82" y="123">stack (Router, Envoy, Dashboard)</text>
<text class="c" x="82" y="147">vllm-sr serve</text>
<text class="comp" x="82" y="170">component: vllm-sr CLI</text>
<rect class="card" x="40" y="218" width="368" height="142" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="142" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">Register your model endpoints and</text>
<text class="t" x="82" y="269">write decisions: which signal sends a</text>
<text class="t" x="82" y="291">request to which model</text>
<text class="c" x="82" y="315">routing.decisions</text>
<text class="comp" x="82" y="338">component: canonical YAML config</text>
<rect class="card" x="40" y="386" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="386" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="410" r="10"/>
<text class="num" x="62" y="414" text-anchor="middle">3</text>
<text class="t" x="82" y="415">Point clients at the routed listener</text>
<text class="t" x="82" y="437">and ask for the virtual model</text>
<text class="c" x="82" y="461">&quot;model&quot;: &quot;vllm-sr/auto&quot;</text>
<rect class="cardT" x="472" y="433" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="433" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="457" r="10"/>
<text class="num" x="494" y="461" text-anchor="middle">4</text>
<text class="t" x="514" y="462">Envoy hands each request to the Router</text>
<text class="t" x="514" y="484">over ExtProc before forwarding it</text>
<text class="comp" x="514" y="512">component: Envoy ExtProc filter</text>
<rect class="cardT" x="472" y="556" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="556" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="580" r="10"/>
<text class="num" x="494" y="584" text-anchor="middle">5</text>
<text class="t" x="514" y="585">Computes signals — domain, jailbreak,</text>
<text class="t" x="514" y="607">PII, keywords, context length — with</text>
<text class="t" x="514" y="629">local classifiers</text>
<text class="comp" x="514" y="657">component: Vela encoder classifiers</text>
<rect class="cardT" x="472" y="701" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="701" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="725" r="10"/>
<text class="num" x="494" y="729" text-anchor="middle">6</text>
<text class="t" x="514" y="730">Matches the highest-priority decision,</text>
<text class="t" x="514" y="752">picks a model and runs that route&#x27;s</text>
<text class="t" x="514" y="774">plugins</text>
<rect class="cardT" x="472" y="821" width="368" height="117" rx="8"/>
<rect class="accT" x="472" y="821" width="4" height="117" rx="2"/>
<circle class="accT" cx="494" cy="845" r="10"/>
<text class="num" x="494" y="849" text-anchor="middle">7</text>
<text class="t" x="514" y="850">Envoy sends the request to the chosen</text>
<text class="t" x="514" y="872">backend; the choice is written to a</text>
<text class="t" x="514" y="894">header</text>
<text class="c" x="514" y="918">x-vsr-selected-model</text>
<rect class="val" x="28" y="970" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="994">VALUE</text>
<text class="valT" x="48" y="1018">Apps keep calling one model name — which model serves what, and what gets blocked, lives in</text>
<text class="valT" x="48" y="1040">one reviewable YAML</text>
</svg>
