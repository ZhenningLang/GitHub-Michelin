<svg xmlns="http://www.w3.org/2000/svg" width="880" height="744" viewBox="0 0 880 744" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="744" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="608" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="608" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Immich 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,288 L62,312" marker-end="url(#a)"/>
<path class="hand" d="M408,339.0 C439.0,339.0 439.0,374 470,374" marker-end="url(#a)"/>
<path class="edge" d="M494,422 L494,446" marker-end="url(#a)"/>
<path class="edge" d="M494,520 L494,544" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">下载发布版 compose 和 .env，填照片路径和</text>
<text class="t" x="82" y="123">数据库密码，启动</text>
<text class="c" x="82" y="147">docker compose up -d</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">在网页端注册管理员，再用手机 App 填服务器</text>
<text class="t" x="82" y="244">地址登录</text>
<text class="c" x="82" y="268">http://&lt;machine-ip-address&gt;:2283</text>
<rect class="card" x="40" y="314" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">3</text>
<text class="t" x="82" y="343">选好要备份的手机相册，打开备份</text>
<rect class="cardT" x="472" y="350" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="350" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="374" r="10"/>
<text class="num" x="494" y="378" text-anchor="middle">4</text>
<text class="t" x="514" y="379">App 在后台上传新照片，服务端保存原图</text>
<text class="t" x="514" y="401">并跳过重复</text>
<rect class="cardT" x="472" y="448" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="448" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="472" r="10"/>
<text class="num" x="494" y="476" text-anchor="middle">5</text>
<text class="t" x="514" y="477">后台任务生成缩略图、转码视频、读 EXIF</text>
<text class="t" x="514" y="499"> 画地图</text>
<rect class="cardT" x="472" y="546" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="546" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="570" r="10"/>
<text class="num" x="494" y="574" text-anchor="middle">6</text>
<text class="t" x="514" y="575">机器学习容器识别人脸、算 CLIP 向量，文字就</text>
<text class="t" x="514" y="597">能按画面内容搜到照片</text>
<rect class="val" x="28" y="650" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="674">价值</text>
<text class="valT" x="48" y="698">全家的照片库在自己硬盘上就能按内容搜索，不再交云相册月费</text>
</svg>
