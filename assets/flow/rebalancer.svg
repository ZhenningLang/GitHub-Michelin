<svg xmlns="http://www.w3.org/2000/svg" width="880" height="817" viewBox="0 0 880 817" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="817" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="659" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="659" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Rebalancer does</text>
<path class="edge" d="M62,205 L62,229" marker-end="url(#a)"/>
<path class="hand" d="M408,299.0 C439.0,299.0 439.0,323 470,323" marker-end="url(#a)"/>
<path class="hand" d="M472,358.5 C441.0,358.5 441.0,417 410,417" marker-end="url(#a)"/>
<path class="edge" d="M62,488 L62,512" marker-end="url(#a)"/>
<path class="hand" d="M408,550.5 C439.0,550.5 439.0,574 470,574" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Describe the objects, the containers,</text>
<text class="t" x="82" y="123">and the starting assignment</text>
<text class="c" x="82" y="147">set_object_name(&quot;task&quot;) ·</text>
<text class="c" x="82" y="166">set_container_name(&quot;host&quot;) ·</text>
<text class="c" x="82" y="185">set_assignment({…})</text>
<rect class="card" x="40" y="231" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="255" r="10"/>
<text class="num" x="62" y="259" text-anchor="middle">2</text>
<text class="t" x="82" y="260">Declare the dimensions, then compose</text>
<text class="t" x="82" y="282">goals and constraints out of named</text>
<text class="t" x="82" y="304">specs</text>
<text class="c" x="82" y="328">BalanceSpec · CapacitySpec ·</text>
<text class="c" x="82" y="347">GroupCountSpec</text>
<rect class="cardT" x="472" y="299" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="299" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="323" r="10"/>
<text class="num" x="494" y="327" text-anchor="middle">3</text>
<text class="t" x="514" y="328">Compiles those specs into an</text>
<text class="t" x="514" y="350">expression graph — you write no LP</text>
<text class="t" x="514" y="372">formulas</text>
<text class="comp" x="514" y="400">component: expression graph</text>
<rect class="card" x="40" y="393" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="393" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="417" r="10"/>
<text class="num" x="62" y="421" text-anchor="middle">4</text>
<text class="t" x="82" y="422">Pick the algorithm and the move types</text>
<text class="t" x="82" y="444">it may use</text>
<text class="c" x="82" y="468">LocalSearchSolverSpec(moveTypeList=[…])</text>
<rect class="card" x="40" y="514" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="514" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="538" r="10"/>
<text class="num" x="62" y="542" text-anchor="middle">5</text>
<text class="t" x="82" y="543">Call solve()</text>
<text class="c" x="82" y="567">solution = solver.solve()</text>
<rect class="cardT" x="472" y="550" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="550" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="574" r="10"/>
<text class="num" x="494" y="578" text-anchor="middle">6</text>
<text class="t" x="514" y="579">Applies improving moves until nothing</text>
<text class="t" x="514" y="601">improves or the time limit hits, then</text>
<text class="t" x="514" y="623">returns the best assignment</text>
<text class="comp" x="514" y="651">component: local search solver</text>
<rect class="val" x="28" y="701" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="725">VALUE</text>
<text class="valT" x="48" y="749">You get a constraint-satisfying, goal-optimized assignment map — no linear program to write</text>
<text class="valT" x="48" y="771">by hand</text>
</svg>
