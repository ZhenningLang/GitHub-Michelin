<svg xmlns="http://www.w3.org/2000/svg" width="880" height="792" viewBox="0 0 880 792" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="792" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="634" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="634" rx="10"/>
<rect class="pillT" x="474" y="40" width="211.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">video-shotcraft does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,269.0 C439.0,269.0 439.0,293 470,293" marker-end="url(#a)"/>
<path class="hand" d="M472,316.0 C441.0,316.0 441.0,376 410,376" marker-end="url(#a)"/>
<path class="hand" d="M408,410.5 C439.0,410.5 439.0,434 470,434" marker-end="url(#a)"/>
<path class="edge" d="M494,504 L494,528" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the skill into Claude Code or</text>
<text class="t" x="82" y="123">Codex</text>
<text class="c" x="82" y="147">npx skills add</text>
<text class="c" x="82" y="166">Vincentwei1021/video-shotcraft</text>
<rect class="card" x="40" y="212" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Point it at your product and ask for a</text>
<text class="t" x="82" y="263">promo, optionally naming shot cards</text>
<text class="c" x="82" y="287">Use video-shotcraft to create a promo for</text>
<text class="c" x="82" y="306">my desktop product.</text>
<rect class="cardT" x="472" y="269" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="269" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="293" r="10"/>
<text class="num" x="494" y="297" text-anchor="middle">3</text>
<text class="t" x="514" y="298">Runs a read-only product check and</text>
<text class="t" x="514" y="320">offers three modes: template,</text>
<text class="t" x="514" y="342">autonomous, co-creation</text>
<rect class="card" x="40" y="352" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">4</text>
<text class="t" x="82" y="381">Pick a mode; the template route means</text>
<text class="t" x="82" y="403">swapping your assets into the Ink</text>
<text class="t" x="82" y="425">Press film</text>
<text class="c" x="82" y="449">template/TEMPLATE.md</text>
<rect class="cardT" x="472" y="410" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="410" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="434" r="10"/>
<text class="num" x="494" y="438" text-anchor="middle">5</text>
<text class="t" x="514" y="439">Builds each shot as a Remotion</text>
<text class="t" x="514" y="461">component — real page captures, 2.5D</text>
<text class="t" x="514" y="483">camera moves, beat-pinned SFX</text>
<rect class="cardT" x="472" y="530" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="530" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="554" r="10"/>
<text class="num" x="494" y="558" text-anchor="middle">6</text>
<text class="t" x="514" y="559">Renders the finished film to MP4 on</text>
<text class="t" x="514" y="581">your machine</text>
<text class="c" x="514" y="605">npx remotion render src/index.ts AiflPromo</text>
<text class="c" x="514" y="624">out/promo.mp4</text>
<rect class="val" x="28" y="676" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="700">VALUE</text>
<text class="valT" x="48" y="724">A cinematic product film with real screenshots and choreographed motion, without</text>
<text class="valT" x="48" y="746">hand-keyframing it in After Effects</text>
</svg>
