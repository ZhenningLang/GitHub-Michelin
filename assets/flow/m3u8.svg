<svg xmlns="http://www.w3.org/2000/svg" width="880" height="790" viewBox="0 0 880 790" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="790" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="654" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="654" rx="10"/>
<rect class="pillT" x="474" y="40" width="110.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">m3u8 does</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,228.0 C439.0,228.0 439.0,252 470,252" marker-end="url(#a)"/>
<path class="edge" d="M494,322 L494,346" marker-end="url(#a)"/>
<path class="hand" d="M472,395.0 C441.0,395.0 441.0,419 410,419" marker-end="url(#a)"/>
<path class="edge" d="M62,509 L62,533" marker-end="url(#a)"/>
<path class="hand" d="M408,592.0 C439.0,592.0 439.0,616 470,616" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the library</text>
<text class="c" x="82" y="125">pip install m3u8</text>
<rect class="card" x="40" y="171" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">Load a playlist from a URL, a file</text>
<text class="t" x="82" y="222">path, or a string you already have</text>
<text class="c" x="82" y="246">m3u8.load(&#x27;http://videoserver.com/playlist</text>
<text class="c" x="82" y="265">.m3u8&#x27;)</text>
<rect class="cardT" x="472" y="228" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="228" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="252" r="10"/>
<text class="num" x="494" y="256" text-anchor="middle">3</text>
<text class="t" x="514" y="257">Fetches the text and remembers its</text>
<text class="t" x="514" y="279">base URI so relative segment paths</text>
<text class="t" x="514" y="301">resolve</text>
<rect class="cardT" x="472" y="348" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="348" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="372" r="10"/>
<text class="num" x="494" y="376" text-anchor="middle">4</text>
<text class="t" x="514" y="377">Parses every tag into typed objects:</text>
<text class="t" x="514" y="399">segments, variant streams, keys, ad</text>
<text class="t" x="514" y="421">cue markers</text>
<rect class="card" x="40" y="395" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="395" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="419" r="10"/>
<text class="num" x="62" y="423" text-anchor="middle">5</text>
<text class="t" x="82" y="424">Read or change the fields your job is</text>
<text class="t" x="82" y="446">about</text>
<text class="c" x="82" y="470">playlist.segments ·</text>
<text class="c" x="82" y="489">playlist.target_duration</text>
<rect class="card" x="40" y="535" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="535" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="559" r="10"/>
<text class="num" x="62" y="563" text-anchor="middle">6</text>
<text class="t" x="82" y="564">Write the result back out to a string</text>
<text class="t" x="82" y="586">or a file</text>
<text class="c" x="82" y="610">playlist.dumps() ·</text>
<text class="c" x="82" y="629">playlist.dump(&#x27;playlist.m3u8&#x27;)</text>
<rect class="cardT" x="472" y="592" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="592" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="616" r="10"/>
<text class="num" x="494" y="620" text-anchor="middle">7</text>
<text class="t" x="514" y="621">Serializes the object model back into</text>
<text class="t" x="514" y="643">HLS playlist text</text>
<rect class="val" x="28" y="696" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="720">VALUE</text>
<text class="valT" x="48" y="744">You edit an HLS manifest as Python objects instead of regexing #EXT tags line by line</text>
</svg>
