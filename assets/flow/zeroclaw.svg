<svg xmlns="http://www.w3.org/2000/svg" width="880" height="890" viewBox="0 0 880 890" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="890" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="732" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="732" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">ZeroClaw does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,307 L62,331" marker-end="url(#a)"/>
<path class="hand" d="M408,380.5 C439.0,380.5 439.0,404 470,404" marker-end="url(#a)"/>
<path class="edge" d="M494,477 L494,501" marker-end="url(#a)"/>
<path class="edge" d="M494,622 L494,646" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install, then pick a model provider,</text>
<text class="t" x="82" y="123">risk profile, memory and agent</text>
<text class="c" x="82" y="147">zeroclaw quickstart</text>
<rect class="card" x="40" y="193" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Store the Telegram bot token, enable</text>
<text class="t" x="82" y="244">the channel and bind it to the agent</text>
<text class="c" x="82" y="268">zeroclaw config set</text>
<text class="c" x="82" y="287">channels.telegram.home.bot_token</text>
<rect class="card" x="40" y="333" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">3</text>
<text class="t" x="82" y="362">Start the daemon and send the printed</text>
<text class="t" x="82" y="384">one-time code to your bot</text>
<text class="c" x="82" y="408">zeroclaw daemon</text>
<rect class="cardT" x="472" y="380" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="380" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="404" r="10"/>
<text class="num" x="494" y="408" text-anchor="middle">4</text>
<text class="t" x="514" y="409">Admits only bound senders and routes</text>
<text class="t" x="514" y="431">each message to the agent and model</text>
<text class="comp" x="514" y="459">component: channel adapter</text>
<rect class="cardT" x="472" y="503" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="503" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="527" r="10"/>
<text class="num" x="494" y="531" text-anchor="middle">5</text>
<text class="t" x="514" y="532">Rates each tool call by the risk</text>
<text class="t" x="514" y="554">profile and asks you in chat for</text>
<text class="t" x="514" y="576">medium-risk ones</text>
<text class="comp" x="514" y="604">component: approval manager</text>
<rect class="cardT" x="472" y="648" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="648" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="672" r="10"/>
<text class="num" x="494" y="676" text-anchor="middle">6</text>
<text class="t" x="514" y="677">Runs approved tools, in a sandbox when</text>
<text class="t" x="514" y="699">one is available, and replies in the</text>
<text class="t" x="514" y="721">same chat</text>
<rect class="val" x="28" y="774" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="798">VALUE</text>
<text class="valT" x="48" y="822">One always-on assistant on your host that acts through chat, with risky steps waiting for</text>
<text class="valT" x="48" y="844">your OK</text>
</svg>
