<svg xmlns="http://www.w3.org/2000/svg" width="880" height="793" viewBox="0 0 880 793" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="793" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="635" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="635" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">DeepFace does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,258.0 C439.0,258.0 439.0,282 470,282" marker-end="url(#a)"/>
<path class="edge" d="M494,377 L494,401" marker-end="url(#a)"/>
<path class="edge" d="M494,500 L494,524" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it together with the</text>
<text class="t" x="82" y="123">deep-learning engine you want</text>
<text class="c" x="82" y="147">pip install deepface[tensorflow] · pip</text>
<text class="c" x="82" y="166">install deepface[pytorch]</text>
<rect class="card" x="40" y="212" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Call one function on two photos</text>
<text class="c" x="82" y="265">DeepFace.verify(img1_path = &quot;img1.jpg&quot;,</text>
<text class="c" x="82" y="284">img2_path = &quot;img2.jpg&quot;)</text>
<rect class="cardT" x="472" y="258" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="258" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="282" r="10"/>
<text class="num" x="494" y="286" text-anchor="middle">3</text>
<text class="t" x="514" y="287">On first use, downloads the chosen</text>
<text class="t" x="514" y="309">model&#x27;s pretrained weights and caches</text>
<text class="t" x="514" y="331">them locally</text>
<text class="comp" x="514" y="359">component: ~/.deepface/weights</text>
<rect class="cardT" x="472" y="403" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="403" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="427" r="10"/>
<text class="num" x="494" y="431" text-anchor="middle">4</text>
<text class="t" x="514" y="432">Finds and straightens the face in each</text>
<text class="t" x="514" y="454">image (OpenCV detector by default)</text>
<text class="comp" x="514" y="482">component: detector backend</text>
<rect class="cardT" x="472" y="526" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="526" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="550" r="10"/>
<text class="num" x="494" y="554" text-anchor="middle">5</text>
<text class="t" x="514" y="555">Turns each face into a vector</text>
<text class="t" x="514" y="577">(VGG-Face by default) and checks their</text>
<text class="t" x="514" y="599">distance against a pre-tuned threshold</text>
<text class="comp" x="514" y="627">component: recognition model</text>
<rect class="val" x="28" y="677" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="701">VALUE</text>
<text class="valT" x="48" y="725">One call answers &quot;same person?&quot; — you never assemble detection, alignment, embedding and</text>
<text class="valT" x="48" y="747">threshold tuning yourself</text>
</svg>
