<svg xmlns="http://www.w3.org/2000/svg" width="880" height="631" viewBox="0 0 880 631" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="631" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="495" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="495" rx="10"/>
<rect class="pillT" x="474" y="40" width="187.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Selenium Wire 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,240.5 C439.0,240.5 439.0,264 470,264" marker-end="url(#a)"/>
<path class="hand" d="M472,276.0 C441.0,276.0 441.0,338 410,338" marker-end="url(#a)"/>
<path class="hand" d="M408,350.5 C439.0,350.5 439.0,374 470,374" marker-end="url(#a)"/>
<path class="hand" d="M472,386.0 C441.0,386.0 441.0,437 410,437" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上它，配好 Selenium 4、浏览器和</text>
<text class="t" x="82" y="123">webdriver</text>
<text class="c" x="82" y="147">pip install selenium-wire</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">只换一行 import，其余 Selenium 代码</text>
<text class="t" x="82" y="244">原样不动</text>
<text class="c" x="82" y="268">from seleniumwire import webdriver</text>
<rect class="cardT" x="472" y="240" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="240" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="264" r="10"/>
<text class="num" x="494" y="268" text-anchor="middle">3</text>
<text class="t" x="514" y="269">让浏览器走它自带的中间人代理，并放行</text>
<text class="t" x="514" y="291">它的根证书</text>
<rect class="card" x="40" y="314" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">4</text>
<text class="t" x="82" y="343">照旧驱动浏览器</text>
<text class="c" x="82" y="367">driver.get(&#x27;https://www.google.com&#x27;)</text>
<rect class="cardT" x="472" y="350" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="350" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="374" r="10"/>
<text class="num" x="494" y="378" text-anchor="middle">5</text>
<text class="t" x="514" y="379">解密并记下页面发出的每个请求和响应，顺带跑</text>
<text class="t" x="514" y="401">你设的拦截函数</text>
<rect class="card" x="40" y="413" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="413" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="437" r="10"/>
<text class="num" x="62" y="441" text-anchor="middle">6</text>
<text class="t" x="82" y="442">读抓到的流量：网址、状态码、请求头、正文</text>
<text class="c" x="82" y="466">driver.requests ·</text>
<text class="c" x="82" y="485">driver.wait_for_request(pat, timeout=10)</text>
<rect class="val" x="28" y="537" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="561">价值</text>
<text class="valT" x="48" y="585">不离开 Selenium 就能看到页面背后的接口调用和请求头——只是这个库 2024 年起已冻结</text>
</svg>
