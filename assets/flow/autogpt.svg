<svg xmlns="http://www.w3.org/2000/svg" width="880" height="834" viewBox="0 0 880 834" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="834" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="698" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="698" rx="10"/>
<rect class="pillT" x="474" y="40" width="221.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">AutoGPT Platform does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,331 L62,355" marker-end="url(#a)"/>
<path class="hand" d="M408,393.0 C439.0,393.0 439.0,417 470,417" marker-end="url(#a)"/>
<path class="edge" d="M494,490 L494,514" marker-end="url(#a)"/>
<path class="edge" d="M494,610 L494,634" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Bring up the self-hosted platform (or</text>
<text class="t" x="82" y="123">sign up for the hosted one)</text>
<text class="c" x="82" y="147">make init-env · docker compose up -d</text>
<text class="c" x="82" y="166">--build</text>
<rect class="card" x="40" y="212" width="368" height="119" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="119" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Describe the job to AutoPilot, or drag</text>
<text class="t" x="82" y="263">blocks onto the Build canvas and wire</text>
<text class="t" x="82" y="285">their pins</text>
<text class="comp" x="82" y="313">component: AutoPilot / Builder</text>
<rect class="card" x="40" y="357" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="357" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="381" r="10"/>
<text class="num" x="62" y="385" text-anchor="middle">3</text>
<text class="t" x="82" y="386">Add the app credentials once and</text>
<text class="t" x="82" y="408">schedule the agent</text>
<rect class="cardT" x="472" y="393" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="393" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="417" r="10"/>
<text class="num" x="494" y="421" text-anchor="middle">4</text>
<text class="t" x="514" y="422">At the scheduled time or on a webhook,</text>
<text class="t" x="514" y="444">queues a run for an executor</text>
<text class="comp" x="514" y="472">component: scheduler + executor</text>
<rect class="cardT" x="472" y="516" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="516" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="540" r="10"/>
<text class="num" x="494" y="544" text-anchor="middle">5</text>
<text class="t" x="514" y="545">Fires each block once its required</text>
<text class="t" x="514" y="567">inputs arrive; independent branches</text>
<text class="t" x="514" y="589">run in parallel</text>
<rect class="cardT" x="472" y="636" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="636" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="660" r="10"/>
<text class="num" x="494" y="664" text-anchor="middle">6</text>
<text class="t" x="514" y="665">Records outputs, cost and status for</text>
<text class="t" x="514" y="687">every run in the Agents dashboard</text>
<rect class="val" x="28" y="740" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="764">VALUE</text>
<text class="valT" x="48" y="788">A recurring multi-app chore runs itself; you only read the results</text>
</svg>
