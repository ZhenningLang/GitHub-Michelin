<svg xmlns="http://www.w3.org/2000/svg" width="880" height="731" viewBox="0 0 880 731" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="731" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="595" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="595" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Celery 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,310 L62,334" marker-end="url(#a)"/>
<path class="hand" d="M408,385.0 C439.0,385.0 439.0,409 470,409" marker-end="url(#a)"/>
<path class="hand" d="M472,433.5 C441.0,433.5 441.0,484 410,484" marker-end="url(#a)"/>
<path class="hand" d="M408,496.5 C439.0,496.5 439.0,532 470,532" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好 Celery，并跑一个 Redis 或 RabbitMQ </text>
<text class="t" x="82" y="123">作 broker</text>
<text class="c" x="82" y="147">pip install celery · docker run -d -p</text>
<text class="c" x="82" y="166">6379:6379 redis</text>
<rect class="card" x="40" y="212" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">在可导入模块里建 app，把慢函数标成任务</text>
<text class="c" x="82" y="265">@app.task</text>
<text class="comp" x="82" y="288">组件：Celery 应用</text>
<rect class="card" x="40" y="336" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="336" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="360" r="10"/>
<text class="num" x="62" y="364" text-anchor="middle">3</text>
<text class="t" x="82" y="365">在负责跑任务的机器上启动 worker 池</text>
<text class="c" x="82" y="389">celery -A tasks worker --loglevel=INFO</text>
<text class="comp" x="82" y="412">组件：worker</text>
<rect class="cardT" x="472" y="385" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="385" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="409" r="10"/>
<text class="num" x="494" y="413" text-anchor="middle">4</text>
<text class="t" x="514" y="414">worker 保持连接，从 broker 队列持续消费任</text>
<text class="t" x="514" y="436">务消息</text>
<text class="comp" x="514" y="464">组件：broker + worker</text>
<rect class="card" x="40" y="460" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="460" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="484" r="10"/>
<text class="num" x="62" y="488" text-anchor="middle">5</text>
<text class="t" x="82" y="489">在请求处理器里调用任务，立刻返回</text>
<text class="c" x="82" y="513">add.delay(4, 4)</text>
<rect class="cardT" x="472" y="508" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="508" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="532" r="10"/>
<text class="num" x="494" y="536" text-anchor="middle">6</text>
<text class="t" x="514" y="537">空闲 worker 取走执行，并可把结果写进</text>
<text class="t" x="514" y="559">result backend</text>
<text class="comp" x="514" y="587">组件：worker</text>
<rect class="val" x="28" y="637" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="661">价值</text>
<text class="valT" x="48" y="685">HTTP 响应立即返回；重活跑在能扛重启、可跨机扩展的 worker 池上</text>
</svg>
