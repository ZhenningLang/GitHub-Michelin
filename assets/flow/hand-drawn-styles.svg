<svg xmlns="http://www.w3.org/2000/svg" width="880" height="844" viewBox="0 0 880 844" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="844" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="686" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="686" rx="10"/>
<rect class="pillT" x="474" y="40" width="230.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">hand-drawn-styles does</text>
<path class="edge" d="M62,214 L62,238" marker-end="url(#a)"/>
<path class="hand" d="M408,287.5 C439.0,287.5 439.0,311 470,311" marker-end="url(#a)"/>
<path class="edge" d="M494,406 L494,430" marker-end="url(#a)"/>
<path class="edge" d="M494,551 L494,575" marker-end="url(#a)"/>
<path class="hand" d="M472,624.0 C441.0,624.0 441.0,648 410,648" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="142" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="142" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Put the whole skill folder into your</text>
<text class="t" x="82" y="123">agent&#x27;s skills directory and run the</text>
<text class="t" x="82" y="145">install check</text>
<text class="c" x="82" y="169">python3 -B scripts/check_skill.py</text>
<text class="comp" x="82" y="192">component: protocol + recipes + scripts</text>
<rect class="card" x="40" y="240" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="240" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="264" r="10"/>
<text class="num" x="62" y="268" text-anchor="middle">2</text>
<text class="t" x="82" y="269">Say what to draw and name a style by</text>
<text class="t" x="82" y="291">number, Chinese name or English alias</text>
<text class="c" x="82" y="315">用吉卜力风画一只在下雨天打伞的猫</text>
<rect class="cardT" x="472" y="287" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="287" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="311" r="10"/>
<text class="num" x="494" y="315" text-anchor="middle">3</text>
<text class="t" x="514" y="316">Resolves the style; if you named none,</text>
<text class="t" x="514" y="338">it shows the menu and waits for your</text>
<text class="t" x="514" y="360">pick</text>
<text class="comp" x="514" y="388">component: PROTOCOL.md</text>
<rect class="cardT" x="472" y="432" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="432" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="456" r="10"/>
<text class="num" x="494" y="460" text-anchor="middle">4</text>
<text class="t" x="514" y="461">Copies that recipe out verbatim and</text>
<text class="t" x="514" y="483">fills the bracketed slots from your</text>
<text class="t" x="514" y="505">description</text>
<text class="comp" x="514" y="533">component: render_prompt.py</text>
<rect class="cardT" x="472" y="577" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="577" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="601" r="10"/>
<text class="num" x="494" y="605" text-anchor="middle">5</text>
<text class="t" x="514" y="606">Returns one copyable prompt — or, for</text>
<text class="t" x="514" y="628">styles 3.1/19/20, a JSON bundle with</text>
<text class="t" x="514" y="650">anchor images</text>
<rect class="card" x="40" y="624" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="624" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="648" r="10"/>
<text class="num" x="62" y="652" text-anchor="middle">6</text>
<text class="t" x="82" y="653">Paste it into your own image model and</text>
<text class="t" x="82" y="675">generate</text>
<rect class="val" x="28" y="728" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="752">VALUE</text>
<text class="valT" x="48" y="776">The look you validated once is reproduced word for word every time — no re-assembling style</text>
<text class="valT" x="48" y="798">prompts, no agent rewording it</text>
</svg>
