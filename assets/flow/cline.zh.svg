<svg xmlns="http://www.w3.org/2000/svg" width="880" height="745" viewBox="0 0 880 745" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="745" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="609" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="609" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Cline 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,266 L62,290" marker-end="url(#a)"/>
<path class="hand" d="M408,339.5 C439.0,339.5 439.0,363 470,363" marker-end="url(#a)"/>
<path class="hand" d="M472,364.0 C441.0,364.0 441.0,437 410,437" marker-end="url(#a)"/>
<path class="hand" d="M408,438.0 C439.0,438.0 439.0,473 470,473" marker-end="url(#a)"/>
<path class="edge" d="M494,521 L494,545" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装在你干活的地方：编辑器扩展、终端 CLI 或</text>
<text class="t" x="82" y="123">桌面端</text>
<text class="c" x="82" y="147">npm i -g cline</text>
<rect class="card" x="40" y="193" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">接上一个模型：自己的 key、网关或本地模型</text>
<text class="c" x="82" y="246">Anthropic · Bedrock · OpenRouter · Ollama</text>
<rect class="card" x="40" y="292" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">3</text>
<text class="t" x="82" y="321">在 Plan 模式里说清任务，写下它必须遵守的项</text>
<text class="t" x="82" y="343">目规则</text>
<text class="c" x="82" y="367">.clinerules</text>
<rect class="cardT" x="472" y="339" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="339" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="363" r="10"/>
<text class="num" x="494" y="367" text-anchor="middle">4</text>
<text class="t" x="514" y="368">读仓库、提问、给出方案——此时一个文件都不改</text>
<rect class="card" x="40" y="413" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="413" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="437" r="10"/>
<text class="num" x="62" y="441" text-anchor="middle">5</text>
<text class="t" x="82" y="442">切到 Act 模式，逐条批准它提议的改动和命令</text>
<rect class="cardT" x="472" y="449" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="449" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="473" r="10"/>
<text class="num" x="494" y="477" text-anchor="middle">6</text>
<text class="t" x="514" y="478">跨文件改代码、跑测试和构建，并修掉自己引发</text>
<text class="t" x="514" y="500">的报错</text>
<rect class="cardT" x="472" y="547" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="547" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="571" r="10"/>
<text class="num" x="494" y="575" text-anchor="middle">7</text>
<text class="t" x="514" y="576">每一步都打 checkpoint，diff 可回看，整轮</text>
<text class="t" x="514" y="598">可回滚</text>
<rect class="val" x="28" y="651" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="675">价值</text>
<text class="valT" x="48" y="699">拿到 agent 速度的改动，但键盘没交出去：每次写文件和跑命令你都看过，任何一步都能撤销</text>
</svg>
