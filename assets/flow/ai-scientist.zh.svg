<svg xmlns="http://www.w3.org/2000/svg" width="880" height="897" viewBox="0 0 880 897" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="897" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="761" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="761" rx="10"/>
<rect class="pillT" x="474" y="40" width="215.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The AI Scientist 做的</text>
<path class="edge" d="M62,203 L62,227" marker-end="url(#a)"/>
<path class="hand" d="M408,283.5 C439.0,283.5 439.0,307 470,307" marker-end="url(#a)"/>
<path class="edge" d="M494,375 L494,399" marker-end="url(#a)"/>
<path class="edge" d="M494,493 L494,517" marker-end="url(#a)"/>
<path class="hand" d="M472,565.0 C441.0,565.0 441.0,589 410,589" marker-end="url(#a)"/>
<path class="edge" d="M62,655 L62,679" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="131" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="131" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">搭建</text>
<text class="t" x="82" y="118">装好 Python 环境与 LaTeX，并自己跑一遍模</text>
<text class="t" x="82" y="140">板基线</text>
<text class="c" x="82" y="164">pip install -r requirements.txt · python</text>
<text class="c" x="82" y="183">experiment.py --out_dir run_0</text>
<rect class="card" x="40" y="229" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="229" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="253" r="10"/>
<text class="num" x="62" y="257" text-anchor="middle">2</text>
<text class="ph" x="82" y="258">单个想法</text>
<text class="t" x="82" y="275">指定模板与前沿模型，启动论文生成</text>
<text class="c" x="82" y="299">python launch_scientist.py --model</text>
<text class="c" x="82" y="318">&quot;claude-3-5-sonnet-20241022&quot;</text>
<rect class="cardT" x="472" y="283" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="283" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="307" r="10"/>
<text class="num" x="494" y="311" text-anchor="middle">3</text>
<text class="ph" x="514" y="312">单个想法</text>
<text class="t" x="514" y="329">生成候选想法，并逐个到文献里查新</text>
<text class="comp" x="514" y="357">组件：想法生成器</text>
<rect class="cardT" x="472" y="401" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="401" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="425" r="10"/>
<text class="num" x="494" y="429" text-anchor="middle">4</text>
<text class="ph" x="514" y="430">单个想法</text>
<text class="t" x="514" y="447">写出实验代码，在你的 GPU 上跑，再出图</text>
<text class="comp" x="514" y="475">组件：实验执行器</text>
<rect class="cardT" x="472" y="519" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="519" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="543" r="10"/>
<text class="num" x="494" y="547" text-anchor="middle">5</text>
<text class="ph" x="514" y="548">单个想法</text>
<text class="t" x="514" y="565">按模板的 LaTeX 起草论文并编译出 PDF</text>
<text class="comp" x="514" y="593">组件：写作模块</text>
<rect class="card" x="40" y="565" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="565" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="589" r="10"/>
<text class="num" x="62" y="593" text-anchor="middle">6</text>
<text class="ph" x="82" y="594">单个想法</text>
<text class="t" x="82" y="611">用内置的 LLM 评审给生成的论文打分</text>
<text class="c" x="82" y="635">perform_review(paper_txt, model, client)</text>
<rect class="card" x="40" y="681" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="681" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="705" r="10"/>
<text class="num" x="62" y="709" text-anchor="middle">7</text>
<text class="ph" x="82" y="710">单个想法</text>
<text class="t" x="82" y="727">留下论文，或带着评审意见重跑这个想法</text>
<text class="c" x="82" y="751">--improvement</text>
<rect class="val" x="28" y="803" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="827">价值</text>
<text class="valT" x="48" y="851">idea 到代码、到实验、到成稿这一整圈不再由你手工走：一条命令把模板和前沿模型变成编译好的论文和一份评审分</text>
</svg>
