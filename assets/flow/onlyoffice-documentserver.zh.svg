<svg xmlns="http://www.w3.org/2000/svg" width="880" height="674" viewBox="0 0 880 674" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="674" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="538" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="538" rx="10"/>
<rect class="pillT" x="474" y="40" width="206.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">ONLYOFFICE Docs 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,246 L62,270" marker-end="url(#a)"/>
<path class="hand" d="M408,321.0 C439.0,321.0 439.0,345 470,345" marker-end="url(#a)"/>
<path class="edge" d="M494,396 L494,420" marker-end="url(#a)"/>
<path class="edge" d="M494,472 L494,496" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">带 JWT secret 起文档服务器容器</text>
<text class="c" x="82" y="125">onlyoffice/documentserver</text>
<rect class="card" x="40" y="171" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">把待编辑文档放到你的存储可发 URL 的位置</text>
<text class="comp" x="82" y="228">组件：你的存储</text>
<rect class="card" x="40" y="272" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="272" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="296" r="10"/>
<text class="num" x="62" y="300" text-anchor="middle">3</text>
<text class="t" x="82" y="301">在页面里放编辑器占位符并配置它</text>
<text class="c" x="82" y="325">new DocsAPI.DocEditor(&quot;placeholder&quot;,</text>
<text class="comp" x="82" y="348">组件：sdkjs API</text>
<rect class="cardT" x="472" y="321" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="321" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="345" r="10"/>
<text class="num" x="494" y="349" text-anchor="middle">4</text>
<text class="t" x="514" y="350">对你的文件流出 Word/Cells/Slides 式编辑器</text>
<text class="comp" x="514" y="378">组件：web-apps + server</text>
<rect class="cardT" x="472" y="422" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="422" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="446" r="10"/>
<text class="num" x="494" y="450" text-anchor="middle">5</text>
<text class="t" x="514" y="451">把所有人的编辑实时合进同一份文档</text>
<rect class="cardT" x="472" y="498" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="498" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="522" r="10"/>
<text class="num" x="494" y="526" text-anchor="middle">6</text>
<text class="t" x="514" y="527">把保存后的新版本送回你的端点</text>
<rect class="val" x="28" y="580" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="604">价值</text>
<text class="valT" x="48" y="628">在你的产品里点一个文件，就打开可协同的完整 Office 编辑器——存储和账号是你的，套件由他们出货</text>
</svg>
