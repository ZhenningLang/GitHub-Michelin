<svg xmlns="http://www.w3.org/2000/svg" width="880" height="816" viewBox="0 0 880 816" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="816" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="658" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="658" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">yt-dlp does</text>
<path class="edge" d="M62,233 L62,257" marker-end="url(#a)"/>
<path class="hand" d="M408,306.5 C439.0,306.5 439.0,330 470,330" marker-end="url(#a)"/>
<path class="edge" d="M494,425 L494,449" marker-end="url(#a)"/>
<path class="edge" d="M494,523 L494,547" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="161" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="161" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install yt-dlp with its default</text>
<text class="t" x="82" y="123">extras, plus ffmpeg and a JS runtime</text>
<text class="t" x="82" y="145">such as Deno</text>
<text class="c" x="82" y="169">python3 -m pip install -U</text>
<text class="c" x="82" y="188">&quot;yt-dlp[default]&quot;</text>
<text class="comp" x="82" y="211">component: yt-dlp CLI</text>
<rect class="card" x="40" y="259" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="259" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="283" r="10"/>
<text class="num" x="62" y="287" text-anchor="middle">2</text>
<text class="t" x="82" y="288">Run it on a page URL, optionally with</text>
<text class="t" x="82" y="310">a format selector</text>
<text class="c" x="82" y="334">yt-dlp -f &quot;bv*+ba/b&quot;</text>
<rect class="cardT" x="472" y="306" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="306" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="330" r="10"/>
<text class="num" x="494" y="334" text-anchor="middle">3</text>
<text class="t" x="514" y="335">Matches the site&#x27;s extractor and lists</text>
<text class="t" x="514" y="357">every available stream, solving</text>
<text class="t" x="514" y="379">YouTube&#x27;s JS challenge</text>
<text class="comp" x="514" y="407">component: extractor + yt-dlp-ejs</text>
<rect class="cardT" x="472" y="451" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="451" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="475" r="10"/>
<text class="num" x="494" y="479" text-anchor="middle">4</text>
<text class="t" x="514" y="480">Picks the best video-only and</text>
<text class="t" x="514" y="502">audio-only formats by your rules</text>
<rect class="cardT" x="472" y="549" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="549" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="573" r="10"/>
<text class="num" x="494" y="577" text-anchor="middle">5</text>
<text class="t" x="514" y="578">Downloads both and has ffmpeg merge</text>
<text class="t" x="514" y="600">them into one file named by the</text>
<text class="t" x="514" y="622">template</text>
<text class="comp" x="514" y="650">component: ffmpeg post-processor</text>
<rect class="val" x="28" y="700" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="724">VALUE</text>
<text class="valT" x="48" y="748">A page URL becomes a best-quality local file without hunting for stream URLs or muxing by</text>
<text class="valT" x="48" y="770">hand</text>
</svg>
