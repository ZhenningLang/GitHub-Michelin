<svg xmlns="http://www.w3.org/2000/svg" width="880" height="779" viewBox="0 0 880 779" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="779" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="643" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="643" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agentation 做的</text>
<path class="edge" d="M62,187 L62,211" marker-end="url(#a)"/>
<path class="hand" d="M408,258.0 C439.0,258.0 439.0,282 470,282" marker-end="url(#a)"/>
<path class="hand" d="M472,304.0 C441.0,304.0 441.0,353 410,353" marker-end="url(#a)"/>
<path class="hand" d="M408,362.5 C439.0,362.5 439.0,400 470,400" marker-end="url(#a)"/>
<path class="hand" d="M472,433.0 C441.0,433.0 441.0,457 410,457" marker-end="url(#a)"/>
<path class="hand" d="M408,466.5 C439.0,466.5 439.0,540 470,540" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="115" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="115" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">一次接入</text>
<text class="t" x="82" y="118">装一个开发依赖</text>
<text class="c" x="82" y="142">npm install agentation -D</text>
<text class="comp" x="82" y="165">组件：npm 包</text>
<rect class="card" x="40" y="213" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="213" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="237" r="10"/>
<text class="num" x="62" y="241" text-anchor="middle">2</text>
<text class="ph" x="82" y="242">一次接入</text>
<text class="t" x="82" y="259">把工具栏挂在应用旁边</text>
<text class="c" x="82" y="283">&lt;Agentation /&gt;</text>
<rect class="cardT" x="472" y="258" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="258" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="282" r="10"/>
<text class="num" x="494" y="286" text-anchor="middle">3</text>
<text class="ph" x="514" y="287">一次接入</text>
<text class="t" x="514" y="304">在页面角落渲染出批注工具栏</text>
<text class="comp" x="514" y="332">组件：工具栏</text>
<rect class="card" x="40" y="329" width="368" height="67" rx="8"/>
<rect class="accY" x="40" y="329" width="4" height="67" rx="2"/>
<circle class="accY" cx="62" cy="353" r="10"/>
<text class="num" x="62" y="357" text-anchor="middle">4</text>
<text class="ph" x="82" y="358">每轮反馈</text>
<text class="t" x="82" y="375">激活它，点那个渲染错了的元素</text>
<rect class="cardT" x="472" y="376" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="376" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="400" r="10"/>
<text class="num" x="494" y="404" text-anchor="middle">5</text>
<text class="ph" x="514" y="405">每轮反馈</text>
<text class="t" x="514" y="422">抓下选择器、盒子、类名、样式、组件路径与源</text>
<text class="t" x="514" y="444">码 file:line</text>
<text class="comp" x="514" y="472">组件：元素识别</text>
<rect class="card" x="40" y="433" width="368" height="67" rx="8"/>
<rect class="accY" x="40" y="433" width="4" height="67" rx="2"/>
<circle class="accY" cx="62" cy="457" r="10"/>
<text class="num" x="62" y="461" text-anchor="middle">6</text>
<text class="ph" x="82" y="462">每轮反馈</text>
<text class="t" x="82" y="479">复制结构化 markdown，贴给你的 agent</text>
<rect class="cardT" x="472" y="516" width="368" height="137" rx="8"/>
<rect class="accT" x="472" y="516" width="4" height="137" rx="2"/>
<circle class="accT" cx="494" cy="540" r="10"/>
<text class="num" x="494" y="544" text-anchor="middle">7</text>
<text class="ph" x="514" y="545">每轮反馈</text>
<text class="t" x="514" y="562">或经 endpoint 实时同步进 agent 读取的</text>
<text class="t" x="514" y="584">MCP 服务</text>
<text class="c" x="514" y="608">npx -y agentation-mcp server</text>
<text class="comp" x="514" y="631">组件：agentation-mcp</text>
<rect class="val" x="28" y="685" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="709">价值</text>
<text class="valT" x="48" y="733">agent 拿到的是能直接 grep 的选择器和 file:line，不用再猜你说的是哪个按钮。</text>
</svg>
