<svg xmlns="http://www.w3.org/2000/svg" width="880" height="655" viewBox="0 0 880 655" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="655" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="519" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="519" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Auto-Editor 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,207.5 C439.0,207.5 439.0,231 470,231" marker-end="url(#a)"/>
<path class="edge" d="M494,257 L494,281" marker-end="url(#a)"/>
<path class="edge" d="M494,333 L494,357" marker-end="url(#a)"/>
<path class="hand" d="M472,395.0 C441.0,395.0 441.0,419 410,419" marker-end="url(#a)"/>
<path class="hand" d="M408,431.5 C439.0,431.5 439.0,481 470,481" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把官方二进制装到 PATH 上</text>
<text class="c" x="82" y="125">brew install auto-editor</text>
<rect class="card" x="40" y="171" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">把命令指向那段你不想逐帧拖的录制</text>
<text class="c" x="82" y="224">auto-editor path/to/your/video.mp4</text>
<rect class="cardT" x="472" y="207" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="207" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="231" r="10"/>
<text class="num" x="494" y="235" text-anchor="middle">3</text>
<text class="t" x="514" y="236">按响度给每个时间点打分，标成静音或有效</text>
<rect class="cardT" x="472" y="283" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="283" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="307" r="10"/>
<text class="num" x="494" y="311" text-anchor="middle">4</text>
<text class="t" x="514" y="312">剪掉静音段，语音前后留一点缓冲，剪口不突兀</text>
<rect class="cardT" x="472" y="359" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="359" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="383" r="10"/>
<text class="num" x="494" y="387" text-anchor="middle">5</text>
<text class="t" x="514" y="388">自己写出剪好的文件——不开编辑器窗口，</text>
<text class="t" x="514" y="410">不进时间轴</text>
<rect class="card" x="40" y="395" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="395" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="419" r="10"/>
<text class="num" x="62" y="423" text-anchor="middle">6</text>
<text class="t" x="82" y="424">还想手工细剪时，改成导出时间线</text>
<text class="c" x="82" y="448">auto-editor example.mp4 --export premiere</text>
<rect class="cardT" x="472" y="457" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="457" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="481" r="10"/>
<text class="num" x="494" y="485" text-anchor="middle">7</text>
<text class="t" x="514" y="486">生成 Premiere、Resolve、Final Cut 等可导</text>
<text class="t" x="514" y="508">入的时间线</text>
<rect class="val" x="28" y="561" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="585">价值</text>
<text class="valT" x="48" y="609">长素材的第一遍粗剪，在你打开编辑器之前就做完了</text>
</svg>
