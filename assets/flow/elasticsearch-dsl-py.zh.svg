<svg xmlns="http://www.w3.org/2000/svg" width="880" height="548" viewBox="0 0 880 548" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="548" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="412" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="412" rx="10"/>
<rect class="pillT" x="474" y="40" width="96.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">DSL 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,240.5 C439.0,240.5 439.0,264 470,264" marker-end="url(#a)"/>
<path class="hand" d="M472,276.0 C441.0,276.0 441.0,338 410,338" marker-end="url(#a)"/>
<path class="hand" d="M408,350.5 C439.0,350.5 439.0,374 470,374" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装官方客户端 8.18+，从它里面导入 DSL（老代</text>
<text class="t" x="82" y="123">码改一下 import）</text>
<text class="c" x="82" y="147">elasticsearch_dsl → elasticsearch.dsl</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">基于客户端和索引新建搜索，链式追加过滤、查</text>
<text class="t" x="82" y="244">询和聚合</text>
<text class="c" x="82" y="268">Search(using=client, index=&quot;my-index&quot;)</text>
<rect class="cardT" x="472" y="240" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="240" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="264" r="10"/>
<text class="num" x="494" y="268" text-anchor="middle">3</text>
<text class="t" x="514" y="269">按名字生成查询对象，合成一个 bool 查询，过</text>
<text class="t" x="514" y="291">滤条件放进 filter 上下文</text>
<rect class="card" x="40" y="314" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">4</text>
<text class="t" x="82" y="343">执行搜索</text>
<text class="c" x="82" y="367">response = s.execute()</text>
<rect class="cardT" x="472" y="350" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="350" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="374" r="10"/>
<text class="num" x="494" y="378" text-anchor="middle">5</text>
<text class="t" x="514" y="379">经底层客户端发出请求，把返回包装成可按属性</text>
<text class="t" x="514" y="401">读取的命中和分桶</text>
<rect class="val" x="28" y="454" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="478">价值</text>
<text class="valT" x="48" y="502">查询成了能重构的 Python 代码，而不是错一个括号就坏掉的嵌套字典</text>
</svg>
