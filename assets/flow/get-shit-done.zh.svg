<text class="t" x="82" y="321">定下阶段 1 的实现决策，再触发规划</text>
<text class="c" x="82" y="345">/gsd-discuss-phase 1 · /gsd-plan-phase 1</text>
<rect class="cardT" x="472" y="341" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="341" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="365" r="10"/>
<text class="num" x="494" y="369" text-anchor="middle">5</text>
<text class="t" x="514" y="370">调研、拆解计划，并校验它装得进一个全新上下</text>
<text class="t" x="514" y="392">文窗口</text>
<text class="comp" x="514" y="420">组件：planner 与 verifier 子代理</text>
<rect class="card" x="40" y="391" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="391" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="415" r="10"/>
<text class="num" x="62" y="419" text-anchor="middle">6</text>
<text class="t" x="82" y="420">启动本阶段执行</text>
<text class="c" x="82" y="444">/gsd-execute-phase 1</text>
<rect class="cardT" x="472" y="464" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="464" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="488" r="10"/>
<text class="num" x="494" y="492" text-anchor="middle">7</text>
<text class="t" x="514" y="493">并行执行器各拿干净的 20 万 token 上下文，</text>
<text class="t" x="514" y="515">每任务独立提交</text>
<text class="comp" x="514" y="543">组件：子代理执行器</text>
<rect class="card" x="40" y="512" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="512" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="536" r="10"/>
<text class="num" x="62" y="540" text-anchor="middle">8</text>
<text class="t" x="82" y="541">走完引导式 UAT，然后交付已验证的阶段</text>
<text class="c" x="82" y="565">/gsd-verify-work 1 · /gsd-ship 1</text>
<rect class="val" x="28" y="617" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="641">价值</text>
<text class="valT" x="48" y="665">每个阶段都在未劣化的全新上下文里执行，git 历史一任务一提交、可审计</text>
</svg>
