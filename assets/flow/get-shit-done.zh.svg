<rect class="laneT" x="460" y="28" width="392" height="575" rx="10"/>
<rect class="pillT" x="474" y="40" width="96.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">GSD 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,218.5 C439.0,218.5 439.0,242 470,242" marker-end="url(#a)"/>
<path class="hand" d="M472,266.5 C441.0,266.5 441.0,316 410,316" marker-end="url(#a)"/>
<path class="hand" d="M408,328.5 C439.0,328.5 439.0,365 470,365" marker-end="url(#a)"/>
<path class="hand" d="M472,389.5 C441.0,389.5 441.0,415 410,415" marker-end="url(#a)"/>
<path class="hand" d="M408,427.5 C439.0,427.5 439.0,488 470,488" marker-end="url(#a)"/>
<path class="hand" d="M472,512.5 C441.0,512.5 441.0,536 410,536" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把命令包装进你的 agent CLI</text>
<text class="c" x="82" y="125">npx get-shit-done-cc@latest</text>
<rect class="card" x="40" y="171" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">新建项目起步（已有代码先</text>
<text class="t" x="82" y="222">/gsd-map-codebase）</text>
<text class="c" x="82" y="246">/gsd-new-project</text>
<rect class="cardT" x="472" y="218" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="218" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="242" r="10"/>
<text class="num" x="494" y="246" text-anchor="middle">3</text>
<text class="t" x="514" y="247">访谈、调研，把需求与路线图写成 .planning/ </text>
<text class="t" x="514" y="269">下持久的 markdown</text>
<text class="comp" x="514" y="297">组件：.planning/ 文档</text>
<rect class="card" x="40" y="292" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
