<svg xmlns="http://www.w3.org/2000/svg" width="880" height="685" viewBox="0 0 880 685" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="685" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="527" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="527" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">bitnet.cpp does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,269.0 C439.0,269.0 439.0,293 470,293" marker-end="url(#a)"/>
<path class="hand" d="M472,328.5 C441.0,328.5 441.0,376 410,376" marker-end="url(#a)"/>
<path class="hand" d="M408,418.5 C439.0,418.5 439.0,442 470,442" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone the repo and install Python</text>
<text class="t" x="82" y="123">dependencies</text>
<text class="c" x="82" y="147">git clone --recursive</text>
<text class="c" x="82" y="166">https://github.com/microsoft/BitNet.git</text>
<rect class="card" x="40" y="212" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Download the official 2B ternary model</text>
<text class="t" x="82" y="263">and run the setup script</text>
<text class="c" x="82" y="287">python setup_env.py -md</text>
<text class="c" x="82" y="306">models/BitNet-b1.58-2B-4T -q i2_s</text>
<rect class="cardT" x="472" y="269" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="269" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="293" r="10"/>
<text class="num" x="494" y="297" text-anchor="middle">3</text>
<text class="t" x="514" y="298">Converts the weights to the I2_S</text>
<text class="t" x="514" y="320">layout and builds the tuned kernels</text>
<text class="t" x="514" y="342">for your CPU</text>
<text class="comp" x="514" y="370">component: setup_env.py</text>
<rect class="card" x="40" y="352" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">4</text>
<text class="t" x="82" y="381">Start a chat loop on the quantized</text>
<text class="t" x="82" y="403">file</text>
<text class="c" x="82" y="427">python run_inference.py -m</text>
<text class="c" x="82" y="446">models/BitNet-b1.58-2B-4T/ggml-model-i2_s.</text>
<text class="c" x="82" y="465">gguf · -cnv</text>
<rect class="cardT" x="472" y="418" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="418" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="442" r="10"/>
<text class="num" x="494" y="446" text-anchor="middle">5</text>
<text class="t" x="514" y="447">Decodes with lookup-and-add ternary</text>
<text class="t" x="514" y="469">kernels — fast and low-energy on plain</text>
<text class="t" x="514" y="491">x86/ARM CPUs, no GPU</text>
<text class="comp" x="514" y="519">component: I2_S kernel</text>
<rect class="val" x="28" y="569" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="593">VALUE</text>
<text class="valT" x="48" y="617">A 2.4B ternary LLM chatting on an ordinary laptop CPU — no GPU, with the README&#x27;s reported</text>
<text class="valT" x="48" y="639">multi-x speedup and large energy savings</text>
</svg>
