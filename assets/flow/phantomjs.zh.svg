<svg xmlns="http://www.w3.org/2000/svg" width="880" height="601" viewBox="0 0 880 601" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="601" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="465" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="465" rx="10"/>
<rect class="pillT" x="474" y="40" width="151.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">PhantomJS 做的</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="edge" d="M62,265 L62,289" marker-end="url(#a)"/>
<path class="hand" d="M408,327.5 C439.0,327.5 439.0,351 470,351" marker-end="url(#a)"/>
<path class="edge" d="M494,399 L494,423" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">下载对应系统的预编译二进制，解压，放进</text>
<text class="t" x="82" y="123">PATH</text>
<rect class="card" x="40" y="170" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">写一个 .js 脚本：打开网址，在加载完的回调</text>
<text class="t" x="82" y="221">里截图，然后退出</text>
<text class="c" x="82" y="245">page.render(&#x27;github.png&#x27;) · phantom.exit()</text>
<rect class="card" x="40" y="291" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="291" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="315" r="10"/>
<text class="num" x="62" y="319" text-anchor="middle">3</text>
<text class="t" x="82" y="320">用这个二进制运行脚本</text>
<text class="c" x="82" y="344">phantomjs github.js</text>
<rect class="cardT" x="472" y="327" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="327" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="351" r="10"/>
<text class="num" x="494" y="355" text-anchor="middle">4</text>
<text class="t" x="514" y="356">用自带的 WebKit 加载页面、执行 JS 和 CS</text>
<text class="t" x="514" y="378">S，不开窗口</text>
<rect class="cardT" x="472" y="425" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="425" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="449" r="10"/>
<text class="num" x="494" y="453" text-anchor="middle">5</text>
<text class="t" x="514" y="454">触发你的回调，写出 PNG、JPEG 或 PDF 文件</text>
<rect class="val" x="28" y="507" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="531">价值</text>
<text class="valT" x="48" y="555">在无显示器的服务器上用真实浏览器引擎拿到截图、PDF 或 DOM 数据——只是引擎停在 2018 年</text>
</svg>
