<svg xmlns="http://www.w3.org/2000/svg" width="880" height="845" viewBox="0 0 880 845" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="845" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="709" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="709" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">earmark 做的</text>
<path class="edge" d="M62,187 L62,211" marker-end="url(#a)"/>
<path class="edge" d="M62,303 L62,327" marker-end="url(#a)"/>
<path class="hand" d="M408,386.5 C439.0,386.5 439.0,410 470,410" marker-end="url(#a)"/>
<path class="hand" d="M472,419.5 C441.0,419.5 441.0,494 410,494" marker-end="url(#a)"/>
<path class="hand" d="M408,515.0 C439.0,515.0 439.0,539 470,539" marker-end="url(#a)"/>
<path class="hand" d="M472,559.5 C441.0,559.5 441.0,610 410,610" marker-end="url(#a)"/>
<path class="hand" d="M408,630.5 C439.0,630.5 439.0,654 470,654" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="115" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="115" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">一次搭建</text>
<text class="t" x="82" y="118">dev 环境装好并挂上批注层</text>
<text class="c" x="82" y="142">npm install -D earmark</text>
<text class="comp" x="82" y="165">组件：批注层</text>
<rect class="card" x="40" y="213" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="213" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="237" r="10"/>
<text class="num" x="62" y="241" text-anchor="middle">2</text>
<text class="ph" x="82" y="242">一次搭建</text>
<text class="t" x="82" y="259">带 dev 开关地挂载</text>
<text class="c" x="82" y="283">createEarmark()</text>
<rect class="card" x="40" y="329" width="368" height="115" rx="8"/>
<rect class="accY" x="40" y="329" width="4" height="115" rx="2"/>
<circle class="accY" cx="62" cy="353" r="10"/>
<text class="num" x="62" y="357" text-anchor="middle">3</text>
<text class="ph" x="82" y="358">一次搭建</text>
<text class="t" x="82" y="375">给打包器配置加打戳插件</text>
<text class="c" x="82" y="399">import earmark from &#x27;vite-plugin-earmark&#x27;</text>
<text class="comp" x="82" y="422">组件：vite-plugin-earmark</text>
<rect class="cardT" x="472" y="386" width="368" height="67" rx="8"/>
<rect class="accT" x="472" y="386" width="4" height="67" rx="2"/>
<circle class="accT" cx="494" cy="410" r="10"/>
<text class="num" x="494" y="414" text-anchor="middle">4</text>
<text class="ph" x="514" y="415">一次搭建</text>
<text class="t" x="514" y="432">dev 构建时给每个元素盖上 file:line 戳</text>
<rect class="card" x="40" y="470" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="470" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="494" r="10"/>
<text class="num" x="62" y="498" text-anchor="middle">5</text>
<text class="ph" x="82" y="499">每轮修复</text>
<text class="t" x="82" y="516">按 alt+a，点中元素，写下要改什么</text>
<text class="c" x="82" y="540">alt+a</text>
<rect class="cardT" x="472" y="515" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="515" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="539" r="10"/>
<text class="num" x="494" y="543" text-anchor="middle">6</text>
<text class="ph" x="514" y="544">每轮修复</text>
<text class="t" x="514" y="561">把选择器、源码行、CSS 规则、盒子与样式解析</text>
<text class="t" x="514" y="583">成 markdown</text>
<rect class="card" x="40" y="586" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="586" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="610" r="10"/>
<text class="num" x="62" y="614" text-anchor="middle">7</text>
<text class="ph" x="82" y="615">每轮修复</text>
<text class="t" x="82" y="632">贴给 agent，或让 agent 经 MCP 挂看守、在</text>
<text class="t" x="82" y="654">图钉上回复</text>
<rect class="cardT" x="472" y="630" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="630" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="654" r="10"/>
<text class="num" x="494" y="658" text-anchor="middle">8</text>
<text class="ph" x="514" y="659">每轮修复</text>
<text class="t" x="514" y="676">用图钉颜色跟踪闭环：蓝是 acknowledged，绿</text>
<text class="t" x="514" y="698">是 resolved</text>
<rect class="val" x="28" y="751" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="775">价值</text>
<text class="valT" x="48" y="799">agent 直接拿到准确的 file:line 和样式表规则——不用 grep 猜你指的是哪个组件。</text>
</svg>
