<svg xmlns="http://www.w3.org/2000/svg" width="880" height="776" viewBox="0 0 880 776" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="776" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="640" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="640" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">ContextGem</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="edge" d="M62,240 L62,264" marker-end="url(#a)"/>
<path class="edge" d="M62,316 L62,340" marker-end="url(#a)"/>
<path class="hand" d="M408,378.5 C439.0,378.5 439.0,402 470,402" marker-end="url(#a)"/>
<path class="hand" d="M472,426.5 C441.0,426.5 441.0,465 410,465" marker-end="url(#a)"/>
<path class="edge" d="M62,552 L62,576" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装入兼容的 Python 环境；部署时锁定研究版本</text>
<text class="c" x="82" y="125">uv add contextgem             # or: pip</text>
<text class="c" x="82" y="144">install -U contextgem</text>
<rect class="card" x="40" y="190" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">创建文本，声明付款条款与带句子引用的异常</text>
<rect class="card" x="40" y="266" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="266" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="290" r="10"/>
<text class="num" x="62" y="294" text-anchor="middle">3</text>
<text class="t" x="82" y="295">配置获准模型端点、凭据与请求限制</text>
<rect class="card" x="40" y="342" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="342" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="366" r="10"/>
<text class="num" x="62" y="370" text-anchor="middle">4</text>
<text class="t" x="82" y="371">对文档发起抽取</text>
<text class="c" x="82" y="395">doc = llm.extract_all(doc)</text>
<rect class="cardT" x="472" y="378" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="378" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="402" r="10"/>
<text class="num" x="494" y="406" text-anchor="middle">5</text>
<text class="t" x="514" y="407">构造模型请求，校验答案并关联来源；报告未解</text>
<text class="t" x="514" y="429">决失败</text>
<text class="comp" x="514" y="457">组件：文档模型与抽取引擎</text>
<rect class="card" x="40" y="441" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="441" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="465" r="10"/>
<text class="num" x="62" y="469" text-anchor="middle">6</text>
<text class="t" x="82" y="470">读取抽取结果，并检查其来源对象</text>
<text class="c" x="82" y="494">anomalies =</text>
<text class="c" x="82" y="513">doc.get_concept_by_name(&quot;Anomalies&quot;).extra</text>
<text class="c" x="82" y="532">cted_items</text>
<rect class="card" x="40" y="578" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="578" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="602" r="10"/>
<text class="num" x="62" y="606" text-anchor="middle">7</text>
<text class="t" x="82" y="607">用自己的语料验证含义；在应用中保存结果和失</text>
<text class="t" x="82" y="629">败任务状态</text>
<rect class="val" x="28" y="682" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="706">价值</text>
<text class="valT" x="48" y="730">拿到有类型且可检查来源位置的文档结果，不必重复搭提示词与引用关联逻辑</text>
</svg>
