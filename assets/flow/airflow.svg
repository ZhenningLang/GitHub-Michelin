<svg xmlns="http://www.w3.org/2000/svg" width="880" height="754" viewBox="0 0 880 754" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="754" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="596" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="596" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Airflow does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,262.5 C439.0,262.5 439.0,286 470,286" marker-end="url(#a)"/>
<path class="hand" d="M472,309.0 C441.0,309.0 441.0,360 410,360" marker-end="url(#a)"/>
<path class="edge" d="M62,450 L62,474" marker-end="url(#a)"/>
<path class="hand" d="M408,512.5 C439.0,512.5 439.0,536 470,536" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install Airflow pinned to a</text>
<text class="t" x="82" y="123">constraints file for a reproducible</text>
<text class="t" x="82" y="145">env</text>
<text class="c" x="82" y="169">pip install &#x27;apache-airflow==3.3.2&#x27;</text>
<rect class="card" x="40" y="215" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Start a full local instance with one</text>
<text class="t" x="82" y="266">command</text>
<text class="c" x="82" y="290">airflow standalone</text>
<rect class="cardT" x="472" y="262" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="262" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="286" r="10"/>
<text class="num" x="494" y="290" text-anchor="middle">3</text>
<text class="t" x="514" y="291">Initializes the metadata DB, creates</text>
<text class="t" x="514" y="313">an admin, runs scheduler, API server,</text>
<text class="t" x="514" y="335">DAG processor</text>
<rect class="card" x="40" y="336" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="336" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="360" r="10"/>
<text class="num" x="62" y="364" text-anchor="middle">4</text>
<text class="t" x="82" y="365">Write each pipeline as a Python DAG</text>
<text class="t" x="82" y="387">file of tasks and dependencies</text>
<text class="c" x="82" y="411">from airflow.sdk import DAG ·</text>
<text class="c" x="82" y="430">@task(retries=3)</text>
<rect class="card" x="40" y="476" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="476" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="500" r="10"/>
<text class="num" x="62" y="504" text-anchor="middle">5</text>
<text class="t" x="82" y="505">Open the UI and unpause the DAG</text>
<text class="c" x="82" y="529">localhost:8080</text>
<rect class="cardT" x="472" y="512" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="512" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="536" r="10"/>
<text class="num" x="494" y="540" text-anchor="middle">6</text>
<text class="t" x="514" y="541">On schedule, hands ready tasks to your</text>
<text class="t" x="514" y="563">executor, records every run, retries</text>
<text class="t" x="514" y="585">and backfills</text>
<rect class="val" x="28" y="638" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="662">VALUE</text>
<text class="valT" x="48" y="686">Scheduled batch pipelines as version-controlled code, with retries, backfills and one</text>
<text class="valT" x="48" y="708">team-wide UI</text>
</svg>
