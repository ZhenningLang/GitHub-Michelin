<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1106" viewBox="0 0 880 1106" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1106" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="948" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="948" rx="10"/>
<rect class="pillT" x="474" y="40" width="221.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agent Laboratory does</text>
<path class="edge" d="M62,184 L62,208" marker-end="url(#a)"/>
<path class="edge" d="M62,322 L62,346" marker-end="url(#a)"/>
<path class="hand" d="M408,402.5 C439.0,402.5 439.0,426 470,426" marker-end="url(#a)"/>
<path class="hand" d="M472,459.0 C441.0,459.0 441.0,507 410,507" marker-end="url(#a)"/>
<path class="hand" d="M408,539.0 C439.0,539.0 439.0,566 470,566" marker-end="url(#a)"/>
<path class="edge" d="M494,678 L494,702" marker-end="url(#a)"/>
<path class="edge" d="M494,818 L494,842" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Set up</text>
<text class="t" x="82" y="118">Create a Python 3.12 env and install</text>
<text class="t" x="82" y="140">its long requirement list</text>
<text class="c" x="82" y="164">pip install -r requirements.txt</text>
<rect class="card" x="40" y="210" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="210" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="234" r="10"/>
<text class="num" x="62" y="238" text-anchor="middle">2</text>
<text class="ph" x="82" y="239">Set up</text>
<text class="t" x="82" y="256">Write your task notes, API key and</text>
<text class="t" x="82" y="278">model backends into the YAML config</text>
<text class="c" x="82" y="302">llm-backend: &quot;o3-mini&quot;</text>
<rect class="card" x="40" y="348" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="348" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="372" r="10"/>
<text class="num" x="62" y="376" text-anchor="middle">3</text>
<text class="ph" x="82" y="377">Each lab</text>
<text class="t" x="82" y="394">Launch the lab on that config</text>
<text class="c" x="82" y="418">python ai_lab_repo.py --yaml-location</text>
<text class="c" x="82" y="437">&quot;experiment_configs/MATH_agentlab.yaml&quot;</text>
<rect class="cardT" x="472" y="402" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="402" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="426" r="10"/>
<text class="num" x="494" y="430" text-anchor="middle">4</text>
<text class="ph" x="514" y="431">Each lab</text>
<text class="t" x="514" y="448">Runs the literature review and folds</text>
<text class="t" x="514" y="470">what it read into a plan</text>
<text class="comp" x="514" y="498">component: literature agents</text>
<rect class="card" x="40" y="483" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="483" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="507" r="10"/>
<text class="num" x="62" y="511" text-anchor="middle">5</text>
<text class="ph" x="82" y="512">Each lab</text>
<text class="t" x="82" y="529">In copilot mode, approve or correct</text>
<text class="t" x="82" y="551">each phase before it moves on</text>
<text class="c" x="82" y="575">copilot-mode: True</text>
<rect class="cardT" x="472" y="542" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="542" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="566" r="10"/>
<text class="num" x="494" y="570" text-anchor="middle">6</text>
<text class="ph" x="514" y="571">Each lab</text>
<text class="t" x="514" y="588">Prepares data and runs the</text>
<text class="t" x="514" y="610">experiments, the MLE-solver writing</text>
<text class="t" x="514" y="632">and repairing the code</text>
<text class="comp" x="514" y="660">component: MLE-solver</text>
<rect class="cardT" x="472" y="704" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="704" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="728" r="10"/>
<text class="num" x="494" y="732" text-anchor="middle">7</text>
<text class="ph" x="514" y="733">Each lab</text>
<text class="t" x="514" y="750">Interprets the results and writes the</text>
<text class="t" x="514" y="772">report in LaTeX</text>
<text class="comp" x="514" y="800">component: report agents</text>
<rect class="cardT" x="472" y="844" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="844" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="868" r="10"/>
<text class="num" x="494" y="872" text-anchor="middle">8</text>
<text class="ph" x="514" y="873">Each lab</text>
<text class="t" x="514" y="890">Scores the draft and can send the lab</text>
<text class="t" x="514" y="912">back for more experiments</text>
<text class="comp" x="514" y="940">component: paper-solver</text>
<rect class="val" x="28" y="990" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="1014">VALUE</text>
<text class="valT" x="48" y="1038">You stop carrying the whole research loop in your head: the phases run on their own, and in</text>
<text class="valT" x="48" y="1060">copilot mode each one pauses for your call</text>
</svg>
