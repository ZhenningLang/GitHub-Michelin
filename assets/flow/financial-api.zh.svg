<svg xmlns="http://www.w3.org/2000/svg" width="880" height="825" viewBox="0 0 880 825" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="825" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="667" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="667" rx="10"/>
<rect class="pillT" x="474" y="40" width="183.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">托管服务与 CLI 做的</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="hand" d="M408,276.5 C439.0,276.5 439.0,300 470,300" marker-end="url(#a)"/>
<path class="edge" d="M494,373 L494,397" marker-end="url(#a)"/>
<path class="hand" d="M472,436.5 C441.0,436.5 441.0,460 410,460" marker-end="url(#a)"/>
<path class="hand" d="M408,485.0 C439.0,485.0 439.0,524 470,524" marker-end="url(#a)"/>
<path class="hand" d="M472,537.5 C441.0,537.5 441.0,584 410,584" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在官网建一把 API Key，装好 CLI 并把 Key </text>
<text class="t" x="82" y="123">交给它</text>
<text class="c" x="82" y="147">hithink-finance auth login</text>
<text class="comp" x="82" y="170">组件：CLI + 系统凭据库</text>
<rect class="card" x="40" y="218" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">用名称或代码发起一次取数</text>
<text class="c" x="82" y="271">hithink-finance market snapshot --thscodes</text>
<text class="c" x="82" y="290">600519.SH</text>
<text class="comp" x="82" y="313">组件：CLI</text>
<rect class="cardT" x="472" y="276" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="276" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="300" r="10"/>
<text class="num" x="494" y="304" text-anchor="middle">3</text>
<text class="t" x="514" y="305">把名称消歧成唯一 thscode，路由到对应的</text>
<text class="t" x="514" y="327">REST/MCP 接口</text>
<text class="comp" x="514" y="355">组件：托管数据服务</text>
<rect class="cardT" x="472" y="399" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="399" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="423" r="10"/>
<text class="num" x="494" y="427" text-anchor="middle">4</text>
<text class="t" x="514" y="428">返回统一信封并保留空值，超大结果落盘</text>
<text class="comp" x="514" y="456">组件：托管数据服务</text>
<rect class="card" x="40" y="436" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="436" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="460" r="10"/>
<text class="num" x="62" y="464" text-anchor="middle">5</text>
<text class="t" x="82" y="465">需要长历史时，初始化本地库</text>
<text class="c" x="82" y="489">hithink-finance data init</text>
<text class="comp" x="82" y="512">组件：本地 DuckDB</text>
<rect class="cardT" x="472" y="500" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="500" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="524" r="10"/>
<text class="num" x="494" y="528" text-anchor="middle">6</text>
<text class="t" x="514" y="529">下载全市场 Parquet 全量包，再按增量写入</text>
<text class="comp" x="514" y="557">组件：CLI 数据管线</text>
<rect class="card" x="40" y="560" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="560" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="584" r="10"/>
<text class="num" x="62" y="588" text-anchor="middle">7</text>
<text class="t" x="82" y="589">直接对本地副本跑 SQL，不必再远端取数</text>
<text class="c" x="82" y="613">hithink-finance db query --sql &quot;SELECT *</text>
<text class="c" x="82" y="632">FROM v_daily_qfq LIMIT 10&quot;</text>
<text class="comp" x="82" y="655">组件：本地 DuckDB</text>
<rect class="val" x="28" y="709" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="733">价值</text>
<text class="valT" x="48" y="757">不用再自己维护爬虫和字段映射：一把 Key 在四个入口上拿到有契约的 A 股字段，长历史落成本地表可直接 S</text>
<text class="valT" x="48" y="779">QL 查</text>
</svg>
