<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1006" viewBox="0 0 880 1006" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1006" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="848" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="848" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Dembrandt does</text>
<path class="edge" d="M62,228 L62,252" marker-end="url(#a)"/>
<path class="hand" d="M408,322.5 C439.0,322.5 439.0,346 470,346" marker-end="url(#a)"/>
<path class="edge" d="M494,458 L494,482" marker-end="url(#a)"/>
<path class="hand" d="M472,541.0 C441.0,541.0 441.0,565 410,565" marker-end="url(#a)"/>
<path class="edge" d="M62,650 L62,674" marker-end="url(#a)"/>
<path class="hand" d="M408,744.5 C439.0,744.5 439.0,768 470,768" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="156" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="156" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Extract</text>
<text class="t" x="82" y="118">Install the CLI and fetch its matching</text>
<text class="t" x="82" y="140">Chromium once</text>
<text class="c" x="82" y="164">npm install -g dembrandt · dembrandt</text>
<text class="c" x="82" y="183">install-browser</text>
<text class="comp" x="82" y="206">component: CLI · Playwright browser</text>
<rect class="card" x="40" y="254" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="254" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="278" r="10"/>
<text class="num" x="62" y="282" text-anchor="middle">2</text>
<text class="ph" x="82" y="283">Extract</text>
<text class="t" x="82" y="300">Point it at a site and pick an export</text>
<text class="t" x="82" y="322">format</text>
<text class="c" x="82" y="346">dembrandt dembrandt.com --dtcg</text>
<text class="comp" x="82" y="369">component: CLI</text>
<rect class="cardT" x="472" y="322" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="322" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="346" r="10"/>
<text class="num" x="494" y="350" text-anchor="middle">3</text>
<text class="ph" x="514" y="351">Extract</text>
<text class="t" x="514" y="368">Renders the page and reads computed</text>
<text class="t" x="514" y="390">styles off elements that actually</text>
<text class="t" x="514" y="412">paint</text>
<text class="comp" x="514" y="440">component: extractors</text>
<rect class="cardT" x="472" y="484" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="484" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="508" r="10"/>
<text class="num" x="494" y="512" text-anchor="middle">4</text>
<text class="ph" x="514" y="513">Extract</text>
<text class="t" x="514" y="530">Clusters colours, type, spacing and</text>
<text class="t" x="514" y="552">radii, elects a primary, writes tokens</text>
<text class="comp" x="514" y="580">component: token formatters</text>
<rect class="card" x="40" y="541" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="541" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="565" r="10"/>
<text class="num" x="62" y="569" text-anchor="middle">5</text>
<text class="ph" x="82" y="570">Gate in CI</text>
<text class="t" x="82" y="587">Commit one run as the baseline</text>
<text class="c" x="82" y="611">dembrandt https://app.example.com</text>
<text class="c" x="82" y="630">--json-only &gt; baseline.json</text>
<rect class="card" x="40" y="676" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="676" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="700" r="10"/>
<text class="num" x="62" y="704" text-anchor="middle">6</text>
<text class="ph" x="82" y="705">Gate in CI</text>
<text class="t" x="82" y="722">Add the drift-gate step against the</text>
<text class="t" x="82" y="744">preview deployment</text>
<text class="c" x="82" y="768">uses: dembrandt/dembrandt@v0.37.0</text>
<text class="comp" x="82" y="791">component: GitHub Action</text>
<rect class="cardT" x="472" y="744" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="744" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="768" r="10"/>
<text class="num" x="494" y="772" text-anchor="middle">7</text>
<text class="ph" x="514" y="773">Gate in CI</text>
<text class="t" x="514" y="790">Re-extracts, scores per-token drift,</text>
<text class="t" x="514" y="812">exits 1 and annotates the PR</text>
<text class="comp" x="514" y="840">component: drift scorer</text>
<rect class="val" x="28" y="890" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="914">VALUE</text>
<text class="valT" x="48" y="938">No more copying hex codes out of devtools, and a moved brand colour fails the PR instead of</text>
<text class="valT" x="48" y="960">reaching production</text>
</svg>
