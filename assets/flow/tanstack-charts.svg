<svg xmlns="http://www.w3.org/2000/svg" width="880" height="729" viewBox="0 0 880 729" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="729" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="571" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="571" rx="10"/>
<rect class="pillT" x="474" y="40" width="211.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TanStack Charts does</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,240.5 C439.0,240.5 439.0,264 470,264" marker-end="url(#a)"/>
<path class="edge" d="M494,334 L494,358" marker-end="url(#a)"/>
<path class="hand" d="M472,408.5 C441.0,408.5 441.0,432 410,432" marker-end="url(#a)"/>
<path class="hand" d="M408,487.0 C439.0,487.0 439.0,511 470,511" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the one package</text>
<text class="c" x="82" y="125">pnpm add @tanstack/charts</text>
<rect class="card" x="40" y="171" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">Define the chart: marks over your</text>
<text class="t" x="82" y="222">original rows, plus x/y scales</text>
<text class="c" x="82" y="246">defineChart</text>
<text class="comp" x="82" y="269">component: grammar (marks, channels,</text>
<text class="comp" x="82" y="288">scales)</text>
<rect class="cardT" x="472" y="240" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="240" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="264" r="10"/>
<text class="num" x="494" y="268" text-anchor="middle">3</text>
<text class="t" x="514" y="269">Infers scale domains from the channels</text>
<text class="t" x="514" y="291">and fits axes and margins to the</text>
<text class="t" x="514" y="313">container</text>
<rect class="cardT" x="472" y="360" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="360" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="384" r="10"/>
<text class="num" x="494" y="388" text-anchor="middle">4</text>
<text class="t" x="514" y="389">Compiles a renderer-neutral scene of</text>
<text class="t" x="514" y="411">keyed shapes</text>
<text class="comp" x="514" y="439">component: scene compiler</text>
<rect class="card" x="40" y="408" width="368" height="158" rx="8"/>
<rect class="accY" x="40" y="408" width="4" height="158" rx="2"/>
<circle class="accY" cx="62" cy="432" r="10"/>
<text class="num" x="62" y="436" text-anchor="middle">5</text>
<text class="t" x="82" y="437">Pass the same definition to your</text>
<text class="t" x="82" y="459">framework&#x27;s Chart component</text>
<text class="c" x="82" y="483">&lt;Chart definition={revenueChart}</text>
<text class="c" x="82" y="502">height={320} ariaLabel=&quot;Monthly revenue&quot;</text>
<text class="c" x="82" y="521">/&gt;</text>
<text class="comp" x="82" y="544">component: framework adapter</text>
<rect class="cardT" x="472" y="487" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="487" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="511" r="10"/>
<text class="num" x="494" y="515" text-anchor="middle">6</text>
<text class="t" x="514" y="516">Renders SVG on the server, hydrates,</text>
<text class="t" x="514" y="538">then follows resizes with tooltips and</text>
<text class="t" x="514" y="560">focus</text>
<rect class="val" x="28" y="613" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="637">VALUE</text>
<text class="valT" x="48" y="661">One typed chart definition that renders in any supported framework and on the server, without</text>
<text class="valT" x="48" y="683">dropping to raw D3 for custom layers</text>
</svg>
