<svg xmlns="http://www.w3.org/2000/svg" width="880" height="747" viewBox="0 0 880 747" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="747" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="611" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="611" rx="10"/>
<rect class="pillT" x="474" y="40" width="96.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">fzf 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="edge" d="M62,310 L62,334" marker-end="url(#a)"/>
<path class="hand" d="M408,372.5 C439.0,372.5 439.0,396 470,396" marker-end="url(#a)"/>
<path class="hand" d="M472,409.5 C441.0,409.5 441.0,459 410,459" marker-end="url(#a)"/>
<path class="hand" d="M408,460.0 C439.0,460.0 439.0,497 470,497" marker-end="url(#a)"/>
<path class="edge" d="M494,545 L494,569" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用包管理器装上这个单一二进制</text>
<text class="c" x="82" y="125">brew install fzf · sudo apt install fzf ·</text>
<text class="c" x="82" y="144">winget install fzf</text>
<rect class="card" x="40" y="190" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">在 shell 配置文件里 source 一次它的</text>
<text class="t" x="82" y="241">集成脚本</text>
<text class="c" x="82" y="265">eval &quot;$(fzf --bash)&quot; · source &lt;(fzf --zsh)</text>
<text class="comp" x="82" y="288">组件：shell 快捷键</text>
<rect class="card" x="40" y="336" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="336" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="360" r="10"/>
<text class="num" x="62" y="364" text-anchor="middle">3</text>
<text class="t" x="82" y="365">按一个快捷键——或把任意列表用管道喂给 fzf</text>
<text class="c" x="82" y="389">CTRL-T · CTRL-R · ALT-C</text>
<rect class="cardT" x="472" y="372" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="372" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="396" r="10"/>
<text class="num" x="494" y="400" text-anchor="middle">4</text>
<text class="t" x="514" y="401">收集列表（遍历目录或读历史），打开挑选界面</text>
<text class="comp" x="514" y="429">组件：内置遍历器</text>
<rect class="card" x="40" y="435" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="435" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="459" r="10"/>
<text class="num" x="62" y="463" text-anchor="middle">5</text>
<text class="t" x="82" y="464">随手敲几个想要的那项里的字母</text>
<rect class="cardT" x="472" y="473" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="473" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="497" r="10"/>
<text class="num" x="494" y="501" text-anchor="middle">6</text>
<text class="t" x="514" y="502">每敲一个键，按模糊匹配分数把整张列表</text>
<text class="t" x="514" y="524">重新排序</text>
<rect class="cardT" x="472" y="571" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="571" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="595" r="10"/>
<text class="num" x="494" y="599" text-anchor="middle">7</text>
<text class="t" x="514" y="600">回车后把选中项写到标准输出或贴到命令行上</text>
<rect class="val" x="28" y="653" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="677">价值</text>
<text class="valT" x="48" y="701">文件、历史命令、分支、PID，任何长列表都变成敲几个字母就能挑中，不用离开 shell</text>
</svg>
