<svg xmlns="http://www.w3.org/2000/svg" width="880" height="844" viewBox="0 0 880 844" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="844" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="708" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="708" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">trafilatura 做的</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="edge" d="M62,294 L62,318" marker-end="url(#a)"/>
<path class="hand" d="M408,375.5 C439.0,375.5 439.0,399 470,399" marker-end="url(#a)"/>
<path class="edge" d="M494,472 L494,496" marker-end="url(#a)"/>
<path class="edge" d="M494,595 L494,619" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">安装这个包（Python API 和命令行一起装上）</text>
<text class="c" x="82" y="125">pip install trafilatura</text>
<text class="comp" x="82" y="148">组件：PyPI 包</text>
<rect class="card" x="40" y="196" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">下载页面，或者直接交入你已抓好的 HTML</text>
<text class="c" x="82" y="249">downloaded = fetch_url(url)</text>
<text class="comp" x="82" y="272">组件：下载器（urllib3）</text>
<rect class="card" x="40" y="320" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="320" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="344" r="10"/>
<text class="num" x="62" y="348" text-anchor="middle">3</text>
<text class="t" x="82" y="349">按你要的格式要正文，顺带元数据</text>
<text class="c" x="82" y="373">extract(downloaded,</text>
<text class="c" x="82" y="392">output_format=&quot;markdown&quot;,</text>
<text class="c" x="82" y="411">with_metadata=True)</text>
<rect class="cardT" x="472" y="375" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="375" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="399" r="10"/>
<text class="num" x="494" y="403" text-anchor="middle">4</text>
<text class="t" x="514" y="404">解析 HTML，留下最像正文的那块，丢掉导航、</text>
<text class="t" x="514" y="426">页脚和小组件</text>
<text class="comp" x="514" y="454">组件：lxml + 提取规则</text>
<rect class="cardT" x="472" y="498" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="498" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="522" r="10"/>
<text class="num" x="494" y="526" text-anchor="middle">5</text>
<text class="t" x="514" y="527">结果太短就换 readability 和 jusText 再</text>
<text class="t" x="514" y="549">试，留更好的</text>
<text class="comp" x="514" y="577">组件：兜底提取器</text>
<rect class="cardT" x="472" y="621" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="621" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="645" r="10"/>
<text class="num" x="494" y="649" text-anchor="middle">6</text>
<text class="t" x="514" y="650">从页面标记里读出标题、作者、日期，按你的格</text>
<text class="t" x="514" y="672">式一起返回</text>
<text class="comp" x="514" y="700">组件：htmldate + 元数据解析</text>
<rect class="val" x="28" y="750" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="774">价值</text>
<text class="valT" x="48" y="798">任何网站都能拿到干净正文和元数据，不用按域名写选择器</text>
</svg>
