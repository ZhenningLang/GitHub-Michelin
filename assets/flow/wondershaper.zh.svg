<svg xmlns="http://www.w3.org/2000/svg" width="880" height="655" viewBox="0 0 880 655" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="655" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="519" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="519" rx="10"/>
<rect class="pillT" x="474" y="40" width="178.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">wondershaper 做的</text>
<path class="edge" d="M62,183 L62,207" marker-end="url(#a)"/>
<path class="hand" d="M408,255.0 C439.0,255.0 439.0,279 470,279" marker-end="url(#a)"/>
<path class="edge" d="M494,330 L494,354" marker-end="url(#a)"/>
<path class="edge" d="M494,453 L494,477" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">克隆仓库，可选地把脚本装到系统里</text>
<text class="c" x="82" y="125">git clone</text>
<text class="c" x="82" y="144">https://github.com/magnific0/wondershaper.</text>
<text class="c" x="82" y="163">git · sudo make install</text>
<rect class="card" x="40" y="209" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="209" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="233" r="10"/>
<text class="num" x="62" y="237" text-anchor="middle">2</text>
<text class="t" x="82" y="238">选好网卡，按 Kbps 设下行 / 上行上限</text>
<text class="c" x="82" y="262">sudo ./wondershaper -a wlp4s0 -u 4096 -d</text>
<text class="c" x="82" y="281">8192</text>
<rect class="cardT" x="472" y="255" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="255" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="279" r="10"/>
<text class="num" x="494" y="283" text-anchor="middle">3</text>
<text class="t" x="514" y="284">在网卡出方向建一棵 HTB 树，分三个优先级类</text>
<text class="comp" x="514" y="312">组件：tc 队列：htb + sfq</text>
<rect class="cardT" x="472" y="356" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="356" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="380" r="10"/>
<text class="num" x="494" y="384" text-anchor="middle">4</text>
<text class="t" x="514" y="385">把入站流量重定向到虚拟网卡 ifb0，下行也一</text>
<text class="t" x="514" y="407">起限住</text>
<text class="comp" x="514" y="435">组件：ifb0</text>
<rect class="cardT" x="472" y="479" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="479" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="503" r="10"/>
<text class="num" x="494" y="507" text-anchor="middle">5</text>
<text class="t" x="514" y="508">脚本退出，内核一直执行限速，直到清除或重启</text>
<rect class="val" x="28" y="561" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="585">价值</text>
<text class="valT" x="48" y="609">一条命令给网卡限速，不用手写 tc 的 qdisc/class/filter 规则</text>
</svg>
