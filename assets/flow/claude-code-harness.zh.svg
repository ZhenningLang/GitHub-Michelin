<svg xmlns="http://www.w3.org/2000/svg" width="880" height="942" viewBox="0 0 880 942" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="942" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="806" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="806" rx="10"/>
<rect class="pillT" x="474" y="40" width="243.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">claude-code-harness 做的</text>
<path class="edge" d="M62,208 L62,232" marker-end="url(#a)"/>
<path class="hand" d="M408,283.0 C439.0,283.0 439.0,307 470,307" marker-end="url(#a)"/>
<path class="hand" d="M472,331.5 C441.0,331.5 441.0,382 410,382" marker-end="url(#a)"/>
<path class="hand" d="M408,416.5 C439.0,416.5 439.0,440 470,440" marker-end="url(#a)"/>
<path class="hand" d="M472,464.5 C441.0,464.5 441.0,525 410,525" marker-end="url(#a)"/>
<path class="hand" d="M408,550.0 C439.0,550.0 439.0,574 470,574" marker-end="url(#a)"/>
<path class="edge" d="M494,670 L494,694" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从 Claude Code 插件市场安装</text>
<text class="c" x="82" y="125">/plugin install</text>
<text class="c" x="82" y="144">claude-code-harness@claude-code-harness-ma</text>
<text class="c" x="82" y="163">rketplace</text>
<text class="comp" x="82" y="186">组件：插件市场</text>
<rect class="card" x="40" y="234" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">2</text>
<text class="t" x="82" y="263">跑一次 setup，激活动词、钩子和护栏</text>
<text class="c" x="82" y="287">/harness-setup</text>
<text class="comp" x="82" y="310">组件：setup 技能</text>
<rect class="cardT" x="472" y="283" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="283" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="307" r="10"/>
<text class="num" x="494" y="311" text-anchor="middle">3</text>
<text class="t" x="514" y="312">把 Go 引擎接进 PreToolUse 钩子：写文件和</text>
<text class="t" x="514" y="334">命令执行前先过检查</text>
<text class="comp" x="514" y="362">组件：钩子 → Go 引擎</text>
<rect class="card" x="40" y="358" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="358" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="382" r="10"/>
<text class="num" x="62" y="386" text-anchor="middle">4</text>
<text class="t" x="82" y="387">把意图和完成标准交给它</text>
<text class="c" x="82" y="411">/harness-plan Improve the README</text>
<text class="c" x="82" y="430">onboarding flow</text>
<text class="comp" x="82" y="453">组件：harness-plan 技能</text>
<rect class="cardT" x="472" y="416" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="416" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="440" r="10"/>
<text class="num" x="494" y="444" text-anchor="middle">5</text>
<text class="t" x="514" y="445">写出 spec.md + Plans.md：范围、验收标准、</text>
<text class="t" x="514" y="467">未知项、停止条件</text>
<text class="comp" x="514" y="495">组件：主 agent</text>
<rect class="card" x="40" y="501" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="501" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="525" r="10"/>
<text class="num" x="62" y="529" text-anchor="middle">6</text>
<text class="t" x="82" y="530">批准或修正契约，然后启动计划</text>
<text class="c" x="82" y="554">/harness-work all</text>
<text class="comp" x="82" y="577">组件：批准门 + 技能</text>
<rect class="cardT" x="472" y="550" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="550" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="574" r="10"/>
<text class="num" x="494" y="578" text-anchor="middle">7</text>
<text class="t" x="514" y="579">按计划实现，跑必需检查，review 发现退回</text>
<text class="t" x="514" y="601">worker 修正</text>
<text class="c" x="514" y="625">/harness-review</text>
<text class="comp" x="514" y="648">组件：worker + 护栏引擎</text>
<rect class="cardT" x="472" y="696" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="696" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="720" r="10"/>
<text class="num" x="494" y="724" text-anchor="middle">8</text>
<text class="t" x="514" y="725">只把验证过的证据打包成 changelog、tag 和</text>
<text class="t" x="514" y="747">release</text>
<text class="c" x="514" y="771">/harness-release</text>
<text class="comp" x="514" y="794">组件：发布技能</text>
<rect class="val" x="28" y="848" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="872">价值</text>
<text class="valT" x="48" y="896">你只批准两份契约；agent 不再自己给自己打分，危险命令执行前先被拦下检查</text>
</svg>
