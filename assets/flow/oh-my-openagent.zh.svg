<svg xmlns="http://www.w3.org/2000/svg" width="880" height="731" viewBox="0 0 880 731" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="731" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="595" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="595" rx="10"/>
<rect class="pillT" x="474" y="40" width="96.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OmO 做的</text>
<path class="hand" d="M408,117.0 C439.0,117.0 439.0,141 470,141" marker-end="url(#a)"/>
<path class="hand" d="M472,161.5 C441.0,161.5 441.0,212 410,212" marker-end="url(#a)"/>
<path class="hand" d="M408,233.0 C439.0,233.0 439.0,257 470,257" marker-end="url(#a)"/>
<path class="hand" d="M472,279.0 C441.0,279.0 441.0,328 410,328" marker-end="url(#a)"/>
<path class="hand" d="M408,349.0 C439.0,349.0 439.0,375 470,375" marker-end="url(#a)"/>
<path class="edge" d="M494,465 L494,489" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">搭建</text>
<text class="t" x="82" y="118">全局安装独立 CLI</text>
<text class="c" x="82" y="142">bun add -g omo-ai · npm i -g omo-ai</text>
<rect class="cardT" x="472" y="117" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="117" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="141" r="10"/>
<text class="num" x="494" y="145" text-anchor="middle">2</text>
<text class="ph" x="514" y="146">搭建</text>
<text class="t" x="514" y="163">带来 omo TUI，内置任务分类路由、技能</text>
<text class="t" x="514" y="185">与记忆系统</text>
<rect class="card" x="40" y="188" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="188" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="212" r="10"/>
<text class="num" x="62" y="216" text-anchor="middle">3</text>
<text class="ph" x="82" y="217">搭建</text>
<text class="t" x="82" y="234">在项目里启动并登录已有订阅</text>
<text class="c" x="82" y="258">omo · /login</text>
<rect class="cardT" x="472" y="233" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="233" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="257" r="10"/>
<text class="num" x="494" y="261" text-anchor="middle">4</text>
<text class="ph" x="514" y="262">搭建</text>
<text class="t" x="514" y="279">保存登录态，把每类任务映射到一条模型回退链</text>
<text class="comp" x="514" y="307">组件：模型链</text>
<rect class="card" x="40" y="304" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="304" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="328" r="10"/>
<text class="num" x="62" y="332" text-anchor="middle">5</text>
<text class="ph" x="82" y="333">每个任务</text>
<text class="t" x="82" y="350">描述任务，用一个关键词升级处理</text>
<text class="c" x="82" y="374">ulw · mass ulw</text>
<rect class="cardT" x="472" y="351" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="351" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="375" r="10"/>
<text class="num" x="494" y="379" text-anchor="middle">6</text>
<text class="ph" x="514" y="380">每个任务</text>
<text class="t" x="514" y="397">先摸清代码库，在记事本里做计划，按分类派发</text>
<text class="t" x="514" y="419">子任务</text>
<text class="comp" x="514" y="447">组件：task 工具</text>
<rect class="cardT" x="472" y="491" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="491" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="515" r="10"/>
<text class="num" x="494" y="519" text-anchor="middle">7</text>
<text class="ph" x="514" y="520">每个任务</text>
<text class="t" x="514" y="537">结果先过校验才算完成，沉淀的笔记留到</text>
<text class="t" x="514" y="559">下个会话</text>
<text class="comp" x="514" y="587">组件：ulw-execute 与 Kibitzer</text>
<rect class="val" x="28" y="637" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="661">价值</text>
<text class="valT" x="48" y="685">你交出去的是整个任务而不只是一句提示：工作分摊到多个模型、验证通过才算完成、记忆还能带到下个会话</text>
</svg>
