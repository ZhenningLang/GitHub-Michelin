<svg xmlns="http://www.w3.org/2000/svg" width="880" height="910" viewBox="0 0 880 910" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="910" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="752" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="752" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Sourcegraph does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,313 L62,337" marker-end="url(#a)"/>
<path class="hand" d="M408,375.0 C439.0,375.0 439.0,399 470,399" marker-end="url(#a)"/>
<path class="edge" d="M494,494 L494,518" marker-end="url(#a)"/>
<path class="hand" d="M472,568.5 C441.0,568.5 441.0,592 410,592" marker-end="url(#a)"/>
<path class="hand" d="M408,604.0 C439.0,604.0 439.0,667 470,667" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Check out the last Apache-2.0 commit;</text>
<text class="t" x="82" y="123">later code is Enterprise-licensed</text>
<text class="c" x="82" y="147">1cd36d2dbbd2a9ab638cc437d208d2717eaefb0b</text>
<rect class="card" x="40" y="193" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Install the toolchain and start the</text>
<text class="t" x="82" y="244">whole stack with the repo&#x27;s dev tool</text>
<text class="c" x="82" y="268">sg setup · sg start</text>
<text class="comp" x="82" y="291">component: sg developer tool</text>
<rect class="card" x="40" y="339" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="339" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="363" r="10"/>
<text class="num" x="62" y="367" text-anchor="middle">3</text>
<text class="t" x="82" y="368">Connect your code hosts with a token</text>
<text class="t" x="82" y="390">that can read every repo</text>
<rect class="cardT" x="472" y="375" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="375" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="399" r="10"/>
<text class="num" x="494" y="403" text-anchor="middle">4</text>
<text class="t" x="514" y="404">Lists the repos and keeps a full clone</text>
<text class="t" x="514" y="426">of each in sync, within code-host rate</text>
<text class="t" x="514" y="448">limits</text>
<text class="comp" x="514" y="476">component: repo-updater + gitserver</text>
<rect class="cardT" x="472" y="520" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="520" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="544" r="10"/>
<text class="num" x="494" y="548" text-anchor="middle">5</text>
<text class="t" x="514" y="549">Builds a trigram index of every</text>
<text class="t" x="514" y="571">default branch</text>
<text class="comp" x="514" y="599">component: Zoekt</text>
<rect class="card" x="40" y="568" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="568" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="592" r="10"/>
<text class="num" x="62" y="596" text-anchor="middle">6</text>
<text class="t" x="82" y="597">Type one query in the web UI across</text>
<text class="t" x="82" y="619">all repositories</text>
<rect class="cardT" x="472" y="643" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="643" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="667" r="10"/>
<text class="num" x="494" y="671" text-anchor="middle">7</text>
<text class="t" x="514" y="672">Answers from the index, scans</text>
<text class="t" x="514" y="694">unindexed branches directly, and links</text>
<text class="t" x="514" y="716">matches to definitions and references</text>
<text class="comp" x="514" y="744">component: frontend + searcher</text>
<rect class="val" x="28" y="794" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="818">VALUE</text>
<text class="valT" x="48" y="842">One search box over every repository and branch — and, for this snapshot, a readable</text>
<text class="valT" x="48" y="864">blueprint of how that product was built</text>
</svg>
