<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1039" viewBox="0 0 880 1039" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1039" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="881" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="881" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenScience does</text>
<path class="edge" d="M62,228 L62,252" marker-end="url(#a)"/>
<path class="edge" d="M62,385 L62,409" marker-end="url(#a)"/>
<path class="hand" d="M408,478.0 C439.0,478.0 439.0,502 470,502" marker-end="url(#a)"/>
<path class="hand" d="M472,546.0 C441.0,546.0 441.0,595 410,595" marker-end="url(#a)"/>
<path class="hand" d="M408,615.5 C439.0,615.5 439.0,664 470,664" marker-end="url(#a)"/>
<path class="edge" d="M494,776 L494,800" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="156" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="156" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Set up once</text>
<text class="t" x="82" y="118">Install the CLI and open it on your</text>
<text class="t" x="82" y="140">project folder</text>
<text class="c" x="82" y="164">npm install -g @synsci/openscience ·</text>
<text class="c" x="82" y="183">openscience ~/research/my-project</text>
<text class="comp" x="82" y="206">component: openscience CLI</text>
<rect class="card" x="40" y="254" width="368" height="131" rx="8"/>
<rect class="accY" x="40" y="254" width="4" height="131" rx="2"/>
<circle class="accY" cx="62" cy="278" r="10"/>
<text class="num" x="62" y="282" text-anchor="middle">2</text>
<text class="ph" x="82" y="283">Set up once</text>
<text class="t" x="82" y="300">Connect a model: your own API key, or</text>
<text class="t" x="82" y="322">a local endpoint</text>
<text class="c" x="82" y="346">openscience keys add · openscience local</text>
<text class="c" x="82" y="365">add</text>
<rect class="card" x="40" y="411" width="368" height="134" rx="8"/>
<rect class="accY" x="40" y="411" width="4" height="134" rx="2"/>
<circle class="accY" cx="62" cy="435" r="10"/>
<text class="num" x="62" y="439" text-anchor="middle">3</text>
<text class="ph" x="82" y="440">Every task</text>
<text class="t" x="82" y="457">Describe the research task in plain</text>
<text class="t" x="82" y="479">language, optionally agreeing on</text>
<text class="t" x="82" y="501">method first</text>
<text class="c" x="82" y="525">/plan</text>
<rect class="cardT" x="472" y="478" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="478" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="502" r="10"/>
<text class="num" x="494" y="506" text-anchor="middle">4</text>
<text class="ph" x="514" y="507">Every task</text>
<text class="t" x="514" y="524">The lead agent works the turn step by</text>
<text class="t" x="514" y="546">step: shell, Python/R kernels, files,</text>
<text class="t" x="514" y="568">science connectors</text>
<text class="comp" x="514" y="596">component: lead agent + tools</text>
<rect class="card" x="40" y="571" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="571" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="595" r="10"/>
<text class="num" x="62" y="599" text-anchor="middle">5</text>
<text class="ph" x="82" y="600">Every task</text>
<text class="t" x="82" y="617">Approve the risky command or new</text>
<text class="t" x="82" y="639">network host it asks about</text>
<rect class="cardT" x="472" y="640" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="640" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="664" r="10"/>
<text class="num" x="494" y="668" text-anchor="middle">6</text>
<text class="ph" x="514" y="669">Every task</text>
<text class="t" x="514" y="686">Bounded subtasks run on parallel</text>
<text class="t" x="514" y="708">workers; the lead keeps synthesis and</text>
<text class="t" x="514" y="730">the final say</text>
<text class="comp" x="514" y="758">component: worker agents</text>
<rect class="cardT" x="472" y="802" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="802" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="826" r="10"/>
<text class="num" x="494" y="830" text-anchor="middle">7</text>
<text class="ph" x="514" y="831">Every task</text>
<text class="t" x="514" y="848">The answer lands with the full trace</text>
<text class="t" x="514" y="870">and the files it wrote in your project</text>
<rect class="val" x="28" y="923" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="947">VALUE</text>
<text class="valT" x="48" y="971">A checkable result on your disk — data, code, figures, report and the trace — not a confident</text>
<text class="valT" x="48" y="993">paragraph</text>
</svg>
