<svg xmlns="http://www.w3.org/2000/svg" width="880" height="624" viewBox="0 0 880 624" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="624" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="488" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="488" rx="10"/>
<rect class="pillT" x="474" y="40" width="105.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">deja 做的</text>
<path class="edge" d="M62,162 L62,186" marker-end="url(#a)"/>
<path class="hand" d="M408,244.0 C439.0,244.0 439.0,268 470,268" marker-end="url(#a)"/>
<path class="hand" d="M472,301.0 C441.0,301.0 441.0,350 410,350" marker-end="url(#a)"/>
<path class="hand" d="M408,382.0 C439.0,382.0 439.0,408 470,408" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">装一次</text>
<text class="t" x="82" y="118">用安装脚本或包管理器装上 deja 二进制</text>
<text class="c" x="82" y="142">brew install deja-vu</text>
<rect class="card" x="40" y="188" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="188" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="212" r="10"/>
<text class="num" x="62" y="216" text-anchor="middle">2</text>
<text class="ph" x="82" y="217">装一次</text>
<text class="t" x="82" y="234">一条命令接进它发现的所有 agent，并建</text>
<text class="t" x="82" y="256">好首个索引</text>
<text class="c" x="82" y="280">deja install --auto</text>
<rect class="cardT" x="472" y="244" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="244" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="268" r="10"/>
<text class="num" x="494" y="272" text-anchor="middle">3</text>
<text class="ph" x="514" y="273">装一次</text>
<text class="t" x="514" y="290">把磁盘上已有的所有会话记录解析成一份本地索</text>
<text class="t" x="514" y="312">引，随手剥离凭据</text>
<text class="comp" x="514" y="340">组件：索引器</text>
<rect class="card" x="40" y="326" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="326" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="350" r="10"/>
<text class="num" x="62" y="354" text-anchor="middle">4</text>
<text class="ph" x="82" y="355">每次会话</text>
<text class="t" x="82" y="372">照常干活；想起旧决定时开新会话或在终</text>
<text class="t" x="82" y="394">端直接搜</text>
<text class="c" x="82" y="418">deja &quot;connection pool exhausted&quot;</text>
<rect class="cardT" x="472" y="384" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="384" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="408" r="10"/>
<text class="num" x="494" y="412" text-anchor="middle">5</text>
<text class="ph" x="514" y="413">每次会话</text>
<text class="t" x="514" y="430">送回命中的会话：当时的决定、动过的文件、此</text>
<text class="t" x="514" y="452">后有无变化</text>
<text class="comp" x="514" y="480">组件：MCP 召回</text>
<rect class="val" x="28" y="530" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="554">价值</text>
<text class="valT" x="48" y="578">装上第一天起，几个月的历史——连不再用的 agent 也算——就能替你回答</text>
</svg>
