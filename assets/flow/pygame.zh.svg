<svg xmlns="http://www.w3.org/2000/svg" width="880" height="718" viewBox="0 0 880 718" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="718" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="582" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="582" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">pygame 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,263 L62,287" marker-end="url(#a)"/>
<path class="hand" d="M408,346.0 C439.0,346.0 439.0,370 470,370" marker-end="url(#a)"/>
<path class="edge" d="M494,418 L494,442" marker-end="url(#a)"/>
<path class="edge" d="M494,516 L494,540" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装 wheel 包，常见平台上 SDL 已经打包在里面</text>
<text class="c" x="82" y="125">pip install pygame</text>
<rect class="card" x="40" y="171" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">开一个窗口，加载图片、声音和字体</text>
<text class="c" x="82" y="224">pygame.display.set_mode ·</text>
<text class="c" x="82" y="243">pygame.image.load</text>
<rect class="card" x="40" y="289" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="289" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="313" r="10"/>
<text class="num" x="62" y="317" text-anchor="middle">3</text>
<text class="t" x="82" y="318">写游戏循环：读事件、改位置、贴图、刷</text>
<text class="t" x="82" y="340">新、限帧</text>
<text class="c" x="82" y="364">pygame.event.get() · pygame.display.flip()</text>
<text class="c" x="82" y="383">· clock.tick(60)</text>
<rect class="cardT" x="472" y="346" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="346" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="370" r="10"/>
<text class="num" x="494" y="374" text-anchor="middle">4</text>
<text class="t" x="514" y="375">通过 SDL 把键盘、鼠标、窗口事件收进</text>
<text class="t" x="514" y="397">一个队列</text>
<rect class="cardT" x="472" y="444" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="444" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="468" r="10"/>
<text class="num" x="494" y="472" text-anchor="middle">5</text>
<text class="t" x="514" y="473">把你的图层拷进窗口，flip 时显示出完</text>
<text class="t" x="514" y="495">整的一帧</text>
<rect class="cardT" x="472" y="542" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="542" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="566" r="10"/>
<text class="num" x="494" y="570" text-anchor="middle">6</text>
<text class="t" x="514" y="571">把循环卡在你定的帧率上，同时由混音器放声音</text>
<rect class="val" x="28" y="624" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="648">价值</text>
<text class="valT" x="48" y="672">用纯 Python 就有了能玩的窗口、输入和声音，不用学引擎或编辑器</text>
</svg>
