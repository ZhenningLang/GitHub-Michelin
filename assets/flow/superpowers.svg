<svg xmlns="http://www.w3.org/2000/svg" width="880" height="822" viewBox="0 0 880 822" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="822" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="686" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="686" rx="10"/>
<rect class="pillT" x="474" y="40" width="303.8" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">superpowers makes the agent do</text>
<path class="hand" d="M408,118.0 C439.0,118.0 439.0,142 470,142" marker-end="url(#a)"/>
<path class="hand" d="M472,165.0 C441.0,165.0 441.0,214 410,214" marker-end="url(#a)"/>
<path class="hand" d="M408,215.0 C439.0,215.0 439.0,262 470,262" marker-end="url(#a)"/>
<path class="hand" d="M472,285.5 C441.0,285.5 441.0,309 410,309" marker-end="url(#a)"/>
<path class="hand" d="M408,310.0 C439.0,310.0 439.0,383 470,383" marker-end="url(#a)"/>
<path class="hand" d="M472,406.5 C441.0,406.5 441.0,430 410,430" marker-end="url(#a)"/>
<path class="hand" d="M408,431.0 C439.0,431.0 439.0,504 470,504" marker-end="url(#a)"/>
<path class="edge" d="M494,575 L494,599" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the plugin</text>
<text class="c" x="82" y="125">/plugin install</text>
<text class="c" x="82" y="144">superpowers@claude-plugins-official</text>
<rect class="cardT" x="472" y="118" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="118" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="142" r="10"/>
<text class="num" x="494" y="146" text-anchor="middle">2</text>
<text class="t" x="514" y="147">Ships initial instructions that make</text>
<text class="t" x="514" y="169">the agent check for a relevant skill</text>
<text class="t" x="514" y="191">before any task</text>
<rect class="card" x="40" y="190" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">3</text>
<text class="t" x="82" y="219">Ask for what you want, as usual</text>
<rect class="cardT" x="472" y="238" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="238" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="262" r="10"/>
<text class="num" x="494" y="266" text-anchor="middle">4</text>
<text class="t" x="514" y="267">Probes what you really want and shows</text>
<text class="t" x="514" y="289">the design in short chunks</text>
<text class="c" x="514" y="313">brainstorming</text>
<rect class="card" x="40" y="285" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="285" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="309" r="10"/>
<text class="num" x="62" y="313" text-anchor="middle">5</text>
<text class="t" x="82" y="314">Approve the design</text>
<rect class="cardT" x="472" y="359" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="359" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="383" r="10"/>
<text class="num" x="494" y="387" text-anchor="middle">6</text>
<text class="t" x="514" y="388">Opens an isolated worktree and splits</text>
<text class="t" x="514" y="410">work into 2–5 minute tasks</text>
<text class="c" x="514" y="434">using-git-worktrees · writing-plans</text>
<rect class="card" x="40" y="406" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="406" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="430" r="10"/>
<text class="num" x="62" y="434" text-anchor="middle">7</text>
<text class="t" x="82" y="435">Say go</text>
<rect class="cardT" x="472" y="480" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="480" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="504" r="10"/>
<text class="num" x="494" y="508" text-anchor="middle">8</text>
<text class="t" x="514" y="509">Dispatches a subagent per task with</text>
<text class="t" x="514" y="531">TDD, reviewing after each</text>
<text class="c" x="514" y="555">subagent-driven-development</text>
<rect class="cardT" x="472" y="601" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="601" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="625" r="10"/>
<text class="num" x="494" y="629" text-anchor="middle">9</text>
<text class="t" x="514" y="630">Runs the tests and asks: merge, open a</text>
<text class="t" x="514" y="652">PR, or discard</text>
<text class="c" x="514" y="676">finishing-a-development-branch</text>
<rect class="val" x="28" y="728" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="752">VALUE</text>
<text class="valT" x="48" y="776">The agent follows a disciplined process and works autonomously for hours without drifting</text>
</svg>
