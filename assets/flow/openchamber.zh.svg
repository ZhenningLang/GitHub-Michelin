<svg xmlns="http://www.w3.org/2000/svg" width="880" height="673" viewBox="0 0 880 673" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="673" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="537" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="537" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenChamber 做的</text>
<path class="hand" d="M408,108.5 C439.0,108.5 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,144.0 C441.0,144.0 441.0,195 410,195" marker-end="url(#a)"/>
<path class="hand" d="M408,196.0 C439.0,196.0 439.0,231 470,231" marker-end="url(#a)"/>
<path class="hand" d="M472,243.0 C441.0,243.0 441.0,271 410,271" marker-end="url(#a)"/>
<path class="hand" d="M408,272.0 C439.0,272.0 439.0,329 470,329" marker-end="url(#a)"/>
<path class="hand" d="M472,341.0 C441.0,341.0 441.0,365 410,365" marker-end="url(#a)"/>
<path class="edge" d="M62,413 L62,437" marker-end="url(#a)"/>
<path class="hand" d="M408,475.5 C439.0,475.5 439.0,499 470,499" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上并启动：桌面版安装包，或 CLI 安装脚本</text>
<text class="c" x="82" y="125">openchamber --ui-password be-creative-here</text>
<rect class="cardT" x="472" y="108" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">替你启动并托管 OpenCode，列出项目，</text>
<text class="t" x="514" y="159">只监听本机</text>
<rect class="card" x="40" y="171" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">3</text>
<text class="t" x="82" y="200">开一个会话，给它一个终点，而不是一问一答</text>
<rect class="cardT" x="472" y="207" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="207" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="231" r="10"/>
<text class="num" x="494" y="235" text-anchor="middle">4</text>
<text class="t" x="514" y="236">每轮结束后审计结果，让 agent 一直干到完</text>
<text class="t" x="514" y="258">成、卡住或超出预算</text>
<rect class="card" x="40" y="247" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="247" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="271" r="10"/>
<text class="num" x="62" y="275" text-anchor="middle">5</text>
<text class="t" x="82" y="276">把同一个任务同时交给最多五个模型</text>
<rect class="cardT" x="472" y="305" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="305" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="329" r="10"/>
<text class="num" x="494" y="333" text-anchor="middle">6</text>
<text class="t" x="514" y="334">每个 run 一条会话、可选独立 worktree，你</text>
<text class="t" x="514" y="356">挑最好的那个</text>
<rect class="card" x="40" y="341" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="341" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="365" r="10"/>
<text class="num" x="62" y="369" text-anchor="middle">7</text>
<text class="t" x="82" y="370">按有序的 stop 读改动，或指着页面元素把样式</text>
<text class="t" x="82" y="392">和报错发给它</text>
<rect class="card" x="40" y="439" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="439" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="463" r="10"/>
<text class="num" x="62" y="467" text-anchor="middle">8</text>
<text class="t" x="82" y="468">用一次性二维码把另一台设备配对进来</text>
<text class="c" x="82" y="492">openchamber connect-url --qr</text>
<rect class="cardT" x="472" y="475" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="475" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="499" r="10"/>
<text class="num" x="494" y="503" text-anchor="middle">9</text>
<text class="t" x="514" y="504">端到端加密地中转会话，你在任何地方都能接着</text>
<text class="t" x="514" y="526">答，不用开端口</text>
<rect class="val" x="28" y="579" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="603">价值</text>
<text class="valT" x="48" y="627">你在任何设备上都能掌控 agent 的工作：你不在时它继续跑，评审、git 和 PR 就在对话旁边</text>
</svg>
