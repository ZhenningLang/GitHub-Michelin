<svg xmlns="http://www.w3.org/2000/svg" width="880" height="552" viewBox="0 0 880 552" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="552" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="416" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="416" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">SkillsGate 做的</text>
<path class="hand" d="M408,97.0 C439.0,97.0 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,156.5 C441.0,156.5 441.0,180 410,180" marker-end="url(#a)"/>
<path class="hand" d="M408,192.0 C439.0,192.0 439.0,255 470,255" marker-end="url(#a)"/>
<path class="edge" d="M494,328 L494,352" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从最新 release 下载桌面安装包并打开</text>
<rect class="cardT" x="472" y="108" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">识别已装的 agent，按 agent 列出全部已装</text>
<text class="t" x="514" y="159">skill</text>
<text class="comp" x="514" y="187">组件：主进程扫描器与 SQLite</text>
<rect class="card" x="40" y="156" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="156" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="180" r="10"/>
<text class="num" x="62" y="184" text-anchor="middle">3</text>
<text class="t" x="82" y="185">在 Discover 页搜索，勾选目标 agent，按</text>
<text class="t" x="82" y="207">Install</text>
<rect class="cardT" x="472" y="231" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="231" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="255" r="10"/>
<text class="num" x="494" y="259" text-anchor="middle">4</text>
<text class="t" x="514" y="260">克隆源仓库，把其中 skill 复制进</text>
<text class="t" x="514" y="282">~/.agents/skills</text>
<text class="comp" x="514" y="310">组件：真身 skill 目录</text>
<rect class="cardT" x="472" y="354" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="354" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="378" r="10"/>
<text class="num" x="494" y="382" text-anchor="middle">5</text>
<text class="t" x="514" y="383">把 skill 符号链接进每个勾选 agent 的目</text>
<text class="t" x="514" y="405">录，并记入锁文件</text>
<rect class="val" x="28" y="458" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="482">价值</text>
<text class="valT" x="48" y="506">每个 skill 只有一份，所有 agent 一目了然——不再往每个 agent 的隐藏目录里手动拷 SKILL.md</text>
</svg>
