<svg xmlns="http://www.w3.org/2000/svg" width="880" height="704" viewBox="0 0 880 704" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="704" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="546" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="546" rx="10"/>
<rect class="pillT" x="474" y="40" width="211.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">use-select (v0) does</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="hand" d="M408,287.5 C439.0,287.5 439.0,311 470,311" marker-end="url(#a)"/>
<path class="hand" d="M472,334.0 C441.0,334.0 441.0,407 410,407" marker-end="url(#a)"/>
<path class="hand" d="M408,440.0 C439.0,440.0 439.0,464 470,464" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the legacy hook — the only</text>
<text class="t" x="82" y="123">released code of this repo</text>
<text class="c" x="82" y="147">yarn add use-select · npm i -s use-select</text>
<text class="comp" x="82" y="170">component: use-select 0.0.6 (npm)</text>
<rect class="card" x="40" y="218" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">Call the hook with your options,</text>
<text class="t" x="82" y="269">current value and change handler</text>
<text class="c" x="82" y="293">useSelect({ multi, options, value,</text>
<text class="c" x="82" y="312">onChange, optionsRef })</text>
<text class="comp" x="82" y="335">component: useSelect hook</text>
<rect class="cardT" x="472" y="287" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="287" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="311" r="10"/>
<text class="num" x="494" y="315" text-anchor="middle">3</text>
<text class="t" x="514" y="316">Tracks search text, open state and the</text>
<text class="t" x="514" y="338">highlighted option, and filters the</text>
<text class="t" x="514" y="360">options</text>
<rect class="card" x="40" y="383" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="383" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="407" r="10"/>
<text class="num" x="62" y="411" text-anchor="middle">4</text>
<text class="t" x="82" y="412">Spread its prop getters onto your own</text>
<text class="t" x="82" y="434">input and option elements</text>
<text class="c" x="82" y="458">getInputProps() · getOptionProps({index:</text>
<text class="c" x="82" y="477">1})</text>
<rect class="cardT" x="472" y="440" width="368" height="116" rx="8"/>
<rect class="accT" x="472" y="440" width="4" height="116" rx="2"/>
<circle class="accT" cx="494" cy="464" r="10"/>
<text class="num" x="494" y="468" text-anchor="middle">5</text>
<text class="t" x="514" y="469">Handles</text>
<text class="t" x="514" y="491">arrow/Page/Home/End/Enter/Escape/Backs</text>
<text class="t" x="514" y="513">pace keys and outside clicks, then</text>
<text class="t" x="514" y="535">calls onChange</text>
<rect class="val" x="28" y="588" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="612">VALUE</text>
<text class="valT" x="48" y="636">No hand-written keyboard, search and open/close state for a custom select — but only via an</text>
<text class="valT" x="48" y="658">unmaintained 2019 React-16 hook; the TanStack rewrite has no API yet</text>
</svg>
