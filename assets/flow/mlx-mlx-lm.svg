<svg xmlns="http://www.w3.org/2000/svg" width="880" height="699" viewBox="0 0 880 699" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="699" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="541" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="541" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">mlx-lm does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,261.0 C439.0,261.0 439.0,285 470,285" marker-end="url(#a)"/>
<path class="edge" d="M494,333 L494,357" marker-end="url(#a)"/>
<path class="hand" d="M472,406.0 C441.0,406.0 441.0,430 410,430" marker-end="url(#a)"/>
<path class="hand" d="M408,453.5 C439.0,453.5 439.0,503 470,503" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the package on an</text>
<text class="t" x="82" y="123">Apple-silicon Mac</text>
<text class="c" x="82" y="147">pip install mlx-lm</text>
<rect class="card" x="40" y="193" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Load a model by Hugging Face repo id,</text>
<text class="t" x="82" y="244">usually a pre-quantized mlx-community</text>
<text class="t" x="82" y="266">one</text>
<text class="c" x="82" y="290">load(&quot;mlx-community/Mistral-7B-Instruct-v0</text>
<text class="c" x="82" y="309">.3-4bit&quot;)</text>
<rect class="cardT" x="472" y="261" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="261" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="285" r="10"/>
<text class="num" x="494" y="289" text-anchor="middle">3</text>
<text class="t" x="514" y="290">Downloads weights and tokenizer from</text>
<text class="t" x="514" y="312">the Hub and caches them on disk</text>
<rect class="cardT" x="472" y="359" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="359" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="383" r="10"/>
<text class="num" x="494" y="387" text-anchor="middle">4</text>
<text class="t" x="514" y="388">Builds the architecture in MLX and</text>
<text class="t" x="514" y="410">loads weights into memory shared by</text>
<text class="t" x="514" y="432">CPU and GPU</text>
<rect class="card" x="40" y="406" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="406" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="430" r="10"/>
<text class="num" x="62" y="434" text-anchor="middle">5</text>
<text class="t" x="82" y="435">Apply the chat template and ask it to</text>
<text class="t" x="82" y="457">generate</text>
<text class="c" x="82" y="481">generate(model, tokenizer, prompt=prompt)</text>
<rect class="cardT" x="472" y="479" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="479" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="503" r="10"/>
<text class="num" x="494" y="507" text-anchor="middle">6</text>
<text class="t" x="514" y="508">Runs the prompt on the Apple GPU and</text>
<text class="t" x="514" y="530">returns tokens, reusing a KV cache</text>
<rect class="val" x="28" y="583" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="607">VALUE</text>
<text class="valT" x="48" y="631">A Hugging Face model runs on your Mac from plain Python — no GGUF conversion, no separate</text>
<text class="valT" x="48" y="653">server</text>
</svg>
