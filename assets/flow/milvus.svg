<svg xmlns="http://www.w3.org/2000/svg" width="880" height="753" viewBox="0 0 880 753" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="753" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="595" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="595" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Milvus does</text>
<path class="hand" d="M408,108.5 C439.0,108.5 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,156.5 C441.0,156.5 441.0,195 410,195" marker-end="url(#a)"/>
<path class="edge" d="M62,285 L62,309" marker-end="url(#a)"/>
<path class="hand" d="M408,368.0 C439.0,368.0 439.0,392 470,392" marker-end="url(#a)"/>
<path class="hand" d="M472,415.0 C441.0,415.0 441.0,475 410,475" marker-end="url(#a)"/>
<path class="hand" d="M408,508.0 C439.0,508.0 439.0,532 470,532" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Start a standalone server in Docker</text>
<text class="c" x="82" y="125">bash standalone_embed.sh start</text>
<rect class="cardT" x="472" y="108" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">Runs Milvus with embedded etcd and</text>
<text class="t" x="514" y="159">local storage, serving on port 19530</text>
<text class="comp" x="514" y="187">component: milvus-standalone container</text>
<rect class="card" x="40" y="171" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">3</text>
<text class="t" x="82" y="200">Connect with the Python SDK and create</text>
<text class="t" x="82" y="222">a collection sized to your embeddings</text>
<text class="c" x="82" y="246">client.create_collection(collection_name=&quot;</text>
<text class="c" x="82" y="265">demo_collection&quot;, dimension=768)</text>
<rect class="card" x="40" y="311" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">4</text>
<text class="t" x="82" y="340">Insert your vectors together with</text>
<text class="t" x="82" y="362">their metadata fields</text>
<text class="c" x="82" y="386">client.insert(collection_name=&quot;demo_collec</text>
<text class="c" x="82" y="405">tion&quot;, data=data)</text>
<rect class="cardT" x="472" y="368" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="368" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="392" r="10"/>
<text class="num" x="494" y="396" text-anchor="middle">5</text>
<text class="t" x="514" y="397">Logs the writes, packs them into</text>
<text class="t" x="514" y="419">segments and builds an ANN index over</text>
<text class="t" x="514" y="441">them</text>
<rect class="card" x="40" y="451" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="451" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="475" r="10"/>
<text class="num" x="62" y="479" text-anchor="middle">6</text>
<text class="t" x="82" y="480">Search with a batch of query vectors</text>
<text class="t" x="82" y="502">and a top-k limit</text>
<text class="c" x="82" y="526">client.search(collection_name=&quot;demo_collec</text>
<text class="c" x="82" y="545">tion&quot;, data=query_vectors, limit=2)</text>
<rect class="cardT" x="472" y="508" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="508" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="532" r="10"/>
<text class="num" x="494" y="536" text-anchor="middle">7</text>
<text class="t" x="514" y="537">Searches the loaded segments, applies</text>
<text class="t" x="514" y="559">filters and merges one top-k answer</text>
<text class="comp" x="514" y="587">component: query node</text>
<rect class="val" x="28" y="637" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="661">VALUE</text>
<text class="valT" x="48" y="685">Filtered nearest-neighbor search over a collection that can grow from one container to a</text>
<text class="valT" x="48" y="707">sharded cluster without changing client code</text>
</svg>
