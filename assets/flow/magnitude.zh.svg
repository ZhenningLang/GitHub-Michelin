<svg xmlns="http://www.w3.org/2000/svg" width="880" height="545" viewBox="0 0 880 545" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="545" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="409" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="409" rx="10"/>
<rect class="pillT" x="474" y="40" width="151.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Magnitude 做的</text>
<path class="hand" d="M408,108.0 C439.0,108.0 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,165.0 C441.0,165.0 441.0,194 410,194" marker-end="url(#a)"/>
<path class="hand" d="M408,206.5 C439.0,206.5 439.0,272 470,272" marker-end="url(#a)"/>
<path class="hand" d="M472,273.0 C441.0,273.0 441.0,308 410,308" marker-end="url(#a)"/>
<path class="hand" d="M408,320.5 C439.0,320.5 439.0,348 470,348" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">安装并打开桌面 App，它自带 magnitude</text>
<text class="t" x="82" y="123"> 命令行</text>
<rect class="cardT" x="472" y="108" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">给你的机器做硬件画像，按估算的 tok/s、精</text>
<text class="t" x="514" y="159">度、内存给模型排名</text>
<text class="c" x="514" y="183">magnitude hardware · catalog</text>
<text class="c" x="514" y="202">recommendations</text>
<rect class="card" x="40" y="170" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">3</text>
<text class="t" x="82" y="199">在 Discover 里挑一个推荐模型并下载</text>
<text class="c" x="82" y="223">magnitude catalog pull</text>
<rect class="cardT" x="472" y="248" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="248" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="272" r="10"/>
<text class="num" x="494" y="276" text-anchor="middle">4</text>
<text class="t" x="514" y="277">按你的硬件调好上下文长度与投机解码</text>
<rect class="card" x="40" y="284" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="284" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="308" r="10"/>
<text class="num" x="62" y="312" text-anchor="middle">5</text>
<text class="t" x="82" y="313">在 Connections 里接上你已经在用的 agent</text>
<text class="c" x="82" y="337">magnitude connections add</text>
<rect class="cardT" x="472" y="324" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="324" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="348" r="10"/>
<text class="num" x="494" y="352" text-anchor="middle">6</text>
<text class="t" x="514" y="353">本地起 OpenAI / Anthropic 兼容端点，按需</text>
<text class="t" x="514" y="375">加载和卸载模型</text>
<text class="c" x="514" y="399">127.0.0.1:10100</text>
<rect class="val" x="28" y="451" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="475">价值</text>
<text class="valT" x="48" y="499">不用再猜这台机器能跑哪个模型，现有 agent 也不用手改配置就能用上</text>
</svg>
