<svg xmlns="http://www.w3.org/2000/svg" width="880" height="840" viewBox="0 0 880 840" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="840" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="682" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="682" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Graphiti does</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="edge" d="M62,351 L62,375" marker-end="url(#a)"/>
<path class="hand" d="M408,424.5 C439.0,424.5 439.0,448 470,448" marker-end="url(#a)"/>
<path class="edge" d="M494,496 L494,520" marker-end="url(#a)"/>
<path class="hand" d="M472,558.0 C441.0,558.0 441.0,582 410,582" marker-end="url(#a)"/>
<path class="hand" d="M408,605.5 C439.0,605.5 439.0,644 470,644" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the library and start a graph</text>
<text class="t" x="82" y="123">database</text>
<text class="c" x="82" y="147">pip install graphiti-core · docker compose</text>
<text class="c" x="82" y="166">up</text>
<text class="comp" x="82" y="189">component: graphiti-core + graph DB</text>
<rect class="card" x="40" y="237" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">Connect to the database, with an LLM</text>
<text class="t" x="82" y="288">key in the environment</text>
<text class="c" x="82" y="312">Graphiti(neo4j_uri, neo4j_user,</text>
<text class="c" x="82" y="331">neo4j_password)</text>
<rect class="card" x="40" y="377" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="377" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="401" r="10"/>
<text class="num" x="62" y="405" text-anchor="middle">3</text>
<text class="t" x="82" y="406">Feed each new message or JSON record</text>
<text class="t" x="82" y="428">in as an episode</text>
<text class="c" x="82" y="452">await graphiti.add_episode(...)</text>
<rect class="cardT" x="472" y="424" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="424" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="448" r="10"/>
<text class="num" x="494" y="452" text-anchor="middle">4</text>
<text class="t" x="514" y="453">An LLM extracts entities and facts and</text>
<text class="t" x="514" y="475">merges them with known ones</text>
<rect class="cardT" x="472" y="522" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="522" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="546" r="10"/>
<text class="num" x="494" y="550" text-anchor="middle">5</text>
<text class="t" x="514" y="551">Older facts the new one contradicts</text>
<text class="t" x="514" y="573">get an end date, not deleted</text>
<rect class="card" x="40" y="558" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="558" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="582" r="10"/>
<text class="num" x="62" y="586" text-anchor="middle">6</text>
<text class="t" x="82" y="587">Before the agent answers, search the</text>
<text class="t" x="82" y="609">graph</text>
<text class="c" x="82" y="633">await graphiti.search(&#x27;...&#x27;)</text>
<rect class="cardT" x="472" y="620" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="620" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="644" r="10"/>
<text class="num" x="494" y="648" text-anchor="middle">7</text>
<text class="t" x="514" y="649">Returns matching facts via embeddings,</text>
<text class="t" x="514" y="671">keywords and graph links</text>
<rect class="val" x="28" y="724" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="748">VALUE</text>
<text class="valT" x="48" y="772">The agent answers from what is true now, and can still trace when and from which message each</text>
<text class="valT" x="48" y="794">fact came</text>
</svg>
