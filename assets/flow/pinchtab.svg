<svg xmlns="http://www.w3.org/2000/svg" width="880" height="787" viewBox="0 0 880 787" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="787" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="629" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="629" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">PinchTab does</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,178.5 C441.0,178.5 441.0,217 410,217" marker-end="url(#a)"/>
<path class="edge" d="M62,313 L62,337" marker-end="url(#a)"/>
<path class="hand" d="M408,375.5 C439.0,375.5 439.0,399 470,399" marker-end="url(#a)"/>
<path class="hand" d="M472,434.5 C441.0,434.5 441.0,462 410,462" marker-end="url(#a)"/>
<path class="hand" d="M408,474.5 C439.0,474.5 439.0,544 470,544" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the Go binary and register it</text>
<text class="t" x="82" y="123">as a background daemon</text>
<text class="c" x="82" y="147">pinchtab daemon install</text>
<rect class="cardT" x="472" y="119" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">A control-plane server starts on</text>
<text class="t" x="514" y="170">127.0.0.1:9867 with a bearer token and</text>
<text class="t" x="514" y="192">a default headless Chrome</text>
<text class="comp" x="514" y="220">component: server</text>
<rect class="card" x="40" y="193" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">Drop the shipped skill into your</text>
<text class="t" x="82" y="244">agent&#x27;s skills directory</text>
<text class="c" x="82" y="268">pinchtab skill update</text>
<text class="comp" x="82" y="291">component: agent skill</text>
<rect class="card" x="40" y="339" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="339" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="363" r="10"/>
<text class="num" x="62" y="367" text-anchor="middle">4</text>
<text class="t" x="82" y="368">Navigate and snapshot in one call</text>
<text class="c" x="82" y="392">pinchtab nav https://pinchtab.com --snap</text>
<rect class="cardT" x="472" y="375" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="375" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="399" r="10"/>
<text class="num" x="494" y="403" text-anchor="middle">5</text>
<text class="t" x="514" y="404">Drives Chrome over CDP and returns a</text>
<text class="t" x="514" y="426">text snapshot — each interactive</text>
<text class="t" x="514" y="448">element tagged with a ref</text>
<text class="comp" x="514" y="476">component: snapshot refs</text>
<rect class="card" x="40" y="438" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="438" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="462" r="10"/>
<text class="num" x="62" y="466" text-anchor="middle">6</text>
<text class="t" x="82" y="467">Act on a ref instead of a selector</text>
<text class="c" x="82" y="491">pinchtab click e5</text>
<rect class="cardT" x="472" y="520" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="520" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="544" r="10"/>
<text class="num" x="494" y="548" text-anchor="middle">7</text>
<text class="t" x="514" y="549">Profiles keep cookies and storage on</text>
<text class="t" x="514" y="571">disk, so a logged-in session survives</text>
<text class="t" x="514" y="593">restarts</text>
<text class="comp" x="514" y="621">component: profiles</text>
<rect class="val" x="28" y="671" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="695">VALUE</text>
<text class="valT" x="48" y="719">A browser step costs one round trip of text, not a screenshot to read or a selector to</text>
<text class="valT" x="48" y="741">maintain — and the browser stays warm between steps</text>
</svg>
