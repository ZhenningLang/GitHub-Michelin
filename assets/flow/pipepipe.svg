<svg xmlns="http://www.w3.org/2000/svg" width="880" height="741" viewBox="0 0 880 741" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="741" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="583" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="583" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">PipePipe does</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="hand" d="M408,206.0 C439.0,206.0 439.0,230 470,230" marker-end="url(#a)"/>
<path class="edge" d="M494,303 L494,327" marker-end="url(#a)"/>
<path class="edge" d="M494,448 L494,472" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the APK from F-Droid,</text>
<text class="t" x="82" y="123">IzzyOnDroid or GitHub Releases</text>
<rect class="card" x="40" y="170" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">Search, or share a YouTube / BiliBili</text>
<text class="t" x="82" y="221">link into the app</text>
<rect class="cardT" x="472" y="206" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="206" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="230" r="10"/>
<text class="num" x="494" y="234" text-anchor="middle">3</text>
<text class="t" x="514" y="235">Reads the page and the site&#x27;s internal</text>
<text class="t" x="514" y="257">API itself — no Google account needed</text>
<text class="comp" x="514" y="285">component: PipePipeExtractor</text>
<rect class="cardT" x="472" y="329" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="329" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="353" r="10"/>
<text class="num" x="494" y="357" text-anchor="middle">4</text>
<text class="t" x="514" y="358">For YouTube, earns a playback token in</text>
<text class="t" x="514" y="380">the system WebView and streams over</text>
<text class="t" x="514" y="402">SABR</text>
<text class="comp" x="514" y="430">component: WebView token provider</text>
<rect class="cardT" x="472" y="474" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="474" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="498" r="10"/>
<text class="num" x="494" y="502" text-anchor="middle">5</text>
<text class="t" x="514" y="503">Plays in its own player, skipping</text>
<text class="t" x="514" y="525">sponsor segments, and keeps going in</text>
<text class="t" x="514" y="547">the background</text>
<text class="comp" x="514" y="575">component: ExoPlayer-based player</text>
<rect class="val" x="28" y="625" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="649">VALUE</text>
<text class="valT" x="48" y="673">You watch and listen without ads, sponsor reads, a Google login or the official app — and</text>
<text class="valT" x="48" y="695">background play is free</text>
</svg>
