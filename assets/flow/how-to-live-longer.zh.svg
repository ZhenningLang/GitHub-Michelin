<svg xmlns="http://www.w3.org/2000/svg" width="880" height="585" viewBox="0 0 880 585" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="585" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="449" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="449" rx="10"/>
<rect class="pillT" x="474" y="40" width="121.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">这份指南做的</text>
<path class="hand" d="M408,109.5 C439.0,109.5 439.0,133 470,133" marker-end="url(#a)"/>
<path class="edge" d="M494,204 L494,228" marker-end="url(#a)"/>
<path class="hand" d="M472,277.5 C441.0,277.5 441.0,301 410,301" marker-end="url(#a)"/>
<path class="hand" d="M408,313.5 C439.0,313.5 439.0,375 470,375" marker-end="url(#a)"/>
<path class="hand" d="M472,387.0 C441.0,387.0 441.0,411 410,411" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">打开中文 README（或英文版），从头往下读</text>
<text class="comp" x="82" y="129">组件：README.md · README_en.md</text>
<rect class="cardT" x="472" y="109" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="109" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="133" r="10"/>
<text class="num" x="494" y="137" text-anchor="middle">2</text>
<text class="t" x="514" y="138">先提醒：数字只是相关、不能相加、部分研究互</text>
<text class="t" x="514" y="160">相矛盾</text>
<text class="c" x="514" y="184">4. 分析 · 4. Analysis</text>
<rect class="cardT" x="472" y="230" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="230" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="254" r="10"/>
<text class="num" x="494" y="258" text-anchor="middle">3</text>
<text class="t" x="514" y="259">列出约二十个习惯，每条标出报告的全因</text>
<text class="t" x="514" y="281">死亡率变化</text>
<text class="c" x="514" y="305">5. 行动 · 5. Action</text>
<rect class="card" x="40" y="277" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="277" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="301" r="10"/>
<text class="num" x="62" y="305" text-anchor="middle">4</text>
<text class="t" x="82" y="306">挑一个你在意的习惯，跳到它的证据条目</text>
<text class="c" x="82" y="330">6. 证据 · 6. Reference</text>
<rect class="cardT" x="472" y="351" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="351" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="375" r="10"/>
<text class="num" x="494" y="379" text-anchor="middle">5</text>
<text class="t" x="514" y="380">给出一篇科普转述，多数附原始研究链接和摘录</text>
<text class="t" x="514" y="402">的数字</text>
<rect class="card" x="40" y="387" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="387" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="411" r="10"/>
<text class="num" x="62" y="415" text-anchor="middle">6</text>
<text class="t" x="82" y="416">打开原始研究，判断是否适用于自己，再</text>
<text class="t" x="82" y="438">调整习惯</text>
<rect class="val" x="28" y="491" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="515">价值</text>
<text class="valT" x="48" y="539">一页纸按报告的死亡率效应排好日常习惯，每个数字都能追到出处——不用再一篇篇攒养生建议</text>
</svg>
