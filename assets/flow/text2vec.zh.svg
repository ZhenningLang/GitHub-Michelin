<svg xmlns="http://www.w3.org/2000/svg" width="880" height="692" viewBox="0 0 880 692" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="692" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="556" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="556" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">text2vec 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,247.0 C439.0,247.0 439.0,271 470,271" marker-end="url(#a)"/>
<path class="hand" d="M472,272.0 C441.0,272.0 441.0,354 410,354" marker-end="url(#a)"/>
<path class="hand" d="M408,376.0 C439.0,376.0 439.0,400 470,400" marker-end="url(#a)"/>
<path class="hand" d="M472,412.0 C441.0,412.0 441.0,472 410,472" marker-end="url(#a)"/>
<path class="hand" d="M408,494.0 C439.0,494.0 439.0,518 470,518" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">先装 PyTorch，再装这个库</text>
<text class="c" x="82" y="125">pip install torch · pip install -U</text>
<text class="c" x="82" y="144">text2vec</text>
<rect class="card" x="40" y="190" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">按 Hugging Face 名字加载一个已发布</text>
<text class="t" x="82" y="241">的中文模型</text>
<text class="c" x="82" y="265">SentenceModel(&quot;shibing624/text2vec-base-ch</text>
<text class="c" x="82" y="284">inese&quot;)</text>
<rect class="cardT" x="472" y="247" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="247" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="271" r="10"/>
<text class="num" x="494" y="275" text-anchor="middle">3</text>
<text class="t" x="514" y="276">首次使用时下载并缓存权重，之后在本地运行</text>
<rect class="card" x="40" y="330" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="330" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="354" r="10"/>
<text class="num" x="62" y="358" text-anchor="middle">4</text>
<text class="t" x="82" y="359">把整份答案库编码一次</text>
<text class="c" x="82" y="383">corpus_embeddings =</text>
<text class="c" x="82" y="402">embedder.encode(corpus)</text>
<rect class="cardT" x="472" y="376" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="376" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="400" r="10"/>
<text class="num" x="494" y="404" text-anchor="middle">5</text>
<text class="t" x="514" y="405">把每句话变成一条定长向量（base 模型是 768 </text>
<text class="t" x="514" y="427">个数）</text>
<rect class="card" x="40" y="448" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="448" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="472" r="10"/>
<text class="num" x="62" y="476" text-anchor="middle">6</text>
<text class="t" x="82" y="477">编码用户的问题，到答案库里搜</text>
<text class="c" x="82" y="501">semantic_search(query_embedding,</text>
<text class="c" x="82" y="520">corpus_embeddings, top_k=5)</text>
<rect class="cardT" x="472" y="494" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="494" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="518" r="10"/>
<text class="num" x="494" y="522" text-anchor="middle">7</text>
<text class="t" x="514" y="523">用余弦相似度给每条答案打分，返回前 k 条的编</text>
<text class="t" x="514" y="545">号和分数</text>
<rect class="val" x="28" y="598" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="622">价值</text>
<text class="valT" x="48" y="646">中文问句匹配开箱即用：不用先攒训练集，也不用起一个检索服务</text>
</svg>
