<svg xmlns="http://www.w3.org/2000/svg" width="880" height="825" viewBox="0 0 880 825" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="825" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="689" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="689" rx="10"/>
<rect class="pillT" x="474" y="40" width="197.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Spirula Studio 做的</text>
<path class="edge" d="M62,169 L62,193" marker-end="url(#a)"/>
<path class="hand" d="M408,255.0 C439.0,255.0 439.0,279 470,279" marker-end="url(#a)"/>
<path class="edge" d="M494,352 L494,376" marker-end="url(#a)"/>
<path class="hand" d="M472,415.5 C441.0,415.5 441.0,439 410,439" marker-end="url(#a)"/>
<path class="hand" d="M408,473.5 C439.0,473.5 439.0,503 470,503" marker-end="url(#a)"/>
<path class="edge" d="M494,576 L494,600" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">下载对应平台的发布包解压——一个可执行文件，</text>
<text class="t" x="82" y="123">不装 Python 和 COLMAP</text>
<text class="comp" x="82" y="151">组件：spirula 可执行文件</text>
<rect class="card" x="40" y="195" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="195" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="219" r="10"/>
<text class="num" x="62" y="223" text-anchor="middle">2</text>
<text class="t" x="82" y="224">把内置 SfM 指向一个照片文件夹（或</text>
<text class="t" x="82" y="246">视频抽帧）</text>
<text class="c" x="82" y="270">spirula sfm auto IMAGES/ -o WORKSPACE/</text>
<text class="comp" x="82" y="293">组件：内置 SfM</text>
<rect class="cardT" x="472" y="255" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="255" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="279" r="10"/>
<text class="num" x="494" y="283" text-anchor="middle">3</text>
<text class="t" x="514" y="284">在 GPU 上提特征、做匹配，解出每台相机的位</text>
<text class="t" x="514" y="306">姿和稀疏点云</text>
<text class="comp" x="514" y="334">组件：内置 SfM</text>
<rect class="cardT" x="472" y="378" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="378" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="402" r="10"/>
<text class="num" x="494" y="406" text-anchor="middle">4</text>
<text class="t" x="514" y="407">写出训练器能直接读的 COLMAP 格式数据集</text>
<text class="comp" x="514" y="435">组件：COLMAP 格式工作目录</text>
<rect class="card" x="40" y="415" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="415" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="439" r="10"/>
<text class="num" x="62" y="443" text-anchor="middle">5</text>
<text class="t" x="82" y="444">在这个数据集上开训，可选 360-camera 等预设</text>
<text class="c" x="82" y="468">spirula train [&lt;preset&gt;] --data</text>
<text class="c" x="82" y="487">&lt;colmap_dataset_dir&gt;</text>
<text class="comp" x="82" y="510">组件：命令行训练器</text>
<rect class="cardT" x="472" y="479" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="479" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="503" r="10"/>
<text class="num" x="494" y="507" text-anchor="middle">6</text>
<text class="t" x="514" y="508">用 Vulkan 或 CUDA 优化数百万个高斯，并把</text>
<text class="t" x="514" y="530">进度推到网页查看器</text>
<text class="comp" x="514" y="558">组件：训练引擎 + 网页查看器</text>
<rect class="cardT" x="472" y="602" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="602" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="626" r="10"/>
<text class="num" x="494" y="630" text-anchor="middle">7</text>
<text class="t" x="514" y="631">保存含 splat.ply 的检查点，可直接查看、编</text>
<text class="t" x="514" y="653">辑或转网格</text>
<text class="comp" x="514" y="681">组件：检查点写出</text>
<rect class="val" x="28" y="731" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="755">价值</text>
<text class="valT" x="48" y="779">照片或视频变成训练好的 splat，任意厂商 GPU 都能跑，不用自己拼 Python、CUDA 和 COLMAP</text>
</svg>
