<svg xmlns="http://www.w3.org/2000/svg" width="880" height="690" viewBox="0 0 880 690" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="690" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="532" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="532" rx="10"/>
<rect class="pillT" x="474" y="40" width="211.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TanStack Config does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,270.5 C439.0,270.5 439.0,294 470,294" marker-end="url(#a)"/>
<path class="hand" d="M472,329.5 C441.0,329.5 441.0,379 410,379" marker-end="url(#a)"/>
<path class="hand" d="M408,423.0 C439.0,423.0 439.0,447 470,447" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add the shared lint and build presets</text>
<text class="t" x="82" y="123">as dev dependencies</text>
<text class="c" x="82" y="147">pnpm add -D @tanstack/eslint-config · pnpm</text>
<text class="c" x="82" y="166">add -D @tanstack/vite-config</text>
<rect class="card" x="40" y="212" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Spread the shared rules into</text>
<text class="t" x="82" y="263">eslint.config.js, then your own</text>
<text class="t" x="82" y="285">overrides</text>
<text class="c" x="82" y="309">...tanstackConfig</text>
<rect class="cardT" x="472" y="270" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="270" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="294" r="10"/>
<text class="num" x="494" y="298" text-anchor="middle">3</text>
<text class="t" x="514" y="299">Lints with type-aware TypeScript,</text>
<text class="t" x="514" y="321">import, Node and stylistic rules;</text>
<text class="t" x="514" y="343">skips dist, .nx, coverage</text>
<text class="comp" x="514" y="371">component: @tanstack/eslint-config</text>
<rect class="card" x="40" y="355" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="355" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="379" r="10"/>
<text class="num" x="62" y="383" text-anchor="middle">4</text>
<text class="t" x="82" y="384">Merge its build preset last in</text>
<text class="t" x="82" y="406">vite.config.ts, naming the entry and</text>
<text class="t" x="82" y="428">source dir</text>
<text class="c" x="82" y="452">tanstackViteConfig({ entry:</text>
<text class="c" x="82" y="471">&#x27;./src/index.ts&#x27;, srcDir: &#x27;./src&#x27; })</text>
<rect class="cardT" x="472" y="423" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="423" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="447" r="10"/>
<text class="num" x="494" y="451" text-anchor="middle">5</text>
<text class="t" x="514" y="452">Emits ESM + CJS files and .d.ts/.d.cts</text>
<text class="t" x="514" y="474">types with fixed import extensions;</text>
<text class="t" x="514" y="496">fails on type errors</text>
<text class="comp" x="514" y="524">component: @tanstack/vite-config</text>
<rect class="val" x="28" y="574" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="598">VALUE</text>
<text class="valT" x="48" y="622">A package that lints and dual-publishes the way TanStack&#x27;s own libraries do — without</text>
<text class="valT" x="48" y="644">hand-writing the ESLint rule set or the dual-format Vite build</text>
</svg>
