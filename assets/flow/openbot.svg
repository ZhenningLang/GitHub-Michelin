<svg xmlns="http://www.w3.org/2000/svg" width="880" height="866" viewBox="0 0 880 866" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="866" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="708" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="708" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenBot does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,307 L62,331" marker-end="url(#a)"/>
<path class="hand" d="M408,369.5 C439.0,369.5 439.0,393 470,393" marker-end="url(#a)"/>
<path class="hand" d="M472,417.5 C441.0,417.5 441.0,456 410,456" marker-end="url(#a)"/>
<path class="edge" d="M62,527 L62,551" marker-end="url(#a)"/>
<path class="hand" d="M408,599.0 C439.0,599.0 439.0,623 470,623" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone the template, copy the env file</text>
<text class="t" x="82" y="123">and install</text>
<text class="c" x="82" y="147">cp .env.example .env · bun install</text>
<rect class="card" x="40" y="193" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Connect a CopilotKit Intelligence</text>
<text class="t" x="82" y="244">project and add a model key</text>
<text class="c" x="82" y="268">npx --yes copilotkit@latest login · bun</text>
<text class="c" x="82" y="287">scripts/setup-learning.ts</text>
<rect class="card" x="40" y="333" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">3</text>
<text class="t" x="82" y="362">Start the whole stack</text>
<text class="c" x="82" y="386">bash scripts/start.sh</text>
<rect class="cardT" x="472" y="369" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="369" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="393" r="10"/>
<text class="num" x="494" y="397" text-anchor="middle">4</text>
<text class="t" x="514" y="398">Brings up Postgres, migrations, API,</text>
<text class="t" x="514" y="420">app and bots; serves localhost:3010</text>
<text class="comp" x="514" y="448">component: start script + supervisor</text>
<rect class="card" x="40" y="432" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="432" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="456" r="10"/>
<text class="num" x="62" y="460" text-anchor="middle">5</text>
<text class="t" x="82" y="461">Write a deny rule for browser/file/MCP</text>
<text class="t" x="82" y="483">actions</text>
<text class="c" x="82" y="507">/admin/boundaries</text>
<rect class="card" x="40" y="553" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="553" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="577" r="10"/>
<text class="num" x="62" y="581" text-anchor="middle">6</text>
<text class="t" x="82" y="582">Ask a coworker to do a task on the web</text>
<text class="c" x="82" y="606">Open news.ycombinator.com and tell me the</text>
<text class="c" x="82" y="625">top story.</text>
<rect class="cardT" x="472" y="599" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="599" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="623" r="10"/>
<text class="num" x="494" y="627" text-anchor="middle">7</text>
<text class="t" x="514" y="628">Checks each tool call against the</text>
<text class="t" x="514" y="650">policy, writes an audit row, then</text>
<text class="t" x="514" y="672">drives the bot&#x27;s own browser</text>
<text class="comp" x="514" y="700">component: server gateway</text>
<rect class="val" x="28" y="750" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="774">VALUE</text>
<text class="valT" x="48" y="798">Agents act in real web apps for your staff, and you stop taking their word for it — every</text>
<text class="valT" x="48" y="820">action was policy-checked first and is on the record</text>
</svg>
