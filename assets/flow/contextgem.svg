<svg xmlns="http://www.w3.org/2000/svg" width="880" height="952" viewBox="0 0 880 952" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="952" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="794" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="794" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">ContextGem</text>
<path class="edge" d="M62,208 L62,232" marker-end="url(#a)"/>
<path class="edge" d="M62,328 L62,352" marker-end="url(#a)"/>
<path class="edge" d="M62,426 L62,450" marker-end="url(#a)"/>
<path class="hand" d="M408,488.5 C439.0,488.5 439.0,512 470,512" marker-end="url(#a)"/>
<path class="hand" d="M472,547.5 C441.0,547.5 441.0,575 410,575" marker-end="url(#a)"/>
<path class="edge" d="M62,684 L62,708" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install in a compatible Python</text>
<text class="t" x="82" y="123">environment; pin the reviewed version</text>
<text class="t" x="82" y="145">for deployment</text>
<text class="c" x="82" y="169">uv add contextgem             # or: pip</text>
<text class="c" x="82" y="188">install -U contextgem</text>
<rect class="card" x="40" y="234" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">2</text>
<text class="t" x="82" y="263">Create a text Document and declare</text>
<text class="t" x="82" y="285">payment aspects and</text>
<text class="t" x="82" y="307">sentence-referenced anomaly concepts</text>
<rect class="card" x="40" y="354" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="354" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="378" r="10"/>
<text class="num" x="62" y="382" text-anchor="middle">3</text>
<text class="t" x="82" y="383">Configure an approved model endpoint,</text>
<text class="t" x="82" y="405">credentials and request limits</text>
<rect class="card" x="40" y="452" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="452" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="476" r="10"/>
<text class="num" x="62" y="480" text-anchor="middle">4</text>
<text class="t" x="82" y="481">Start extraction on the document</text>
<text class="c" x="82" y="505">doc = llm.extract_all(doc)</text>
<rect class="cardT" x="472" y="488" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="488" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="512" r="10"/>
<text class="num" x="494" y="516" text-anchor="middle">5</text>
<text class="t" x="514" y="517">Build model requests, validate answers</text>
<text class="t" x="514" y="539">and reconnect source references;</text>
<text class="t" x="514" y="561">report unresolved failures</text>
<text class="comp" x="514" y="589">component: DocumentLLM + extraction engine</text>
<rect class="card" x="40" y="551" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="551" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="575" r="10"/>
<text class="num" x="62" y="579" text-anchor="middle">6</text>
<text class="t" x="82" y="580">Read the extracted items and inspect</text>
<text class="t" x="82" y="602">their supporting source objects</text>
<text class="c" x="82" y="626">anomalies =</text>
<text class="c" x="82" y="645">doc.get_concept_by_name(&quot;Anomalies&quot;).extra</text>
<text class="c" x="82" y="664">cted_items</text>
<rect class="card" x="40" y="710" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="710" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="734" r="10"/>
<text class="num" x="62" y="738" text-anchor="middle">7</text>
<text class="t" x="82" y="739">Validate meaning on your corpus;</text>
<text class="t" x="82" y="761">persist results and failed-job state</text>
<text class="t" x="82" y="783">in your application</text>
<rect class="val" x="28" y="836" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="860">VALUE</text>
<text class="valT" x="48" y="884">Typed document findings with inspectable source locations, without rebuilding prompt and</text>
<text class="valT" x="48" y="906">reference plumbing</text>
</svg>
