<svg xmlns="http://www.w3.org/2000/svg" width="880" height="806" viewBox="0 0 880 806" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="806" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="648" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="648" rx="10"/>
<rect class="pillT" x="474" y="40" width="211.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The repo&#x27;s demo does</text>
<path class="edge" d="M62,166 L62,190" marker-end="url(#a)"/>
<path class="hand" d="M408,239.5 C439.0,239.5 439.0,263 470,263" marker-end="url(#a)"/>
<path class="edge" d="M494,336 L494,360" marker-end="url(#a)"/>
<path class="edge" d="M494,459 L494,483" marker-end="url(#a)"/>
<path class="hand" d="M472,544.5 C441.0,544.5 441.0,568 410,568" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Read the concepts table and sourced</text>
<text class="t" x="82" y="123">tips as a course, not as something to</text>
<text class="t" x="82" y="145">install</text>
<rect class="card" x="40" y="192" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="192" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="216" r="10"/>
<text class="num" x="62" y="220" text-anchor="middle">2</text>
<text class="t" x="82" y="221">Start Claude Code in a clone and run</text>
<text class="t" x="82" y="243">the demo command</text>
<text class="c" x="82" y="267">/weather-orchestrator</text>
<rect class="cardT" x="472" y="239" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="239" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="263" r="10"/>
<text class="num" x="494" y="267" text-anchor="middle">3</text>
<text class="t" x="514" y="268">The command asks whether you want</text>
<text class="t" x="514" y="290">Celsius or Fahrenheit</text>
<text class="comp" x="514" y="318">component: slash command</text>
<rect class="cardT" x="472" y="362" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="362" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="386" r="10"/>
<text class="num" x="494" y="390" text-anchor="middle">4</text>
<text class="t" x="514" y="391">A subagent fetches the temperature</text>
<text class="t" x="514" y="413">using a skill preloaded into it</text>
<text class="comp" x="514" y="441">component: weather-agent subagent</text>
<rect class="cardT" x="472" y="485" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="485" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="509" r="10"/>
<text class="num" x="494" y="513" text-anchor="middle">5</text>
<text class="t" x="514" y="514">A separate skill, called by the</text>
<text class="t" x="514" y="536">command, writes an SVG card and</text>
<text class="t" x="514" y="558">output.md</text>
<text class="comp" x="514" y="586">component: weather-svg-creator skill</text>
<rect class="card" x="40" y="544" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="544" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="568" r="10"/>
<text class="num" x="62" y="572" text-anchor="middle">6</text>
<text class="t" x="82" y="573">Copy the command → agent → skill split</text>
<text class="t" x="82" y="595">into your own project&#x27;s files</text>
<text class="c" x="82" y="619">.claude/commands/ · .claude/agents/ ·</text>
<text class="c" x="82" y="638">.claude/skills/</text>
<rect class="val" x="28" y="690" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="714">VALUE</text>
<text class="valT" x="48" y="738">You see how commands, subagents and skills hand off on a working example instead of piecing</text>
<text class="valT" x="48" y="760">it together from scattered docs and tweets</text>
</svg>
