<svg xmlns="http://www.w3.org/2000/svg" width="880" height="641" viewBox="0 0 880 641" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="641" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="505" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="505" rx="10"/>
<rect class="pillT" x="474" y="40" width="105.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">tqdm 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,226.5 C439.0,226.5 439.0,250 470,250" marker-end="url(#a)"/>
<path class="hand" d="M472,251.0 C441.0,251.0 441.0,313 410,313" marker-end="url(#a)"/>
<path class="hand" d="M408,335.0 C439.0,335.0 439.0,359 470,359" marker-end="url(#a)"/>
<path class="hand" d="M472,360.0 C441.0,360.0 441.0,431 410,431" marker-end="url(#a)"/>
<path class="hand" d="M408,443.5 C439.0,443.5 439.0,467 470,467" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">安装——纯 Python，无必需依赖</text>
<text class="c" x="82" y="125">pip install tqdm · conda install -c</text>
<text class="c" x="82" y="144">conda-forge tqdm</text>
<rect class="card" x="40" y="190" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">裹住循环的可迭代对象</text>
<text class="c" x="82" y="243">for i in tqdm(range(10000)):</text>
<rect class="cardT" x="472" y="226" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="226" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="250" r="10"/>
<text class="num" x="494" y="254" text-anchor="middle">3</text>
<text class="t" x="514" y="255">原地刷新一条进度行，带速率与实时 ETA</text>
<rect class="card" x="40" y="289" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="289" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="313" r="10"/>
<text class="num" x="62" y="317" text-anchor="middle">4</text>
<text class="t" x="82" y="318">把它插进 shell 管道当计量器</text>
<text class="c" x="82" y="342">find . -name &#x27;*.py&#x27; -type f -exec cat \{}</text>
<text class="c" x="82" y="361">\; | tqdm | wc -l</text>
<rect class="cardT" x="472" y="335" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="335" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="359" r="10"/>
<text class="num" x="494" y="363" text-anchor="middle">5</text>
<text class="t" x="514" y="364">数据流过时计数，不自己读取内容</text>
<rect class="card" x="40" y="407" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="407" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="431" r="10"/>
<text class="num" x="62" y="435" text-anchor="middle">6</text>
<text class="t" x="82" y="436">在 pandas DataFrame 上注册，逐行显示进度</text>
<text class="c" x="82" y="460">tqdm.pandas()</text>
<rect class="cardT" x="472" y="443" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="443" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="467" r="10"/>
<text class="num" x="494" y="471" text-anchor="middle">7</text>
<text class="t" x="514" y="472">让 progress_apply 自带进度条，apply 代码</text>
<text class="t" x="514" y="494">不用改</text>
<rect class="val" x="28" y="547" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="571">价值</text>
<text class="valT" x="48" y="595">循环、shell 管道、notebook 和 pandas 里都有实时进度，依赖极小</text>
</svg>
