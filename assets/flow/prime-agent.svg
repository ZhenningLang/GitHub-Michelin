<svg xmlns="http://www.w3.org/2000/svg" width="880" height="856" viewBox="0 0 880 856" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="856" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="698" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="698" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Prime Agent does</text>
<path class="hand" d="M408,128.0 C439.0,128.0 439.0,152 470,152" marker-end="url(#a)"/>
<path class="hand" d="M472,185.0 C441.0,185.0 441.0,234 410,234" marker-end="url(#a)"/>
<path class="hand" d="M408,266.0 C439.0,266.0 439.0,292 470,292" marker-end="url(#a)"/>
<path class="hand" d="M472,325.0 C441.0,325.0 441.0,372 410,372" marker-end="url(#a)"/>
<path class="hand" d="M408,381.5 C439.0,381.5 439.0,432 470,432" marker-end="url(#a)"/>
<path class="edge" d="M494,545 L494,569" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Set up</text>
<text class="t" x="82" y="118">Install, then start it in a clone you</text>
<text class="t" x="82" y="140">can restore</text>
<text class="c" x="82" y="164">prime-agent</text>
<rect class="cardT" x="472" y="128" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="128" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="152" r="10"/>
<text class="num" x="494" y="156" text-anchor="middle">2</text>
<text class="ph" x="514" y="157">Set up</text>
<text class="t" x="514" y="174">Starts the TUI, a daemon worker, and a</text>
<text class="t" x="514" y="196">persistent Python kernel</text>
<text class="comp" x="514" y="224">component: daemon + kernel</text>
<rect class="card" x="40" y="210" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="210" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="234" r="10"/>
<text class="num" x="62" y="238" text-anchor="middle">3</text>
<text class="ph" x="82" y="239">Set up</text>
<text class="t" x="82" y="256">Authenticate a subscription or API-key</text>
<text class="t" x="82" y="278">provider</text>
<text class="c" x="82" y="302">/login</text>
<rect class="cardT" x="472" y="268" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="268" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="292" r="10"/>
<text class="num" x="494" y="296" text-anchor="middle">4</text>
<text class="ph" x="514" y="297">Set up</text>
<text class="t" x="514" y="314">Stores tokens in</text>
<text class="t" x="514" y="336">~/.prime/agent/auth.json</text>
<text class="comp" x="514" y="364">component: auth.json</text>
<rect class="card" x="40" y="348" width="368" height="67" rx="8"/>
<rect class="accY" x="40" y="348" width="4" height="67" rx="2"/>
<circle class="accY" cx="62" cy="372" r="10"/>
<text class="num" x="62" y="376" text-anchor="middle">5</text>
<text class="ph" x="82" y="377">Each task</text>
<text class="t" x="82" y="394">Give a long coding or research task</text>
<rect class="cardT" x="472" y="408" width="368" height="137" rx="8"/>
<rect class="accT" x="472" y="408" width="4" height="137" rx="2"/>
<circle class="accT" cx="494" cy="432" r="10"/>
<text class="num" x="494" y="436" text-anchor="middle">6</text>
<text class="ph" x="514" y="437">Each task</text>
<text class="t" x="514" y="454">The model inspects files in Python and</text>
<text class="t" x="514" y="476">spawns child agents in code</text>
<text class="c" x="514" y="500">rlm.spawn(...)</text>
<text class="comp" x="514" y="523">component: Python kernel</text>
<rect class="cardT" x="472" y="571" width="368" height="137" rx="8"/>
<rect class="accT" x="472" y="571" width="4" height="137" rx="2"/>
<circle class="accT" cx="494" cy="595" r="10"/>
<text class="num" x="494" y="599" text-anchor="middle">7</text>
<text class="ph" x="514" y="600">Each task</text>
<text class="t" x="514" y="617">Keeps the session running after you</text>
<text class="t" x="514" y="639">detach; reattach later</text>
<text class="c" x="514" y="663">prime-agent attach &lt;agent&gt;</text>
<text class="comp" x="514" y="686">component: session worker</text>
<rect class="val" x="28" y="740" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="764">VALUE</text>
<text class="valT" x="48" y="788">You no longer stuff the whole working set into the chat window: the model programs over it,</text>
<text class="valT" x="48" y="810">and the session survives a closed terminal</text>
</svg>
