<svg xmlns="http://www.w3.org/2000/svg" width="880" height="667" viewBox="0 0 880 667" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="667" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="531" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="531" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agent Scan 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,220.0 C439.0,220.0 439.0,244 470,244" marker-end="url(#a)"/>
<path class="hand" d="M472,268.5 C441.0,268.5 441.0,319 410,319" marker-end="url(#a)"/>
<path class="hand" d="M408,332.5 C439.0,332.5 439.0,367 470,367" marker-end="url(#a)"/>
<path class="edge" d="M494,418 L494,442" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">注册 Snyk 账号，把 API token 设成环境变量</text>
<text class="c" x="82" y="125">export SNYK_TOKEN=your-api-token-here</text>
<rect class="card" x="40" y="171" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">不带参数运行，扫描整台机器</text>
<text class="c" x="82" y="224">uvx snyk-agent-scan@latest</text>
<text class="comp" x="82" y="247">组件：snyk-agent-scan 命令行</text>
<rect class="cardT" x="472" y="220" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="220" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="244" r="10"/>
<text class="num" x="494" y="248" text-anchor="middle">3</text>
<text class="t" x="514" y="249">找出本机装了哪些 agent、MCP 服务配置和</text>
<text class="t" x="514" y="271">skill</text>
<text class="comp" x="514" y="299">组件：各 agent 的发现器</text>
<rect class="card" x="40" y="295" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="295" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="319" r="10"/>
<text class="num" x="62" y="323" text-anchor="middle">4</text>
<text class="t" x="82" y="324">逐个批准或拒绝它要启动或连接的 MCP 服务</text>
<text class="comp" x="82" y="352">组件：同意提示（y/n）</text>
<rect class="cardT" x="472" y="343" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="343" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="367" r="10"/>
<text class="num" x="494" y="371" text-anchor="middle">5</text>
<text class="t" x="514" y="372">启动获批的服务，读取工具描述，抹掉密钥</text>
<text class="comp" x="514" y="400">组件：MCP 客户端 + 脱敏</text>
<rect class="cardT" x="472" y="444" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="444" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="468" r="10"/>
<text class="num" x="494" y="472" text-anchor="middle">6</text>
<text class="t" x="514" y="473">把描述和 skill 文件发给 Snyk 接口，打印带</text>
<text class="t" x="514" y="495">分数的风险</text>
<text class="comp" x="514" y="523">组件：Agent Scan 分析接口</text>
<rect class="val" x="28" y="573" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="597">价值</text>
<text class="valT" x="48" y="621">一条命令看出已装的 MCP 服务和 skill 里哪些带注入或恶意代码风险，不用逐个手读工具描述</text>
</svg>
