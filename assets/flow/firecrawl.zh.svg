<svg xmlns="http://www.w3.org/2000/svg" width="880" height="722" viewBox="0 0 880 722" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="722" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="586" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="586" rx="10"/>
<rect class="pillT" x="474" y="40" width="151.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Firecrawl 做的</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="hand" d="M408,253.0 C439.0,253.0 439.0,277 470,277" marker-end="url(#a)"/>
<path class="edge" d="M494,350 L494,374" marker-end="url(#a)"/>
<path class="edge" d="M494,473 L494,497" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 firecrawl.dev 拿 API key，装上 SDK</text>
<text class="c" x="82" y="125">pip install firecrawl-py</text>
<text class="comp" x="82" y="148">组件：Python SDK</text>
<rect class="card" x="40" y="196" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">请求某个页面的</text>
<text class="t" x="82" y="247">Markdown（crawl、map、search 用法相同）</text>
<text class="c" x="82" y="271">app.scrape(&quot;https://firecrawl.dev&quot;,</text>
<text class="c" x="82" y="290">formats=[&quot;markdown&quot;])</text>
<rect class="cardT" x="472" y="253" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="253" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="277" r="10"/>
<text class="num" x="494" y="281" text-anchor="middle">3</text>
<text class="t" x="514" y="282">把任务放进队列，选抓取引擎：普通请求，或先</text>
<text class="t" x="514" y="304">跑完 JS 的无头浏览器</text>
<text class="comp" x="514" y="332">组件：API + worker</text>
<rect class="cardT" x="472" y="376" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="376" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="400" r="10"/>
<text class="num" x="494" y="404" text-anchor="middle">4</text>
<text class="t" x="514" y="405">在云版上，遇到拦截就走轮换代理和它的</text>
<text class="t" x="514" y="427">反爬引擎</text>
<text class="comp" x="514" y="455">组件：Fire-engine（仅云版）</text>
<rect class="cardT" x="472" y="499" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="499" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="523" r="10"/>
<text class="num" x="494" y="527" text-anchor="middle">5</text>
<text class="t" x="514" y="528">把渲染后的页面转成干净的 Markdown，连同元</text>
<text class="t" x="514" y="550">数据一起返回</text>
<text class="comp" x="514" y="578">组件：Go 版 HTML 转 Markdown</text>
<rect class="val" x="28" y="628" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="652">价值</text>
<text class="valT" x="48" y="676">JS 重或会拦截的网站也能拿到可直接喂给大模型的正文，不用自己跑浏览器、代理和爬取队列</text>
</svg>
