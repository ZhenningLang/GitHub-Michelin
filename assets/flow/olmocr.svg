<svg xmlns="http://www.w3.org/2000/svg" width="880" height="779" viewBox="0 0 880 779" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="779" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="621" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="621" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">olmOCR does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,269.0 C439.0,269.0 439.0,293 470,293" marker-end="url(#a)"/>
<path class="edge" d="M494,366 L494,390" marker-end="url(#a)"/>
<path class="edge" d="M494,486 L494,510" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install poppler and fonts, then the</text>
<text class="t" x="82" y="123">GPU package in a clean Python 3.11 env</text>
<text class="c" x="82" y="147">pip install olmocr[gpu] --extra-index-url</text>
<text class="c" x="82" y="166">https://download.pytorch.org/whl/cu128</text>
<rect class="card" x="40" y="212" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Point it at a workspace folder and</text>
<text class="t" x="82" y="263">your PDFs</text>
<text class="c" x="82" y="287">olmocr ./localworkspace --markdown --pdfs</text>
<text class="c" x="82" y="306">tests/gnarly_pdfs/*.pdf</text>
<rect class="cardT" x="472" y="269" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="269" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="293" r="10"/>
<text class="num" x="494" y="297" text-anchor="middle">3</text>
<text class="t" x="514" y="298">Starts a local vLLM server with the</text>
<text class="t" x="514" y="320">olmOCR 7B vision model</text>
<text class="comp" x="514" y="348">component: vLLM + olmOCR-2-7B-1025-FP8</text>
<rect class="cardT" x="472" y="392" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="392" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="416" r="10"/>
<text class="num" x="494" y="420" text-anchor="middle">4</text>
<text class="t" x="514" y="421">Queues pages in groups, renders each</text>
<text class="t" x="514" y="443">page and has the model read it in</text>
<text class="t" x="514" y="465">order</text>
<rect class="cardT" x="472" y="512" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="512" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="536" r="10"/>
<text class="num" x="494" y="540" text-anchor="middle">5</text>
<text class="t" x="514" y="541">Retries failed pages, then writes</text>
<text class="t" x="514" y="563">Dolma JSONL plus one Markdown file per</text>
<text class="t" x="514" y="585">PDF</text>
<text class="comp" x="514" y="613">component: ./localworkspace/markdown/</text>
<rect class="val" x="28" y="663" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="687">VALUE</text>
<text class="valT" x="48" y="711">Scanned and multi-column PDFs become clean reading-order Markdown, ready for a training</text>
<text class="valT" x="48" y="733">corpus</text>
</svg>
