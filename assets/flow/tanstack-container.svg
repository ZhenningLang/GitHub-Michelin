<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1013" viewBox="0 0 880 1013" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1013" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="855" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="855" rx="10"/>
<rect class="pillT" x="474" y="40" width="239.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TanStack Container does</text>
<path class="edge" d="M62,225 L62,249" marker-end="url(#a)"/>
<path class="edge" d="M62,410 L62,434" marker-end="url(#a)"/>
<path class="hand" d="M408,492.0 C439.0,492.0 439.0,516 470,516" marker-end="url(#a)"/>
<path class="hand" d="M472,560.0 C441.0,560.0 441.0,598 410,598" marker-end="url(#a)"/>
<path class="hand" d="M408,639.5 C439.0,639.5 439.0,678 470,678" marker-end="url(#a)"/>
<path class="hand" d="M472,709.5 C441.0,709.5 441.0,755 410,755" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="153" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="153" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Set up once</text>
<text class="t" x="82" y="118">Install the SDK and runtime package</text>
<text class="t" x="82" y="140">pair from local tarballs; npm</text>
<text class="t" x="82" y="162">publication hasn&#x27;t happened yet</text>
<text class="c" x="82" y="186">npm install &quot;$SDK_TARBALL&quot;</text>
<text class="c" x="82" y="205">&quot;$RUNTIME_TARBALL&quot; --ignore-scripts</text>
<rect class="card" x="40" y="251" width="368" height="159" rx="8"/>
<rect class="accY" x="40" y="251" width="4" height="159" rx="2"/>
<circle class="accY" cx="62" cy="275" r="10"/>
<text class="num" x="62" y="279" text-anchor="middle">2</text>
<text class="ph" x="82" y="280">Set up once</text>
<text class="t" x="82" y="297">Run asset setup in your build and</text>
<text class="t" x="82" y="319">static-host the output on your own</text>
<text class="t" x="82" y="341">origin</text>
<text class="c" x="82" y="365">prepareRuntimeAssets(&#x27;public/sandbox&#x27;)</text>
<text class="comp" x="82" y="388">component: assets setup helper</text>
<rect class="card" x="40" y="436" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="436" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="460" r="10"/>
<text class="num" x="62" y="464" text-anchor="middle">3</text>
<text class="ph" x="82" y="465">Every session</text>
<text class="t" x="82" y="482">Create a workspace session in your</text>
<text class="t" x="82" y="504">page code with the project files</text>
<text class="c" x="82" y="528">new AgentSession(files,options)</text>
<rect class="cardT" x="472" y="492" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="492" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="516" r="10"/>
<text class="num" x="494" y="520" text-anchor="middle">4</text>
<text class="ph" x="514" y="521">Every session</text>
<text class="t" x="514" y="538">A worker kernel boots inside the</text>
<text class="t" x="514" y="560">visitor&#x27;s browser: virtual filesystem,</text>
<text class="t" x="514" y="582">QuickJS engine, WASM compilers</text>
<text class="comp" x="514" y="610">component: worker kernel</text>
<rect class="card" x="40" y="574" width="368" height="131" rx="8"/>
<rect class="accY" x="40" y="574" width="4" height="131" rx="2"/>
<circle class="accY" cx="62" cy="598" r="10"/>
<text class="num" x="62" y="602" text-anchor="middle">5</text>
<text class="ph" x="82" y="603">Every session</text>
<text class="t" x="82" y="620">Run project commands against that</text>
<text class="t" x="82" y="642">virtual filesystem</text>
<text class="c" x="82" y="666">session.run({command:&#x27;node&#x27;,args:[&#x27;/check.</text>
<text class="c" x="82" y="685">cjs&#x27;]})</text>
<rect class="cardT" x="472" y="654" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="654" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="678" r="10"/>
<text class="num" x="494" y="682" text-anchor="middle">6</text>
<text class="ph" x="514" y="683">Every session</text>
<text class="t" x="514" y="700">Executes the guest process in-tab and</text>
<text class="t" x="514" y="722">proxies its HTTP port into an isolated</text>
<text class="t" x="514" y="744">preview frame</text>
<rect class="card" x="40" y="731" width="368" height="134" rx="8"/>
<rect class="accY" x="40" y="731" width="4" height="134" rx="2"/>
<circle class="accY" cx="62" cy="755" r="10"/>
<text class="num" x="62" y="759" text-anchor="middle">7</text>
<text class="ph" x="82" y="760">Every session</text>
<text class="t" x="82" y="777">Snapshot the workspace to browser</text>
<text class="t" x="82" y="799">storage; resume replays it after a</text>
<text class="t" x="82" y="821">reload without reinstalling</text>
<text class="c" x="82" y="845">session.snapshot()</text>
<rect class="val" x="28" y="897" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="921">VALUE</text>
<text class="valT" x="48" y="945">A real Vite or Start app runs, previews and resumes inside the browser tab — your server only</text>
<text class="valT" x="48" y="967">serves static files</text>
</svg>
