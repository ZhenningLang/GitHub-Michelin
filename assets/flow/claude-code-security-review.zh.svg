<svg xmlns="http://www.w3.org/2000/svg" width="880" height="710" viewBox="0 0 880 710" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="710" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="574" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="574" rx="10"/>
<rect class="pillT" x="474" y="40" width="163.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">这个 Action 做的</text>
<path class="edge" d="M62,205 L62,229" marker-end="url(#a)"/>
<path class="hand" d="M408,288.0 C439.0,288.0 439.0,312 470,312" marker-end="url(#a)"/>
<path class="edge" d="M494,385 L494,409" marker-end="url(#a)"/>
<path class="edge" d="M494,508 L494,532" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">加上 workflow 文件，填好 API key 的</text>
<text class="t" x="82" y="123">secret</text>
<text class="c" x="82" y="147">uses:</text>
<text class="c" x="82" y="166">anthropics/claude-code-security-review@mai</text>
<text class="c" x="82" y="185">n</text>
<rect class="card" x="40" y="231" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="255" r="10"/>
<text class="num" x="62" y="259" text-anchor="middle">2</text>
<text class="t" x="82" y="260">让外部贡献者的 PR 等维护者批准后才跑</text>
<text class="t" x="82" y="282">workflow</text>
<text class="c" x="82" y="306">Require approval for all external</text>
<text class="c" x="82" y="325">contributors</text>
<rect class="cardT" x="472" y="288" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="288" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="312" r="10"/>
<text class="num" x="494" y="316" text-anchor="middle">3</text>
<text class="t" x="514" y="317">每个 PR 上，Claude Code 读改动的文件，结</text>
<text class="t" x="514" y="339">合上下文推理</text>
<text class="comp" x="514" y="367">组件：github_action_audit.py</text>
<rect class="cardT" x="472" y="411" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="411" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="435" r="10"/>
<text class="num" x="494" y="439" text-anchor="middle">4</text>
<text class="t" x="514" y="440">再过一遍过滤，丢掉 DoS、限流、开放重定向这</text>
<text class="t" x="514" y="462">类低影响发现</text>
<text class="comp" x="514" y="490">组件：findings_filter.py</text>
<rect class="cardT" x="472" y="534" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="534" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="558" r="10"/>
<text class="num" x="494" y="562" text-anchor="middle">5</text>
<text class="t" x="514" y="563">把剩下的发现贴成行级评论，附严重度和修法</text>
<rect class="val" x="28" y="616" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="640">价值</text>
<text class="valT" x="48" y="664">diff 里的逻辑层漏洞在合并前就标在 PR 上，不用自己写规则</text>
</svg>
