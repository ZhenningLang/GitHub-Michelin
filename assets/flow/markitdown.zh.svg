<svg xmlns="http://www.w3.org/2000/svg" width="880" height="587" viewBox="0 0 880 587" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="587" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="451" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="451" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">MarkItDown 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,237.5 C439.0,237.5 439.0,261 470,261" marker-end="url(#a)"/>
<path class="edge" d="M494,287 L494,311" marker-end="url(#a)"/>
<path class="edge" d="M494,385 L494,409" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">按需要的格式装上可选依赖</text>
<text class="c" x="82" y="125">pip install &#x27;markitdown[all]&#x27; · pip</text>
<text class="c" x="82" y="144">install &#x27;markitdown[pdf, docx, pptx]&#x27;</text>
<rect class="card" x="40" y="190" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">命令行指给它一个文件，或在 Python 里调用</text>
<text class="t" x="82" y="241">convert()</text>
<text class="c" x="82" y="265">markitdown path-to-file.pdf -o document.md</text>
<rect class="cardT" x="472" y="237" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="237" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="261" r="10"/>
<text class="num" x="494" y="265" text-anchor="middle">3</text>
<text class="t" x="514" y="266">识别文件真实类型，挑出对应的转换器</text>
<rect class="cardT" x="472" y="313" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="313" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="337" r="10"/>
<text class="num" x="494" y="341" text-anchor="middle">4</text>
<text class="t" x="514" y="342">用该格式的库抽出文字、标题、列表、表</text>
<text class="t" x="514" y="364">格和链接</text>
<rect class="cardT" x="472" y="411" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="411" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="435" r="10"/>
<text class="num" x="494" y="439" text-anchor="middle">5</text>
<text class="t" x="514" y="440">统一写成一份 Markdown</text>
<rect class="val" x="28" y="493" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="517">价值</text>
<text class="valT" x="48" y="541">一次调用，把一堆混杂的 Office、HTML、PDF 文件变成大模型读得懂的 Markdown</text>
</svg>
