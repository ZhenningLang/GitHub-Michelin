<svg xmlns="http://www.w3.org/2000/svg" width="880" height="618" viewBox="0 0 880 618" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="618" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="460" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="460" rx="10"/>
<rect class="pillT" x="474" y="40" width="211.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Browser Harness does</text>
<path class="hand" d="M408,129.0 C439.0,129.0 439.0,153 470,153" marker-end="url(#a)"/>
<path class="hand" d="M472,189.0 C441.0,189.0 441.0,236 410,236" marker-end="url(#a)"/>
<path class="hand" d="M408,259.5 C439.0,259.5 439.0,299 470,299" marker-end="url(#a)"/>
<path class="hand" d="M472,323.5 C441.0,323.5 441.0,357 410,357" marker-end="url(#a)"/>
<path class="hand" d="M408,380.5 C439.0,380.5 439.0,422 470,422" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the CLI and register the skill</text>
<text class="t" x="82" y="123">once</text>
<text class="c" x="82" y="147">uv tool install --python 3.12 --upgrade</text>
<text class="c" x="82" y="166">--force browser-harness</text>
<rect class="cardT" x="472" y="129" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="129" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="153" r="10"/>
<text class="num" x="494" y="157" text-anchor="middle">2</text>
<text class="t" x="514" y="158">Connects a daemon to your Chrome over</text>
<text class="t" x="514" y="180">CDP after you allow remote debugging</text>
<text class="c" x="514" y="204">chrome://inspect/#remote-debugging</text>
<text class="comp" x="514" y="227">component: daemon</text>
<rect class="card" x="40" y="212" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">3</text>
<text class="t" x="82" y="241">Drive the attached tab with a Python</text>
<text class="t" x="82" y="263">heredoc</text>
<text class="c" x="82" y="287">print(page_info())</text>
<rect class="cardT" x="472" y="275" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="275" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="299" r="10"/>
<text class="num" x="494" y="303" text-anchor="middle">4</text>
<text class="t" x="514" y="304">Runs pre-imported helpers against that</text>
<text class="t" x="514" y="326">tab without launching a new browser</text>
<text class="comp" x="514" y="354">component: helpers.py</text>
<rect class="card" x="40" y="333" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">5</text>
<text class="t" x="82" y="362">When a helper is missing, write it in</text>
<text class="t" x="82" y="384">the local workspace</text>
<text class="c" x="82" y="408">agent-workspace/agent_helpers.py</text>
<rect class="cardT" x="472" y="398" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="398" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="422" r="10"/>
<text class="num" x="494" y="426" text-anchor="middle">6</text>
<text class="t" x="514" y="427">Later tasks reuse those helpers; the</text>
<text class="t" x="514" y="449">core package stays untouched</text>
<rect class="val" x="28" y="502" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="526">VALUE</text>
<text class="valT" x="48" y="550">Your coding agent drives the Chrome you are already logged into, instead of you maintaining a</text>
<text class="valT" x="48" y="572">Playwright script per click</text>
</svg>
