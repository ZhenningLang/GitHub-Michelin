<svg xmlns="http://www.w3.org/2000/svg" width="880" height="698" viewBox="0 0 880 698" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="698" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="562" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="562" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenCreator 做的</text>
<path class="hand" d="M408,141.5 C439.0,141.5 439.0,165 470,165" marker-end="url(#a)"/>
<path class="hand" d="M472,178.5 C441.0,178.5 441.0,261 410,261" marker-end="url(#a)"/>
<path class="edge" d="M62,312 L62,336" marker-end="url(#a)"/>
<path class="hand" d="M408,374.0 C439.0,374.0 439.0,398 470,398" marker-end="url(#a)"/>
<path class="edge" d="M494,471 L494,495" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从最新 Release 安装桌面应用（macOS 或</text>
<text class="t" x="82" y="123">Windows）</text>
<text class="c" x="82" y="147">https://github.com/krillinai/OpenCreator/r</text>
<text class="c" x="82" y="166">eleases/latest</text>
<text class="comp" x="82" y="189">组件：桌面安装包</text>
<rect class="cardT" x="472" y="141" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="141" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="165" r="10"/>
<text class="num" x="494" y="169" text-anchor="middle">2</text>
<text class="t" x="514" y="170">拉起本机 Runtime，并准备好一个默认项目</text>
<text class="comp" x="514" y="198">组件：本机 Runtime</text>
<rect class="card" x="40" y="237" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">3</text>
<text class="t" x="82" y="266">完成有效的 Codex 登录——真实模型任务必须有</text>
<text class="comp" x="82" y="294">组件：Codex CLI</text>
<rect class="card" x="40" y="338" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="338" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="362" r="10"/>
<text class="num" x="62" y="366" text-anchor="middle">4</text>
<text class="t" x="82" y="367">打开视频翻译（或在对话框里下任务），丢进一</text>
<text class="t" x="82" y="389">条视频</text>
<rect class="cardT" x="472" y="374" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="374" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="398" r="10"/>
<text class="num" x="494" y="402" text-anchor="middle">5</text>
<text class="t" x="514" y="403">转录、断句、翻译，可选配音，导出 SRT、音频</text>
<text class="t" x="514" y="425">或视频</text>
<text class="comp" x="514" y="453">组件：KrillinAI 与媒体工具链</text>
<rect class="cardT" x="472" y="497" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="497" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="521" r="10"/>
<text class="num" x="494" y="525" text-anchor="middle">6</text>
<text class="t" x="514" y="526">让对话和可视化工作区盯着同一条带版本的任务</text>
<text class="comp" x="514" y="554">组件：协作核心</text>
<rect class="val" x="28" y="604" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="628">价值</text>
<text class="valT" x="48" y="652">字幕、配音或生成的媒体都落在同一个本机项目里，不用在 coding-agent 终端和一堆 SaaS 标签之间来回跳</text>
</svg>
