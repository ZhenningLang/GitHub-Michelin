<svg xmlns="http://www.w3.org/2000/svg" width="880" height="671" viewBox="0 0 880 671" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="671" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="535" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="535" rx="10"/>
<rect class="pillT" x="474" y="40" width="206.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">video-shotcraft 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,236.0 C439.0,236.0 439.0,260 470,260" marker-end="url(#a)"/>
<path class="hand" d="M472,272.0 C441.0,272.0 441.0,332 410,332" marker-end="url(#a)"/>
<path class="hand" d="M408,355.5 C439.0,355.5 439.0,379 470,379" marker-end="url(#a)"/>
<path class="edge" d="M494,427 L494,451" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把 skill 装进 Claude Code 或 Codex</text>
<text class="c" x="82" y="125">npx skills add</text>
<text class="c" x="82" y="144">Vincentwei1021/video-shotcraft</text>
<rect class="card" x="40" y="190" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">把产品交给它并要一支宣传片，可以点名镜头卡</text>
<text class="c" x="82" y="243">Use video-shotcraft to create a promo for</text>
<text class="c" x="82" y="262">my desktop product.</text>
<rect class="cardT" x="472" y="236" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="236" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="260" r="10"/>
<text class="num" x="494" y="264" text-anchor="middle">3</text>
<text class="t" x="514" y="265">先做一次只读的产品检查，给出三种模式：模</text>
<text class="t" x="514" y="287">板、自主自由创作、共同创作</text>
<rect class="card" x="40" y="308" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="308" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="332" r="10"/>
<text class="num" x="62" y="336" text-anchor="middle">4</text>
<text class="t" x="82" y="337">选一种模式；模板路线就是把你的素材替换进</text>
<text class="t" x="82" y="359">Ink Press 这支片子里</text>
<text class="c" x="82" y="383">template/TEMPLATE.md</text>
<rect class="cardT" x="472" y="355" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="355" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="379" r="10"/>
<text class="num" x="494" y="383" text-anchor="middle">5</text>
<text class="t" x="514" y="384">把每个镜头做成 Remotion</text>
<text class="t" x="514" y="406">组件：真实截图、2.5D 运镜、卡点音效</text>
<rect class="cardT" x="472" y="453" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="453" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="477" r="10"/>
<text class="num" x="494" y="481" text-anchor="middle">6</text>
<text class="t" x="514" y="482">在你本机把成片渲染成 MP4</text>
<text class="c" x="514" y="506">npx remotion render src/index.ts AiflPromo</text>
<text class="c" x="514" y="525">out/promo.mp4</text>
<rect class="val" x="28" y="577" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="601">价值</text>
<text class="valT" x="48" y="625">一支有真实产品截图、运镜编排到位的电影感宣传片，不用在 After Effects 里手 K 关键帧</text>
</svg>
