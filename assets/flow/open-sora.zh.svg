<svg xmlns="http://www.w3.org/2000/svg" width="880" height="823" viewBox="0 0 880 823" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="823" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="687" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="687" rx="10"/>
<rect class="pillT" x="474" y="40" width="151.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Open-Sora 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,329 L62,353" marker-end="url(#a)"/>
<path class="hand" d="M408,401.0 C439.0,401.0 439.0,425 470,425" marker-end="url(#a)"/>
<path class="edge" d="M494,498 L494,522" marker-end="url(#a)"/>
<path class="edge" d="M494,621 L494,645" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">克隆仓库，在 Python 3.10 下装好它和</text>
<text class="t" x="82" y="123">flash-attn</text>
<text class="c" x="82" y="147">pip install -v .</text>
<rect class="card" x="40" y="193" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">把权重包下载到 ./ckpts</text>
<text class="c" x="82" y="246">huggingface-cli download</text>
<text class="c" x="82" y="265">hpcai-tech/Open-Sora-v2 --local-dir</text>
<text class="c" x="82" y="284">./ckpts</text>
<text class="comp" x="82" y="307">组件：11B 模型、FLUX、VAE、T5、CLIP</text>
<rect class="card" x="40" y="355" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="355" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="379" r="10"/>
<text class="num" x="62" y="383" text-anchor="middle">3</text>
<text class="t" x="82" y="384">用 torchrun 带上分辨率配置和提示词启动</text>
<text class="c" x="82" y="408">scripts/diffusion/inference.py</text>
<text class="c" x="82" y="427">configs/diffusion/inference/t2i2v_256px.py</text>
<rect class="cardT" x="472" y="401" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="401" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="425" r="10"/>
<text class="num" x="494" y="429" text-anchor="middle">4</text>
<text class="t" x="514" y="430">先用随包的 FLUX.1-dev 图像模型按提示词画出</text>
<text class="t" x="514" y="452">第一帧</text>
<text class="comp" x="514" y="480">组件：flux1-dev（文生图阶段）</text>
<rect class="cardT" x="472" y="524" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="524" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="548" r="10"/>
<text class="num" x="494" y="552" text-anchor="middle">5</text>
<text class="t" x="514" y="553">以这一帧、文本和运动分数为条件，去噪生成最</text>
<text class="t" x="514" y="575">多 129 帧</text>
<text class="comp" x="514" y="603">组件：Open_Sora_v2 权重（11B）</text>
<rect class="cardT" x="472" y="647" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="647" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="671" r="10"/>
<text class="num" x="494" y="675" text-anchor="middle">6</text>
<text class="t" x="514" y="676">经 HunyuanVideo VAE 解码，写出 H.264 MP4</text>
<rect class="val" x="28" y="729" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="753">价值</text>
<text class="valT" x="48" y="777">在自己的 GPU 上一条命令出一段约 5 秒的视频，而且产出这套权重的训练代码就在同一个仓库里</text>
</svg>
