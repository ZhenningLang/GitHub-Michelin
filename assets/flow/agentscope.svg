<svg xmlns="http://www.w3.org/2000/svg" width="880" height="775" viewBox="0 0 880 775" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="775" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="617" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="617" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">AgentScope does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,240.5 C439.0,240.5 439.0,264 470,264" marker-end="url(#a)"/>
<path class="hand" d="M472,299.5 C441.0,299.5 441.0,338 410,338" marker-end="url(#a)"/>
<path class="hand" d="M408,350.5 C439.0,350.5 439.0,409 470,409" marker-end="url(#a)"/>
<path class="hand" d="M472,433.5 C441.0,433.5 441.0,457 410,457" marker-end="url(#a)"/>
<path class="hand" d="M408,480.5 C439.0,480.5 439.0,532 470,532" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the framework into a Python</text>
<text class="t" x="82" y="123">environment</text>
<text class="c" x="82" y="147">uv pip install agentscope</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Compose an Agent from a model client</text>
<text class="t" x="82" y="244">and a toolkit of tools</text>
<text class="c" x="82" y="268">from agentscope.agent import Agent</text>
<rect class="cardT" x="472" y="240" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="240" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="264" r="10"/>
<text class="num" x="494" y="268" text-anchor="middle">3</text>
<text class="t" x="514" y="269">Runs the reasoning-acting loop,</text>
<text class="t" x="514" y="291">pausing each sensitive tool call for</text>
<text class="t" x="514" y="313">confirmation</text>
<text class="comp" x="514" y="341">component: Permission system</text>
<rect class="card" x="40" y="314" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">4</text>
<text class="t" x="82" y="343">Chat with it and test in the terminal</text>
<text class="c" x="82" y="367">await launch_console(agent)</text>
<rect class="cardT" x="472" y="385" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="385" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="409" r="10"/>
<text class="num" x="494" y="413" text-anchor="middle">5</text>
<text class="t" x="514" y="414">Streams every model call and tool</text>
<text class="t" x="514" y="436">event outward as typed events</text>
<text class="comp" x="514" y="464">component: Event bus</text>
<rect class="card" x="40" y="433" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="433" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="457" r="10"/>
<text class="num" x="62" y="461" text-anchor="middle">6</text>
<text class="t" x="82" y="462">Start the bundled multi-tenant service</text>
<text class="t" x="82" y="484">backend</text>
<text class="c" x="82" y="508">python main.py</text>
<rect class="cardT" x="472" y="508" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="508" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="532" r="10"/>
<text class="num" x="494" y="536" text-anchor="middle">7</text>
<text class="t" x="514" y="537">Isolates sessions, executes tools in</text>
<text class="t" x="514" y="559">the chosen sandbox, persists agent</text>
<text class="t" x="514" y="581">state</text>
<text class="comp" x="514" y="609">component: Agent Service</text>
<rect class="val" x="28" y="659" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="683">VALUE</text>
<text class="valT" x="48" y="707">Serving, sandboxing, permission gates, and tracing come with the framework — you only compose</text>
<text class="valT" x="48" y="729">the agent and operate what you opted into</text>
</svg>
