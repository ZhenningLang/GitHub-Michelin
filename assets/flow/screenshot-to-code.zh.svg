<svg xmlns="http://www.w3.org/2000/svg" width="880" height="583" viewBox="0 0 880 583" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="583" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="447" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="447" rx="10"/>
<rect class="pillT" x="474" y="40" width="233.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">screenshot-to-code 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,237.0 C439.0,237.0 439.0,272 470,272" marker-end="url(#a)"/>
<path class="hand" d="M472,296.5 C441.0,296.5 441.0,320 410,320" marker-end="url(#a)"/>
<path class="hand" d="M408,321.0 C439.0,321.0 439.0,395 470,395" marker-end="url(#a)"/>
<path class="hand" d="M472,396.0 C441.0,396.0 441.0,431 410,431" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把模型 key 写进 backend/.env，启动</text>
<text class="t" x="82" y="123">后端和前端</text>
<text class="c" x="82" y="147">poetry run uvicorn main:app --reload</text>
<text class="c" x="82" y="166">--port 7001 · pnpm dev</text>
<rect class="card" x="40" y="212" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">上传截图或录屏，或粘贴网址，选好技术栈</text>
<rect class="cardT" x="472" y="248" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="248" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="272" r="10"/>
<text class="num" x="494" y="276" text-anchor="middle">3</text>
<text class="t" x="514" y="277">并排流式给出四个版本，用的是从原图裁出的真</text>
<text class="t" x="514" y="299">实图片</text>
<text class="comp" x="514" y="327">组件：FastAPI 后端</text>
<rect class="card" x="40" y="296" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="296" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="320" r="10"/>
<text class="num" x="62" y="324" text-anchor="middle">4</text>
<text class="t" x="82" y="325">打字提修改，或在选择模式下点中元素限定范围</text>
<rect class="cardT" x="472" y="371" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="371" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="395" r="10"/>
<text class="num" x="494" y="399" text-anchor="middle">5</text>
<text class="t" x="514" y="400">只改你要求的部分，返回两个新版本</text>
<rect class="card" x="40" y="407" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="407" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="431" r="10"/>
<text class="num" x="62" y="435" text-anchor="middle">6</text>
<text class="t" x="82" y="436">复制代码，或下载打包了图片的 ZIP</text>
<rect class="val" x="28" y="489" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="513">价值</text>
<text class="valT" x="48" y="537">拿到一份带真实图片、能直接打开、可对话修改的单文件复刻页——不用手工切图、手写布局</text>
</svg>
