<svg xmlns="http://www.w3.org/2000/svg" width="880" height="854" viewBox="0 0 880 854" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="854" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="696" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="696" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">AnyProxy does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,310 L62,334" marker-end="url(#a)"/>
<path class="hand" d="M408,394.5 C439.0,394.5 439.0,418 470,418" marker-end="url(#a)"/>
<path class="edge" d="M494,488 L494,512" marker-end="url(#a)"/>
<path class="edge" d="M494,608 L494,632" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it globally, generate its root</text>
<text class="t" x="82" y="123">CA and trust that CA on the device</text>
<text class="c" x="82" y="147">npm install -g anyproxy · anyproxy-ca</text>
<rect class="card" x="40" y="193" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Write a rule module whose hooks</text>
<text class="t" x="82" y="244">rewrite requests or return a mock</text>
<text class="t" x="82" y="266">response</text>
<text class="c" x="82" y="290">*beforeSendRequest(requestDetail)</text>
<rect class="card" x="40" y="336" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="336" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="360" r="10"/>
<text class="num" x="62" y="364" text-anchor="middle">3</text>
<text class="t" x="82" y="365">Start it with the rule (add</text>
<text class="t" x="82" y="387">--intercept to decrypt HTTPS), then</text>
<text class="t" x="82" y="409">point the client&#x27;s proxy at :8001</text>
<text class="c" x="82" y="433">anyproxy --rule ./rule.js</text>
<rect class="cardT" x="472" y="394" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="394" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="418" r="10"/>
<text class="num" x="494" y="422" text-anchor="middle">4</text>
<text class="t" x="514" y="423">Decrypts intercepted HTTPS with</text>
<text class="t" x="514" y="445">per-host certs signed by its CA and</text>
<text class="t" x="514" y="467">calls your hooks</text>
<rect class="cardT" x="472" y="514" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="514" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="538" r="10"/>
<text class="num" x="494" y="542" text-anchor="middle">5</text>
<text class="t" x="514" y="543">Forwards the possibly rewritten</text>
<text class="t" x="514" y="565">request, or answers directly if a hook</text>
<text class="t" x="514" y="587">returned a response</text>
<rect class="cardT" x="472" y="634" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="634" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="658" r="10"/>
<text class="num" x="494" y="662" text-anchor="middle">6</text>
<text class="t" x="514" y="663">Lists every request and response in</text>
<text class="t" x="514" y="685">its web UI on port 8002</text>
<rect class="val" x="28" y="738" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="762">VALUE</text>
<text class="valT" x="48" y="786">You see and rewrite an app&#x27;s real traffic with a few lines of JavaScript, without touching</text>
<text class="valT" x="48" y="808">the app or the server</text>
</svg>
