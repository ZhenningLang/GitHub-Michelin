<svg xmlns="http://www.w3.org/2000/svg" width="880" height="780" viewBox="0 0 880 780" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="780" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="622" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="622" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">AKShare does</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="hand" d="M408,256.0 C439.0,256.0 439.0,280 470,280" marker-end="url(#a)"/>
<path class="hand" d="M472,304.5 C441.0,304.5 441.0,366 410,366" marker-end="url(#a)"/>
<path class="hand" d="M408,390.5 C439.0,390.5 439.0,414 470,414" marker-end="url(#a)"/>
<path class="edge" d="M494,509 L494,533" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the library</text>
<text class="c" x="82" y="125">pip install akshare --upgrade</text>
<text class="comp" x="82" y="148">component: PyPI package</text>
<rect class="card" x="40" y="196" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">Look up the interface name by keyword </text>
<text class="t" x="82" y="247">— offline, no network request</text>
<text class="c" x="82" y="271">ak.search(&quot;可转债 实时行情&quot;, limit=5)</text>
<text class="comp" x="82" y="294">component: interface registry</text>
<rect class="cardT" x="472" y="256" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="256" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="280" r="10"/>
<text class="num" x="494" y="284" text-anchor="middle">3</text>
<text class="t" x="514" y="285">Registry returns the interface name,</text>
<text class="t" x="514" y="307">its parameters and output columns</text>
<text class="comp" x="514" y="335">component: interface registry</text>
<rect class="card" x="40" y="342" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="342" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="366" r="10"/>
<text class="num" x="62" y="370" text-anchor="middle">4</text>
<text class="t" x="82" y="371">Call the interface you found with your</text>
<text class="t" x="82" y="393">parameters</text>
<text class="comp" x="82" y="421">component: interface function</text>
<rect class="cardT" x="472" y="390" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="390" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="414" r="10"/>
<text class="num" x="494" y="418" text-anchor="middle">5</text>
<text class="t" x="514" y="419">Fetches the public upstream page/API,</text>
<text class="t" x="514" y="441">impersonating a browser where a plain</text>
<text class="t" x="514" y="463">client is rejected</text>
<text class="comp" x="514" y="491">component: curl_cffi + JS runtime</text>
<rect class="cardT" x="472" y="535" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="535" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="559" r="10"/>
<text class="num" x="494" y="563" text-anchor="middle">6</text>
<text class="t" x="514" y="564">Parses it into a pandas DataFrame with</text>
<text class="t" x="514" y="586">Chinese column names</text>
<text class="comp" x="514" y="614">component: interface function</text>
<rect class="val" x="28" y="664" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="688">VALUE</text>
<text class="valT" x="48" y="712">No key, no account: one call per dataset lands a DataFrame — the price is breakage when</text>
<text class="valT" x="48" y="734">upstream pages change</text>
</svg>
