<svg xmlns="http://www.w3.org/2000/svg" width="880" height="682" viewBox="0 0 880 682" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="682" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="524" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="524" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Prefect does</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="hand" d="M408,284.5 C439.0,284.5 439.0,308 470,308" marker-end="url(#a)"/>
<path class="hand" d="M472,320.0 C441.0,320.0 441.0,382 410,382" marker-end="url(#a)"/>
<path class="hand" d="M408,415.0 C439.0,415.0 439.0,439 470,439" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install Prefect and start a local API</text>
<text class="t" x="82" y="123">server with its UI</text>
<text class="c" x="82" y="147">pip install -U prefect · prefect server</text>
<text class="c" x="82" y="166">start</text>
<text class="comp" x="82" y="189">component: Prefect server</text>
<rect class="card" x="40" y="237" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">Decorate the functions of your</text>
<text class="t" x="82" y="288">existing script</text>
<text class="c" x="82" y="312">@flow · @task(log_prints=True)</text>
<rect class="cardT" x="472" y="284" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="284" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="308" r="10"/>
<text class="num" x="494" y="312" text-anchor="middle">3</text>
<text class="t" x="514" y="313">Reports each flow and task run&#x27;s state</text>
<text class="t" x="514" y="335">and logs to the UI on port 4200</text>
<rect class="card" x="40" y="358" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="358" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="382" r="10"/>
<text class="num" x="62" y="386" text-anchor="middle">4</text>
<text class="t" x="82" y="387">Turn the flow into a scheduled</text>
<text class="t" x="82" y="409">deployment</text>
<text class="c" x="82" y="433">.serve(name=&quot;first-deployment&quot;, cron=&quot;* *</text>
<text class="c" x="82" y="452">* * *&quot;)</text>
<rect class="cardT" x="472" y="415" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="415" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="439" r="10"/>
<text class="num" x="494" y="443" text-anchor="middle">5</text>
<text class="t" x="514" y="444">The serving process polls for due</text>
<text class="t" x="514" y="466">runs, executes them and applies</text>
<text class="t" x="514" y="488">retries</text>
<text class="comp" x="514" y="516">component: .serve() process</text>
<rect class="val" x="28" y="566" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="590">VALUE</text>
<text class="valT" x="48" y="614">An ordinary Python script becomes a scheduled job with retries and a run history, without a</text>
<text class="valT" x="48" y="636">rewrite</text>
</svg>
