<svg xmlns="http://www.w3.org/2000/svg" width="880" height="599" viewBox="0 0 880 599" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="599" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="463" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="463" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">FalkorDB does</text>
<path class="hand" d="M408,118.0 C439.0,118.0 439.0,142 470,142" marker-end="url(#a)"/>
<path class="hand" d="M472,166.5 C441.0,166.5 441.0,214 410,214" marker-end="url(#a)"/>
<path class="edge" d="M62,304 L62,328" marker-end="url(#a)"/>
<path class="hand" d="M408,376.0 C439.0,376.0 439.0,400 470,400" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Start the engine with one container</text>
<text class="c" x="82" y="125">docker run -p 6379:6379 -p 3000:3000</text>
<text class="c" x="82" y="144">falkordb/falkordb</text>
<rect class="cardT" x="472" y="118" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="118" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="142" r="10"/>
<text class="num" x="494" y="146" text-anchor="middle">2</text>
<text class="t" x="514" y="147">Loads as a Redis module and opens a</text>
<text class="t" x="514" y="169">graph browser UI on port 3000</text>
<text class="comp" x="514" y="197">component: falkordb module</text>
<rect class="card" x="40" y="190" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">3</text>
<text class="t" x="82" y="219">Connect with the Python client and</text>
<text class="t" x="82" y="241">pick a named graph</text>
<text class="c" x="82" y="265">db = FalkorDB(host=&#x27;localhost&#x27;, port=6379)</text>
<text class="c" x="82" y="284">· g = db.select_graph(&#x27;MotoGP&#x27;)</text>
<rect class="card" x="40" y="330" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="330" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="354" r="10"/>
<text class="num" x="62" y="358" text-anchor="middle">4</text>
<text class="t" x="82" y="359">Write and read the graph in OpenCypher</text>
<text class="c" x="82" y="383">g.query(&quot;CREATE (:Rider {name:&#x27;Valentino</text>
<text class="c" x="82" y="402">Rossi&#x27;})&quot;)</text>
<rect class="cardT" x="472" y="376" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="376" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="400" r="10"/>
<text class="num" x="494" y="404" text-anchor="middle">5</text>
<text class="t" x="514" y="405">Executes MATCH traversals as GraphBLAS</text>
<text class="t" x="514" y="427">sparse-matrix algebra at Redis latency</text>
<text class="comp" x="514" y="455">component: GraphBLAS core</text>
<rect class="val" x="28" y="505" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="529">VALUE</text>
<text class="valT" x="48" y="553">One low-latency Redis-class server holding many tenant-isolated graphs you query with Cypher</text>
</svg>
