<svg xmlns="http://www.w3.org/2000/svg" width="880" height="941" viewBox="0 0 880 941" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="941" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="783" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="783" rx="10"/>
<rect class="pillT" x="474" y="40" width="184.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">BrowserSkill does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,262.5 C439.0,262.5 439.0,286 470,286" marker-end="url(#a)"/>
<path class="hand" d="M472,309.0 C441.0,309.0 441.0,360 410,360" marker-end="url(#a)"/>
<path class="hand" d="M408,393.0 C439.0,393.0 439.0,417 470,417" marker-end="url(#a)"/>
<path class="edge" d="M494,510 L494,534" marker-end="url(#a)"/>
<path class="edge" d="M494,672 L494,696" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the CLI, load the extension,</text>
<text class="t" x="82" y="123">and install its skill into your</text>
<text class="t" x="82" y="145">harness</text>
<text class="c" x="82" y="169">bsk install-skill</text>
<rect class="card" x="40" y="215" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Start a session and keep the session</text>
<text class="t" x="82" y="266">id the agent gets back</text>
<text class="c" x="82" y="290">bsk session start --json</text>
<rect class="cardT" x="472" y="262" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="262" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="286" r="10"/>
<text class="num" x="494" y="290" text-anchor="middle">3</text>
<text class="t" x="514" y="291">The daemon routes each command to your</text>
<text class="t" x="514" y="313">extension, which runs it in a separate</text>
<text class="t" x="514" y="335">Agent Window</text>
<rect class="card" x="40" y="336" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="336" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="360" r="10"/>
<text class="num" x="62" y="364" text-anchor="middle">4</text>
<text class="t" x="82" y="365">Observe the page for fresh @eN refs,</text>
<text class="t" x="82" y="387">then click or fill by ref</text>
<text class="c" x="82" y="411">bsk observe --session &lt;id&gt; · bsk click @e3</text>
<text class="c" x="82" y="430">--session &lt;id&gt;</text>
<rect class="cardT" x="472" y="393" width="368" height="117" rx="8"/>
<rect class="accT" x="472" y="393" width="4" height="117" rx="2"/>
<circle class="accT" cx="494" cy="417" r="10"/>
<text class="num" x="494" y="421" text-anchor="middle">5</text>
<text class="t" x="514" y="422">To touch a tab you already have open,</text>
<text class="t" x="514" y="444">it asks you first, borrows it, and</text>
<text class="t" x="514" y="466">leaves your windows alone</text>
<text class="c" x="514" y="490">bsk tab borrow &lt;tab-id&gt;</text>
<rect class="cardT" x="472" y="536" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="536" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="560" r="10"/>
<text class="num" x="494" y="564" text-anchor="middle">6</text>
<text class="t" x="514" y="565">On login or CAPTCHA it hands control</text>
<text class="t" x="514" y="587">back to you, then resumes where it</text>
<text class="t" x="514" y="609">stopped</text>
<text class="c" x="514" y="633">bsk request-help --session &lt;id&gt; --prompt</text>
<text class="c" x="514" y="652">&quot;Please complete sign-in&quot;</text>
<rect class="cardT" x="472" y="698" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="698" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="722" r="10"/>
<text class="num" x="494" y="726" text-anchor="middle">7</text>
<text class="t" x="514" y="727">When the task ends it returns the</text>
<text class="t" x="514" y="749">borrowed tab and stops the session</text>
<text class="c" x="514" y="773">bsk session stop &lt;id&gt;</text>
<rect class="val" x="28" y="825" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="849">VALUE</text>
<text class="valT" x="48" y="873">Your real, logged-in browser does the work while you keep using it — no separate test</text>
<text class="valT" x="48" y="895">account, no login replay</text>
</svg>
