<svg xmlns="http://www.w3.org/2000/svg" width="880" height="799" viewBox="0 0 880 799" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="799" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="641" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="641" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">ByteRover does</text>
<path class="edge" d="M62,205 L62,229" marker-end="url(#a)"/>
<path class="edge" d="M62,326 L62,350" marker-end="url(#a)"/>
<path class="hand" d="M408,409.0 C439.0,409.0 439.0,433 470,433" marker-end="url(#a)"/>
<path class="hand" d="M472,468.5 C441.0,468.5 441.0,516 410,516" marker-end="url(#a)"/>
<path class="hand" d="M408,539.5 C439.0,539.5 439.0,578 470,578" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the CLI (archived at v3.16.1;</text>
<text class="t" x="82" y="123">existing installs only)</text>
<text class="c" x="82" y="147">curl -fsSL</text>
<text class="c" x="82" y="166">https://byterover.dev/install.sh | sh ·</text>
<text class="c" x="82" y="185">npm install -g byterover-cli</text>
<rect class="card" x="40" y="231" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="255" r="10"/>
<text class="num" x="62" y="259" text-anchor="middle">2</text>
<text class="t" x="82" y="260">Start it in your project and connect</text>
<text class="t" x="82" y="282">an LLM provider</text>
<text class="c" x="82" y="306">brv · brv providers connect</text>
<rect class="card" x="40" y="352" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">3</text>
<text class="t" x="82" y="381">Curate a fact, pointing at the code it</text>
<text class="t" x="82" y="403">is about</text>
<text class="c" x="82" y="427">/curate &quot;Auth uses JWT with 24h expiry&quot;</text>
<text class="c" x="82" y="446">@src/middleware/auth.ts</text>
<rect class="cardT" x="472" y="409" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="409" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="433" r="10"/>
<text class="num" x="494" y="437" text-anchor="middle">4</text>
<text class="t" x="514" y="438">Its agent reads the code and files the</text>
<text class="t" x="514" y="460">knowledge into the project&#x27;s context</text>
<text class="t" x="514" y="482">tree</text>
<text class="comp" x="514" y="510">component: .brv/context-tree/</text>
<rect class="card" x="40" y="492" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="492" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="516" r="10"/>
<text class="num" x="62" y="520" text-anchor="middle">5</text>
<text class="t" x="82" y="521">Later, you or your coding agent ask</text>
<text class="t" x="82" y="543">about it</text>
<text class="c" x="82" y="567">/query How is authentication implemented?</text>
<rect class="cardT" x="472" y="554" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="554" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="578" r="10"/>
<text class="num" x="494" y="582" text-anchor="middle">6</text>
<text class="t" x="514" y="583">Searches the context tree and answers</text>
<text class="t" x="514" y="605">from the curated knowledge</text>
<text class="comp" x="514" y="633">component: query agent</text>
<rect class="val" x="28" y="683" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="707">VALUE</text>
<text class="valT" x="48" y="731">Project knowledge survives across sessions and agents as reviewed, versioned files instead of</text>
<text class="valT" x="48" y="753">being re-explained</text>
</svg>
