<svg xmlns="http://www.w3.org/2000/svg" width="880" height="631" viewBox="0 0 880 631" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="631" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="495" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="495" rx="10"/>
<rect class="pillT" x="474" y="40" width="86.8" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Pi 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,207.5 C439.0,207.5 439.0,231 470,231" marker-end="url(#a)"/>
<path class="hand" d="M472,244.5 C441.0,244.5 441.0,294 410,294" marker-end="url(#a)"/>
<path class="hand" d="M408,319.0 C439.0,319.0 439.0,343 470,343" marker-end="url(#a)"/>
<path class="hand" d="M472,356.5 C441.0,356.5 441.0,418 410,418" marker-end="url(#a)"/>
<path class="hand" d="M408,419.0 C439.0,419.0 439.0,454 470,454" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上 CLI，在项目目录里启动</text>
<text class="c" x="82" y="125">pi</text>
<rect class="card" x="40" y="171" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">连上订阅或填入 API key</text>
<text class="c" x="82" y="224">/login</text>
<rect class="cardT" x="472" y="207" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="207" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="231" r="10"/>
<text class="num" x="494" y="235" text-anchor="middle">3</text>
<text class="t" x="514" y="236">把凭证存进 agent 目录</text>
<text class="comp" x="514" y="264">组件：auth.json</text>
<rect class="card" x="40" y="270" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="270" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="294" r="10"/>
<text class="num" x="62" y="298" text-anchor="middle">4</text>
<text class="t" x="82" y="299">把你自己的指令、技能和扩展放进项目</text>
<text class="c" x="82" y="323">./.pi/</text>
<text class="comp" x="82" y="346">组件：技能 · 模板 · 扩展</text>
<rect class="cardT" x="472" y="319" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="319" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="343" r="10"/>
<text class="num" x="494" y="347" text-anchor="middle">5</text>
<text class="t" x="514" y="348">你授予项目信任后，加载这些项目资源</text>
<text class="comp" x="514" y="376">组件：项目信任</text>
<rect class="card" x="40" y="394" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="394" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="418" r="10"/>
<text class="num" x="62" y="422" text-anchor="middle">6</text>
<text class="t" x="82" y="423">给它一个目标</text>
<rect class="cardT" x="472" y="430" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="430" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="454" r="10"/>
<text class="num" x="494" y="458" text-anchor="middle">7</text>
<text class="t" x="514" y="459">读文件、跑命令、改内容，一轮一轮推进</text>
<text class="comp" x="514" y="487">组件：agent 循环</text>
<rect class="val" x="28" y="537" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="561">价值</text>
<text class="valT" x="48" y="585">你不用整体接受一个内置的 agent：循环很小，它做什么由你仓库里的文件决定，而那些文件它自己也能写</text>
</svg>
