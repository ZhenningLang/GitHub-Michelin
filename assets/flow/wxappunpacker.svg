<svg xmlns="http://www.w3.org/2000/svg" width="880" height="833" viewBox="0 0 880 833" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="833" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="675" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="675" rx="10"/>
<rect class="pillT" x="474" y="40" width="184.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The unpacker does</text>
<path class="edge" d="M62,205 L62,229" marker-end="url(#a)"/>
<path class="edge" d="M62,348 L62,372" marker-end="url(#a)"/>
<path class="hand" d="M408,421.5 C439.0,421.5 439.0,445 470,445" marker-end="url(#a)"/>
<path class="edge" d="M494,540 L494,564" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Copy the cached mini-program packages</text>
<text class="t" x="82" y="123">off an Android phone</text>
<text class="c" x="82" y="147">adb pull</text>
<text class="c" x="82" y="166">/data/data/com.tencent.mm/MicroMsg/{User}/</text>
<text class="c" x="82" y="185">appbrand/pkg</text>
<rect class="card" x="40" y="231" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="255" r="10"/>
<text class="num" x="62" y="259" text-anchor="middle">2</text>
<text class="t" x="82" y="260">Clone a fork that still has the code</text>
<text class="t" x="82" y="282">(this repo is empty) and install its</text>
<text class="t" x="82" y="304">packages</text>
<text class="c" x="82" y="328">npm install</text>
<rect class="card" x="40" y="374" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="374" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="398" r="10"/>
<text class="num" x="62" y="402" text-anchor="middle">3</text>
<text class="t" x="82" y="403">Point the main script at one .wxapkg</text>
<text class="t" x="82" y="425">file</text>
<text class="c" x="82" y="449">node wuWxapkg.js</text>
<rect class="cardT" x="472" y="421" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="421" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="445" r="10"/>
<text class="num" x="494" y="449" text-anchor="middle">4</text>
<text class="t" x="514" y="450">Splits the package into its stored</text>
<text class="t" x="514" y="472">files, then splits the bundled</text>
<text class="t" x="514" y="494">app-service.js back into per-file JS</text>
<text class="comp" x="514" y="522">component: wuWxapkg.js + wuJs.js</text>
<rect class="cardT" x="472" y="566" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="566" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="590" r="10"/>
<text class="num" x="494" y="594" text-anchor="middle">5</text>
<text class="t" x="514" y="595">Runs the compiled page code in a vm2</text>
<text class="t" x="514" y="617">sandbox to rebuild .json, .wxss and</text>
<text class="t" x="514" y="639">.wxml sources</text>
<text class="comp" x="514" y="667">component: wuConfig · wuWxss · wuWxml</text>
<rect class="val" x="28" y="717" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="741">VALUE</text>
<text class="valT" x="48" y="765">A readable mini-program project tree from a packed .wxapkg, for auditing or recovering your</text>
<text class="valT" x="48" y="787">own app</text>
</svg>
