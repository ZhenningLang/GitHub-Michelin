<svg xmlns="http://www.w3.org/2000/svg" width="880" height="783" viewBox="0 0 880 783" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="783" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="625" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="625" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Whiteboard does</text>
<path class="hand" d="M408,129.0 C439.0,129.0 439.0,153 470,153" marker-end="url(#a)"/>
<path class="hand" d="M472,197.0 C441.0,197.0 441.0,236 410,236" marker-end="url(#a)"/>
<path class="hand" d="M408,268.0 C439.0,268.0 439.0,315 470,315" marker-end="url(#a)"/>
<path class="hand" d="M472,370.5 C441.0,370.5 441.0,394 410,394" marker-end="url(#a)"/>
<path class="hand" d="M408,426.0 C439.0,426.0 439.0,500 470,500" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Connect once</text>
<text class="t" x="82" y="118">Install Whiteboard Desktop; it puts</text>
<text class="t" x="82" y="140">the whiteboard CLI on your PATH</text>
<text class="comp" x="82" y="168">component: desktop app</text>
<rect class="cardT" x="472" y="129" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="129" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="153" r="10"/>
<text class="num" x="494" y="157" text-anchor="middle">2</text>
<text class="ph" x="514" y="158">Connect once</text>
<text class="t" x="514" y="175">Desktop hosts a local server that owns</text>
<text class="t" x="514" y="197">review state, the canvas and agent</text>
<text class="t" x="514" y="219">setup</text>
<text class="comp" x="514" y="247">component: embedded server</text>
<rect class="card" x="40" y="212" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">3</text>
<text class="ph" x="82" y="241">Connect once</text>
<text class="t" x="82" y="258">Run the connect command and paste its</text>
<text class="t" x="82" y="280">generated prompt into your agent</text>
<text class="c" x="82" y="304">whiteboard connect &lt;agent&gt;</text>
<rect class="cardT" x="472" y="291" width="368" height="159" rx="8"/>
<rect class="accT" x="472" y="291" width="4" height="159" rx="2"/>
<circle class="accT" cx="494" cy="315" r="10"/>
<text class="num" x="494" y="319" text-anchor="middle">4</text>
<text class="ph" x="514" y="320">Connect once</text>
<text class="t" x="514" y="337">The agent adds the whiteboard MCP</text>
<text class="t" x="514" y="359">server, which serves the authoring</text>
<text class="t" x="514" y="381">instructions</text>
<text class="c" x="514" y="405">whiteboard mcp</text>
<text class="comp" x="514" y="428">component: MCP server</text>
<rect class="card" x="40" y="370" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="370" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="394" r="10"/>
<text class="num" x="62" y="398" text-anchor="middle">5</text>
<text class="ph" x="82" y="399">Every review</text>
<text class="t" x="82" y="416">Ask your agent to review the branch</text>
<text class="t" x="82" y="438">against main and say: use whiteboard</text>
<text class="c" x="82" y="462">use whiteboard</text>
<rect class="cardT" x="472" y="476" width="368" height="159" rx="8"/>
<rect class="accT" x="472" y="476" width="4" height="159" rx="2"/>
<circle class="accT" cx="494" cy="500" r="10"/>
<text class="num" x="494" y="504" text-anchor="middle">6</text>
<text class="ph" x="514" y="505">Every review</text>
<text class="t" x="514" y="522">It pins the commits, reads the diff,</text>
<text class="t" x="514" y="544">and draws sections, diagrams and code</text>
<text class="t" x="514" y="566">links live</text>
<text class="c" x="514" y="590">session_diff</text>
<text class="comp" x="514" y="613">component: MCP tools</text>
<rect class="val" x="28" y="667" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="691">VALUE</text>
<text class="valT" x="48" y="715">Read the change as an RFC the agent wrote: click a diagram or quote, land on the exact line</text>
<text class="valT" x="48" y="737">in your checkout</text>
</svg>
