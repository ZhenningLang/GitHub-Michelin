<svg xmlns="http://www.w3.org/2000/svg" width="880" height="928" viewBox="0 0 880 928" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="928" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="770" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="770" rx="10"/>
<rect class="pillT" x="474" y="40" width="193.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">the reference does</text>
<path class="edge" d="M62,184 L62,208" marker-end="url(#a)"/>
<path class="edge" d="M62,322 L62,346" marker-end="url(#a)"/>
<path class="edge" d="M62,460 L62,484" marker-end="url(#a)"/>
<path class="hand" d="M408,531.0 C439.0,531.0 439.0,555 470,555" marker-end="url(#a)"/>
<path class="edge" d="M494,642 L494,666" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Build</text>
<text class="t" x="82" y="118">Install the seven packages from the</text>
<text class="t" x="82" y="140">repo</text>
<text class="c" x="82" y="164">pip install -r requirements.txt</text>
<rect class="card" x="40" y="210" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="210" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="234" r="10"/>
<text class="num" x="62" y="238" text-anchor="middle">2</text>
<text class="ph" x="82" y="239">Build</text>
<text class="t" x="82" y="256">Implement the role interface over your</text>
<text class="t" x="82" y="278">catalog, cart and orders</text>
<text class="c" x="82" y="302">StorefrontBackend</text>
<rect class="card" x="40" y="348" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="348" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="372" r="10"/>
<text class="num" x="62" y="376" text-anchor="middle">3</text>
<text class="ph" x="82" y="377">Build</text>
<text class="t" x="82" y="394">Build the agent with your backend and</text>
<text class="t" x="82" y="416">the shipped skill flows</text>
<text class="c" x="82" y="440">ShoppingAgent(backend=…, skills_dir=…)</text>
<rect class="card" x="40" y="486" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="486" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="510" r="10"/>
<text class="num" x="62" y="514" text-anchor="middle">4</text>
<text class="ph" x="82" y="515">Build</text>
<text class="t" x="82" y="532">Expose the two routes your app calls</text>
<text class="c" x="82" y="556">POST /api/session · POST /api/chat</text>
<rect class="cardT" x="472" y="531" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="531" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="555" r="10"/>
<text class="num" x="494" y="559" text-anchor="middle">5</text>
<text class="ph" x="514" y="560">Every turn</text>
<text class="t" x="514" y="577">Runs the turn loop: tools dispatch,</text>
<text class="t" x="514" y="599">gates check provenance, card values</text>
<text class="t" x="514" y="621">are joined from your records</text>
<rect class="cardT" x="472" y="668" width="368" height="112" rx="8"/>
<rect class="accT" x="472" y="668" width="4" height="112" rx="2"/>
<circle class="accT" cx="494" cy="692" r="10"/>
<text class="num" x="494" y="696" text-anchor="middle">6</text>
<text class="ph" x="514" y="697">Every turn</text>
<text class="t" x="514" y="714">Streams the turn back as events your</text>
<text class="t" x="514" y="736">UI renders</text>
<text class="c" x="514" y="760">ui · cart_update · turn_complete</text>
<rect class="val" x="28" y="812" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="836">VALUE</text>
<text class="valT" x="48" y="860">You build once; every turn afterwards gets prompt, guardrails, UI fill-in and turn loop for</text>
<text class="valT" x="48" y="882">free</text>
</svg>
