<svg xmlns="http://www.w3.org/2000/svg" width="880" height="875" viewBox="0 0 880 875" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="875" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="717" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="717" rx="10"/>
<rect class="pillT" x="474" y="40" width="193.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">the reference does</text>
<path class="hand" d="M408,140.0 C439.0,140.0 439.0,164 470,164" marker-end="url(#a)"/>
<path class="hand" d="M472,176.0 C441.0,176.0 441.0,258 410,258" marker-end="url(#a)"/>
<path class="edge" d="M62,329 L62,353" marker-end="url(#a)"/>
<path class="edge" d="M62,450 L62,474" marker-end="url(#a)"/>
<path class="hand" d="M408,512.5 C439.0,512.5 439.0,536 470,536" marker-end="url(#a)"/>
<path class="edge" d="M494,606 L494,630" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the seven packages from the</text>
<text class="t" x="82" y="123">repo and run the bundled retail</text>
<text class="t" x="82" y="145">vertical</text>
<text class="c" x="82" y="169">pip install -r requirements.txt · python</text>
<text class="c" x="82" y="188">scripts/run_demo.py retail</text>
<rect class="cardT" x="472" y="140" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="140" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="164" r="10"/>
<text class="num" x="494" y="168" text-anchor="middle">2</text>
<text class="t" x="514" y="169">Boots the API, the storefront and the</text>
<text class="t" x="514" y="191">merchant portal over mock backends</text>
<rect class="card" x="40" y="234" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">3</text>
<text class="t" x="82" y="263">Implement the role interface over your</text>
<text class="t" x="82" y="285">catalog, cart and orders</text>
<text class="c" x="82" y="309">StorefrontBackend</text>
<rect class="card" x="40" y="355" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="355" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="379" r="10"/>
<text class="num" x="62" y="383" text-anchor="middle">4</text>
<text class="t" x="82" y="384">Build the agent with your backend and</text>
<text class="t" x="82" y="406">the shipped skill flows</text>
<text class="c" x="82" y="430">ShoppingAgent(backend=…, skills_dir=…)</text>
<rect class="card" x="40" y="476" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="476" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="500" r="10"/>
<text class="num" x="62" y="504" text-anchor="middle">5</text>
<text class="t" x="82" y="505">Expose the two routes your app calls</text>
<text class="c" x="82" y="529">POST /api/session · POST /api/chat</text>
<rect class="cardT" x="472" y="512" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="512" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="536" r="10"/>
<text class="num" x="494" y="540" text-anchor="middle">6</text>
<text class="t" x="514" y="541">Runs the turn loop: tools dispatch,</text>
<text class="t" x="514" y="563">gates check provenance, card values</text>
<text class="t" x="514" y="585">are joined from your records</text>
<rect class="cardT" x="472" y="632" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="632" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="656" r="10"/>
<text class="num" x="494" y="660" text-anchor="middle">7</text>
<text class="t" x="514" y="661">Streams the turn back as events your</text>
<text class="t" x="514" y="683">UI renders</text>
<text class="c" x="514" y="707">ui · cart_update · turn_complete</text>
<rect class="val" x="28" y="759" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="783">VALUE</text>
<text class="valT" x="48" y="807">You get a working commerce agent — prompt, guardrails, UI fill-in and turn loop included —</text>
<text class="valT" x="48" y="829">wired to your own systems</text>
</svg>
