<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1102" viewBox="0 0 880 1102" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1102" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="966" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="966" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TokenHub 做的</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="edge" d="M62,334 L62,358" marker-end="url(#a)"/>
<path class="edge" d="M62,457 L62,481" marker-end="url(#a)"/>
<path class="hand" d="M408,532.0 C439.0,532.0 439.0,556 470,556" marker-end="url(#a)"/>
<path class="edge" d="M494,629 L494,653" marker-end="url(#a)"/>
<path class="edge" d="M494,752 L494,776" marker-end="url(#a)"/>
<path class="edge" d="M494,875 L494,899" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在台主机上装好网关：原生 systemd 或</text>
<text class="t" x="82" y="123">Docker Compose</text>
<text class="c" x="82" y="147">sudo bash /tmp/tokenhub-install.sh install</text>
<text class="c" x="82" y="166">· ./deploy/install.sh</text>
<text class="comp" x="82" y="189">组件：安装脚本 / Compose</text>
<rect class="card" x="40" y="237" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">在管理控制台里添加 Provider，填上游 API</text>
<text class="t" x="82" y="288">key，导入它的模型</text>
<text class="comp" x="82" y="316">组件：Next.js 管理控制台</text>
<rect class="card" x="40" y="360" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="360" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="384" r="10"/>
<text class="num" x="62" y="388" text-anchor="middle">3</text>
<text class="t" x="82" y="389">建一个项目，发一把带配额和模型白名单的项目</text>
<text class="t" x="82" y="411">级 API key</text>
<text class="comp" x="82" y="439">组件：Key Management</text>
<rect class="card" x="40" y="483" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="483" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="507" r="10"/>
<text class="num" x="62" y="511" text-anchor="middle">4</text>
<text class="t" x="82" y="512">把应用指到网关，用这把 key 发起调用</text>
<text class="c" x="82" y="536">POST /v1/chat/completions</text>
<text class="comp" x="82" y="559">组件：OpenAI 兼容 API</text>
<rect class="cardT" x="472" y="532" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="532" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="556" r="10"/>
<text class="num" x="494" y="560" text-anchor="middle">5</text>
<text class="t" x="514" y="561">校验项目 key，执行配额、RPM/TPM 和白</text>
<text class="t" x="514" y="583">名单准入</text>
<text class="comp" x="514" y="611">组件：访问与治理层</text>
<rect class="cardT" x="472" y="655" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="655" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="679" r="10"/>
<text class="num" x="494" y="683" text-anchor="middle">6</text>
<text class="t" x="514" y="684">按优先级、权重和健康度选路由，必要时自动故</text>
<text class="t" x="514" y="706">障转移</text>
<text class="comp" x="514" y="734">组件：路由引擎</text>
<rect class="cardT" x="472" y="778" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="778" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="802" r="10"/>
<text class="num" x="494" y="806" text-anchor="middle">7</text>
<text class="t" x="514" y="807">经 Provider 适配器转发上游，把响应流</text>
<text class="t" x="514" y="829">回给应用</text>
<text class="comp" x="514" y="857">组件：适配器注册表</text>
<rect class="cardT" x="472" y="901" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="901" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="925" r="10"/>
<text class="num" x="494" y="929" text-anchor="middle">8</text>
<text class="t" x="514" y="930">记录 token 与费用，归属到用户、项目和团队</text>
<text class="comp" x="514" y="958">组件：运营与可观测层</text>
<rect class="val" x="28" y="1008" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="1032">价值</text>
<text class="valT" x="48" y="1056">应用不再持有厂商原始 key——每次调用都过策略检查，都能归属到项目和账单</text>
</svg>
