<svg xmlns="http://www.w3.org/2000/svg" width="880" height="754" viewBox="0 0 880 754" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="754" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="618" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="618" rx="10"/>
<rect class="pillT" x="474" y="40" width="224.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">node-DeepResearch 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,244 L62,268" marker-end="url(#a)"/>
<path class="hand" d="M408,306.5 C439.0,306.5 439.0,330 470,330" marker-end="url(#a)"/>
<path class="edge" d="M494,378 L494,402" marker-end="url(#a)"/>
<path class="edge" d="M494,454 L494,478" marker-end="url(#a)"/>
<path class="edge" d="M494,552 L494,576" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">克隆仓库，安装依赖</text>
<text class="c" x="82" y="125">npm install</text>
<rect class="card" x="40" y="171" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">导出一个 LLM key 和一个 Jina key</text>
<text class="c" x="82" y="224">GEMINI_API_KEY · JINA_API_KEY</text>
<rect class="card" x="40" y="270" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="270" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="294" r="10"/>
<text class="num" x="62" y="298" text-anchor="middle">3</text>
<text class="t" x="82" y="299">在命令行里提一个问题</text>
<text class="c" x="82" y="323">npm run dev $QUERY</text>
<rect class="cardT" x="472" y="306" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="306" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="330" r="10"/>
<text class="num" x="494" y="334" text-anchor="middle">4</text>
<text class="t" x="514" y="335">每一步由 LLM 选一个动作：搜索、访问、反思</text>
<text class="t" x="514" y="357">或作答</text>
<rect class="cardT" x="472" y="404" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="404" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="428" r="10"/>
<text class="num" x="494" y="432" text-anchor="middle">5</text>
<text class="t" x="514" y="433">经 Jina Reader 读网页，记下发现和子问题</text>
<rect class="cardT" x="472" y="480" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="480" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="504" r="10"/>
<text class="num" x="494" y="508" text-anchor="middle">6</text>
<text class="t" x="514" y="509">检查候选答案是否确定、有无出处，不合格就继</text>
<text class="t" x="514" y="531">续循环</text>
<rect class="cardT" x="472" y="578" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="578" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="602" r="10"/>
<text class="num" x="494" y="606" text-anchor="middle">7</text>
<text class="t" x="514" y="607">返回带脚注引用的答案，预算耗尽时强行作答</text>
<rect class="val" x="28" y="660" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="684">价值</text>
<text class="valT" x="48" y="708">一个要跳好几步的难问题，换来一个简短、带出处的答案，花费由 token 预算封顶</text>
</svg>
