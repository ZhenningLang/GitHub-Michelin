<svg xmlns="http://www.w3.org/2000/svg" width="880" height="796" viewBox="0 0 880 796" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="796" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="638" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="638" rx="10"/>
<rect class="pillT" x="474" y="40" width="221.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Vibe Annotations does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,269.5 C439.0,269.5 439.0,293 470,293" marker-end="url(#a)"/>
<path class="hand" d="M472,313.5 C441.0,313.5 441.0,377 410,377" marker-end="url(#a)"/>
<path class="hand" d="M408,397.5 C439.0,397.5 439.0,421 470,421" marker-end="url(#a)"/>
<path class="hand" d="M472,465.0 C441.0,465.0 441.0,492 410,492" marker-end="url(#a)"/>
<path class="hand" d="M408,512.5 C439.0,512.5 439.0,583 470,583" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Set up once</text>
<text class="t" x="82" y="118">Install the browser extension from the</text>
<text class="t" x="82" y="140">Chrome Web Store</text>
<text class="comp" x="82" y="168">component: browser extension</text>
<rect class="card" x="40" y="212" width="368" height="115" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="115" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="ph" x="82" y="241">Set up once</text>
<text class="t" x="82" y="258">Run the one-time setup wizard</text>
<text class="c" x="82" y="282">npx vibe-annotations-server init</text>
<text class="comp" x="82" y="305">component: setup wizard</text>
<rect class="cardT" x="472" y="269" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="269" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="293" r="10"/>
<text class="num" x="494" y="297" text-anchor="middle">3</text>
<text class="ph" x="514" y="298">Set up once</text>
<text class="t" x="514" y="315">Installs the global server, starts it,</text>
<text class="t" x="514" y="337">configures your coding agent</text>
<rect class="card" x="40" y="353" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="353" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="377" r="10"/>
<text class="num" x="62" y="381" text-anchor="middle">4</text>
<text class="ph" x="82" y="382">Every annotation round</text>
<text class="t" x="82" y="399">Open a localhost page, click Annotate,</text>
<text class="t" x="82" y="421">mark what&#x27;s wrong</text>
<rect class="cardT" x="472" y="397" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="397" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="421" r="10"/>
<text class="num" x="494" y="425" text-anchor="middle">5</text>
<text class="ph" x="514" y="426">Every annotation round</text>
<text class="t" x="514" y="443">Stores annotations per project and</text>
<text class="t" x="514" y="465">page, serving extension and agent</text>
<text class="t" x="514" y="487">alike</text>
<text class="comp" x="514" y="515">component: local server</text>
<rect class="card" x="40" y="468" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="468" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="492" r="10"/>
<text class="num" x="62" y="496" text-anchor="middle">6</text>
<text class="ph" x="82" y="497">Every annotation round</text>
<text class="t" x="82" y="514">Let the agent implement via MCP — or</text>
<text class="t" x="82" y="536">View all, Copy, paste</text>
<rect class="cardT" x="472" y="559" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="559" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="583" r="10"/>
<text class="num" x="494" y="587" text-anchor="middle">7</text>
<text class="ph" x="514" y="588">Every annotation round</text>
<text class="t" x="514" y="605">The fix loop closes without anyone</text>
<text class="t" x="514" y="627">touching app code</text>
<rect class="val" x="28" y="680" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="704">VALUE</text>
<text class="valT" x="48" y="728">Whoever sees the UI problem can feed it straight to the coding agent — no repo access, no</text>
<text class="valT" x="48" y="750">install steps, no clipboard archaeology.</text>
</svg>
