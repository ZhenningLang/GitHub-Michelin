<svg xmlns="http://www.w3.org/2000/svg" width="880" height="574" viewBox="0 0 880 574" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="574" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="438" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="438" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Typst 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,269.0 C439.0,269.0 439.0,293 470,293" marker-end="url(#a)"/>
<path class="hand" d="M472,294.0 C441.0,294.0 441.0,376 410,376" marker-end="url(#a)"/>
<path class="hand" d="M408,398.0 C439.0,398.0 439.0,422 470,422" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从包管理器、压缩包、cargo 或 Docker 安装</text>
<text class="t" x="82" y="123">编译器</text>
<text class="c" x="82" y="147">brew install typst · cargo install</text>
<text class="c" x="82" y="166">--locked typst-cli</text>
<rect class="card" x="40" y="212" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">用 .typ 写文档：标记、# 表达式，以及负责版</text>
<text class="t" x="82" y="263">式的 set 规则</text>
<text class="c" x="82" y="287">= Heading · #set page(width: 10cm, height:</text>
<text class="c" x="82" y="306">auto)</text>
<rect class="cardT" x="472" y="269" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="269" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="293" r="10"/>
<text class="num" x="494" y="297" text-anchor="middle">3</text>
<text class="t" x="514" y="298">解析标记、求值内嵌脚本，并完成文档布局</text>
<rect class="card" x="40" y="352" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">4</text>
<text class="t" x="82" y="381">编译一次，或者开着 watch 边改边看</text>
<text class="c" x="82" y="405">typst compile file.typ · typst watch</text>
<text class="c" x="82" y="424">file.typ</text>
<rect class="cardT" x="472" y="398" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="398" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="422" r="10"/>
<text class="num" x="494" y="426" text-anchor="middle">5</text>
<text class="t" x="514" y="427">写出产物，并且只重建改动过的部分</text>
<rect class="val" x="28" y="480" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="504">价值</text>
<text class="valT" x="48" y="528">一份 .typ 源在一条命令内变成排好版的 PDF——或 PNG、SVG、HTML——背后不需要装 TeX</text>
</svg>
