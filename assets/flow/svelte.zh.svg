<svg xmlns="http://www.w3.org/2000/svg" width="880" height="768" viewBox="0 0 880 768" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="768" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="632" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="632" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Svelte 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,309 L62,333" marker-end="url(#a)"/>
<path class="hand" d="M408,371.5 C439.0,371.5 439.0,395 470,395" marker-end="url(#a)"/>
<path class="edge" d="M494,468 L494,492" marker-end="url(#a)"/>
<path class="edge" d="M494,544 L494,568" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">生成项目（默认带 SvelteKit，也可用纯 Vit</text>
<text class="t" x="82" y="123">e），启动开发服务器</text>
<text class="c" x="82" y="147">npx sv create myapp · npm create</text>
<text class="c" x="82" y="166">vite@latest</text>
<rect class="card" x="40" y="212" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">写一个 .svelte 文件：标记、script 块和</text>
<text class="t" x="82" y="263">style 块放在一起</text>
<text class="comp" x="82" y="291">组件：组件文件</text>
<rect class="card" x="40" y="335" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="335" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="359" r="10"/>
<text class="num" x="62" y="363" text-anchor="middle">3</text>
<text class="t" x="82" y="364">把会变的值声明成响应式状态</text>
<text class="c" x="82" y="388">let count = $state(0)</text>
<rect class="cardT" x="472" y="371" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="371" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="395" r="10"/>
<text class="num" x="494" y="399" text-anchor="middle">4</text>
<text class="t" x="514" y="400">构建时把每个组件编译成 JS：建好 DOM，记住</text>
<text class="t" x="514" y="422">哪个节点读了哪个状态</text>
<text class="comp" x="514" y="450">组件：编译器（Vite 插件）</text>
<rect class="cardT" x="472" y="494" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="494" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="518" r="10"/>
<text class="num" x="494" y="522" text-anchor="middle">5</text>
<text class="t" x="514" y="523">把组件的 CSS 限定在组件内部，不会漏到别处</text>
<rect class="cardT" x="472" y="570" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="570" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="594" r="10"/>
<text class="num" x="494" y="598" text-anchor="middle">6</text>
<text class="t" x="514" y="599">浏览器里状态一变，只更新读了它的 DOM 节</text>
<text class="t" x="514" y="621">点，不做虚拟 DOM 比对</text>
<rect class="val" x="28" y="674" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="698">价值</text>
<text class="valT" x="48" y="722">写法接近普通 HTML 的组件，发布成直接操作 DOM 的小段 JavaScript，更新时没有框架在后台比对</text>
</svg>
