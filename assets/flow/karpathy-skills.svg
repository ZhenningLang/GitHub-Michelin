<svg xmlns="http://www.w3.org/2000/svg" width="880" height="610" viewBox="0 0 880 610" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="610" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="474" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="474" rx="10"/>
<rect class="pillT" x="474" y="40" width="322.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The guidelines make the agent do</text>
<path class="hand" d="M408,140.0 C439.0,140.0 439.0,164 470,164" marker-end="url(#a)"/>
<path class="hand" d="M472,188.5 C441.0,188.5 441.0,258 410,258" marker-end="url(#a)"/>
<path class="hand" d="M408,270.0 C439.0,270.0 439.0,294 470,294" marker-end="url(#a)"/>
<path class="edge" d="M494,364 L494,388" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add its marketplace and install the</text>
<text class="t" x="82" y="123">Claude Code plugin (or curl CLAUDE.md</text>
<text class="t" x="82" y="145">into a project)</text>
<text class="c" x="82" y="169">/plugin install</text>
<text class="c" x="82" y="188">andrej-karpathy-skills@karpathy-skills</text>
<rect class="cardT" x="472" y="140" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="140" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="164" r="10"/>
<text class="num" x="494" y="168" text-anchor="middle">2</text>
<text class="t" x="514" y="169">Four principles join the agent&#x27;s</text>
<text class="t" x="514" y="191">standing instructions in every project</text>
<text class="comp" x="514" y="219">component: karpathy-guidelines skill</text>
<rect class="card" x="40" y="234" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">3</text>
<text class="t" x="82" y="263">Give a task, ideally with a checkable</text>
<text class="t" x="82" y="285">goal like a failing test</text>
<rect class="cardT" x="472" y="270" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="270" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="294" r="10"/>
<text class="num" x="494" y="298" text-anchor="middle">4</text>
<text class="t" x="514" y="299">States its assumptions and asks when</text>
<text class="t" x="514" y="321">the request is ambiguous, before</text>
<text class="t" x="514" y="343">writing code</text>
<rect class="cardT" x="472" y="390" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="390" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="414" r="10"/>
<text class="num" x="494" y="418" text-anchor="middle">5</text>
<text class="t" x="514" y="419">Writes the minimum change, touches</text>
<text class="t" x="514" y="441">only lines your request needs, loops</text>
<text class="t" x="514" y="463">until the check passes</text>
<rect class="val" x="28" y="516" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="540">VALUE</text>
<text class="valT" x="48" y="564">Smaller diffs, questions before mistakes instead of after, and no drive-by refactoring</text>
</svg>
