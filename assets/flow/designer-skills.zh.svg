<svg xmlns="http://www.w3.org/2000/svg" width="880" height="672" viewBox="0 0 880 672" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="672" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="536" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="536" rx="10"/>
<rect class="pillT" x="474" y="40" width="206.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Designer Skills 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,239.0 C439.0,239.0 439.0,263 470,263" marker-end="url(#a)"/>
<path class="hand" d="M472,287.5 C441.0,287.5 441.0,338 410,338" marker-end="url(#a)"/>
<path class="hand" d="M408,350.5 C439.0,350.5 439.0,386 470,386" marker-end="url(#a)"/>
<path class="hand" d="M472,387.0 C441.0,387.0 441.0,437 410,437" marker-end="url(#a)"/>
<path class="hand" d="M408,449.5 C439.0,449.5 439.0,473 470,473" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">先添加 marketplace（此时还没装任何东西）</text>
<text class="c" x="82" y="125">/plugin marketplace add</text>
<text class="c" x="82" y="144">Owl-Listener/designer-skills</text>
<rect class="card" x="40" y="190" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">在 Discover 页勾选想要的 plugin，回车安装</text>
<text class="c" x="82" y="243">/plugin</text>
<text class="comp" x="82" y="266">组件：plugin marketplace</text>
<rect class="cardT" x="472" y="239" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="239" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="263" r="10"/>
<text class="num" x="494" y="267" text-anchor="middle">3</text>
<text class="t" x="514" y="268">把所选 plugin 的 skill 作为按需加载</text>
<text class="t" x="514" y="290">的设计知识</text>
<text class="comp" x="514" y="318">组件：plugin（如 ui-design）</text>
<rect class="card" x="40" y="314" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">4</text>
<text class="t" x="82" y="343">不知道从哪开始？说出你在做什么</text>
<text class="c" x="82" y="367">/designer-toolkit:start-here</text>
<rect class="cardT" x="472" y="362" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="362" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="386" r="10"/>
<text class="num" x="494" y="390" text-anchor="middle">5</text>
<text class="t" x="514" y="391">指出你所在的阶段，给你一条命令和随后的两条</text>
<rect class="card" x="40" y="413" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="413" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="437" r="10"/>
<text class="num" x="62" y="441" text-anchor="middle">6</text>
<text class="t" x="82" y="442">带上你的上下文跑这条工作流命令</text>
<text class="c" x="82" y="466">/design-research:discover</text>
<rect class="cardT" x="472" y="449" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="449" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="473" r="10"/>
<text class="num" x="494" y="477" text-anchor="middle">7</text>
<text class="t" x="514" y="478">把底层的 skill 串成一份交付物（画像、共情</text>
<text class="t" x="514" y="500">地图、旅程图）</text>
<text class="comp" x="514" y="528">组件：command 串联 skill</text>
<rect class="val" x="28" y="578" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="602">价值</text>
<text class="valT" x="48" y="626">agent 在整条生命周期上运用训练有素的设计判断，而不是产出看着像样、实则空洞的东西</text>
</svg>
