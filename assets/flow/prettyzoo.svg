<svg xmlns="http://www.w3.org/2000/svg" width="880" height="524" viewBox="0 0 880 524" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="524" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="388" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="388" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">PrettyZoo does</text>
<path class="edge" d="M62,166 L62,190" marker-end="url(#a)"/>
<path class="hand" d="M408,228.0 C439.0,228.0 439.0,252 470,252" marker-end="url(#a)"/>
<path class="hand" d="M472,264.0 C441.0,264.0 441.0,314 410,314" marker-end="url(#a)"/>
<path class="hand" d="M408,326.0 C439.0,326.0 439.0,350 470,350" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Download the msi, dmg, or rpm/deb</text>
<text class="t" x="82" y="123">installer from GitHub Releases and</text>
<text class="t" x="82" y="145">install it</text>
<rect class="card" x="40" y="192" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="192" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="216" r="10"/>
<text class="num" x="62" y="220" text-anchor="middle">2</text>
<text class="t" x="82" y="221">Add a ZooKeeper server connection,</text>
<text class="t" x="82" y="243">optionally through an SSH tunnel</text>
<rect class="cardT" x="472" y="228" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="228" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="252" r="10"/>
<text class="num" x="494" y="256" text-anchor="middle">3</text>
<text class="t" x="514" y="257">Connects via Apache Curator, loads the</text>
<text class="t" x="514" y="279">znode tree and keeps it synced live</text>
<rect class="card" x="40" y="290" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="290" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="314" r="10"/>
<text class="num" x="62" y="318" text-anchor="middle">4</text>
<text class="t" x="82" y="319">Click a node to read or edit its data,</text>
<text class="t" x="82" y="341">create or delete nodes, set ACLs</text>
<rect class="cardT" x="472" y="326" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="326" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="350" r="10"/>
<text class="num" x="494" y="354" text-anchor="middle">5</text>
<text class="t" x="514" y="355">Pretty-prints and highlights JSON/XML</text>
<text class="t" x="514" y="377">data and writes your edits back</text>
<rect class="val" x="28" y="430" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="454">VALUE</text>
<text class="valT" x="48" y="478">You see and fix what is in ZooKeeper by clicking, without memorizing zkCli.sh commands</text>
</svg>
