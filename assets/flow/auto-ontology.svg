<svg xmlns="http://www.w3.org/2000/svg" width="880" height="687" viewBox="0 0 880 687" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="687" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="529" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="529" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Auto Ontology</text>
<path class="hand" d="M408,130.5 C439.0,130.5 439.0,154 470,154" marker-end="url(#a)"/>
<path class="hand" d="M472,189.5 C441.0,189.5 441.0,239 410,239" marker-end="url(#a)"/>
<path class="hand" d="M408,251.0 C439.0,251.0 439.0,299 470,299" marker-end="url(#a)"/>
<path class="hand" d="M472,334.5 C441.0,334.5 441.0,358 410,358" marker-end="url(#a)"/>
<path class="hand" d="M408,381.5 C439.0,381.5 439.0,444 470,444" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Put a model API key, passwords and</text>
<text class="t" x="82" y="123">your database URLs in .env, then start</text>
<text class="t" x="82" y="145">the stack</text>
<text class="c" x="82" y="169">docker compose up -d --build</text>
<rect class="cardT" x="472" y="130" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="130" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="154" r="10"/>
<text class="num" x="494" y="158" text-anchor="middle">2</text>
<text class="t" x="514" y="159">Reads tables, columns, keys and query</text>
<text class="t" x="514" y="181">history from each source and embeds</text>
<text class="t" x="514" y="203">them</text>
<text class="comp" x="514" y="231">component: ingestion service</text>
<rect class="card" x="40" y="215" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">3</text>
<text class="t" x="82" y="244">Turn on Semantic Compilation in</text>
<text class="t" x="82" y="266">Settings</text>
<rect class="cardT" x="472" y="275" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="275" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="299" r="10"/>
<text class="num" x="494" y="303" text-anchor="middle">4</text>
<text class="t" x="514" y="304">Samples each table, names business</text>
<text class="t" x="514" y="326">terms and keeps only joins the data</text>
<text class="t" x="514" y="348">confirms</text>
<text class="comp" x="514" y="376">component: semantic compilation</text>
<rect class="card" x="40" y="334" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="334" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="358" r="10"/>
<text class="num" x="62" y="362" text-anchor="middle">5</text>
<text class="t" x="82" y="363">Ask a business question in Chat, or</text>
<text class="t" x="82" y="385">from your agent over MCP</text>
<text class="c" x="82" y="409">ask_question</text>
<rect class="cardT" x="472" y="420" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="420" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="444" r="10"/>
<text class="num" x="494" y="448" text-anchor="middle">6</text>
<text class="t" x="514" y="449">Resolves terms, follows the joins,</text>
<text class="t" x="514" y="471">checks names against the catalog and</text>
<text class="t" x="514" y="493">runs the SQL</text>
<text class="comp" x="514" y="521">component: ReAct text-to-SQL agent</text>
<rect class="val" x="28" y="571" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="595">VALUE</text>
<text class="valT" x="48" y="619">You stop hand-writing schema notes into prompts: answers come back with the SQL and the</text>
<text class="valT" x="48" y="641">steps, so you can check the number against the source</text>
</svg>
