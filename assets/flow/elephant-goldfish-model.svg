<svg xmlns="http://www.w3.org/2000/svg" width="880" height="918" viewBox="0 0 880 918" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="918" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="782" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="782" rx="10"/>
<rect class="pillT" x="474" y="40" width="55.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">EGM</text>
<path class="edge" d="M62,205 L62,229" marker-end="url(#a)"/>
<path class="hand" d="M408,288.0 C439.0,288.0 439.0,312 470,312" marker-end="url(#a)"/>
<path class="hand" d="M472,336.5 C441.0,336.5 441.0,395 410,395" marker-end="url(#a)"/>
<path class="edge" d="M62,443 L62,467" marker-end="url(#a)"/>
<path class="hand" d="M408,516.5 C439.0,516.5 439.0,540 470,540" marker-end="url(#a)"/>
<path class="hand" d="M472,564.5 C441.0,564.5 441.0,614 410,614" marker-end="url(#a)"/>
<path class="hand" d="M408,626.5 C439.0,626.5 439.0,663 470,663" marker-end="url(#a)"/>
<path class="hand" d="M472,698.5 C441.0,698.5 441.0,722 410,722" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the complete Antigravity</text>
<text class="t" x="82" y="123">plugin and open a new session</text>
<text class="c" x="82" y="147">agy plugin install</text>
<text class="c" x="82" y="166">https://github.com/google/elephant-goldfis</text>
<text class="c" x="82" y="185">h-model</text>
<rect class="card" x="40" y="231" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="255" r="10"/>
<text class="num" x="62" y="259" text-anchor="middle">2</text>
<text class="t" x="82" y="260">Describe a feature with real design</text>
<text class="t" x="82" y="282">decisions</text>
<text class="c" x="82" y="306">/egm-brainstorm Add webhook delivery to</text>
<text class="c" x="82" y="325">this project.</text>
<rect class="cardT" x="472" y="288" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="288" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="312" r="10"/>
<text class="num" x="494" y="316" text-anchor="middle">3</text>
<text class="t" x="514" y="317">Challenge the idea with fresh</text>
<text class="t" x="514" y="339">reviewers and save concepts_brief.md</text>
<text class="comp" x="514" y="367">component: brainstorm + reviewer personas</text>
<rect class="card" x="40" y="371" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="371" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="395" r="10"/>
<text class="num" x="62" y="399" text-anchor="middle">4</text>
<text class="t" x="82" y="400">Choose architectural tradeoffs and</text>
<text class="t" x="82" y="422">approve the direction</text>
<rect class="card" x="40" y="469" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="469" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="493" r="10"/>
<text class="num" x="62" y="497" text-anchor="middle">5</text>
<text class="t" x="82" y="498">Start drafting and review each section</text>
<text class="t" x="82" y="520">as it is written</text>
<text class="c" x="82" y="544">/egm-draft</text>
<rect class="cardT" x="472" y="516" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="516" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="540" r="10"/>
<text class="num" x="494" y="544" text-anchor="middle">6</text>
<text class="t" x="514" y="545">Build design_draft.md from the brief</text>
<text class="t" x="514" y="567">and approved sections</text>
<text class="comp" x="514" y="595">component: draft + design template</text>
<rect class="card" x="40" y="590" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="590" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="614" r="10"/>
<text class="num" x="62" y="618" text-anchor="middle">7</text>
<text class="t" x="82" y="619">Review the actual returned draft path</text>
<text class="c" x="82" y="643">/egm-review design_draft.md</text>
<rect class="cardT" x="472" y="639" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="639" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="663" r="10"/>
<text class="num" x="494" y="667" text-anchor="middle">8</text>
<text class="t" x="514" y="668">Run five ordered review stages and</text>
<text class="t" x="514" y="690">save findings and proposed text</text>
<text class="t" x="514" y="712">repairs</text>
<text class="comp" x="514" y="740">component: review + loop + resolve</text>
<rect class="card" x="40" y="698" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="698" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="722" r="10"/>
<text class="num" x="62" y="726" text-anchor="middle">9</text>
<text class="t" x="82" y="727">Approve needed edits and the design;</text>
<text class="t" x="82" y="749">authorize implementation and real</text>
<text class="t" x="82" y="771">tests separately</text>
<rect class="val" x="28" y="824" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="848">VALUE</text>
<text class="valT" x="48" y="872">A written design and review trail that do not rely on the author&#x27;s chat history</text>
</svg>
