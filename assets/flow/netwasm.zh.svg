<svg xmlns="http://www.w3.org/2000/svg" width="880" height="794" viewBox="0 0 880 794" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="794" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="658" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="658" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">NetWasm 做的</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="edge" d="M62,288 L62,312" marker-end="url(#a)"/>
<path class="hand" d="M408,383.5 C439.0,383.5 439.0,407 470,407" marker-end="url(#a)"/>
<path class="edge" d="M494,480 L494,504" marker-end="url(#a)"/>
<path class="hand" d="M472,554.5 C441.0,554.5 441.0,578 410,578" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上 NetWasm 模板，用它建一个 C# 应用</text>
<text class="c" x="82" y="125">dotnet new install NetWasm.Templates ·</text>
<text class="c" x="82" y="144">dotnet new netwasm-app -n HelloNetWasm</text>
<text class="comp" x="82" y="167">组件：NetWasm.Templates（NuGet）</text>
<rect class="card" x="40" y="215" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">写普通的 C#，和普通控制台程序一样</text>
<text class="c" x="82" y="268">Console.WriteLine(42);</text>
<rect class="card" x="40" y="314" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">3</text>
<text class="t" x="82" y="343">restore 并发布，用的还是熟悉的 dotne</text>
<text class="t" x="82" y="365">t 命令</text>
<text class="c" x="82" y="389">dotnet restore · dotnet publish -c Release</text>
<text class="c" x="82" y="408">-o publish/local</text>
<text class="comp" x="82" y="431">组件：NetWasm.Sdk（MSBuild）</text>
<rect class="cardT" x="472" y="383" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="383" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="407" r="10"/>
<text class="num" x="494" y="411" text-anchor="middle">4</text>
<text class="t" x="514" y="412">把可达代码编成 Wasm：丢掉不可达、特化泛</text>
<text class="t" x="514" y="434">型、按需链接 GC</text>
<text class="comp" x="514" y="462">组件：NetWasm 编译器</text>
<rect class="cardT" x="472" y="506" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="506" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="530" r="10"/>
<text class="num" x="494" y="534" text-anchor="middle">5</text>
<text class="t" x="514" y="535">把结果打包成 WASI P2 组件，声明所需</text>
<text class="t" x="514" y="557">宿主能力</text>
<text class="comp" x="514" y="585">组件：组件模型层</text>
<rect class="card" x="40" y="554" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="554" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="578" r="10"/>
<text class="num" x="62" y="582" text-anchor="middle">6</text>
<text class="t" x="82" y="583">任何 WASI 宿主上直接运行，目标机器没有</text>
<text class="t" x="82" y="605">.NET</text>
<text class="c" x="82" y="629">wasmtime run</text>
<text class="c" x="82" y="648">publish/local/HelloNetWasm.wasm</text>
<rect class="val" x="28" y="700" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="724">价值</text>
<text class="valT" x="48" y="748">一个独立 .wasm 文件就是整个程序——目标机器不用装 .NET</text>
</svg>
