<svg xmlns="http://www.w3.org/2000/svg" width="880" height="685" viewBox="0 0 880 685" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="685" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="549" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="549" rx="10"/>
<rect class="pillT" x="474" y="40" width="240.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">HumanLayer Skills 给你的</text>
<path class="hand" d="M408,118.0 C439.0,118.0 439.0,142 470,142" marker-end="url(#a)"/>
<path class="hand" d="M472,155.5 C441.0,155.5 441.0,214 410,214" marker-end="url(#a)"/>
<path class="hand" d="M408,226.5 C439.0,226.5 439.0,250 470,250" marker-end="url(#a)"/>
<path class="hand" d="M472,263.5 C441.0,263.5 441.0,313 410,313" marker-end="url(#a)"/>
<path class="hand" d="M408,336.5 C439.0,336.5 439.0,360 470,360" marker-end="url(#a)"/>
<path class="hand" d="M472,372.0 C441.0,372.0 441.0,434 410,434" marker-end="url(#a)"/>
<path class="hand" d="M408,435.0 C439.0,435.0 439.0,470 470,470" marker-end="url(#a)"/>
<path class="hand" d="M472,483.5 C441.0,483.5 441.0,510 410,510" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从 skills 注册表装上这个包</text>
<text class="c" x="82" y="125">npx skills add humanlayer/skills --skill</text>
<text class="c" x="82" y="144">show-me</text>
<rect class="cardT" x="472" y="118" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="118" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="142" r="10"/>
<text class="num" x="494" y="146" text-anchor="middle">2</text>
<text class="t" x="514" y="147">用一个插件市场清单装下六个自包含 skill</text>
<text class="comp" x="514" y="175">组件：插件市场</text>
<rect class="card" x="40" y="190" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">3</text>
<text class="t" x="82" y="219">需要时手动调起，或让描述自动匹配</text>
<text class="c" x="82" y="243">/show-me · /visual-pr · /improve-claude-md</text>
<rect class="cardT" x="472" y="226" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="226" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="250" r="10"/>
<text class="num" x="494" y="254" text-anchor="middle">4</text>
<text class="t" x="514" y="255">只提供那个窄活的判断力：给方法，不给运行时</text>
<text class="comp" x="514" y="283">组件：skill</text>
<rect class="card" x="40" y="289" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="289" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="313" r="10"/>
<text class="num" x="62" y="317" text-anchor="middle">5</text>
<text class="t" x="82" y="318">要把某件事做成循环，就跑循环设计 skil</text>
<text class="t" x="82" y="340">l 并答问</text>
<text class="c" x="82" y="364">/design-control-loop</text>
<rect class="cardT" x="472" y="336" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="336" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="360" r="10"/>
<text class="num" x="494" y="364" text-anchor="middle">6</text>
<text class="t" x="514" y="365">按模板把传感、控制、执行三段建成本地</text>
<text class="t" x="514" y="387">可跑的件</text>
<rect class="card" x="40" y="410" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="410" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="434" r="10"/>
<text class="num" x="62" y="438" text-anchor="middle">7</text>
<text class="t" x="82" y="439">先手工逐段跑通，再挂上定时 workflow</text>
<rect class="cardT" x="472" y="446" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="446" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="470" r="10"/>
<text class="num" x="494" y="474" text-anchor="middle">8</text>
<text class="t" x="514" y="475">每次最多开一个 PR，并注入记忆文件</text>
<text class="comp" x="514" y="503">组件：GitHub Actions 循环</text>
<rect class="card" x="40" y="486" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="486" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="510" r="10"/>
<text class="num" x="62" y="514" text-anchor="middle">9</text>
<text class="t" x="82" y="515">用评论调参：循环改 PR，并把长期反馈留下</text>
<text class="c" x="82" y="539">/iterate</text>
<rect class="val" x="28" y="591" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="615">价值</text>
<text class="valT" x="48" y="639">厂商维护的一组 agent 行为，外加一个可定时、可用评论调参的有界循环</text>
</svg>
