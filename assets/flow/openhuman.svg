<svg xmlns="http://www.w3.org/2000/svg" width="880" height="810" viewBox="0 0 880 810" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="810" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="652" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="652" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenHuman does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,229.0 C439.0,229.0 439.0,253 470,253" marker-end="url(#a)"/>
<path class="edge" d="M494,301 L494,325" marker-end="url(#a)"/>
<path class="hand" d="M472,385.5 C441.0,385.5 441.0,409 410,409" marker-end="url(#a)"/>
<path class="hand" d="M408,410.0 C439.0,410.0 439.0,494 470,494" marker-end="url(#a)"/>
<path class="edge" d="M494,564 L494,588" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the desktop app with your</text>
<text class="t" x="82" y="123">platform&#x27;s package manager</text>
<text class="c" x="82" y="147">brew install --cask openhuman</text>
<rect class="card" x="40" y="193" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Connect the accounts whose context you</text>
<text class="t" x="82" y="244">want it to know</text>
<rect class="cardT" x="472" y="229" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="229" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="253" r="10"/>
<text class="num" x="494" y="257" text-anchor="middle">3</text>
<text class="t" x="514" y="258">One scheduler ticks every twenty</text>
<text class="t" x="514" y="280">minutes and syncs each connection</text>
<rect class="cardT" x="472" y="327" width="368" height="117" rx="8"/>
<rect class="accT" x="472" y="327" width="4" height="117" rx="2"/>
<circle class="accT" cx="494" cy="351" r="10"/>
<text class="num" x="494" y="355" text-anchor="middle">4</text>
<text class="t" x="514" y="356">Compresses what changed into scored</text>
<text class="t" x="514" y="378">Markdown trees + an Obsidian vault on</text>
<text class="t" x="514" y="400">your machine</text>
<text class="c" x="514" y="424">SQLite</text>
<rect class="card" x="40" y="385" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="385" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="409" r="10"/>
<text class="num" x="62" y="413" text-anchor="middle">5</text>
<text class="t" x="82" y="414">Ask a question about your own work</text>
<rect class="cardT" x="472" y="470" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="470" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="494" r="10"/>
<text class="num" x="494" y="498" text-anchor="middle">6</text>
<text class="t" x="514" y="499">Answers from memory it already built,</text>
<text class="t" x="514" y="521">and proposes automations you review on</text>
<text class="t" x="514" y="543">a canvas</text>
<rect class="cardT" x="472" y="590" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="590" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="614" r="10"/>
<text class="num" x="494" y="618" text-anchor="middle">7</text>
<text class="t" x="514" y="619">Fires scheduled runs behind your</text>
<text class="t" x="514" y="641">approval gate, resuming after restarts</text>
<rect class="val" x="28" y="694" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="718">VALUE</text>
<text class="valT" x="48" y="742">Your assistant starts day one with compressed context of your inbox, repos, docs and chats —</text>
<text class="valT" x="48" y="764">instead of weeks of re-briefing a cold agent</text>
</svg>
