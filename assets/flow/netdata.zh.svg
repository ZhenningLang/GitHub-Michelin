<svg xmlns="http://www.w3.org/2000/svg" width="880" height="568" viewBox="0 0 880 568" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="568" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="432" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="432" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Netdata 做的</text>
<path class="hand" d="M408,121.0 C439.0,121.0 439.0,145 470,145" marker-end="url(#a)"/>
<path class="edge" d="M494,196 L494,220" marker-end="url(#a)"/>
<path class="hand" d="M472,270.5 C441.0,270.5 441.0,294 410,294" marker-end="url(#a)"/>
<path class="hand" d="M408,306.5 C439.0,306.5 439.0,369 470,369" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">下载 kickstart.sh 并在每台机器上运行</text>
<text class="c" x="82" y="125">sh /tmp/netdata-kickstart.sh</text>
<text class="comp" x="82" y="148">组件：kickstart.sh</text>
<rect class="cardT" x="472" y="121" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="121" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="145" r="10"/>
<text class="num" x="494" y="149" text-anchor="middle">2</text>
<text class="t" x="514" y="150">识别系统、容器与在跑服务，启动每秒采集器</text>
<text class="comp" x="514" y="178">组件：内置与外部插件</text>
<rect class="cardT" x="472" y="222" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="222" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="246" r="10"/>
<text class="num" x="494" y="250" text-anchor="middle">3</text>
<text class="t" x="514" y="251">写入分层 dbengine，评估内置告警，给每个指</text>
<text class="t" x="514" y="273">标打异常分</text>
<text class="comp" x="514" y="301">组件：netdata 守护进程</text>
<rect class="card" x="40" y="270" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="270" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="294" r="10"/>
<text class="num" x="62" y="298" text-anchor="middle">4</text>
<text class="t" x="82" y="299">打开该节点 19999 端口的看板</text>
<text class="c" x="82" y="323">http://localhost:19999</text>
<rect class="cardT" x="472" y="345" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="345" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="369" r="10"/>
<text class="num" x="494" y="373" text-anchor="middle">5</text>
<text class="t" x="514" y="374">给出自动生成的图表与异常率，不用写查</text>
<text class="t" x="514" y="396">询或搭看板</text>
<text class="comp" x="514" y="424">组件：NCUL1 看板</text>
<rect class="val" x="28" y="474" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="498">价值</text>
<text class="valT" x="48" y="522">不写 exporter、查询和看板，就能拿到一台机器的每秒图表、内置告警和异常标记</text>
</svg>
