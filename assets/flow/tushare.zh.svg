<svg xmlns="http://www.w3.org/2000/svg" width="880" height="752" viewBox="0 0 880 752" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="752" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="616" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="616" rx="10"/>
<rect class="pillT" x="474" y="40" width="216.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">tushare.pro 服务端做的</text>
<path class="edge" d="M62,147 L62,171" marker-end="url(#a)"/>
<path class="edge" d="M62,312 L62,336" marker-end="url(#a)"/>
<path class="hand" d="M408,406.0 C439.0,406.0 439.0,430 470,430" marker-end="url(#a)"/>
<path class="edge" d="M494,503 L494,527" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 tushare.pro 注册，从个人中心复制 token</text>
<text class="comp" x="82" y="129">组件：tushare.pro 账号</text>
<rect class="card" x="40" y="173" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="173" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="197" r="10"/>
<text class="num" x="62" y="201" text-anchor="middle">2</text>
<text class="t" x="82" y="202">安装 SDK，把 token 存一次，初始化 Pr</text>
<text class="t" x="82" y="224">o 接口</text>
<text class="c" x="82" y="248">ts.set_token(&#x27;your token here&#x27;) · pro =</text>
<text class="c" x="82" y="267">ts.pro_api()</text>
<text class="comp" x="82" y="290">组件：PyPI SDK</text>
<rect class="card" x="40" y="338" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="338" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="362" r="10"/>
<text class="num" x="62" y="366" text-anchor="middle">3</text>
<text class="t" x="82" y="367">按名调用接口，带上时间窗</text>
<text class="c" x="82" y="391">pro.trade_cal(exchange=&#x27;&#x27;,</text>
<text class="c" x="82" y="410">start_date=&#x27;20180901&#x27;,</text>
<text class="c" x="82" y="429">end_date=&#x27;20181001&#x27;)</text>
<text class="comp" x="82" y="452">组件：PyPI SDK</text>
<rect class="cardT" x="472" y="406" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="406" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="430" r="10"/>
<text class="num" x="494" y="434" text-anchor="middle">4</text>
<text class="t" x="514" y="435">校验 token，按积分档执行频次与行数上</text>
<text class="t" x="514" y="457">限，跑查询</text>
<text class="comp" x="514" y="485">组件：api.tushare.pro</text>
<rect class="cardT" x="472" y="529" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="529" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="553" r="10"/>
<text class="num" x="494" y="557" text-anchor="middle">5</text>
<text class="t" x="514" y="558">返回有文档字段的 DataFrame；2002 即</text>
<text class="t" x="514" y="580">积分档不够</text>
<text class="comp" x="514" y="608">组件：api.tushare.pro</text>
<rect class="val" x="28" y="658" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="682">价值</text>
<text class="valT" x="48" y="706">不用再解析网页、追着无预告的字段变更跑——代价模型是积分与单独授权，而不是支持工单</text>
</svg>
