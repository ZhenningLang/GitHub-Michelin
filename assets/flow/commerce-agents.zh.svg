<svg xmlns="http://www.w3.org/2000/svg" width="880" height="818" viewBox="0 0 880 818" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="818" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="682" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="682" rx="10"/>
<rect class="pillT" x="474" y="40" width="152.8" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">这份参考实现做的</text>
<path class="edge" d="M62,162 L62,186" marker-end="url(#a)"/>
<path class="edge" d="M62,278 L62,302" marker-end="url(#a)"/>
<path class="edge" d="M62,416 L62,440" marker-end="url(#a)"/>
<path class="hand" d="M408,487.0 C439.0,487.0 439.0,511 470,511" marker-end="url(#a)"/>
<path class="edge" d="M494,576 L494,600" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">搭建</text>
<text class="t" x="82" y="118">从仓库装上这七个包</text>
<text class="c" x="82" y="142">pip install -r requirements.txt</text>
<rect class="card" x="40" y="188" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="188" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="212" r="10"/>
<text class="num" x="62" y="216" text-anchor="middle">2</text>
<text class="ph" x="82" y="217">搭建</text>
<text class="t" x="82" y="234">用你的目录、购物车、订单实现角色接口</text>
<text class="c" x="82" y="258">StorefrontBackend</text>
<rect class="card" x="40" y="304" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="304" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="328" r="10"/>
<text class="num" x="62" y="332" text-anchor="middle">3</text>
<text class="ph" x="82" y="333">搭建</text>
<text class="t" x="82" y="350">用你的 backend 和自带 skill 流程构造</text>
<text class="t" x="82" y="372">agent</text>
<text class="c" x="82" y="396">ShoppingAgent(backend=…, skills_dir=…)</text>
<rect class="card" x="40" y="442" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="442" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="466" r="10"/>
<text class="num" x="62" y="470" text-anchor="middle">4</text>
<text class="ph" x="82" y="471">搭建</text>
<text class="t" x="82" y="488">在你的应用里暴露两个路由</text>
<text class="c" x="82" y="512">POST /api/session · POST /api/chat</text>
<rect class="cardT" x="472" y="487" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="487" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="511" r="10"/>
<text class="num" x="494" y="515" text-anchor="middle">5</text>
<text class="ph" x="514" y="516">每轮运行</text>
<text class="t" x="514" y="533">跑 turn loop：工具分发、来源闸门校验、卡片</text>
<text class="t" x="514" y="555">值由你的记录回填</text>
<rect class="cardT" x="472" y="602" width="368" height="90" rx="8"/>
<rect class="accT" x="472" y="602" width="4" height="90" rx="2"/>
<circle class="accT" cx="494" cy="626" r="10"/>
<text class="num" x="494" y="630" text-anchor="middle">6</text>
<text class="ph" x="514" y="631">每轮运行</text>
<text class="t" x="514" y="648">把这一轮以事件流回吐给你的 UI 渲染</text>
<text class="c" x="514" y="672">ui · cart_update · turn_complete</text>
<rect class="val" x="28" y="724" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="748">价值</text>
<text class="valT" x="48" y="772">你只搭一次；之后每一轮对话都白拿 prompt、护栏、UI 回填和 turn loop</text>
</svg>
