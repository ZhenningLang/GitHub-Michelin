<svg xmlns="http://www.w3.org/2000/svg" width="880" height="743" viewBox="0 0 880 743" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="743" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="607" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="607" rx="10"/>
<rect class="pillT" x="474" y="40" width="152.8" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">这份参考实现做的</text>
<path class="hand" d="M408,118.0 C439.0,118.0 439.0,142 470,142" marker-end="url(#a)"/>
<path class="hand" d="M472,143.0 C441.0,143.0 441.0,214 410,214" marker-end="url(#a)"/>
<path class="edge" d="M62,263 L62,287" marker-end="url(#a)"/>
<path class="edge" d="M62,384 L62,408" marker-end="url(#a)"/>
<path class="hand" d="M408,446.5 C439.0,446.5 439.0,470 470,470" marker-end="url(#a)"/>
<path class="edge" d="M494,518 L494,542" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从仓库装上这七个包，跑一遍内置的零售样例</text>
<text class="c" x="82" y="125">pip install -r requirements.txt · python</text>
<text class="c" x="82" y="144">scripts/run_demo.py retail</text>
<rect class="cardT" x="472" y="118" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="118" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="142" r="10"/>
<text class="num" x="494" y="146" text-anchor="middle">2</text>
<text class="t" x="514" y="147">用 mock 后端起 API、店铺与商家后台</text>
<rect class="card" x="40" y="190" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">3</text>
<text class="t" x="82" y="219">用你的目录、购物车、订单实现角色接口</text>
<text class="c" x="82" y="243">StorefrontBackend</text>
<rect class="card" x="40" y="289" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="289" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="313" r="10"/>
<text class="num" x="62" y="317" text-anchor="middle">4</text>
<text class="t" x="82" y="318">用你的 backend 和自带 skill 流程构造</text>
<text class="t" x="82" y="340">agent</text>
<text class="c" x="82" y="364">ShoppingAgent(backend=…, skills_dir=…)</text>
<rect class="card" x="40" y="410" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="410" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="434" r="10"/>
<text class="num" x="62" y="438" text-anchor="middle">5</text>
<text class="t" x="82" y="439">在你的应用里暴露两个路由</text>
<text class="c" x="82" y="463">POST /api/session · POST /api/chat</text>
<rect class="cardT" x="472" y="446" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="446" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="470" r="10"/>
<text class="num" x="494" y="474" text-anchor="middle">6</text>
<text class="t" x="514" y="475">跑 turn loop：工具分发、来源闸门校验、卡片</text>
<text class="t" x="514" y="497">值由你的记录回填</text>
<rect class="cardT" x="472" y="544" width="368" height="73" rx="8"/>
<rect class="accT" x="472" y="544" width="4" height="73" rx="2"/>
<circle class="accT" cx="494" cy="568" r="10"/>
<text class="num" x="494" y="572" text-anchor="middle">7</text>
<text class="t" x="514" y="573">把这一轮以事件流回吐给你的 UI 渲染</text>
<text class="c" x="514" y="597">ui · cart_update · turn_complete</text>
<rect class="val" x="28" y="649" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="673">价值</text>
<text class="valT" x="48" y="697">你得到一个能跑的商业 agent——prompt、护栏、UI 回填和 turn loop 都现成——接在你自己的系统上</text>
</svg>
