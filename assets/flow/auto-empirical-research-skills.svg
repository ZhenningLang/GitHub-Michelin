<svg xmlns="http://www.w3.org/2000/svg" width="880" height="638" viewBox="0 0 880 638" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="638" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="502" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="502" rx="10"/>
<rect class="pillT" x="474" y="40" width="110.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">AERS does</text>
<path class="hand" d="M408,151.0 C439.0,151.0 439.0,175 470,175" marker-end="url(#a)"/>
<path class="hand" d="M472,199.5 C441.0,199.5 441.0,280 410,280" marker-end="url(#a)"/>
<path class="hand" d="M408,292.0 C439.0,292.0 439.0,316 470,316" marker-end="url(#a)"/>
<path class="hand" d="M472,340.5 C441.0,340.5 441.0,378 410,378" marker-end="url(#a)"/>
<path class="hand" d="M408,390.0 C439.0,390.0 439.0,439 470,439" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="158" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="158" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install one first-party plugin from</text>
<text class="t" x="82" y="123">the marketplace</text>
<text class="c" x="82" y="147">/plugin install</text>
<text class="c" x="82" y="166">empirical-analysis-python@auto-empirical-r</text>
<text class="c" x="82" y="185">esearch-skills</text>
<text class="comp" x="82" y="208">component: Claude Code marketplace</text>
<rect class="cardT" x="472" y="151" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="151" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="175" r="10"/>
<text class="num" x="494" y="179" text-anchor="middle">2</text>
<text class="t" x="514" y="180">Registers that plugin&#x27;s SKILL.md</text>
<text class="t" x="514" y="202">descriptions for this session</text>
<text class="comp" x="514" y="230">component: plugin</text>
<rect class="card" x="40" y="256" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="256" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="280" r="10"/>
<text class="num" x="62" y="284" text-anchor="middle">3</text>
<text class="t" x="82" y="285">Ask for the empirical task in natural</text>
<text class="t" x="82" y="307">language</text>
<rect class="cardT" x="472" y="292" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="292" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="316" r="10"/>
<text class="num" x="494" y="320" text-anchor="middle">4</text>
<text class="t" x="514" y="321">Matches the description and loads one</text>
<text class="t" x="514" y="343">child skill</text>
<text class="comp" x="514" y="371">component: SKILL.md</text>
<rect class="card" x="40" y="354" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="354" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="378" r="10"/>
<text class="num" x="62" y="382" text-anchor="middle">5</text>
<text class="t" x="82" y="383">Point it at your data and confirm the</text>
<text class="t" x="82" y="405">identification strategy</text>
<rect class="cardT" x="472" y="415" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="415" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="439" r="10"/>
<text class="num" x="494" y="443" text-anchor="middle">6</text>
<text class="t" x="514" y="444">Runs estimation, robustness, and</text>
<text class="t" x="514" y="466">journal tables, then stops for you</text>
<text class="comp" x="514" y="494">component: analysis pipeline</text>
<rect class="val" x="28" y="544" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="568">VALUE</text>
<text class="valT" x="48" y="592">A method-specific empirical run without loading 1,096 skills or writing the pipeline yourself</text>
</svg>
