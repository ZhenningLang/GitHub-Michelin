<svg xmlns="http://www.w3.org/2000/svg" width="880" height="854" viewBox="0 0 880 854" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="854" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="696" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="696" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Dagster does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,329 L62,353" marker-end="url(#a)"/>
<path class="hand" d="M408,391.5 C439.0,391.5 439.0,415 470,415" marker-end="url(#a)"/>
<path class="edge" d="M494,488 L494,512" marker-end="url(#a)"/>
<path class="edge" d="M494,608 L494,632" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Scaffold a Dagster project and install</text>
<text class="t" x="82" y="123">it</text>
<text class="c" x="82" y="147">uvx create-dagster@latest project</text>
<text class="c" x="82" y="166">dagster-quickstart</text>
<rect class="card" x="40" y="212" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Write each table or model as a</text>
<text class="t" x="82" y="263">decorated function; its parameters</text>
<text class="t" x="82" y="285">name its inputs</text>
<text class="c" x="82" y="309">@dg.asset</text>
<rect class="card" x="40" y="355" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="355" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="379" r="10"/>
<text class="num" x="62" y="383" text-anchor="middle">3</text>
<text class="t" x="82" y="384">Start Dagster locally</text>
<text class="c" x="82" y="408">dg dev</text>
<rect class="cardT" x="472" y="391" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="391" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="415" r="10"/>
<text class="num" x="494" y="419" text-anchor="middle">4</text>
<text class="t" x="514" y="420">Builds the asset dependency graph and</text>
<text class="t" x="514" y="442">shows its lineage in the UI</text>
<text class="comp" x="514" y="470">component: webserver UI (localhost:3000)</text>
<rect class="cardT" x="472" y="514" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="514" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="538" r="10"/>
<text class="num" x="494" y="542" text-anchor="middle">5</text>
<text class="t" x="514" y="543">On Materialize or a schedule, runs</text>
<text class="t" x="514" y="565">assets in dependency order and stores</text>
<text class="t" x="514" y="587">outputs</text>
<rect class="cardT" x="472" y="634" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="634" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="658" r="10"/>
<text class="num" x="494" y="662" text-anchor="middle">6</text>
<text class="t" x="514" y="663">Records each materialization with</text>
<text class="t" x="514" y="685">metadata, so stale assets are visible</text>
<rect class="val" x="28" y="738" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="762">VALUE</text>
<text class="valT" x="48" y="786">You can answer which data is stale, what built it and what depends on it, instead of grepping</text>
<text class="valT" x="48" y="808">cron logs</text>
</svg>
