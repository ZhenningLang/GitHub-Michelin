<svg xmlns="http://www.w3.org/2000/svg" width="880" height="656" viewBox="0 0 880 656" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="656" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="520" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="520" rx="10"/>
<rect class="pillT" x="474" y="40" width="96.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">SIE 做的</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="hand" d="M408,306.5 C439.0,306.5 439.0,330 470,330" marker-end="url(#a)"/>
<path class="edge" d="M494,378 L494,402" marker-end="url(#a)"/>
<path class="edge" d="M494,454 L494,478" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">起一个 SIE 服务（或按显卡和模型包选</text>
<text class="t" x="82" y="123">对应镜像）</text>
<text class="c" x="82" y="147">pip install &quot;sie-server[local]&quot; &amp;&amp;</text>
<text class="c" x="82" y="166">sie-server serve</text>
<text class="comp" x="82" y="189">组件：sie-server</text>
<rect class="card" x="40" y="237" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">每次调用写上目录里的模型名：做向量、</text>
<text class="t" x="82" y="288">重排或抽取</text>
<text class="c" x="82" y="312">client.encode · client.score ·</text>
<text class="c" x="82" y="331">client.extract</text>
<text class="comp" x="82" y="354">组件：sie-sdk（Python／TypeScript）</text>
<rect class="cardT" x="472" y="306" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="306" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="330" r="10"/>
<text class="num" x="494" y="334" text-anchor="middle">3</text>
<text class="t" x="514" y="335">某个模型第一次被调用时，从 Hugging Face </text>
<text class="t" x="514" y="357">下权重并加载</text>
<rect class="cardT" x="472" y="404" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="404" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="428" r="10"/>
<text class="num" x="494" y="432" text-anchor="middle">4</text>
<text class="t" x="514" y="433">按 token 数把并发请求拼成批，送上 GPU 跑</text>
<rect class="cardT" x="472" y="480" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="480" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="504" r="10"/>
<text class="num" x="494" y="508" text-anchor="middle">5</text>
<text class="t" x="514" y="509">多个模型同时常驻，显存不够时踢掉最久没用的</text>
<rect class="val" x="28" y="562" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="586">价值</text>
<text class="valT" x="48" y="610">一条 agent 流水线要用的小模型都在同一个 API 后面，不用给向量、重排、OCR、审核模型各起一个服务</text>
</svg>
