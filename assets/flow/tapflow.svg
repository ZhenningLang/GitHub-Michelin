<svg xmlns="http://www.w3.org/2000/svg" width="880" height="797" viewBox="0 0 880 797" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="797" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="639" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="639" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">tapflow does</text>
<path class="edge" d="M62,214 L62,238" marker-end="url(#a)"/>
<path class="hand" d="M408,287.5 C439.0,287.5 439.0,311 470,311" marker-end="url(#a)"/>
<path class="hand" d="M472,346.5 C441.0,346.5 441.0,385 410,385" marker-end="url(#a)"/>
<path class="hand" d="M408,397.0 C439.0,397.0 439.0,456 470,456" marker-end="url(#a)"/>
<path class="hand" d="M472,491.5 C441.0,491.5 441.0,515 410,515" marker-end="url(#a)"/>
<path class="hand" d="M408,538.0 C439.0,538.0 439.0,601 470,601" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="142" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="142" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the CLI on an Apple-Silicon</text>
<text class="t" x="82" y="123">Mac and let it fetch Xcode/SDK</text>
<text class="t" x="82" y="145">prerequisites</text>
<text class="c" x="82" y="169">npm install -g tapflow · tapflow setup</text>
<text class="comp" x="82" y="192">component: tapflow CLI</text>
<rect class="card" x="40" y="240" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="240" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="264" r="10"/>
<text class="num" x="62" y="268" text-anchor="middle">2</text>
<text class="t" x="82" y="269">Start the relay and the agent together</text>
<text class="t" x="82" y="291">on that Mac</text>
<text class="c" x="82" y="315">tapflow start</text>
<rect class="cardT" x="472" y="287" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="287" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="311" r="10"/>
<text class="num" x="494" y="315" text-anchor="middle">3</text>
<text class="t" x="514" y="316">Serve the dashboard on port 4000; the</text>
<text class="t" x="514" y="338">agent dials out and registers every</text>
<text class="t" x="514" y="360">simulator and emulator</text>
<text class="comp" x="514" y="388">component: relay + macOS agent</text>
<rect class="card" x="40" y="361" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="361" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="385" r="10"/>
<text class="num" x="62" y="389" text-anchor="middle">4</text>
<text class="t" x="82" y="390">Create the admin, upload a .app.zip or</text>
<text class="t" x="82" y="412">.apk in App Center, press Start QA</text>
<rect class="cardT" x="472" y="432" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="432" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="456" r="10"/>
<text class="num" x="494" y="460" text-anchor="middle">5</text>
<text class="t" x="514" y="461">Boot the picked device on demand,</text>
<text class="t" x="514" y="483">install the build, stream H.264 to the</text>
<text class="t" x="514" y="505">browser</text>
<text class="comp" x="514" y="533">component: touch / capture helpers</text>
<rect class="card" x="40" y="491" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="491" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="515" r="10"/>
<text class="num" x="62" y="519" text-anchor="middle">6</text>
<text class="t" x="82" y="520">Send an invite link; the teammate</text>
<text class="t" x="82" y="542">clicks and drags on the screen in any</text>
<text class="t" x="82" y="564">browser</text>
<rect class="cardT" x="472" y="577" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="577" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="601" r="10"/>
<text class="num" x="494" y="605" text-anchor="middle">7</text>
<text class="t" x="514" y="606">Forward each click and drag to the</text>
<text class="t" x="514" y="628">simulator as a real tap or swipe</text>
<rect class="val" x="28" y="681" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="705">VALUE</text>
<text class="valT" x="48" y="729">PMs, designers and backend devs test the latest build from a browser — no Xcode on their</text>
<text class="valT" x="48" y="751">laptop, no build uploaded to a third-party device cloud.</text>
</svg>
