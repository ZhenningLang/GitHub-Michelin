<svg xmlns="http://www.w3.org/2000/svg" width="880" height="793" viewBox="0 0 880 793" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="793" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="635" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="635" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Selenium does</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="hand" d="M408,265.5 C439.0,265.5 439.0,289 470,289" marker-end="url(#a)"/>
<path class="hand" d="M472,313.5 C441.0,313.5 441.0,363 410,363" marker-end="url(#a)"/>
<path class="edge" d="M62,453 L62,477" marker-end="url(#a)"/>
<path class="hand" d="M408,526.5 C439.0,526.5 439.0,550 470,550" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add one language binding to your test</text>
<text class="t" x="82" y="123">project</text>
<text class="c" x="82" y="147">pip install selenium</text>
<text class="comp" x="82" y="170">component: language bindings</text>
<rect class="card" x="40" y="218" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">Open a session on the browser you</text>
<text class="t" x="82" y="269">target</text>
<text class="c" x="82" y="293">driver = webdriver.Chrome()</text>
<rect class="cardT" x="472" y="265" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="265" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="289" r="10"/>
<text class="num" x="494" y="293" text-anchor="middle">3</text>
<text class="t" x="514" y="294">Resolves, downloads and launches the</text>
<text class="t" x="514" y="316">matching driver for that browser</text>
<text class="comp" x="514" y="344">component: Selenium Manager</text>
<rect class="card" x="40" y="339" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="339" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="363" r="10"/>
<text class="num" x="62" y="367" text-anchor="middle">4</text>
<text class="t" x="82" y="368">Drive the page like a user: navigate,</text>
<text class="t" x="82" y="390">find elements, type, click</text>
<text class="c" x="82" y="414">driver.get(&quot;https://www.selenium.dev/selen</text>
<text class="c" x="82" y="433">ium/web/web-form.html&quot;)</text>
<rect class="card" x="40" y="479" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="479" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="503" r="10"/>
<text class="num" x="62" y="507" text-anchor="middle">5</text>
<text class="t" x="82" y="508">Set your own waits — the calls return</text>
<text class="t" x="82" y="530">immediately</text>
<text class="c" x="82" y="554">driver.implicitly_wait(0.5)</text>
<rect class="cardT" x="472" y="526" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="526" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="550" r="10"/>
<text class="num" x="494" y="554" text-anchor="middle">6</text>
<text class="t" x="514" y="555">Every command lands as a native event;</text>
<text class="t" x="514" y="577">one code runs on Chrome, Firefox,</text>
<text class="t" x="514" y="599">Edge, Safari</text>
<text class="comp" x="514" y="627">component: W3C WebDriver</text>
<rect class="val" x="28" y="677" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="701">VALUE</text>
<text class="valT" x="48" y="725">One automation API drives real Chrome, Firefox, Edge and Safari — the W3C-standard way to do</text>
<text class="valT" x="48" y="747">cross-browser E2E</text>
</svg>
