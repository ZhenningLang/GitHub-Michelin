<svg xmlns="http://www.w3.org/2000/svg" width="880" height="984" viewBox="0 0 880 984" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="984" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="826" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="826" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">InferenceX does</text>
<path class="edge" d="M62,233 L62,257" marker-end="url(#a)"/>
<path class="edge" d="M62,379 L62,403" marker-end="url(#a)"/>
<path class="hand" d="M408,452.5 C439.0,452.5 439.0,476 470,476" marker-end="url(#a)"/>
<path class="edge" d="M494,549 L494,573" marker-end="url(#a)"/>
<path class="edge" d="M494,713 L494,737" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="161" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="161" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add a recipe entry: model, pinned</text>
<text class="t" x="82" y="123">engine image, framework, GPU runner,</text>
<text class="t" x="82" y="145">search space</text>
<text class="c" x="82" y="169">configs/nvidia-master.yaml ·</text>
<text class="c" x="82" y="188">configs/amd-master.yaml</text>
<text class="comp" x="82" y="211">component: master config</text>
<rect class="card" x="40" y="259" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="259" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="283" r="10"/>
<text class="num" x="62" y="287" text-anchor="middle">2</text>
<text class="t" x="82" y="288">Append one entry at the very end of</text>
<text class="t" x="82" y="310">the changelog naming that config key</text>
<text class="c" x="82" y="334">perf-changelog.yaml</text>
<text class="comp" x="82" y="357">component: perf changelog (append-only)</text>
<rect class="card" x="40" y="405" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="405" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="429" r="10"/>
<text class="num" x="62" y="433" text-anchor="middle">3</text>
<text class="t" x="82" y="434">Open a PR and label it to run the full</text>
<text class="t" x="82" y="456">sweep</text>
<text class="c" x="82" y="480">full-sweep-fail-fast</text>
<rect class="cardT" x="472" y="452" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="452" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="476" r="10"/>
<text class="num" x="494" y="480" text-anchor="middle">4</text>
<text class="t" x="514" y="481">Expands the new keys into a job matrix</text>
<text class="t" x="514" y="503">of parallelism × concurrency points</text>
<text class="comp" x="514" y="531">component: infx.matrix planner</text>
<rect class="cardT" x="472" y="575" width="368" height="138" rx="8"/>
<rect class="accT" x="472" y="575" width="4" height="138" rx="2"/>
<circle class="accT" cx="494" cy="599" r="10"/>
<text class="num" x="494" y="603" text-anchor="middle">5</text>
<text class="t" x="514" y="604">Runs each point on its self-hosted</text>
<text class="t" x="514" y="626">Slurm GPU clusters: serve, load-test,</text>
<text class="t" x="514" y="648">eval</text>
<text class="comp" x="514" y="676">component: infx.launch + self-hosted</text>
<text class="comp" x="514" y="695">runners</text>
<rect class="cardT" x="472" y="739" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="739" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="763" r="10"/>
<text class="num" x="494" y="767" text-anchor="middle">6</text>
<text class="t" x="514" y="768">After merge, ingests that sweep&#x27;s</text>
<text class="t" x="514" y="790">artifacts into the public dashboard</text>
<text class="comp" x="514" y="818">component: merge-ingest → InferenceX-app</text>
<rect class="val" x="28" y="868" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="892">VALUE</text>
<text class="valT" x="48" y="916">Your engine + GPU recipe gets a throughput-vs-latency curve on hardware you don&#x27;t own,</text>
<text class="valT" x="48" y="938">re-measured as images move — not a one-off blog number</text>
</svg>
