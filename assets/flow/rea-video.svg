<svg xmlns="http://www.w3.org/2000/svg" width="880" height="733" viewBox="0 0 880 733" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="733" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="575" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="575" rx="10"/>
<rect class="pillT" x="474" y="40" width="248.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">rea-video + its skill do</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="edge" d="M494,252 L494,276" marker-end="url(#a)"/>
<path class="hand" d="M472,358.5 C441.0,358.5 441.0,382 410,382" marker-end="url(#a)"/>
<path class="hand" d="M408,405.5 C439.0,405.5 439.0,489 470,489" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Have your agent install the CLI and</text>
<text class="t" x="82" y="123">skill, then hand it a reference video</text>
<text class="c" x="82" y="147">bash scripts/install_skill.sh</text>
<text class="comp" x="82" y="170">component: install_skill.sh + skill</text>
<rect class="cardT" x="472" y="132" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">Split shots, separate voice, music and</text>
<text class="t" x="514" y="183">effects, and measure each shot</text>
<text class="c" x="514" y="207">rea-video decompose ref.mp4 -o out/ref</text>
<text class="comp" x="514" y="230">component: decompose CLI</text>
<rect class="cardT" x="472" y="278" width="368" height="161" rx="8"/>
<rect class="accT" x="472" y="278" width="4" height="161" rx="2"/>
<circle class="accT" cx="494" cy="302" r="10"/>
<text class="num" x="494" y="306" text-anchor="middle">3</text>
<text class="t" x="514" y="307">The agent looks at low-confidence</text>
<text class="t" x="514" y="329">shots and merges its answers into the</text>
<text class="t" x="514" y="351">verdict</text>
<text class="c" x="514" y="375">rea-video review out/ref · rea-video</text>
<text class="c" x="514" y="394">apply-review out/ref</text>
<text class="comp" x="514" y="417">component: review / apply-review</text>
<rect class="card" x="40" y="358" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="358" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="382" r="10"/>
<text class="num" x="62" y="386" text-anchor="middle">4</text>
<text class="t" x="82" y="387">Read report.html, then name the target</text>
<text class="t" x="82" y="409">model and what to swap</text>
<text class="c" x="82" y="433">out/ref/remake/intent.yaml</text>
<rect class="cardT" x="472" y="465" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="465" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="489" r="10"/>
<text class="num" x="494" y="493" text-anchor="middle">5</text>
<text class="t" x="514" y="494">Pack generated shots into the fewest</text>
<text class="t" x="514" y="516">model calls and check the plan</text>
<text class="c" x="514" y="540">rea-video plan out/ref</text>
<text class="comp" x="514" y="563">component: capability map</text>
<rect class="val" x="28" y="617" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="641">VALUE</text>
<text class="valT" x="48" y="665">A per-shot verdict on how the video was made and a remake plan, without scrubbing frames by</text>
<text class="valT" x="48" y="687">hand</text>
</svg>
