<svg xmlns="http://www.w3.org/2000/svg" width="880" height="860" viewBox="0 0 880 860" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="860" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="702" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="702" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">graphify does</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,266 L62,290" marker-end="url(#a)"/>
<path class="hand" d="M408,328.5 C439.0,328.5 439.0,352 470,352" marker-end="url(#a)"/>
<path class="edge" d="M494,447 L494,471" marker-end="url(#a)"/>
<path class="hand" d="M472,532.5 C441.0,532.5 441.0,556 410,556" marker-end="url(#a)"/>
<path class="hand" d="M408,579.5 C439.0,579.5 439.0,642 470,642" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the CLI</text>
<text class="c" x="82" y="125">uv tool install graphifyy</text>
<rect class="card" x="40" y="171" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">Register the /graphify skill with your</text>
<text class="t" x="82" y="222">AI assistant</text>
<text class="c" x="82" y="246">graphify install</text>
<rect class="card" x="40" y="292" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">3</text>
<text class="t" x="82" y="321">In the assistant, point it at a folder</text>
<text class="c" x="82" y="345">/graphify .</text>
<rect class="cardT" x="472" y="328" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="328" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="352" r="10"/>
<text class="num" x="494" y="356" text-anchor="middle">4</text>
<text class="t" x="514" y="357">Parses code locally with tree-sitter</text>
<text class="t" x="514" y="379">ASTs; docs, PDFs and images go through</text>
<text class="t" x="514" y="401">your model for semantic nodes</text>
<text class="comp" x="514" y="429">component: Local AST + semantic pass</text>
<rect class="cardT" x="472" y="473" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="473" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="497" r="10"/>
<text class="num" x="494" y="501" text-anchor="middle">5</text>
<text class="t" x="514" y="502">Clusters with Leiden and writes</text>
<text class="t" x="514" y="524">graph.json, an interactive graph.html,</text>
<text class="t" x="514" y="546">and GRAPH_REPORT.md</text>
<text class="comp" x="514" y="574">component: graphify-out/</text>
<rect class="card" x="40" y="532" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="532" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="556" r="10"/>
<text class="num" x="62" y="560" text-anchor="middle">6</text>
<text class="t" x="82" y="561">Ask structure questions instead of</text>
<text class="t" x="82" y="583">re-reading files</text>
<text class="c" x="82" y="607">graphify query &quot;&lt;question&gt;&quot;</text>
<rect class="cardT" x="472" y="618" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="618" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="642" r="10"/>
<text class="num" x="494" y="646" text-anchor="middle">7</text>
<text class="t" x="514" y="647">Returns a scoped subgraph where every</text>
<text class="t" x="514" y="669">edge carries an EXTRACTED or INFERRED</text>
<text class="t" x="514" y="691">confidence tag</text>
<rect class="val" x="28" y="744" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="768">VALUE</text>
<text class="valT" x="48" y="792">An agent answers &quot;what calls this handler&quot; from a portable graph, not by burning context on</text>
<text class="valT" x="48" y="814">file dumps</text>
</svg>
