<svg xmlns="http://www.w3.org/2000/svg" width="880" height="659" viewBox="0 0 880 659" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="659" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="501" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="501" rx="10"/>
<rect class="pillT" x="474" y="40" width="202.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">diagram-design does</text>
<path class="hand" d="M408,126.5 C439.0,126.5 439.0,150 470,150" marker-end="url(#a)"/>
<path class="hand" d="M472,181.5 C441.0,181.5 441.0,231 410,231" marker-end="url(#a)"/>
<path class="hand" d="M408,261.5 C439.0,261.5 439.0,287 470,287" marker-end="url(#a)"/>
<path class="hand" d="M472,318.5 C441.0,318.5 441.0,366 410,366" marker-end="url(#a)"/>
<path class="hand" d="M408,387.0 C439.0,387.0 439.0,424 470,424" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Once per brand</text>
<text class="t" x="82" y="118">Install the skill into your agent</text>
<text class="c" x="82" y="142">npx skills add</text>
<text class="c" x="82" y="161">cathrynlavery/diagram-design</text>
<rect class="cardT" x="472" y="126" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="126" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="150" r="10"/>
<text class="num" x="494" y="154" text-anchor="middle">2</text>
<text class="ph" x="514" y="155">Once per brand</text>
<text class="t" x="514" y="172">On the first diagram in a project,</text>
<text class="t" x="514" y="194">sees the style guide is still default</text>
<text class="t" x="514" y="216">and stops to ask</text>
<rect class="card" x="40" y="207" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="207" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="231" r="10"/>
<text class="num" x="62" y="235" text-anchor="middle">3</text>
<text class="ph" x="82" y="236">Once per brand</text>
<text class="t" x="82" y="253">Point it at your site</text>
<text class="c" x="82" y="277">onboard diagram-design to</text>
<text class="c" x="82" y="296">https://yoursite.com</text>
<rect class="cardT" x="472" y="263" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="263" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="287" r="10"/>
<text class="num" x="494" y="291" text-anchor="middle">4</text>
<text class="ph" x="514" y="292">Once per brand</text>
<text class="t" x="514" y="309">Extracts palette and fonts, shows a</text>
<text class="t" x="514" y="331">diff, writes the tokens into its style</text>
<text class="t" x="514" y="353">guide</text>
<rect class="card" x="40" y="342" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="342" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="366" r="10"/>
<text class="num" x="62" y="370" text-anchor="middle">5</text>
<text class="ph" x="82" y="371">Every diagram</text>
<text class="t" x="82" y="388">Ask for a diagram in plain words</text>
<text class="c" x="82" y="412">Make me an architecture diagram of my app</text>
<rect class="cardT" x="472" y="400" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="400" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="424" r="10"/>
<text class="num" x="494" y="428" text-anchor="middle">6</text>
<text class="ph" x="514" y="429">Every diagram</text>
<text class="t" x="514" y="446">States type, size and cuts, then</text>
<text class="t" x="514" y="468">writes one self-contained HTML file</text>
<text class="t" x="514" y="490">with inline SVG in your brand</text>
<rect class="val" x="28" y="543" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="567">VALUE</text>
<text class="valT" x="48" y="591">A publishable diagram that matches your site, without a Figma session or the generic</text>
<text class="valT" x="48" y="613">rounded-box look</text>
</svg>
