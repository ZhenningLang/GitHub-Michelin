<svg xmlns="http://www.w3.org/2000/svg" width="880" height="637" viewBox="0 0 880 637" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="637" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="501" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="501" rx="10"/>
<rect class="pillT" x="474" y="40" width="215.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">TanStack Persist 做的</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="hand" d="M408,254.5 C439.0,254.5 439.0,278 470,278" marker-end="url(#a)"/>
<path class="hand" d="M472,290.0 C441.0,290.0 441.0,363 410,363" marker-end="url(#a)"/>
<path class="hand" d="M408,385.0 C439.0,385.0 439.0,409 470,409" marker-end="url(#a)"/>
<path class="edge" d="M494,435 L494,459" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">以源码方式引入——还没有发布到 npm</text>
<text class="c" x="82" y="125">@tanstack/react-persist</text>
<text class="comp" x="82" y="148">组件：React 适配包</text>
<rect class="card" x="40" y="196" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">用存储键加初始值创建要持久化的状态</text>
<text class="c" x="82" y="249">useLocalStorageState(&#x27;todos-list&#x27;, [] as</text>
<text class="c" x="82" y="268">Array&lt;string&gt;)</text>
<text class="comp" x="82" y="291">组件：useLocalStorageState 钩子</text>
<rect class="cardT" x="472" y="254" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="254" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="278" r="10"/>
<text class="num" x="494" y="282" text-anchor="middle">3</text>
<text class="t" x="514" y="283">挂载时解析存储里的包装对象并返回，没有就落</text>
<text class="t" x="514" y="305">回你给的初始值</text>
<rect class="card" x="40" y="339" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="339" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="363" r="10"/>
<text class="num" x="62" y="367" text-anchor="middle">4</text>
<text class="t" x="82" y="368">像普通 useState 一样读和更新</text>
<text class="c" x="82" y="392">setTodos((prev) =&gt; [...prev,</text>
<text class="c" x="82" y="411">newTodo.trim()])</text>
<rect class="cardT" x="472" y="385" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="385" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="409" r="10"/>
<text class="num" x="494" y="413" text-anchor="middle">5</text>
<text class="t" x="514" y="414">每次变化都把状态序列化写回存储</text>
<rect class="cardT" x="472" y="461" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="461" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="485" r="10"/>
<text class="num" x="494" y="489" text-anchor="middle">6</text>
<text class="t" x="514" y="490">下次读取时清掉版本不符或过期的值</text>
<rect class="val" x="28" y="543" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="567">价值</text>
<text class="valT" x="48" y="591">状态刷新后还在，不用手写解析和保存的管道——代价是引入一个未发布的 0.x</text>
</svg>
