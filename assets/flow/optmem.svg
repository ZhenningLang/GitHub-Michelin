<svg xmlns="http://www.w3.org/2000/svg" width="880" height="946" viewBox="0 0 880 946" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="946" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="810" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="810" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OptMem does</text>
<path class="hand" d="M408,129.0 C439.0,129.0 439.0,153 470,153" marker-end="url(#a)"/>
<path class="hand" d="M472,197.0 C441.0,197.0 441.0,236 410,236" marker-end="url(#a)"/>
<path class="edge" d="M62,301 L62,325" marker-end="url(#a)"/>
<path class="edge" d="M62,464 L62,488" marker-end="url(#a)"/>
<path class="hand" d="M408,546.0 C439.0,546.0 439.0,570 470,570" marker-end="url(#a)"/>
<path class="edge" d="M494,683 L494,707" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Install</text>
<text class="t" x="82" y="118">Run the one-line installer, which</text>
<text class="t" x="82" y="140">prints the memory prompt block</text>
<text class="comp" x="82" y="168">component: install.sh</text>
<rect class="cardT" x="472" y="129" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="129" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="153" r="10"/>
<text class="num" x="494" y="157" text-anchor="middle">2</text>
<text class="ph" x="514" y="158">Install</text>
<text class="t" x="514" y="175">Drops one dependency-free Python file</text>
<text class="t" x="514" y="197">at ~/.optmem/memo and creates the</text>
<text class="t" x="514" y="219">store</text>
<text class="comp" x="514" y="247">component: memo script</text>
<rect class="card" x="40" y="212" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">3</text>
<text class="ph" x="82" y="241">Install</text>
<text class="t" x="82" y="258">Paste the printed block at the top of</text>
<text class="t" x="82" y="280">your agent&#x27;s AGENTS.md / CLAUDE.md</text>
<rect class="card" x="40" y="327" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="327" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="351" r="10"/>
<text class="num" x="62" y="355" text-anchor="middle">4</text>
<text class="ph" x="82" y="356">Every session</text>
<text class="t" x="82" y="373">Every session, your agent reads its</text>
<text class="t" x="82" y="395">memory before anything else</text>
<text class="c" x="82" y="419">memo wake</text>
<text class="comp" x="82" y="442">component: the prompt block</text>
<rect class="card" x="40" y="490" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="490" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="514" r="10"/>
<text class="num" x="62" y="518" text-anchor="middle">5</text>
<text class="ph" x="82" y="519">Every session</text>
<text class="t" x="82" y="536">Your agent records one line whenever</text>
<text class="t" x="82" y="558">it learns something worth keeping</text>
<text class="c" x="82" y="582">memo note &quot;...&quot;</text>
<rect class="cardT" x="472" y="546" width="368" height="137" rx="8"/>
<rect class="accT" x="472" y="546" width="4" height="137" rx="2"/>
<circle class="accT" cx="494" cy="570" r="10"/>
<text class="num" x="494" y="574" text-anchor="middle">6</text>
<text class="ph" x="514" y="575">Every session</text>
<text class="t" x="514" y="592">Appends fixed-width records to the</text>
<text class="t" x="514" y="614">log; when a merge is due, asks for it</text>
<text class="c" x="514" y="638">memo nap</text>
<text class="comp" x="514" y="661">component: memo</text>
<rect class="cardT" x="472" y="709" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="709" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="733" r="10"/>
<text class="num" x="494" y="737" text-anchor="middle">7</text>
<text class="ph" x="514" y="738">Every session</text>
<text class="t" x="514" y="755">The next wake prints the rebuilt</text>
<text class="t" x="514" y="777">summary tree plus newest memories, in</text>
<text class="t" x="514" y="799">budget</text>
<rect class="val" x="28" y="852" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="876">VALUE</text>
<text class="valT" x="48" y="900">Every future session — any model, any harness — starts knowing what was decided and tried</text>
</svg>
