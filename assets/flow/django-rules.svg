<svg xmlns="http://www.w3.org/2000/svg" width="880" height="789" viewBox="0 0 880 789" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="789" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="631" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="631" rx="10"/>
<rect class="pillT" x="474" y="40" width="184.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">django-rules does</text>
<path class="edge" d="M62,214 L62,238" marker-end="url(#a)"/>
<path class="edge" d="M62,354 L62,378" marker-end="url(#a)"/>
<path class="hand" d="M408,427.5 C439.0,427.5 439.0,451 470,451" marker-end="url(#a)"/>
<path class="edge" d="M494,521 L494,545" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="142" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="142" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it and add its</text>
<text class="t" x="82" y="123">object-permission backend ahead of</text>
<text class="t" x="82" y="145">Django&#x27;s ModelBackend</text>
<text class="c" x="82" y="169">rules.permissions.ObjectPermissionBackend</text>
<text class="comp" x="82" y="192">component: auth backend</text>
<rect class="card" x="40" y="240" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="240" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="264" r="10"/>
<text class="num" x="62" y="268" text-anchor="middle">2</text>
<text class="t" x="82" y="269">Write predicates and bind their</text>
<text class="t" x="82" y="291">combination to a permission name</text>
<text class="c" x="82" y="315">rules.add_perm(&#x27;books.change_book&#x27;,</text>
<text class="c" x="82" y="334">is_book_author | is_editor)</text>
<rect class="card" x="40" y="380" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="380" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="404" r="10"/>
<text class="num" x="62" y="408" text-anchor="middle">3</text>
<text class="t" x="82" y="409">Guard a view or template with that</text>
<text class="t" x="82" y="431">permission name and the object</text>
<text class="c" x="82" y="455">@permission_required · {% has_perm %}</text>
<rect class="cardT" x="472" y="427" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="427" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="451" r="10"/>
<text class="num" x="494" y="455" text-anchor="middle">4</text>
<text class="t" x="514" y="456">On each check, Django asks its</text>
<text class="t" x="514" y="478">backend, which looks up the rule for</text>
<text class="t" x="514" y="500">that name</text>
<rect class="cardT" x="472" y="547" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="547" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="571" r="10"/>
<text class="num" x="494" y="575" text-anchor="middle">5</text>
<text class="t" x="514" y="576">Runs the predicates on user and</text>
<text class="t" x="514" y="598">object, short-circuiting, and returns</text>
<text class="t" x="514" y="620">allow or deny</text>
<rect class="val" x="28" y="673" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="697">VALUE</text>
<text class="valT" x="48" y="721">Per-object authorization lives in named, testable functions — no permission rows to store or</text>
<text class="valT" x="48" y="743">sync</text>
</svg>
