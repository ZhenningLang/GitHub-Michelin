<svg xmlns="http://www.w3.org/2000/svg" width="880" height="644" viewBox="0 0 880 644" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="644" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="486" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="486" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">draw.io does</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,166.0 C441.0,166.0 441.0,217 410,217" marker-end="url(#a)"/>
<path class="hand" d="M408,240.0 C439.0,240.0 439.0,264 470,264" marker-end="url(#a)"/>
<path class="hand" d="M472,287.0 C441.0,287.0 441.0,337 410,337" marker-end="url(#a)"/>
<path class="hand" d="M408,349.0 C439.0,349.0 439.0,384 470,384" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the desktop build (or just</text>
<text class="t" x="82" y="123">open the hosted editor in a browser)</text>
<text class="c" x="82" y="147">brew install --cask drawio</text>
<rect class="cardT" x="472" y="119" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">Runs the entire editor locally as an</text>
<text class="t" x="514" y="170">Electron app; no diagram data leaves</text>
<text class="t" x="514" y="192">the machine</text>
<rect class="card" x="40" y="193" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">Draw shapes and connections, pulling</text>
<text class="t" x="82" y="244">icons from the built-in shape</text>
<text class="t" x="82" y="266">libraries</text>
<rect class="cardT" x="472" y="240" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="240" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="264" r="10"/>
<text class="num" x="494" y="268" text-anchor="middle">4</text>
<text class="t" x="514" y="269">Writes every element as an mxCell —</text>
<text class="t" x="514" y="291">geometry plus a style string — inside</text>
<text class="t" x="514" y="313">mxGraph XML</text>
<rect class="card" x="40" y="313" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="313" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="337" r="10"/>
<text class="num" x="62" y="341" text-anchor="middle">5</text>
<text class="t" x="82" y="342">Save the .drawio file (plain-text XML)</text>
<text class="t" x="82" y="364">or export a picture for the document</text>
<rect class="cardT" x="472" y="360" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="360" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="384" r="10"/>
<text class="num" x="494" y="388" text-anchor="middle">6</text>
<text class="t" x="514" y="389">Exports by rendering with its own</text>
<text class="t" x="514" y="411">bundled Chromium — no server compiles</text>
<text class="t" x="514" y="433">the diagram</text>
<text class="c" x="514" y="457">drawio -x -f png -e -s 2 -o</text>
<text class="c" x="514" y="476">diagram.drawio.png diagram.drawio</text>
<rect class="val" x="28" y="528" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="552">VALUE</text>
<text class="valT" x="48" y="576">You get an editable, git-diffable diagram file that renders entirely offline — and no diagram</text>
<text class="valT" x="48" y="598">data leaves your machine</text>
</svg>
