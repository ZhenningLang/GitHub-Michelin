<svg xmlns="http://www.w3.org/2000/svg" width="880" height="721" viewBox="0 0 880 721" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="721" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="563" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="563" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Windows-MCP does</text>
<path class="hand" d="M408,141.5 C439.0,141.5 439.0,165 470,165" marker-end="url(#a)"/>
<path class="hand" d="M472,212.0 C441.0,212.0 441.0,261 410,261" marker-end="url(#a)"/>
<path class="hand" d="M408,273.0 C439.0,273.0 439.0,333 470,333" marker-end="url(#a)"/>
<path class="edge" d="M494,428 L494,452" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Register the server in your MCP client</text>
<text class="t" x="82" y="123">once</text>
<text class="c" x="82" y="147">claude mcp add --transport stdio</text>
<text class="c" x="82" y="166">windows-mcp -- uvx windows-mcp serve</text>
<text class="comp" x="82" y="189">component: MCP client config</text>
<rect class="cardT" x="472" y="141" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="141" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="165" r="10"/>
<text class="num" x="494" y="169" text-anchor="middle">2</text>
<text class="t" x="514" y="170">Starts on your Windows session over</text>
<text class="t" x="514" y="192">stdio and exposes Click, Type,</text>
<text class="t" x="514" y="214">Snapshot, App and more</text>
<text class="c" x="514" y="238">uvx windows-mcp serve</text>
<text class="comp" x="514" y="261">component: windows-mcp server</text>
<rect class="card" x="40" y="237" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">3</text>
<text class="t" x="82" y="266">Ask the agent in plain words to do a</text>
<text class="t" x="82" y="288">task in a native Windows app</text>
<rect class="cardT" x="472" y="309" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="309" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="333" r="10"/>
<text class="num" x="494" y="337" text-anchor="middle">4</text>
<text class="t" x="514" y="338">Reads the window&#x27;s accessibility tree</text>
<text class="t" x="514" y="360">into labelled, clickable elements with</text>
<text class="t" x="514" y="382">coordinates</text>
<text class="comp" x="514" y="410">component: Snapshot tool</text>
<rect class="cardT" x="472" y="454" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="454" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="478" r="10"/>
<text class="num" x="494" y="482" text-anchor="middle">5</text>
<text class="t" x="514" y="483">Turns the chosen label into screen</text>
<text class="t" x="514" y="505">coordinates and injects real mouse and</text>
<text class="t" x="514" y="527">keyboard input</text>
<text class="comp" x="514" y="555">component: Click / Type tools</text>
<rect class="val" x="28" y="605" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="629">VALUE</text>
<text class="valT" x="48" y="653">The agent works native Windows apps by element name, not hard-coded pixels, and you write no</text>
<text class="valT" x="48" y="675">automation script</text>
</svg>
