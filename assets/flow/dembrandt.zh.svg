<svg xmlns="http://www.w3.org/2000/svg" width="880" height="896" viewBox="0 0 880 896" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="896" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="760" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="760" rx="10"/>
<rect class="pillT" x="474" y="40" width="151.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Dembrandt 做的</text>
<path class="edge" d="M62,206 L62,230" marker-end="url(#a)"/>
<path class="hand" d="M408,289.5 C439.0,289.5 439.0,313 470,313" marker-end="url(#a)"/>
<path class="edge" d="M494,381 L494,405" marker-end="url(#a)"/>
<path class="hand" d="M472,464.0 C441.0,464.0 441.0,488 410,488" marker-end="url(#a)"/>
<path class="edge" d="M62,573 L62,597" marker-end="url(#a)"/>
<path class="hand" d="M408,656.5 C439.0,656.5 439.0,680 470,680" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="134" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="134" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">提取</text>
<text class="t" x="82" y="118">装好 CLI，再拉一次配套的 Chromium</text>
<text class="c" x="82" y="142">npm install -g dembrandt · dembrandt</text>
<text class="c" x="82" y="161">install-browser</text>
<text class="comp" x="82" y="184">组件：CLI · Playwright 浏览器</text>
<rect class="card" x="40" y="232" width="368" height="115" rx="8"/>
<rect class="accY" x="40" y="232" width="4" height="115" rx="2"/>
<circle class="accY" cx="62" cy="256" r="10"/>
<text class="num" x="62" y="260" text-anchor="middle">2</text>
<text class="ph" x="82" y="261">提取</text>
<text class="t" x="82" y="278">给它一个网址，选一种导出格式</text>
<text class="c" x="82" y="302">dembrandt dembrandt.com --dtcg</text>
<text class="comp" x="82" y="325">组件：CLI</text>
<rect class="cardT" x="472" y="289" width="368" height="92" rx="8"/>
<rect class="accT" x="472" y="289" width="4" height="92" rx="2"/>
<circle class="accT" cx="494" cy="313" r="10"/>
<text class="num" x="494" y="317" text-anchor="middle">3</text>
<text class="ph" x="514" y="318">提取</text>
<text class="t" x="514" y="335">渲染页面，只从真正画出来的元素上读计算样式</text>
<text class="comp" x="514" y="363">组件：提取器</text>
<rect class="cardT" x="472" y="407" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="407" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="431" r="10"/>
<text class="num" x="494" y="435" text-anchor="middle">4</text>
<text class="ph" x="514" y="436">提取</text>
<text class="t" x="514" y="453">把颜色、字体、间距、圆角聚类，选出主色，写</text>
<text class="t" x="514" y="475">成 token</text>
<text class="comp" x="514" y="503">组件：token 格式化器</text>
<rect class="card" x="40" y="464" width="368" height="109" rx="8"/>
<rect class="accY" x="40" y="464" width="4" height="109" rx="2"/>
<circle class="accY" cx="62" cy="488" r="10"/>
<text class="num" x="62" y="492" text-anchor="middle">5</text>
<text class="ph" x="82" y="493">CI 门禁</text>
<text class="t" x="82" y="510">把一次运行结果提交成基线</text>
<text class="c" x="82" y="534">dembrandt https://app.example.com</text>
<text class="c" x="82" y="553">--json-only &gt; baseline.json</text>
<rect class="card" x="40" y="599" width="368" height="115" rx="8"/>
<rect class="accY" x="40" y="599" width="4" height="115" rx="2"/>
<circle class="accY" cx="62" cy="623" r="10"/>
<text class="num" x="62" y="627" text-anchor="middle">6</text>
<text class="ph" x="82" y="628">CI 门禁</text>
<text class="t" x="82" y="645">在预览部署上加一步漂移门禁</text>
<text class="c" x="82" y="669">uses: dembrandt/dembrandt@v0.37.0</text>
<text class="comp" x="82" y="692">组件：GitHub Action</text>
<rect class="cardT" x="472" y="656" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="656" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="680" r="10"/>
<text class="num" x="494" y="684" text-anchor="middle">7</text>
<text class="ph" x="514" y="685">CI 门禁</text>
<text class="t" x="514" y="702">重新提取，逐 token 打漂移分，超阈值退出码</text>
<text class="t" x="514" y="724">1 并在 PR 上标注</text>
<text class="comp" x="514" y="752">组件：漂移评分器</text>
<rect class="val" x="28" y="802" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="826">价值</text>
<text class="valT" x="48" y="850">不用再从开发者工具里抄色值；主色被改了，PR 直接红，而不是上线后才发现</text>
</svg>
