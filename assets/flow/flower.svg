<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="680" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="522" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="522" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Flower does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,272.0 C439.0,272.0 439.0,296 470,296" marker-end="url(#a)"/>
<path class="hand" d="M472,320.5 C441.0,320.5 441.0,401 410,401" marker-end="url(#a)"/>
<path class="hand" d="M408,413.0 C439.0,413.0 439.0,437 470,437" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install Flower where your Celery app</text>
<text class="t" x="82" y="123">and broker URL are reachable</text>
<text class="c" x="82" y="147">pip install flower</text>
<rect class="card" x="40" y="193" width="368" height="158" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="158" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Point it at the cluster&#x27;s broker and</text>
<text class="t" x="82" y="244">start the dashboard</text>
<text class="c" x="82" y="268">celery</text>
<text class="c" x="82" y="287">--broker=amqp://guest:guest@localhost:5672</text>
<text class="c" x="82" y="306">// flower</text>
<text class="comp" x="82" y="329">component: web UI on port 5555</text>
<rect class="cardT" x="472" y="272" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="272" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="296" r="10"/>
<text class="num" x="494" y="300" text-anchor="middle">3</text>
<text class="t" x="514" y="301">Joins the cluster&#x27;s event feed and</text>
<text class="t" x="514" y="323">renders live worker and task state</text>
<text class="comp" x="514" y="351">component: Celery events</text>
<rect class="card" x="40" y="377" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="377" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="401" r="10"/>
<text class="num" x="62" y="405" text-anchor="middle">4</text>
<text class="t" x="82" y="406">Drill in from the UI, or act via the</text>
<text class="t" x="82" y="428">REST API (revoke a task, grow a pool)</text>
<rect class="cardT" x="472" y="413" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="413" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="437" r="10"/>
<text class="num" x="494" y="441" text-anchor="middle">5</text>
<text class="t" x="514" y="442">Sends control commands over the broker</text>
<text class="t" x="514" y="464">and serves /metrics for Prometheus</text>
<text class="t" x="514" y="486">scraping</text>
<text class="comp" x="514" y="514">component: worker control</text>
<rect class="val" x="28" y="564" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="588">VALUE</text>
<text class="valT" x="48" y="612">A running Celery cluster becomes visible and operable from one web page, with no agent</text>
<text class="valT" x="48" y="634">installed on any worker</text>
</svg>
