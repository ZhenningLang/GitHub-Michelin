<svg xmlns="http://www.w3.org/2000/svg" width="880" height="929" viewBox="0 0 880 929" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="929" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="771" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="771" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Scrapling does</text>
<path class="edge" d="M62,228 L62,252" marker-end="url(#a)"/>
<path class="hand" d="M408,332.0 C439.0,332.0 439.0,356 470,356" marker-end="url(#a)"/>
<path class="hand" d="M472,400.0 C441.0,400.0 441.0,460 410,460" marker-end="url(#a)"/>
<path class="hand" d="M408,504.5 C439.0,504.5 439.0,528 470,528" marker-end="url(#a)"/>
<path class="hand" d="M472,561.0 C441.0,561.0 441.0,623 410,623" marker-end="url(#a)"/>
<path class="hand" d="M408,667.5 C439.0,667.5 439.0,691 470,691" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="156" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="156" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">First run</text>
<text class="t" x="82" y="118">Install the fetchers extra, then</text>
<text class="t" x="82" y="140">download the browsers</text>
<text class="c" x="82" y="164">pip install &quot;scrapling[fetchers]&quot; ·</text>
<text class="c" x="82" y="183">scrapling install</text>
<text class="comp" x="82" y="206">component: PyPI package + CLI</text>
<rect class="card" x="40" y="254" width="368" height="156" rx="8"/>
<rect class="accY" x="40" y="254" width="4" height="156" rx="2"/>
<circle class="accY" cx="62" cy="278" r="10"/>
<text class="num" x="62" y="282" text-anchor="middle">2</text>
<text class="ph" x="82" y="283">First run</text>
<text class="t" x="82" y="300">Turn on adaptive mode and fetch the</text>
<text class="t" x="82" y="322">page with the stealth fetcher</text>
<text class="c" x="82" y="346">StealthyFetcher.fetch(&#x27;https://example.com</text>
<text class="c" x="82" y="365">&#x27;)</text>
<text class="comp" x="82" y="388">component: StealthyFetcher</text>
<rect class="cardT" x="472" y="332" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="332" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="356" r="10"/>
<text class="num" x="494" y="360" text-anchor="middle">3</text>
<text class="ph" x="514" y="361">First run</text>
<text class="t" x="514" y="378">Launches a patched Chromium, hides</text>
<text class="t" x="514" y="400">automation traces, returns a parsed</text>
<text class="t" x="514" y="422">page</text>
<text class="comp" x="514" y="450">component: Patchright + Playwright</text>
<rect class="card" x="40" y="436" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="436" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="460" r="10"/>
<text class="num" x="62" y="464" text-anchor="middle">4</text>
<text class="ph" x="82" y="465">First run</text>
<text class="t" x="82" y="482">Select what you want and ask it to</text>
<text class="t" x="82" y="504">remember the element</text>
<text class="c" x="82" y="528">p.css(&#x27;.product&#x27;, auto_save=True)</text>
<text class="comp" x="82" y="551">component: Selector API</text>
<rect class="cardT" x="472" y="504" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="504" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="528" r="10"/>
<text class="num" x="494" y="532" text-anchor="middle">5</text>
<text class="ph" x="514" y="533">First run</text>
<text class="t" x="514" y="550">Saves the element&#x27;s tag, text,</text>
<text class="t" x="514" y="572">attributes, path and parent to SQLite</text>
<text class="comp" x="514" y="600">component: SQLite storage</text>
<rect class="card" x="40" y="599" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="599" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="623" r="10"/>
<text class="num" x="62" y="627" text-anchor="middle">6</text>
<text class="ph" x="82" y="628">After a redesign</text>
<text class="t" x="82" y="645">Run the same selector again, now with</text>
<text class="t" x="82" y="667">adaptive on</text>
<text class="c" x="82" y="691">p.css(&#x27;.product&#x27;, adaptive=True)</text>
<text class="comp" x="82" y="714">component: Selector API</text>
<rect class="cardT" x="472" y="667" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="667" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="691" r="10"/>
<text class="num" x="494" y="695" text-anchor="middle">7</text>
<text class="ph" x="514" y="696">After a redesign</text>
<text class="t" x="514" y="713">Scores every element against the saved</text>
<text class="t" x="514" y="735">one and returns the closest match</text>
<text class="comp" x="514" y="763">component: adaptive matcher</text>
<rect class="val" x="28" y="813" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="837">VALUE</text>
<text class="valT" x="48" y="861">A redesign no longer means rewriting selectors by hand, and the fetch, stealth browser and</text>
<text class="valT" x="48" y="883">parser come from one package</text>
</svg>
