<svg xmlns="http://www.w3.org/2000/svg" width="880" height="736" viewBox="0 0 880 736" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="736" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="600" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="600" rx="10"/>
<rect class="pillT" x="474" y="40" width="110.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">CLIP does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,248.5 C439.0,248.5 439.0,272 470,272" marker-end="url(#a)"/>
<path class="hand" d="M472,307.5 C441.0,307.5 441.0,335 410,335" marker-end="url(#a)"/>
<path class="hand" d="M408,368.0 C439.0,368.0 439.0,417 470,417" marker-end="url(#a)"/>
<path class="edge" d="M494,490 L494,514" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install PyTorch, the small helpers,</text>
<text class="t" x="82" y="123">then this repo as a package</text>
<text class="c" x="82" y="147">pip install</text>
<text class="c" x="82" y="166">git+https://github.com/openai/CLIP.git</text>
<rect class="card" x="40" y="212" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Load a named checkpoint</text>
<text class="c" x="82" y="265">clip.load(&quot;ViT-B/32&quot;, device=device)</text>
<rect class="cardT" x="472" y="248" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="248" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="272" r="10"/>
<text class="num" x="494" y="276" text-anchor="middle">3</text>
<text class="t" x="514" y="277">Downloads and caches the weights on</text>
<text class="t" x="514" y="299">first use; returns the model plus its</text>
<text class="t" x="514" y="321">image transform</text>
<text class="comp" x="514" y="349">component: pretrained weights</text>
<rect class="card" x="40" y="311" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">4</text>
<text class="t" x="82" y="340">Preprocess your images and write the</text>
<text class="t" x="82" y="362">candidate labels as plain text</text>
<text class="c" x="82" y="386">clip.tokenize([&quot;a diagram&quot;, &quot;a dog&quot;, &quot;a</text>
<text class="c" x="82" y="405">cat&quot;])</text>
<rect class="cardT" x="472" y="393" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="393" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="417" r="10"/>
<text class="num" x="494" y="421" text-anchor="middle">5</text>
<text class="t" x="514" y="422">Encodes images and texts into one</text>
<text class="t" x="514" y="444">shared vector space</text>
<text class="comp" x="514" y="472">component: image + text encoders</text>
<rect class="cardT" x="472" y="516" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="516" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="540" r="10"/>
<text class="num" x="494" y="544" text-anchor="middle">6</text>
<text class="t" x="514" y="545">Scores every image-text pair by cosine</text>
<text class="t" x="514" y="567">similarity; the top label is the</text>
<text class="t" x="514" y="589">zero-shot prediction</text>
<rect class="val" x="28" y="642" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="666">VALUE</text>
<text class="valT" x="48" y="690">Classify or search images by writing labels as text — no labeled dataset, no training run</text>
</svg>
