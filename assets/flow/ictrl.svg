<svg xmlns="http://www.w3.org/2000/svg" width="880" height="525" viewBox="0 0 880 525" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="525" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="389" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="389" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">iCTRL does</text>
<path class="hand" d="M408,108.0 C439.0,108.0 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,155.5 C441.0,155.5 441.0,194 410,194" marker-end="url(#a)"/>
<path class="hand" d="M408,206.0 C439.0,206.0 439.0,253 470,253" marker-end="url(#a)"/>
<path class="hand" d="M472,265.0 C441.0,265.0 441.0,292 410,292" marker-end="url(#a)"/>
<path class="hand" d="M408,304.0 C439.0,304.0 439.0,351 470,351" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Sign the runner, enable Developer</text>
<text class="t" x="82" y="123">Mode, mount DDI and launch it</text>
<rect class="cardT" x="472" y="108" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">Serves its manual and method schema</text>
<text class="t" x="514" y="159">locally</text>
<text class="c" x="514" y="183">GET /skill · GET /schema</text>
<rect class="card" x="40" y="170" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">3</text>
<text class="t" x="82" y="199">Request pairing and approve the</text>
<text class="t" x="82" y="221">matching prompt on the phone</text>
<rect class="cardT" x="472" y="229" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="229" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="253" r="10"/>
<text class="num" x="494" y="257" text-anchor="middle">4</text>
<text class="t" x="514" y="258">Authenticates the client and accepts</text>
<text class="t" x="514" y="280">encrypted actions</text>
<rect class="card" x="40" y="268" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="268" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="292" r="10"/>
<text class="num" x="62" y="296" text-anchor="middle">5</text>
<text class="t" x="82" y="297">Send an authorized test action and</text>
<text class="t" x="82" y="319">request an observation</text>
<rect class="cardT" x="472" y="327" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="327" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="351" r="10"/>
<text class="num" x="494" y="355" text-anchor="middle">6</text>
<text class="t" x="514" y="356">Drives the iOS UI and returns the</text>
<text class="t" x="514" y="378">observed state</text>
<rect class="val" x="28" y="431" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="455">VALUE</text>
<text class="valT" x="48" y="479">A supervised agent can test a real iPhone through a discoverable device API</text>
</svg>
