<svg xmlns="http://www.w3.org/2000/svg" width="880" height="899" viewBox="0 0 880 899" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="899" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="741" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="741" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Cline does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="edge" d="M62,332 L62,356" marker-end="url(#a)"/>
<path class="hand" d="M408,416.5 C439.0,416.5 439.0,440 470,440" marker-end="url(#a)"/>
<path class="hand" d="M472,463.0 C441.0,463.0 441.0,525 410,525" marker-end="url(#a)"/>
<path class="hand" d="M408,537.0 C439.0,537.0 439.0,561 470,561" marker-end="url(#a)"/>
<path class="edge" d="M494,631 L494,655" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it where you work — editor</text>
<text class="t" x="82" y="123">extension, terminal CLI, or desktop</text>
<text class="t" x="82" y="145">app</text>
<text class="c" x="82" y="169">npm i -g cline</text>
<rect class="card" x="40" y="215" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Point it at a model — your own</text>
<text class="t" x="82" y="266">provider key, a gateway, or a local</text>
<text class="t" x="82" y="288">model</text>
<text class="c" x="82" y="312">Anthropic · Bedrock · OpenRouter · Ollama</text>
<rect class="card" x="40" y="358" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="358" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="382" r="10"/>
<text class="num" x="62" y="386" text-anchor="middle">3</text>
<text class="t" x="82" y="387">Describe the job in Plan mode, and</text>
<text class="t" x="82" y="409">write down the project rules it must</text>
<text class="t" x="82" y="431">follow</text>
<text class="c" x="82" y="455">.clinerules</text>
<rect class="cardT" x="472" y="416" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="416" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="440" r="10"/>
<text class="num" x="494" y="444" text-anchor="middle">4</text>
<text class="t" x="514" y="445">Reads the repo, asks its questions,</text>
<text class="t" x="514" y="467">and lays out a strategy — changing</text>
<text class="t" x="514" y="489">nothing yet</text>
<rect class="card" x="40" y="501" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="501" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="525" r="10"/>
<text class="num" x="62" y="529" text-anchor="middle">5</text>
<text class="t" x="82" y="530">Switch to Act mode and approve each</text>
<text class="t" x="82" y="552">edit and command it proposes</text>
<rect class="cardT" x="472" y="537" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="537" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="561" r="10"/>
<text class="num" x="494" y="565" text-anchor="middle">6</text>
<text class="t" x="514" y="566">Edits across files, runs your tests</text>
<text class="t" x="514" y="588">and build, and fixes the linter errors</text>
<text class="t" x="514" y="610">it caused</text>
<rect class="cardT" x="472" y="657" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="657" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="681" r="10"/>
<text class="num" x="494" y="685" text-anchor="middle">7</text>
<text class="t" x="514" y="686">Checkpoints every step, so you can</text>
<text class="t" x="514" y="708">review any diff or roll the whole run</text>
<text class="t" x="514" y="730">back</text>
<rect class="val" x="28" y="783" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="807">VALUE</text>
<text class="valT" x="48" y="831">Agent-speed edits without handing over the keyboard — every file write and command is one you</text>
<text class="valT" x="48" y="853">saw, and any step can be undone</text>
</svg>
