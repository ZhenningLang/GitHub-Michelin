<svg xmlns="http://www.w3.org/2000/svg" width="880" height="748" viewBox="0 0 880 748" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="748" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="590" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="590" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Intent does</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,178.5 C441.0,178.5 441.0,217 410,217" marker-end="url(#a)"/>
<path class="edge" d="M62,307 L62,331" marker-end="url(#a)"/>
<path class="hand" d="M408,380.5 C439.0,380.5 439.0,404 470,404" marker-end="url(#a)"/>
<path class="edge" d="M494,477 L494,501" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Start skill scaffolding with your own</text>
<text class="t" x="82" y="123">coding agent</text>
<text class="c" x="82" y="147">npx @tanstack/intent@latest scaffold</text>
<rect class="cardT" x="472" y="119" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">Prints a three-phase prompt: your</text>
<text class="t" x="514" y="170">agent maps the domain, interviews you,</text>
<text class="t" x="514" y="192">writes SKILL.md files</text>
<text class="comp" x="514" y="220">component: bundled meta-skills</text>
<rect class="card" x="40" y="193" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">Validate the skills and copy the CI</text>
<text class="t" x="82" y="244">template</text>
<text class="c" x="82" y="268">npx @tanstack/intent@latest validate · npx</text>
<text class="c" x="82" y="287">@tanstack/intent@latest setup</text>
<rect class="card" x="40" y="333" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">4</text>
<text class="t" x="82" y="362">Publish the package as usual; skills</text>
<text class="t" x="82" y="384">ride inside the tarball</text>
<text class="c" x="82" y="408">npm publish</text>
<rect class="cardT" x="472" y="380" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="380" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="404" r="10"/>
<text class="num" x="494" y="408" text-anchor="middle">5</text>
<text class="t" x="514" y="409">Users&#x27; agents list and load the</text>
<text class="t" x="514" y="431">SKILL.md of the version they installed</text>
<text class="comp" x="514" y="459">component: list / load discovery</text>
<rect class="cardT" x="472" y="503" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="503" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="527" r="10"/>
<text class="num" x="494" y="531" text-anchor="middle">6</text>
<text class="t" x="514" y="532">After each release, flags skills whose</text>
<text class="t" x="514" y="554">sources changed and opens a review PR</text>
<text class="comp" x="514" y="582">component: check-skills.yml workflow</text>
<rect class="val" x="28" y="632" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="656">VALUE</text>
<text class="valT" x="48" y="680">Your agent guidance ships and versions with your package, and you hear about it when it goes</text>
<text class="valT" x="48" y="702">stale</text>
</svg>
