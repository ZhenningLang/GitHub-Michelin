<svg xmlns="http://www.w3.org/2000/svg" width="880" height="988" viewBox="0 0 880 988" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="988" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="830" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="830" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">weave does</text>
<path class="edge" d="M62,209 L62,233" marker-end="url(#a)"/>
<path class="edge" d="M62,394 L62,418" marker-end="url(#a)"/>
<path class="hand" d="M408,476.0 C439.0,476.0 439.0,500 470,500" marker-end="url(#a)"/>
<path class="edge" d="M494,612 L494,636" marker-end="url(#a)"/>
<path class="hand" d="M472,706.0 C441.0,706.0 441.0,730 410,730" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Once</text>
<text class="t" x="82" y="118">Install the two binaries: the weave</text>
<text class="t" x="82" y="140">CLI and the weave-driver git will call</text>
<text class="c" x="82" y="164">brew install weave</text>
<text class="comp" x="82" y="187">component: Homebrew formula</text>
<rect class="card" x="40" y="235" width="368" height="159" rx="8"/>
<rect class="accY" x="40" y="235" width="4" height="159" rx="2"/>
<circle class="accY" cx="62" cy="259" r="10"/>
<text class="num" x="62" y="263" text-anchor="middle">2</text>
<text class="ph" x="82" y="264">Once</text>
<text class="t" x="82" y="281">Register it for the repo; every</text>
<text class="t" x="82" y="303">supported extension gets a merge=weave</text>
<text class="t" x="82" y="325">rule</text>
<text class="c" x="82" y="349">weave setup</text>
<text class="comp" x="82" y="372">component: weave-cli</text>
<rect class="card" x="40" y="420" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="420" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="444" r="10"/>
<text class="num" x="62" y="448" text-anchor="middle">3</text>
<text class="ph" x="82" y="449">Every merge</text>
<text class="t" x="82" y="466">Merge, rebase or cherry-pick exactly</text>
<text class="t" x="82" y="488">as before — the workflow is unchanged</text>
<text class="c" x="82" y="512">git merge &lt;branch&gt;</text>
<rect class="cardT" x="472" y="476" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="476" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="500" r="10"/>
<text class="num" x="494" y="504" text-anchor="middle">4</text>
<text class="ph" x="514" y="505">Every merge</text>
<text class="t" x="514" y="522">git hands over base/ours/theirs; each</text>
<text class="t" x="514" y="544">version is parsed into functions,</text>
<text class="t" x="514" y="566">classes and keys</text>
<text class="comp" x="514" y="594">component: weave-driver</text>
<rect class="cardT" x="472" y="638" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="638" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="662" r="10"/>
<text class="num" x="494" y="666" text-anchor="middle">5</text>
<text class="ph" x="514" y="667">Every merge</text>
<text class="t" x="514" y="684">Independent entity edits merge clean;</text>
<text class="t" x="514" y="706">real collisions return markers naming</text>
<text class="t" x="514" y="728">the entity and guard</text>
<text class="comp" x="514" y="756">component: weave-core</text>
<rect class="card" x="40" y="706" width="368" height="134" rx="8"/>
<rect class="accY" x="40" y="706" width="4" height="134" rx="2"/>
<circle class="accY" cx="62" cy="730" r="10"/>
<text class="num" x="62" y="734" text-anchor="middle">6</text>
<text class="ph" x="82" y="735">Every merge</text>
<text class="t" x="82" y="752">On a real conflict, read the</text>
<text class="t" x="82" y="774">per-entity detail, edit, then verify</text>
<text class="t" x="82" y="796">against the three git stages</text>
<text class="c" x="82" y="820">weave explain &lt;file&gt; · weave check</text>
<rect class="val" x="28" y="872" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="896">VALUE</text>
<text class="valT" x="48" y="920">Independent edits to the same file stop halting merges — you only resolve actual semantic</text>
<text class="valT" x="48" y="942">collisions</text>
</svg>
