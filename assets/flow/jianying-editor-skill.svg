<svg xmlns="http://www.w3.org/2000/svg" width="880" height="706" viewBox="0 0 880 706" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="706" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="570" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="570" rx="10"/>
<rect class="pillT" x="474" y="40" width="211.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">jianying-editor does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,326 L62,350" marker-end="url(#a)"/>
<path class="hand" d="M408,388.0 C439.0,388.0 439.0,412 470,412" marker-end="url(#a)"/>
<path class="hand" d="M472,435.0 C441.0,435.0 441.0,474 410,474" marker-end="url(#a)"/>
<path class="hand" d="M408,486.0 C439.0,486.0 439.0,532 470,532" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone the skill into the folder your</text>
<text class="t" x="82" y="123">agent loads skills from</text>
<text class="c" x="82" y="147">git clone &lt;repo&gt;</text>
<text class="c" x="82" y="166">.claude/skills/jianying-editor</text>
<rect class="card" x="40" y="212" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Install the Python side once,</text>
<text class="t" x="82" y="263">including the browser for web capture</text>
<text class="c" x="82" y="287">pip install -r requirements.txt ·</text>
<text class="c" x="82" y="306">playwright install chromium</text>
<rect class="card" x="40" y="352" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">3</text>
<text class="t" x="82" y="381">Describe the video in plain language —</text>
<text class="t" x="82" y="403">footage folder, style, title</text>
<rect class="cardT" x="472" y="388" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="388" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="412" r="10"/>
<text class="num" x="494" y="416" text-anchor="middle">4</text>
<text class="t" x="514" y="417">Finds the 剪映 draft folder and writes</text>
<text class="t" x="514" y="439">a draft with tracks, captions and</text>
<text class="t" x="514" y="461">voiceover aligned</text>
<rect class="card" x="40" y="450" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="450" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="474" r="10"/>
<text class="num" x="62" y="478" text-anchor="middle">5</text>
<text class="t" x="82" y="479">Restart 剪映 so the new draft appears</text>
<text class="t" x="82" y="501">in the project list</text>
<rect class="cardT" x="472" y="508" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="508" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="532" r="10"/>
<text class="num" x="494" y="536" text-anchor="middle">6</text>
<text class="t" x="514" y="537">On Windows with 剪映 5.9 or older it</text>
<text class="t" x="514" y="559">also clicks through the export UI</text>
<rect class="val" x="28" y="612" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="636">VALUE</text>
<text class="valT" x="48" y="660">A 剪映 timeline assembled from one sentence, which you can keep editing by hand in the app</text>
</svg>
