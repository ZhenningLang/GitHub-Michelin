<svg xmlns="http://www.w3.org/2000/svg" width="880" height="614" viewBox="0 0 880 614" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="614" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="478" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="478" rx="10"/>
<rect class="pillT" x="474" y="40" width="206.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">camofox-browser 做的</text>
<path class="hand" d="M408,121.0 C439.0,121.0 439.0,145 470,145" marker-end="url(#a)"/>
<path class="hand" d="M472,169.5 C441.0,169.5 441.0,220 410,220" marker-end="url(#a)"/>
<path class="hand" d="M408,232.5 C439.0,232.5 439.0,268 470,268" marker-end="url(#a)"/>
<path class="hand" d="M472,292.5 C441.0,292.5 441.0,319 410,319" marker-end="url(#a)"/>
<path class="hand" d="M408,331.5 C439.0,331.5 439.0,391 470,391" marker-end="url(#a)"/>
<path class="hand" d="M472,415.5 C441.0,415.5 441.0,439 410,439" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 agent 够得着的机器上把服务启动一次</text>
<text class="c" x="82" y="125">npx @askjo/camofox-browser</text>
<text class="comp" x="82" y="148">组件：REST 服务（Node）</text>
<rect class="cardT" x="472" y="121" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="121" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="145" r="10"/>
<text class="num" x="494" y="149" text-anchor="middle">2</text>
<text class="t" x="514" y="150">下载一次 Camoufox（约 300MB），随后监听</text>
<text class="t" x="514" y="172">9377 端口待命</text>
<text class="comp" x="514" y="200">组件：camoufox-js 下载器</text>
<rect class="card" x="40" y="196" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">3</text>
<text class="t" x="82" y="225">你的 agent 带上用户标识和网址开一个标签页</text>
<text class="c" x="82" y="249">POST /tabs</text>
<rect class="cardT" x="472" y="244" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="244" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="268" r="10"/>
<text class="num" x="494" y="272" text-anchor="middle">4</text>
<text class="t" x="514" y="273">按需拉起伪装过指纹的 Firefox，在该用户独立</text>
<text class="t" x="514" y="295">的会话里打开页面</text>
<text class="comp" x="514" y="323">组件：Camoufox 引擎</text>
<rect class="card" x="40" y="295" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="295" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="319" r="10"/>
<text class="num" x="62" y="323" text-anchor="middle">5</text>
<text class="t" x="82" y="324">你的 agent 问页面上有什么</text>
<text class="c" x="82" y="348">GET /tabs/:id/snapshot</text>
<rect class="cardT" x="472" y="367" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="367" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="391" r="10"/>
<text class="num" x="494" y="395" text-anchor="middle">6</text>
<text class="t" x="514" y="396">返回一份精简的页面文字提纲，可操作元素带编</text>
<text class="t" x="514" y="418">号（e1、e2……）</text>
<text class="comp" x="514" y="446">组件：无障碍快照</text>
<rect class="card" x="40" y="415" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="415" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="439" r="10"/>
<text class="num" x="62" y="443" text-anchor="middle">7</text>
<text class="t" x="82" y="444">你的 agent 按编号点击或输入，再取一次快照</text>
<text class="c" x="82" y="468">POST /tabs/:id/click</text>
<rect class="val" x="28" y="520" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="544">价值</text>
<text class="valT" x="48" y="568">agent 能读、能操作那些拦普通 Playwright 的网站，你不用自己接反检测浏览器，也不用解析原始 HTML</text>
</svg>
