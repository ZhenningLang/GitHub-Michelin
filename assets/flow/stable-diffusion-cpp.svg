<svg xmlns="http://www.w3.org/2000/svg" width="880" height="855" viewBox="0 0 880 855" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="855" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="697" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="697" rx="10"/>
<rect class="pillT" x="474" y="40" width="257.8" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">stable-diffusion.cpp does</text>
<path class="edge" d="M62,191 L62,215" marker-end="url(#a)"/>
<path class="edge" d="M62,289 L62,313" marker-end="url(#a)"/>
<path class="hand" d="M408,370.5 C439.0,370.5 439.0,394 470,394" marker-end="url(#a)"/>
<path class="edge" d="M494,464 L494,488" marker-end="url(#a)"/>
<path class="edge" d="M494,609 L494,633" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="119" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="119" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Download the sd binary for your</text>
<text class="t" x="82" y="123">backend from Releases, or build it</text>
<text class="t" x="82" y="145">with CMake</text>
<text class="comp" x="82" y="173">component: sd-cli / sd-server binaries</text>
<rect class="card" x="40" y="217" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="217" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="241" r="10"/>
<text class="num" x="62" y="245" text-anchor="middle">2</text>
<text class="t" x="82" y="246">Download model weights as</text>
<text class="t" x="82" y="268">.safetensors, .ckpt or .gguf</text>
<rect class="card" x="40" y="315" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="315" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="339" r="10"/>
<text class="num" x="62" y="343" text-anchor="middle">3</text>
<text class="t" x="82" y="344">Generate an image with one command</text>
<text class="c" x="82" y="368">./bin/sd-cli -m</text>
<text class="c" x="82" y="387">../models/v1-5-pruned-emaonly.safetensors</text>
<text class="c" x="82" y="406">-p &quot;a lovely cat&quot;</text>
<rect class="cardT" x="472" y="370" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="370" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="394" r="10"/>
<text class="num" x="494" y="398" text-anchor="middle">4</text>
<text class="t" x="514" y="399">Detects the model family, loads the</text>
<text class="t" x="514" y="421">weights and quantizes them on load if</text>
<text class="t" x="514" y="443">you asked</text>
<rect class="cardT" x="472" y="490" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="490" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="514" r="10"/>
<text class="num" x="494" y="518" text-anchor="middle">5</text>
<text class="t" x="514" y="519">Runs text encoder, sampler and VAE on</text>
<text class="t" x="514" y="541">the ggml backend, spilling weights to</text>
<text class="t" x="514" y="563">RAM when VRAM is short</text>
<text class="comp" x="514" y="591">component: patched ggml</text>
<rect class="cardT" x="472" y="635" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="635" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="659" r="10"/>
<text class="num" x="494" y="663" text-anchor="middle">6</text>
<text class="t" x="514" y="664">Writes the PNG with generation</text>
<text class="t" x="514" y="686">parameters embedded, WebUI-style</text>
<rect class="val" x="28" y="739" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="763">VALUE</text>
<text class="valT" x="48" y="787">Diffusion on your own CPU/GPU from one native binary — no Python or PyTorch environment to</text>
<text class="valT" x="48" y="809">keep in step with your drivers</text>
</svg>
