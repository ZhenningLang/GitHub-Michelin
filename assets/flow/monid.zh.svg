<svg xmlns="http://www.w3.org/2000/svg" width="880" height="715" viewBox="0 0 880 715" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="715" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="579" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="579" rx="10"/>
<rect class="pillT" x="474" y="40" width="223.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Monid 的编译器和引擎做的</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="hand" d="M408,278.0 C439.0,278.0 439.0,302 470,302" marker-end="url(#a)"/>
<path class="hand" d="M472,326.5 C441.0,326.5 441.0,388 410,388" marker-end="url(#a)"/>
<path class="hand" d="M408,413.0 C439.0,413.0 439.0,437 470,437" marker-end="url(#a)"/>
<path class="edge" d="M494,488 L494,512" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用声明式写法描述厂商 API：鉴权、请求、输入</text>
<text class="t" x="82" y="123">schema、计费模型</text>
<text class="c" x="82" y="147">defineProvider · defineEndpoint</text>
<text class="comp" x="82" y="170">组件：connectors/&lt;name&gt;/</text>
<rect class="card" x="40" y="218" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">录一份真实响应当 fixture，再离线跑通</text>
<text class="t" x="82" y="269">回放测试</text>
<text class="c" x="82" y="293">deno task record · deno task test</text>
<text class="comp" x="82" y="316">组件：shared/testing</text>
<rect class="cardT" x="472" y="278" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="278" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="302" r="10"/>
<text class="num" x="494" y="306" text-anchor="middle">3</text>
<text class="t" x="514" y="307">把所有定义编译成扁平 JSON 文档，函数按内容</text>
<text class="t" x="514" y="329">哈希引用</text>
<text class="comp" x="514" y="357">组件：编译器</text>
<rect class="card" x="40" y="364" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="364" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="388" r="10"/>
<text class="num" x="62" y="392" text-anchor="middle">4</text>
<text class="t" x="82" y="393">把自己的厂商 key 放进环境变量，跑一个端点</text>
<text class="c" x="82" y="417">deno task engine:run &#x27;tinyfish#search&#x27;</text>
<text class="comp" x="82" y="440">组件：engine:run 命令</text>
<rect class="cardT" x="472" y="413" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="413" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="437" r="10"/>
<text class="num" x="494" y="441" text-anchor="middle">5</text>
<text class="t" x="514" y="442">校验输入、构造请求，在传输层内部注入 key</text>
<text class="comp" x="514" y="470">组件：连接器引擎</text>
<rect class="cardT" x="472" y="514" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="514" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="538" r="10"/>
<text class="num" x="494" y="542" text-anchor="middle">6</text>
<text class="t" x="514" y="543">先在原始响应上结算用量，再映射并校验输出</text>
<text class="comp" x="514" y="571">组件：连接器引擎</text>
<rect class="val" x="28" y="621" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="645">价值</text>
<text class="valT" x="48" y="669">每家厂商 API 都走同一份声明好的契约——校验、计量、错误形态一致——不用再给每家手写一个客户端</text>
</svg>
