<svg xmlns="http://www.w3.org/2000/svg" width="880" height="747" viewBox="0 0 880 747" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="747" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="589" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="589" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">text2vec does</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,247.0 C439.0,247.0 439.0,271 470,271" marker-end="url(#a)"/>
<path class="hand" d="M472,283.0 C441.0,283.0 441.0,354 410,354" marker-end="url(#a)"/>
<path class="hand" d="M408,376.0 C439.0,376.0 439.0,400 470,400" marker-end="url(#a)"/>
<path class="hand" d="M472,423.0 C441.0,423.0 441.0,472 410,472" marker-end="url(#a)"/>
<path class="hand" d="M408,505.0 C439.0,505.0 439.0,529 470,529" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install PyTorch, then the library</text>
<text class="c" x="82" y="125">pip install torch · pip install -U</text>
<text class="c" x="82" y="144">text2vec</text>
<rect class="card" x="40" y="190" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">Load a released Chinese model by its</text>
<text class="t" x="82" y="241">Hugging Face name</text>
<text class="c" x="82" y="265">SentenceModel(&quot;shibing624/text2vec-base-ch</text>
<text class="c" x="82" y="284">inese&quot;)</text>
<rect class="cardT" x="472" y="247" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="247" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="271" r="10"/>
<text class="num" x="494" y="275" text-anchor="middle">3</text>
<text class="t" x="514" y="276">Downloads and caches the weights on</text>
<text class="t" x="514" y="298">first use, then runs locally</text>
<rect class="card" x="40" y="330" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="330" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="354" r="10"/>
<text class="num" x="62" y="358" text-anchor="middle">4</text>
<text class="t" x="82" y="359">Encode your whole answer corpus once</text>
<text class="c" x="82" y="383">corpus_embeddings =</text>
<text class="c" x="82" y="402">embedder.encode(corpus)</text>
<rect class="cardT" x="472" y="376" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="376" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="400" r="10"/>
<text class="num" x="494" y="404" text-anchor="middle">5</text>
<text class="t" x="514" y="405">Turns each sentence into a</text>
<text class="t" x="514" y="427">fixed-length vector (768 numbers for</text>
<text class="t" x="514" y="449">the base model)</text>
<rect class="card" x="40" y="448" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="448" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="472" r="10"/>
<text class="num" x="62" y="476" text-anchor="middle">6</text>
<text class="t" x="82" y="477">Encode the user&#x27;s question and search</text>
<text class="t" x="82" y="499">the corpus</text>
<text class="c" x="82" y="523">semantic_search(query_embedding,</text>
<text class="c" x="82" y="542">corpus_embeddings, top_k=5)</text>
<rect class="cardT" x="472" y="505" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="505" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="529" r="10"/>
<text class="num" x="494" y="533" text-anchor="middle">7</text>
<text class="t" x="514" y="534">Scores every corpus vector by cosine</text>
<text class="t" x="514" y="556">similarity and returns the top-k ids</text>
<text class="t" x="514" y="578">with scores</text>
<rect class="val" x="28" y="631" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="655">VALUE</text>
<text class="valT" x="48" y="679">Chinese question matching works out of the box — no training set to collect and no retrieval</text>
<text class="valT" x="48" y="701">service to run</text>
</svg>
