<svg xmlns="http://www.w3.org/2000/svg" width="880" height="970" viewBox="0 0 880 970" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="970" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="812" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="812" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The guide does</text>
<path class="hand" d="M408,140.5 C439.0,140.5 439.0,164 470,164" marker-end="url(#a)"/>
<path class="edge" d="M494,276 L494,300" marker-end="url(#a)"/>
<path class="hand" d="M472,370.0 C441.0,370.0 441.0,394 410,394" marker-end="url(#a)"/>
<path class="edge" d="M62,501 L62,525" marker-end="url(#a)"/>
<path class="hand" d="M408,571.5 C439.0,571.5 439.0,595 470,595" marker-end="url(#a)"/>
<path class="edge" d="M494,682 L494,706" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">First pass</text>
<text class="t" x="82" y="118">Open the README and read &quot;Start here&quot;</text>
<text class="t" x="82" y="140">first, in order</text>
<text class="c" x="82" y="164">Start here</text>
<text class="comp" x="82" y="187">component: README.md</text>
<rect class="cardT" x="472" y="140" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="140" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="164" r="10"/>
<text class="num" x="494" y="168" text-anchor="middle">2</text>
<text class="ph" x="514" y="169">First pass</text>
<text class="t" x="514" y="186">Orders the field from one request to</text>
<text class="t" x="514" y="208">one GPU, then kernels, engines and</text>
<text class="t" x="514" y="230">clusters</text>
<text class="comp" x="514" y="258">component: README.md</text>
<rect class="cardT" x="472" y="302" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="302" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="326" r="10"/>
<text class="num" x="494" y="330" text-anchor="middle">3</text>
<text class="ph" x="514" y="331">Then as a reference</text>
<text class="t" x="514" y="348">Admits only the original paper, the</text>
<text class="t" x="514" y="370">official spec, an implementing repo or</text>
<text class="t" x="514" y="392">a reproducible report</text>
<text class="comp" x="514" y="420">component: CONTRIBUTING.md</text>
<rect class="card" x="40" y="370" width="368" height="131" rx="8"/>
<rect class="accY" x="40" y="370" width="4" height="131" rx="2"/>
<circle class="accY" cx="62" cy="394" r="10"/>
<text class="num" x="62" y="398" text-anchor="middle">4</text>
<text class="ph" x="82" y="399">Then as a reference</text>
<text class="t" x="82" y="416">Jump to the numbered section that</text>
<text class="t" x="82" y="438">matches today&#x27;s bottleneck</text>
<text class="c" x="82" y="462">2. Kernel optimization · 4. Inference</text>
<text class="c" x="82" y="481">engines · 5. Distributed inference</text>
<rect class="card" x="40" y="527" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="527" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="551" r="10"/>
<text class="num" x="62" y="555" text-anchor="middle">5</text>
<text class="ph" x="82" y="556">Then as a reference</text>
<text class="t" x="82" y="573">Open the linked primary source and</text>
<text class="t" x="82" y="595">work it on your own hardware</text>
<rect class="cardT" x="472" y="571" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="571" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="595" r="10"/>
<text class="num" x="494" y="599" text-anchor="middle">6</text>
<text class="ph" x="514" y="600">Then as a reference</text>
<text class="t" x="514" y="617">Drops performance numbers that lack</text>
<text class="t" x="514" y="639">hardware, workload, precision or</text>
<text class="t" x="514" y="661">baseline</text>
<rect class="cardT" x="472" y="708" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="708" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="732" r="10"/>
<text class="num" x="494" y="736" text-anchor="middle">7</text>
<text class="ph" x="514" y="737">Then as a reference</text>
<text class="t" x="514" y="754">Rejects broken anchors on every PR and</text>
<text class="t" x="514" y="776">re-checks all external links weekly</text>
<text class="comp" x="514" y="804">component: check_guide.py · links.yml</text>
<rect class="val" x="28" y="854" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="878">VALUE</text>
<text class="valT" x="48" y="902">You stop guessing what to learn first and whose explanation to trust — the order and the</text>
<text class="valT" x="48" y="924">source bar are already made</text>
</svg>
