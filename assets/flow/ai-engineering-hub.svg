<svg xmlns="http://www.w3.org/2000/svg" width="880" height="721" viewBox="0 0 880 721" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="721" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="563" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="563" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The repo does</text>
<path class="hand" d="M408,152.5 C439.0,152.5 439.0,176 470,176" marker-end="url(#a)"/>
<path class="hand" d="M472,211.5 C441.0,211.5 441.0,283 410,283" marker-end="url(#a)"/>
<path class="edge" d="M62,354 L62,378" marker-end="url(#a)"/>
<path class="hand" d="M408,427.5 C439.0,427.5 439.0,451 470,451" marker-end="url(#a)"/>
<path class="hand" d="M472,486.5 C441.0,486.5 441.0,525 410,525" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="161" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="161" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Pick the folder whose stack matches</text>
<text class="t" x="82" y="123">yours from the README&#x27;s difficulty</text>
<text class="t" x="82" y="145">tiers</text>
<text class="c" x="82" y="169">Beginner Projects · Intermediate Projects </text>
<text class="c" x="82" y="188">· Advanced Projects</text>
<text class="comp" x="82" y="211">component: root README.md</text>
<rect class="cardT" x="472" y="152" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="152" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="176" r="10"/>
<text class="num" x="494" y="180" text-anchor="middle">2</text>
<text class="t" x="514" y="181">Names the model, framework, vector</text>
<text class="t" x="514" y="203">store and vendor APIs that folder</text>
<text class="t" x="514" y="225">wires together</text>
<text class="comp" x="514" y="253">component: per-folder README</text>
<rect class="card" x="40" y="259" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="259" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="283" r="10"/>
<text class="num" x="62" y="287" text-anchor="middle">3</text>
<text class="t" x="82" y="288">Put your API keys in .env and install</text>
<text class="t" x="82" y="310">that folder&#x27;s own dependencies</text>
<text class="c" x="82" y="334">cp .env.example .env · uv sync</text>
<rect class="card" x="40" y="380" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="380" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="404" r="10"/>
<text class="num" x="62" y="408" text-anchor="middle">4</text>
<text class="t" x="82" y="409">Start the demo app or open its</text>
<text class="t" x="82" y="431">notebook</text>
<text class="c" x="82" y="455">streamlit run app.py</text>
<rect class="cardT" x="472" y="427" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="427" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="451" r="10"/>
<text class="num" x="494" y="455" text-anchor="middle">5</text>
<text class="t" x="514" y="456">Runs the whole chain in one place:</text>
<text class="t" x="514" y="478">retrieve, call the model or agents,</text>
<text class="t" x="514" y="500">show the answer</text>
<text class="comp" x="514" y="528">component: app.py · notebook</text>
<rect class="card" x="40" y="501" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="501" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="525" r="10"/>
<text class="num" x="62" y="529" text-anchor="middle">6</text>
<text class="t" x="82" y="530">Lift the glue code you need into your</text>
<text class="t" x="82" y="552">project and pin its versions yourself</text>
<rect class="val" x="28" y="605" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="629">VALUE</text>
<text class="valT" x="48" y="653">You see model, framework, vector store and vendor API working together in one running file</text>
<text class="valT" x="48" y="675">instead of stitching four sets of docs</text>
</svg>
