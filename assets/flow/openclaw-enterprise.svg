<svg xmlns="http://www.w3.org/2000/svg" width="880" height="687" viewBox="0 0 880 687" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="687" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="529" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="529" rx="10"/>
<rect class="pillT" x="474" y="40" width="248.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenClaw Enterprise does</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="hand" d="M472,179.0 C441.0,179.0 441.0,242 410,242" marker-end="url(#a)"/>
<path class="hand" d="M408,275.0 C439.0,275.0 439.0,299 470,299" marker-end="url(#a)"/>
<path class="edge" d="M494,394 L494,418" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Build the OCC CLI and start the</text>
<text class="t" x="82" y="123">Kubernetes profile of the platform</text>
<text class="c" x="82" y="147">./bin/occ dev up</text>
<text class="comp" x="82" y="170">component: occ CLI</text>
<rect class="cardT" x="472" y="132" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">Runs API, worker and PostgreSQL in a</text>
<text class="t" x="514" y="183">k3d cluster and bootstraps the default</text>
<text class="t" x="514" y="205">Namespace</text>
<rect class="card" x="40" y="218" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">3</text>
<text class="t" x="82" y="247">Name an agent, supply a model key and</text>
<text class="t" x="82" y="269">ask a first question</text>
<text class="c" x="82" y="293">node scripts/first-agent.mjs my-agent</text>
<text class="c" x="82" y="312">--prompt &#x27;What is 2 + 2?&#x27;</text>
<rect class="cardT" x="472" y="275" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="275" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="299" r="10"/>
<text class="num" x="494" y="303" text-anchor="middle">4</text>
<text class="t" x="514" y="304">Stores the key as a Secret, grants the</text>
<text class="t" x="514" y="326">agent access and snapshots an</text>
<text class="t" x="514" y="348">immutable revision</text>
<text class="comp" x="514" y="376">component: API + IAM</text>
<rect class="cardT" x="472" y="420" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="420" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="444" r="10"/>
<text class="num" x="494" y="448" text-anchor="middle">5</text>
<text class="t" x="514" y="449">Worker provisions the agent&#x27;s gateway</text>
<text class="t" x="514" y="471">on Kubernetes, activates it and</text>
<text class="t" x="514" y="493">verifies a model reply</text>
<text class="comp" x="514" y="521">component: worker + Compute Driver</text>
<rect class="val" x="28" y="571" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="595">VALUE</text>
<text class="valT" x="48" y="619">Each agent is a permissioned, versioned, audited resource in a tenant namespace — not a</text>
<text class="valT" x="48" y="641">gateway someone started with their own keys</text>
</svg>
