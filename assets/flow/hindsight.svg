<svg xmlns="http://www.w3.org/2000/svg" width="880" height="813" viewBox="0 0 880 813" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="813" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="655" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="655" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Hindsight does</text>
<path class="edge" d="M62,192 L62,216" marker-end="url(#a)"/>
<path class="edge" d="M62,329 L62,353" marker-end="url(#a)"/>
<path class="hand" d="M408,401.0 C439.0,401.0 439.0,425 470,425" marker-end="url(#a)"/>
<path class="hand" d="M472,460.5 C441.0,460.5 441.0,497 410,497" marker-end="url(#a)"/>
<path class="hand" d="M408,530.0 C439.0,530.0 439.0,570 470,570" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Run the server container with your LLM</text>
<text class="t" x="82" y="123">API key</text>
<text class="c" x="82" y="147">ghcr.io/vectorize-io/hindsight:latest</text>
<text class="comp" x="82" y="170">component: hindsight-api server</text>
<rect class="card" x="40" y="218" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">2</text>
<text class="t" x="82" y="247">Point a client at it from your agent</text>
<text class="c" x="82" y="271">client =</text>
<text class="c" x="82" y="290">Hindsight(base_url=&quot;http://localhost:8888&quot;</text>
<text class="c" x="82" y="309">)</text>
<rect class="card" x="40" y="355" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="355" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="379" r="10"/>
<text class="num" x="62" y="383" text-anchor="middle">3</text>
<text class="t" x="82" y="384">After each turn, hand it what happened</text>
<text class="c" x="82" y="408">client.retain(bank_id=&quot;my-bank&quot;,</text>
<text class="c" x="82" y="427">content=&quot;Alice works at Google&quot;)</text>
<rect class="cardT" x="472" y="401" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="401" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="425" r="10"/>
<text class="num" x="494" y="429" text-anchor="middle">4</text>
<text class="t" x="514" y="430">An LLM pass extracts facts, entities</text>
<text class="t" x="514" y="452">and dates, then consolidates them into</text>
<text class="t" x="514" y="474">observations</text>
<text class="comp" x="514" y="502">component: retain + consolidation</text>
<rect class="card" x="40" y="473" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="473" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="497" r="10"/>
<text class="num" x="62" y="501" text-anchor="middle">5</text>
<text class="t" x="82" y="502">Before the next reply, ask it a</text>
<text class="t" x="82" y="524">question</text>
<text class="c" x="82" y="548">client.recall(bank_id=&quot;my-bank&quot;,</text>
<text class="c" x="82" y="567">query=&quot;What does Alice do?&quot;)</text>
<rect class="cardT" x="472" y="546" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="546" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="570" r="10"/>
<text class="num" x="494" y="574" text-anchor="middle">6</text>
<text class="t" x="514" y="575">Runs semantic, keyword, graph and time</text>
<text class="t" x="514" y="597">searches in parallel, fuses and</text>
<text class="t" x="514" y="619">reranks them to a token budget</text>
<text class="comp" x="514" y="647">component: recall (RRF + cross-encoder)</text>
<rect class="val" x="28" y="697" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="721">VALUE</text>
<text class="valT" x="48" y="745">Your agent starts each session with the facts it learned before, without you writing</text>
<text class="valT" x="48" y="767">extraction prompts, a vector store and a reranker</text>
</svg>
