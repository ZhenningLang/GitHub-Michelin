<svg xmlns="http://www.w3.org/2000/svg" width="880" height="732" viewBox="0 0 880 732" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="732" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="596" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="596" rx="10"/>
<rect class="pillT" x="474" y="40" width="106.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">技能包做的</text>
<path class="hand" d="M408,141.5 C439.0,141.5 439.0,165 470,165" marker-end="url(#a)"/>
<path class="hand" d="M472,189.5 C441.0,189.5 441.0,261 410,261" marker-end="url(#a)"/>
<path class="hand" d="M408,262.0 C439.0,262.0 439.0,297 470,297" marker-end="url(#a)"/>
<path class="hand" d="M472,321.5 C441.0,321.5 441.0,345 410,345" marker-end="url(#a)"/>
<path class="hand" d="M408,346.0 C439.0,346.0 439.0,420 470,420" marker-end="url(#a)"/>
<path class="edge" d="M494,493 L494,517" marker-end="url(#a)"/>
<path class="hand" d="M472,556.5 C441.0,556.5 441.0,580 410,580" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把技能包装进 agent——npx、git clone 或</text>
<text class="t" x="82" y="123">plugin 入口</text>
<text class="c" x="82" y="147">npx skills add</text>
<text class="c" x="82" y="166">mukul975/Anthropic-Cybersecurity-Skills</text>
<text class="comp" x="82" y="189">组件：安装器 / 仓库</text>
<rect class="cardT" x="472" y="141" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="141" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="165" r="10"/>
<text class="num" x="494" y="169" text-anchor="middle">2</text>
<text class="t" x="514" y="170">落盘 818 份 SKILL.md 与一份生成的</text>
<text class="t" x="514" y="192">index.json</text>
<text class="comp" x="514" y="220">组件：skills/ 目录树</text>
<rect class="card" x="40" y="237" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">3</text>
<text class="t" x="82" y="266">用白话描述任务</text>
<rect class="cardT" x="472" y="273" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="273" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="297" r="10"/>
<text class="num" x="494" y="301" text-anchor="middle">4</text>
<text class="t" x="514" y="302">按 description 与 tags 匹配，只加载</text>
<text class="t" x="514" y="324">命中的几份</text>
<text class="comp" x="514" y="352">组件：按需加载</text>
<rect class="card" x="40" y="321" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="321" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="345" r="10"/>
<text class="num" x="62" y="349" text-anchor="middle">5</text>
<text class="t" x="82" y="350">提供目标、工具与授权范围</text>
<rect class="cardT" x="472" y="396" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="396" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="420" r="10"/>
<text class="num" x="494" y="424" text-anchor="middle">6</text>
<text class="t" x="514" y="425">按 Workflow 逐步执行，再用 Verificati</text>
<text class="t" x="514" y="447">on 自检</text>
<text class="comp" x="514" y="475">组件：SKILL.md</text>
<rect class="cardT" x="472" y="519" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="519" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="543" r="10"/>
<text class="num" x="494" y="547" text-anchor="middle">7</text>
<text class="t" x="514" y="548">从 references/ 取框架编号写报告</text>
<text class="comp" x="514" y="576">组件：references/</text>
<rect class="card" x="40" y="556" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="556" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="580" r="10"/>
<text class="num" x="62" y="584" text-anchor="middle">8</text>
<text class="t" x="82" y="585">复核产出并承担责任</text>
<rect class="val" x="28" y="638" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="662">价值</text>
<text class="valT" x="48" y="686">agent 照着已映射框架的 runbook 走，而不是即兴发挥；但每一步仍作用在你授权并复核的目标上</text>
</svg>
