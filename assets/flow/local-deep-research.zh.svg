<svg xmlns="http://www.w3.org/2000/svg" width="880" height="610" viewBox="0 0 880 610" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="610" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="474" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="474" rx="10"/>
<rect class="pillT" x="474" y="40" width="243.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Local Deep Research 做的</text>
<path class="hand" d="M408,118.0 C439.0,118.0 439.0,142 470,142" marker-end="url(#a)"/>
<path class="hand" d="M472,178.0 C441.0,178.0 441.0,214 410,214" marker-end="url(#a)"/>
<path class="hand" d="M408,237.5 C439.0,237.5 439.0,288 470,288" marker-end="url(#a)"/>
<path class="edge" d="M494,361 L494,385" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装起应用——Docker Compose 栈或 pip</text>
<text class="c" x="82" y="125">docker compose up -d · pip install</text>
<text class="c" x="82" y="144">local-deep-research</text>
<rect class="cardT" x="472" y="118" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="118" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="142" r="10"/>
<text class="num" x="494" y="146" text-anchor="middle">2</text>
<text class="t" x="514" y="147">应用连同内置的 Ollama、SearXNG 容器一起拉</text>
<text class="t" x="514" y="169">起，打开 Web UI</text>
<text class="c" x="514" y="193">http://localhost:5000</text>
<text class="comp" x="514" y="216">组件：Docker 栈</text>
<rect class="card" x="40" y="190" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">3</text>
<text class="t" x="82" y="219">在设置里选 langgraph-agent 策略，把 LLM </text>
<text class="t" x="82" y="241">指向本地模型</text>
<text class="c" x="82" y="265">langgraph-agent</text>
<rect class="cardT" x="472" y="264" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="264" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="288" r="10"/>
<text class="num" x="494" y="292" text-anchor="middle">4</text>
<text class="t" x="514" y="293">由 agent 自主决定搜哪些引擎并持续追读，直</text>
<text class="t" x="514" y="315">到证据足够</text>
<text class="comp" x="514" y="343">组件：LangGraph agent</text>
<rect class="cardT" x="472" y="387" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="387" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="411" r="10"/>
<text class="num" x="494" y="415" text-anchor="middle">5</text>
<text class="t" x="514" y="416">生成带引用的报告，写入按用户加密的</text>
<text class="t" x="514" y="438">SQLCipher 库</text>
<text class="comp" x="514" y="466">组件：加密存储</text>
<rect class="val" x="28" y="516" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="540">价值</text>
<text class="valT" x="48" y="564">多引擎、带引用的研究全程跑在你自己的机器上——数据不必离开你的网络</text>
</svg>
