<svg xmlns="http://www.w3.org/2000/svg" width="880" height="644" viewBox="0 0 880 644" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="644" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="508" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="508" rx="10"/>
<rect class="pillT" x="474" y="40" width="233.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">llm-circuit-finder 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,250.0 C439.0,250.0 439.0,274 470,274" marker-end="url(#a)"/>
<path class="edge" d="M494,322 L494,346" marker-end="url(#a)"/>
<path class="hand" d="M472,384.0 C441.0,384.0 441.0,408 410,408" marker-end="url(#a)"/>
<path class="hand" d="M408,441.0 C439.0,441.0 439.0,470 470,470" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">按你的显卡编好 llama.cpp，备好 GGUF 模</text>
<text class="t" x="82" y="123">型，装 Python 依赖</text>
<text class="c" x="82" y="147">pip install gguf requests tqdm</text>
<rect class="card" x="40" y="193" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">启动扫描：给出模型、llama-server、块大小和</text>
<text class="t" x="82" y="244">要扫的层范围</text>
<text class="c" x="82" y="268">python sweep.py --model</text>
<text class="c" x="82" y="287">/path/to/model.gguf</text>
<rect class="cardT" x="472" y="250" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="250" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="274" r="10"/>
<text class="num" x="494" y="278" text-anchor="middle">3</text>
<text class="t" x="514" y="279">对每个候选层块，写出一个把这几层物理复制一</text>
<text class="t" x="514" y="301">遍的临时 GGUF</text>
<rect class="cardT" x="472" y="348" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="348" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="372" r="10"/>
<text class="num" x="494" y="376" text-anchor="middle">4</text>
<text class="t" x="514" y="377">用 llama-server 加载，跑数学/情商/推理探</text>
<text class="t" x="514" y="399">针，与基线比分，然后删掉</text>
<rect class="card" x="40" y="384" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="384" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="408" r="10"/>
<text class="num" x="62" y="412" text-anchor="middle">5</text>
<text class="t" x="82" y="413">挑出得分最好的层块，写成一条显式的层</text>
<text class="t" x="82" y="435">执行路径</text>
<text class="c" x="82" y="459">python layer_path.py model.gguf</text>
<text class="c" x="82" y="478">improved.gguf -p &quot;0..14,12,13,14,15..39&quot;</text>
<rect class="cardT" x="472" y="446" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="446" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="470" r="10"/>
<text class="num" x="494" y="474" text-anchor="middle">6</text>
<text class="t" x="514" y="475">写出新的 GGUF，前向时把这块层跑两遍，可直</text>
<text class="t" x="514" y="497">接给 llama-server 用</text>
<rect class="val" x="28" y="550" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="574">价值</text>
<text class="valT" x="48" y="598">不训练就找出哪几层“多想一遍”能改变你本地模型的推理表现，并拿到可直接测的 GGUF</text>
</svg>
