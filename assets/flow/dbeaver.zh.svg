<svg xmlns="http://www.w3.org/2000/svg" width="880" height="663" viewBox="0 0 880 663" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="663" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="527" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="527" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">DBeaver 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,241.5 C439.0,241.5 439.0,265 470,265" marker-end="url(#a)"/>
<path class="hand" d="M472,289.5 C441.0,289.5 441.0,340 410,340" marker-end="url(#a)"/>
<path class="hand" d="M408,363.5 C439.0,363.5 439.0,388 470,388" marker-end="url(#a)"/>
<path class="edge" d="M494,436 L494,460" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上社区版（安装包、ZIP 或 snap），自带</text>
<text class="t" x="82" y="123">Java 运行时</text>
<text class="c" x="82" y="147">snap install dbeaver-ce --stable</text>
<rect class="card" x="40" y="193" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">新建连接：选数据库类型，填主机和账号，测试</text>
<text class="t" x="82" y="244">后保存</text>
<text class="comp" x="82" y="272">组件：连接对话框</text>
<rect class="cardT" x="472" y="241" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="241" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="265" r="10"/>
<text class="num" x="494" y="269" text-anchor="middle">3</text>
<text class="t" x="514" y="270">驱动没打包就自动下载，再把库表结构读</text>
<text class="t" x="514" y="292">进连接树</text>
<text class="comp" x="514" y="320">组件：驱动管理器</text>
<rect class="card" x="40" y="316" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="316" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="340" r="10"/>
<text class="num" x="62" y="344" text-anchor="middle">4</text>
<text class="t" x="82" y="345">在连接上打开 SQL 编辑器跑查询，或者直接打</text>
<text class="t" x="82" y="367">开表数据</text>
<text class="c" x="82" y="391">Ctrl+Enter</text>
<rect class="cardT" x="472" y="364" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="364" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="388" r="10"/>
<text class="num" x="494" y="392" text-anchor="middle">5</text>
<text class="t" x="514" y="393">把结果放进可编辑表格，先把你改的行记</text>
<text class="t" x="514" y="415">为待提交</text>
<rect class="cardT" x="472" y="462" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="462" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="486" r="10"/>
<text class="num" x="494" y="490" text-anchor="middle">6</text>
<text class="t" x="514" y="491">点保存时，把新增、修改、删除的行写回数据库</text>
<text class="comp" x="514" y="519">组件：数据编辑器</text>
<rect class="val" x="28" y="569" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="593">价值</text>
<text class="valT" x="48" y="617">一个桌面应用就能浏览、查询、编辑 100 多种数据库，不用每种库装一个客户端</text>
</svg>
