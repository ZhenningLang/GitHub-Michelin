<svg xmlns="http://www.w3.org/2000/svg" width="880" height="633" viewBox="0 0 880 633" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="633" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="475" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="475" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Magnitude does</text>
<path class="hand" d="M408,108.0 C439.0,108.0 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,176.0 C441.0,176.0 441.0,200 410,200" marker-end="url(#a)"/>
<path class="hand" d="M408,223.5 C439.0,223.5 439.0,294 470,294" marker-end="url(#a)"/>
<path class="hand" d="M472,306.0 C441.0,306.0 441.0,330 410,330" marker-end="url(#a)"/>
<path class="hand" d="M408,353.5 C439.0,353.5 439.0,392 470,392" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install and open the desktop app (the</text>
<text class="t" x="82" y="123">magnitude CLI ships with it)</text>
<rect class="cardT" x="472" y="108" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">Profiles your machine and ranks</text>
<text class="t" x="514" y="159">catalog models by estimated tok/s,</text>
<text class="t" x="514" y="181">accuracy and memory</text>
<text class="c" x="514" y="205">magnitude hardware · catalog</text>
<text class="c" x="514" y="224">recommendations</text>
<rect class="card" x="40" y="176" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="176" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="200" r="10"/>
<text class="num" x="62" y="204" text-anchor="middle">3</text>
<text class="t" x="82" y="205">Pick a recommended model in Discover</text>
<text class="t" x="82" y="227">and download it</text>
<text class="c" x="82" y="251">magnitude catalog pull</text>
<rect class="cardT" x="472" y="270" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="270" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="294" r="10"/>
<text class="num" x="494" y="298" text-anchor="middle">4</text>
<text class="t" x="514" y="299">Tunes context size and speculative</text>
<text class="t" x="514" y="321">decoding for your hardware</text>
<rect class="card" x="40" y="306" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="306" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="330" r="10"/>
<text class="num" x="62" y="334" text-anchor="middle">5</text>
<text class="t" x="82" y="335">Connect the agent you already use, in</text>
<text class="t" x="82" y="357">Connections</text>
<text class="c" x="82" y="381">magnitude connections add</text>
<rect class="cardT" x="472" y="368" width="368" height="117" rx="8"/>
<rect class="accT" x="472" y="368" width="4" height="117" rx="2"/>
<circle class="accT" cx="494" cy="392" r="10"/>
<text class="num" x="494" y="396" text-anchor="middle">6</text>
<text class="t" x="514" y="397">Serves it locally on OpenAI- and</text>
<text class="t" x="514" y="419">Anthropic-compatible endpoints,</text>
<text class="t" x="514" y="441">loading models on demand</text>
<text class="c" x="514" y="465">127.0.0.1:10100</text>
<rect class="val" x="28" y="517" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="541">VALUE</text>
<text class="valT" x="48" y="565">You stop guessing which model fits this machine — and your existing agent runs on it without</text>
<text class="valT" x="48" y="587">hand-edited config</text>
</svg>
