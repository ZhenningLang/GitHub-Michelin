<svg xmlns="http://www.w3.org/2000/svg" width="880" height="653" viewBox="0 0 880 653" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="653" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="517" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="517" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenWorker 做的</text>
<path class="hand" d="M408,108.5 C439.0,108.5 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,156.5 C441.0,156.5 441.0,195 410,195" marker-end="url(#a)"/>
<path class="hand" d="M408,220.0 C439.0,220.0 439.0,255 470,255" marker-end="url(#a)"/>
<path class="edge" d="M494,303 L494,327" marker-end="url(#a)"/>
<path class="hand" d="M472,366.5 C441.0,366.5 441.0,390 410,390" marker-end="url(#a)"/>
<path class="hand" d="M408,391.0 C439.0,391.0 439.0,454 470,454" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装桌面应用，填模型 key 或指向 Ollama</text>
<text class="c" x="82" y="125">https://download.openworker.com/mac</text>
<rect class="cardT" x="472" y="108" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">拉起本地 agent 服务，key、连接器和审计日志</text>
<text class="t" x="514" y="159">都在本机</text>
<text class="comp" x="514" y="187">组件：本地 agent 服务</text>
<rect class="card" x="40" y="171" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">3</text>
<text class="t" x="82" y="200">选一个 coworker，说出你要的结果</text>
<text class="c" x="82" y="224">prepare a customer brief</text>
<text class="comp" x="82" y="247">组件：persona 清单</text>
<rect class="cardT" x="472" y="231" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="231" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="255" r="10"/>
<text class="num" x="494" y="259" text-anchor="middle">4</text>
<text class="t" x="514" y="260">拆成步骤，在你的文件、终端和已连接应</text>
<text class="t" x="514" y="282">用里干活</text>
<rect class="cardT" x="472" y="329" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="329" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="353" r="10"/>
<text class="num" x="494" y="357" text-anchor="middle">5</text>
<text class="t" x="514" y="358">发送、写入、跑命令前停下，弹出审批卡</text>
<text class="comp" x="514" y="386">组件：权限闸门</text>
<rect class="card" x="40" y="366" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="366" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="390" r="10"/>
<text class="num" x="62" y="394" text-anchor="middle">6</text>
<text class="t" x="82" y="395">批准、改方向，或设成长期规则</text>
<rect class="cardT" x="472" y="430" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="430" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="454" r="10"/>
<text class="num" x="494" y="458" text-anchor="middle">7</text>
<text class="t" x="514" y="459">交出文件、PR 或线程回复，并记下每次调</text>
<text class="t" x="514" y="481">用由谁批准</text>
<text class="comp" x="514" y="509">组件：审计记录</text>
<rect class="val" x="28" y="559" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="583">价值</text>
<text class="valT" x="48" y="607">拿到的是成品，不是待办清单——而且每个有后果的动作都有一条可追溯的审批</text>
</svg>
