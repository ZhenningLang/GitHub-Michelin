<svg xmlns="http://www.w3.org/2000/svg" width="880" height="615" viewBox="0 0 880 615" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="615" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="479" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="479" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Entire 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,220.0 C439.0,220.0 439.0,244 470,244" marker-end="url(#a)"/>
<path class="hand" d="M472,257.5 C441.0,257.5 441.0,319 410,319" marker-end="url(#a)"/>
<path class="hand" d="M408,342.5 C439.0,342.5 439.0,366 470,366" marker-end="url(#a)"/>
<path class="hand" d="M472,402.0 C441.0,402.0 441.0,440 410,440" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">安装单一二进制</text>
<text class="c" x="82" y="125">brew install --cask entireio/tap/entire</text>
<rect class="card" x="40" y="171" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">在仓库里启用并选好 agent</text>
<text class="c" x="82" y="224">cd your-project &amp;&amp; entire enable</text>
<text class="comp" x="82" y="247">组件：agent hooks</text>
<rect class="cardT" x="472" y="220" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="220" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="244" r="10"/>
<text class="num" x="494" y="248" text-anchor="middle">3</text>
<text class="t" x="514" y="249">agent 干活时捕获提示、工具调用与文件改动</text>
<text class="comp" x="514" y="277">组件：shadow 分支</text>
<rect class="card" x="40" y="295" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="295" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="319" r="10"/>
<text class="num" x="62" y="323" text-anchor="middle">4</text>
<text class="t" x="82" y="324">照常 commit — trailer 把你的 commit 链到</text>
<text class="t" x="82" y="346">记录上</text>
<text class="c" x="82" y="370">Entire-Checkpoint: &lt;id&gt;</text>
<rect class="cardT" x="472" y="342" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="342" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="366" r="10"/>
<text class="num" x="494" y="370" text-anchor="middle">5</text>
<text class="t" x="514" y="371">把会话浓缩成 git 对象库里的 checkpoint</text>
<text class="t" x="514" y="393">ref</text>
<text class="c" x="514" y="417">refs/entire/checkpoints/&lt;shard&gt;/&lt;id&gt;</text>
<text class="comp" x="514" y="440">组件：checkpoint refs</text>
<rect class="card" x="40" y="416" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="416" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="440" r="10"/>
<text class="num" x="62" y="444" text-anchor="middle">6</text>
<text class="t" x="82" y="445">从最近一次 checkpoint 恢复停掉的会话</text>
<text class="c" x="82" y="469">entire session resume &lt;branch&gt;</text>
<rect class="val" x="28" y="521" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="545">价值</text>
<text class="valT" x="48" y="569">分支历史之外，一份连着 commit、可搜索的编码过程记录，和可恢复的已知良好 checkpoint</text>
</svg>
