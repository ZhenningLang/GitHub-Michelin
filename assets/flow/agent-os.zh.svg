<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="580" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="444" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="444" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agent OS 做的</text>
<path class="hand" d="M408,109.5 C439.0,109.5 439.0,133 470,133" marker-end="url(#a)"/>
<path class="hand" d="M472,157.5 C441.0,157.5 441.0,197 410,197" marker-end="url(#a)"/>
<path class="edge" d="M62,293 L62,317" marker-end="url(#a)"/>
<path class="hand" d="M408,379.0 C439.0,379.0 439.0,403 470,403" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">选择 profile，把 Agent OS 安装进项目</text>
<text class="comp" x="82" y="129">组件：项目 installer</text>
<rect class="cardT" x="472" y="109" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="109" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="133" r="10"/>
<text class="num" x="494" y="137" text-anchor="middle">2</text>
<text class="t" x="514" y="138">复制 standards、构建索引并安装 agent</text>
<text class="t" x="514" y="160">commands</text>
<text class="comp" x="514" y="188">组件：Shell scripts</text>
<rect class="card" x="40" y="173" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="173" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="197" r="10"/>
<text class="num" x="62" y="201" text-anchor="middle">3</text>
<text class="t" x="82" y="202">review discovery command 提出的代</text>
<text class="t" x="82" y="224">码库约定</text>
<text class="c" x="82" y="248">/discover-standards</text>
<text class="comp" x="82" y="271">组件：discovery command</text>
<rect class="card" x="40" y="319" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="319" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="343" r="10"/>
<text class="num" x="62" y="347" text-anchor="middle">4</text>
<text class="t" x="82" y="348">进入 plan mode，依据所选 standards 塑造</text>
<text class="t" x="82" y="370">重要工作</text>
<text class="c" x="82" y="394">/shape-spec</text>
<text class="comp" x="82" y="417">组件：shape-spec command</text>
<rect class="cardT" x="472" y="379" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="379" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="403" r="10"/>
<text class="num" x="494" y="407" text-anchor="middle">5</text>
<text class="t" x="514" y="408">组织计划，在实现前保存 spec 产物</text>
<text class="comp" x="514" y="436">组件：shape-spec command</text>
<rect class="val" x="28" y="486" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="510">价值</text>
<text class="valT" x="48" y="534">coding agent 获得相关项目 standards，并留下可 review 的 spec 轨迹</text>
</svg>
