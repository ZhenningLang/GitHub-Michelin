<svg xmlns="http://www.w3.org/2000/svg" width="880" height="486" viewBox="0 0 880 486" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="486" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="350" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="350" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">CaskHub 做的</text>
<path class="hand" d="M408,108.5 C439.0,108.5 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,155.5 C441.0,155.5 441.0,195 410,195" marker-end="url(#a)"/>
<path class="hand" d="M408,196.0 C439.0,196.0 439.0,253 470,253" marker-end="url(#a)"/>
<path class="hand" d="M472,265.0 C441.0,265.0 441.0,289 410,289" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用 cask 或 release 压缩包装上并打开</text>
<text class="c" x="82" y="125">brew install --cask caskhub</text>
<rect class="cardT" x="472" y="108" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">从 formulae.brew.sh 取目录，读 Caskroom </text>
<text class="t" x="514" y="159">看已装项</text>
<text class="c" x="514" y="183">$HOMEBREW_PREFIX/Caskroom</text>
<rect class="card" x="40" y="171" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">3</text>
<text class="t" x="82" y="200">逛分类货架或搜索，然后点安装</text>
<rect class="cardT" x="472" y="229" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="229" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="253" r="10"/>
<text class="num" x="494" y="257" text-anchor="middle">4</text>
<text class="t" x="514" y="258">跑真正的 brew install，pkg 类 cask 弹原</text>
<text class="t" x="514" y="280">生密码框</text>
<rect class="card" x="40" y="265" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="265" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="289" r="10"/>
<text class="num" x="62" y="293" text-anchor="middle">5</text>
<text class="t" x="82" y="294">把 Homebrew 之外装的 App 收编，让 brew </text>
<text class="t" x="82" y="316">就地接管</text>
<text class="c" x="82" y="340">Adopt Apps</text>
<rect class="val" x="28" y="392" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="416">价值</text>
<text class="valT" x="48" y="440">一个应用商店式前端，装出来的东西在 brew 命令行里照样能管，反之亦然</text>
</svg>
