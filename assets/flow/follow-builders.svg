<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1029" viewBox="0 0 880 1029" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1029" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="871" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="871" rx="10"/>
<rect class="pillT" x="474" y="40" width="211.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Follow Builders does</text>
<path class="edge" d="M62,252 L62,276" marker-end="url(#a)"/>
<path class="hand" d="M408,349.0 C439.0,349.0 439.0,373 470,373" marker-end="url(#a)"/>
<path class="hand" d="M472,408.5 C441.0,408.5 441.0,470 410,470" marker-end="url(#a)"/>
<path class="hand" d="M408,494.5 C439.0,494.5 439.0,518 470,518" marker-end="url(#a)"/>
<path class="edge" d="M494,613 L494,637" marker-end="url(#a)"/>
<path class="edge" d="M494,758 L494,782" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="180" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="180" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone it into your agent&#x27;s skills</text>
<text class="t" x="82" y="123">folder and install the scripts&#x27; two</text>
<text class="t" x="82" y="145">npm deps</text>
<text class="c" x="82" y="169">cd</text>
<text class="c" x="82" y="188">~/.claude/skills/follow-builders/scripts</text>
<text class="c" x="82" y="207">&amp;&amp; npm install</text>
<text class="comp" x="82" y="230">component: skill folder</text>
<rect class="card" x="40" y="278" width="368" height="142" rx="8"/>
<rect class="accY" x="40" y="278" width="4" height="142" rx="2"/>
<circle class="accY" cx="62" cy="302" r="10"/>
<text class="num" x="62" y="306" text-anchor="middle">2</text>
<text class="t" x="82" y="307">Invoke the skill and answer</text>
<text class="t" x="82" y="329">onboarding: daily or weekly, time</text>
<text class="t" x="82" y="351">zone, language, delivery channel</text>
<text class="c" x="82" y="375">/follow-builders</text>
<text class="comp" x="82" y="398">component: SKILL.md onboarding</text>
<rect class="cardT" x="472" y="349" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="349" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="373" r="10"/>
<text class="num" x="494" y="377" text-anchor="middle">3</text>
<text class="t" x="514" y="378">Once a day, the author&#x27;s GitHub Action</text>
<text class="t" x="514" y="400">pulls new X posts, podcast transcripts</text>
<text class="t" x="514" y="422">and blog posts into feed JSON</text>
<text class="comp" x="514" y="450">component: generate-feed workflow</text>
<rect class="card" x="40" y="446" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="446" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="470" r="10"/>
<text class="num" x="62" y="474" text-anchor="middle">4</text>
<text class="t" x="82" y="475">Ask your agent for the digest — or let</text>
<text class="t" x="82" y="497">the OpenClaw cron job fire it</text>
<text class="comp" x="82" y="525">component: your agent</text>
<rect class="cardT" x="472" y="494" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="494" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="518" r="10"/>
<text class="num" x="494" y="522" text-anchor="middle">5</text>
<text class="t" x="514" y="523">Fetches the central feeds plus the</text>
<text class="t" x="514" y="545">latest prompt files as one JSON blob,</text>
<text class="t" x="514" y="567">no API keys</text>
<text class="comp" x="514" y="595">component: prepare-digest.js</text>
<rect class="cardT" x="472" y="639" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="639" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="663" r="10"/>
<text class="num" x="494" y="667" text-anchor="middle">6</text>
<text class="t" x="514" y="668">Your agent rewrites it per the</text>
<text class="t" x="514" y="690">prompts, one source link per item, in</text>
<text class="t" x="514" y="712">EN, ZH or bilingual</text>
<text class="comp" x="514" y="740">component: prompts/</text>
<rect class="cardT" x="472" y="784" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="784" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="808" r="10"/>
<text class="num" x="494" y="812" text-anchor="middle">7</text>
<text class="t" x="514" y="813">Sends it to Telegram or email, or just</text>
<text class="t" x="514" y="835">prints it in the chat</text>
<text class="comp" x="514" y="863">component: deliver.js</text>
<rect class="val" x="28" y="913" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="937">VALUE</text>
<text class="valT" x="48" y="961">A short cited digest of what a fixed list of AI builders said — you stop scrolling X and</text>
<text class="valT" x="48" y="983">podcasts to find it</text>
</svg>
