<svg xmlns="http://www.w3.org/2000/svg" width="880" height="764" viewBox="0 0 880 764" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="764" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="606" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="606" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">gVisor does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="edge" d="M62,265 L62,289" marker-end="url(#a)"/>
<path class="hand" d="M408,348.0 C439.0,348.0 439.0,372 470,372" marker-end="url(#a)"/>
<path class="edge" d="M494,420 L494,444" marker-end="url(#a)"/>
<path class="edge" d="M494,518 L494,542" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install runsc on the node and register</text>
<text class="t" x="82" y="123">it as a container runtime</text>
<text class="c" x="82" y="147">sudo runsc install</text>
<rect class="card" x="40" y="193" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Restart the container manager so it</text>
<text class="t" x="82" y="244">picks up the new runtime</text>
<rect class="card" x="40" y="291" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="291" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="315" r="10"/>
<text class="num" x="62" y="319" text-anchor="middle">3</text>
<text class="t" x="82" y="320">Run the workload with the runsc</text>
<text class="t" x="82" y="342">runtime selected</text>
<text class="c" x="82" y="366">docker run --runtime=runsc --rm</text>
<text class="c" x="82" y="385">hello-world</text>
<rect class="cardT" x="472" y="348" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="348" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="372" r="10"/>
<text class="num" x="494" y="376" text-anchor="middle">4</text>
<text class="t" x="514" y="377">Starts a sandbox and intercepts the</text>
<text class="t" x="514" y="399">workload&#x27;s system calls</text>
<rect class="cardT" x="472" y="446" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="446" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="470" r="10"/>
<text class="num" x="494" y="474" text-anchor="middle">5</text>
<text class="t" x="514" y="475">Answers them from the Sentry userspace</text>
<text class="t" x="514" y="497">kernel instead of the host kernel</text>
<rect class="cardT" x="472" y="544" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="544" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="568" r="10"/>
<text class="num" x="494" y="572" text-anchor="middle">6</text>
<text class="t" x="514" y="573">Keeps most of the host kernel behind a</text>
<text class="t" x="514" y="595">filtered surface</text>
<rect class="val" x="28" y="648" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="672">VALUE</text>
<text class="valT" x="48" y="696">Untrusted containers on a shared host lose their direct path to the host kernel — without</text>
<text class="valT" x="48" y="718">running a VM</text>
</svg>
