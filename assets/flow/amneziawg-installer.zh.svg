<svg xmlns="http://www.w3.org/2000/svg" width="880" height="550" viewBox="0 0 880 550" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="550" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="414" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="414" rx="10"/>
<rect class="pillT" x="474" y="40" width="243.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">amneziawg-installer 做的</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="hand" d="M472,168.0 C441.0,168.0 441.0,242 410,242" marker-end="url(#a)"/>
<path class="hand" d="M408,254.0 C439.0,254.0 439.0,278 470,278" marker-end="url(#a)"/>
<path class="hand" d="M472,290.0 C441.0,290.0 441.0,340 410,340" marker-end="url(#a)"/>
<path class="hand" d="M408,352.0 C439.0,352.0 439.0,376 470,376" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">SSH 进干净 VPS，下载最新安装脚本并用 s</text>
<text class="t" x="82" y="123">udo运行</text>
<text class="c" x="82" y="147">sudo bash ./install_amneziawg_en.sh</text>
<text class="comp" x="82" y="170">组件：安装脚本</text>
<rect class="cardT" x="472" y="132" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">从 Amnezia PPA 以 DKMS 装内核模块，调优并</text>
<text class="t" x="514" y="183">加固整机</text>
<rect class="card" x="40" y="218" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">3</text>
<text class="t" x="82" y="247">它要求时重启并重跑同一命令，两轮后打印安装</text>
<text class="t" x="82" y="269">完成横幅</text>
<rect class="cardT" x="472" y="254" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="254" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="278" r="10"/>
<text class="num" x="494" y="282" text-anchor="middle">4</text>
<text class="t" x="514" y="283">把两个客户端的配置、二维码和 vpn:// 链接写</text>
<text class="t" x="514" y="305">进 /root/awg/</text>
<rect class="card" x="40" y="316" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="316" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="340" r="10"/>
<text class="num" x="62" y="344" text-anchor="middle">5</text>
<text class="t" x="82" y="345">在手机的 Amnezia VPN 应用里扫码，或粘贴</text>
<text class="t" x="82" y="367">vpn:// 链接</text>
<rect class="cardT" x="472" y="352" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="352" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="376" r="10"/>
<text class="num" x="494" y="380" text-anchor="middle">6</text>
<text class="t" x="514" y="381">以随机化包头完成握手，DPI 无指纹可匹配，流</text>
<text class="t" x="514" y="403">量从你的 VPS 出去</text>
<rect class="val" x="28" y="456" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="480">价值</text>
<text class="valT" x="48" y="504">一台便宜 VPS 上的抗 DPI 自建 VPN——全程没手写过一行密钥、iptables 或 sysctl</text>
</svg>
