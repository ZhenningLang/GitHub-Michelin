<svg xmlns="http://www.w3.org/2000/svg" width="880" height="865" viewBox="0 0 880 865" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="865" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="729" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="729" rx="10"/>
<rect class="pillT" x="474" y="40" width="224.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">mattpocock/skills 做的</text>
<path class="edge" d="M62,209 L62,233" marker-end="url(#a)"/>
<path class="hand" d="M408,280.0 C439.0,280.0 439.0,304 470,304" marker-end="url(#a)"/>
<path class="hand" d="M472,324.5 C441.0,324.5 441.0,375 410,375" marker-end="url(#a)"/>
<path class="hand" d="M408,407.0 C439.0,407.0 439.0,431 470,431" marker-end="url(#a)"/>
<path class="hand" d="M472,451.5 C441.0,451.5 441.0,513 410,513" marker-end="url(#a)"/>
<path class="hand" d="M408,534.0 C439.0,534.0 439.0,558 470,558" marker-end="url(#a)"/>
<path class="hand" d="M472,578.5 C441.0,578.5 441.0,629 410,629" marker-end="url(#a)"/>
<path class="hand" d="M408,650.0 C439.0,650.0 439.0,674 470,674" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">安装</text>
<text class="t" x="82" y="118">用 skills.sh 装整套，或订阅 Claude Co</text>
<text class="t" x="82" y="140">de 插件</text>
<text class="c" x="82" y="164">npx skills@latest add mattpocock/skills</text>
<text class="comp" x="82" y="187">组件：skills.sh / 插件</text>
<rect class="card" x="40" y="235" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="235" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="259" r="10"/>
<text class="num" x="62" y="263" text-anchor="middle">2</text>
<text class="ph" x="82" y="264">配置</text>
<text class="t" x="82" y="281">在每个要用的仓库跑一次 setup</text>
<text class="c" x="82" y="305">/setup-matt-pocock-skills</text>
<rect class="cardT" x="472" y="280" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="280" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="304" r="10"/>
<text class="num" x="494" y="308" text-anchor="middle">3</text>
<text class="ph" x="514" y="309">配置</text>
<text class="t" x="514" y="326">问你 issue tracker、标签与文档位置，写入</text>
<text class="t" x="514" y="348">仓库配置</text>
<rect class="card" x="40" y="351" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="351" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="375" r="10"/>
<text class="num" x="62" y="379" text-anchor="middle">4</text>
<text class="ph" x="82" y="380">日常循环</text>
<text class="t" x="82" y="397">每次改动先开一轮 grilling 访谈，而不是丢一</text>
<text class="t" x="82" y="419">段提示词</text>
<text class="c" x="82" y="443">/grill-with-docs</text>
<rect class="cardT" x="472" y="407" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="407" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="431" r="10"/>
<text class="num" x="494" y="435" text-anchor="middle">5</text>
<text class="ph" x="514" y="436">日常循环</text>
<text class="t" x="514" y="453">追问到设计树每个分支收敛，把术语沉淀进</text>
<text class="t" x="514" y="475">CONTEXT.md 和 ADR</text>
<rect class="card" x="40" y="489" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="489" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="513" r="10"/>
<text class="num" x="62" y="517" text-anchor="middle">6</text>
<text class="ph" x="82" y="518">日常循环</text>
<text class="t" x="82" y="535">把讨论定成 spec，再拆成工单</text>
<text class="c" x="82" y="559">/to-spec</text>
<rect class="cardT" x="472" y="534" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="534" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="558" r="10"/>
<text class="num" x="494" y="562" text-anchor="middle">7</text>
<text class="ph" x="514" y="563">日常循环</text>
<text class="t" x="514" y="580">把 spec 和带阻塞关系的工单发到你选的</text>
<text class="t" x="514" y="602">tracker</text>
<rect class="card" x="40" y="605" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="605" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="629" r="10"/>
<text class="num" x="62" y="633" text-anchor="middle">8</text>
<text class="ph" x="82" y="634">日常循环</text>
<text class="t" x="82" y="651">让 agent 按工单开工</text>
<text class="c" x="82" y="675">/implement</text>
<rect class="cardT" x="472" y="650" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="650" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="674" r="10"/>
<text class="num" x="494" y="678" text-anchor="middle">9</text>
<text class="ph" x="514" y="679">日常循环</text>
<text class="t" x="514" y="696">按 /tdd 红绿循环逐片实现，收尾跑两轴</text>
<text class="t" x="514" y="718">/code-review</text>
<rect class="val" x="28" y="771" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="795">价值</text>
<text class="valT" x="48" y="819">每次改动都走同一条循环——先对齐、测试驱动实现、审查后提交——而不必让重型框架接管流程</text>
</svg>
