<svg xmlns="http://www.w3.org/2000/svg" width="880" height="745" viewBox="0 0 880 745" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="745" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="587" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="587" rx="10"/>
<rect class="pillT" x="474" y="40" width="202.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Open Executive does</text>
<path class="edge" d="M62,184 L62,208" marker-end="url(#a)"/>
<path class="hand" d="M408,255.0 C439.0,255.0 439.0,279 470,279" marker-end="url(#a)"/>
<path class="hand" d="M472,299.5 C441.0,299.5 441.0,350 410,350" marker-end="url(#a)"/>
<path class="hand" d="M408,382.0 C439.0,382.0 439.0,406 470,406" marker-end="url(#a)"/>
<path class="hand" d="M472,426.5 C441.0,426.5 441.0,488 410,488" marker-end="url(#a)"/>
<path class="hand" d="M408,508.5 C439.0,508.5 439.0,532 470,532" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Once</text>
<text class="t" x="82" y="118">Copy the env file and add a</text>
<text class="t" x="82" y="140">model-provider key</text>
<text class="c" x="82" y="164">cp .env.example .env</text>
<rect class="card" x="40" y="210" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="210" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="234" r="10"/>
<text class="num" x="62" y="238" text-anchor="middle">2</text>
<text class="ph" x="82" y="239">Once</text>
<text class="t" x="82" y="256">Start the API and the web UI together</text>
<text class="c" x="82" y="280">make dev</text>
<rect class="cardT" x="472" y="255" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="255" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="279" r="10"/>
<text class="num" x="494" y="283" text-anchor="middle">3</text>
<text class="ph" x="514" y="284">Once</text>
<text class="t" x="514" y="301">Serves the UI on :3000 and the API on</text>
<text class="t" x="514" y="323">:8000</text>
<rect class="card" x="40" y="326" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="326" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="350" r="10"/>
<text class="num" x="62" y="354" text-anchor="middle">4</text>
<text class="ph" x="82" y="355">Once</text>
<text class="t" x="82" y="372">Walk the company onboarding wizard in</text>
<text class="t" x="82" y="394">the browser</text>
<text class="c" x="82" y="418">http://localhost:3000</text>
<rect class="cardT" x="472" y="382" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="382" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="406" r="10"/>
<text class="num" x="494" y="410" text-anchor="middle">5</text>
<text class="ph" x="514" y="411">Once</text>
<text class="t" x="514" y="428">Writes company/profile.yaml and seeds</text>
<text class="t" x="514" y="450">the local vector index</text>
<rect class="card" x="40" y="464" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="464" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="488" r="10"/>
<text class="num" x="62" y="492" text-anchor="middle">6</text>
<text class="ph" x="82" y="493">Every turn</text>
<text class="t" x="82" y="510">Ask an executive question in chat or</text>
<text class="t" x="82" y="532">on Slack</text>
<rect class="cardT" x="472" y="508" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="508" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="532" r="10"/>
<text class="num" x="494" y="536" text-anchor="middle">7</text>
<text class="ph" x="514" y="537">Every turn</text>
<text class="t" x="514" y="554">Calls specialists in parallel and</text>
<text class="t" x="514" y="576">answers in one executive voice</text>
<rect class="val" x="28" y="629" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="653">VALUE</text>
<text class="valT" x="48" y="677">You deploy an app and onboard a company profile; you get one executive voice that remembers</text>
<text class="valT" x="48" y="699">decisions, not eight agents to wire yourself</text>
</svg>
