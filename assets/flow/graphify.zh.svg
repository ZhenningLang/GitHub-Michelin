<svg xmlns="http://www.w3.org/2000/svg" width="880" height="684" viewBox="0 0 880 684" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="684" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="548" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="548" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">graphify 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,244 L62,268" marker-end="url(#a)"/>
<path class="hand" d="M408,306.5 C439.0,306.5 439.0,330 470,330" marker-end="url(#a)"/>
<path class="edge" d="M494,381 L494,405" marker-end="url(#a)"/>
<path class="hand" d="M472,444.5 C441.0,444.5 441.0,468 410,468" marker-end="url(#a)"/>
<path class="hand" d="M408,480.5 C439.0,480.5 439.0,532 470,532" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">安装 CLI</text>
<text class="c" x="82" y="125">uv tool install graphifyy</text>
<rect class="card" x="40" y="171" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">把 skill 注册进你的 AI 助手</text>
<text class="c" x="82" y="224">graphify install</text>
<rect class="card" x="40" y="270" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="270" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="294" r="10"/>
<text class="num" x="62" y="298" text-anchor="middle">3</text>
<text class="t" x="82" y="299">在助手里把目录交给它</text>
<text class="c" x="82" y="323">/graphify .</text>
<rect class="cardT" x="472" y="306" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="306" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="330" r="10"/>
<text class="num" x="494" y="334" text-anchor="middle">4</text>
<text class="t" x="514" y="335">本地抽代码 AST，文档图片走模型成语义节点</text>
<text class="comp" x="514" y="363">组件：本地 AST + 语义通道</text>
<rect class="cardT" x="472" y="407" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="407" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="431" r="10"/>
<text class="num" x="494" y="435" text-anchor="middle">5</text>
<text class="t" x="514" y="436">Leiden 聚类，写出 json、html 和报告</text>
<text class="comp" x="514" y="464">组件：graphify-out/</text>
<rect class="card" x="40" y="444" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="444" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="468" r="10"/>
<text class="num" x="62" y="472" text-anchor="middle">6</text>
<text class="t" x="82" y="473">直接问结构问题，不再重读文件</text>
<text class="c" x="82" y="497">graphify query &quot;&lt;question&gt;&quot;</text>
<rect class="cardT" x="472" y="508" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="508" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="532" r="10"/>
<text class="num" x="494" y="536" text-anchor="middle">7</text>
<text class="t" x="514" y="537">返回带 EXTRACTED/INFERRED 置信标签的子图</text>
<rect class="val" x="28" y="590" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="614">价值</text>
<text class="valT" x="48" y="638">agent 从可移植的图里回答“谁调用了它”，不再烧上下文去堆文件</text>
</svg>
