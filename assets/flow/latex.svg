<svg xmlns="http://www.w3.org/2000/svg" width="880" height="633" viewBox="0 0 880 633" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="633" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="475" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="475" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">LaTeX does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,283.0 C439.0,283.0 439.0,307 470,307" marker-end="url(#a)"/>
<path class="hand" d="M472,319.0 C441.0,319.0 441.0,401 410,401" marker-end="url(#a)"/>
<path class="hand" d="M408,413.0 C439.0,413.0 439.0,437 470,437" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install a TeX distribution — not this</text>
<text class="t" x="82" y="123">repository, which the project says is</text>
<text class="t" x="82" y="145">not an install source</text>
<text class="c" x="82" y="169">TeX Live · MacTeX · MiKTeX</text>
<rect class="card" x="40" y="215" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Write a .tex file, declaring the</text>
<text class="t" x="82" y="266">document class and the packages you</text>
<text class="t" x="82" y="288">need</text>
<text class="c" x="82" y="312">\documentclass{article} ·</text>
<text class="c" x="82" y="331">\usepackage[T1]{fontenc}</text>
<rect class="cardT" x="472" y="283" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="283" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="307" r="10"/>
<text class="num" x="494" y="311" text-anchor="middle">3</text>
<text class="t" x="514" y="312">The LaTeX kernel loads that class and</text>
<text class="t" x="514" y="334">resolves every requested package</text>
<rect class="card" x="40" y="377" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="377" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="401" r="10"/>
<text class="num" x="62" y="405" text-anchor="middle">4</text>
<text class="t" x="82" y="406">Process the file with the TeX engine</text>
<text class="t" x="82" y="428">your distribution ships</text>
<rect class="cardT" x="472" y="413" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="413" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="437" r="10"/>
<text class="num" x="494" y="441" text-anchor="middle">5</text>
<text class="t" x="514" y="442">Expands the macros and typesets the</text>
<text class="t" x="514" y="464">document to its output format</text>
<rect class="val" x="28" y="517" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="541">VALUE</text>
<text class="valT" x="48" y="565">Your source compiles on a stack whose language has been stable for four decades and that</text>
<text class="valT" x="48" y="587">every journal template already targets</text>
</svg>
