<svg xmlns="http://www.w3.org/2000/svg" width="880" height="725" viewBox="0 0 880 725" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="725" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="589" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="589" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Evidence 做的</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="edge" d="M62,307 L62,331" marker-end="url(#a)"/>
<path class="hand" d="M408,379.0 C439.0,379.0 439.0,403 470,403" marker-end="url(#a)"/>
<path class="hand" d="M472,427.5 C441.0,427.5 441.0,475 410,475" marker-end="url(#a)"/>
<path class="hand" d="M408,487.5 C439.0,487.5 439.0,526 470,526" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上单文件 CLI</text>
<text class="c" x="82" y="125">curl -fsSL</text>
<text class="c" x="82" y="144">https://evidence.studio/install.sh | sh</text>
<text class="comp" x="82" y="167">组件：evidence CLI</text>
<rect class="card" x="40" y="215" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">建项目，在 connection.yaml 里填好仓库连接</text>
<text class="c" x="82" y="268">evidence init my-project --warehouse</text>
<text class="c" x="82" y="287">snowflake</text>
<rect class="card" x="40" y="333" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">3</text>
<text class="t" x="82" y="362">写一页 Markdown，用图表标签点名表和指标</text>
<text class="c" x="82" y="386">{% line_chart data=&quot;orders&quot; x=&quot;date&quot;</text>
<text class="c" x="82" y="405">y=&quot;sum(sales)&quot; /%}</text>
<rect class="cardT" x="472" y="379" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="379" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="403" r="10"/>
<text class="num" x="494" y="407" text-anchor="middle">4</text>
<text class="t" x="514" y="408">每个图表标签自己生成你仓库方言的 SQL</text>
<text class="t" x="514" y="430"> 并执行</text>
<text class="comp" x="514" y="458">组件：core 渲染器</text>
<rect class="card" x="40" y="451" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="451" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="475" r="10"/>
<text class="num" x="62" y="479" text-anchor="middle">5</text>
<text class="t" x="82" y="480">用官方 serve 镜像把项目跑起来</text>
<text class="c" x="82" y="504">FROM evidencedev/serve:latest</text>
<rect class="cardT" x="472" y="502" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="502" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="526" r="10"/>
<text class="num" x="494" y="530" text-anchor="middle">6</text>
<text class="t" x="514" y="531">每次打开页面都重跑查询，在 Basic Auth 后面</text>
<text class="t" x="514" y="553">把报告发给同事</text>
<text class="comp" x="514" y="581">组件：evidence serve</text>
<rect class="val" x="28" y="631" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="655">价值</text>
<text class="valT" x="48" y="679">报告就是 git 里的文本文件，能 diff、能评审、能让 agent 改，数据实时，不用维护构建流水线</text>
</svg>
