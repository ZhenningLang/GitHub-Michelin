<svg xmlns="http://www.w3.org/2000/svg" width="880" height="756" viewBox="0 0 880 756" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="756" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="620" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="620" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">LightCraft 做的</text>
<path class="hand" d="M408,141.5 C439.0,141.5 439.0,165 470,165" marker-end="url(#a)"/>
<path class="hand" d="M472,189.5 C441.0,189.5 441.0,261 410,261" marker-end="url(#a)"/>
<path class="edge" d="M62,335 L62,359" marker-end="url(#a)"/>
<path class="hand" d="M408,410.0 C439.0,410.0 439.0,434 470,434" marker-end="url(#a)"/>
<path class="hand" d="M472,458.5 C441.0,458.5 441.0,509 410,509" marker-end="url(#a)"/>
<path class="hand" d="M408,522.5 C439.0,522.5 439.0,557 470,557" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好发布版，或从源码直接对一个照片文</text>
<text class="t" x="82" y="123">件夹运行</text>
<text class="c" x="82" y="147">cargo run --release -p lightcraft --</text>
<text class="c" x="82" y="166">~/Pictures/trip</text>
<text class="comp" x="82" y="189">组件：桌面应用</text>
<rect class="cardT" x="472" y="141" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="141" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="165" r="10"/>
<text class="num" x="494" y="169" text-anchor="middle">2</text>
<text class="t" x="514" y="170">原地导入、跳过重复，边解码 RAW 边先显示相</text>
<text class="t" x="514" y="192">机预览</text>
<text class="comp" x="514" y="220">组件：图库 + Rust RAW 解码器</text>
<rect class="card" x="40" y="237" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">3</text>
<text class="t" x="82" y="266">用旗标和星级挑片</text>
<text class="c" x="82" y="290">P · X · U</text>
<text class="comp" x="82" y="313">组件：图库网格</text>
<rect class="card" x="40" y="361" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="361" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="385" r="10"/>
<text class="num" x="62" y="389" text-anchor="middle">4</text>
<text class="t" x="82" y="390">进入编辑或蒙版视图，拖动滑块</text>
<text class="c" x="82" y="414">E · M</text>
<text class="comp" x="82" y="437">组件：冲洗面板</text>
<rect class="cardT" x="472" y="410" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="410" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="434" r="10"/>
<text class="num" x="494" y="438" text-anchor="middle">5</text>
<text class="t" x="514" y="439">把每次改动记成编辑指令，在 GPU 上重渲染，</text>
<text class="t" x="514" y="461">原片不动</text>
<text class="comp" x="514" y="489">组件：wgpu 冲洗流水线</text>
<rect class="card" x="40" y="485" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="485" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="509" r="10"/>
<text class="num" x="62" y="513" text-anchor="middle">6</text>
<text class="t" x="82" y="514">按尺寸、格式和命名规则导出选中的照片</text>
<text class="comp" x="82" y="542">组件：导出对话框</text>
<rect class="cardT" x="472" y="533" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="533" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="557" r="10"/>
<text class="num" x="494" y="561" text-anchor="middle">7</text>
<text class="t" x="514" y="562">写出 JPEG／TIFF／WebP／AVIF／DNG 等，带</text>
<text class="t" x="514" y="584">输出锐化</text>
<text class="comp" x="514" y="612">组件：导出器</text>
<rect class="val" x="28" y="662" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="686">价值</text>
<text class="valT" x="48" y="710">在自己电脑上完成 Lightroom 式的挑片、冲洗和导出：不用订阅，不要账号，图库不上云</text>
</svg>
