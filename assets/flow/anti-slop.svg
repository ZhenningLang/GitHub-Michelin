<svg xmlns="http://www.w3.org/2000/svg" width="880" height="712" viewBox="0 0 880 712" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="712" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="554" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="554" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">antislop does</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="hand" d="M472,203.0 C441.0,203.0 441.0,242 410,242" marker-end="url(#a)"/>
<path class="hand" d="M408,265.0 C439.0,265.0 439.0,324 470,324" marker-end="url(#a)"/>
<path class="edge" d="M494,419 L494,443" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Run the installer and pick the skills,</text>
<text class="t" x="82" y="123">the scope and the agents you use</text>
<text class="c" x="82" y="147">npx antislop-ai</text>
<text class="comp" x="82" y="170">component: installer CLI (antislop-ai)</text>
<rect class="cardT" x="472" y="132" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">Copies the skill folders into each</text>
<text class="t" x="514" y="183">agent&#x27;s skills dir and appends a</text>
<text class="t" x="514" y="205">pointer block to the entry file</text>
<text class="c" x="514" y="229">&lt;!-- antislop:start --&gt;</text>
<text class="comp" x="514" y="252">component: pointer block in the entry file</text>
<rect class="card" x="40" y="218" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="218" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="242" r="10"/>
<text class="num" x="62" y="246" text-anchor="middle">3</text>
<text class="t" x="82" y="247">In a new session, give the UI, copy or</text>
<text class="t" x="82" y="269">comment task and answer During or</text>
<text class="t" x="82" y="291">After</text>
<rect class="cardT" x="472" y="300" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="300" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="324" r="10"/>
<text class="num" x="494" y="328" text-anchor="middle">4</text>
<text class="t" x="514" y="329">Loads the core plus the matching skill</text>
<text class="t" x="514" y="351">and applies the 38 rules while it</text>
<text class="t" x="514" y="373">builds</text>
<text class="comp" x="514" y="401">component: core skill + antislop-ui etc.</text>
<rect class="cardT" x="472" y="445" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="445" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="469" r="10"/>
<text class="num" x="494" y="473" text-anchor="middle">5</text>
<text class="t" x="514" y="474">Before handing over, writes a</text>
<text class="t" x="514" y="496">PASS/FAIL Delivery Gate report with</text>
<text class="t" x="514" y="518">evidence for every item</text>
<text class="comp" x="514" y="546">component: Delivery Gate</text>
<rect class="val" x="28" y="596" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="620">VALUE</text>
<text class="valT" x="48" y="644">You stop combing agent output by hand for invented stats, dead buttons and fake testimonials:</text>
<text class="valT" x="48" y="666">the agent has to report each check</text>
</svg>
