<svg xmlns="http://www.w3.org/2000/svg" width="880" height="698" viewBox="0 0 880 698" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="698" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="562" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="562" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Kombu 做的</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="hand" d="M408,251.5 C439.0,251.5 439.0,275 470,275" marker-end="url(#a)"/>
<path class="hand" d="M472,299.5 C441.0,299.5 441.0,357 410,357" marker-end="url(#a)"/>
<path class="hand" d="M408,379.0 C439.0,379.0 439.0,403 470,403" marker-end="url(#a)"/>
<path class="hand" d="M472,404.0 C441.0,404.0 441.0,475 410,475" marker-end="url(#a)"/>
<path class="hand" d="M408,500.0 C439.0,500.0 439.0,524 470,524" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把 Kombu 装进你的 Python 服务</text>
<text class="c" x="82" y="125">pip install kombu</text>
<text class="comp" x="82" y="148">组件：应用环境</text>
<rect class="card" x="40" y="196" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">用对象声明 exchange/queue，按 URL 开连接</text>
<text class="c" x="82" y="249">with</text>
<text class="c" x="82" y="268">Connection(&#x27;amqp://guest:guest@localhost//</text>
<text class="c" x="82" y="287">&#x27;) as conn:</text>
<rect class="cardT" x="472" y="251" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="251" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="275" r="10"/>
<text class="num" x="494" y="279" text-anchor="middle">3</text>
<text class="t" x="514" y="280">同一传输接口管尽 amqp、redis、SQS </text>
<text class="t" x="514" y="302">数种后端</text>
<text class="comp" x="514" y="330">组件：传输层</text>
<rect class="card" x="40" y="333" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">4</text>
<text class="t" x="82" y="362">经 Producer 发布消息，随消息声明队列</text>
<text class="c" x="82" y="386">producer =</text>
<text class="c" x="82" y="405">conn.Producer(serializer=&#x27;json&#x27;)</text>
<rect class="cardT" x="472" y="379" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="379" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="403" r="10"/>
<text class="num" x="494" y="407" text-anchor="middle">5</text>
<text class="t" x="514" y="408">序列化载荷并路由到绑定的队列</text>
<rect class="card" x="40" y="451" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="451" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="475" r="10"/>
<text class="num" x="62" y="479" text-anchor="middle">6</text>
<text class="t" x="82" y="480">用回调列表加事件循环来消费</text>
<text class="c" x="82" y="504">conn.drain_events()</text>
<text class="comp" x="82" y="527">组件：Consumer</text>
<rect class="cardT" x="472" y="500" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="500" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="524" r="10"/>
<text class="num" x="494" y="528" text-anchor="middle">7</text>
<text class="t" x="514" y="529">把每条消息派发给你的回调，由</text>
<text class="t" x="514" y="551">message.ack() 确认</text>
<rect class="val" x="28" y="604" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="628">价值</text>
<text class="valT" x="48" y="652">一套生产/消费 API 横跨 AMQP、Redis、SQS 等——换 broker 只是换 URL，不是重写</text>
</svg>
