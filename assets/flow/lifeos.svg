<svg xmlns="http://www.w3.org/2000/svg" width="880" height="999" viewBox="0 0 880 999" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="999" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="841" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="841" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">LifeOS does</text>
<path class="hand" d="M408,152.5 C439.0,152.5 439.0,176 470,176" marker-end="url(#a)"/>
<path class="edge" d="M494,272 L494,296" marker-end="url(#a)"/>
<path class="edge" d="M494,440 L494,464" marker-end="url(#a)"/>
<path class="hand" d="M472,537.0 C441.0,537.0 441.0,561 410,561" marker-end="url(#a)"/>
<path class="hand" d="M408,597.0 C439.0,597.0 439.0,658 470,658" marker-end="url(#a)"/>
<path class="edge" d="M494,706 L494,730" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="161" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="161" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Hand the install page to the AI</text>
<text class="t" x="82" y="123">harness you already use and ask it to</text>
<text class="t" x="82" y="145">install</text>
<text class="c" x="82" y="169">Read https://ourlifeos.ai/install and</text>
<text class="c" x="82" y="188">install LifeOS for me.</text>
<text class="comp" x="82" y="211">component: Agentic installer skill</text>
<rect class="cardT" x="472" y="152" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="152" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="176" r="10"/>
<text class="num" x="494" y="180" text-anchor="middle">2</text>
<text class="t" x="514" y="181">Detects your OS, harness, and config</text>
<text class="t" x="514" y="203">root — no path is assumed</text>
<text class="c" x="514" y="227">bun Tools/DetectEnv.ts</text>
<text class="comp" x="514" y="250">component: DetectEnv.ts</text>
<rect class="cardT" x="472" y="298" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="298" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="322" r="10"/>
<text class="num" x="494" y="326" text-anchor="middle">3</text>
<text class="t" x="514" y="327">Copies the skill, runtime, and empty</text>
<text class="t" x="514" y="349">USER tree into the config root —</text>
<text class="t" x="514" y="371">additive, dry-run first</text>
<text class="c" x="514" y="395">bun Tools/DeployCore.ts --apply</text>
<text class="comp" x="514" y="418">component: DeployCore.ts</text>
<rect class="cardT" x="472" y="466" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="466" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="490" r="10"/>
<text class="num" x="494" y="494" text-anchor="middle">4</text>
<text class="t" x="514" y="495">With your yes per step, merges the</text>
<text class="t" x="514" y="517">hooks and wires the lifeos launch</text>
<text class="t" x="514" y="539">command</text>
<text class="c" x="514" y="563">bun Tools/InstallHooks.ts --apply</text>
<text class="comp" x="514" y="586">component: InstallHooks.ts + launcher</text>
<rect class="card" x="40" y="537" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="537" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="561" r="10"/>
<text class="num" x="62" y="565" text-anchor="middle">5</text>
<text class="t" x="82" y="566">Launch with the new command and ask</text>
<text class="t" x="82" y="588">for the onboarding interview</text>
<text class="c" x="82" y="612">lifeos</text>
<text class="comp" x="82" y="635">component: Interview workflow</text>
<rect class="cardT" x="472" y="634" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="634" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="658" r="10"/>
<text class="num" x="494" y="662" text-anchor="middle">6</text>
<text class="t" x="514" y="663">Captures your TELOS — goals, people,</text>
<text class="t" x="514" y="685">preferences — into your USER tree</text>
<rect class="cardT" x="472" y="732" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="732" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="756" r="10"/>
<text class="num" x="494" y="760" text-anchor="middle">7</text>
<text class="t" x="514" y="761">Every later turn loads your</text>
<text class="t" x="514" y="783">constitution and context; Pulse shows</text>
<text class="t" x="514" y="805">current → ideal state</text>
<text class="comp" x="514" y="833">component: Pulse dashboard (:31337)</text>
<rect class="val" x="28" y="883" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="907">VALUE</text>
<text class="valT" x="48" y="931">You stop re-explaining who you are: every AI session starts from your captured context</text>
<text class="valT" x="48" y="953">instead of zero.</text>
</svg>
