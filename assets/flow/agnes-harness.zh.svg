<svg xmlns="http://www.w3.org/2000/svg" width="880" height="585" viewBox="0 0 880 585" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="585" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="449" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="449" rx="10"/>
<rect class="pillT" x="474" y="40" width="187.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agnes Harness 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,221 L62,245" marker-end="url(#a)"/>
<path class="hand" d="M408,283.5 C439.0,283.5 439.0,307 470,307" marker-end="url(#a)"/>
<path class="hand" d="M472,320.5 C441.0,320.5 441.0,370 410,370" marker-end="url(#a)"/>
<path class="hand" d="M408,382.5 C439.0,382.5 439.0,408 470,408" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">构建本地运行时，启动回环工作台</text>
<text class="c" x="82" y="125">pnpm --filter @agnes/cli build:local</text>
<rect class="card" x="40" y="171" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">配置模型账户，确认工作目录</text>
<rect class="card" x="40" y="247" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="247" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="271" r="10"/>
<text class="num" x="62" y="275" text-anchor="middle">3</text>
<text class="t" x="82" y="276">安装示例工具，审核摘要后启用</text>
<text class="c" x="82" y="300">file:./examples/packages/hot-tool-plugin</text>
<rect class="cardT" x="472" y="283" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="283" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="307" r="10"/>
<text class="num" x="494" y="311" text-anchor="middle">4</text>
<text class="t" x="514" y="312">准入审核过的插件，注册文字统计工具</text>
<text class="comp" x="514" y="340">组件：包管理器与 Host</text>
<rect class="card" x="40" y="346" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="346" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="370" r="10"/>
<text class="num" x="62" y="374" text-anchor="middle">5</text>
<text class="t" x="82" y="375">要求模型调用工具统计 hello world</text>
<text class="c" x="82" y="399">demo_text_stats</text>
<rect class="cardT" x="472" y="384" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="384" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="408" r="10"/>
<text class="num" x="494" y="412" text-anchor="middle">6</text>
<text class="t" x="514" y="413">执行选中的工具，把结构统计结果记入共享会话</text>
<text class="comp" x="514" y="441">组件：Core 与共享会话</text>
<rect class="val" x="28" y="491" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="515">价值</text>
<text class="valT" x="48" y="539">复用已安装业务工具，并保留共享且可检查的执行记录</text>
</svg>
