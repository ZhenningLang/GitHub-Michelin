<svg xmlns="http://www.w3.org/2000/svg" width="880" height="731" viewBox="0 0 880 731" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="731" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="595" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="595" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenViking 做的</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="hand" d="M408,295.5 C439.0,295.5 439.0,319 470,319" marker-end="url(#a)"/>
<path class="hand" d="M472,344.0 C441.0,344.0 441.0,404 410,404" marker-end="url(#a)"/>
<path class="hand" d="M408,429.0 C439.0,429.0 439.0,453 470,453" marker-end="url(#a)"/>
<path class="edge" d="M494,504 L494,528" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好服务端并起进程，接上 embedding </text>
<text class="t" x="82" y="123">与视觉模型</text>
<text class="c" x="82" y="147">pip install openviking --upgrade ·</text>
<text class="c" x="82" y="166">openviking-server init</text>
<text class="comp" x="82" y="189">组件：openviking-server</text>
<rect class="card" x="40" y="237" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">把要长期留住的仓库与文档喂进去</text>
<text class="c" x="82" y="290">ov add-resource</text>
<text class="c" x="82" y="309">https://github.com/volcengine/OpenViking</text>
<text class="comp" x="82" y="332">组件：ov 命令行</text>
<rect class="cardT" x="472" y="295" width="368" height="98" rx="8"/>
<rect class="accT" x="472" y="295" width="4" height="98" rx="2"/>
<circle class="accT" cx="494" cy="319" r="10"/>
<text class="num" x="494" y="323" text-anchor="middle">3</text>
<text class="t" x="514" y="324">解析、建目录树、后台写 L0/L1 摘要、建索引</text>
<text class="c" x="514" y="348">.abstract.md · .overview.md</text>
<text class="comp" x="514" y="371">组件：SemanticQueue</text>
<rect class="card" x="40" y="380" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="380" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="404" r="10"/>
<text class="num" x="62" y="408" text-anchor="middle">4</text>
<text class="t" x="82" y="409">给你已经在用的编码 agent 装上记忆插件</text>
<text class="c" x="82" y="433">install.sh --harness claude</text>
<text class="comp" x="82" y="456">组件：memory-plugin-shared</text>
<rect class="cardT" x="472" y="429" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="429" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="453" r="10"/>
<text class="num" x="494" y="457" text-anchor="middle">5</text>
<text class="t" x="514" y="458">每次提问先召回并注入记忆，每轮回答后捕获</text>
<text class="comp" x="514" y="486">组件：hooks + MCP 代理</text>
<rect class="cardT" x="472" y="530" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="530" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="554" r="10"/>
<text class="num" x="494" y="558" text-anchor="middle">6</text>
<text class="t" x="514" y="559">归档会话，把对话抽成记忆，与旧记忆去重合并</text>
<text class="comp" x="514" y="587">组件：session commit</text>
<rect class="val" x="28" y="637" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="661">价值</text>
<text class="valT" x="48" y="685">你不用再手写记忆文件，也不用每次重新交代背景</text>
</svg>
