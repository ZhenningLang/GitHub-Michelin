<svg xmlns="http://www.w3.org/2000/svg" width="880" height="722" viewBox="0 0 880 722" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="722" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="586" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="586" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Dagster 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="edge" d="M62,285 L62,309" marker-end="url(#a)"/>
<path class="hand" d="M408,347.5 C439.0,347.5 439.0,371 470,371" marker-end="url(#a)"/>
<path class="edge" d="M494,422 L494,446" marker-end="url(#a)"/>
<path class="edge" d="M494,520 L494,544" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用脚手架生成 Dagster 项目并安装</text>
<text class="c" x="82" y="125">uvx create-dagster@latest project</text>
<text class="c" x="82" y="144">dagster-quickstart</text>
<rect class="card" x="40" y="190" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">把每张表或模型写成带装饰器的函数，参</text>
<text class="t" x="82" y="241">数即上游</text>
<text class="c" x="82" y="265">@dg.asset</text>
<rect class="card" x="40" y="311" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">3</text>
<text class="t" x="82" y="340">在本地启动 Dagster</text>
<text class="c" x="82" y="364">dg dev</text>
<rect class="cardT" x="472" y="347" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="347" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="371" r="10"/>
<text class="num" x="494" y="375" text-anchor="middle">4</text>
<text class="t" x="514" y="376">构建资产依赖图，在界面上展示血缘</text>
<text class="comp" x="514" y="404">组件：界面（localhost:3000）</text>
<rect class="cardT" x="472" y="448" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="448" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="472" r="10"/>
<text class="num" x="494" y="476" text-anchor="middle">5</text>
<text class="t" x="514" y="477">点 Materialize 或定时触发时，按依赖顺序运</text>
<text class="t" x="514" y="499">行并保存产出</text>
<rect class="cardT" x="472" y="546" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="546" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="570" r="10"/>
<text class="num" x="494" y="574" text-anchor="middle">6</text>
<text class="t" x="514" y="575">记录每次物化及其元数据，过期的资产一眼可见</text>
<rect class="val" x="28" y="628" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="652">价值</text>
<text class="valT" x="48" y="676">哪份数据过期了、谁构建的、谁依赖它，都能直接回答，不用翻 cron 日志</text>
</svg>
