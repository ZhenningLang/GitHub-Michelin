<svg xmlns="http://www.w3.org/2000/svg" width="880" height="874" viewBox="0 0 880 874" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="874" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="716" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="716" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">CCBaga does</text>
<path class="edge" d="M62,166 L62,190" marker-end="url(#a)"/>
<path class="edge" d="M62,286 L62,310" marker-end="url(#a)"/>
<path class="hand" d="M408,348.0 C439.0,348.0 439.0,372 470,372" marker-end="url(#a)"/>
<path class="edge" d="M494,486 L494,510" marker-end="url(#a)"/>
<path class="edge" d="M494,606 L494,630" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">After rights and recovery review,</text>
<text class="t" x="82" y="123">prepare A and B in a disposable</text>
<text class="t" x="82" y="145">desktop environment</text>
<rect class="card" x="40" y="192" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="192" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="216" r="10"/>
<text class="num" x="62" y="220" text-anchor="middle">2</text>
<text class="t" x="82" y="221">Choose a saved or empty identity and</text>
<text class="t" x="82" y="243">what stays shared; save unfinished</text>
<text class="t" x="82" y="265">work</text>
<rect class="card" x="40" y="312" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="312" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="336" r="10"/>
<text class="num" x="62" y="340" text-anchor="middle">3</text>
<text class="t" x="82" y="341">Confirm archiving and switching,</text>
<text class="t" x="82" y="363">including recognized-client closure</text>
<rect class="cardT" x="472" y="348" width="368" height="138" rx="8"/>
<rect class="accT" x="472" y="348" width="4" height="138" rx="2"/>
<circle class="accT" cx="494" cy="372" r="10"/>
<text class="num" x="494" y="376" text-anchor="middle">4</text>
<text class="t" x="514" y="377">Stop recognized clients; verify the</text>
<text class="t" x="514" y="399">target and save/authenticate outgoing</text>
<text class="t" x="514" y="421">state</text>
<text class="comp" x="514" y="449">component: native store and encrypted</text>
<text class="comp" x="514" y="468">archive</text>
<rect class="cardT" x="472" y="512" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="512" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="536" r="10"/>
<text class="num" x="494" y="540" text-anchor="middle">5</text>
<text class="t" x="514" y="541">Journal recovery state, replace</text>
<text class="t" x="514" y="563">selected files and restore target</text>
<text class="t" x="514" y="585">credentials</text>
<rect class="cardT" x="472" y="632" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="632" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="656" r="10"/>
<text class="num" x="494" y="660" text-anchor="middle">6</text>
<text class="t" x="514" y="661">Commit the identity/profile choice;</text>
<text class="t" x="514" y="683">reopen the linked browser or report</text>
<text class="t" x="514" y="705">the failure</text>
<rect class="val" x="28" y="758" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="782">VALUE</text>
<text class="valT" x="48" y="806">Selected default Claude state moves without manual folder juggling; recovery remains</text>
<text class="valT" x="48" y="828">conditional</text>
</svg>
