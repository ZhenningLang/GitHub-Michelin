<svg xmlns="http://www.w3.org/2000/svg" width="880" height="849" viewBox="0 0 880 849" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="849" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="691" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="691" rx="10"/>
<rect class="pillT" x="474" y="40" width="276.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Tech-Doc-Style-Chinese does</text>
<path class="hand" d="M408,151.0 C439.0,151.0 439.0,175 470,175" marker-end="url(#a)"/>
<path class="hand" d="M472,199.5 C441.0,199.5 441.0,280 410,280" marker-end="url(#a)"/>
<path class="hand" d="M408,313.0 C439.0,313.0 439.0,337 470,337" marker-end="url(#a)"/>
<path class="edge" d="M494,432 L494,456" marker-end="url(#a)"/>
<path class="edge" d="M494,555 L494,579" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="158" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="158" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the skill into Claude Code or</text>
<text class="t" x="82" y="123">Codex</text>
<text class="c" x="82" y="147">npx skills add</text>
<text class="c" x="82" y="166">https://github.com/Fenng/tech-doc-style-ch</text>
<text class="c" x="82" y="185">inese</text>
<text class="comp" x="82" y="208">component: SKILL.md + references/</text>
<rect class="cardT" x="472" y="151" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="151" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="175" r="10"/>
<text class="num" x="494" y="179" text-anchor="middle">2</text>
<text class="t" x="514" y="180">Auto-fires on Chinese writing tasks</text>
<text class="t" x="514" y="202">from its description</text>
<text class="comp" x="514" y="230">component: SKILL.md frontmatter</text>
<rect class="card" x="40" y="256" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="256" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="280" r="10"/>
<text class="num" x="62" y="284" text-anchor="middle">3</text>
<text class="t" x="82" y="285">Hand over the draft and name the task</text>
<text class="t" x="82" y="307">mode</text>
<text class="c" x="82" y="331">Use $tech-doc-style-chinese to rewrite</text>
<text class="c" x="82" y="350">this Chinese technical copy.</text>
<rect class="cardT" x="472" y="313" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="313" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="337" r="10"/>
<text class="num" x="494" y="341" text-anchor="middle">4</text>
<text class="t" x="514" y="342">Marks facts, limits and</text>
<text class="t" x="514" y="364">machine-readable spans as no-touch</text>
<text class="t" x="514" y="386">boundaries</text>
<text class="comp" x="514" y="414">component: SKILL.md editing flow</text>
<rect class="cardT" x="472" y="458" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="458" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="482" r="10"/>
<text class="num" x="494" y="486" text-anchor="middle">5</text>
<text class="t" x="514" y="487">Reads the one reference matching the</text>
<text class="t" x="514" y="509">content type</text>
<text class="comp" x="514" y="537">component: references/*.md</text>
<rect class="cardT" x="472" y="581" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="581" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="605" r="10"/>
<text class="num" x="494" y="609" text-anchor="middle">6</text>
<text class="t" x="514" y="610">Rewrites by rule priority, then runs</text>
<text class="t" x="514" y="632">the copy linter</text>
<text class="c" x="514" y="656">python scripts/lint_copy_rules.py .</text>
<text class="comp" x="514" y="679">component: scripts/lint_copy_rules.py</text>
<rect class="val" x="28" y="733" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="757">VALUE</text>
<text class="valT" x="48" y="781">Chinese docs that read native: facts and code untouched, warnings gated by a CI-runnable</text>
<text class="valT" x="48" y="803">linter</text>
</svg>
