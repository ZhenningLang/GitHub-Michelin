<svg xmlns="http://www.w3.org/2000/svg" width="880" height="534" viewBox="0 0 880 534" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="534" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="376" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="376" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Applite does</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,166.0 C441.0,166.0 441.0,217 410,217" marker-end="url(#a)"/>
<path class="hand" d="M408,229.0 C439.0,229.0 439.0,263 470,263" marker-end="url(#a)"/>
<path class="hand" d="M472,275.0 C441.0,275.0 441.0,315 410,315" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the DMG or the cask and open</text>
<text class="t" x="82" y="123">it</text>
<text class="c" x="82" y="147">brew install --cask applite</text>
<rect class="cardT" x="472" y="119" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">On first launch downloads its own</text>
<text class="t" x="514" y="170">Homebrew into Application Support and</text>
<text class="t" x="514" y="192">runs it in API mode</text>
<rect class="card" x="40" y="193" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">Browse the handpicked gallery or</text>
<text class="t" x="82" y="244">search the whole cask catalogue</text>
<rect class="cardT" x="472" y="239" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="239" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="263" r="10"/>
<text class="num" x="494" y="267" text-anchor="middle">4</text>
<text class="t" x="514" y="268">Installs the cask through that brew</text>
<text class="t" x="514" y="290">copy and reports progress in place</text>
<rect class="card" x="40" y="291" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="291" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="315" r="10"/>
<text class="num" x="62" y="319" text-anchor="middle">5</text>
<text class="t" x="82" y="320">Export a Brewfile so the same apps</text>
<text class="t" x="82" y="342">come back on the next Mac</text>
<text class="c" x="82" y="366">Brewfile</text>
<rect class="val" x="28" y="418" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="442">VALUE</text>
<text class="valT" x="48" y="466">An App Store experience on a Mac that has never had Terminal or the Xcode Command Line Tools</text>
<text class="valT" x="48" y="488">installed</text>
</svg>
