<svg xmlns="http://www.w3.org/2000/svg" width="880" height="647" viewBox="0 0 880 647" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="647" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="511" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="511" rx="10"/>
<rect class="pillT" x="474" y="40" width="204.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Spec Kit 与智能体做的</text>
<path class="hand" d="M408,130.5 C439.0,130.5 439.0,154 470,154" marker-end="url(#a)"/>
<path class="hand" d="M472,166.0 C441.0,166.0 441.0,239 410,239" marker-end="url(#a)"/>
<path class="hand" d="M408,251.5 C439.0,251.5 439.0,275 470,275" marker-end="url(#a)"/>
<path class="hand" d="M472,288.5 C441.0,288.5 441.0,338 410,338" marker-end="url(#a)"/>
<path class="hand" d="M408,350.5 C439.0,350.5 439.0,376 470,376" marker-end="url(#a)"/>
<path class="hand" d="M472,377.0 C441.0,377.0 441.0,437 410,437" marker-end="url(#a)"/>
<path class="hand" d="M408,449.5 C439.0,449.5 439.0,473 470,473" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好 CLI，为你的智能体初始化项目</text>
<text class="c" x="82" y="125">specify init my-project --integration</text>
<text class="c" x="82" y="144">copilot</text>
<text class="comp" x="82" y="167">组件：specify 命令行</text>
<rect class="cardT" x="472" y="130" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="130" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="154" r="10"/>
<text class="num" x="494" y="158" text-anchor="middle">2</text>
<text class="t" x="514" y="159">把 spec、方案、任务模板、脚本和</text>
<text class="t" x="514" y="181">/speckit-* 技能写进项目</text>
<rect class="card" x="40" y="215" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">3</text>
<text class="t" x="82" y="244">在智能体对话里说清要做什么、为什么</text>
<text class="c" x="82" y="268">/speckit-specify</text>
<rect class="cardT" x="472" y="251" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="251" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="275" r="10"/>
<text class="num" x="494" y="279" text-anchor="middle">4</text>
<text class="t" x="514" y="280">智能体按模板写出 specs/NNN-功能/spec.md</text>
<text class="comp" x="514" y="308">组件：你的编码智能体</text>
<rect class="card" x="40" y="314" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">5</text>
<text class="t" x="82" y="343">审过 spec，再给出技术栈</text>
<text class="c" x="82" y="367">/speckit-plan · /speckit-tasks</text>
<rect class="cardT" x="472" y="352" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="352" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="376" r="10"/>
<text class="num" x="494" y="380" text-anchor="middle">6</text>
<text class="t" x="514" y="381">写出技术方案和有顺序的任务清单</text>
<rect class="card" x="40" y="413" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="413" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="437" r="10"/>
<text class="num" x="62" y="441" text-anchor="middle">7</text>
<text class="t" x="82" y="442">启动实现和对照检查</text>
<text class="c" x="82" y="466">/speckit-implement · /speckit-converge</text>
<rect class="cardT" x="472" y="449" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="449" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="473" r="10"/>
<text class="num" x="494" y="477" text-anchor="middle">8</text>
<text class="t" x="514" y="478">逐个任务实现；converge 把没做完的追加成任</text>
<text class="t" x="514" y="500">务，直到 Converged</text>
<rect class="val" x="28" y="553" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="577">价值</text>
<text class="valT" x="48" y="601">每个功能都留下 spec、方案和任务清单，评审能拿它们对照代码</text>
</svg>
