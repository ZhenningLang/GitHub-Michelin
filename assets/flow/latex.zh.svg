<svg xmlns="http://www.w3.org/2000/svg" width="880" height="523" viewBox="0 0 880 523" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="523" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="387" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="387" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">LaTeX 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,239.0 C439.0,239.0 439.0,263 470,263" marker-end="url(#a)"/>
<path class="hand" d="M472,275.0 C441.0,275.0 441.0,335 410,335" marker-end="url(#a)"/>
<path class="hand" d="M408,336.0 C439.0,336.0 439.0,371 470,371" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">安装一个 TeX 发行版——不是本仓库，项目明确</text>
<text class="t" x="82" y="123">说它不是安装源</text>
<text class="c" x="82" y="147">TeX Live · MacTeX · MiKTeX</text>
<rect class="card" x="40" y="193" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">写一个 .tex 文件，声明文档类与需要的宏包</text>
<text class="c" x="82" y="246">\documentclass{article} ·</text>
<text class="c" x="82" y="265">\usepackage[T1]{fontenc}</text>
<rect class="cardT" x="472" y="239" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="239" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="263" r="10"/>
<text class="num" x="494" y="267" text-anchor="middle">3</text>
<text class="t" x="514" y="268">LaTeX 内核加载该文档类，并逐个解析所</text>
<text class="t" x="514" y="290">请求的宏包</text>
<rect class="card" x="40" y="311" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">4</text>
<text class="t" x="82" y="340">用发行版自带的 TeX 引擎加工这个文件</text>
<rect class="cardT" x="472" y="347" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="347" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="371" r="10"/>
<text class="num" x="494" y="375" text-anchor="middle">5</text>
<text class="t" x="514" y="376">做宏展开，并把文档排成目标输出格式</text>
<rect class="val" x="28" y="429" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="453">价值</text>
<text class="valT" x="48" y="477">你的源文件跑在一套语言稳定了四十年、且每一份期刊模板都已适配的栈上</text>
</svg>
