<svg xmlns="http://www.w3.org/2000/svg" width="880" height="708" viewBox="0 0 880 708" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="708" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="572" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="572" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Whisper 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,236.0 C439.0,236.0 439.0,260 470,260" marker-end="url(#a)"/>
<path class="edge" d="M494,309 L494,333" marker-end="url(#a)"/>
<path class="edge" d="M494,407 L494,431" marker-end="url(#a)"/>
<path class="edge" d="M494,483 L494,507" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好 ffmpeg 命令行和 Whisper 包</text>
<text class="c" x="82" y="125">brew install ffmpeg · pip install -U</text>
<text class="c" x="82" y="144">openai-whisper</text>
<rect class="card" x="40" y="190" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">把音频文件交给它，选一个模型尺寸</text>
<text class="c" x="82" y="243">whisper audio.flac audio.mp3 audio.wav</text>
<text class="c" x="82" y="262">--model turbo</text>
<rect class="cardT" x="472" y="236" width="368" height="73" rx="8"/>
<rect class="accT" x="472" y="236" width="4" height="73" rx="2"/>
<circle class="accT" cx="494" cy="260" r="10"/>
<text class="num" x="494" y="264" text-anchor="middle">3</text>
<text class="t" x="514" y="265">首次使用时下载模型权重，缓存在本地</text>
<text class="c" x="514" y="289">~/.cache/whisper</text>
<rect class="cardT" x="472" y="335" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="335" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="359" r="10"/>
<text class="num" x="494" y="363" text-anchor="middle">4</text>
<text class="t" x="514" y="364">用 ffmpeg 解码成 16 kHz 音频，切成 30 秒</text>
<text class="t" x="514" y="386">一段的频谱图窗口</text>
<rect class="cardT" x="472" y="433" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="433" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="457" r="10"/>
<text class="num" x="494" y="461" text-anchor="middle">5</text>
<text class="t" x="514" y="462">识别语种，逐个窗口写出带时间戳的文字</text>
<rect class="cardT" x="472" y="509" width="368" height="73" rx="8"/>
<rect class="accT" x="472" y="509" width="4" height="73" rx="2"/>
<circle class="accT" cx="494" cy="533" r="10"/>
<text class="num" x="494" y="537" text-anchor="middle">6</text>
<text class="t" x="514" y="538">为每个输入文件写出全部输出格式</text>
<text class="c" x="514" y="562">txt · srt · vtt</text>
<rect class="val" x="28" y="614" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="638">价值</text>
<text class="valT" x="48" y="662">多语种的可检索文字稿和可直接加载的字幕，在自己的机器上生成，不按分钟付费</text>
</svg>
