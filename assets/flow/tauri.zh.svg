<svg xmlns="http://www.w3.org/2000/svg" width="880" height="849" viewBox="0 0 880 849" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="849" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="713" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="713" rx="10"/>
<rect class="pillT" x="474" y="40" width="114.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Tauri 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,244 L62,268" marker-end="url(#a)"/>
<path class="edge" d="M62,343 L62,367" marker-end="url(#a)"/>
<path class="hand" d="M408,405.5 C439.0,405.5 439.0,429 470,429" marker-end="url(#a)"/>
<path class="edge" d="M494,502 L494,526" marker-end="url(#a)"/>
<path class="hand" d="M472,564.0 C441.0,564.0 441.0,588 410,588" marker-end="url(#a)"/>
<path class="hand" d="M408,600.5 C439.0,600.5 439.0,650 470,650" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">生成项目骨架，选好前端框架</text>
<text class="c" x="82" y="125">npm create tauri-app@latest</text>
<rect class="card" x="40" y="171" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">把原生能力写成 Rust 函数，标成命令</text>
<text class="c" x="82" y="224">#[tauri::command]</text>
<rect class="card" x="40" y="270" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="270" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="294" r="10"/>
<text class="num" x="62" y="298" text-anchor="middle">3</text>
<text class="t" x="82" y="299">在前端代码里调用这个命令</text>
<text class="c" x="82" y="323">invoke(&quot;my_custom_command&quot;)</text>
<rect class="card" x="40" y="369" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="369" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="393" r="10"/>
<text class="num" x="62" y="397" text-anchor="middle">4</text>
<text class="t" x="82" y="398">启动开发模式</text>
<text class="c" x="82" y="422">npm run tauri dev</text>
<rect class="cardT" x="472" y="405" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="405" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="429" r="10"/>
<text class="num" x="494" y="433" text-anchor="middle">5</text>
<text class="t" x="514" y="434">编译 Rust 部分，打开原生窗口，用系统自带的</text>
<text class="t" x="514" y="456">webview 渲染界面</text>
<text class="comp" x="514" y="484">组件：WRY + TAO</text>
<rect class="cardT" x="472" y="528" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="528" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="552" r="10"/>
<text class="num" x="494" y="556" text-anchor="middle">6</text>
<text class="t" x="514" y="557">把每次 invoke 经桥接层转给你的 Rust 函</text>
<text class="t" x="514" y="579">数，再把结果送回</text>
<rect class="card" x="40" y="564" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="564" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="588" r="10"/>
<text class="num" x="62" y="592" text-anchor="middle">7</text>
<text class="t" x="82" y="593">打发布包</text>
<text class="c" x="82" y="617">npm run tauri build</text>
<rect class="cardT" x="472" y="626" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="626" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="650" r="10"/>
<text class="num" x="494" y="654" text-anchor="middle">8</text>
<text class="t" x="514" y="655">产出 .msi、.dmg、.AppImage 等原生安装包，</text>
<text class="t" x="514" y="677">不带浏览器内核</text>
<text class="comp" x="514" y="705">组件：tauri-bundler</text>
<rect class="val" x="28" y="755" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="779">价值</text>
<text class="valT" x="48" y="803">用 Web 技能做出桌面应用，安装包里不用捎带一整个 Chromium</text>
</svg>
