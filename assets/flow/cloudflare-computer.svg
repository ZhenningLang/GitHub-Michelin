<svg xmlns="http://www.w3.org/2000/svg" width="880" height="867" viewBox="0 0 880 867" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="867" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="709" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="709" rx="10"/>
<rect class="pillT" x="474" y="40" width="248.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Cloudflare Computer does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,251.5 C439.0,251.5 439.0,275 470,275" marker-end="url(#a)"/>
<path class="hand" d="M472,298.0 C441.0,298.0 441.0,360 410,360" marker-end="url(#a)"/>
<path class="edge" d="M62,431 L62,455" marker-end="url(#a)"/>
<path class="edge" d="M62,552 L62,576" marker-end="url(#a)"/>
<path class="hand" d="M408,625.5 C439.0,625.5 439.0,649 470,649" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the package into your Worker</text>
<text class="t" x="82" y="123">project</text>
<text class="c" x="82" y="147">npm install @cloudflare/computer</text>
<rect class="card" x="40" y="193" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Wrap your Durable Object with the</text>
<text class="t" x="82" y="244">workspace mixin and declare the DO</text>
<text class="t" x="82" y="266">binding in wrangler config</text>
<text class="c" x="82" y="290">withWorkspace(...)</text>
<rect class="cardT" x="472" y="251" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="251" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="275" r="10"/>
<text class="num" x="494" y="279" text-anchor="middle">3</text>
<text class="t" x="514" y="280">The Durable Object keeps the workspace</text>
<text class="t" x="514" y="302">in its own SQLite storage — durable</text>
<text class="t" x="514" y="324">across restarts</text>
<rect class="card" x="40" y="336" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="336" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="360" r="10"/>
<text class="num" x="62" y="364" text-anchor="middle">4</text>
<text class="t" x="82" y="365">Open it from your Worker and write a</text>
<text class="t" x="82" y="387">file through the fs API</text>
<text class="c" x="82" y="411">ws.fs.writeFile(&quot;/notes.md&quot;, ...)</text>
<rect class="card" x="40" y="457" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="457" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="481" r="10"/>
<text class="num" x="62" y="485" text-anchor="middle">5</text>
<text class="t" x="82" y="486">Register an execution backend for</text>
<text class="t" x="82" y="508">commands</text>
<text class="c" x="82" y="532">new WorkerShellBackend({...})</text>
<rect class="card" x="40" y="578" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="578" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="602" r="10"/>
<text class="num" x="62" y="606" text-anchor="middle">6</text>
<text class="t" x="82" y="607">Run a command against the same files</text>
<text class="t" x="82" y="629">through the single exec entry point</text>
<text class="c" x="82" y="653">ws.runtime.exec(&quot;cat /hello.txt&quot;)</text>
<rect class="cardT" x="472" y="625" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="625" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="649" r="10"/>
<text class="num" x="494" y="653" text-anchor="middle">7</text>
<text class="t" x="514" y="654">Executes it in the chosen backend and</text>
<text class="t" x="514" y="676">streams stdout/stderr/exitCode back</text>
<text class="t" x="514" y="698">live</text>
<rect class="val" x="28" y="751" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="775">VALUE</text>
<text class="valT" x="48" y="799">Your agent gets a working directory that outlives restarts plus one exec API to work on it —</text>
<text class="valT" x="48" y="821">no sandbox fleet, no sync glue of your own</text>
</svg>
