<svg xmlns="http://www.w3.org/2000/svg" width="880" height="685" viewBox="0 0 880 685" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="685" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="549" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="549" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Casbin 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,307 L62,331" marker-end="url(#a)"/>
<path class="hand" d="M408,379.0 C439.0,379.0 439.0,403 470,403" marker-end="url(#a)"/>
<path class="hand" d="M472,416.5 C441.0,416.5 441.0,475 410,475" marker-end="url(#a)"/>
<path class="hand" d="M408,487.5 C439.0,487.5 439.0,511 470,511" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在 CONF 文件里一次写好访问模型：请求格式、</text>
<text class="t" x="82" y="123">规则格式、匹配式</text>
<text class="c" x="82" y="147">[request_definition] · [policy_definition]</text>
<text class="c" x="82" y="166">· [matchers]</text>
<rect class="card" x="40" y="212" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">把谁能做什么写成策略行，放 CSV 文件或经适</text>
<text class="t" x="82" y="263">配器存数据库</text>
<text class="c" x="82" y="287">p, alice, data1, read</text>
<rect class="card" x="40" y="333" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">3</text>
<text class="t" x="82" y="362">引入库，用模型和策略创建一个 enforcer</text>
<text class="c" x="82" y="386">casbin.NewEnforcer(&quot;path/to/model.conf&quot;,</text>
<text class="c" x="82" y="405">&quot;path/to/policy.csv&quot;)</text>
<rect class="cardT" x="472" y="379" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="379" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="403" r="10"/>
<text class="num" x="494" y="407" text-anchor="middle">4</text>
<text class="t" x="514" y="408">把模型和策略加载进内存，解析角色继承</text>
<text class="comp" x="514" y="436">组件：enforcer 与角色管理器</text>
<rect class="card" x="40" y="451" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="451" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="475" r="10"/>
<text class="num" x="62" y="479" text-anchor="middle">5</text>
<text class="t" x="82" y="480">在每个受保护操作之前调用它</text>
<text class="c" x="82" y="504">e.Enforce(sub, obj, act)</text>
<rect class="cardT" x="472" y="487" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="487" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="511" r="10"/>
<text class="num" x="494" y="515" text-anchor="middle">6</text>
<text class="t" x="514" y="516">用匹配式比对规则，套用允许或拒绝的合并方</text>
<text class="t" x="514" y="538">式，返回真或假</text>
<rect class="val" x="28" y="591" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="615">价值</text>
<text class="valT" x="48" y="639">谁能做什么变成一份模型文件加若干策略行，不再是散落在各个处理函数里的 if 判断</text>
</svg>
