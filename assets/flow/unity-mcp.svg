<svg xmlns="http://www.w3.org/2000/svg" width="880" height="575" viewBox="0 0 880 575" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="575" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="439" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="439" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Unity-MCP does</text>
<path class="hand" d="M408,120.5 C439.0,120.5 439.0,144 470,144" marker-end="url(#a)"/>
<path class="hand" d="M472,168.5 C441.0,168.5 441.0,219 410,219" marker-end="url(#a)"/>
<path class="edge" d="M62,290 L62,314" marker-end="url(#a)"/>
<path class="hand" d="M408,352.0 C439.0,352.0 439.0,376 470,376" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the plugin and open your Unity</text>
<text class="t" x="82" y="123">project on the local connection</text>
<text class="comp" x="82" y="151">component: CLI and Unity Editor</text>
<rect class="cardT" x="472" y="120" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="120" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="144" r="10"/>
<text class="num" x="494" y="148" text-anchor="middle">2</text>
<text class="t" x="514" y="149">Loads the editor plugin and provisions</text>
<text class="t" x="514" y="171">its matching server</text>
<text class="comp" x="514" y="199">component: Unity plugin</text>
<rect class="card" x="40" y="195" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="195" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="219" r="10"/>
<text class="num" x="62" y="223" text-anchor="middle">3</text>
<text class="t" x="82" y="224">Configure your agent from the Unity</text>
<text class="t" x="82" y="246">window</text>
<text class="c" x="82" y="270">Window/AI Game Developer</text>
<rect class="card" x="40" y="316" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="316" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="340" r="10"/>
<text class="num" x="62" y="344" text-anchor="middle">4</text>
<text class="t" x="82" y="345">Ask your agent to create three cubes</text>
<text class="t" x="82" y="367">in the scene</text>
<rect class="cardT" x="472" y="352" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="352" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="376" r="10"/>
<text class="num" x="494" y="380" text-anchor="middle">5</text>
<text class="t" x="514" y="381">Executes the agent&#x27;s tool calls in</text>
<text class="t" x="514" y="403">Unity and returns their results</text>
<text class="comp" x="514" y="431">component: Server and editor plugin</text>
<rect class="val" x="28" y="481" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="505">VALUE</text>
<text class="valT" x="48" y="529">Stop relaying scene edits and console results between your agent and Unity</text>
</svg>
