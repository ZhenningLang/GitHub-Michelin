<svg xmlns="http://www.w3.org/2000/svg" width="880" height="928" viewBox="0 0 880 928" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="928" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="770" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="770" rx="10"/>
<rect class="pillT" x="474" y="40" width="101.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">MLT does</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="edge" d="M62,332 L62,356" marker-end="url(#a)"/>
<path class="hand" d="M408,415.0 C439.0,415.0 439.0,439 470,439" marker-end="url(#a)"/>
<path class="edge" d="M494,512 L494,536" marker-end="url(#a)"/>
<path class="edge" d="M494,657 L494,681" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Build and install MLT with the FFmpeg</text>
<text class="t" x="82" y="123">development libraries present</text>
<text class="c" x="82" y="147">cmake .. &amp;&amp; cmake --build . &amp;&amp; sudo cmake</text>
<text class="c" x="82" y="166">--install .</text>
<text class="comp" x="82" y="189">component: libmlt + modules + melt</text>
<rect class="card" x="40" y="237" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">Line up the clips and put a 25-frame</text>
<text class="t" x="82" y="288">luma transition between them</text>
<text class="c" x="82" y="312">melt clip1.dv clip2.dv -mix 25 -mixer luma</text>
<rect class="card" x="40" y="358" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="358" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="382" r="10"/>
<text class="num" x="62" y="386" text-anchor="middle">3</text>
<text class="t" x="82" y="387">Point the output at an encoder instead</text>
<text class="t" x="82" y="409">of the preview window</text>
<text class="c" x="82" y="433">-consumer avformat:output.avi</text>
<text class="c" x="82" y="452">acodec=libmp3lame vcodec=libx264</text>
<rect class="cardT" x="472" y="415" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="415" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="439" r="10"/>
<text class="num" x="494" y="443" text-anchor="middle">4</text>
<text class="t" x="514" y="444">Producers decode each clip through</text>
<text class="t" x="514" y="466">FFmpeg and normalise it to one profile</text>
<text class="comp" x="514" y="494">component: avformat producer</text>
<rect class="cardT" x="472" y="538" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="538" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="562" r="10"/>
<text class="num" x="494" y="566" text-anchor="middle">5</text>
<text class="t" x="514" y="567">Pulls frames in timeline order,</text>
<text class="t" x="514" y="589">applying filters and blending the</text>
<text class="t" x="514" y="611">transition</text>
<text class="comp" x="514" y="639">component: playlist / tractor</text>
<rect class="cardT" x="472" y="683" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="683" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="707" r="10"/>
<text class="num" x="494" y="711" text-anchor="middle">6</text>
<text class="t" x="514" y="712">The consumer encodes the finished</text>
<text class="t" x="514" y="734">frames into the output file</text>
<text class="comp" x="514" y="762">component: avformat consumer</text>
<rect class="val" x="28" y="812" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="836">VALUE</text>
<text class="valT" x="48" y="860">A multitrack edit becomes a repeatable command or MLT XML file, rendered frame-accurately</text>
<text class="valT" x="48" y="882">without writing a timeline engine</text>
</svg>
