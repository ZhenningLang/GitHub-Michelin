<svg xmlns="http://www.w3.org/2000/svg" width="880" height="609" viewBox="0 0 880 609" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="609" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="473" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="473" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Scylla 做的</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="edge" d="M494,216 L494,240" marker-end="url(#a)"/>
<path class="hand" d="M472,290.5 C441.0,290.5 441.0,314 410,314" marker-end="url(#a)"/>
<path class="hand" d="M408,337.5 C439.0,337.5 439.0,389 470,389" marker-end="url(#a)"/>
<path class="hand" d="M472,401.0 C441.0,401.0 441.0,435 410,435" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用 Docker 镜像起一次，开放 8899 和 8081 </text>
<text class="t" x="82" y="123">两个端口</text>
<text class="c" x="82" y="147">wildcat/scylla:latest</text>
<rect class="cardT" x="472" y="119" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">在后台持续爬公开代理来源，候选存进本</text>
<text class="t" x="514" y="170">地数据库</text>
<text class="comp" x="514" y="198">组件：爬虫 + 调度器</text>
<rect class="cardT" x="472" y="242" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="242" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="266" r="10"/>
<text class="num" x="494" y="270" text-anchor="middle">3</text>
<text class="t" x="514" y="271">反复校验每个代理，记下延迟、稳定性、匿名性</text>
<text class="t" x="514" y="293">和 HTTPS 支持</text>
<text class="comp" x="514" y="321">组件：校验器</text>
<rect class="card" x="40" y="290" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="290" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="314" r="10"/>
<text class="num" x="62" y="318" text-anchor="middle">4</text>
<text class="t" x="82" y="319">向 JSON API 要代理，按 HTTPS、匿名性或国</text>
<text class="t" x="82" y="341">家过滤</text>
<text class="c" x="82" y="365">http://localhost:8899/api/v1/proxies</text>
<rect class="cardT" x="472" y="365" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="365" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="389" r="10"/>
<text class="num" x="494" y="393" text-anchor="middle">5</text>
<text class="t" x="514" y="394">只返回当前判定有效的代理，附带延迟和</text>
<text class="t" x="514" y="416">稳定性分数</text>
<rect class="card" x="40" y="411" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="411" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="435" r="10"/>
<text class="num" x="62" y="439" text-anchor="middle">6</text>
<text class="t" x="82" y="440">把返回的 ip:port 填进 requests 或 Scrapy</text>
<text class="t" x="82" y="462">客户端</text>
<rect class="val" x="28" y="515" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="539">价值</text>
<text class="valT" x="48" y="563">一个常驻、带打分的免费代理池，多个爬虫任务都来查它，不用各自去收割</text>
</svg>
