<svg xmlns="http://www.w3.org/2000/svg" width="880" height="871" viewBox="0 0 880 871" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="871" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="735" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="735" rx="10"/>
<rect class="pillT" x="474" y="40" width="90.4" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">驱动做的</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="edge" d="M62,328 L62,352" marker-end="url(#a)"/>
<path class="hand" d="M408,403.0 C439.0,403.0 439.0,427 470,427" marker-end="url(#a)"/>
<path class="hand" d="M472,439.0 C441.0,439.0 441.0,502 410,502" marker-end="url(#a)"/>
<path class="hand" d="M408,525.5 C439.0,525.5 439.0,549 470,549" marker-end="url(#a)"/>
<path class="edge" d="M494,622 L494,646" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">先让这台装着 N 卡的 PC 经 OpenCore 跑起</text>
<text class="t" x="82" y="123">macOS 15</text>
<rect class="card" x="40" y="170" width="368" height="158" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="158" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">在 config.plist 里加启动参数、SIP 值和</text>
<text class="t" x="82" y="221">BAR 设置</text>
<text class="c" x="82" y="245">nvfb=1 nvaccel=1 nvfbheads=4</text>
<text class="c" x="82" y="264">-nvkmsnosmooth amfi_get_out_of_my_way=0x1</text>
<text class="c" x="82" y="283">amfi=0x80</text>
<text class="comp" x="82" y="306">组件：OpenCore 配置文件</text>
<rect class="card" x="40" y="354" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="354" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="378" r="10"/>
<text class="num" x="62" y="382" text-anchor="middle">3</text>
<text class="t" x="82" y="383">解开发布包，校验哈希，用 root 跑安装脚本</text>
<text class="c" x="82" y="407">sudo ./install.sh</text>
<text class="comp" x="82" y="430">组件：package/install.sh</text>
<rect class="cardT" x="472" y="403" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="403" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="427" r="10"/>
<text class="num" x="494" y="431" text-anchor="middle">4</text>
<text class="t" x="514" y="432">把四个内核扩展和 Metal 驱动包放到位，重建</text>
<text class="t" x="514" y="454">辅助内核集合</text>
<rect class="card" x="40" y="478" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="478" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="502" r="10"/>
<text class="num" x="62" y="506" text-anchor="middle">5</text>
<text class="t" x="82" y="507">重启；按提示在“隐私与安全性”里允许扩展，再</text>
<text class="t" x="82" y="529">重启一次</text>
<text class="c" x="82" y="553">sudo shutdown -r now</text>
<rect class="cardT" x="472" y="525" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="525" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="549" r="10"/>
<text class="num" x="494" y="553" text-anchor="middle">6</text>
<text class="t" x="514" y="554">开机时 NVRM 载入 GSP 固件拉起</text>
<text class="t" x="514" y="576">GPU，NVRMFB 点亮屏幕</text>
<text class="comp" x="514" y="604">组件：NVRM.kext · NVRMFB.kext</text>
<rect class="cardT" x="472" y="648" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="648" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="672" r="10"/>
<text class="num" x="494" y="676" text-anchor="middle">7</text>
<text class="t" x="514" y="677">Metal 调用走插件：着色器转成 SPIR-V，由</text>
<text class="t" x="514" y="699">NVK 在显卡上执行</text>
<text class="comp" x="514" y="727">组件：NVMTLDriver.bundle</text>
<rect class="val" x="28" y="777" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="801">价值</text>
<text class="valT" x="48" y="825">桌面和 Metal 应用跑在一张 macOS 自 High Sierra 之后就没有驱动的 GeForce RTX 卡上</text>
</svg>
