<svg xmlns="http://www.w3.org/2000/svg" width="880" height="663" viewBox="0 0 880 663" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="663" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="527" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="527" rx="10"/>
<rect class="pillT" x="474" y="40" width="184.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">flowchart.js does</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="edge" d="M62,284 L62,308" marker-end="url(#a)"/>
<path class="hand" d="M408,367.0 C439.0,367.0 439.0,391 470,391" marker-end="url(#a)"/>
<path class="edge" d="M494,439 L494,463" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Load Raphaël and flowchart.js on the</text>
<text class="t" x="82" y="123">page, e.g. from CDNJS</text>
<rect class="card" x="40" y="170" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">Write the chart as text: node</text>
<text class="t" x="82" y="221">definitions, then the connections</text>
<text class="c" x="82" y="245">op1=&gt;operation: My Operation ·</text>
<text class="c" x="82" y="264">st-&gt;getInfo-&gt;op1-&gt;cond</text>
<rect class="card" x="40" y="310" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="310" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="334" r="10"/>
<text class="num" x="62" y="338" text-anchor="middle">3</text>
<text class="t" x="82" y="339">Parse the text and draw it into a</text>
<text class="t" x="82" y="361">container element</text>
<text class="c" x="82" y="385">flowchart.parse(code) ·</text>
<text class="c" x="82" y="404">chart.drawSVG(&#x27;canvas&#x27;)</text>
<rect class="cardT" x="472" y="367" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="367" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="391" r="10"/>
<text class="num" x="494" y="395" text-anchor="middle">4</text>
<text class="t" x="514" y="396">Parses the DSL into typed nodes and</text>
<text class="t" x="514" y="418">the edges between them</text>
<rect class="cardT" x="472" y="465" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="465" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="489" r="10"/>
<text class="num" x="494" y="493" text-anchor="middle">5</text>
<text class="t" x="514" y="494">Lays the nodes out and draws shapes</text>
<text class="t" x="514" y="516">and arrows as SVG via Raphaël</text>
<rect class="val" x="28" y="569" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="593">VALUE</text>
<text class="valT" x="48" y="617">The flowchart lives as diffable text next to your docs — no drawing tool to open</text>
</svg>
