<svg xmlns="http://www.w3.org/2000/svg" width="880" height="823" viewBox="0 0 880 823" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="823" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="687" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="687" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agentation does</text>
<path class="edge" d="M62,187 L62,211" marker-end="url(#a)"/>
<path class="hand" d="M408,258.0 C439.0,258.0 439.0,282 470,282" marker-end="url(#a)"/>
<path class="hand" d="M472,315.0 C441.0,315.0 441.0,353 410,353" marker-end="url(#a)"/>
<path class="hand" d="M408,373.5 C439.0,373.5 439.0,422 470,422" marker-end="url(#a)"/>
<path class="hand" d="M472,466.0 C441.0,466.0 441.0,490 410,490" marker-end="url(#a)"/>
<path class="hand" d="M408,510.5 C439.0,510.5 439.0,584 470,584" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="115" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="115" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Wire in once</text>
<text class="t" x="82" y="118">Install the dev dependency</text>
<text class="c" x="82" y="142">npm install agentation -D</text>
<text class="comp" x="82" y="165">component: npm package</text>
<rect class="card" x="40" y="213" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="213" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="237" r="10"/>
<text class="num" x="62" y="241" text-anchor="middle">2</text>
<text class="ph" x="82" y="242">Wire in once</text>
<text class="t" x="82" y="259">Mount the toolbar beside your app</text>
<text class="c" x="82" y="283">&lt;Agentation /&gt;</text>
<rect class="cardT" x="472" y="258" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="258" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="282" r="10"/>
<text class="num" x="494" y="286" text-anchor="middle">3</text>
<text class="ph" x="514" y="287">Wire in once</text>
<text class="t" x="514" y="304">Renders the annotation toolbar into</text>
<text class="t" x="514" y="326">the page&#x27;s corner</text>
<text class="comp" x="514" y="354">component: toolbar</text>
<rect class="card" x="40" y="329" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="329" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="353" r="10"/>
<text class="num" x="62" y="357" text-anchor="middle">4</text>
<text class="ph" x="82" y="358">Every tweak</text>
<text class="t" x="82" y="375">Activate it and click the element that</text>
<text class="t" x="82" y="397">is wrong</text>
<rect class="cardT" x="472" y="398" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="398" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="422" r="10"/>
<text class="num" x="494" y="426" text-anchor="middle">5</text>
<text class="ph" x="514" y="427">Every tweak</text>
<text class="t" x="514" y="444">Captures selector, box, classes,</text>
<text class="t" x="514" y="466">styles, component path, source</text>
<text class="t" x="514" y="488">file:line</text>
<text class="comp" x="514" y="516">component: element identification</text>
<rect class="card" x="40" y="466" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="466" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="490" r="10"/>
<text class="num" x="62" y="494" text-anchor="middle">6</text>
<text class="ph" x="82" y="495">Every tweak</text>
<text class="t" x="82" y="512">Copy the structured markdown and paste</text>
<text class="t" x="82" y="534">it to your agent</text>
<rect class="cardT" x="472" y="560" width="368" height="137" rx="8"/>
<rect class="accT" x="472" y="560" width="4" height="137" rx="2"/>
<circle class="accT" cx="494" cy="584" r="10"/>
<text class="num" x="494" y="588" text-anchor="middle">7</text>
<text class="ph" x="514" y="589">Every tweak</text>
<text class="t" x="514" y="606">Or syncs live to the MCP server your</text>
<text class="t" x="514" y="628">agent reads</text>
<text class="c" x="514" y="652">npx -y agentation-mcp server</text>
<text class="comp" x="514" y="675">component: agentation-mcp</text>
<rect class="val" x="28" y="729" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="753">VALUE</text>
<text class="valT" x="48" y="777">The agent greps a real selector and file:line instead of guessing which button you meant.</text>
</svg>
