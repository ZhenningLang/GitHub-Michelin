<svg xmlns="http://www.w3.org/2000/svg" width="880" height="782" viewBox="0 0 880 782" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="782" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="646" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="646" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">FreeCAD 做的</text>
<path class="hand" d="M408,120.5 C439.0,120.5 439.0,144 470,144" marker-end="url(#a)"/>
<path class="hand" d="M472,168.5 C441.0,168.5 441.0,219 410,219" marker-end="url(#a)"/>
<path class="edge" d="M62,293 L62,317" marker-end="url(#a)"/>
<path class="hand" d="M408,356.5 C439.0,356.5 439.0,380 470,380" marker-end="url(#a)"/>
<path class="hand" d="M472,393.5 C441.0,393.5 441.0,444 410,444" marker-end="url(#a)"/>
<path class="edge" d="M62,518 L62,542" marker-end="url(#a)"/>
<path class="hand" d="M408,581.5 C439.0,581.5 439.0,605 470,605" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用官方安装包、发行版仓库或 AppImage 装好</text>
<text class="t" x="82" y="123">FreeCAD</text>
<text class="comp" x="82" y="151">组件：安装包</text>
<rect class="cardT" x="472" y="120" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="120" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="144" r="10"/>
<text class="num" x="494" y="148" text-anchor="middle">2</text>
<text class="t" x="514" y="149">自带 Qt 界面、Coin3D 视图与 OpenCASCA</text>
<text class="t" x="514" y="171">DE 内核</text>
<text class="comp" x="514" y="199">组件：FreeCAD 应用</text>
<rect class="card" x="40" y="195" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="195" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="219" r="10"/>
<text class="num" x="62" y="223" text-anchor="middle">3</text>
<text class="t" x="82" y="224">切到 PartDesign 工作台</text>
<text class="c" x="82" y="248">View → Workbench → PartDesign</text>
<text class="comp" x="82" y="271">组件：PartDesign 工作台</text>
<rect class="card" x="40" y="319" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="319" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="343" r="10"/>
<text class="num" x="62" y="347" text-anchor="middle">4</text>
<text class="t" x="82" y="348">新建 Body，在基准面上新建草图</text>
<text class="comp" x="82" y="376">组件：Sketcher 工作台</text>
<rect class="cardT" x="472" y="356" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="356" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="380" r="10"/>
<text class="num" x="494" y="384" text-anchor="middle">5</text>
<text class="t" x="514" y="385">求解约束，把自由度压到 0</text>
<text class="comp" x="514" y="413">组件：约束求解器</text>
<rect class="card" x="40" y="420" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="420" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="444" r="10"/>
<text class="num" x="62" y="448" text-anchor="middle">6</text>
<text class="t" x="82" y="449">把草图拉成实体——Pocket 做减料</text>
<text class="c" x="82" y="473">Pad · Pocket</text>
<text class="comp" x="82" y="496">组件：PartDesign 工作台</text>
<rect class="card" x="40" y="544" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="544" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="568" r="10"/>
<text class="num" x="62" y="572" text-anchor="middle">7</text>
<text class="t" x="82" y="573">改动文档树里任一草图的尺寸</text>
<text class="comp" x="82" y="601">组件：文档树</text>
<rect class="cardT" x="472" y="581" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="581" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="605" r="10"/>
<text class="num" x="494" y="609" text-anchor="middle">8</text>
<text class="t" x="514" y="610">重算历史，把零件重建出来</text>
<text class="comp" x="514" y="638">组件：重算引擎</text>
<rect class="val" x="28" y="688" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="712">价值</text>
<text class="valT" x="48" y="736">改一个草图的尺寸，整件零件就按自己的历史重建，不用重画</text>
</svg>
