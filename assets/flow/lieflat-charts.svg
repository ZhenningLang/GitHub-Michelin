<svg xmlns="http://www.w3.org/2000/svg" width="880" height="993" viewBox="0 0 880 993" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="993" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="835" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="835" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The skill does</text>
<path class="edge" d="M62,205 L62,229" marker-end="url(#a)"/>
<path class="hand" d="M408,288.0 C439.0,288.0 439.0,312 470,312" marker-end="url(#a)"/>
<path class="edge" d="M494,408 L494,432" marker-end="url(#a)"/>
<path class="hand" d="M472,494.0 C441.0,494.0 441.0,518 410,518" marker-end="url(#a)"/>
<path class="hand" d="M408,551.0 C439.0,551.0 439.0,604 470,604" marker-end="url(#a)"/>
<path class="edge" d="M494,700 L494,724" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the skill into your agent&#x27;s</text>
<text class="t" x="82" y="123">skills directory</text>
<text class="c" x="82" y="147">npx skills add</text>
<text class="c" x="82" y="166">https://github.com/larashero3-dotcom/liefl</text>
<text class="c" x="82" y="185">at-charts</text>
<rect class="card" x="40" y="231" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="255" r="10"/>
<text class="num" x="62" y="259" text-anchor="middle">2</text>
<text class="t" x="82" y="260">Hand the agent your data and the</text>
<text class="t" x="82" y="282">publishing occasion</text>
<text class="c" x="82" y="306">Turn this CSV into a Glance chart suitable</text>
<text class="c" x="82" y="325">for a presentation.</text>
<rect class="cardT" x="472" y="288" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="288" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="312" r="10"/>
<text class="num" x="494" y="316" text-anchor="middle">3</text>
<text class="t" x="514" y="317">Judges the data shape and locks one</text>
<text class="t" x="514" y="339">chart type before drawing</text>
<text class="c" x="514" y="363">catalog.md</text>
<text class="comp" x="514" y="386">component: chart catalog</text>
<rect class="cardT" x="472" y="434" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="434" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="458" r="10"/>
<text class="num" x="494" y="462" text-anchor="middle">4</text>
<text class="t" x="514" y="463">Reuses that template&#x27;s real rendering</text>
<text class="t" x="514" y="485">code from the gallery HTML</text>
<text class="c" x="514" y="509">templates/lupi-gallery.html</text>
<text class="comp" x="514" y="532">component: gallery templates</text>
<rect class="card" x="40" y="494" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="494" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="518" r="10"/>
<text class="num" x="62" y="522" text-anchor="middle">5</text>
<text class="t" x="82" y="523">Optionally steer the palette in plain</text>
<text class="t" x="82" y="545">words, or let it auto-pick</text>
<text class="c" x="82" y="569">Rebuild this chart with the Porcelain</text>
<text class="c" x="82" y="588">preset.</text>
<rect class="cardT" x="472" y="580" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="580" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="604" r="10"/>
<text class="num" x="494" y="608" text-anchor="middle">6</text>
<text class="t" x="514" y="609">Locks one color system across the</text>
<text class="t" x="514" y="631">whole deliverable</text>
<text class="c" x="514" y="655">mono-tokens.js · color-presets.js</text>
<text class="comp" x="514" y="678">component: design tokens</text>
<rect class="cardT" x="472" y="726" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="726" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="750" r="10"/>
<text class="num" x="494" y="754" text-anchor="middle">7</text>
<text class="t" x="514" y="755">Assembles a double-clickable</text>
<text class="t" x="514" y="777">single-file HTML chart page or full</text>
<text class="t" x="514" y="799">report</text>
<text class="comp" x="514" y="827">component: single-file HTML</text>
<rect class="val" x="28" y="877" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="901">VALUE</text>
<text class="valT" x="48" y="925">Publish-ready HTML charts and bilingual reports in one consistent editorial language — no</text>
<text class="valT" x="48" y="947">chart code, no style guide to write</text>
</svg>
