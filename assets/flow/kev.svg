<svg xmlns="http://www.w3.org/2000/svg" width="880" height="871" viewBox="0 0 880 871" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="871" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="713" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="713" rx="10"/>
<rect class="pillT" x="474" y="40" width="101.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Kev does</text>
<path class="hand" d="M408,150.0 C439.0,150.0 439.0,174 470,174" marker-end="url(#a)"/>
<path class="hand" d="M472,207.0 C441.0,207.0 441.0,278 410,278" marker-end="url(#a)"/>
<path class="hand" d="M408,310.0 C439.0,310.0 439.0,334 470,334" marker-end="url(#a)"/>
<path class="edge" d="M494,424 L494,448" marker-end="url(#a)"/>
<path class="hand" d="M472,505.5 C441.0,505.5 441.0,529 410,529" marker-end="url(#a)"/>
<path class="hand" d="M408,573.5 C439.0,573.5 439.0,611 470,611" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="156" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="156" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Run it</text>
<text class="t" x="82" y="118">Install the serve extra and start the</text>
<text class="t" x="82" y="140">local endpoint</text>
<text class="c" x="82" y="164">uv sync --extra serve · python -m</text>
<text class="c" x="82" y="183">kev.serve --run jaredpalmer/kev-4b</text>
<text class="comp" x="82" y="206">component: kev.serve</text>
<rect class="cardT" x="472" y="150" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="150" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="174" r="10"/>
<text class="num" x="494" y="178" text-anchor="middle">2</text>
<text class="ph" x="514" y="179">Run it</text>
<text class="t" x="514" y="196">Downloads the Qwen3.5 base and the</text>
<text class="t" x="514" y="218">LoRA adapter, merges them in fp32</text>
<text class="comp" x="514" y="246">component: kev.serve</text>
<rect class="card" x="40" y="254" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="254" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="278" r="10"/>
<text class="num" x="62" y="282" text-anchor="middle">3</text>
<text class="ph" x="82" y="283">Run it</text>
<text class="t" x="82" y="300">POST one state plus typed questions —</text>
<text class="t" x="82" y="322">noul, choice or score</text>
<text class="c" x="82" y="346">POST /v1/systemone</text>
<rect class="cardT" x="472" y="310" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="310" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="334" r="10"/>
<text class="num" x="494" y="338" text-anchor="middle">4</text>
<text class="ph" x="514" y="339">Run it</text>
<text class="t" x="514" y="356">Encodes the text once and scores every</text>
<text class="t" x="514" y="378">option with the pointer head</text>
<text class="comp" x="514" y="406">component: pointer head</text>
<rect class="cardT" x="472" y="450" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="450" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="474" r="10"/>
<text class="num" x="494" y="478" text-anchor="middle">5</text>
<text class="ph" x="514" y="479">Run it</text>
<text class="t" x="514" y="496">Returns a calibrated distribution per</text>
<text class="t" x="514" y="518">question; the stored temperature is</text>
<text class="t" x="514" y="540">already applied</text>
<rect class="card" x="40" y="505" width="368" height="137" rx="8"/>
<rect class="accY" x="40" y="505" width="4" height="137" rx="2"/>
<circle class="accY" cx="62" cy="529" r="10"/>
<text class="num" x="62" y="533" text-anchor="middle">6</text>
<text class="ph" x="82" y="534">Make it yours</text>
<text class="t" x="82" y="551">Fine-tune on your own labels when your</text>
<text class="t" x="82" y="573">questions differ</text>
<text class="c" x="82" y="597">--init_from jaredpalmer/kev-4b</text>
<text class="comp" x="82" y="620">component: kev.train</text>
<rect class="cardT" x="472" y="587" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="587" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="611" r="10"/>
<text class="num" x="494" y="615" text-anchor="middle">7</text>
<text class="ph" x="514" y="616">Make it yours</text>
<text class="t" x="514" y="633">Warm-starts the released adapter, so</text>
<text class="t" x="514" y="655">your labels add a domain instead of</text>
<text class="t" x="514" y="677">retraining</text>
<text class="comp" x="514" y="705">component: kev.train</text>
<rect class="val" x="28" y="755" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="779">VALUE</text>
<text class="valT" x="48" y="803">You get thresholdable per-question probabilities on your own hardware — no hosted decision</text>
<text class="valT" x="48" y="825">API, no from-scratch classifier</text>
</svg>
