<svg xmlns="http://www.w3.org/2000/svg" width="880" height="689" viewBox="0 0 880 689" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="689" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="531" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="531" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Nextra does</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="edge" d="M62,285 L62,309" marker-end="url(#a)"/>
<path class="hand" d="M408,358.5 C439.0,358.5 439.0,382 470,382" marker-end="url(#a)"/>
<path class="hand" d="M472,394.0 C441.0,394.0 441.0,456 410,456" marker-end="url(#a)"/>
<path class="hand" d="M408,468.5 C439.0,468.5 439.0,492 470,492" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install Next.js, React and Nextra</text>
<text class="c" x="82" y="125">npm i next react react-dom nextra</text>
<text class="c" x="82" y="144">nextra-theme-docs</text>
<rect class="card" x="40" y="190" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">Wrap your Next config once so Markdown</text>
<text class="t" x="82" y="241">is handled</text>
<text class="c" x="82" y="265">withNextra({...}) · next.config.mjs</text>
<rect class="card" x="40" y="311" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="311" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="335" r="10"/>
<text class="num" x="62" y="339" text-anchor="middle">3</text>
<text class="t" x="82" y="340">Write the site shell once, feeding it</text>
<text class="t" x="82" y="362">the page map</text>
<text class="c" x="82" y="386">app/layout.jsx · getPageMap()</text>
<rect class="cardT" x="472" y="358" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="358" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="382" r="10"/>
<text class="num" x="494" y="386" text-anchor="middle">4</text>
<text class="t" x="514" y="387">Treats each Markdown/MDX file as a</text>
<text class="t" x="514" y="409">page and derives the sidebar</text>
<rect class="card" x="40" y="432" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="432" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="456" r="10"/>
<text class="num" x="62" y="460" text-anchor="middle">5</text>
<text class="t" x="82" y="461">Run the Next.js dev server</text>
<text class="c" x="82" y="485">npm run dev</text>
<rect class="cardT" x="472" y="468" width="368" height="73" rx="8"/>
<rect class="accT" x="472" y="468" width="4" height="73" rx="2"/>
<circle class="accT" cx="494" cy="492" r="10"/>
<text class="num" x="494" y="496" text-anchor="middle">6</text>
<text class="t" x="514" y="497">Builds the site with Next.js</text>
<text class="c" x="514" y="521">npm run build</text>
<rect class="val" x="28" y="573" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="597">VALUE</text>
<text class="valT" x="48" y="621">Every new Markdown file is a page in a Next.js app — the docs layer is four packages, not a</text>
<text class="valT" x="48" y="643">preset</text>
</svg>
