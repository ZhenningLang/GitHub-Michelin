<svg xmlns="http://www.w3.org/2000/svg" width="880" height="682" viewBox="0 0 880 682" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="682" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="546" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="546" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Detox does</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="edge" d="M62,291 L62,315" marker-end="url(#a)"/>
<path class="hand" d="M408,364.5 C439.0,364.5 439.0,388 470,388" marker-end="url(#a)"/>
<path class="edge" d="M494,458 L494,482" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add Detox to the React Native project</text>
<text class="c" x="82" y="125">detox init</text>
<text class="comp" x="82" y="148">component: Detox CLI + in-app client</text>
<rect class="card" x="40" y="196" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">Write a Jest test with matchers,</text>
<text class="t" x="82" y="247">actions and assertions</text>
<text class="c" x="82" y="271">element(by.id(&#x27;ButtonID&#x27;)).tap()</text>
<rect class="card" x="40" y="317" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="317" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="341" r="10"/>
<text class="num" x="62" y="345" text-anchor="middle">3</text>
<text class="t" x="82" y="346">Run the suite against a simulator or</text>
<text class="t" x="82" y="368">emulator</text>
<text class="c" x="82" y="392">detox test --configuration ios.sim.debug</text>
<rect class="cardT" x="472" y="364" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="364" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="388" r="10"/>
<text class="num" x="494" y="392" text-anchor="middle">4</text>
<text class="t" x="514" y="393">Build and launch the instrumented app,</text>
<text class="t" x="514" y="415">then synchronize with its async</text>
<text class="t" x="514" y="437">activity</text>
<rect class="cardT" x="472" y="484" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="484" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="508" r="10"/>
<text class="num" x="494" y="512" text-anchor="middle">5</text>
<text class="t" x="514" y="513">Run each action/assertion only once</text>
<text class="t" x="514" y="535">the app is idle, and report pass/fail</text>
<rect class="val" x="28" y="588" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="612">VALUE</text>
<text class="valT" x="48" y="636">No manual sleeps and far fewer flakes — Detox knows when your React Native app has settled.</text>
</svg>
