<svg xmlns="http://www.w3.org/2000/svg" width="880" height="559" viewBox="0 0 880 559" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="559" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="423" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="423" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">KiviDB does</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,155.0 C441.0,155.0 441.0,217 410,217" marker-end="url(#a)"/>
<path class="hand" d="M408,240.5 C439.0,240.5 439.0,264 470,264" marker-end="url(#a)"/>
<path class="hand" d="M472,276.0 C441.0,276.0 441.0,338 410,338" marker-end="url(#a)"/>
<path class="hand" d="M408,361.5 C439.0,361.5 439.0,385 470,385" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Build the full server and start a</text>
<text class="t" x="82" y="123">local trial</text>
<text class="c" x="82" y="147">cargo build --release --features lua,tls</text>
<rect class="cardT" x="472" y="119" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">Accept Redis-protocol client</text>
<text class="t" x="514" y="170">connections on port 6380</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">Declare a product index and write</text>
<text class="t" x="82" y="244">product hashes</text>
<text class="c" x="82" y="268">FT.CREATE · HSET</text>
<rect class="cardT" x="472" y="240" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="240" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="264" r="10"/>
<text class="num" x="494" y="268" text-anchor="middle">4</text>
<text class="t" x="514" y="269">Maintain search indexes beside the</text>
<text class="t" x="514" y="291">stored product fields</text>
<rect class="card" x="40" y="314" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">5</text>
<text class="t" x="82" y="343">Send a keyword query through your</text>
<text class="t" x="82" y="365">Redis client</text>
<text class="c" x="82" y="389">FT.SEARCH</text>
<rect class="cardT" x="472" y="361" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="361" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="385" r="10"/>
<text class="num" x="494" y="389" text-anchor="middle">6</text>
<text class="t" x="514" y="390">Return matching product keys and</text>
<text class="t" x="514" y="412">fields</text>
<rect class="val" x="28" y="465" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="489">VALUE</text>
<text class="valT" x="48" y="513">Search the stored catalogue without synchronizing a second search service</text>
</svg>
