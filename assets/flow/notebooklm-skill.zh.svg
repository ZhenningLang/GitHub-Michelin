<svg xmlns="http://www.w3.org/2000/svg" width="880" height="599" viewBox="0 0 880 599" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="599" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="463" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="463" rx="10"/>
<rect class="pillT" x="474" y="40" width="139.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">本 skill 做的</text>
<path class="hand" d="M408,127.5 C439.0,127.5 439.0,151 470,151" marker-end="url(#a)"/>
<path class="hand" d="M472,175.5 C441.0,175.5 441.0,233 410,233" marker-end="url(#a)"/>
<path class="edge" d="M62,304 L62,328" marker-end="url(#a)"/>
<path class="hand" d="M408,376.0 C439.0,376.0 439.0,400 470,400" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把 skill 克隆进 Claude Code 技能目录</text>
<text class="c" x="82" y="125">git clone</text>
<text class="c" x="82" y="144">https://github.com/PleasePrompto/notebookl</text>
<text class="c" x="82" y="163">m-skill notebooklm</text>
<rect class="cardT" x="472" y="127" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="127" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="151" r="10"/>
<text class="num" x="494" y="155" text-anchor="middle">2</text>
<text class="t" x="514" y="156">首次使用时自建隔离 Python 环境，装好</text>
<text class="t" x="514" y="178">Chrome 和自动化栈</text>
<text class="comp" x="514" y="206">组件：.venv 自动引导</text>
<rect class="card" x="40" y="209" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="209" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="233" r="10"/>
<text class="num" x="62" y="237" text-anchor="middle">3</text>
<text class="t" x="82" y="238">在它弹出的 Chrome 窗口里做一次 Googl</text>
<text class="t" x="82" y="260">e 登录</text>
<text class="c" x="82" y="284">Set up NotebookLM authentication</text>
<rect class="card" x="40" y="330" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="330" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="354" r="10"/>
<text class="num" x="62" y="358" text-anchor="middle">4</text>
<text class="t" x="82" y="359">把笔记本按链接共享，并登记进本地 library</text>
<text class="c" x="82" y="383">Add this NotebookLM to my library:</text>
<text class="c" x="82" y="402">[your-link]</text>
<rect class="cardT" x="472" y="376" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="376" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="400" r="10"/>
<text class="num" x="494" y="404" text-anchor="middle">5</text>
<text class="t" x="514" y="405">开新真实 Chrome 问 Gemini，带回带引</text>
<text class="t" x="514" y="427">用的答案</text>
<text class="comp" x="514" y="455">组件：ask_question.py</text>
<rect class="val" x="28" y="505" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="529">价值</text>
<text class="valT" x="48" y="553">自己上传文档里有来源依据、带引用的答案直接落回终端——不再在浏览器和编辑器之间复制粘贴</text>
</svg>
