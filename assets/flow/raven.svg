<svg xmlns="http://www.w3.org/2000/svg" width="880" height="813" viewBox="0 0 880 813" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="813" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="655" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="655" rx="10"/>
<rect class="pillT" x="474" y="40" width="119.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Raven does</text>
<path class="hand" d="M408,149.5 C439.0,149.5 439.0,173 470,173" marker-end="url(#a)"/>
<path class="hand" d="M472,197.5 C441.0,197.5 441.0,277 410,277" marker-end="url(#a)"/>
<path class="hand" d="M408,300.5 C439.0,300.5 439.0,324 470,324" marker-end="url(#a)"/>
<path class="edge" d="M494,397 L494,421" marker-end="url(#a)"/>
<path class="hand" d="M472,471.5 C441.0,471.5 441.0,495 410,495" marker-end="url(#a)"/>
<path class="hand" d="M408,507.0 C439.0,507.0 439.0,570 470,570" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="155" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="155" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install Raven, then pick a model</text>
<text class="t" x="82" y="123">provider and which built-in agents to</text>
<text class="t" x="82" y="145">enable</text>
<text class="c" x="82" y="169">curl -fsSL</text>
<text class="c" x="82" y="188">https://raven.evermind.ai/install.sh |</text>
<text class="c" x="82" y="207">bash · raven onboard</text>
<rect class="cardT" x="472" y="149" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="149" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="173" r="10"/>
<text class="num" x="494" y="177" text-anchor="middle">2</text>
<text class="t" x="514" y="178">Copies the agent products into your</text>
<text class="t" x="514" y="200">raven home and puts them on the roster</text>
<text class="comp" x="514" y="228">component: agents/ product tree</text>
<rect class="card" x="40" y="253" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="253" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="277" r="10"/>
<text class="num" x="62" y="281" text-anchor="middle">3</text>
<text class="t" x="82" y="282">Open the WebUI and describe the whole</text>
<text class="t" x="82" y="304">task once</text>
<text class="c" x="82" y="328">raven web</text>
<rect class="cardT" x="472" y="300" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="300" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="324" r="10"/>
<text class="num" x="494" y="328" text-anchor="middle">4</text>
<text class="t" x="514" y="329">Splits it into a dependency graph and</text>
<text class="t" x="514" y="351">assigns each node to a roster agent</text>
<text class="comp" x="514" y="379">component: host agent</text>
<rect class="cardT" x="472" y="423" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="423" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="447" r="10"/>
<text class="num" x="494" y="451" text-anchor="middle">5</text>
<text class="t" x="514" y="452">Runs independent nodes in parallel and</text>
<text class="t" x="514" y="474">asks before risky actions</text>
<text class="comp" x="514" y="502">component: Permission Gate</text>
<rect class="card" x="40" y="471" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="471" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="495" r="10"/>
<text class="num" x="62" y="499" text-anchor="middle">6</text>
<text class="t" x="82" y="500">Approve, answer questions, or steer a</text>
<text class="t" x="82" y="522">running sub-agent</text>
<rect class="cardT" x="472" y="546" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="546" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="570" r="10"/>
<text class="num" x="494" y="574" text-anchor="middle">7</text>
<text class="t" x="514" y="575">Merges node outputs into the</text>
<text class="t" x="514" y="597">deliverable and keeps context for next</text>
<text class="t" x="514" y="619">session</text>
<text class="comp" x="514" y="647">component: EverOS memory</text>
<rect class="val" x="28" y="697" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="721">VALUE</text>
<text class="valT" x="48" y="745">One brief to one surface, instead of juggling several agents and copy-pasting their outputs</text>
<text class="valT" x="48" y="767">between them</text>
</svg>
