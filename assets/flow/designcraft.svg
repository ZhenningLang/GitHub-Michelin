<svg xmlns="http://www.w3.org/2000/svg" width="880" height="798" viewBox="0 0 880 798" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="798" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="640" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="640" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">DesignCraft does</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,263.5 C439.0,263.5 439.0,287 470,287" marker-end="url(#a)"/>
<path class="hand" d="M472,322.5 C441.0,322.5 441.0,362 410,362" marker-end="url(#a)"/>
<path class="hand" d="M408,386.5 C439.0,386.5 439.0,432 470,432" marker-end="url(#a)"/>
<path class="hand" d="M472,456.5 C441.0,456.5 441.0,485 410,485" marker-end="url(#a)"/>
<path class="hand" d="M408,521.0 C439.0,521.0 439.0,555 470,555" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install a release build for your OS</text>
<text class="c" x="82" y="125">designcraft-&lt;ver&gt;-windows-x64.msi ·</text>
<text class="c" x="82" y="144">designcraft-&lt;ver&gt;-macos-universal.dmg</text>
<text class="comp" x="82" y="167">component: desktop app</text>
<rect class="card" x="40" y="215" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">Open an IDML file exported from</text>
<text class="t" x="82" y="266">InDesign</text>
<text class="comp" x="82" y="294">component: IDML importer</text>
<rect class="cardT" x="472" y="263" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="263" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="287" r="10"/>
<text class="num" x="494" y="291" text-anchor="middle">3</text>
<text class="t" x="514" y="292">Rebuilds spreads, parent pages,</text>
<text class="t" x="514" y="314">styles, swatches and threaded stories</text>
<text class="t" x="514" y="336">as an editable document</text>
<text class="comp" x="514" y="364">component: document model</text>
<rect class="card" x="40" y="338" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="338" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="362" r="10"/>
<text class="num" x="62" y="366" text-anchor="middle">4</text>
<text class="t" x="82" y="367">Edit with InDesign&#x27;s tools, panels and</text>
<text class="t" x="82" y="389">shortcuts</text>
<text class="comp" x="82" y="417">component: egui UI</text>
<rect class="cardT" x="472" y="408" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="408" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="432" r="10"/>
<text class="num" x="494" y="436" text-anchor="middle">5</text>
<text class="t" x="514" y="437">Recomposes every paragraph with a</text>
<text class="t" x="514" y="459">Knuth–Plass composer and hyphenation</text>
<text class="comp" x="514" y="487">component: text engine</text>
<rect class="card" x="40" y="461" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="461" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="485" r="10"/>
<text class="num" x="62" y="489" text-anchor="middle">6</text>
<text class="t" x="82" y="490">Export the print PDF, or IDML back to</text>
<text class="t" x="82" y="512">InDesign</text>
<text class="c" x="82" y="536">File › Export PDF… · File → Export IDML…</text>
<text class="comp" x="82" y="559">component: PDF / IDML exporters</text>
<rect class="cardT" x="472" y="531" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="531" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="555" r="10"/>
<text class="num" x="494" y="559" text-anchor="middle">7</text>
<text class="t" x="514" y="560">Writes real text with embedded font</text>
<text class="t" x="514" y="582">subsets, CMYK and spot inks, bleed and</text>
<text class="t" x="514" y="604">marks</text>
<text class="comp" x="514" y="632">component: PDF writer (krilla)</text>
<rect class="val" x="28" y="682" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="706">VALUE</text>
<text class="valT" x="48" y="730">You lay out and hand off print pages without an InDesign seat, a licence server or a cloud</text>
<text class="valT" x="48" y="752">account</text>
</svg>
