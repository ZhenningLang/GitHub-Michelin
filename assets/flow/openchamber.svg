<svg xmlns="http://www.w3.org/2000/svg" width="880" height="815" viewBox="0 0 880 815" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="815" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="657" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="657" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenChamber does</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,166.0 C441.0,166.0 441.0,217 410,217" marker-end="url(#a)"/>
<path class="hand" d="M408,229.0 C439.0,229.0 439.0,263 470,263" marker-end="url(#a)"/>
<path class="hand" d="M472,286.0 C441.0,286.0 441.0,315 410,315" marker-end="url(#a)"/>
<path class="hand" d="M408,327.0 C439.0,327.0 439.0,383 470,383" marker-end="url(#a)"/>
<path class="hand" d="M472,406.0 C441.0,406.0 441.0,430 410,430" marker-end="url(#a)"/>
<path class="edge" d="M62,500 L62,524" marker-end="url(#a)"/>
<path class="hand" d="M408,573.5 C439.0,573.5 439.0,597 470,597" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install and start it — the desktop</text>
<text class="t" x="82" y="123">release, or the CLI install script</text>
<text class="c" x="82" y="147">openchamber --ui-password be-creative-here</text>
<rect class="cardT" x="472" y="119" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">Starts and supervises OpenCode for</text>
<text class="t" x="514" y="170">you, lists your projects, and listens</text>
<text class="t" x="514" y="192">on localhost only</text>
<rect class="card" x="40" y="193" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">Start a session and give it a finish</text>
<text class="t" x="82" y="244">line instead of a one-shot prompt</text>
<rect class="cardT" x="472" y="239" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="239" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="263" r="10"/>
<text class="num" x="494" y="267" text-anchor="middle">4</text>
<text class="t" x="514" y="268">After every turn it audits the result</text>
<text class="t" x="514" y="290">and keeps the agent working until</text>
<text class="t" x="514" y="312">done, blocked, or out of budget</text>
<rect class="card" x="40" y="291" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="291" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="315" r="10"/>
<text class="num" x="62" y="319" text-anchor="middle">5</text>
<text class="t" x="82" y="320">Hand the same task to up to five</text>
<text class="t" x="82" y="342">models at once</text>
<rect class="cardT" x="472" y="359" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="359" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="383" r="10"/>
<text class="num" x="494" y="387" text-anchor="middle">6</text>
<text class="t" x="514" y="388">Gives each run its own session and</text>
<text class="t" x="514" y="410">optional worktree, so you pick the</text>
<text class="t" x="514" y="432">best or fuse the strongest parts</text>
<rect class="card" x="40" y="406" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="406" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="430" r="10"/>
<text class="num" x="62" y="434" text-anchor="middle">7</text>
<text class="t" x="82" y="435">Review the change as ordered stops, or</text>
<text class="t" x="82" y="457">point at a live element to send its</text>
<text class="t" x="82" y="479">styles and errors</text>
<rect class="card" x="40" y="526" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="526" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="550" r="10"/>
<text class="num" x="62" y="554" text-anchor="middle">8</text>
<text class="t" x="82" y="555">Pair another device with a one-time QR</text>
<text class="t" x="82" y="577">code</text>
<text class="c" x="82" y="601">openchamber connect-url --qr</text>
<rect class="cardT" x="472" y="573" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="573" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="597" r="10"/>
<text class="num" x="494" y="601" text-anchor="middle">9</text>
<text class="t" x="514" y="602">Relays the session end-to-end</text>
<text class="t" x="514" y="624">encrypted, so you answer from anywhere</text>
<text class="t" x="514" y="646">without opening a port</text>
<rect class="val" x="28" y="699" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="723">VALUE</text>
<text class="valT" x="48" y="747">You keep control of agent work from any device — sessions keep going while you are away, and</text>
<text class="valT" x="48" y="769">review, git, and the PR sit beside the chat</text>
</svg>
