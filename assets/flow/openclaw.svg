<svg xmlns="http://www.w3.org/2000/svg" width="880" height="871" viewBox="0 0 880 871" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="871" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="735" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="735" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenClaw does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,354 L62,378" marker-end="url(#a)"/>
<path class="hand" d="M408,427.5 C439.0,427.5 439.0,451 470,451" marker-end="url(#a)"/>
<path class="edge" d="M494,524 L494,548" marker-end="url(#a)"/>
<path class="edge" d="M494,622 L494,646" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Run the installer on a computer that</text>
<text class="t" x="82" y="123">stays on</text>
<text class="c" x="82" y="147">curl -fsSL https://openclaw.ai/install.sh</text>
<text class="c" x="82" y="166">| bash</text>
<rect class="card" x="40" y="212" width="368" height="142" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="142" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Onboard: verify model access, create</text>
<text class="t" x="82" y="263">the workspace, install the Gateway</text>
<text class="t" x="82" y="285">daemon</text>
<text class="c" x="82" y="309">openclaw onboard --install-daemon</text>
<text class="comp" x="82" y="332">component: Gateway</text>
<rect class="card" x="40" y="380" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="380" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="404" r="10"/>
<text class="num" x="62" y="408" text-anchor="middle">3</text>
<text class="t" x="82" y="409">Connect a chat channel and approve who</text>
<text class="t" x="82" y="431">may message it</text>
<text class="c" x="82" y="455">openclaw pairing approve &lt;channel&gt; &lt;code&gt;</text>
<rect class="cardT" x="472" y="427" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="427" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="451" r="10"/>
<text class="num" x="494" y="455" text-anchor="middle">4</text>
<text class="t" x="514" y="456">The Gateway receives each message and</text>
<text class="t" x="514" y="478">routes it to a session</text>
<text class="comp" x="514" y="506">component: Gateway</text>
<rect class="cardT" x="472" y="550" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="550" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="574" r="10"/>
<text class="num" x="494" y="578" text-anchor="middle">5</text>
<text class="t" x="514" y="579">Runs the model with tools and skills,</text>
<text class="t" x="514" y="601">then replies in the same chat</text>
<rect class="cardT" x="472" y="648" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="648" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="672" r="10"/>
<text class="num" x="494" y="676" text-anchor="middle">6</text>
<text class="t" x="514" y="677">Writes notes to Markdown memory files</text>
<text class="t" x="514" y="699">and searches them in later chats</text>
<text class="comp" x="514" y="727">component: workspace memory files</text>
<rect class="val" x="28" y="777" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="801">VALUE</text>
<text class="valT" x="48" y="825">One assistant, running on your own hardware, answers you inside the chat apps you already use</text>
</svg>
