<svg xmlns="http://www.w3.org/2000/svg" width="880" height="759" viewBox="0 0 880 759" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="759" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="601" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="601" rx="10"/>
<rect class="pillT" x="474" y="40" width="184.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">SpiderKeeper does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,272.0 C439.0,272.0 439.0,296 470,296" marker-end="url(#a)"/>
<path class="hand" d="M472,308.0 C441.0,308.0 441.0,382 410,382" marker-end="url(#a)"/>
<path class="hand" d="M408,394.0 C439.0,394.0 439.0,418 470,418" marker-end="url(#a)"/>
<path class="edge" d="M494,491 L494,515" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it and start it against your</text>
<text class="t" x="82" y="123">running Scrapyd server</text>
<text class="c" x="82" y="147">pip install spiderkeeper · spiderkeeper</text>
<text class="c" x="82" y="166">--server=http://localhost:6800</text>
<rect class="card" x="40" y="212" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">In the web UI on :5000, create a</text>
<text class="t" x="82" y="263">project and upload your spider egg</text>
<text class="c" x="82" y="287">scrapyd-deploy --build-egg output.egg</text>
<text class="comp" x="82" y="310">component: Flask web UI</text>
<rect class="cardT" x="472" y="272" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="272" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="296" r="10"/>
<text class="num" x="494" y="300" text-anchor="middle">3</text>
<text class="t" x="514" y="301">Pushes the egg to Scrapyd and lists</text>
<text class="t" x="514" y="323">the spiders it contains</text>
<rect class="card" x="40" y="358" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="358" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="382" r="10"/>
<text class="num" x="62" y="386" text-anchor="middle">4</text>
<text class="t" x="82" y="387">Add a periodic job: pick a spider and</text>
<text class="t" x="82" y="409">give it cron fields</text>
<rect class="cardT" x="472" y="394" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="394" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="418" r="10"/>
<text class="num" x="494" y="422" text-anchor="middle">5</text>
<text class="t" x="514" y="423">At each due time, asks a Scrapyd</text>
<text class="t" x="514" y="445">server to start the spider</text>
<text class="comp" x="514" y="473">component: APScheduler</text>
<rect class="cardT" x="472" y="517" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="517" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="541" r="10"/>
<text class="num" x="494" y="545" text-anchor="middle">6</text>
<text class="t" x="514" y="546">Syncs job status back and shows</text>
<text class="t" x="514" y="568">running and finished jobs on the</text>
<text class="t" x="514" y="590">dashboard</text>
<rect class="val" x="28" y="643" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="667">VALUE</text>
<text class="valT" x="48" y="691">Scrapyd gets a click-to-deploy, cron-scheduling dashboard instead of curl calls to its JSON</text>
<text class="valT" x="48" y="713">API</text>
</svg>
