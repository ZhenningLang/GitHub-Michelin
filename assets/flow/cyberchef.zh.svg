<svg xmlns="http://www.w3.org/2000/svg" width="880" height="621" viewBox="0 0 880 621" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="621" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="485" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="485" rx="10"/>
<rect class="pillT" x="474" y="40" width="151.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">CyberChef 做的</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,240.0 C439.0,240.0 439.0,275 470,275" marker-end="url(#a)"/>
<path class="hand" d="M472,288.5 C441.0,288.5 441.0,315 410,315" marker-end="url(#a)"/>
<path class="hand" d="M408,316.0 C439.0,316.0 439.0,376 470,376" marker-end="url(#a)"/>
<path class="hand" d="M472,400.5 C441.0,400.5 441.0,424 410,424" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">本地起应用（或直接开公共实例）</text>
<text class="c" x="82" y="125">docker run -it -p 8080:8080</text>
<text class="c" x="82" y="144">ghcr.io/gchq/cyberchef:latest</text>
<text class="comp" x="82" y="167">组件：静态 SPA</text>
<rect class="card" x="40" y="215" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">把读不懂的数据粘进输入框</text>
<rect class="cardT" x="472" y="251" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="251" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="275" r="10"/>
<text class="num" x="494" y="279" text-anchor="middle">3</text>
<text class="t" x="514" y="280">Magic 跑识别启发式，给出候选解码链</text>
<text class="comp" x="514" y="308">组件：Magic</text>
<rect class="card" x="40" y="291" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="291" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="315" r="10"/>
<text class="num" x="62" y="319" text-anchor="middle">4</text>
<text class="t" x="82" y="320">把操作拖进 recipe，串起变换链</text>
<rect class="cardT" x="472" y="352" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="352" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="376" r="10"/>
<text class="num" x="494" y="380" text-anchor="middle">5</text>
<text class="t" x="514" y="381">Auto Bake 在浏览器里重跑整条链，输出</text>
<text class="t" x="514" y="403">实时刷新</text>
<text class="comp" x="514" y="431">组件：Auto Bake</text>
<rect class="card" x="40" y="400" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="400" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="424" r="10"/>
<text class="num" x="62" y="428" text-anchor="middle">6</text>
<text class="t" x="82" y="429">复制 URL——recipe 序列化在里面——即可</text>
<text class="t" x="82" y="451">保存或分享</text>
<text class="c" x="82" y="475">#recipe=Operation()&amp;input=</text>
<rect class="val" x="28" y="527" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="551">价值</text>
<text class="valT" x="48" y="575">一条可复现、可分享的变换流水线，数据从不出你的机器</text>
</svg>
