<svg xmlns="http://www.w3.org/2000/svg" width="880" height="721" viewBox="0 0 880 721" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="721" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="585" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="585" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Harness SDK 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,229.5 C439.0,229.5 439.0,253 470,253" marker-end="url(#a)"/>
<path class="edge" d="M494,326 L494,350" marker-end="url(#a)"/>
<path class="hand" d="M472,412.0 C441.0,412.0 441.0,436 410,436" marker-end="url(#a)"/>
<path class="hand" d="M408,458.0 C439.0,458.0 439.0,522 470,522" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上 harness 包；不用 Bedrock 就再装对应</text>
<text class="t" x="82" y="123">extra</text>
<text class="c" x="82" y="147">pip install strands-harness</text>
<rect class="card" x="40" y="193" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">一次调用把 agent 建出来，参数全可省</text>
<text class="c" x="82" y="246">create_harness()</text>
<rect class="cardT" x="472" y="229" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="229" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="253" r="10"/>
<text class="num" x="494" y="257" text-anchor="middle">3</text>
<text class="t" x="514" y="258">接好调过的 system prompt、shell 与文件工</text>
<text class="t" x="514" y="280">具、代码沙箱和子代理</text>
<text class="comp" x="514" y="308">组件：strands_harness</text>
<rect class="cardT" x="472" y="352" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="352" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="376" r="10"/>
<text class="num" x="494" y="380" text-anchor="middle">4</text>
<text class="t" x="514" y="381">把会话、长期记忆和技能放进它自己管的</text>
<text class="t" x="514" y="403">那个点目录</text>
<text class="c" x="514" y="427">./.agent/</text>
<text class="comp" x="514" y="450">组件：harness 默认值</text>
<rect class="card" x="40" y="412" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="412" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="436" r="10"/>
<text class="num" x="62" y="440" text-anchor="middle">5</text>
<text class="t" x="82" y="441">把任务丢给它</text>
<text class="c" x="82" y="465">agent(&quot;Find the slowest test in this</text>
<text class="c" x="82" y="484">repo&quot;)</text>
<rect class="cardT" x="472" y="498" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="498" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="522" r="10"/>
<text class="num" x="494" y="526" text-anchor="middle">6</text>
<text class="t" x="514" y="527">跑循环、调工具、把旧轮次摘要掉、复用缓存过</text>
<text class="t" x="514" y="549">的上下文</text>
<text class="comp" x="514" y="577">组件：agent 循环</text>
<rect class="val" x="28" y="627" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="651">价值</text>
<text class="valT" x="48" y="675">你不用再自己攒循环、工具、记忆和会话：一次调用就有能用的 agent，而每个默认值都留着覆盖口</text>
</svg>
