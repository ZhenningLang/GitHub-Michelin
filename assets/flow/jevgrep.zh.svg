<svg xmlns="http://www.w3.org/2000/svg" width="880" height="847" viewBox="0 0 880 847" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="847" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="711" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="711" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Jevgrep 做的</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="edge" d="M62,294 L62,318" marker-end="url(#a)"/>
<path class="hand" d="M408,378.5 C439.0,378.5 439.0,402 470,402" marker-end="url(#a)"/>
<path class="edge" d="M494,475 L494,499" marker-end="url(#a)"/>
<path class="edge" d="M494,598 L494,622" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">一次性装好 CLI，并保存一个供应商 key</text>
<text class="c" x="82" y="125">npm install -g @dzhng/jevgrep · jg auth</text>
<text class="comp" x="82" y="148">组件：jg CLI（npm）</text>
<rect class="card" x="40" y="196" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">在 agent 干活的仓库里装上配套 skill</text>
<text class="c" x="82" y="249">jg skill</text>
<text class="comp" x="82" y="272">组件：skill 安装器</text>
<rect class="card" x="40" y="320" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="320" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="344" r="10"/>
<text class="num" x="62" y="348" text-anchor="middle">3</text>
<text class="t" x="82" y="349">用自然语言向仓库提一个问题</text>
<text class="c" x="82" y="373">jg &quot;How are telemetry events recorded and</text>
<text class="c" x="82" y="392">sent?&quot; ./my-project</text>
<text class="comp" x="82" y="415">组件：jg CLI</text>
<rect class="cardT" x="472" y="378" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="378" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="402" r="10"/>
<text class="num" x="494" y="406" text-anchor="middle">4</text>
<text class="t" x="514" y="407">按目录元数据与文件预览逐层下探，问 Jev 模</text>
<text class="t" x="514" y="429">型哪些文件相关</text>
<text class="comp" x="514" y="457">组件：逐层检索 + Jev 模型</text>
<rect class="cardT" x="472" y="501" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="501" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="525" r="10"/>
<text class="num" x="494" y="529" text-anchor="middle">5</text>
<text class="t" x="514" y="530">解析 Python／TS／JS 声明，从同一份快照里挑</text>
<text class="t" x="514" y="552">出有用源码单元</text>
<text class="comp" x="514" y="580">组件：内置 CPython + TS 解析器</text>
<rect class="cardT" x="472" y="624" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="624" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="648" r="10"/>
<text class="num" x="494" y="652" text-anchor="middle">6</text>
<text class="t" x="514" y="653">把摘要、文件线索、带行号的原文片段和调用位</text>
<text class="t" x="514" y="675">置打到 stdout</text>
<text class="comp" x="514" y="703">组件：stdout 证据包</text>
<rect class="val" x="28" y="753" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="777">价值</text>
<text class="valT" x="48" y="801">agent 接手陌生仓库时，开局就拿到对的文件和真实源码片段，不用再 grep 整棵树</text>
</svg>
