<svg xmlns="http://www.w3.org/2000/svg" width="880" height="843" viewBox="0 0 880 843" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="843" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="685" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="685" rx="10"/>
<rect class="pillT" x="474" y="40" width="221.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">avoid-ai-writing does</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,177.5 C441.0,177.5 441.0,217 410,217" marker-end="url(#a)"/>
<path class="hand" d="M408,240.5 C439.0,240.5 439.0,286 470,286" marker-end="url(#a)"/>
<path class="edge" d="M494,356 L494,380" marker-end="url(#a)"/>
<path class="hand" d="M472,429.0 C441.0,429.0 441.0,453 410,453" marker-end="url(#a)"/>
<path class="hand" d="M408,476.5 C439.0,476.5 439.0,526 470,526" marker-end="url(#a)"/>
<path class="edge" d="M494,597 L494,621" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone the skill into your agent&#x27;s</text>
<text class="t" x="82" y="123">skills directory</text>
<text class="c" x="82" y="147">~/.claude/skills/avoid-ai-writing</text>
<rect class="cardT" x="472" y="119" width="368" height="117" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="117" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">Ships SKILL.md plus the pattern</text>
<text class="t" x="514" y="170">catalog it must read before auditing</text>
<text class="t" x="514" y="192">anything</text>
<text class="c" x="514" y="216">references/patterns.md</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">Hand it a draft, or point it at a</text>
<text class="t" x="82" y="244">prose file</text>
<text class="c" x="82" y="268">remove AI-isms · audit for AI tells</text>
<rect class="cardT" x="472" y="262" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="262" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="286" r="10"/>
<text class="num" x="494" y="290" text-anchor="middle">4</text>
<text class="t" x="514" y="291">Flags matches by pattern and severity,</text>
<text class="t" x="514" y="313">separating real problems from judgment</text>
<text class="t" x="514" y="335">calls</text>
<rect class="cardT" x="472" y="382" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="382" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="406" r="10"/>
<text class="num" x="494" y="410" text-anchor="middle">5</text>
<text class="t" x="514" y="411">Applies up to two passes and stops</text>
<text class="t" x="514" y="433">when no justified in-scope edit</text>
<text class="t" x="514" y="455">remains</text>
<rect class="card" x="40" y="429" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="429" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="453" r="10"/>
<text class="num" x="62" y="457" text-anchor="middle">6</text>
<text class="t" x="82" y="458">Optionally gate prose in CI or</text>
<text class="t" x="82" y="480">pre-commit</text>
<text class="c" x="82" y="504">conorbronsdon/avoid-ai-writing@v3.35.0</text>
<rect class="cardT" x="472" y="502" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="502" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="526" r="10"/>
<text class="num" x="494" y="530" text-anchor="middle">7</text>
<text class="t" x="514" y="531">Fails the build when a file&#x27;s finding</text>
<text class="t" x="514" y="553">count crosses your threshold</text>
<text class="c" x="514" y="577">threshold · glob · context</text>
<rect class="cardT" x="472" y="623" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="623" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="647" r="10"/>
<text class="num" x="494" y="651" text-anchor="middle">8</text>
<text class="t" x="514" y="652">Returns one final version, a changes</text>
<text class="t" x="514" y="674">summary, and the verification report</text>
<rect class="val" x="28" y="727" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="751">VALUE</text>
<text class="valT" x="48" y="775">One audited final version comes back, with a finding count you can gate in CI instead of a</text>
<text class="valT" x="48" y="797">vibe check</text>
</svg>
