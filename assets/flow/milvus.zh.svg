<svg xmlns="http://www.w3.org/2000/svg" width="880" height="676" viewBox="0 0 880 676" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="676" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="540" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="540" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Milvus 做的</text>
<path class="hand" d="M408,108.5 C439.0,108.5 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,156.5 C441.0,156.5 441.0,195 410,195" marker-end="url(#a)"/>
<path class="edge" d="M62,263 L62,287" marker-end="url(#a)"/>
<path class="hand" d="M408,335.0 C439.0,335.0 439.0,359 470,359" marker-end="url(#a)"/>
<path class="hand" d="M472,360.0 C441.0,360.0 441.0,431 410,431" marker-end="url(#a)"/>
<path class="hand" d="M408,453.0 C439.0,453.0 439.0,477 470,477" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用 Docker 起一个单机版服务</text>
<text class="c" x="82" y="125">bash standalone_embed.sh start</text>
<rect class="cardT" x="472" y="108" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">带内置 etcd 和本地存储跑起来，在 19530 端</text>
<text class="t" x="514" y="159">口提供服务</text>
<text class="comp" x="514" y="187">组件：milvus-standalone 容器</text>
<rect class="card" x="40" y="171" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">3</text>
<text class="t" x="82" y="200">用 Python SDK 连上，按向量维度建一个集合</text>
<text class="c" x="82" y="224">client.create_collection(collection_name=&quot;</text>
<text class="c" x="82" y="243">demo_collection&quot;, dimension=768)</text>
<rect class="card" x="40" y="289" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="289" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="313" r="10"/>
<text class="num" x="62" y="317" text-anchor="middle">4</text>
<text class="t" x="82" y="318">把向量连同元数据字段一起写进去</text>
<text class="c" x="82" y="342">client.insert(collection_name=&quot;demo_collec</text>
<text class="c" x="82" y="361">tion&quot;, data=data)</text>
<rect class="cardT" x="472" y="335" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="335" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="359" r="10"/>
<text class="num" x="494" y="363" text-anchor="middle">5</text>
<text class="t" x="514" y="364">先记日志，再把数据打包成分段并建好近邻索引</text>
<rect class="card" x="40" y="407" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="407" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="431" r="10"/>
<text class="num" x="62" y="435" text-anchor="middle">6</text>
<text class="t" x="82" y="436">拿一批查询向量去搜，指定取前 k 条</text>
<text class="c" x="82" y="460">client.search(collection_name=&quot;demo_collec</text>
<text class="c" x="82" y="479">tion&quot;, data=query_vectors, limit=2)</text>
<rect class="cardT" x="472" y="453" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="453" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="477" r="10"/>
<text class="num" x="494" y="481" text-anchor="middle">7</text>
<text class="t" x="514" y="482">在已加载的分段里检索、套用过滤条件，合并出</text>
<text class="t" x="514" y="504">一份 top-k</text>
<text class="comp" x="514" y="532">组件：查询节点</text>
<rect class="val" x="28" y="582" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="606">价值</text>
<text class="valT" x="48" y="630">带过滤的近邻检索，集合从一个容器长到分片集群，客户端代码不用改</text>
</svg>
