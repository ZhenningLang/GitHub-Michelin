<svg xmlns="http://www.w3.org/2000/svg" width="880" height="590" viewBox="0 0 880 590" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="590" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="454" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="454" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Garage 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,229.5 C439.0,229.5 439.0,253 470,253" marker-end="url(#a)"/>
<path class="hand" d="M472,265.0 C441.0,265.0 441.0,316 410,316" marker-end="url(#a)"/>
<path class="hand" d="M408,328.5 C439.0,328.5 439.0,352 470,352" marker-end="url(#a)"/>
<path class="hand" d="M472,353.0 C441.0,353.0 441.0,415 410,415" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">每台机器写一份配置：目录、共享 rpc_secre</text>
<text class="t" x="82" y="123">t、S3 监听地址</text>
<text class="c" x="82" y="147">garage.toml</text>
<rect class="card" x="40" y="193" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">在每台要存数据的机器上启动守护进程</text>
<text class="c" x="82" y="246">garage server</text>
<rect class="cardT" x="472" y="229" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="229" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="253" r="10"/>
<text class="num" x="494" y="257" text-anchor="middle">3</text>
<text class="t" x="514" y="258">各节点通过 rpc 地址互相发现，组成同</text>
<text class="t" x="514" y="280">一个集群</text>
<rect class="card" x="40" y="292" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">4</text>
<text class="t" x="82" y="321">给每个节点指定 zone 与容量，再应用布局</text>
<text class="c" x="82" y="345">garage layout assign · garage layout apply</text>
<rect class="cardT" x="472" y="328" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="328" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="352" r="10"/>
<text class="num" x="494" y="356" text-anchor="middle">5</text>
<text class="t" x="514" y="357">把副本铺到不同 zone，某节点失联时照常服务</text>
<rect class="card" x="40" y="391" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="391" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="415" r="10"/>
<text class="num" x="62" y="419" text-anchor="middle">6</text>
<text class="t" x="82" y="420">建桶、建密钥，任意 S3 客户端指向 :3900</text>
<text class="c" x="82" y="444">garage key create · garage bucket allow</text>
<rect class="val" x="28" y="496" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="520">价值</text>
<text class="valT" x="48" y="544">用便宜、异构的机器拼出跨站点 S3：不必有数据中心，也不必运维重型存储集群</text>
</svg>
