<svg xmlns="http://www.w3.org/2000/svg" width="880" height="742" viewBox="0 0 880 742" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="742" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="584" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="584" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">HiveChat does</text>
<path class="hand" d="M408,129.0 C439.0,129.0 439.0,153 470,153" marker-end="url(#a)"/>
<path class="hand" d="M472,176.0 C441.0,176.0 441.0,236 410,236" marker-end="url(#a)"/>
<path class="edge" d="M62,307 L62,331" marker-end="url(#a)"/>
<path class="hand" d="M408,380.0 C439.0,380.0 439.0,404 470,404" marker-end="url(#a)"/>
<path class="edge" d="M494,474 L494,498" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Clone the repo, copy the env file, set</text>
<text class="t" x="82" y="123">AUTH_SECRET and ADMIN_CODE, start it</text>
<text class="c" x="82" y="147">cp .env.example .env · docker compose up</text>
<text class="c" x="82" y="166">-d</text>
<rect class="cardT" x="472" y="129" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="129" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="153" r="10"/>
<text class="num" x="494" y="157" text-anchor="middle">2</text>
<text class="t" x="514" y="158">Runs the app on :3000 next to a</text>
<text class="t" x="514" y="180">bundled Postgres that creates its</text>
<text class="t" x="514" y="202">tables on first start</text>
<rect class="card" x="40" y="212" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">3</text>
<text class="t" x="82" y="241">Open the setup page and create the</text>
<text class="t" x="82" y="263">admin account with your ADMIN_CODE</text>
<text class="c" x="82" y="287">http://localhost:3000/setup</text>
<rect class="card" x="40" y="333" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="333" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="357" r="10"/>
<text class="num" x="62" y="361" text-anchor="middle">4</text>
<text class="t" x="82" y="362">In the admin console, add provider</text>
<text class="t" x="82" y="384">keys, create user groups, pick each</text>
<text class="t" x="82" y="406">group&#x27;s models and monthly token limit</text>
<rect class="cardT" x="472" y="380" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="380" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="404" r="10"/>
<text class="num" x="494" y="408" text-anchor="middle">5</text>
<text class="t" x="514" y="409">Lets teammates sign in by email,</text>
<text class="t" x="514" y="431">Feishu, WeCom or DingTalk and shows</text>
<text class="t" x="514" y="453">only their group&#x27;s models</text>
<rect class="cardT" x="472" y="500" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="500" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="524" r="10"/>
<text class="num" x="494" y="528" text-anchor="middle">6</text>
<text class="t" x="514" y="529">Sends each chat to the chosen provider</text>
<text class="t" x="514" y="551">with the admin-held key and tracks the</text>
<text class="t" x="514" y="573">group&#x27;s token usage</text>
<rect class="val" x="28" y="626" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="650">VALUE</text>
<text class="valT" x="48" y="674">The whole team reaches many models through one URL, while the keys and the usage caps stay</text>
<text class="valT" x="48" y="696">with the admin</text>
</svg>
