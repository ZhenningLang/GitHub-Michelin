<svg xmlns="http://www.w3.org/2000/svg" width="880" height="673" viewBox="0 0 880 673" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="673" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="537" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="537" rx="10"/>
<rect class="pillT" x="474" y="40" width="178.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agent-Native 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,226.5 C439.0,226.5 439.0,250 470,250" marker-end="url(#a)"/>
<path class="hand" d="M472,274.5 C441.0,274.5 441.0,313 410,313" marker-end="url(#a)"/>
<path class="hand" d="M408,325.5 C439.0,325.5 439.0,373 470,373" marker-end="url(#a)"/>
<path class="edge" d="M494,446 L494,470" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从模板生成一个应用</text>
<text class="c" x="82" y="125">npx --yes @agent-native/core@latest create</text>
<text class="c" x="82" y="144">my-app --standalone --template chat</text>
<rect class="card" x="40" y="190" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">把能力写一次，写成一个 action</text>
<text class="c" x="82" y="243">defineAction</text>
<rect class="cardT" x="472" y="226" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="226" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="250" r="10"/>
<text class="num" x="494" y="254" text-anchor="middle">3</text>
<text class="t" x="514" y="255">把它挂到所有出口：前端</text>
<text class="t" x="514" y="277">hook、HTTP、MCP、A2A、CLI</text>
<text class="comp" x="514" y="305">组件：action 注册表</text>
<rect class="card" x="40" y="289" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="289" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="313" r="10"/>
<text class="num" x="62" y="317" text-anchor="middle">4</text>
<text class="t" x="82" y="318">在 React 页面里调同一个 action</text>
<text class="c" x="82" y="342">useActionQuery</text>
<rect class="cardT" x="472" y="349" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="349" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="373" r="10"/>
<text class="num" x="494" y="377" text-anchor="middle">5</text>
<text class="t" x="514" y="378">agent 读描述和 schema，在聊天里把它</text>
<text class="t" x="514" y="400">当工具调用</text>
<text class="comp" x="514" y="428">组件：agent loop</text>
<rect class="cardT" x="472" y="472" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="472" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="496" r="10"/>
<text class="num" x="494" y="500" text-anchor="middle">6</text>
<text class="t" x="514" y="501">把 agent 的操作和界面状态存进同一个 SQL 库</text>
<text class="comp" x="514" y="529">组件：Postgres / PGlite</text>
<rect class="val" x="28" y="579" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="603">价值</text>
<text class="valT" x="48" y="627">能力只写一次；页面按钮、聊天里的 agent、外部 MCP 主机跑的都是同一份代码</text>
</svg>
