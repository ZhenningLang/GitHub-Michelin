<svg xmlns="http://www.w3.org/2000/svg" width="880" height="878" viewBox="0 0 880 878" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="878" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="720" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="720" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">pyrasite does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,329 L62,353" marker-end="url(#a)"/>
<path class="hand" d="M408,415.0 C439.0,415.0 439.0,439 470,439" marker-end="url(#a)"/>
<path class="edge" d="M494,512 L494,536" marker-end="url(#a)"/>
<path class="edge" d="M494,632 L494,656" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install gdb 7.3+ and pyrasite, and</text>
<text class="t" x="82" y="123">allow ptrace on the host</text>
<text class="c" x="82" y="147">echo 0 &gt;</text>
<text class="c" x="82" y="166">/proc/sys/kernel/yama/ptrace_scope</text>
<rect class="card" x="40" y="212" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Pick a bundled payload (thread stacks,</text>
<text class="t" x="82" y="263">memory dump…) or write your own .py</text>
<text class="t" x="82" y="285">file</text>
<text class="c" x="82" y="309">pyrasite --list-payloads</text>
<rect class="card" x="40" y="355" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="355" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="379" r="10"/>
<text class="num" x="62" y="383" text-anchor="middle">3</text>
<text class="t" x="82" y="384">Run it against the live PID, asking</text>
<text class="t" x="82" y="406">for the output on your own terminal</text>
<text class="c" x="82" y="430">--output localterm</text>
<text class="comp" x="82" y="453">component: pyrasite CLI</text>
<rect class="cardT" x="472" y="415" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="415" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="439" r="10"/>
<text class="num" x="494" y="443" text-anchor="middle">4</text>
<text class="t" x="514" y="444">Attaches gdb to the PID and takes the</text>
<text class="t" x="514" y="466">interpreter lock</text>
<text class="comp" x="514" y="494">component: injector (via gdb)</text>
<rect class="cardT" x="472" y="538" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="538" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="562" r="10"/>
<text class="num" x="494" y="566" text-anchor="middle">5</text>
<text class="t" x="514" y="567">Makes the target&#x27;s interpreter exec</text>
<text class="t" x="514" y="589">your file, with full access to its</text>
<text class="t" x="514" y="611">modules and objects</text>
<rect class="cardT" x="472" y="658" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="658" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="682" r="10"/>
<text class="num" x="494" y="686" text-anchor="middle">6</text>
<text class="t" x="514" y="687">Releases the lock and detaches; the</text>
<text class="t" x="514" y="709">process keeps running</text>
<rect class="val" x="28" y="762" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="786">VALUE</text>
<text class="valT" x="48" y="810">See inside a stuck or leaking Python process — its thread stacks, its objects — without</text>
<text class="valT" x="48" y="832">restarting it or having instrumented it in advance</text>
</svg>
