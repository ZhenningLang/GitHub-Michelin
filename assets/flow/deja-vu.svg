<svg xmlns="http://www.w3.org/2000/svg" width="880" height="690" viewBox="0 0 880 690" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="690" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="554" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="554" rx="10"/>
<rect class="pillT" x="474" y="40" width="110.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">deja does</text>
<path class="edge" d="M62,184 L62,208" marker-end="url(#a)"/>
<path class="hand" d="M408,266.0 C439.0,266.0 439.0,290 470,290" marker-end="url(#a)"/>
<path class="hand" d="M472,334.0 C441.0,334.0 441.0,372 410,372" marker-end="url(#a)"/>
<path class="hand" d="M408,415.0 C439.0,415.0 439.0,452 470,452" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Set up once</text>
<text class="t" x="82" y="118">Install the deja binary with its</text>
<text class="t" x="82" y="140">installer or package manager</text>
<text class="c" x="82" y="164">brew install deja-vu</text>
<rect class="card" x="40" y="210" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="210" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="234" r="10"/>
<text class="num" x="62" y="238" text-anchor="middle">2</text>
<text class="ph" x="82" y="239">Set up once</text>
<text class="t" x="82" y="256">Let it wire every coding agent it</text>
<text class="t" x="82" y="278">finds and build the first index</text>
<text class="c" x="82" y="302">deja install --auto</text>
<rect class="cardT" x="472" y="266" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="266" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="290" r="10"/>
<text class="num" x="494" y="294" text-anchor="middle">3</text>
<text class="ph" x="514" y="295">Set up once</text>
<text class="t" x="514" y="312">Parses every transcript already on</text>
<text class="t" x="514" y="334">disk into one local index, stripping</text>
<text class="t" x="514" y="356">credentials as it goes</text>
<text class="comp" x="514" y="384">component: indexer</text>
<rect class="card" x="40" y="348" width="368" height="134" rx="8"/>
<rect class="accY" x="40" y="348" width="4" height="134" rx="2"/>
<circle class="accY" cx="62" cy="372" r="10"/>
<text class="num" x="62" y="376" text-anchor="middle">4</text>
<text class="ph" x="82" y="377">Every session</text>
<text class="t" x="82" y="394">Work as usual; when an old decision</text>
<text class="t" x="82" y="416">comes up, open a session or search</text>
<text class="t" x="82" y="438">from the terminal</text>
<text class="c" x="82" y="462">deja &quot;connection pool exhausted&quot;</text>
<rect class="cardT" x="472" y="428" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="428" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="452" r="10"/>
<text class="num" x="494" y="456" text-anchor="middle">5</text>
<text class="ph" x="514" y="457">Every session</text>
<text class="t" x="514" y="474">Answers with the matching sessions —</text>
<text class="t" x="514" y="496">the decision, the files it touched,</text>
<text class="t" x="514" y="518">whether things changed since</text>
<text class="comp" x="514" y="546">component: MCP recall</text>
<rect class="val" x="28" y="596" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="620">VALUE</text>
<text class="valT" x="48" y="644">Months of history — including agents you no longer use — answers from the day you install it</text>
</svg>
