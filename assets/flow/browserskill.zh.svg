<svg xmlns="http://www.w3.org/2000/svg" width="880" height="809" viewBox="0 0 880 809" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="809" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="673" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="673" rx="10"/>
<rect class="pillT" x="474" y="40" width="178.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">BrowserSkill 做的</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,229.5 C439.0,229.5 439.0,253 470,253" marker-end="url(#a)"/>
<path class="hand" d="M472,265.0 C441.0,265.0 441.0,316 410,316" marker-end="url(#a)"/>
<path class="hand" d="M408,349.0 C439.0,349.0 439.0,373 470,373" marker-end="url(#a)"/>
<path class="edge" d="M494,444 L494,468" marker-end="url(#a)"/>
<path class="edge" d="M494,584 L494,608" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好 CLI、加载扩展，再把 skill 装进你的</text>
<text class="t" x="82" y="123">harness</text>
<text class="c" x="82" y="147">bsk install-skill</text>
<rect class="card" x="40" y="193" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">开一个 session，agent 拿到 session_id</text>
<text class="c" x="82" y="246">bsk session start --json</text>
<rect class="cardT" x="472" y="229" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="229" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="253" r="10"/>
<text class="num" x="494" y="257" text-anchor="middle">3</text>
<text class="t" x="514" y="258">daemon 把命令转给扩展，在独立 Agent</text>
<text class="t" x="514" y="280">Window 里跑</text>
<rect class="card" x="40" y="292" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">4</text>
<text class="t" x="82" y="321">先 observe 拿到 @eN 引用，再用引用</text>
<text class="t" x="82" y="343">点击、填表</text>
<text class="c" x="82" y="367">bsk observe --session &lt;id&gt; · bsk click @e3</text>
<text class="c" x="82" y="386">--session &lt;id&gt;</text>
<rect class="cardT" x="472" y="349" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="349" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="373" r="10"/>
<text class="num" x="494" y="377" text-anchor="middle">5</text>
<text class="t" x="514" y="378">要动你已经开着的页签时，先向你确认再借走，</text>
<text class="t" x="514" y="400">你原来的窗口不受影响</text>
<text class="c" x="514" y="424">bsk tab borrow &lt;tab-id&gt;</text>
<rect class="cardT" x="472" y="470" width="368" height="114" rx="8"/>
<rect class="accT" x="472" y="470" width="4" height="114" rx="2"/>
<circle class="accT" cx="494" cy="494" r="10"/>
<text class="num" x="494" y="498" text-anchor="middle">6</text>
<text class="t" x="514" y="499">遇到登录或验证码，就把控制权交还给你，你处</text>
<text class="t" x="514" y="521">理完它接着跑</text>
<text class="c" x="514" y="545">bsk request-help --session &lt;id&gt; --prompt</text>
<text class="c" x="514" y="564">&quot;Please complete sign-in&quot;</text>
<rect class="cardT" x="472" y="610" width="368" height="73" rx="8"/>
<rect class="accT" x="472" y="610" width="4" height="73" rx="2"/>
<circle class="accT" cx="494" cy="634" r="10"/>
<text class="num" x="494" y="638" text-anchor="middle">7</text>
<text class="t" x="514" y="639">任务结束时归还借走的页签，并关闭 session</text>
<text class="c" x="514" y="663">bsk session stop &lt;id&gt;</text>
<rect class="val" x="28" y="715" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="739">价值</text>
<text class="valT" x="48" y="763">用你真正登录着的浏览器干活，且不耽误你自己用它；不用另建测试账号，也不必重放登录</text>
</svg>
