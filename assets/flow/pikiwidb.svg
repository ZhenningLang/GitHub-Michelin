<svg xmlns="http://www.w3.org/2000/svg" width="880" height="632" viewBox="0 0 880 632" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="632" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="496" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="496" rx="10"/>
<rect class="pillT" x="474" y="40" width="147.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">PikiwiDB does</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,178.5 C441.0,178.5 441.0,217 410,217" marker-end="url(#a)"/>
<path class="hand" d="M408,240.5 C439.0,240.5 439.0,288 470,288" marker-end="url(#a)"/>
<path class="hand" d="M472,323.5 C441.0,323.5 441.0,347 410,347" marker-end="url(#a)"/>
<path class="hand" d="M408,370.5 C439.0,370.5 439.0,433 470,433" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Bring up a node from the official</text>
<text class="t" x="82" y="123">Docker image</text>
<text class="c" x="82" y="147">docker run -d · pikadb/pika:v3.3.6</text>
<rect class="cardT" x="472" y="119" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">Keeps the hot working set in memory</text>
<text class="t" x="514" y="170">and persists the full dataset to</text>
<text class="t" x="514" y="192">RocksDB on local disk</text>
<text class="comp" x="514" y="220">component: memory + RocksDB tiering</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">Point your existing Redis clients at</text>
<text class="t" x="82" y="244">it — same protocol, no code change</text>
<text class="c" x="82" y="268">redis-cli -p 9221 &quot;info&quot;</text>
<rect class="cardT" x="472" y="264" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="264" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="288" r="10"/>
<text class="num" x="494" y="292" text-anchor="middle">4</text>
<text class="t" x="514" y="293">Answers Redis commands from</text>
<text class="t" x="514" y="315">disk-backed string/hash/zset</text>
<text class="t" x="514" y="337">structures</text>
<text class="comp" x="514" y="365">component: Redis-compatible server</text>
<rect class="card" x="40" y="323" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="323" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="347" r="10"/>
<text class="num" x="62" y="351" text-anchor="middle">5</text>
<text class="t" x="82" y="352">Add a replica with the Redis command</text>
<text class="t" x="82" y="374">you already know</text>
<text class="c" x="82" y="398">slaveof</text>
<rect class="cardT" x="472" y="409" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="409" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="433" r="10"/>
<text class="num" x="494" y="437" text-anchor="middle">6</text>
<text class="t" x="514" y="438">Replicates asynchronously over binlog,</text>
<text class="t" x="514" y="460">full and incremental</text>
<text class="comp" x="514" y="488">component: binlog replication</text>
<rect class="val" x="28" y="538" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="562">VALUE</text>
<text class="valT" x="48" y="586">Hundreds-of-GB nodes at SSD cost, with untouched Redis client code</text>
</svg>
