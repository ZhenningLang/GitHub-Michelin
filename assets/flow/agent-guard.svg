<svg xmlns="http://www.w3.org/2000/svg" width="880" height="947" viewBox="0 0 880 947" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="947" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="789" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="789" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">agent-guard does</text>
<path class="edge" d="M62,208 L62,232" marker-end="url(#a)"/>
<path class="hand" d="M408,292.5 C439.0,292.5 439.0,316 470,316" marker-end="url(#a)"/>
<path class="edge" d="M494,411 L494,435" marker-end="url(#a)"/>
<path class="edge" d="M494,556 L494,580" marker-end="url(#a)"/>
<path class="hand" d="M472,618.0 C441.0,618.0 441.0,642 410,642" marker-end="url(#a)"/>
<path class="hand" d="M408,665.5 C439.0,665.5 439.0,704 470,704" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the skill, then run the</text>
<text class="t" x="82" y="123">one-time setup that installs the</text>
<text class="t" x="82" y="145">scanners it drives</text>
<text class="c" x="82" y="169">npx skills add elliottwaves-20/agent-guard</text>
<text class="c" x="82" y="188">· bash setup.sh</text>
<rect class="card" x="40" y="234" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">2</text>
<text class="t" x="82" y="263">Hand it the link of the skill, MCP</text>
<text class="t" x="82" y="285">package or archive you are about to</text>
<text class="t" x="82" y="307">install</text>
<text class="c" x="82" y="331">python scripts/scan_url.py</text>
<rect class="cardT" x="472" y="292" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="292" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="316" r="10"/>
<text class="num" x="494" y="320" text-anchor="middle">3</text>
<text class="t" x="514" y="321">Fetches one exact commit as a ZIP</text>
<text class="t" x="514" y="343">snapshot; nothing is cloned or</text>
<text class="t" x="514" y="365">executed</text>
<text class="comp" x="514" y="393">component: URL resolver</text>
<rect class="cardT" x="472" y="437" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="437" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="461" r="10"/>
<text class="num" x="494" y="465" text-anchor="middle">4</text>
<text class="t" x="514" y="466">Routes the target to the matching</text>
<text class="t" x="514" y="488">scanner and runs its LLM pass in a</text>
<text class="t" x="514" y="510">separate tool-less process</text>
<text class="comp" x="514" y="538">component: scanner wrappers</text>
<rect class="cardT" x="472" y="582" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="582" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="606" r="10"/>
<text class="num" x="494" y="610" text-anchor="middle">5</text>
<text class="t" x="514" y="611">Merges every stage into one verdict:</text>
<text class="t" x="514" y="633">exit 0 SAFE, 1 BLOCK, 2 no verdict</text>
<rect class="card" x="40" y="618" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="618" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="642" r="10"/>
<text class="num" x="62" y="646" text-anchor="middle">6</text>
<text class="t" x="82" y="647">After a SAFE verdict, install that</text>
<text class="t" x="82" y="669">same scanned copy</text>
<text class="c" x="82" y="693">python scripts/install_skill.py skill</text>
<rect class="cardT" x="472" y="680" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="680" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="704" r="10"/>
<text class="num" x="494" y="708" text-anchor="middle">7</text>
<text class="t" x="514" y="709">Re-scans a staging copy, then links it</text>
<text class="t" x="514" y="731">into every agent it detects on the</text>
<text class="t" x="514" y="753">machine</text>
<text class="comp" x="514" y="781">component: universal installer</text>
<rect class="val" x="28" y="831" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="855">VALUE</text>
<text class="valT" x="48" y="879">One scan and one verdict cover all your agents, and what got installed is exactly what was</text>
<text class="valT" x="48" y="901">scanned</text>
</svg>
