<svg xmlns="http://www.w3.org/2000/svg" width="880" height="806" viewBox="0 0 880 806" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="806" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="648" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="648" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenFGA does</text>
<path class="edge" d="M62,208 L62,232" marker-end="url(#a)"/>
<path class="edge" d="M62,348 L62,372" marker-end="url(#a)"/>
<path class="hand" d="M408,432.5 C439.0,432.5 439.0,456 470,456" marker-end="url(#a)"/>
<path class="hand" d="M472,480.5 C441.0,480.5 441.0,541 410,541" marker-end="url(#a)"/>
<path class="hand" d="M408,564.5 C439.0,564.5 439.0,588 470,588" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Run the OpenFGA server (in-memory to</text>
<text class="t" x="82" y="123">try it; PostgreSQL or MySQL in</text>
<text class="t" x="82" y="145">production)</text>
<text class="c" x="82" y="169">docker run -p 8080:8080 -p 3000:3000</text>
<text class="c" x="82" y="188">openfga/openfga run</text>
<rect class="card" x="40" y="234" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">2</text>
<text class="t" x="82" y="263">Write the authorization model: object</text>
<text class="t" x="82" y="285">types and how each relation is derived</text>
<text class="c" x="82" y="309">define can_read: viewer or owner or viewer</text>
<text class="c" x="82" y="328">from parent</text>
<rect class="card" x="40" y="374" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="374" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="398" r="10"/>
<text class="num" x="62" y="402" text-anchor="middle">3</text>
<text class="t" x="82" y="403">Whenever ownership, membership or</text>
<text class="t" x="82" y="425">sharing changes in your app, write a</text>
<text class="t" x="82" y="447">relationship tuple</text>
<text class="c" x="82" y="471">user:anne can_view document:roadmap</text>
<rect class="cardT" x="472" y="432" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="432" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="456" r="10"/>
<text class="num" x="494" y="460" text-anchor="middle">4</text>
<text class="t" x="514" y="461">Stores the tuples in its database</text>
<text class="t" x="514" y="483">alongside the versioned model</text>
<text class="comp" x="514" y="511">component: datastore</text>
<rect class="card" x="40" y="517" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="517" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="541" r="10"/>
<text class="num" x="62" y="545" text-anchor="middle">5</text>
<text class="t" x="82" y="546">Before a protected action — or to</text>
<text class="t" x="82" y="568">build a list — the app asks the API</text>
<text class="c" x="82" y="592">Check · ListObjects</text>
<rect class="cardT" x="472" y="564" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="564" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="588" r="10"/>
<text class="num" x="494" y="592" text-anchor="middle">6</text>
<text class="t" x="514" y="593">Walks the relation graph through</text>
<text class="t" x="514" y="615">groups and parents and returns allowed</text>
<text class="t" x="514" y="637">or the object list</text>
<rect class="val" x="28" y="690" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="714">VALUE</text>
<text class="valT" x="48" y="738">Sharing, groups and nested folders are decided by one service from one model, not by</text>
<text class="valT" x="48" y="760">join-heavy SQL in every app</text>
</svg>
