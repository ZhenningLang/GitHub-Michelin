<svg xmlns="http://www.w3.org/2000/svg" width="880" height="678" viewBox="0 0 880 678" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="678" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="542" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="542" rx="10"/>
<rect class="pillT" x="474" y="40" width="184.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">SkillSpector does</text>
<path class="edge" d="M62,205 L62,229" marker-end="url(#a)"/>
<path class="hand" d="M408,288.0 C439.0,288.0 439.0,312 470,312" marker-end="url(#a)"/>
<path class="edge" d="M494,385 L494,409" marker-end="url(#a)"/>
<path class="hand" d="M472,458.0 C441.0,458.0 441.0,482 410,482" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="133" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="133" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the scanner and select an</text>
<text class="t" x="82" y="123">uninstalled skill directory</text>
<text class="c" x="82" y="147">uv tool install</text>
<text class="c" x="82" y="166">git+https://github.com/NVIDIA/skillspector</text>
<text class="c" x="82" y="185">.git</text>
<rect class="card" x="40" y="231" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="231" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="255" r="10"/>
<text class="num" x="62" y="259" text-anchor="middle">2</text>
<text class="t" x="82" y="260">Request a static JSON scan with an</text>
<text class="t" x="82" y="282">incomplete-analysis gate</text>
<text class="c" x="82" y="306">skillspector scan ./my-skill/ --no-llm</text>
<text class="c" x="82" y="325">--fail-on-incomplete --format json</text>
<rect class="cardT" x="472" y="288" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="288" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="312" r="10"/>
<text class="num" x="494" y="316" text-anchor="middle">3</text>
<text class="t" x="514" y="317">Inventory files and run the available</text>
<text class="t" x="514" y="339">analyzers without executing the skill</text>
<text class="comp" x="514" y="367">component: LangGraph analyzer workflow</text>
<rect class="cardT" x="472" y="411" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="411" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="435" r="10"/>
<text class="num" x="494" y="439" text-anchor="middle">4</text>
<text class="t" x="514" y="440">Return findings, risk and</text>
<text class="t" x="514" y="462">completeness; fail the gate for</text>
<text class="t" x="514" y="484">incomplete analysis</text>
<rect class="card" x="40" y="458" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="458" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="482" r="10"/>
<text class="num" x="62" y="486" text-anchor="middle">5</text>
<text class="t" x="82" y="487">Review the evidence and decide whether</text>
<text class="t" x="82" y="509">to install under restricted</text>
<text class="t" x="82" y="531">permissions</text>
<rect class="val" x="28" y="584" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="608">VALUE</text>
<text class="valT" x="48" y="632">An install decision has inspectable findings and coverage gaps, not only a low risk score</text>
</svg>
