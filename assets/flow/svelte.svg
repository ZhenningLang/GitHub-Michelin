<svg xmlns="http://www.w3.org/2000/svg" width="880" height="889" viewBox="0 0 880 889" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="889" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="731" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="731" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Svelte does</text>
<path class="edge" d="M62,208 L62,232" marker-end="url(#a)"/>
<path class="edge" d="M62,331 L62,355" marker-end="url(#a)"/>
<path class="hand" d="M408,404.5 C439.0,404.5 439.0,428 470,428" marker-end="url(#a)"/>
<path class="edge" d="M494,523 L494,547" marker-end="url(#a)"/>
<path class="edge" d="M494,621 L494,645" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Scaffold a project (SvelteKit by</text>
<text class="t" x="82" y="123">default, or plain Vite) and start the</text>
<text class="t" x="82" y="145">dev server</text>
<text class="c" x="82" y="169">npx sv create myapp · npm create</text>
<text class="c" x="82" y="188">vite@latest</text>
<rect class="card" x="40" y="234" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">2</text>
<text class="t" x="82" y="263">Write a .svelte file: markup, a script</text>
<text class="t" x="82" y="285">block and a style block</text>
<text class="comp" x="82" y="313">component: component file</text>
<rect class="card" x="40" y="357" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="357" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="381" r="10"/>
<text class="num" x="62" y="385" text-anchor="middle">3</text>
<text class="t" x="82" y="386">Declare the values that change as</text>
<text class="t" x="82" y="408">reactive state</text>
<text class="c" x="82" y="432">let count = $state(0)</text>
<rect class="cardT" x="472" y="404" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="404" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="428" r="10"/>
<text class="num" x="494" y="432" text-anchor="middle">4</text>
<text class="t" x="514" y="433">At build time, compiles each component</text>
<text class="t" x="514" y="455">into JS that builds its DOM and tracks</text>
<text class="t" x="514" y="477">which node reads which state</text>
<text class="comp" x="514" y="505">component: compiler (Vite plugin)</text>
<rect class="cardT" x="472" y="549" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="549" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="573" r="10"/>
<text class="num" x="494" y="577" text-anchor="middle">5</text>
<text class="t" x="514" y="578">Scopes the component&#x27;s CSS so it</text>
<text class="t" x="514" y="600">cannot leak to other components</text>
<rect class="cardT" x="472" y="647" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="647" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="671" r="10"/>
<text class="num" x="494" y="675" text-anchor="middle">6</text>
<text class="t" x="514" y="676">When state changes in the browser,</text>
<text class="t" x="514" y="698">updates only the DOM nodes that read</text>
<text class="t" x="514" y="720">it — no virtual DOM diff</text>
<rect class="val" x="28" y="773" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="797">VALUE</text>
<text class="valT" x="48" y="821">Components written close to plain HTML ship as small direct-DOM JavaScript, with no framework</text>
<text class="valT" x="48" y="843">runtime diffing on every update</text>
</svg>
