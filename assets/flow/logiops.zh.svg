<svg xmlns="http://www.w3.org/2000/svg" width="880" height="662" viewBox="0 0 880 662" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="662" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="526" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="526" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">logiops 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="edge" d="M62,304 L62,328" marker-end="url(#a)"/>
<path class="hand" d="M408,366.5 C439.0,366.5 439.0,390 470,390" marker-end="url(#a)"/>
<path class="edge" d="M494,438 L494,462" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上 logid：发行版包，或 cmake 构建后安装</text>
<text class="c" x="82" y="125">cmake -DCMAKE_BUILD_TYPE=Release .. &amp;&amp;</text>
<text class="c" x="82" y="144">sudo make install</text>
<rect class="card" x="40" y="190" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">在配置文件里按设备写按键映射：控件 ID</text>
<text class="t" x="82" y="241"> 加动作</text>
<text class="c" x="82" y="265">/etc/logid.cfg — cid: 0xc3; type:</text>
<text class="c" x="82" y="284">&quot;Keypress&quot;;</text>
<rect class="card" x="40" y="330" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="330" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="354" r="10"/>
<text class="num" x="62" y="358" text-anchor="middle">3</text>
<text class="t" x="82" y="359">启用并启动守护进程</text>
<text class="c" x="82" y="383">sudo systemctl enable --now logid</text>
<rect class="cardT" x="472" y="366" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="366" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="390" r="10"/>
<text class="num" x="494" y="394" text-anchor="middle">4</text>
<text class="t" x="514" y="395">启动时读一次配置，经 udev/hidraw 发现</text>
<text class="t" x="514" y="417">HID++ 设备</text>
<rect class="cardT" x="472" y="464" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="464" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="488" r="10"/>
<text class="num" x="494" y="492" text-anchor="middle">5</text>
<text class="t" x="514" y="493">接管映射过的控件，经虚拟 uinput 设备发出配</text>
<text class="t" x="514" y="515">置的动作</text>
<rect class="val" x="28" y="568" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="592">价值</text>
<text class="valT" x="48" y="616">按键、手势、DPI 与 SmartShift 映射由 logid 后台服务持续生效</text>
</svg>
