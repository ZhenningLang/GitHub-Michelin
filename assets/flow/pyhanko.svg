<svg xmlns="http://www.w3.org/2000/svg" width="880" height="671" viewBox="0 0 880 671" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="671" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="535" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="535" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">pyHanko does</text>
<path class="edge" d="M62,230 L62,254" marker-end="url(#a)"/>
<path class="hand" d="M408,325.5 C439.0,325.5 439.0,349 470,349" marker-end="url(#a)"/>
<path class="edge" d="M494,422 L494,446" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="158" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="158" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the library and CLI with the</text>
<text class="t" x="82" y="123">signing extras you need</text>
<text class="c" x="82" y="147">pip install</text>
<text class="c" x="82" y="166">&#x27;pyHanko[pkcs11,image-support,opentype,qr]</text>
<text class="c" x="82" y="185">&#x27; pyhanko-cli</text>
<text class="comp" x="82" y="208">component: Python environment</text>
<rect class="card" x="40" y="256" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="256" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="280" r="10"/>
<text class="num" x="62" y="284" text-anchor="middle">2</text>
<text class="t" x="82" y="285">Provide a PDF, signature field,</text>
<text class="t" x="82" y="307">certificate, and private key</text>
<text class="c" x="82" y="331">pyhanko sign addsig --field Sig1 pkcs12</text>
<text class="c" x="82" y="350">input.pdf output.pdf secrets.pfx</text>
<text class="comp" x="82" y="373">component: pyhanko CLI</text>
<rect class="cardT" x="472" y="325" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="325" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="349" r="10"/>
<text class="num" x="494" y="353" text-anchor="middle">3</text>
<text class="t" x="514" y="354">Hashes the PDF and creates the CMS</text>
<text class="t" x="514" y="376">signature container</text>
<text class="comp" x="514" y="404">component: signing pipeline</text>
<rect class="cardT" x="472" y="448" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="448" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="472" r="10"/>
<text class="num" x="494" y="476" text-anchor="middle">4</text>
<text class="t" x="514" y="477">Writes an incremental revision that</text>
<text class="t" x="514" y="499">preserves earlier signed bytes</text>
<text class="comp" x="514" y="527">component: incremental PDF writer</text>
<rect class="val" x="28" y="577" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="601">VALUE</text>
<text class="valT" x="48" y="625">The PDF carries a certificate-backed signature without rewriting its prior revisions</text>
</svg>
