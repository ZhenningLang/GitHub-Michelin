<svg xmlns="http://www.w3.org/2000/svg" width="880" height="892" viewBox="0 0 880 892" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="892" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="756" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="756" rx="10"/>
<rect class="pillT" x="474" y="40" width="96.0" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">ECC 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,236.0 C439.0,236.0 439.0,260 470,260" marker-end="url(#a)"/>
<path class="hand" d="M472,273.5 C441.0,273.5 441.0,332 410,332" marker-end="url(#a)"/>
<path class="hand" d="M408,344.5 C439.0,344.5 439.0,368 470,368" marker-end="url(#a)"/>
<path class="hand" d="M472,392.5 C441.0,392.5 441.0,431 410,431" marker-end="url(#a)"/>
<path class="hand" d="M408,443.5 C439.0,443.5 439.0,491 470,491" marker-end="url(#a)"/>
<path class="edge" d="M494,542 L494,566" marker-end="url(#a)"/>
<path class="edge" d="M494,665 L494,689" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">只走单一路径装一次，别叠装</text>
<text class="c" x="82" y="125">/plugin install ecc@ecc · npx</text>
<text class="c" x="82" y="144">ecc-universal@2.2.2 setup</text>
<rect class="card" x="40" y="190" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">给任务先出规划</text>
<text class="c" x="82" y="243">/ecc:plan &quot;Add user authentication with</text>
<text class="c" x="82" y="262">OAuth&quot;</text>
<rect class="cardT" x="472" y="236" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="236" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="260" r="10"/>
<text class="num" x="494" y="264" text-anchor="middle">3</text>
<text class="t" x="514" y="265">planner agent 产出实现蓝图</text>
<text class="comp" x="514" y="293">组件：planner agent</text>
<rect class="card" x="40" y="308" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="308" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="332" r="10"/>
<text class="num" x="62" y="336" text-anchor="middle">4</text>
<text class="t" x="82" y="337">用 TDD 工作流 skill 测试先行</text>
<text class="c" x="82" y="361">tdd-workflow</text>
<rect class="cardT" x="472" y="344" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="344" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="368" r="10"/>
<text class="num" x="494" y="372" text-anchor="middle">5</text>
<text class="t" x="514" y="373">tdd-guide 强制测试先行；修 bug 先用失败测</text>
<text class="t" x="514" y="395">试复现</text>
<text class="comp" x="514" y="423">组件：tdd-guide agent</text>
<rect class="card" x="40" y="407" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="407" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="431" r="10"/>
<text class="num" x="62" y="435" text-anchor="middle">6</text>
<text class="t" x="82" y="436">完工后请求一轮评审</text>
<text class="c" x="82" y="460">/code-review</text>
<rect class="cardT" x="472" y="467" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="467" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="491" r="10"/>
<text class="num" x="494" y="495" text-anchor="middle">7</text>
<text class="t" x="514" y="496">code-reviewer 在新上下文里审查改动</text>
<text class="comp" x="514" y="524">组件：code-reviewer agent</text>
<rect class="cardT" x="472" y="568" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="568" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="592" r="10"/>
<text class="num" x="494" y="596" text-anchor="middle">8</text>
<text class="t" x="514" y="597">会话 hook 蒸馏摘要并抽取带置信度的</text>
<text class="t" x="514" y="619">instinct</text>
<text class="comp" x="514" y="647">组件：hook 与记忆运行时</text>
<rect class="cardT" x="472" y="691" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="691" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="715" r="10"/>
<text class="num" x="494" y="719" text-anchor="middle">9</text>
<text class="t" x="514" y="720">下次会话开场把它们重新注入上下文</text>
<text class="comp" x="514" y="748">组件：SessionStart hook</text>
<rect class="val" x="28" y="798" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="822">价值</text>
<text class="valT" x="48" y="846">工程流程是装进去的，不是每次重新 prompt 出来的——agent 自己会规划、测试、审查、记忆</text>
</svg>
