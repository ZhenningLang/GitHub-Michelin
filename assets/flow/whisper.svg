<svg xmlns="http://www.w3.org/2000/svg" width="880" height="829" viewBox="0 0 880 829" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="829" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="671" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="671" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Whisper does</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,247.0 C439.0,247.0 439.0,271 470,271" marker-end="url(#a)"/>
<path class="edge" d="M494,342 L494,366" marker-end="url(#a)"/>
<path class="edge" d="M494,462 L494,486" marker-end="url(#a)"/>
<path class="edge" d="M494,560 L494,584" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the ffmpeg CLI and the package</text>
<text class="c" x="82" y="125">brew install ffmpeg · pip install -U</text>
<text class="c" x="82" y="144">openai-whisper</text>
<rect class="card" x="40" y="190" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">Point it at your audio files and pick</text>
<text class="t" x="82" y="241">a model size</text>
<text class="c" x="82" y="265">whisper audio.flac audio.mp3 audio.wav</text>
<text class="c" x="82" y="284">--model turbo</text>
<rect class="cardT" x="472" y="247" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="247" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="271" r="10"/>
<text class="num" x="494" y="275" text-anchor="middle">3</text>
<text class="t" x="514" y="276">Downloads the model weights on first</text>
<text class="t" x="514" y="298">use and caches them locally</text>
<text class="c" x="514" y="322">~/.cache/whisper</text>
<rect class="cardT" x="472" y="368" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="368" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="392" r="10"/>
<text class="num" x="494" y="396" text-anchor="middle">4</text>
<text class="t" x="514" y="397">Decodes the audio with ffmpeg to 16</text>
<text class="t" x="514" y="419">kHz and slices it into 30-second</text>
<text class="t" x="514" y="441">spectrogram windows</text>
<rect class="cardT" x="472" y="488" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="488" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="512" r="10"/>
<text class="num" x="494" y="516" text-anchor="middle">5</text>
<text class="t" x="514" y="517">Detects the language and writes</text>
<text class="t" x="514" y="539">timestamped text window by window</text>
<rect class="cardT" x="472" y="586" width="368" height="95" rx="8"/>
<rect class="accT" x="472" y="586" width="4" height="95" rx="2"/>
<circle class="accT" cx="494" cy="610" r="10"/>
<text class="num" x="494" y="614" text-anchor="middle">6</text>
<text class="t" x="514" y="615">Saves every output format next to each</text>
<text class="t" x="514" y="637">input</text>
<text class="c" x="514" y="661">txt · srt · vtt</text>
<rect class="val" x="28" y="713" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="737">VALUE</text>
<text class="valT" x="48" y="761">Searchable transcripts and ready-to-load subtitles in many languages, produced on your own</text>
<text class="valT" x="48" y="783">hardware with no per-minute fees</text>
</svg>
