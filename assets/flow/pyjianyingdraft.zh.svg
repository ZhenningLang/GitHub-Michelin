<svg xmlns="http://www.w3.org/2000/svg" width="880" height="785" viewBox="0 0 880 785" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="785" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="649" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="649" rx="10"/>
<rect class="pillT" x="474" y="40" width="206.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">pyJianYingDraft 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,266 L62,290" marker-end="url(#a)"/>
<path class="hand" d="M408,349.0 C439.0,349.0 439.0,373 470,373" marker-end="url(#a)"/>
<path class="hand" d="M472,385.0 C441.0,385.0 441.0,456 410,456" marker-end="url(#a)"/>
<path class="edge" d="M62,504 L62,528" marker-end="url(#a)"/>
<path class="hand" d="M408,587.0 C439.0,587.0 439.0,611 470,611" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">把包装进你的 Python 管线</text>
<text class="c" x="82" y="125">pip install pyJianYingDraft</text>
<rect class="card" x="40" y="171" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">把它指向将来打开这个工程的机器上的剪</text>
<text class="t" x="82" y="222">映草稿目录</text>
<text class="c" x="82" y="246">draft.DraftFolder(r&quot;&lt;草稿文件夹&gt;&quot;)</text>
<rect class="card" x="40" y="292" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">3</text>
<text class="t" x="82" y="321">创建草稿，用代码描述轨道、片段、文字、特效</text>
<text class="t" x="82" y="343">与转场，然后保存</text>
<text class="c" x="82" y="367">draft_folder.create_draft(&quot;demo&quot;, 1920,</text>
<text class="c" x="82" y="386">1080) · script.save()</text>
<rect class="cardT" x="472" y="349" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="349" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="373" r="10"/>
<text class="num" x="494" y="377" text-anchor="middle">4</text>
<text class="t" x="514" y="378">用内置模板填好字段，写出这个草稿的 JSO</text>
<text class="t" x="514" y="400">N 文件</text>
<rect class="card" x="40" y="432" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="432" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="456" r="10"/>
<text class="num" x="62" y="460" text-anchor="middle">5</text>
<text class="t" x="82" y="461">打开剪映，找到那个草稿（没出现就先</text>
<text class="t" x="82" y="483">刷新列表）</text>
<rect class="card" x="40" y="530" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="530" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="554" r="10"/>
<text class="num" x="62" y="558" text-anchor="middle">6</text>
<text class="t" x="82" y="559">在装有剪映 6 及更早版本的 Windows 上，让它</text>
<text class="t" x="82" y="581">通过编辑器自己的控件导出</text>
<text class="c" x="82" y="605">ctrl.export_draft(&quot;要导出的草稿名称&quot;, &quot;&lt;导出路</text>
<text class="c" x="82" y="624">径&gt;&quot;)</text>
<rect class="cardT" x="472" y="587" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="587" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="611" r="10"/>
<text class="num" x="494" y="615" text-anchor="middle">7</text>
<text class="t" x="514" y="616">移动光标点击编辑器的导出界面，再把渲染好的</text>
<text class="t" x="514" y="638">文件改名到目标路径</text>
<rect class="val" x="28" y="691" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="715">价值</text>
<text class="valT" x="48" y="739">用 Python 写出一份可编辑的剪映草稿，在旧的 Windows 组合下还能顺带导出 MP4，不需要人搭时间线</text>
</svg>
