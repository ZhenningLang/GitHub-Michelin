<svg xmlns="http://www.w3.org/2000/svg" width="880" height="857" viewBox="0 0 880 857" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="857" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="721" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="721" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Beacon does</text>
<path class="hand" d="M408,150.0 C439.0,150.0 439.0,174 470,174" marker-end="url(#a)"/>
<path class="hand" d="M472,205.5 C441.0,205.5 441.0,278 410,278" marker-end="url(#a)"/>
<path class="hand" d="M408,298.5 C439.0,298.5 439.0,322 470,322" marker-end="url(#a)"/>
<path class="hand" d="M472,353.5 C441.0,353.5 441.0,393 410,393" marker-end="url(#a)"/>
<path class="hand" d="M408,425.0 C439.0,425.0 439.0,459 470,459" marker-end="url(#a)"/>
<path class="hand" d="M472,503.0 C441.0,503.0 441.0,531 410,531" marker-end="url(#a)"/>
<path class="hand" d="M408,563.0 C439.0,563.0 439.0,621 470,621" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="156" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="156" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Capture</text>
<text class="t" x="82" y="118">Install the endpoint and wire your</text>
<text class="t" x="82" y="140">harnesses</text>
<text class="c" x="82" y="164">beacon endpoint install --harness</text>
<text class="c" x="82" y="183">claude,codex,cursor</text>
<text class="comp" x="82" y="206">component: endpoint agent</text>
<rect class="cardT" x="472" y="150" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="150" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="174" r="10"/>
<text class="num" x="494" y="178" text-anchor="middle">2</text>
<text class="ph" x="514" y="179">Capture</text>
<text class="t" x="514" y="196">Registers each harness&#x27;s</text>
<text class="t" x="514" y="218">hooks/plugins/OTLP and starts the</text>
<text class="t" x="514" y="240">local collector</text>
<rect class="card" x="40" y="254" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="254" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="278" r="10"/>
<text class="num" x="62" y="282" text-anchor="middle">3</text>
<text class="ph" x="82" y="283">Capture</text>
<text class="t" x="82" y="300">Work in Claude Code, Codex, Cursor as</text>
<text class="t" x="82" y="322">usual</text>
<rect class="cardT" x="472" y="298" width="368" height="111" rx="8"/>
<rect class="accT" x="472" y="298" width="4" height="111" rx="2"/>
<circle class="accT" cx="494" cy="322" r="10"/>
<text class="num" x="494" y="326" text-anchor="middle">4</text>
<text class="ph" x="514" y="327">Capture</text>
<text class="t" x="514" y="344">Normalizes every session into one</text>
<text class="t" x="514" y="366">local trace: prompts, tools, edits,</text>
<text class="t" x="514" y="388">approvals, tokens</text>
<rect class="card" x="40" y="369" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="369" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="393" r="10"/>
<text class="num" x="62" y="397" text-anchor="middle">5</text>
<text class="ph" x="82" y="398">Distill</text>
<text class="t" x="82" y="415">Score a finished session and draft a</text>
<text class="t" x="82" y="437">candidate lesson</text>
<text class="c" x="82" y="461">beacon memory evaluations run</text>
<rect class="cardT" x="472" y="435" width="368" height="136" rx="8"/>
<rect class="accT" x="472" y="435" width="4" height="136" rx="2"/>
<circle class="accT" cx="494" cy="459" r="10"/>
<text class="num" x="494" y="463" text-anchor="middle">6</text>
<text class="ph" x="514" y="464">Distill</text>
<text class="t" x="514" y="481">Ranks the trace with a consented</text>
<text class="t" x="514" y="503">evaluator call; nothing is written</text>
<text class="t" x="514" y="525">unreviewed</text>
<text class="comp" x="514" y="553">component: distill skill</text>
<rect class="card" x="40" y="507" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="507" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="531" r="10"/>
<text class="num" x="62" y="535" text-anchor="middle">7</text>
<text class="ph" x="82" y="536">Distill</text>
<text class="t" x="82" y="553">Review the candidates and approve the</text>
<text class="t" x="82" y="575">good ones</text>
<text class="c" x="82" y="599">beacon memory candidates</text>
<rect class="cardT" x="472" y="597" width="368" height="134" rx="8"/>
<rect class="accT" x="472" y="597" width="4" height="134" rx="2"/>
<circle class="accT" cx="494" cy="621" r="10"/>
<text class="num" x="494" y="625" text-anchor="middle">8</text>
<text class="ph" x="514" y="626">Distill</text>
<text class="t" x="514" y="643">Installs the approved lesson as a</text>
<text class="t" x="514" y="665">project Agent Skill and serves memory</text>
<text class="t" x="514" y="687">over MCP</text>
<text class="c" x="514" y="711">.agents/skills/&lt;slug&gt;/SKILL.md</text>
<rect class="val" x="28" y="763" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="787">VALUE</text>
<text class="valT" x="48" y="811">A lesson learned once in one harness is loaded by every harness — sessions stop evaporating</text>
</svg>
