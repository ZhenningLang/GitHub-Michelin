<svg xmlns="http://www.w3.org/2000/svg" width="880" height="665" viewBox="0 0 880 665" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="665" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="507" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="507" rx="10"/>
<rect class="pillT" x="474" y="40" width="110.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Rich does</text>
<path class="edge" d="M62,208 L62,232" marker-end="url(#a)"/>
<path class="hand" d="M408,281.5 C439.0,281.5 439.0,305 470,305" marker-end="url(#a)"/>
<path class="hand" d="M472,328.0 C441.0,328.0 441.0,379 410,379" marker-end="url(#a)"/>
<path class="hand" d="M408,423.0 C439.0,423.0 439.0,447 470,447" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install it, and optionally run the</text>
<text class="t" x="82" y="123">demo card to see what your terminal</text>
<text class="t" x="82" y="145">can show</text>
<text class="c" x="82" y="169">python -m pip install rich · python -m</text>
<text class="c" x="82" y="188">rich</text>
<rect class="card" x="40" y="234" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="234" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="258" r="10"/>
<text class="num" x="62" y="262" text-anchor="middle">2</text>
<text class="t" x="82" y="263">Create one Console object and share it</text>
<text class="t" x="82" y="285">across the program</text>
<text class="c" x="82" y="309">console = Console()</text>
<rect class="cardT" x="472" y="281" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="281" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="305" r="10"/>
<text class="num" x="494" y="309" text-anchor="middle">3</text>
<text class="t" x="514" y="310">Detects the terminal&#x27;s size, encoding,</text>
<text class="t" x="514" y="332">color support and whether output is a</text>
<text class="t" x="514" y="354">terminal at all</text>
<rect class="card" x="40" y="355" width="368" height="136" rx="8"/>
<rect class="accY" x="40" y="355" width="4" height="136" rx="2"/>
<circle class="accY" cx="62" cy="379" r="10"/>
<text class="num" x="62" y="383" text-anchor="middle">4</text>
<text class="t" x="82" y="384">Print text with inline style markup,</text>
<text class="t" x="82" y="406">or pass a ready-made object such as a</text>
<text class="t" x="82" y="428">Table</text>
<text class="c" x="82" y="452">console.print(&quot;Hello&quot;, &quot;World!&quot;,</text>
<text class="c" x="82" y="471">style=&quot;bold red&quot;)</text>
<rect class="cardT" x="472" y="423" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="423" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="447" r="10"/>
<text class="num" x="494" y="451" text-anchor="middle">5</text>
<text class="t" x="514" y="452">Wraps and lays it out to the width,</text>
<text class="t" x="514" y="474">converts colors the terminal lacks,</text>
<text class="t" x="514" y="496">and writes the escape codes</text>
<rect class="val" x="28" y="549" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="573">VALUE</text>
<text class="valT" x="48" y="597">Readable colored output, tables and progress bars without hand-writing escape codes or</text>
<text class="valT" x="48" y="619">measuring the terminal yourself</text>
</svg>
