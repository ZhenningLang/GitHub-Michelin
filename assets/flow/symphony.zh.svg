<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">3</text>
<text class="t" x="82" y="321">指向工作流文件，启动编排器</text>
<text class="c" x="82" y="345">./bin/symphony ./WORKFLOW.md</text>
<rect class="cardT" x="472" y="328" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="328" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="352" r="10"/>
