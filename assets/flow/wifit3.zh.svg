<svg xmlns="http://www.w3.org/2000/svg" width="880" height="809" viewBox="0 0 880 809" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="809" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="673" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="673" rx="10"/>
<rect class="pillT" x="474" y="40" width="123.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Wifit3 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,238.5 C439.0,238.5 439.0,262 470,262" marker-end="url(#a)"/>
<path class="edge" d="M494,313 L494,337" marker-end="url(#a)"/>
<path class="edge" d="M494,436 L494,460" marker-end="url(#a)"/>
<path class="hand" d="M472,510.5 C441.0,510.5 441.0,534 410,534" marker-end="url(#a)"/>
<path class="hand" d="M408,557.0 C439.0,557.0 439.0,609 470,609" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">下载对应系统的单文件可执行程序并运行</text>
<text class="c" x="82" y="125">wifit3-windows-x64.exe ·</text>
<text class="c" x="82" y="144">./wifit3-linux-x64</text>
<rect class="card" x="40" y="190" width="368" height="97" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="97" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">插上受支持的 USB 网卡，在启动页选中它，点</text>
<text class="t" x="82" y="241">START</text>
<text class="comp" x="82" y="269">组件：启动页·网卡选择</text>
<rect class="cardT" x="472" y="238" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="238" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="262" r="10"/>
<text class="num" x="494" y="266" text-anchor="middle">3</text>
<text class="t" x="514" y="267">一次性把网卡绑到用户态，绕开系统 Wi-Fi 栈</text>
<text class="comp" x="514" y="295">组件：系统安装模块</text>
<rect class="cardT" x="472" y="339" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="339" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="363" r="10"/>
<text class="num" x="494" y="367" text-anchor="middle">4</text>
<text class="t" x="514" y="368">迷你驱动经 USB 接管芯片，上传厂商固件并写</text>
<text class="t" x="514" y="390">入监听模式</text>
<text class="comp" x="514" y="418">组件：用户态芯片驱动</text>
<rect class="cardT" x="472" y="462" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="462" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="486" r="10"/>
<text class="num" x="494" y="490" text-anchor="middle">5</text>
<text class="t" x="514" y="491">在 2.4/5 GHz 跳频扫描，聚合多卡，把 AP 指</text>
<text class="t" x="514" y="513">纹到品牌型号</text>
<text class="comp" x="514" y="541">组件：扫描页</text>
<rect class="card" x="40" y="510" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="510" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="534" r="10"/>
<text class="num" x="62" y="538" text-anchor="middle">6</text>
<text class="t" x="82" y="539">聚焦</text>
<text class="t" x="82" y="561">AP，发起战役：解除认证、PMKID、WPS、WEP、</text>
<text class="t" x="82" y="583">EvilTwin</text>
<rect class="cardT" x="472" y="585" width="368" height="98" rx="8"/>
<rect class="accT" x="472" y="585" width="4" height="98" rx="2"/>
<circle class="accT" cx="494" cy="609" r="10"/>
<text class="num" x="494" y="613" text-anchor="middle">7</text>
<text class="t" x="514" y="614">纯 Python 注入组帧，存入 Vault</text>
<text class="c" x="514" y="638">.pcap · .hc22000</text>
<text class="comp" x="514" y="661">组件：战役与 Vault</text>
<rect class="val" x="28" y="715" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="739">价值</text>
<text class="valT" x="48" y="763">Windows 或 macOS 上直接拿到可破解的 WPA 哈希——不用 Kali、内核驱动或 aircrack-ng</text>
</svg>
