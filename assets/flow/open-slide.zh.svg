<svg xmlns="http://www.w3.org/2000/svg" width="880" height="614" viewBox="0 0 880 614" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="614" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="478" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="478" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">open-slide 做的</text>
<path class="hand" d="M408,130.5 C439.0,130.5 439.0,154 470,154" marker-end="url(#a)"/>
<path class="hand" d="M472,178.5 C441.0,178.5 441.0,239 410,239" marker-end="url(#a)"/>
<path class="hand" d="M408,251.5 C439.0,251.5 439.0,277 470,277" marker-end="url(#a)"/>
<path class="hand" d="M472,301.5 C441.0,301.5 441.0,338 410,338" marker-end="url(#a)"/>
<path class="hand" d="M408,351.5 C439.0,351.5 439.0,400 470,400" marker-end="url(#a)"/>
<path class="hand" d="M472,412.5 C441.0,412.5 441.0,439 410,439" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">生成一个 deck 工作区，启动开发服务器</text>
<text class="c" x="82" y="125">npx @open-slide/cli init my-slide · pnpm</text>
<text class="c" x="82" y="144">dev</text>
<text class="comp" x="82" y="167">组件：@open-slide/cli 脚手架</text>
<rect class="cardT" x="472" y="130" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="130" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="154" r="10"/>
<text class="num" x="494" y="158" text-anchor="middle">2</text>
<text class="t" x="514" y="159">起热更新的 1920×1080 预览器，把 agent</text>
<text class="t" x="514" y="181">skill 放进工作区</text>
<text class="comp" x="514" y="209">组件：@open-slide/core 开发服务器</text>
<rect class="card" x="40" y="215" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">3</text>
<text class="t" x="82" y="244">在编码 agent 里用一句话要一套 deck</text>
<text class="c" x="82" y="268">/create-slide</text>
<rect class="cardT" x="472" y="253" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="253" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="277" r="10"/>
<text class="num" x="494" y="281" text-anchor="middle">4</text>
<text class="t" x="514" y="282">skill 让 agent 先问四个问题，再写 Rea</text>
<text class="t" x="514" y="304">ct 页面</text>
<text class="comp" x="514" y="332">组件：create-slide skill</text>
<rect class="card" x="40" y="314" width="368" height="75" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="75" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">5</text>
<text class="t" x="82" y="343">在浏览器预览里点选元素，写上修改意见</text>
<text class="comp" x="82" y="371">组件：inspector 检查器</text>
<rect class="cardT" x="472" y="376" width="368" height="73" rx="8"/>
<rect class="accT" x="472" y="376" width="4" height="73" rx="2"/>
<circle class="accT" cx="494" cy="400" r="10"/>
<text class="num" x="494" y="404" text-anchor="middle">6</text>
<text class="t" x="514" y="405">把每条意见作为标记写进源码，贴在对应元素旁</text>
<text class="c" x="514" y="429">@slide-comment</text>
<rect class="card" x="40" y="415" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="415" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="439" r="10"/>
<text class="num" x="62" y="443" text-anchor="middle">7</text>
<text class="t" x="82" y="444">让 agent 一次处理所有待办意见</text>
<text class="c" x="82" y="468">/apply-comments</text>
<rect class="val" x="28" y="520" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="544">价值</text>
<text class="valT" x="48" y="568">一套由 agent 写好、可直接演示和导出的 deck；改稿只需在页面上指指点点，不用自己写 JSX</text>
</svg>
