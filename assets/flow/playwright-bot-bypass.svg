<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1003" viewBox="0 0 880 1003" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="1003" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="845" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="845" rx="10"/>
<rect class="pillT" x="474" y="40" width="294.6" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">The skill and its template do</text>
<path class="edge" d="M62,211 L62,235" marker-end="url(#a)"/>
<path class="edge" d="M62,354 L62,378" marker-end="url(#a)"/>
<path class="hand" d="M408,427.0 C439.0,427.0 439.0,451 470,451" marker-end="url(#a)"/>
<path class="edge" d="M494,569 L494,593" marker-end="url(#a)"/>
<path class="edge" d="M494,712 L494,736" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="139" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="139" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the skill into your coding</text>
<text class="t" x="82" y="123">agent</text>
<text class="c" x="82" y="147">npx skills add</text>
<text class="c" x="82" y="166">greekr4/playwright-bot-bypass</text>
<text class="comp" x="82" y="189">component: SKILL.md + scripts/</text>
<rect class="card" x="40" y="237" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="237" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="261" r="10"/>
<text class="num" x="62" y="265" text-anchor="middle">2</text>
<text class="t" x="82" y="266">Install the patched Playwright build;</text>
<text class="t" x="82" y="288">have real Google Chrome and a display</text>
<text class="t" x="82" y="310">ready</text>
<text class="c" x="82" y="334">npm install rebrowser-playwright</text>
<rect class="card" x="40" y="380" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="380" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="404" r="10"/>
<text class="num" x="62" y="408" text-anchor="middle">3</text>
<text class="t" x="82" y="409">Ask the agent for a browser script</text>
<text class="t" x="82" y="431">against a site that flags stock</text>
<text class="t" x="82" y="453">Playwright as a bot</text>
<rect class="cardT" x="472" y="427" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="427" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="451" r="10"/>
<text class="num" x="494" y="455" text-anchor="middle">4</text>
<text class="t" x="514" y="456">Steers the agent to build the script</text>
<text class="t" x="514" y="478">on its factory instead of plain</text>
<text class="t" x="514" y="500">Playwright</text>
<text class="c" x="514" y="524">createStealthBrowser()</text>
<text class="comp" x="514" y="547">component: stealth-template.mjs</text>
<rect class="cardT" x="472" y="595" width="368" height="117" rx="8"/>
<rect class="accT" x="472" y="595" width="4" height="117" rx="2"/>
<circle class="accT" cx="494" cy="619" r="10"/>
<text class="num" x="494" y="623" text-anchor="middle">5</text>
<text class="t" x="514" y="624">Launches your installed Chrome in a</text>
<text class="t" x="514" y="646">visible window, so GPU, user agent and</text>
<text class="t" x="514" y="668">plugins are real</text>
<text class="c" x="514" y="692">channel: &#x27;chrome&#x27;</text>
<rect class="cardT" x="472" y="738" width="368" height="117" rx="8"/>
<rect class="accT" x="472" y="738" width="4" height="117" rx="2"/>
<circle class="accT" cx="494" cy="762" r="10"/>
<text class="num" x="494" y="766" text-anchor="middle">6</text>
<text class="t" x="514" y="767">Hides the control channel&#x27;s tell and</text>
<text class="t" x="514" y="789">deletes Playwright&#x27;s marker globals on</text>
<text class="t" x="514" y="811">every page load</text>
<text class="c" x="514" y="835">REBROWSER_PATCHES_RUNTIME_FIX_MODE</text>
<rect class="val" x="28" y="887" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="911">VALUE</text>
<text class="valT" x="48" y="935">Fingerprint checkers that flag stock Playwright see an ordinary Chrome, and you hand-write no</text>
<text class="valT" x="48" y="957">spoofing patches</text>
</svg>
