<svg xmlns="http://www.w3.org/2000/svg" width="880" height="567" viewBox="0 0 880 567" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="567" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="431" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="431" rx="10"/>
<rect class="pillT" x="474" y="40" width="187.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Agent Browser 做的</text>
<path class="hand" d="M408,119.5 C439.0,119.5 439.0,143 470,143" marker-end="url(#a)"/>
<path class="hand" d="M472,167.5 C441.0,167.5 441.0,217 410,217" marker-end="url(#a)"/>
<path class="hand" d="M408,229.5 C439.0,229.5 439.0,266 470,266" marker-end="url(#a)"/>
<path class="hand" d="M472,291.0 C441.0,291.0 441.0,316 410,316" marker-end="url(#a)"/>
<path class="hand" d="M408,328.5 C439.0,328.5 439.0,390 470,390" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装上 CLI，并让它拉一次 Chrome for</text>
<text class="t" x="82" y="123">Testing</text>
<text class="c" x="82" y="147">agent-browser install</text>
<rect class="cardT" x="472" y="119" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="119" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="143" r="10"/>
<text class="num" x="494" y="147" text-anchor="middle">2</text>
<text class="t" x="514" y="148">拉起守护进程：它持有浏览器，并在命令之间一</text>
<text class="t" x="514" y="170">直活着</text>
<text class="comp" x="514" y="198">组件：守护进程</text>
<rect class="card" x="40" y="193" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">3</text>
<text class="t" x="82" y="222">打开一个页面</text>
<text class="c" x="82" y="246">agent-browser open example.com</text>
<rect class="cardT" x="472" y="242" width="368" height="98" rx="8"/>
<rect class="accT" x="472" y="242" width="4" height="98" rx="2"/>
<circle class="accT" cx="494" cy="266" r="10"/>
<text class="num" x="494" y="270" text-anchor="middle">4</text>
<text class="t" x="514" y="271">返回可访问性树，每个可交互元素一个引用</text>
<text class="c" x="514" y="295">agent-browser snapshot</text>
<text class="comp" x="514" y="318">组件：快照引用</text>
<rect class="card" x="40" y="292" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">5</text>
<text class="t" x="82" y="321">对着引用动手，而不是对着选择器</text>
<text class="c" x="82" y="345">agent-browser click @e2</text>
<rect class="cardT" x="472" y="366" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="366" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="390" r="10"/>
<text class="num" x="494" y="394" text-anchor="middle">6</text>
<text class="t" x="514" y="395">保存 cookie 与存储，下次运行时恢复</text>
<text class="comp" x="514" y="423">组件：会话状态</text>
<rect class="val" x="28" y="473" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="497">价值</text>
<text class="valT" x="48" y="521">你不用再维护每次改版都会断的 CSS 选择器，浏览器也只启动一次，而不是每步都启一次</text>
</svg>
