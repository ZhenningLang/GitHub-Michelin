<svg xmlns="http://www.w3.org/2000/svg" width="880" height="645" viewBox="0 0 880 645" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="645" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="509" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="509" rx="10"/>
<rect class="pillT" x="474" y="40" width="262.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">rea-video 与它的 skill 做的</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="edge" d="M494,230 L494,254" marker-end="url(#a)"/>
<path class="hand" d="M472,314.5 C441.0,314.5 441.0,338 410,338" marker-end="url(#a)"/>
<path class="hand" d="M408,350.5 C439.0,350.5 439.0,423 470,423" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">让 agent 装好命令行和 skill，再交给它一条</text>
<text class="t" x="82" y="123">参考视频</text>
<text class="c" x="82" y="147">bash scripts/install_skill.sh</text>
<text class="comp" x="82" y="170">组件：install_skill.sh 与 skill</text>
<rect class="cardT" x="472" y="132" width="368" height="98" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="98" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">切镜头，分离人声、配乐和音效，逐镜测量</text>
<text class="c" x="514" y="185">rea-video decompose ref.mp4 -o out/ref</text>
<text class="comp" x="514" y="208">组件：decompose 命令</text>
<rect class="cardT" x="472" y="256" width="368" height="117" rx="8"/>
<rect class="accT" x="472" y="256" width="4" height="117" rx="2"/>
<circle class="accT" cx="494" cy="280" r="10"/>
<text class="num" x="494" y="284" text-anchor="middle">3</text>
<text class="t" x="514" y="285">agent 看图复核低置信镜头，把答案并入结论</text>
<text class="c" x="514" y="309">rea-video review out/ref · rea-video</text>
<text class="c" x="514" y="328">apply-review out/ref</text>
<text class="comp" x="514" y="351">组件：review 与 apply-review</text>
<rect class="card" x="40" y="314" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">4</text>
<text class="t" x="82" y="343">看 report.html，说出要用的模型和要换的东西</text>
<text class="c" x="82" y="367">out/ref/remake/intent.yaml</text>
<rect class="cardT" x="472" y="399" width="368" height="120" rx="8"/>
<rect class="accT" x="472" y="399" width="4" height="120" rx="2"/>
<circle class="accT" cx="494" cy="423" r="10"/>
<text class="num" x="494" y="427" text-anchor="middle">5</text>
<text class="t" x="514" y="428">把要生成的镜头装进最少的模型调用，并</text>
<text class="t" x="514" y="450">检查方案</text>
<text class="c" x="514" y="474">rea-video plan out/ref</text>
<text class="comp" x="514" y="497">组件：模型能力地图</text>
<rect class="val" x="28" y="551" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="575">价值</text>
<text class="valT" x="48" y="599">不用逐帧手看，就知道每个镜头怎么做出来、怎么复刻</text>
</svg>
