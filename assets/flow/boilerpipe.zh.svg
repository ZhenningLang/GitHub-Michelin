<svg xmlns="http://www.w3.org/2000/svg" width="880" height="696" viewBox="0 0 880 696" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="696" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="560" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="560" rx="10"/>
<rect class="pillT" x="474" y="40" width="160.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">boilerpipe 做的</text>
<path class="edge" d="M62,144 L62,168" marker-end="url(#a)"/>
<path class="edge" d="M62,262 L62,286" marker-end="url(#a)"/>
<path class="hand" d="M408,324.5 C439.0,324.5 439.0,348 470,348" marker-end="url(#a)"/>
<path class="edge" d="M494,396 L494,420" marker-end="url(#a)"/>
<path class="edge" d="M494,494 L494,518" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">从 Maven 源码自行构建，把 jar 放进</text>
<text class="t" x="82" y="123">classpath（无近期发布）</text>
<rect class="card" x="40" y="170" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="170" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="194" r="10"/>
<text class="num" x="62" y="198" text-anchor="middle">2</text>
<text class="t" x="82" y="199">自己把网页下载好，挑一个命名提取器</text>
<text class="c" x="82" y="223">ArticleExtractor · DefaultExtractor ·</text>
<text class="c" x="82" y="242">CommonExtractors.CANOLA_EXTRACTOR</text>
<rect class="card" x="40" y="288" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="288" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="312" r="10"/>
<text class="num" x="62" y="316" text-anchor="middle">3</text>
<text class="t" x="82" y="317">把 HTML 交给它</text>
<text class="c" x="82" y="341">ArticleExtractor.INSTANCE.getText(html)</text>
<rect class="cardT" x="472" y="324" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="324" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="348" r="10"/>
<text class="num" x="494" y="352" text-anchor="middle">4</text>
<text class="t" x="514" y="353">用自带的 NekoHTML 解析 HTML，切成一</text>
<text class="t" x="514" y="375">串文本块</text>
<rect class="cardT" x="472" y="422" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="422" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="446" r="10"/>
<text class="num" x="494" y="450" text-anchor="middle">5</text>
<text class="t" x="514" y="451">按词数、链接密度等浅层特征给每块打分，丢掉</text>
<text class="t" x="514" y="473">样板块</text>
<rect class="cardT" x="472" y="520" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="520" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="544" r="10"/>
<text class="num" x="494" y="548" text-anchor="middle">6</text>
<text class="t" x="514" y="549">把留下的文本块拼成纯文本返回</text>
<rect class="val" x="28" y="602" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="626">价值</text>
<text class="valT" x="48" y="650">拿到去掉菜单、页脚、链接列表的正文，全在 JVM 进程里完成，不用外部服务</text>
</svg>
