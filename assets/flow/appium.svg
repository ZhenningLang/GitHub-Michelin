<svg xmlns="http://www.w3.org/2000/svg" width="880" height="715" viewBox="0 0 880 715" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="715" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="557" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="557" rx="10"/>
<rect class="pillT" x="474" y="40" width="129.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Appium does</text>
<path class="edge" d="M62,170 L62,194" marker-end="url(#a)"/>
<path class="edge" d="M62,291 L62,315" marker-end="url(#a)"/>
<path class="hand" d="M408,353.5 C439.0,353.5 439.0,377 470,377" marker-end="url(#a)"/>
<path class="hand" d="M472,400.0 C441.0,400.0 441.0,440 410,440" marker-end="url(#a)"/>
<path class="hand" d="M408,452.0 C439.0,452.0 439.0,497 470,497" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the core server</text>
<text class="c" x="82" y="125">npm i -g appium</text>
<text class="comp" x="82" y="148">component: Appium server</text>
<rect class="card" x="40" y="196" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="196" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="220" r="10"/>
<text class="num" x="62" y="224" text-anchor="middle">2</text>
<text class="t" x="82" y="225">Install a driver for each platform you</text>
<text class="t" x="82" y="247">test</text>
<text class="c" x="82" y="271">appium driver install &lt;driver-name&gt;</text>
<rect class="card" x="40" y="317" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="317" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="341" r="10"/>
<text class="num" x="62" y="345" text-anchor="middle">3</text>
<text class="t" x="82" y="346">Start the server</text>
<text class="c" x="82" y="370">appium</text>
<rect class="cardT" x="472" y="353" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="353" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="377" r="10"/>
<text class="num" x="494" y="381" text-anchor="middle">4</text>
<text class="t" x="514" y="382">Enable the installed drivers and</text>
<text class="t" x="514" y="404">expose a WebDriver endpoint on port</text>
<text class="t" x="514" y="426">4723</text>
<rect class="card" x="40" y="416" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="416" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="440" r="10"/>
<text class="num" x="62" y="444" text-anchor="middle">5</text>
<text class="t" x="82" y="445">Point your language client at it with</text>
<text class="t" x="82" y="467">the app and device capabilities</text>
<rect class="cardT" x="472" y="473" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="473" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="497" r="10"/>
<text class="num" x="494" y="501" text-anchor="middle">6</text>
<text class="t" x="514" y="502">The driver translates each WebDriver</text>
<text class="t" x="514" y="524">command into the platform&#x27;s native</text>
<text class="t" x="514" y="546">automation and returns the result</text>
<rect class="val" x="28" y="599" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="623">VALUE</text>
<text class="valT" x="48" y="647">One test shape across iOS and Android, in your language — you stop writing platform-specific</text>
<text class="valT" x="48" y="669">automation glue.</text>
</svg>
