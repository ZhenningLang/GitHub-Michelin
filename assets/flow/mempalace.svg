<svg xmlns="http://www.w3.org/2000/svg" width="880" height="782" viewBox="0 0 880 782" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="782" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="624" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="624" rx="10"/>
<rect class="pillT" x="474" y="40" width="110.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">MemPalace</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="hand" d="M408,269.0 C439.0,269.0 439.0,293 470,293" marker-end="url(#a)"/>
<path class="hand" d="M472,328.5 C441.0,328.5 441.0,376 410,376" marker-end="url(#a)"/>
<path class="hand" d="M408,399.5 C439.0,399.5 439.0,438 470,438" marker-end="url(#a)"/>
<path class="edge" d="M494,511 L494,535" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the CLI in an isolated</text>
<text class="t" x="82" y="123">environment and create a palace</text>
<text class="c" x="82" y="147">uv tool install mempalace · mempalace init</text>
<text class="c" x="82" y="166">~/projects/myapp</text>
<rect class="card" x="40" y="212" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Backfill existing Claude Code</text>
<text class="t" x="82" y="263">transcripts</text>
<text class="c" x="82" y="287">mempalace mine ~/.claude/projects/ --mode</text>
<text class="c" x="82" y="306">convos</text>
<rect class="cardT" x="472" y="269" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="269" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="293" r="10"/>
<text class="num" x="494" y="297" text-anchor="middle">3</text>
<text class="t" x="514" y="298">Stores chunks verbatim under wings and</text>
<text class="t" x="514" y="320">rooms, with embeddings and closet</text>
<text class="t" x="514" y="342">pointers</text>
<text class="comp" x="514" y="370">component: miner</text>
<rect class="card" x="40" y="352" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="352" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="376" r="10"/>
<text class="num" x="62" y="380" text-anchor="middle">4</text>
<text class="t" x="82" y="381">Register the MCP server and auto-save</text>
<text class="t" x="82" y="403">hooks in your agent</text>
<text class="c" x="82" y="427">mempalace-mcp</text>
<rect class="cardT" x="472" y="414" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="414" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="438" r="10"/>
<text class="num" x="494" y="442" text-anchor="middle">5</text>
<text class="t" x="514" y="443">Files new turns every 15 messages and</text>
<text class="t" x="514" y="465">before compaction</text>
<text class="comp" x="514" y="493">component: Stop / PreCompact hooks</text>
<rect class="cardT" x="472" y="537" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="537" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="561" r="10"/>
<text class="num" x="494" y="565" text-anchor="middle">6</text>
<text class="t" x="514" y="566">Answers search calls with verbatim</text>
<text class="t" x="514" y="588">passages ranked by vector plus BM25</text>
<text class="comp" x="514" y="616">component: MCP search tools</text>
<rect class="val" x="28" y="666" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="690">VALUE</text>
<text class="valT" x="48" y="714">Your agent gets the original words back instead of a paraphrase, without re-explaining past</text>
<text class="valT" x="48" y="736">sessions</text>
</svg>
