<svg xmlns="http://www.w3.org/2000/svg" width="880" height="889" viewBox="0 0 880 889" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.ph{font:600 10px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6e7781;letter-spacing:.1em}
@media (prefers-color-scheme: dark){.ph{fill:#8b949e}}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="889" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="731" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="731" rx="10"/>
<rect class="pillT" x="474" y="40" width="138.3" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">earmark does</text>
<path class="edge" d="M62,187 L62,211" marker-end="url(#a)"/>
<path class="edge" d="M62,303 L62,327" marker-end="url(#a)"/>
<path class="hand" d="M408,386.5 C439.0,386.5 439.0,410 470,410" marker-end="url(#a)"/>
<path class="hand" d="M472,430.5 C441.0,430.5 441.0,494 410,494" marker-end="url(#a)"/>
<path class="hand" d="M408,526.0 C439.0,526.0 439.0,550 470,550" marker-end="url(#a)"/>
<path class="hand" d="M472,570.5 C441.0,570.5 441.0,632 410,632" marker-end="url(#a)"/>
<path class="hand" d="M408,652.5 C439.0,652.5 439.0,676 470,676" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="115" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="115" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="ph" x="82" y="101">Set up once</text>
<text class="t" x="82" y="118">Install and mount the overlay in dev</text>
<text class="c" x="82" y="142">npm install -D earmark</text>
<text class="comp" x="82" y="165">component: overlay</text>
<rect class="card" x="40" y="213" width="368" height="90" rx="8"/>
<rect class="accY" x="40" y="213" width="4" height="90" rx="2"/>
<circle class="accY" cx="62" cy="237" r="10"/>
<text class="num" x="62" y="241" text-anchor="middle">2</text>
<text class="ph" x="82" y="242">Set up once</text>
<text class="t" x="82" y="259">Mount it with a dev guard</text>
<text class="c" x="82" y="283">createEarmark()</text>
<rect class="card" x="40" y="329" width="368" height="115" rx="8"/>
<rect class="accY" x="40" y="329" width="4" height="115" rx="2"/>
<circle class="accY" cx="62" cy="353" r="10"/>
<text class="num" x="62" y="357" text-anchor="middle">3</text>
<text class="ph" x="82" y="358">Set up once</text>
<text class="t" x="82" y="375">Add the stamper to your bundler config</text>
<text class="c" x="82" y="399">import earmark from &#x27;vite-plugin-earmark&#x27;</text>
<text class="comp" x="82" y="422">component: vite-plugin-earmark</text>
<rect class="cardT" x="472" y="386" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="386" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="410" r="10"/>
<text class="num" x="494" y="414" text-anchor="middle">4</text>
<text class="ph" x="514" y="415">Set up once</text>
<text class="t" x="514" y="432">Stamps every element with its</text>
<text class="t" x="514" y="454">file:line at dev build</text>
<rect class="card" x="40" y="470" width="368" height="112" rx="8"/>
<rect class="accY" x="40" y="470" width="4" height="112" rx="2"/>
<circle class="accY" cx="62" cy="494" r="10"/>
<text class="num" x="62" y="498" text-anchor="middle">5</text>
<text class="ph" x="82" y="499">Every fix</text>
<text class="t" x="82" y="516">Press alt+a, click the element, write</text>
<text class="t" x="82" y="538">what should change</text>
<text class="c" x="82" y="562">alt+a</text>
<rect class="cardT" x="472" y="526" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="526" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="550" r="10"/>
<text class="num" x="494" y="554" text-anchor="middle">6</text>
<text class="ph" x="514" y="555">Every fix</text>
<text class="t" x="514" y="572">Resolves selector, source line, CSS</text>
<text class="t" x="514" y="594">rules, box and styles into markdown</text>
<rect class="card" x="40" y="608" width="368" height="89" rx="8"/>
<rect class="accY" x="40" y="608" width="4" height="89" rx="2"/>
<circle class="accY" cx="62" cy="632" r="10"/>
<text class="num" x="62" y="636" text-anchor="middle">7</text>
<text class="ph" x="82" y="637">Every fix</text>
<text class="t" x="82" y="654">Paste it, or let the agent watch over</text>
<text class="t" x="82" y="676">MCP and reply on the pin</text>
<rect class="cardT" x="472" y="652" width="368" height="89" rx="8"/>
<rect class="accT" x="472" y="652" width="4" height="89" rx="2"/>
<circle class="accT" cx="494" cy="676" r="10"/>
<text class="num" x="494" y="680" text-anchor="middle">8</text>
<text class="ph" x="514" y="681">Every fix</text>
<text class="t" x="514" y="698">Tracks the loop in pin colors: blue</text>
<text class="t" x="514" y="720">acknowledged, green resolved</text>
<rect class="val" x="28" y="773" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="797">VALUE</text>
<text class="valT" x="48" y="821">Your agent gets the exact file:line and stylesheet rule — no grep guessing about which</text>
<text class="valT" x="48" y="843">component you pointed at.</text>
</svg>
