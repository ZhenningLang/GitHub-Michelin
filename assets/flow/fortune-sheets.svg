<svg xmlns="http://www.w3.org/2000/svg" width="880" height="703" viewBox="0 0 880 703" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="703" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="545" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="545" rx="10"/>
<rect class="pillT" x="474" y="40" width="202.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Fortune Sheets does</text>
<path class="edge" d="M62,167 L62,191" marker-end="url(#a)"/>
<path class="hand" d="M408,240.5 C439.0,240.5 439.0,264 470,264" marker-end="url(#a)"/>
<path class="hand" d="M472,288.5 C441.0,288.5 441.0,338 410,338" marker-end="url(#a)"/>
<path class="hand" d="M408,361.5 C439.0,361.5 439.0,387 470,387" marker-end="url(#a)"/>
<path class="hand" d="M472,411.5 C441.0,411.5 441.0,459 410,459" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Add the React workbook component to</text>
<text class="t" x="82" y="123">your app</text>
<text class="c" x="82" y="147">npm install @fortune-sheet/react</text>
<rect class="card" x="40" y="193" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="193" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="217" r="10"/>
<text class="num" x="62" y="221" text-anchor="middle">2</text>
<text class="t" x="82" y="222">Render a Workbook into a sized</text>
<text class="t" x="82" y="244">container div</text>
<text class="c" x="82" y="268">&lt;Workbook data={[{ name: &quot;Sheet1&quot; }]} /&gt;</text>
<rect class="cardT" x="472" y="240" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="240" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="264" r="10"/>
<text class="num" x="494" y="268" text-anchor="middle">3</text>
<text class="t" x="514" y="269">Draws the Excel-like grid: formulas,</text>
<text class="t" x="514" y="291">merges, conditional formatting</text>
<text class="comp" x="514" y="319">component: @fortune-sheet/core</text>
<rect class="card" x="40" y="314" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">4</text>
<text class="t" x="82" y="343">Subscribe to the change stream to</text>
<text class="t" x="82" y="365">persist or broadcast edits</text>
<text class="c" x="82" y="389">onOp</text>
<rect class="cardT" x="472" y="363" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="363" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="387" r="10"/>
<text class="num" x="494" y="391" text-anchor="middle">5</text>
<text class="t" x="514" y="392">Emits a structured op array describing</text>
<text class="t" x="514" y="414">each edit</text>
<text class="comp" x="514" y="442">component: op stream</text>
<rect class="card" x="40" y="435" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="435" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="459" r="10"/>
<text class="num" x="62" y="463" text-anchor="middle">6</text>
<text class="t" x="82" y="464">Point ops at your storage — Express +</text>
<text class="t" x="82" y="486">MongoDB demo included</text>
<text class="c" x="82" y="510">node index.js</text>
<text class="comp" x="82" y="533">component: backend-demo</text>
<rect class="val" x="28" y="587" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="611">VALUE</text>
<text class="valT" x="48" y="635">An editable Excel-like grid inside your React app while storage and collaboration stay your</text>
<text class="valT" x="48" y="657">own stack — no vendor server</text>
</svg>
