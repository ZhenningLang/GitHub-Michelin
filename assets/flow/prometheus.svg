<svg xmlns="http://www.w3.org/2000/svg" width="880" height="769" viewBox="0 0 880 769" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="769" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="611" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="611" rx="10"/>
<rect class="pillT" x="474" y="40" width="165.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Prometheus does</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,306 L62,330" marker-end="url(#a)"/>
<path class="hand" d="M408,379.5 C439.0,379.5 439.0,403 470,403" marker-end="url(#a)"/>
<path class="hand" d="M472,438.5 C441.0,438.5 441.0,477 410,477" marker-end="url(#a)"/>
<path class="hand" d="M408,510.0 C439.0,510.0 439.0,548 470,548" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Start the Prometheus server; its UI</text>
<text class="t" x="82" y="123">and API listen on port 9090</text>
<text class="c" x="82" y="147">docker run --name prometheus -d -p</text>
<text class="c" x="82" y="166">127.0.0.1:9090:9090 prom/prometheus</text>
<rect class="card" x="40" y="212" width="368" height="94" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="94" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">Expose a /metrics page from your</text>
<text class="t" x="82" y="263">service with a client library, or run</text>
<text class="t" x="82" y="285">an exporter</text>
<rect class="card" x="40" y="332" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="332" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="356" r="10"/>
<text class="num" x="62" y="360" text-anchor="middle">3</text>
<text class="t" x="82" y="361">List the targets to scrape and how</text>
<text class="t" x="82" y="383">often in prometheus.yml</text>
<text class="c" x="82" y="407">scrape_configs</text>
<rect class="cardT" x="472" y="379" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="379" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="403" r="10"/>
<text class="num" x="494" y="407" text-anchor="middle">4</text>
<text class="t" x="514" y="408">Pulls every target&#x27;s /metrics over</text>
<text class="t" x="514" y="430">HTTP on each interval and stores the</text>
<text class="t" x="514" y="452">samples locally</text>
<text class="comp" x="514" y="480">component: scraper + local TSDB</text>
<rect class="card" x="40" y="453" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="453" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="477" r="10"/>
<text class="num" x="62" y="481" text-anchor="middle">5</text>
<text class="t" x="82" y="482">Write PromQL for graphs and alert</text>
<text class="t" x="82" y="504">rules</text>
<text class="c" x="82" y="528">rate(prometheus_tsdb_head_chunks_created_t</text>
<text class="c" x="82" y="547">otal[1m])</text>
<rect class="cardT" x="472" y="524" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="524" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="548" r="10"/>
<text class="num" x="494" y="552" text-anchor="middle">6</text>
<text class="t" x="514" y="553">Evaluates the rules continuously and</text>
<text class="t" x="514" y="575">sends firing alerts to Alertmanager</text>
<text class="comp" x="514" y="603">component: rule manager</text>
<rect class="val" x="28" y="653" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="677">VALUE</text>
<text class="valT" x="48" y="701">Every service&#x27;s health as queryable numbers, and a page when a rule crosses its threshold —</text>
<text class="valT" x="48" y="723">with no external database</text>
</svg>
