<svg xmlns="http://www.w3.org/2000/svg" width="880" height="649" viewBox="0 0 880 649" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="649" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="513" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="513" rx="10"/>
<rect class="pillT" x="474" y="40" width="178.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">SpiderKeeper 做的</text>
<path class="edge" d="M62,164 L62,188" marker-end="url(#a)"/>
<path class="hand" d="M408,239.0 C439.0,239.0 439.0,263 470,263" marker-end="url(#a)"/>
<path class="hand" d="M472,264.0 C441.0,264.0 441.0,338 410,338" marker-end="url(#a)"/>
<path class="hand" d="M408,339.0 C439.0,339.0 439.0,374 470,374" marker-end="url(#a)"/>
<path class="edge" d="M494,425 L494,449" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">装好它，指向已在运行的 Scrapyd 启动</text>
<text class="c" x="82" y="125">pip install spiderkeeper · spiderkeeper</text>
<text class="c" x="82" y="144">--server=http://localhost:6800</text>
<rect class="card" x="40" y="190" width="368" height="98" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="98" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">2</text>
<text class="t" x="82" y="219">在 :5000 的网页里建项目，上传爬虫 egg 包</text>
<text class="c" x="82" y="243">scrapyd-deploy --build-egg output.egg</text>
<text class="comp" x="82" y="266">组件：Flask 网页后台</text>
<rect class="cardT" x="472" y="239" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="239" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="263" r="10"/>
<text class="num" x="494" y="267" text-anchor="middle">3</text>
<text class="t" x="514" y="268">把 egg 推给 Scrapyd，并列出其中的爬虫</text>
<rect class="card" x="40" y="314" width="368" height="50" rx="8"/>
<rect class="accY" x="40" y="314" width="4" height="50" rx="2"/>
<circle class="accY" cx="62" cy="338" r="10"/>
<text class="num" x="62" y="342" text-anchor="middle">4</text>
<text class="t" x="82" y="343">加一个周期任务：选爬虫，填 cron 时间</text>
<rect class="cardT" x="472" y="350" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="350" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="374" r="10"/>
<text class="num" x="494" y="378" text-anchor="middle">5</text>
<text class="t" x="514" y="379">到点就让一台 Scrapyd 启动这个爬虫</text>
<text class="comp" x="514" y="407">组件：APScheduler 调度器</text>
<rect class="cardT" x="472" y="451" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="451" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="475" r="10"/>
<text class="num" x="494" y="479" text-anchor="middle">6</text>
<text class="t" x="514" y="480">回收任务状态，在面板上列出运行中和已</text>
<text class="t" x="514" y="502">结束的任务</text>
<rect class="val" x="28" y="555" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="579">价值</text>
<text class="valT" x="48" y="603">Scrapyd 有了点一下就能部署、能按 cron 定时的面板，不用再 curl 它的 JSON 接口</text>
</svg>
