<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="620" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="484" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="484" rx="10"/>
<rect class="pillT" x="474" y="40" width="156.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">haipproxy does</text>
<path class="hand" d="M408,132.0 C439.0,132.0 439.0,156 470,156" marker-end="url(#a)"/>
<path class="edge" d="M494,251 L494,275" marker-end="url(#a)"/>
<path class="hand" d="M472,336.5 C441.0,336.5 441.0,360 410,360" marker-end="url(#a)"/>
<path class="hand" d="M408,393.0 C439.0,393.0 439.0,446 470,446" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="120" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="120" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Point the settings at Redis and</text>
<text class="t" x="82" y="123">Splash, then start every component</text>
<text class="c" x="82" y="147">docker-compose up</text>
<text class="comp" x="82" y="170">component: config/settings.py</text>
<rect class="cardT" x="472" y="132" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="132" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="156" r="10"/>
<text class="num" x="494" y="160" text-anchor="middle">2</text>
<text class="t" x="514" y="161">Crawlers scrape public proxy-list</text>
<text class="t" x="514" y="183">sites and push the IPs into Redis</text>
<text class="t" x="514" y="205">queues</text>
<text class="comp" x="514" y="233">component: crawler_booter.py</text>
<rect class="cardT" x="472" y="277" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="277" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="301" r="10"/>
<text class="num" x="494" y="305" text-anchor="middle">3</text>
<text class="t" x="514" y="306">Schedulers re-queue the work;</text>
<text class="t" x="514" y="328">validators test each IP against</text>
<text class="t" x="514" y="350">specific target sites and score it</text>
<text class="comp" x="514" y="378">component: scheduler + validator</text>
<rect class="card" x="40" y="336" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="336" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="360" r="10"/>
<text class="num" x="62" y="364" text-anchor="middle">4</text>
<text class="t" x="82" y="365">In your spider, ask the client for</text>
<text class="t" x="82" y="387">proxies validated for your target site</text>
<text class="c" x="82" y="411">ProxyFetcher(&#x27;zhihu&#x27;, strategy=&#x27;greedy&#x27;,</text>
<text class="c" x="82" y="430">redis_args=args)</text>
<rect class="cardT" x="472" y="422" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="422" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="446" r="10"/>
<text class="num" x="494" y="450" text-anchor="middle">5</text>
<text class="t" x="514" y="451">Hands back a proxy from that site&#x27;s</text>
<text class="t" x="514" y="473">scored pool on each request</text>
<rect class="val" x="28" y="526" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="550">VALUE</text>
<text class="valT" x="48" y="574">A large distributed crawl keeps a self-refreshing pool of free proxies without buying any</text>
</svg>
