<svg xmlns="http://www.w3.org/2000/svg" width="880" height="664" viewBox="0 0 880 664" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="664" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="528" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="528" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Supermemory 做的</text>
<path class="edge" d="M62,189 L62,213" marker-end="url(#a)"/>
<path class="hand" d="M408,261.0 C439.0,261.0 439.0,285 470,285" marker-end="url(#a)"/>
<path class="edge" d="M494,336 L494,360" marker-end="url(#a)"/>
<path class="hand" d="M472,399.5 C441.0,399.5 441.0,423 410,423" marker-end="url(#a)"/>
<path class="hand" d="M408,445.0 C439.0,445.0 439.0,487 470,487" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="117" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="117" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">安装 SDK，指向它的 API</text>
<text class="c" x="82" y="125">npm install supermemory · pip install</text>
<text class="c" x="82" y="144">supermemory</text>
<text class="comp" x="82" y="167">组件：官方 SDK</text>
<rect class="card" x="40" y="215" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="215" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="239" r="10"/>
<text class="num" x="62" y="243" text-anchor="middle">2</text>
<text class="t" x="82" y="244">把原始对话轮次推给它，按用户打标签</text>
<text class="c" x="82" y="268">client.add({ content: &quot;...&quot;, containerTag:</text>
<text class="c" x="82" y="287">&quot;user_123&quot; })</text>
<rect class="cardT" x="472" y="261" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="261" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="285" r="10"/>
<text class="num" x="494" y="289" text-anchor="middle">3</text>
<text class="t" x="514" y="290">抽取事实、消解矛盾、让过期信息自动失效</text>
<text class="comp" x="514" y="318">组件：记忆引擎</text>
<rect class="cardT" x="472" y="362" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="362" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="386" r="10"/>
<text class="num" x="494" y="390" text-anchor="middle">4</text>
<text class="t" x="514" y="391">为每个用户维护静态＋动态画像，持续更新</text>
<text class="comp" x="514" y="419">组件：用户画像</text>
<rect class="card" x="40" y="399" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="399" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="423" r="10"/>
<text class="num" x="62" y="427" text-anchor="middle">5</text>
<text class="t" x="82" y="428">下次回复前，一次取回画像＋相关记忆</text>
<text class="c" x="82" y="452">client.profile({ containerTag: &quot;user_123&quot;,</text>
<text class="c" x="82" y="471">q: &quot;...&quot; })</text>
<rect class="cardT" x="472" y="463" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="463" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="487" r="10"/>
<text class="num" x="494" y="491" text-anchor="middle">6</text>
<text class="t" x="514" y="492">一次调用返回画像事实与混合检索记忆</text>
<text class="comp" x="514" y="520">组件：混合检索</text>
<rect class="val" x="28" y="570" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="594">价值</text>
<text class="valT" x="48" y="618">agent 第一句话就知道对面是谁——你不必运维向量库、embedding 管线或分块策略</text>
</svg>
