<svg xmlns="http://www.w3.org/2000/svg" width="880" height="782" viewBox="0 0 880 782" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="782" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="646" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="646" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Langfuse 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="edge" d="M62,263 L62,287" marker-end="url(#a)"/>
<path class="hand" d="M408,335.0 C439.0,335.0 439.0,359 470,359" marker-end="url(#a)"/>
<path class="edge" d="M494,432 L494,456" marker-end="url(#a)"/>
<path class="edge" d="M494,533 L494,557" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">起一个自托管实例（或注册 Langfuse Cloud）</text>
<text class="c" x="82" y="125">docker compose up</text>
<rect class="card" x="40" y="171" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">建项目、生成 API key，放进应用的环境变量</text>
<text class="c" x="82" y="224">LANGFUSE_SECRET_KEY · LANGFUSE_PUBLIC_KEY </text>
<text class="c" x="82" y="243">· LANGFUSE_BASE_URL</text>
<rect class="card" x="40" y="289" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="289" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="313" r="10"/>
<text class="num" x="62" y="317" text-anchor="middle">3</text>
<text class="t" x="82" y="318">给函数加装饰器，换上包装过的 OpenAI 客户端</text>
<text class="c" x="82" y="342">@observe() · from langfuse.openai import</text>
<text class="c" x="82" y="361">openai</text>
<rect class="cardT" x="472" y="335" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="335" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="359" r="10"/>
<text class="num" x="494" y="363" text-anchor="middle">4</text>
<text class="t" x="514" y="364">把每个请求里嵌套的调用连同提示词、输出、模</text>
<text class="t" x="514" y="386">型参数作为一条轨迹发出</text>
<text class="comp" x="514" y="414">组件：Langfuse SDK</text>
<rect class="cardT" x="472" y="458" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="458" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="482" r="10"/>
<text class="num" x="494" y="486" text-anchor="middle">5</text>
<text class="t" x="514" y="487">异步处理事件，把轨迹写进 ClickHouse</text>
<text class="comp" x="514" y="515">组件：langfuse-worker</text>
<rect class="cardT" x="472" y="559" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="559" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="583" r="10"/>
<text class="num" x="494" y="587" text-anchor="middle">6</text>
<text class="t" x="514" y="588">把每个请求展示成可搜索的调用树，附带会话、</text>
<text class="t" x="514" y="610">耗时和费用</text>
<text class="comp" x="514" y="638">组件：langfuse-web 界面</text>
<rect class="val" x="28" y="688" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="712">价值</text>
<text class="valT" x="48" y="736">一个坏回答能追到具体是哪次检索、哪个提示词版本、哪次模型调用导致的，而不是对着最后一行日志猜</text>
</svg>
