<svg xmlns="http://www.w3.org/2000/svg" width="880" height="702" viewBox="0 0 880 702" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="702" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="566" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="566" rx="10"/>
<rect class="pillT" x="474" y="40" width="243.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Cloudflare Computer 做的</text>
<path class="edge" d="M62,145 L62,169" marker-end="url(#a)"/>
<path class="hand" d="M408,207.5 C439.0,207.5 439.0,231 470,231" marker-end="url(#a)"/>
<path class="hand" d="M472,243.0 C441.0,243.0 441.0,294 410,294" marker-end="url(#a)"/>
<path class="edge" d="M62,343 L62,367" marker-end="url(#a)"/>
<path class="edge" d="M62,442 L62,466" marker-end="url(#a)"/>
<path class="hand" d="M408,504.5 C439.0,504.5 439.0,528 470,528" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">在你的 Worker 项目里安装这个包</text>
<text class="c" x="82" y="125">npm install @cloudflare/computer</text>
<rect class="card" x="40" y="171" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">2</text>
<text class="t" x="82" y="200">用 workspace 混入包住你的 Durable Object</text>
<text class="c" x="82" y="224">withWorkspace(...)</text>
<rect class="cardT" x="472" y="207" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="207" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="231" r="10"/>
<text class="num" x="494" y="235" text-anchor="middle">3</text>
<text class="t" x="514" y="236">把 workspace 存进 DO 自己的 SQLite</text>
<text class="t" x="514" y="258">，重启不丢</text>
<rect class="card" x="40" y="270" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="270" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="294" r="10"/>
<text class="num" x="62" y="298" text-anchor="middle">4</text>
<text class="t" x="82" y="299">从 Worker 打开 workspace，写入一个文件</text>
<text class="c" x="82" y="323">ws.fs.writeFile(&quot;/notes.md&quot;, ...)</text>
<rect class="card" x="40" y="369" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="369" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="393" r="10"/>
<text class="num" x="62" y="397" text-anchor="middle">5</text>
<text class="t" x="82" y="398">注册一个执行后端来跑命令</text>
<text class="c" x="82" y="422">new WorkerShellBackend({...})</text>
<rect class="card" x="40" y="468" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="468" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="492" r="10"/>
<text class="num" x="62" y="496" text-anchor="middle">6</text>
<text class="t" x="82" y="497">通过唯一的 exec 入口跑一条命令</text>
<text class="c" x="82" y="521">ws.runtime.exec(&quot;cat /hello.txt&quot;)</text>
<rect class="cardT" x="472" y="504" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="504" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="528" r="10"/>
<text class="num" x="494" y="532" text-anchor="middle">7</text>
<text class="t" x="514" y="533">在后端里执行，实时回传</text>
<text class="t" x="514" y="555">stdout／stderr／exitCode</text>
<rect class="val" x="28" y="608" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="632">价值</text>
<text class="valT" x="48" y="656">agent 得到一个活得比重启更久的工作目录，加一个能在上面干活的 exec 入口——沙箱机群和同步胶水都不用你管</text>
</svg>
