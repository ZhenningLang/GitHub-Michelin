<svg xmlns="http://www.w3.org/2000/svg" width="880" height="821" viewBox="0 0 880 821" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="821" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="685" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="685" rx="10"/>
<rect class="pillT" x="474" y="40" width="105.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">verl 做的</text>
<path class="edge" d="M62,186 L62,210" marker-end="url(#a)"/>
<path class="edge" d="M62,304 L62,328" marker-end="url(#a)"/>
<path class="hand" d="M408,377.5 C439.0,377.5 439.0,401 470,401" marker-end="url(#a)"/>
<path class="edge" d="M494,474 L494,498" marker-end="url(#a)"/>
<path class="edge" d="M494,572 L494,596" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="114" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="114" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用推荐的 Docker 镜像，或让 uv 按 uv.lock</text>
<text class="t" x="82" y="123">建环境</text>
<text class="c" x="82" y="147">uv run --frozen --all-packages --extra</text>
<text class="c" x="82" y="166">vllm --extra fsdp</text>
<rect class="card" x="40" y="212" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="212" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="236" r="10"/>
<text class="num" x="62" y="240" text-anchor="middle">2</text>
<text class="t" x="82" y="241">把数据集转成带奖励所需字段的 parquet</text>
<text class="c" x="82" y="265">python3 examples/data_preprocess/gsm8k.py</text>
<text class="c" x="82" y="284">--local_save_dir ~/data/gsm8k</text>
<rect class="card" x="40" y="330" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="330" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="354" r="10"/>
<text class="num" x="62" y="358" text-anchor="middle">3</text>
<text class="t" x="82" y="359">启动训练器，覆盖数据、模型、生成引擎和 </text>
<text class="t" x="82" y="381">GPU配置</text>
<text class="c" x="82" y="405">python3 -m verl.trainer.main_ppo</text>
<rect class="cardT" x="472" y="377" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="377" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="401" r="10"/>
<text class="num" x="494" y="405" text-anchor="middle">4</text>
<text class="t" x="514" y="406">拉起 Ray，把演员、生成、参考、评论家工作进</text>
<text class="t" x="514" y="428">程放到 GPU 上</text>
<text class="comp" x="514" y="456">组件：单控制器训练器</text>
<rect class="cardT" x="472" y="500" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="500" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="524" r="10"/>
<text class="num" x="494" y="528" text-anchor="middle">5</text>
<text class="t" x="514" y="529">vLLM 或 SGLang 生成回答，你的奖励打分，算</text>
<text class="t" x="514" y="551">出优势</text>
<rect class="cardT" x="472" y="598" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="598" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="622" r="10"/>
<text class="num" x="494" y="626" text-anchor="middle">6</text>
<text class="t" x="514" y="627">FSDP 或 Megatron 更新演员，权重重分片回生</text>
<text class="t" x="514" y="649">成引擎并存档</text>
<text class="comp" x="514" y="677">组件：3D-HybridEngine</text>
<rect class="val" x="28" y="727" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="751">价值</text>
<text class="valT" x="48" y="775">一次生成与训练高效共用或分用 GPU 的 RL 训练，不用自己写权重同步胶水</text>
</svg>
