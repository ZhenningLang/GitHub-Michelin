<svg xmlns="http://www.w3.org/2000/svg" width="880" height="562" viewBox="0 0 880 562" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="562" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="426" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="426" rx="10"/>
<rect class="pillT" x="474" y="40" width="169.5" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">SuperClaude 做的</text>
<path class="hand" d="M408,118.0 C439.0,118.0 439.0,142 470,142" marker-end="url(#a)"/>
<path class="hand" d="M472,166.5 C441.0,166.5 441.0,214 410,214" marker-end="url(#a)"/>
<path class="hand" d="M408,226.5 C439.0,226.5 439.0,265 470,265" marker-end="url(#a)"/>
<path class="hand" d="M472,277.0 C441.0,277.0 441.0,313 410,313" marker-end="url(#a)"/>
<path class="hand" d="M408,325.5 C439.0,325.5 439.0,363 470,363" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用 pipx 装好框架，再写入 Claude Code</text>
<text class="c" x="82" y="125">pipx install superclaude · superclaude</text>
<text class="c" x="82" y="144">install</text>
<rect class="cardT" x="472" y="118" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="118" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="142" r="10"/>
<text class="num" x="494" y="146" text-anchor="middle">2</text>
<text class="t" x="514" y="147">把 30 命令、20 agent、7 模式写入 Claude</text>
<text class="t" x="514" y="169">Code 配置</text>
<text class="comp" x="514" y="197">组件：Python 安装器 CLI</text>
<rect class="card" x="40" y="190" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">3</text>
<text class="t" x="82" y="219">重启 Claude Code，用命令代替粘 prompt</text>
<text class="c" x="82" y="243">/sc:brainstorm</text>
<rect class="cardT" x="472" y="241" width="368" height="72" rx="8"/>
<rect class="accT" x="472" y="241" width="4" height="72" rx="2"/>
<circle class="accT" cx="494" cy="265" r="10"/>
<text class="num" x="494" y="269" text-anchor="middle">4</text>
<text class="t" x="514" y="270">行为指令注入设定 persona 与模式，路由到对</text>
<text class="t" x="514" y="292">应领域 agent</text>
<rect class="card" x="40" y="289" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="289" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="313" r="10"/>
<text class="num" x="62" y="317" text-anchor="middle">5</text>
<text class="t" x="82" y="318">可选地接上 MCP 服务，获得实时文档与搜索</text>
<text class="c" x="82" y="342">superclaude mcp --servers tavily context7</text>
<rect class="cardT" x="472" y="339" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="339" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="363" r="10"/>
<text class="num" x="494" y="367" text-anchor="middle">6</text>
<text class="t" x="514" y="368">让 /sc:research 做多跳网络调研，并按来源</text>
<text class="t" x="514" y="390">可信度打分</text>
<text class="comp" x="514" y="418">组件：Deep Research 模式</text>
<rect class="val" x="28" y="468" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="492">价值</text>
<text class="valT" x="48" y="516">Claude Code 每次会话都自带共享命令词汇表和结构化 persona——不必再维护一套粘 prompt 的纪律</text>
</svg>
