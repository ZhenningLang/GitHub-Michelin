<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="600" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="442" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="442" rx="10"/>
<rect class="pillT" x="474" y="40" width="322.2" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">make-interfaces-feel-better does</text>
<path class="hand" d="M408,118.0 C439.0,118.0 439.0,142 470,142" marker-end="url(#a)"/>
<path class="hand" d="M472,165.0 C441.0,165.0 441.0,214 410,214" marker-end="url(#a)"/>
<path class="hand" d="M408,237.5 C439.0,237.5 439.0,262 470,262" marker-end="url(#a)"/>
<path class="edge" d="M494,332 L494,356" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the skill into your agent</text>
<text class="c" x="82" y="125">npx skills add</text>
<text class="c" x="82" y="144">jakubkrehel/make-interfaces-feel-better</text>
<rect class="cardT" x="472" y="118" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="118" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="142" r="10"/>
<text class="num" x="494" y="146" text-anchor="middle">2</text>
<text class="t" x="514" y="147">Loads automatically whenever a task</text>
<text class="t" x="514" y="169">touches UI polish — the frontmatter is</text>
<text class="t" x="514" y="191">stuffed with trigger cues</text>
<rect class="card" x="40" y="190" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="190" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="214" r="10"/>
<text class="num" x="62" y="218" text-anchor="middle">3</text>
<text class="t" x="82" y="219">Build the UI as usual, or ask it to</text>
<text class="t" x="82" y="241">review the diff just written</text>
<text class="c" x="82" y="265">quick · full</text>
<rect class="cardT" x="472" y="238" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="238" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="262" r="10"/>
<text class="num" x="494" y="266" text-anchor="middle">4</text>
<text class="t" x="514" y="267">Applies its 19 numbered principles in</text>
<text class="t" x="514" y="289">the project&#x27;s existing styling system,</text>
<text class="t" x="514" y="311">never a second one</text>
<rect class="cardT" x="472" y="358" width="368" height="94" rx="8"/>
<rect class="accT" x="472" y="358" width="4" height="94" rx="2"/>
<circle class="accT" cx="494" cy="382" r="10"/>
<text class="num" x="494" y="386" text-anchor="middle">5</text>
<text class="t" x="514" y="387">Walks every state and replays motion</text>
<text class="t" x="514" y="409">at 10% speed, then returns</text>
<text class="t" x="514" y="431">severity-tagged findings</text>
<rect class="val" x="28" y="484" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="508">VALUE</text>
<text class="valT" x="48" y="532">Functionally-correct UI comes out feeling intentional without hand-writing a polish checklist</text>
<text class="valT" x="48" y="554">per prompt</text>
</svg>
