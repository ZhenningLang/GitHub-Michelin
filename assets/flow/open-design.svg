<svg xmlns="http://www.w3.org/2000/svg" width="880" height="735" viewBox="0 0 880 735" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="735" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="577" rx="10"/>
<rect class="pillY" x="42" y="40" width="83.2" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">You do</text>
<rect class="laneT" x="460" y="28" width="392" height="577" rx="10"/>
<rect class="pillT" x="474" y="40" width="175.1" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">Open Design does</text>
<path class="hand" d="M408,131.5 C439.0,131.5 439.0,155 470,155" marker-end="url(#a)"/>
<path class="hand" d="M472,190.5 C441.0,190.5 441.0,241 410,241" marker-end="url(#a)"/>
<path class="hand" d="M408,253.0 C439.0,253.0 439.0,300 470,300" marker-end="url(#a)"/>
<path class="edge" d="M494,418 L494,442" marker-end="url(#a)"/>
<path class="hand" d="M472,492.5 C441.0,492.5 441.0,516 410,516" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="119" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="119" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">Install the desktop app; have a</text>
<text class="t" x="82" y="123">coding-agent CLI on PATH or a BYOK</text>
<text class="t" x="82" y="145">model key</text>
<text class="comp" x="82" y="173">component: desktop app</text>
<rect class="cardT" x="472" y="131" width="368" height="119" rx="8"/>
<rect class="accT" x="472" y="131" width="4" height="119" rx="2"/>
<circle class="accT" cx="494" cy="155" r="10"/>
<text class="num" x="494" y="159" text-anchor="middle">2</text>
<text class="t" x="514" y="160">Detects the agent CLIs on PATH and</text>
<text class="t" x="514" y="182">loads skills, templates and 151 design</text>
<text class="t" x="514" y="204">systems</text>
<text class="comp" x="514" y="232">component: local daemon</text>
<rect class="card" x="40" y="217" width="368" height="72" rx="8"/>
<rect class="accY" x="40" y="217" width="4" height="72" rx="2"/>
<circle class="accY" cx="62" cy="241" r="10"/>
<text class="num" x="62" y="245" text-anchor="middle">3</text>
<text class="t" x="82" y="246">On Home, pick an artifact type and a</text>
<text class="t" x="82" y="268">design system, then type a brief</text>
<rect class="cardT" x="472" y="276" width="368" height="142" rx="8"/>
<rect class="accT" x="472" y="276" width="4" height="142" rx="2"/>
<circle class="accT" cx="494" cy="300" r="10"/>
<text class="num" x="494" y="304" text-anchor="middle">4</text>
<text class="t" x="514" y="305">Runs your agent in the project folder</text>
<text class="t" x="514" y="327">with the template and DESIGN.md</text>
<text class="t" x="514" y="349">composed in</text>
<text class="c" x="514" y="373">DESIGN.md</text>
<text class="comp" x="514" y="396">component: runtime adapter</text>
<rect class="cardT" x="472" y="444" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="444" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="468" r="10"/>
<text class="num" x="494" y="472" text-anchor="middle">5</text>
<text class="t" x="514" y="473">Renders the files it writes in a</text>
<text class="t" x="514" y="495">sandboxed live preview</text>
<text class="comp" x="514" y="523">component: Studio preview iframe</text>
<rect class="card" x="40" y="492" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="492" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="516" r="10"/>
<text class="num" x="62" y="520" text-anchor="middle">6</text>
<text class="t" x="82" y="521">Critique in chat until it looks right,</text>
<text class="t" x="82" y="543">then export</text>
<text class="c" x="82" y="567">HTML · PDF · PPTX</text>
<rect class="val" x="28" y="619" width="824" height="88" rx="10"/>
<text class="valK" x="48" y="643">VALUE</text>
<text class="valT" x="48" y="667">On-brand prototypes, decks and videos as real files on your disk, made by the agent you</text>
<text class="valT" x="48" y="689">already pay for</text>
</svg>
