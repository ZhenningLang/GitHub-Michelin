<svg xmlns="http://www.w3.org/2000/svg" width="880" height="533" viewBox="0 0 880 533" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}

.comp{font:600 12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#8250df}
@media (prefers-color-scheme: dark){.comp{fill:#a371f7}}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="533" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="397" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="397" rx="10"/>
<rect class="pillT" x="474" y="40" width="141.9" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">PikiwiDB 做的</text>
<path class="hand" d="M408,108.5 C439.0,108.5 439.0,132 470,132" marker-end="url(#a)"/>
<path class="hand" d="M472,156.5 C441.0,156.5 441.0,195 410,195" marker-end="url(#a)"/>
<path class="hand" d="M408,218.5 C439.0,218.5 439.0,255 470,255" marker-end="url(#a)"/>
<path class="hand" d="M472,268.5 C441.0,268.5 441.0,316 410,316" marker-end="url(#a)"/>
<path class="hand" d="M408,328.5 C439.0,328.5 439.0,356 470,356" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用官方 Docker 镜像起一个节点</text>
<text class="c" x="82" y="125">docker run -d · pikadb/pika:v3.3.6</text>
<rect class="cardT" x="472" y="108" width="368" height="97" rx="8"/>
<rect class="accT" x="472" y="108" width="4" height="97" rx="2"/>
<circle class="accT" cx="494" cy="132" r="10"/>
<text class="num" x="494" y="136" text-anchor="middle">2</text>
<text class="t" x="514" y="137">热数据留在内存，全量数据落到本地磁盘的</text>
<text class="t" x="514" y="159">RocksDB</text>
<text class="comp" x="514" y="187">组件：内存缓存 + RocksDB 分层</text>
<rect class="card" x="40" y="171" width="368" height="95" rx="8"/>
<rect class="accY" x="40" y="171" width="4" height="95" rx="2"/>
<circle class="accY" cx="62" cy="195" r="10"/>
<text class="num" x="62" y="199" text-anchor="middle">3</text>
<text class="t" x="82" y="200">现有 Redis 客户端原样指过去，协议兼容、代</text>
<text class="t" x="82" y="222">码不改</text>
<text class="c" x="82" y="246">redis-cli -p 9221 &quot;info&quot;</text>
<rect class="cardT" x="472" y="231" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="231" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="255" r="10"/>
<text class="num" x="494" y="259" text-anchor="middle">4</text>
<text class="t" x="514" y="260">按 Redis 协议应答，数据从落盘结构中取</text>
<text class="comp" x="514" y="288">组件：Redis 兼容服务层</text>
<rect class="card" x="40" y="292" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="292" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="316" r="10"/>
<text class="num" x="62" y="320" text-anchor="middle">5</text>
<text class="t" x="82" y="321">用你熟悉的 Redis 命令挂一个从库</text>
<text class="c" x="82" y="345">slaveof</text>
<rect class="cardT" x="472" y="332" width="368" height="75" rx="8"/>
<rect class="accT" x="472" y="332" width="4" height="75" rx="2"/>
<circle class="accT" cx="494" cy="356" r="10"/>
<text class="num" x="494" y="360" text-anchor="middle">6</text>
<text class="t" x="514" y="361">通过 binlog 异步复制，支持全量与增量同步</text>
<text class="comp" x="514" y="389">组件：binlog 复制</text>
<rect class="val" x="28" y="439" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="463">价值</text>
<text class="valT" x="48" y="487">单节点装下几百 GB、按 SSD 计价，Redis 客户端代码一行不改</text>
</svg>
