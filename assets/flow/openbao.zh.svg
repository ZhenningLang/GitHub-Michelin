<svg xmlns="http://www.w3.org/2000/svg" width="880" height="629" viewBox="0 0 880 629" role="img">
<style>
.bg{fill:#ffffff}.lane{fill:#f6f8fa}.laneT{fill:#fbf7ec}
.hdr{font:600 13px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;letter-spacing:.08em}
.hY{fill:#0969da}.hT{fill:#9a6700}
.pillY{fill:#ddf4ff}.pillT{fill:#fff1c2}
.card{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cardT{fill:#ffffff;stroke:#e3c46a;stroke-width:1}
.accY{fill:#0969da}.accT{fill:#bf8700}
.t{font:500 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1f2328}
.c{font:12.5px 'SF Mono',Menlo,Consolas,monospace;fill:#57606a}
.num{font:700 11px 'SF Mono',Menlo,Consolas,monospace;fill:#ffffff}
.edge{stroke:#8c959f;stroke-width:1.5;fill:none}
.hand{stroke:#8c959f;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.ah{fill:#8c959f}
.val{fill:#dafbe1;stroke:#4ac26b;stroke-width:1}
.valK{font:700 12px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37;letter-spacing:.08em}
.valT{font:600 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;fill:#1a7f37}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117}.lane{fill:#161b22}.laneT{fill:#1c1a14}
.hY{fill:#58a6ff}.hT{fill:#d4a72c}.pillY{fill:#0c2d6b}.pillT{fill:#3b2e0a}
.card{fill:#0d1117;stroke:#30363d}.cardT{fill:#0d1117;stroke:#6e5a1f}
.accY{fill:#1f6feb}.accT{fill:#9e6a03}
.t{fill:#e6edf3}.c{fill:#8b949e}
.edge,.hand{stroke:#6e7681}.ah{fill:#6e7681}
.val{fill:#0f2d1a;stroke:#2ea043}.valK,.valT{fill:#3fb950}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="880" height="629" rx="12"/>
<rect class="lane" x="28" y="28" width="392" height="493" rx="10"/>
<rect class="pillY" x="42" y="40" width="74.8" height="24" rx="12"/>
<text class="hdr hY" x="56" y="57">你做的</text>
<rect class="laneT" x="460" y="28" width="392" height="493" rx="10"/>
<rect class="pillT" x="474" y="40" width="132.7" height="24" rx="12"/>
<text class="hdr hT" x="488" y="57">OpenBao 做的</text>
<path class="hand" d="M408,127.5 C439.0,127.5 439.0,151 470,151" marker-end="url(#a)"/>
<path class="hand" d="M472,152.0 C441.0,152.0 441.0,233 410,233" marker-end="url(#a)"/>
<path class="edge" d="M62,282 L62,306" marker-end="url(#a)"/>
<path class="hand" d="M408,344.5 C439.0,344.5 439.0,368 470,368" marker-end="url(#a)"/>
<path class="hand" d="M472,369.0 C441.0,369.0 441.0,431 410,431" marker-end="url(#a)"/>
<path class="hand" d="M408,453.0 C439.0,453.0 439.0,477 470,477" marker-end="url(#a)"/>
<rect class="card" x="40" y="72" width="368" height="111" rx="8"/>
<rect class="accY" x="40" y="72" width="4" height="111" rx="2"/>
<circle class="accY" cx="62" cy="96" r="10"/>
<text class="num" x="62" y="100" text-anchor="middle">1</text>
<text class="t" x="82" y="101">用已知根令牌启动本地服务端</text>
<text class="c" x="82" y="125">bao server -dev</text>
<text class="c" x="82" y="144">-dev-root-token-id=&quot;example-tutorial-token</text>
<text class="c" x="82" y="163">&quot;</text>
<rect class="cardT" x="472" y="127" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="127" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="151" r="10"/>
<text class="num" x="494" y="155" text-anchor="middle">2</text>
<text class="t" x="514" y="156">在 :8200 提供 HTTP，已经解封</text>
<rect class="card" x="40" y="209" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="209" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="233" r="10"/>
<text class="num" x="62" y="237" text-anchor="middle">3</text>
<text class="t" x="82" y="238">用该令牌给客户端鉴权</text>
<text class="c" x="82" y="262">client.SetToken(&quot;example-tutorial-token&quot;)</text>
<rect class="card" x="40" y="308" width="368" height="73" rx="8"/>
<rect class="accY" x="40" y="308" width="4" height="73" rx="2"/>
<circle class="accY" cx="62" cy="332" r="10"/>
<text class="num" x="62" y="336" text-anchor="middle">4</text>
<text class="t" x="82" y="337">写入一条带版本的密钥</text>
<text class="c" x="82" y="361">client.KVv2(mountPoint).Put(...)</text>
<rect class="cardT" x="472" y="344" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="344" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="368" r="10"/>
<text class="num" x="494" y="372" text-anchor="middle">5</text>
<text class="t" x="514" y="373">先加密再写入存储</text>
<rect class="card" x="40" y="407" width="368" height="92" rx="8"/>
<rect class="accY" x="40" y="407" width="4" height="92" rx="2"/>
<circle class="accY" cx="62" cy="431" r="10"/>
<text class="num" x="62" y="435" text-anchor="middle">6</text>
<text class="t" x="82" y="436">再把密钥读回来</text>
<text class="c" x="82" y="460">bao kv get -mount=secret -field=password</text>
<text class="c" x="82" y="479">developer-quickstart</text>
<rect class="cardT" x="472" y="453" width="368" height="50" rx="8"/>
<rect class="accT" x="472" y="453" width="4" height="50" rx="2"/>
<circle class="accT" cx="494" cy="477" r="10"/>
<text class="num" x="494" y="481" text-anchor="middle">7</text>
<text class="t" x="514" y="482">解密后返回明文</text>
<rect class="val" x="28" y="535" width="824" height="66" rx="10"/>
<text class="valK" x="48" y="559">价值</text>
<text class="valT" x="48" y="583">密码不再躺在配置文件里，磁盘上只剩密文</text>
</svg>
