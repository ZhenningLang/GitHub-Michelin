		.d2-2285979673 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="bjA="><g class="shape" ><path d="M 306 28 L 517 28 L 491 94 L 280 94 L 280 94 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="398.5" y="66.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">收到机器人消息</text></g><g class="bjE="><g class="shape" ><rect x="274" y="175" width="248" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="398" y="213.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="398" dy="0">提及→命令→订阅事件；</tspan><tspan x="398" dy="18.5">附追踪，选中 App①</tspan></text></g><g class="bjI="><g class="shape" ><rect x="12" y="508" width="238" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="131" y="546.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">有连接则走 WebSocket①</text></g><g class="bjM="><g class="shape" ><rect x="270" y="508" width="257" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="398.5" y="546.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">有配置则走内置处理器①</text></g><g class="bjQ="><g class="shape" ><rect x="547" y="508" width="257" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="675.5" y="546.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Webhook 首次同步尝试①②</text></g><g class="bjU="><g class="shape" ><path d="M 298 829 L 298 745 L 692 745 L 692 829 C 626 811 561 811 495 829 C 429 846 364 846 298 829 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="495" y="778.378468" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="495" dy="0">内存任务：等 10 秒，必要时再等 60 秒；</tspan><tspan x="495" dy="18.5">重启丢失，只重投递②</tspan></text></g><g class="bjY="><g class="shape" ><path d="M 712 829 L 712 745 L 998 745 L 998 829 C 950 811 903 811 855 829 C 807 846 760 846 712 829 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="855" y="778.378468" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="855" dy="0">符合条件的首次结果回复；</tspan><tspan x="855" dy="18.5">使用已保存的上下文令牌②</tspan></text></g><g class="bjc="><g class="shape" ><path d="M 754 28 L 1026 28 L 1000 94 L 728 94 L 728 94 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="877" y="66.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">独立支线：注册表来源</text></g><g class="bjg="><g class="shape" ><rect x="729" y="171" width="295" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="876.5" y="209.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="876.5" dy="0">规范网址，最多读取 10 MiB；</tspan><tspan x="876.5" dy="18.5">出错时用已有缓存③</tspan></text></g><g class="bjk="><g class="shape" ><path d="M 734 425 L 734 341 L 1020 341 L 1020 425 C 972 407 925 407 877 425 C 829 442 782 442 734 425 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="877" y="374.378468" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="877" dy="0">汇总可用列表，可能陈旧；</tspan><tspan x="877" dy="18.5">全部来源失败则报错③</tspan></text></g><g class="bjEw"><g class="shape" ><path d="M 1100 12 L 1372 12 L 1346 94 L 1074 94 L 1074 94 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="1223" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1223" dy="0">独立支线：密码注册；</tspan><tspan x="1223" dy="18.5">检查用户数量④</tspan></text></g><g class="bjEx"><g class="shape" ><path d="M 1044 248 L 1044 164 L 1402 164 L 1402 248 C 1342 230 1283 230 1223 248 C 1163 265 1104 265 1044 248 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="1223" y="197.378468" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1223" dy="0">零用户：超级管理员；</tspan><tspan x="1223" dy="18.5">否则：检查注册开关，再创建成员④</tspan></text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-2285979673-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 398.024689 95.999848 L 398.950621 171.000305" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2285979673-3488378134)" mask="url(#d2-2285979673)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M 336.5 259 L 336.5 291 S 336.5 301 326.5 301 L 141 301 S 131 301 131 311 L 131 504" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2285979673-3488378134)" mask="url(#d2-2285979673)" /><text x="152.5" y="307" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">独立判断</text></g><g class="KG4xIC0mZ3Q7IG4zKVswXQ=="><path d="M 398.5 259 L 398.5 504" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width: