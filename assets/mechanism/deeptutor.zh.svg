e;font-size:16px">数真实文档，再限展示条数②</text></g><g class="bjU="><g class="shape" ><path d="M 258 419 L 258 354 L 596 354 L 596 419 C 540 405 483 405 427 419 C 371 434 314 434 258 419 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="427" y="387.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">清单或不可用；不证明索引成功②</text></g><g class="bjY="><g class="shape" ><rect x="821" y="12" width="176" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="909" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">模型探索轮次③</text></g><g class="bjc="><g class="shape" ><rect x="616" y="354" width="297" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="764.5" y="392.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">调用工具／收集来源与答复③</text></g><g class="bjg="><g class="shape" ><rect x="1037" y="359" width="277" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1175.5" y="397.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">有限收尾／禁用工具结束③</text></g><g class="bjk="><g class="shape" ><path d="M 953 575 L 953 510 L 1219 510 L 1219 575 C 1175 561 1130 561 1086 575 C 1042 590 997 590 953 575 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="1086" y="543.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">回答供核验，不保证正确</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-3187964535-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 255.9958 79.999996