ss="text-bold fill-N1" style="text-anchor:middle;font-size:16px">会话按配置检查</text></g><g class="bjU="><g class="shape" ><rect x="12" y="768" width="338" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="181" y="806.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">计算阻塞、奖励清零、随机种子①</text></g><g class="bjY="><g class="shape" ><rect x="144" y="1005" width="318" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="303" y="1043.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">仍须满足其它阻塞与最低奖励①</text></g><g class="bjc="><g class="shape" ><rect x="124" y="1232" width="358" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="303" y="1270.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">查可领取、金额、重复，否则拒绝②</text></g><g class="bjg="><g class="shape" ><rect x="124" y="1459" width="358" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="303" y="1497.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">保存、恢复队列，可配置缺钱暂停②</text></g><g class="bjk="><g class="shape" ><path d="M 152 1725 C 152 1726 149 1727 146 1727 C 108 1728 78 1739 78 1753 C 78 1768 112 1780 155 1780 H 446 C 492 1780 530 1767 530 1752 C 530 1737 495 1725 452 1724 C 449 1724 446 1723 445 1722 C 435 1707 390 1696 337 1696 C 302 1696 272 1701 252 1708 C 250 1709 246 1709 244 1709 C 236 1708 228 1708 219 1708 C 183 1708 155 1715 152 1725 Z" stroke="#0D32B2" fill="#FFFFFF" class=" stroke-B1 fill-N7" style="stroke-width:2;" /></g><text x="301.094" y="1759.516" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">注资钱包与 RPC，待回执也可能失败②</text></g><g class="bjEw"><g class="shape" ><path d="M 702 12 L 1078 12 L 1052 78 L 676 78 L 676 78 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="877" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">可选 Zupass：按票号而非账号身份④</text></g><g class="bjEx"><g class="shape" ><rect x="728" y="148" width="297" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="876.5" y="186.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">按配置限制历史用量与并发④</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-2007239552-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 457 80 L 457 144" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2007239552-3488378134)" mask="url(#d2-2007239552)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M 303.25 216 L 303.25 386" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2007239552-3488378134)" mask="url(#d2-2007239552)" /><text x="303.5" y="308" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">加载成功</text></g><g class="KG4xIC0mZ3Q7IG4zKVswXQ=="><marker id="mk-d2-2007239552-2177206569" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B2" stroke-width="2" /> </marker><path d="M 610.247076 215.999998 L 610.005848 381.000004" stroke="#0D32B2" fill="none" class="connection stroke-B2" style="stroke-width:2;stroke-dasharray:10.000000,9.865639;" marker-end="url(#mk-d2-2007239552-2177206569)" mask="url(#d2-2007239552)" /><text x="610.5" y="305" fill="#676C7E" class="text-italic fill-N2" style="text-