		.d2-3544488850 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="bjA="><g class="shape" ><path d="M 423 239 L 950 239 L 924 305 L 397 305 L 397 305 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="673.5" y="277.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">film.html：轨道与片段；每个镜头是带 frame(t) 的网页</text></g><g class="bjE="><g class="shape" ><rect x="94" y="397" width="347" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="267.5" y="435.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">宿主把时间、随机数与动画钉在 t①</text></g><g class="bjI="><g class="shape" ><rect x="12" y="695" width="332" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="178" y="733.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">look 按两种乱序各画一遍并比对②</text></g><g class="bjM="><g class="shape" ><path d="M 261 614 L 261 549 L 681 549 L 681 614 C 611 600 541 600 471 614 C 401 629 331 629 261 614 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="471" y="582.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">最多 4 个浏览器并发出帧，ffmpeg 编码 MP4②</text></g><g class="bjQ="><g class="shape" ><rect x="493" y="12" width="360" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="673" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">人在 Studio 手改，存为片段 overrides③</text></g><g class="bjU="><g class="shape" ><path d="M 1005 414 C 1005 415 1002 416 999 416 C 961 417 932 428 932 442 C 932 457 965 469 1007 469 H 1293 C 1338 469 1375 456 1375 441 C 1375 426 1341 414 1298 413 C 1295 413 1292 412 1291 411 C 1281 396 1237 385 1186 385 C 1152 385 1122 390 1103 397 C 1101 398 1097 398 1095 398 C 1088 397 1080 397 1071 397 C 1036 397 1008 404 1005 414 Z" stroke="#0D32B2" fill="#FFFFFF" class=" stroke-B1 fill-N7" style="stroke-width:2;" /></g><text x="1151.4085" y="448.516" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">agent 用自己的文件工具重写 film.html</text></g><g class="bjY="><g class="shape" ><rect x="701" y="551" width="439" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="920.5" y="589.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">按片段与字段三方合并；冲突时人的值胜出④</text></g><g class="bjc="><g class="shape" ><path d="M 718 760 L 718 695 L 1123 695 L 1123 760 C 1056 746 988 746 921 760 C 853 775 786 775 718 760 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="920.5" y="728.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">告诉 agent 保留了什么；两版都存进历史④</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-3544488850-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 535.977052 306.999868 L 535.655754 335.000658 S 535.541016 345 525.541016 345 L 278.083008 345 S 268.083008 345 268.083008 355 L 268.083008 393" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3544488850-3488378134)" mask="url(#d2-3544488850)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M 178 465 L 178 691" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3544488850-3488378134)" mask="url(#d2-3544488850)" /><text x="178.5" y="585" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">同一 t 同一画面</text></g><g class="KG4xIC0mZ3Q7IG4zKVswXQ=="><path d="M 325.917939 464.999999 L 325.996092 545.000002" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3544488850-3488378134)" mask="url(#d2-3544488850)" /></g><g class="KG40IC0mZ3Q7IG4wKVswXQ=="><path d="M 673.793612 79.999998 L 673.994808 235.000003" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3544488850-3488378134)" mask="url(#d2-3544488850)" /><text x="673.5" y="164" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">overrides 属性</text></g><g class="KG41IC0mZ3Q7IG42KVswXQ=="><path d="M 1030.993976 470.999991 L 1030.762048 548.000018" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3544488850-3488378134)" mask="url(#d2-3544488850)" /></g><g class="KG4wIC0mZ3Q7IG42KVswXQ=="><path d="M 673.997951 306.999999 L 673.80126 499.000005 S 673.791016 509 683.791016 509 L 801.25 509 S 811.25 509 811.25 519 L 811.25 548" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3544488850-3488378134)" mask="url(#d2-3544488850)" /><text x="674" y="503" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">Studio 见过的版本</text></g><g class="KG42IC0mZ3Q7IG43KVswXQ=="><path d="M 921 619 L 921 691" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3544488850-3488378134)" mask="url(#d2-3544488850)" /></g><g class="