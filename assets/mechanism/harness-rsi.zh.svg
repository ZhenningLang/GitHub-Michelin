g><g class="bjU="><g class="shape" ><path d="M 201 903 L 201 838 L 487 838 L 487 903 C 439 889 392 889 344 903 C 296 918 249 918 201 903 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="344" y="871.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">生成表格与浏览器检索语料</text></g><g class="bjY="><g class="shape" ><rect x="303" y="556" width="378" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="492" y="594.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">快照与一致性检查；源码恢复不完整④</text></g><g class="bjc="><g class="shape" ><path d="M 171 1049 L 171 984 L 518 984 L 518 1049 C 460 1035 402 1035 345 1049 C 287 1064 229 1064 171 1049 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="344.5" y="1017.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">读者复核原文；没有代理晋升循环</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-3184335738-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 196.028569 79.999796 L 196.942863 144.000408" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3184335738-3488378134)" mask="url(#d2-3184335738)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M 196.5 216 L 196.5 280" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3184335738-3488378134)" mask="url(#d2-3184335738)" /></g><g class="KG4yIC0mZ3Q7IG4zKVswXQ=="><path d="M 196.5 352 L 196.5 416" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3184335738-3488378134)" mask="u