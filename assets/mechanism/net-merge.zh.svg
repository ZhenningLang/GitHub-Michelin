		.d2-2160455600 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="bjA="><g class="shape" ><path d="M 561 12 L 802 12 L 776 78 L 535 78 L 535 78 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="668.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">应用的 TCP 与 UDP 流</text></g><g class="bjE="><g class="shape" ><rect x="500" y="148" width="338" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="669" y="186.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">每地址族的 /1 路由导入虚拟网卡②</text></g><g class="bjI="><g class="shape" ><rect x="12" y="294" width="332" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="178" y="332.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">IPv6 策略；覆盖不齐时尽早拒绝⑤</text></g><g class="bjM="><g class="shape" ><rect x="35" y="576" width="286" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="178" y="614.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">用户态协议栈终止捕获的流</text></g><g class="bjQ="><g class="shape" ><rect x="272" y="430" width="331" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="437.5" y="468.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">逐接口与地址族的 TCP 可达探测③</text></g><g class="bjU="><g class="shape" ><rect x="623" y="430" width="358" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="802" y="468.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">中转字节调整权重；系统字节另计④</text></g><g class="bjY="><g class="shape" ><rect x="252" y="722" width="371" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="437.5" y="760.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">加权选择新流；UDP 立即释放负载槽①</text></g><g class="bjc="><g class="shape" ><rect x="495" y="868" width="308" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="649" y="906.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">绑定源地址和接口的套接字①②</text></g><g class="bjg="><g class="shape" ><path d="M 496 1069 L 496 1004 L 802 1004 L 802 1069 C 751 1055 700 1055 649 1069 C 598 1084 547 1084 496 1069 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="649" y="1037.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">直接出站；每流只走一条链路</text></g><g class="bjk="><g class="shape" ><rect x="1001" y="430" width="318" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1160" y="468.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">停止或后续清理尝试恢复状态⑥</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-2160455600-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 669 80 L 669 144" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2160455600-3488378134)" mask="url(#d2-2160455600)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M 612.666016 216 L 612.666016 244 S 612.666016 254 602.666016 254 L 188 254 S 178 254 178 264 L 178 290" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2160455600-3488378134)" mask="url(#d2-2160455600)" /></g><g class="KG4yIC0mZ3Q7IG4zKVswXQ=="><path d="M 178 362 L 178 572" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2160455600-3488378134)" mask="url(#d2-2160455600)" /><text x="178.5" y="474" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">获准的流</text></g><g class="KG4zIC0mZ3Q7IG42KVswXQ=="><path d="M 178 644 L 178 672 S 178 682 188 682 L 334.75 682 S 344.75 682 344.75 692 L 344.75 718" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2160455600-3488378134)" mask="url(#d2-2160455600)" /></g><g class="KG40IC0mZ3Q7IG42KVswXQ=="><path d="M 437.5 498 L 437.5 718" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2160455600-3488378134)" mask="url(#d2-2160455600)" /><text x="437.5" y="615" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">已通／未知／失败分层</text></g><g class="KG41IC0mZ3Q7IG42KVswXQ=="><path d="M 739 498 L 739 672 S 739 682 729 682 L 540.25 682 S 530.25 682 530.25 692 L 530.25 718" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2160455600-3488378134)" mask="url(#d2-2160455600)" /><text x="708" y="688" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">逐地址族权重</text></g><g class="KG42IC0mZ3Q7IG43KVswXQ=="><path d="M 598.249023 790 L 598.249023 864" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2160455600-3488378134)" mask="url(#d2-2160455600)" /></g><g class="KG43IC0mZ3Q7IG44KVswXQ=="><path d="M 649.594922 935.999965 L 649.976172 1000.000071" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2160455600-3488378134)" mask="url(#d2-2160455600)" /></g><g class="KG43IC0mZ3Q7IG41KVswXQ=="><path d="M 700.916016 866 L 700.916016 838 S 700.916016 828 710.916016 828 L 855 828 S 865 828 865 818 L 865 500" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2160455600-3488378134)" mask="url(#d2-2160455600)" /><text x="865" y="770" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">成功读写字节</text></g><g class="KG4xIC0mZ3Q7IG45KVswXQ=="><marker id="mk-d2-2160455600-2177206569" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B2" stroke-width="2" /> </marker><path d="M 725.333008 216 L 725.333008 244 S 725.333008 254 735.333008 254 L 1150 254 S 1160 254 1160 264 L 1160 426" stroke="#0D32B2" fill="none" class="connection stroke-B2" style="stroke-width:2;stroke-dasharray:10.000000,9.865639;" marker-end="url(#mk-d2-2160455600-2177206569)" mask="url(#d2-2160455600)" /><text x="1010.5" y="260" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">不保证会话迁移</text></g><mask id="d2-2160455600" maskUnits="userSpaceOnUse" x="-89" y="-89" width="1509" height="1270">
