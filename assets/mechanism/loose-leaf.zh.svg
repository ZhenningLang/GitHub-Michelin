e="stroke-width:2;" /></g><text x="643" y="66.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">在页面上画出的剪刀路径</text></g><g class="bjU="><g class="shape" ><rect x="480" y="164" width="327" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="643.5" y="202.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="643.5" dy="0">把每张贴图轮廓切成独立形状；</tspan><tspan x="643.5" dy="18.5">旧墨迹盖印到新贴图②</tspan></text></g><g class="bjY="><g class="shape" ><rect x="1200" y="12" width="327" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1363.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="1363.5" dy="0">页面缓存：保存或卸载旧顶页，</tspan><tspan x="1363.5" dy="18.5">异步加载新顶页③</tspan></text></g><g class="bjc="><g class="shape" ><path d="M 1233 355 C 1233 356 1230 357 1228 357 C 1195 358 1169 369 1169 383 C 1169 398 1198 410 1235 410 H 1486 C 1526 410 1558 397 1558 382 C 1558 367 1528 355 1490 354 C 1487 354 1485 353 1484 352 C 1476 337 1437 326 1391 326 C 1361 326 1334 331 1318 338 C 1316 339 1313 339 1311 339 C 1305 338 1297 338 1290 338 C 1261 338 1236 345 1233 355 Z" stroke="#0D32B2" fill="#FFFFFF" class=" stroke-B1 fill-N7" style="stroke-width:2;" /></g><text x="1362.705" y="389.516" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">唯一一个共享 OpenGL 绘图视图③</text></g><g class="bjg="><g class="shape" ><rect x="822" y="28" width="358" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1001" y="66.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">克隆手势在后台队列复制页面文件④</text></g><g class="bjk="><g class="shape" ><path d="M 668 391 L 668 326 L 976 326 L 976 391 C 925 377 873 377 822 391 C 771 406 719 406 668 391 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="822" y="359.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">页面叠里出现新页或新贴图②④</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-1985305021-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 305 248 L 305 334" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1985305021-3488378134)" mask="url(#d2-1985305021)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M 221.505348 405.999993 L 221.989305 587.000014" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1985305021-3488378134)" mask="url(#d2-1985305021)" /><text x="221.5" y="503" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">交集</text></g><g class="KG4xIC0mZ3Q7IG4zKVswXQ=="><path d="M 463.915985 406 L 463.915985 541 S 463.915985 551 473.915985 551 L 880.666016 551 S 890.666016 551 890.749509 560.999651 L 890.966603 587.000139" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1985305021-3488378134)" mask="url(#d2-1985305021)" /><text x="623.5" y="557" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">差集</text></g><g class="KG40IC0mZ3Q7IG41KVswXQ=="><path d="M 644 96 L 644 160" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1985305021-3488378134)" mask="url(#d2-1985305021)" /></g><g class="KG41IC0mZ3Q7IG45KVswXQ=="><path d="M 771.324683 247.999983 L 771.01665 322.000035" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1985305021-3488378134)" mask="url(#d2-19853