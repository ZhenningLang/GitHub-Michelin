or:middle;font-size:16px">以下仅历史 0.3.3 源码</text></g><g class="bjQ="><g class="shape" ><rect x="398" y="148" width="247" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="521.5" y="186.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="521.5" dy="0">共享文件加浏览器文件</tspan><tspan x="521.5" dy="18.5">派生 utils.js，合并清单③</tspan></text></g><g class="bjU="><g class="shape" ><rect x="414" y="300" width="216" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="522" y="338.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="522" dy="0">历史浏览器包</tspan><tspan x="522" dy="18.5">生产模式生成归档③</tspan></text></g><g class="bjY="><g class="shape" ><rect x="373" y="476" width="297" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="521.5" y="514.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">匹配网址、框架与加载时机②</text></g><g class="bjc="><g class="shape" ><path d="M 383 720 L 383 636 L 660 636 L 660 720 C 614 702 568 702 522 720 C 475 737 429 737 383 720 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="521.5" y="669.378468" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="521.5" dy="0">历史页面处理脚本</tspan><tspan x="521.5" dy="18.5">不是当前权限或模型证据②</tspan></text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-2037837878-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 187.025639 79.999836 L 187.948722 152.000329" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-