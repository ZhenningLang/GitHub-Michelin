ass="text-bold fill-N1" style="text-anchor:middle;font-size:16px">dl_train.py：可合并全文与句子切分②</text></g><g class="bjU="><g class="shape" ><rect x="439" y="299" width="338" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="608" y="337.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">回答或问题加回答，分词并截断②</text></g><g class="bjY="><g class="shape" ><path d="M 404 505 L 404 440 L 812 440 L 812 505 C 744 491 676 491 608 505 C 540 520 472 520 404 505 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="608" y="473.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">训练序列分类器，all-train 不再保留测试集</text></g><g class="bjc="><g class="shape" ><rect x="807" y="158" width="365" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="989.5" y="196.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">ml_train.py：GPT-2 预测排名四档计数③</text></g><g class="bjg="><g class="shape" ><path d="M 800 359 L 800 294 L 1178 294 L 1178 359 C 1115 345 1052 345 989 359 C 926 374 863 374 800 359 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="989" y="327.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">逻辑回归，多次按标签比例分组验证③</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-2548991170-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 211 80 L 211 154" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2548991170-3488378134)" mask="url(#d2-2548991170)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M