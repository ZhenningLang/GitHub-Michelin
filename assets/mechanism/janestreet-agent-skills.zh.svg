ext-anchor:middle;font-size:16px">0–5 级技能图，每次变动都重画②</text></g><g class="bjU="><g class="shape" ><rect x="12" y="677" width="378" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="201" y="715.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">每条只问一个问题；答错就追问更窄③</text></g><g class="bjY="><g class="shape" ><rect x="190" y="969" width="387" height="82" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="383.5" y="1007.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="383.5" dy="0">两次以上检验且含无提示回忆才升级；</tspan><tspan x="383.5" dy="18.5">突击回测可降级。④</tspan></text></g><g class="bjc="><g class="shape" ><path d="M 276 1277 L 276 1212 L 492 1212 L 492 1277 C 456 1263 420 1263 384 1277 C 348 1292 312 1292 276 1277 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="384" y="1245.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">达标后的综合测验④</text></g><g class="bjg="><g class="shape" ><path d="M 489 878 L 489 813 L 883 813 L 883 878 C 817 864 752 864 686 878 C 620 893 555 893 489 878 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="686" y="846.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">save state 文本块，粘在 resume from: 之后⑤</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-116184816-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 306.028569 79.999796 L 306.942863 144.000408" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-116184816-3488378134)" mask="url(#d2-1