r:middle;font-size:16px">--record 拒收行数据撑不住的通过②</text></g><g class="bjU="><g class="shape" ><rect x="735" y="413" width="429" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="949.5" y="451.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">按 review_mode 跑总监门禁：solo、lean 或 full③</text></g><g class="bjY="><g class="shape" ><rect x="791" y="549" width="318" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="950" y="587.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">内容哈希回执决定哪些要重审③</text></g><g class="bjc="><g class="shape" ><path d="M 110 177 C 110 178 106 179 102 179 C 52 180 12 191 12 205 C 12 220 56 232 113 232 H 495 C 555 232 605 219 605 204 C 605 189 560 177 502 176 C 498 176 494 175 493 174 C 480 159 421 148 352 148 C 307 148 266 153 240 160 C 237 161 232 161 229 161 C 219 160 208 160 196 160 C 151 160 114 167 110 177 Z" stroke="#0D32B2" fill="#FFFFFF" class=" stroke-B1 fill-N7" style="stroke-width:2;" /></g><text x="305.8335" y="211.516" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">钩子：设计文档 40 KB 读取守卫，提交与推送检查④</text></g><g class="bjg="><g class="shape" ><path d="M 242 977 L 242 912 L 650 912 L 650 977 C 582 963 514 963 446 977 C 378 992 310 992 242 977 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="446" y="945.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">交接卡：通过、仍坏、靠猜；尚无人试玩</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-1198471694-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 869 80 L 869 156" stroke="#0D32B2" fill="none" class="c