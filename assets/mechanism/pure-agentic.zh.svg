ize:16px">缺包或 schema 缺失、为空：跳过对应检查②</text></g><g class="bjU="><g class="shape" ><path d="M 274 616 L 274 551 L 660 551 L 660 616 C 596 602 531 602 467 616 C 403 631 338 631 274 616 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="467" y="584.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">context-check 结果，退出 0 不等于全查过</text></g><g class="bjY="><g class="shape" ><path d="M 1362 12 L 1619 12 L 1593 78 L 1336 78 L 1336 78 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="1477.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">UNIFY 记录与关联规格</text></g><g class="bjc="><g class="shape" ><rect x="1329" y="158" width="297" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1477.5" y="196.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">读取基准提交与受影响路径③</text></g><g class="bjg="><g class="shape" ><rect x="1136" y="400" width="339" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1305.5" y="438.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">点名路径：比较基准提交与 HEAD③</text></g><g class="bjk="><g class="shape" ><path d="M 1495 460 L 1495 395 L 1804 395 L 1804 460 C 1753 446 1701 446 1650 460 C 1598 475 1547 475 1495 460 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="1649.5" y="428.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">未解析到路径：警告并退出 0③</text></g><g class="bjEw"><g class="shape" ><path d="M 1140 616 L 1140 551 L 1470 551 L 1470 616 C 1415 602 1360 602 1305 616 C 1250 631 1195 631 1140 616 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="1305" y="584.610964