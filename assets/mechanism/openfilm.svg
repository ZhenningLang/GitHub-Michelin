ght="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="776" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Person edits in Studio, saved as clip overrides③</text></g><g class="bjU="><g class="shape" ><path d="M 1096 414 C 1096 415 1093 416 1090 416 C 1051 417 1021 428 1021 442 C 1021 457 1055 469 1099 469 H 1394 C 1440 469 1478 456 1478 441 C 1478 426 1443 414 1399 413 C 1396 413 1393 412 1392 411 C 1382 396 1336 385 1283 385 C 1248 385 1217 390 1197 397 C 1195 398 1191 398 1189 398 C 1181 397 1173 397 1164 397 C 1127 397 1099 404 1096 414 Z" stroke="#0D32B2" fill="#FFFFFF" class=" stroke-B1 fill-N7" style="stroke-width:2;" /></g><text x="1246.1415" y="448.516" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Agent rewrites film.html with its own file tools</text></g><g class="bjY="><g class="shape" ><rect x="779" y="551" width="457" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1007.5" y="589.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Three-way merge per clip and field; person wins conflicts④</text></g><g class="bjc="><g class="shape" ><path d="M 780 760 L 780 695 L 1235 695 L 1235 760 C 1159 746 1083 746 1008 760 C 932 775 856 775 780 760 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="1007.5" y="728.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">Agent told what was kept; both versions saved in history④</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-1207523803-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 653.0125 306.999961