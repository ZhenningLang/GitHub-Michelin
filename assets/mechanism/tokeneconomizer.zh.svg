" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">按提示数与会话数累计的未用工具②</text></g><g class="bjU="><g class="shape" ><path d="M 651 505 L 651 440 L 995 440 L 995 505 C 938 491 880 491 823 505 C 766 520 708 520 651 505 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="823" y="473.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">空闲窗口后写进 agent 自己的配置②</text></g><g class="bjY="><g class="shape" ><rect x="1015" y="445" width="378" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1204" y="483.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">每次工具调用：循环信号与免费闸门③</text></g><g class="bjc="><g class="shape" ><rect x="1025" y="304" width="358" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1204" y="342.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">包络：正常结束轮次长度的分位数③</text></g><g class="bjg="><g class="shape" ><path d="M 694 771 C 694 772 691 773 688 773 C 648 774 617 785 617 799 C 617 814 652 826 696 826 H 996 C 1043 826 1082 813 1082 798 C 1082 783 1046 771 1001 770 C 998 770 995 769 994 768 C 984 753 937 742 883 742 C 847 742 815 747 795 754 C 793 755 789 755 786 755 C 778 754 770 754 760 754 C 727 754 697 761 694 771 Z" stroke="#0D32B2" fill="#FFFFFF" class=" stroke-B1 fill-N7" style="stroke-width:2;" /></g><text x="847.827" y="805.516" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">在你自己的 agent CLI 上关工具跑判官③④</text></g><g class="bjk="><g class="shape" ><path d="M 452 971 L 452 906 L 830 906 L 830 971 C 767 957 704 957 641 971 C 578 986 515 986 452 971 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="641" y="939.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">提醒一次，再通知人；从不自行停止③</text></g><g class="bjEw"><g class="shape" ><path d="M 850 971 L 850 906 L 1269 906 L 1269 971 C 1199 957 1129 957 1060 971 C 990 986 920 986 850 971 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="1059.5" y="939.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">按缓存计价、含插件自身调用的成本账本④</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-2724183578-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 722.0125 79.999961 L 722.187501 108.000195 S 722.25 118 712.25 118 L 375.75 118 S 365.75 118 365.75 128 L 365.75 154" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2724183578-3488378134)" mask="url(#d2-2724183578)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M 234.5 226 L 234.5 300" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2724183578-3488378134)" mask="url(#d2-2724183578)" /></g><g class="KG4yIC0mZ3Q7IG4zKVswXQ=="><path d="M 234.50463 371.999995 L 234.990741 582.000011" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2724183578-3488378134)" mask="url(#d2-2724183578)" /><text x="234.5" y="484" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">下一会话</text></g><g class="KG4wIC0mZ3Q7IG40KVswXQ=="><path d="M 823.024998 79.999844 L 823.950004 154.000312" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2724183578-3488378134)" mask="url(#d2-2724183578)" /></g><g class="KG40IC0mZ3Q7IG41KVswXQ=="><path d="M 823.50463 225.999995 L 823.990741 436.000011" stroke="#0D32B2" fill="none" class="conn