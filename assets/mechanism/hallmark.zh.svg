参考②</text></g><g class="bjU="><g class="shape" ><rect x="171" y="813" width="277" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="309.5" y="851.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">助手构建页面并记录选择②</text></g><g class="bjY="><g class="shape" ><rect x="468" y="813" width="318" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="627" y="851.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">助手构建八态，不做整页轮换③</text></g><g class="bjc="><g class="shape" ><rect x="312" y="959" width="312" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="468" y="997.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">助手六维自评，低于 3 则修改③</text></g><g class="bjg="><g class="shape" ><path d="M 345 1251 L 345 1186 L 591 1186 L 591 1251 C 550 1237 509 1237 468 1251 C 427 1266 386 1266 345 1251 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="468" y="1219.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">生成产物仍需独立验证</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-2668208906-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 471 80 L 471 144" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2668208906-3488378134)" mask="url(#d2-2668208906)" /></g><g class="KG4xIC0mZ3Q7IG4yKVswXQ=="><path d="M 471.333008 216 L 471.333008 280" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2668208906-3488378134)" mask="url(#d