		.d2-2547002500 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="bjA="><g class="shape" ><path d="M 83 12 L 588 12 L 562 78 L 57 78 L 57 78 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="322.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">默认路线：固定评测、运行配置与最佳参考版本①</text></g><g class="bjE="><g class="shape" ><rect x="93" y="148" width="459" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="322.5" y="186.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">从参考版本提出单个假设与候选；先保护快照①</text></g><g class="bjI="><g class="shape" ><rect x="12" y="294" width="318" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="171" y="332.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">评测完整用例与重复次数矩阵①</text></g><g class="bjM="><g class="shape" ><path d="M 103 505 L 103 440 L 542 440 L 542 505 C 469 491 396 491 323 505 C 249 520 176 520 103 505 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="322.5" y="473.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">严格涨分才保留并登记接纳成绩；否则恢复①</text></g><g class="bjQ="><g class="shape" ><path d="M 642 12 L 1149 12 L 1123 78 L 616 78 L 616 78 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="882.5" y="50.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">OPRO：固定模型及其余框架；只搜索一个指令槽②</text></g><g class="bjU="><g class="shape" ><rect x="704" y="294" width="358" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="883" y="332.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">所有有效测量历史，包含落选候选②</text></g><g class="bjY="><g class="shape" ><rect x="442" y="591" width="338" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="611" y="629.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">每轮独立提案共享同一历史快照②</text></g><g class="bjc="><g class="shape" ><rect x="576" y="742" width="358" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="755" y="780.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">对保留的指令逐一快照并完成测量②</text></g><g class="bjg="><g class="shape" ><path d="M 924 651 L 924 586 L 1444 586 L 1444 651 C 1357 637 1271 637 1184 651 C 1097 666 1011 666 924 651 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="1184" y="619.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">搜索结束：恢复训练最高分快照；同分保留最早版本②</text></g><g class="bjk="><g class="shape" ><path d="M 954 807 L 954 742 L 1413 742 L 1413 807 C 1337 793 1260 793 1184 807 C 1107 822 1031 822 954 807 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="1183.5" y="775.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">可选独立测试：基线与胜出版本；不参与选优②</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-2547002500-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 