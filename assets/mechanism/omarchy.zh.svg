text-anchor:middle;font-size:16px">时间戳命名的迁移，每个用户一份标记③</text></g><g class="bjU="><g class="shape" ><rect x="464" y="622" width="297" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="612.5" y="660.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">校验启动文件后才提示重启②</text></g><g class="bjY="><g class="shape" ><path d="M 962 239 L 1292 239 L 1266 305 L 936 305 L 936 305 Z" stroke="#0D32B2" fill="#DEE1EB" class=" stroke-B1 fill-N5" style="stroke-width:2;" /></g><text x="1114" y="277.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">主题 colors.toml 加各应用模板④</text></g><g class="bjc="><g class="shape" ><rect x="832" y="476" width="350" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1007" y="514.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">克隆来的主题去掉 Lua 与终端配置④</text></g><g class="bjg="><g class="shape" ><rect x="945" y="622" width="338" height="66" stroke="#0D32B2" fill="#F7F8FE" class=" stroke-B1 fill-B6" style="stroke-width:2;" /></g><text x="1114" y="660.5" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">把缺的应用配置渲染进暂存主题④</text></g><g class="bjk="><g class="shape" ><path d="M 505 969 L 505 904 L 864 904 L 864 969 C 804 955 744 955 685 969 C 625 984 565 984 505 969 Z" stroke="#0D32B2" fill="#EDF0FD" class=" stroke-B1 fill-AB4" style="stroke-width:2;" /></g><text x="684.5" y="937.610964" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px">主题统一的 Hyprland 与 Quickshell 桌面</text></g><g class="KG4wIC0mZ3Q7IG4xKVswXQ=="><marker id="mk-d2-3212616843-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 204 5